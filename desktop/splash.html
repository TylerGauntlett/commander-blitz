<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Commander Blitz</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0a16;
        color: #e8e4ff;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      main {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 28px;
        letter-spacing: 0.04em;
        margin: 0 0 12px;
      }
      #status {
        font-size: 18px;
        opacity: 0.8;
      }
      #failure {
        display: none;
        max-width: 960px;
        text-align: left;
      }
      #failure h2 {
        color: #ff9a9a;
        font-size: 18px;
      }
      pre {
        font-size: 12px;
        line-height: 1.4;
        max-height: 50vh;
        overflow: auto;
        background: #171a2b;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Commander Blitz</h1>
        <p id="status" class="pulse">Starting…</p>
        <section id="failure">
          <h2 id="failure-title">The server did not start.</h2>
          <p>The last lines of the server's log, and where the full logs are:</p>
          <pre id="failure-log"></pre>
          <p id="failure-path"></p>
        </section>
      </div>
    </main>
    <script>
      window.setStatus = (text) => {
        document.getElementById("status").textContent = text;
      };
      window.setFailure = (title, tail, logsDir) => {
        const status = document.getElementById("status");
        status.textContent = "Could not start the game.";
        status.classList.remove("pulse");
        document.getElementById("failure-title").textContent = title;
        document.getElementById("failure-log").textContent = tail || "(no output)";
        document.getElementById("failure-path").textContent = `Logs: ${logsDir}`;
        document.getElementById("failure").style.display = "block";
      };
    </script>
  </body>
</html>
