[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automtg"
version = "0.1.0"
description = "Magic: The Gathering Commander board state engine, self-play trainer, and playtest server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.26",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "pytest-xdist>=3.6", "ruff>=0.4", "httpx>=0.27", "httpx2>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/automtg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "slow: long-running simulation tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults
    "RUF012",  # mutable class attrs without ClassVar
    "SIM108",  # ternaries are not always clearer
    # str+Enum is deliberate: these values are serialized to JSON and compared
    # against strings from card files. StrEnum would also change str() output.
    "UP042",
    # Selector/legality checks are long chains of "if this fails, return False".
    # Collapsing the last one into `return not (...)` breaks the pattern.
    "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Scripts prepend src/ to sys.path before importing the package, so their
# imports cannot be at the top of the file.
"scripts/**" = ["E402"]
# The op modules are imported at the bottom on purpose: they call register(),
# which must exist first.
"src/automtg/engine/effects/__init__.py" = ["E402"]
# `player_statics` imports this module; the re-export of what moved there has
# to come after everything it needs, at the bottom.
"src/automtg/engine/characteristics.py" = ["E402"]
