<style>
  /*
    `theme.css` sets `height: 100%` on `html, body, #root`. Storybook's canvas
    root is `#storybook-root`, so without this the chain breaks at the last
    link: `.table { height: 100% }` resolves against an auto-height parent,
    `useZoomFit` measures a table 0px tall, and every card in every board story
    clamps to the 52px floor.
  */
  #storybook-root {
    height: 100%;
  }

  /*
    Framer Motion animates in JS and is held still by `MotionConfig` in
    preview.tsx. This catches the CSS half -- the keyframe animations in
    `ui.css` -- which no amount of MotionConfig reaches.
  */
  *,
  *::before,
  *::after {
    /* biome-ignore lint/complexity/noImportantStyles: this has to beat every component's own animation, whatever its specificity -- that is the whole job. */
    animation-duration: 0.001ms !important;
    /* biome-ignore lint/complexity/noImportantStyles: as above. */
    animation-delay: 0ms !important;
    /* biome-ignore lint/complexity/noImportantStyles: as above, for transitions. */
    transition-duration: 0.001ms !important;
    /* biome-ignore lint/complexity/noImportantStyles: as above. */
    transition-delay: 0ms !important;
  }
</style>
