<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Pod Lobby (menu 03)</title>
<style>
/* ============================================================================
   POD LOBBY -- a pre-game screen is a lobby, and a lobby is about who is there
   ----------------------------------------------------------------------------
   THESIS. Commander is a four-player format and the current menu renders the
   other three players as the integer 2. Everything on this screen is a seat:
   yours at the near edge, theirs across the table, and the whole setup is the
   act of filling them.

   THE BIG IDEA, stealable on its own: DIFFICULTY AS OPPONENTS, NOT AS A SLIDER.
   Each AI seat shows a named persona -- a portrait, a one-line doctrine, and the
   capability lamps that tier lights. You do not set a difficulty; you choose who
   you are playing against, per seat. This is not a flourish: roadmap.md:58-59
   asks in so many words for "subagents writing persona documents for each
   supported difficulty ... general strategies, expected behavior", and this
   screen is that document rendered. It is also the only one of the five where a
   mixed pod -- one Apprentice, one Archmage -- is expressible without inventing
   a second control, and a mixed pod is the single most useful thing a solo
   playtest tool can offer: one opponent to practise against and one to lose to.

   SECOND IDEA: THE DECK DRAWER. Choosing your deck is a thing you do once, so it
   is behind a drawer rather than occupying the screen forever. What occupies the
   screen forever is the pod.

   THIRD: THE DOSSIER IS A SLIDE-OVER, NOT A MODAL. Reading about a deck should
   not hide the table you are about to sit at, so it comes in from the right and
   leaves the pod visible beside it.

   THE TRADE. It invents seat semantics the engine does not have yet -- the
   server takes one `agent` per seat (SeatConfig in frontend/src/api/types.ts),
   so per-seat difficulty is expressible, but per-seat *personas* are a promise
   the CPU work has to keep. This mockup is the most opinionated about the
   roadmap and therefore the most able to be wrong about it.

   No build, no server, no network. Local ../art/ only.
   ========================================================================== */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-ink:#1a1a1a;

  --danger:#ff5c5c; --gold:#ffd479;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  --card-w:clamp(128px, 18vh, 176px);
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

.f-W { --f-hi:#f6eed4; --f-lo:#b9ad86; --fb:#d8cfa8; }
.f-U { --f-hi:#a9d2ec; --f-lo:#2f6a95; --fb:#4a86b8; }
.f-B { --f-hi:#b6aeac; --f-lo:#2e282b; --fb:#4c4550; }
.f-R { --f-hi:#f0a48b; --f-lo:#a4432f; --fb:#b8624a; }
.f-G { --f-hi:#a9cfa2; --f-lo:#2f6b41; --fb:#4e8a5c; }
.f-C { --f-hi:#d3d6da; --f-lo:#787e86; --fb:#8a8f96; }
.f-gold { --f-hi:#eed99c; --f-lo:#9c7a24; --fb:#b99a45; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:
    radial-gradient(66% 46% at 50% 30%, rgba(143,127,232,.15) 0%, transparent 64%),
    radial-gradient(70% 50% at 50% 104%, rgba(90,190,220,.08) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 66%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
.tabular { font-variant-numeric:tabular-nums; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--edge); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* Shell ------------------------------------------------------------------ */

.gate { position:relative; display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; overflow:hidden; }

.head {
  display:flex; align-items:center; gap:14px; padding:13px 24px 12px;
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg, rgba(143,127,232,.12), transparent);
}
.head__mark { font-size:19px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
.head__sub { font-size:11.5px; color:var(--text-faint); letter-spacing:.04em; }
.head__spacer { flex:1; }
.head__ver { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }

/* The table -------------------------------------------------------------- */

.table {
  position:relative; display:grid; grid-template-rows:auto minmax(0,1fr); gap:10px;
  min-height:0; padding:16px 24px 0;
}
.table__label {
  display:flex; align-items:center; gap:10px;
  font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint);
}
.table__hint { margin-left:auto; text-transform:none; letter-spacing:.02em; font-size:11px; font-weight:600; }

/* The felt. Without it the seats sit in a band at the top and two thirds of the
   screen is dead -- which is the exact complaint mockups/README.md makes about
   the board, and it would be embarrassing to reproduce it here. The ellipse is
   the near half of a table: its far edge runs behind the seats, its near edge
   runs off the bottom of the stage and into the strip where you are sitting. */
.felt { position:relative; min-height:0; overflow:hidden; display:grid; place-items:center; }
.felt__ring {
  position:absolute; left:50%; bottom:-46%; transform:translateX(-50%);
  width:min(1320px, 94%); height:156%; pointer-events:none;
  border:1px solid var(--edge); border-bottom:0; border-radius:50% 50% 0 0 / 62% 62% 0 0;
  background:
    radial-gradient(120% 96% at 50% 100%, rgba(143,127,232,.2) 0%, transparent 66%),
    linear-gradient(180deg, rgba(29,27,56,.7), rgba(13,12,28,.2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.opps {
  position:relative; z-index:2; display:flex; align-items:center; justify-content:center;
  gap:20px; max-height:100%; padding:6px 0;
}

/* A persona. Portrait, doctrine, lamps -- the difficulty ladder wearing a face. */
.who {
  position:relative; width:clamp(240px, 22vw, 372px); min-width:0; overflow:hidden;
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto;
  border:1px solid var(--edge); border-radius:13px;
  background:var(--pane-bg); box-shadow:var(--pane-shadow);
}
.who--sunk { margin-top:46px; }        /* the arc: middle seat sits highest */
.who__art { display:block; width:100%; height:clamp(104px, 18vh, 230px); object-fit:cover; object-position:50% 24%; }
.who__scrim {
  position:absolute; left:0; right:0; top:0; height:clamp(104px, 18vh, 230px); pointer-events:none;
  background:linear-gradient(0deg, rgba(13,12,28,.95) 0%, rgba(13,12,28,.35) 55%, rgba(13,12,28,0) 100%);
}
.who__seat {
  position:absolute; top:8px; left:10px; z-index:2;
  font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:rgba(255,255,255,.82); text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.who__drop {
  position:absolute; top:6px; right:6px; z-index:2; width:24px; height:24px; border-radius:999px;
  border:1px solid rgba(255,255,255,.28); background:rgba(0,0,0,.5); color:rgba(255,255,255,.75); font-size:12px;
}
.who__drop:hover { border-color:var(--danger); color:var(--danger); }

.who__deck { padding:10px 12px 0; }
.who__deckn { font-size:12.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.who__meta { display:flex; align-items:center; gap:5px; margin-top:5px; }

.who__persona { padding:11px 12px 0; min-height:0; }
.who__tier { display:flex; align-items:center; gap:8px; }
.who__tiern { font-size:15px; font-weight:800; }
.who__tag { font-size:10.5px; color:var(--text-faint); }
.who__line { margin:7px 0 0; font-size:11.5px; line-height:1.5; color:var(--text-dim); }

.who__caps { display:grid; gap:4px; margin-top:10px; }
.cap { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--text-faint); }
.cap--on { color:var(--text-dim); }
.cap__lamp { width:8px; height:8px; border-radius:999px; border:1px solid var(--edge-hi); flex:none; }
.cap--on .cap__lamp { background:var(--gold); border-color:var(--gold); }

.who__foot { display:flex; gap:6px; padding:11px 12px 12px; }
.who__foot .btn { flex:1; text-align:center; }

/* An empty chair. */
.chair {
  width:clamp(160px, 14vw, 240px); display:grid; justify-items:center; align-content:center; gap:7px;
  padding:34px 12px; border:1px dashed var(--edge-hi); border-radius:13px;
  background:rgba(13,12,28,.4); color:var(--text-dim); font-size:12px; font-weight:650; text-align:center;
}
.chair:hover { border-color:var(--gold); color:var(--text); }
.chair__plus { font-size:24px; line-height:1; color:var(--text-faint); }
.chair__sub { font-size:10.5px; font-weight:500; color:var(--text-faint); line-height:1.4; }
/* Two ways to fill a chair, offered together and never behind a mode switch:
   a CPU, or a person with the code. That choice IS the multiplayer feature. */
.chair__acts { display:grid; gap:6px; width:100%; margin-top:6px; }

.who--open { border-style:dashed; border-color:var(--edge-hi); }
.who--human { border-color:rgba(92,224,138,.4); }
.who__art--none {
  background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152;
}
.who__deckn--sealed { color:var(--text-faint); font-style:italic; font-weight:600; }

.mine__room { display:flex; align-items:center; gap:8px; }
.mine__code { font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--astral-hi); }
.toggle {
  display:flex; align-items:center; gap:7px; padding:8px 11px;
  border:1px solid var(--edge); border-radius:8px; background:var(--pane-well);
  color:var(--text-dim); font-size:11.5px; font-weight:600;
}
.toggle:hover { border-color:var(--edge-hi); color:var(--text); }
.toggle--on { border-color:var(--gold); color:var(--text); }
.toggle__box {
  width:14px; height:14px; flex:none; display:grid; place-items:center; border-radius:4px;
  border:1px solid var(--edge-hi); font-size:9px; font-style:normal; color:#241a04;
}
.toggle--on .toggle__box { background:var(--gold); border-color:var(--gold); }

/* Your edge of the table ------------------------------------------------- */

.mine {
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:14px 24px 18px;
  border-top:1px solid var(--edge); background:rgba(11,10,22,.78);
}
.mine__seat {
  display:grid; grid-template-columns:60px minmax(0,1fr); gap:11px; align-items:center;
  padding:9px 13px 9px 9px; border:1px solid rgba(255,212,121,.4); border-radius:11px;
  background:var(--pane-well); min-width:270px;
}
.mine__art { width:60px; height:60px; border-radius:8px; object-fit:cover; object-position:50% 26%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.5); }
.mine__who { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.mine__n { font-size:14px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mine__meta { display:flex; align-items:center; gap:5px; margin-top:5px; }
.mine__spacer { flex:1; }
.mine__why { flex:none; max-width:24ch; font-size:10.5px; line-height:1.45; color:var(--text-faint); }

.play {
  padding:15px 30px; border-radius:11px; flex:none;
  background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05;
  font-size:15px; font-weight:800; letter-spacing:.04em;
  box-shadow:0 4px 0 #7d5310, 0 0 26px rgba(224,166,63,.28);
}
.play:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 26px rgba(224,166,63,.28); }
.play:disabled { opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #4a3a18; }

/* The deck drawer -------------------------------------------------------- */

.drawer {
  position:absolute; z-index:400; left:0; top:0; bottom:0; width:min(400px, 92vw);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0;
  border-right:1px solid var(--edge); background:linear-gradient(180deg,#1b1936,#0d0c1c);
  box-shadow:26px 0 60px rgba(0,0,0,.6);
}
.drawer__head { display:flex; align-items:center; gap:10px; padding:15px 16px 13px; border-bottom:1px solid var(--edge); }
.drawer__t { font-size:15px; font-weight:800; }
.drawer__x { margin-left:auto; width:27px; height:27px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); }
.drawer__x:hover { border-color:var(--edge-hi); color:var(--text); }
.drawer__body { min-height:0; overflow:auto; padding:12px; }
.drawer__foot { padding:12px; border-top:1px solid var(--edge); }

.row {
  display:grid; grid-template-columns:56px minmax(0,1fr); gap:11px; width:100%; align-items:center;
  padding:9px; margin-bottom:7px; text-align:left;
  border:1px solid transparent; border-radius:10px; background:var(--pane-well); color:var(--text);
}
.row:hover { border-color:var(--edge-hi); }
.row--on { border-color:var(--gold); box-shadow:0 0 0 1px rgba(255,212,121,.4); }
.row__art { width:56px; height:56px; border-radius:7px; object-fit:cover; object-position:50% 26%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.5); }
.row__main { min-width:0; }
.row__n { display:block; font-size:13.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row__s { display:block; font-size:10.5px; color:var(--text-faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row__meta { display:flex; align-items:center; gap:5px; margin-top:5px; }
.row__more { margin-left:auto; font-size:10.5px; color:var(--text-faint); text-decoration:underline; }

.group__label { padding:6px 4px 8px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }

.imp { padding:11px; border:1px dashed var(--edge-hi); border-radius:10px; background:rgba(13,12,28,.4); }
.imp__field { display:flex; gap:6px; margin-top:8px; }
.imp__input { flex:1; min-width:0; padding:8px 10px; border:1px solid var(--edge); border-radius:7px; background:rgba(8,7,18,.8); color:var(--text); font-size:12px; }
.imp__input::placeholder { color:var(--text-faint); }
.imp__input:focus { outline:none; border-color:var(--gold); }
.imp__note { margin:8px 0 0; font-size:10.5px; line-height:1.45; color:var(--text-faint); }
.imp__note--err { color:var(--danger); }
.imp__note--busy { color:var(--astral-hi); }

/* The slide-over dossier ------------------------------------------------- */

.veil { position:fixed; inset:0; z-index:450; background:rgba(6,5,16,.6); }
.over {
  position:fixed; z-index:460; right:0; top:0; bottom:0; width:min(660px, 96vw);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0;
  border-left:1px solid var(--edge); background:linear-gradient(180deg,#1b1936,#0d0c1c);
  box-shadow:-26px 0 70px rgba(0,0,0,.7);
}
.over__head { display:flex; align-items:center; gap:10px; padding:15px 18px 13px; border-bottom:1px solid var(--edge); }
.over__n { font-size:18px; font-weight:800; min-width:0; }
.over__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); flex:none; }
.over__x:hover { border-color:var(--edge-hi); color:var(--text); }
.over__body { min-height:0; overflow:auto; padding:16px 18px; }
.over__foot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--edge); }
.over__foot .play { padding:11px 22px; font-size:14px; }

.dos__top { display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; }
.dos__card { display:grid; gap:7px; justify-items:center; align-content:start; }
.dos__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.dos__h { margin:16px 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.dos__h:first-child { margin-top:0; }
.dos__p { margin:0; font-size:12.5px; line-height:1.6; color:var(--text-dim); }
.dos__tags { display:flex; flex-wrap:wrap; gap:6px; }
.dos__bars { display:grid; gap:5px; margin-top:10px; }
.dos__sigs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:9px; }
.sig { display:grid; grid-template-columns:56px minmax(0,1fr); gap:9px; align-items:center; }
.sig__art { width:56px; height:44px; border-radius:5px; object-fit:cover; object-position:50% 30%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.sig__n { font-size:11.5px; font-weight:700; }
.sig__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); margin-top:2px; }

/* Shared vocabulary ------------------------------------------------------ */

.btn { padding:8px 13px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(20,19,40,.6); color:var(--text); font-size:12px; font-weight:650; white-space:nowrap; }
.btn:hover { border-color:var(--gold); }
.btn--wide { width:100%; padding:11px; }
.ghost { padding:9px 14px; border-radius:7px; color:var(--text-faint); font-size:13px; font-weight:500; }
.ghost:hover { color:var(--text); }

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 4px; border-radius:999px;
  font-size:10px; font-weight:800; font-style:normal; color:var(--mana-ink);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W { background:var(--mana-W); } .pip--U { background:var(--mana-U); }
.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }

.chip { padding:3px 8px; border:1px solid var(--edge-hi); border-radius:999px; font-size:10px; font-weight:650; color:var(--text-dim); background:rgba(9,8,20,.5); }
.count { font-size:10.5px; color:var(--text-faint); }
.badge { padding:2px 7px; border:1px dashed var(--edge-hi); border-radius:999px; font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); }
.badge--partial { border-style:solid; border-color:rgba(255,212,121,.55); color:var(--gold); }

.bar { display:flex; align-items:center; gap:7px; }
.bar__label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); min-width:88px; }
.bar__track { display:flex; gap:2px; }
.bar__seg { width:13px; height:5px; border-radius:2px; border:1px solid var(--edge-hi); background:transparent; }
.bar__seg--on { background:var(--text-dim); border-color:var(--text-dim); }

.face {
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; overflow:hidden;
  border-radius:var(--card-r); border:2px solid var(--fb);
  background:linear-gradient(160deg, var(--f-hi), var(--f-lo));
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.35);
  color:#fff; flex:none;
}
.face__art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.face__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152; }
.face__head, .face__foot { position:relative; z-index:2; padding:6px 7px; }
.face__head { background:linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.57) 55%, rgba(0,0,0,0)); }
.face__foot { background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.71) 58%, rgba(0,0,0,0)); }
.face__title { display:flex; align-items:flex-start; gap:5px; }
.face__name { flex:1; font-size:11px; font-weight:750; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.85); }
.face__cost { display:flex; gap:2px; flex:none; }
.face__type { margin-top:3px; font-size:8.5px; color:rgba(255,255,255,.86); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__rules { margin:0 0 5px; font-size:8.5px; line-height:1.38; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.85); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.face__base { display:flex; align-items:flex-end; gap:6px; }
.face__kw { flex:1; font-size:8.5px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__pt { font-size:12px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.9); }

.curve__cols { display:flex; align-items:flex-end; gap:4px; height:54px; }
.curve__bar { flex:1; background:var(--text-faint); border-radius:2px 2px 0 0; min-height:2px; }
.curve__axis { display:flex; gap:4px; margin-top:4px; }

      { n: "Mardu Ascendancy", art: "mardu-ascendancy", why: "A second mobilize, on every nontoken attacker." },

const CUSTOM = {
  placeholder: "https://moxfield.com/decks/...",
  hint: "Paste a public Moxfield deck link.",
  fake: {
    id: "custom-vorel", name: "Vorel of the Hull Clade", short: "Vorel",
    ci: ["G", "U"], guild: "Simic", cards: 100, lands: 36,
    cmd: { n: "Vorel of the Hull Clade", cost: "1GU", tl: "Legendary Creature — Human Merfolk",
      t: "creature", f: "gold", pt: "1/4",
      rules: "{1}{G}{U}, {T}: Double the number of each kind of counter on target artifact, creature, or land you control.",
      art: "vorel-of-the-hull-clade", artist: "Mike Bierek" },
    tags: ["Counters", "Ramp", "Combo"],
    blurb: "Imported from Moxfield. Simic +1/+1 counters, doubled.",
    strategy: "Imported decks have no editorial write-up — this is whatever you built.",
    bars: { speed: 2, complexity: 4, interaction: 2, resilience: 2, pilot: 4 },
    curve: [8, 15, 16, 12, 6, 4, 3],
    signature: [], engine: "partial", unsupported: 12, swaps: 0, swapNote: null,
  },
  errors: {
    badUrl: "That is not a Moxfield deck link.",
    private: "That deck is private. Set it to public and try again.",
  },
};

const OPPONENTS = [1, 2, 3];

/* Rooms.
 *
 * docs/roadmap.md's backlog asks for "multiplayer online support using a basic
 * system of rooms and room codes". It does not need a second screen, and giving
 * it one is how products end up with two menus. It needs one new idea: a seat
 * has a KIND -- cpu, open (holding the code, waiting for a person), or human.
 * All-CPU, all-human and mixed pods are then the same screen with different
 * seats in it, and "fill empty chairs with CPU" is both the partial-pod case
 * and backfill-on-disconnect.
 */
const ROOM = {
  code: "GYRE-8412",
  // Canned. Opening a chair invites one scripted player who arrives and then
  // locks in; there is no network in a mockup and there never will be.
  guest: { name: "Priya", deckId: "edgar" },
  joinMs: 1200,
  readyMs: 2600,
};

/* Primitives (shared with the other four menu mockups) ------------------- */

const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (slug) => "../art/" + slug + ".jpg";

function pips(cost) {
  if (!cost) return "";
  const out = []; let num = "";
  for (const ch of String(cost)) {
    if (ch >= "0" && ch <= "9") { num += ch; continue; }
    if (num) { out.push(`<i class="pip pip--C">${num}</i>`); num = ""; }
    out.push(`<i class="pip pip--${ch}">${ch}</i>`);
  }
  if (num) out.push(`<i class="pip pip--C">${num}</i>`);
  return out.join("");
}
const ciPips = (ci) => ci.map((c) => `<i class="pip pip--${c}">${c}</i>`).join("");

function bar(label, value) {
  let segs = "";
  for (let i = 1; i <= 4; i += 1) segs += `<i class="bar__seg${i <= value ? " bar__seg--on" : ""}"></i>`;
  return `<div class="bar"><span class="bar__label">${esc(label)}</span><span class="bar__track">${segs}</span></div>`;
}
const bars = (b) => BAR_LABELS.map(([k, l]) => bar(l, b[k])).join("");
const tierOf = (id) => DIFFICULTY.find((d) => d.id === id);
const subtitle = (d) => (d.cmd.n === d.name ? `${d.guild} · ${d.tags[0].toLowerCase()}` : d.cmd.n);

/** The capability list, written out. This is the persona's job: the ladder is
 *  a promise about behaviour, so the seat states the behaviour. */
const capList = (caps) => `<div class="who__caps">${CAPS.map((c) => `
  <div class="cap${caps.includes(c.id) ? " cap--on" : ""}"><i class="cap__lamp"></i>${esc(c.n)}</div>`).join("")}</div>`;

function face(c) {
  const media = c.art ? `<img class="face__art" src="${artUrl(c.art)}" alt="">` : `<div class="face__art face__art--none"></div>`;
  return `<div class="face f-${c.f || "C"}">
    ${media}
    <div class="face__head">
      <div class="face__title"><span class="face__name">${esc(c.n)}</span><span class="face__cost">${pips(c.cost)}</span></div>
      <div class="face__type">${esc(c.tl)}</div>
    </div>
    <div class="face__foot">
      ${c.rules ? `<p class="face__rules">${esc(c.rules)}</p>` : ""}
      <div class="face__base"><span class="face__kw">${esc(c.kw || "")}</span>${c.pt ? `<span class="face__pt tabular">${c.pt}</span>` : ""}</div>
    </div>
  </div>`;
}

function curve(values) {
  if (!values) return `<div class="curve__none">No deck list yet — the curve arrives with engine support for these cards.</div>`;
  const max = Math.max(...values);
  const label = (i) => `${i + 1}${i === 6 ? "+" : ""}`;
  const cols = values.map((v, i) => `<span class="curve__bar" style="height:${Math.round((v / max) * 100)}%" title="${v} cards at ${label(i)} mana"></span>`).join("");
  const axis = values.map((v, i) => `<span class="curve__n tabular">${label(i)}</span>`).join("");
  return `<div class="curve"><div class="curve__cols">${cols}</div><div class="curve__axis">${axis}</div></div>`;
}

function engineBadge(deck) {
  if (deck.engine === "preview") return `<span class="badge">Preview</span>`;
  if (deck.engine === "partial") return `<span class="badge badge--partial">${deck.unsupported} unsupported</span>`;
  return "";
}

/* State ------------------------------------------------------------------ */

const state = {
  deckId: "aesi",
  // Per seat, which is the point. `kind` carries multiplayer; `tier` carries
  // difficulty; a pod is any mixture of both.
  seats: [{ kind: "cpu", tier: "apprentice" }, { kind: "cpu", tier: "duelist" }],
  fillCpu: true,
  difficulty: "apprentice",
  open: null,
  drawer: false,
  imp: { status: "idle", url: "", msg: "" },
  custom: null,
  starting: false,
};

const allDecks = () => (state.custom ? PRECONS.concat([state.custom]) : PRECONS.slice());
const deckById = (id) => allDecks().find((d) => d.id === id) || null;
const selected = () => deckById(state.deckId);

/* Seats ------------------------------------------------------------------ */

let joinToken = 0;

const podSize = () => state.seats.length + 1;
const openSeats = () => state.seats.filter((s) => s.kind === "open").length;
const roomLive = () => state.seats.some((s) => s.kind !== "cpu");
const filledSeats = () => podSize() - openSeats();
const canStart = () => openSeats() === 0 || state.fillCpu;
/** A CPU seat follows the pod's tier unless it has been given its own. */
const seatTier = (i) => tierOf(state.seats[i].tier || state.difficulty);

function setSeatCount(n) {
  while (state.seats.length > n) state.seats.pop();
  while (state.seats.length < n) state.seats.push({ kind: "cpu" });
}

/** Flip a chair between a CPU and an open seat holding the room code. Opening
 *  one runs the canned join: a person arrives, then locks their deck in. */
function toggleSeat(i) {
  if (state.seats[i].kind === "cpu") {
    state.seats[i] = { kind: "open" };
    const token = ++joinToken;
    setTimeout(() => {
      if (token !== joinToken || !state.seats[i] || state.seats[i].kind !== "open") return;
      state.seats[i] = { kind: "human", name: ROOM.guest.name, deckId: ROOM.guest.deckId, ready: false };
      render();
      setTimeout(() => {
        if (token !== joinToken || !state.seats[i] || state.seats[i].kind !== "human") return;
        state.seats[i].ready = true;
        render();
      }, ROOM.readyMs - ROOM.joinMs);
    }, ROOM.joinMs);
  } else {
    state.seats[i] = { kind: "cpu" };
  }
}

/** What a seat is holding, or null when it is not knowable yet.
 *
 *  CPU opponents cycle through the other decks, exactly as NewGameScreen.tsx
 *  :44-46 really does -- so the seats are reporting behaviour, not inventing
 *  it. Preview decks are excluded: a deck the engine cannot deal cannot be
 *  dealt to an opponent either.
 *
 *  A HUMAN's deck is sealed until they lock in. Reading a list before the game
 *  is scouting, and scouting before mulligans is what a lobby hides. */
function seatDeck(i) {
  const s = state.seats[i];
  if (s.kind === "open") return null;
  if (s.kind === "human") return s.ready ? deckById(s.deckId) : null;
  // Skip decks already spoken for -- yours, and any a joined player locked in.
  // Falling back twice is not defensive coding, it is the real situation: with
  // two playable decks and three opponents a duplicate is unavoidable, and
  // docs/playtest-feedback-01.md:202 has been saying so for three cycles.
  const taken = new Set([state.deckId, ...state.seats.filter((x) => x.kind === "human" && x.ready).map((x) => x.deckId)]);
  const live = allDecks().filter((d) => d.engine !== "preview");
  const pool = live.filter((d) => !taken.has(d.id))
    || [];
  const fallback = live.filter((d) => d.id !== state.deckId);
  const chosen = pool.length ? pool : (fallback.length ? fallback : live);
  return chosen.length ? chosen[i % chosen.length] : allDecks()[0];
}


/** The second line of a seat chip. The sealed/locked-in state has to be visible
 *  in every mockup, not only the ones with room for a paragraph -- it is a rule
 *  about what you are allowed to know, and a rule nobody can see is not a rule. */
function seatSub(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  if (s.kind === "cpu") return d ? d.short : "—";
  if (s.kind === "open") return "invite";
  return s.ready ? `${d.short} · locked in` : "choosing a deck…";
}

/** The two lines a seat shows, whatever the skin around it. */
function seatLabel(i) {
  const s = state.seats[i];
  if (s.kind === "open") return { title: "Open chair", sub: "Waiting for a player" };
  if (s.kind === "human") return { title: s.name, sub: s.ready ? "Locked in" : "Choosing a deck…" };
  const t = seatTier(i);
  return { title: t.n, sub: t.tag };
}

function playLabel(idle) {
  if (state.starting) return "Shuffling…";
  if (!roomLive()) return idle;
  if (!canStart()) return `Waiting · ${filledSeats()} of ${podSize()}`;
  return `Start · ${filledSeats()} of ${podSize()} seats`;
}


/* Views ------------------------------------------------------------------ */

function who(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  const n = state.seats.length;
  const arc = n === 3 && i !== 1 ? " who--sunk" : "";

  // The portrait is the seat's identity. An empty chair and a player who has not
  // locked in have nothing to show, so they get the hatch plate cards.css draws
  // for a card with no printing -- same fact, same picture.
  const portrait = d
    ? `<img class="who__art" src="${artUrl(d.cmd.art)}" alt="">`
    : `<div class="who__art who__art--none"></div>`;

  const deckBlock = d
    ? `<div class="who__deckn">${esc(d.name)}</div>
       <div class="who__meta">${ciPips(d.ci)}<span class="count tabular">${d.cards}</span>${engineBadge(d)}</div>`
    : s.kind === "human"
      ? `<div class="who__deckn who__deckn--sealed">Deck sealed</div>
         <div class="who__meta"><span class="count">Readable once they lock in</span></div>`
      : `<div class="who__deckn who__deckn--sealed">No deck yet</div>
         <div class="who__meta"><span class="count">Room ${ROOM.code}</span></div>`;

  // A CPU seat is a persona; a human seat is a person. Same card, different body.
  const body = s.kind === "cpu"
    ? (() => {
        const tier = seatTier(i);
        return `<div class="who__tier"><span class="who__tiern">${esc(tier.n)}</span><span class="who__tag">${esc(tier.tag)}</span></div>
          <p class="who__line">${esc(tier.line)}</p>
          ${capList(tier.caps)}`;
      })()
    : s.kind === "open"
      ? `<div class="who__tier"><span class="who__tiern">Open chair</span></div>
         <p class="who__line">Anyone with the room code can take this seat. Until somebody does, a CPU will fill it if you let it.</p>`
      : `<div class="who__tier"><span class="who__tiern">${esc(s.name)}</span><span class="who__tag">${s.ready ? "locked in" : "still choosing"}</span></div>
         <p class="who__line">${s.ready
            ? "Locked in. Their list is readable now — before this, it was not."
            : "Joined and picking a deck. Their list stays sealed until they lock it in, so nobody can scout the pod."}</p>`;

  const foot = s.kind === "cpu"
    ? `<button class="btn" data-act="seat-tier" data-i="${i}" data-dir="-1">◂</button>
       <button class="btn" data-act="seat-tier" data-i="${i}" data-dir="1">Tougher ▸</button>
       <button class="btn" data-act="seat-kind" data-i="${i}" title="Open this chair to a player">Invite</button>`
    : `<button class="btn" data-act="seat-kind" data-i="${i}">Put a CPU here</button>`;

  return `<section class="who who--${s.kind}${arc}">
    <div style="position:relative">
      ${portrait}
      <div class="who__scrim"></div>
      <span class="who__seat">Seat ${i + 2} · ${s.kind === "cpu" ? "CPU" : s.kind === "open" ? "open" : "player"}</span>
      ${n > 1 ? `<button class="who__drop" data-act="seats" data-n="${n - 1}" title="Empty this chair">✕</button>` : ""}
    </div>
    <div class="who__deck">${deckBlock}</div>
    <div class="who__persona">${body}</div>
    <div class="who__foot">${foot}</div>
  </section>`;
}

function pod() {
  const n = state.seats.length;
  const seats = state.seats.map((_, i) => who(i));
  if (n < 3) {
    seats.push(`<div class="chair">
      <span class="chair__plus">+</span>
      <span>Sit someone down</span>
      <span class="chair__sub">Up to three opponents</span>
      <span class="chair__acts">
        <button class="btn" data-act="seats" data-n="${n + 1}" data-testid="opponents-${n + 1}">Add a CPU</button>
        <button class="btn" data-act="seats-open" data-n="${n + 1}">Open a chair</button>
      </span>
    </div>`);
  }
  return `<div class="opps">${seats.join("")}</div>`;
}

function drawer() {
  if (!state.drawer) return "";
  const { status, msg } = state.imp;
  let note = `<p class="imp__note">${esc(CUSTOM.hint)}</p>`;
  if (status === "fetching") note = `<p class="imp__note imp__note--busy">Reading the list…</p>`;
  if (status === "error") note = `<p class="imp__note imp__note--err">${esc(msg)}</p>`;
  if (status === "ready") note = `<p class="imp__note">Imported. ${CUSTOM.fake.unsupported} cards are not in the engine yet and were left out.</p>`;

  const row = (deck) => `<button class="row${deck.id === state.deckId ? " row--on" : ""}" data-act="pick" data-id="${deck.id}" data-testid="deck-${deck.id}">
    <img class="row__art" src="${artUrl(deck.cmd.art)}" alt="">
    <span class="row__main">
      <span class="row__n">${esc(deck.name)}</span>
      <span class="row__s">${esc(subtitle(deck))}</span>
      <span class="row__meta">${ciPips(deck.ci)}<span class="count tabular">${deck.cards}</span>${engineBadge(deck)}
        <span class="row__more" data-act="open" data-id="${deck.id}">details</span></span>
    </span>
  </button>`;

  return `<aside class="drawer" role="dialog" aria-label="Choose your deck">
    <div class="drawer__head">
      <span class="drawer__t">Your deck</span>
      <button class="drawer__x" data-act="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer__body">
      <div class="group__label">Precons</div>
      ${PRECONS.map(row).join("")}
      <div class="group__label">Custom</div>
      ${state.custom ? row(state.custom) : ""}
      <div class="imp">
        <div class="group__label" style="padding:0">Import from Moxfield</div>
        <div class="imp__field">
          <input class="imp__input" id="mox" type="text" value="${esc(state.imp.url)}"
                 placeholder="${esc(CUSTOM.placeholder)}" spellcheck="false" aria-label="Moxfield deck link">
          <button class="btn" data-act="import">Import</button>
        </div>
        ${note}
      </div>
    </div>
    <div class="drawer__foot">
      <button class="btn btn--wide" data-act="drawer-close">Take my seat</button>
    </div>
  </aside>`;
}

function over() {
  if (!state.open) return "";
  const d = deckById(state.open);
  if (!d) return "";
  const sigs = d.signature.length
    ? `<div class="dos__sigs">${d.signature.map((s) => `<div class="sig">
        <img class="sig__art" src="${artUrl(s.art)}" alt="">
        <div><div class="sig__n">${esc(s.n)}</div><div class="sig__why">${esc(s.why)}</div></div>
      </div>`).join("")}</div>`
    : `<p class="dos__p">An imported deck brings no editorial notes with it.</p>`;
  const honesty = d.engine === "preview"
    ? `<div class="note">Preview. These cards are not in the engine yet, so this deck cannot be dealt. It is here because the menu has to be able to show it before "All Card Support" lands.</div>`
    : d.engine === "partial"
      ? `<div class="note">${d.unsupported} of the imported cards use rules the engine does not implement and were dropped from the list.</div>`
      : `<div class="note">${esc(d.swapNote)}</div>`;

  return `<div class="veil" data-act="close"></div>
  <aside class="over" role="dialog" aria-modal="true" aria-label="${esc(d.name)}">
    <div class="over__head">
      <span class="over__n">${esc(d.name)}</span>
      ${ciPips(d.ci)}
      <span class="count tabular">${d.cards} cards</span>
      ${engineBadge(d)}
      <button class="over__x" data-act="close" aria-label="Close">✕</button>
    </div>
    <div class="over__body">
      <div class="dos__top">
        <div class="dos__card">
          ${face(d.cmd)}
          <div class="dos__artist">Art: ${esc(d.cmd.artist)}</div>
        </div>
        <div>
          <h3 class="dos__h">The deck</h3>
          <p class="dos__p">${esc(d.blurb)}</p>
          <h3 class="dos__h">Playstyle</h3>
          <div class="dos__tags">${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
          <div class="dos__bars">${bars(d.bars)}</div>
        </div>
      </div>
      <h3 class="dos__h">How it plays</h3>
      <p class="dos__p">${esc(d.strategy)}</p>
      <h3 class="dos__h">Cards that define it</h3>
      ${sigs}
      <h3 class="dos__h">Mana curve</h3>
      ${curve(d.curve)}
      ${honesty}
    </div>
    <div class="over__foot">
      <button class="play" data-act="pick-play" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>Play this deck</button>
      <button class="ghost" data-act="close">Close</button>
    </div>
  </aside>`;
}

function mine() {
  const d = selected();
  const blocked = !d || d.engine === "preview" || !canStart();
  return `<div class="mine">
    <div class="mine__seat">
      <img class="mine__art" src="${d ? artUrl(d.cmd.art) : ""}" alt="">
      <div style="min-width:0">
        <div class="mine__who">Seat 1 · you</div>
        <div class="mine__n">${d ? esc(d.name) : "No deck"}</div>
        <div class="mine__meta">${d ? ciPips(d.ci) : ""}<span class="count tabular">${d ? d.cards : 0}</span>${d ? engineBadge(d) : ""}</div>
      </div>
    </div>
    <button class="btn" data-act="drawer-open">Change deck</button>
    <button class="btn" data-act="open" data-id="${state.deckId}">Deck details</button>
    ${roomLive() ? `<div class="mine__room">
      <span class="mine__who">Room</span>
      <b class="mine__code tabular">${ROOM.code}</b>
      <button class="btn" data-act="copy">${state.copied ? "Copied" : "Copy"}</button>
    </div>
    <button class="toggle${state.fillCpu ? " toggle--on" : ""}" data-act="fill">
      <i class="toggle__box">${state.fillCpu ? "✓" : ""}</i>Fill empty chairs with CPU
    </button>` : ""}
    <span class="mine__spacer"></span>
    <p class="mine__why">${
      !d || d.engine === "preview" ? "This precon has no deck list in the engine yet."
      : !canStart() ? `${openSeats()} chair${openSeats() > 1 ? "s" : ""} still open — share the code, or let CPUs fill them.`
      : `${podSize()} seats · seed from ?seed=`
    }</p>
    <button class="play" data-act="play" data-testid="start-game" ${blocked || state.starting ? "disabled" : ""}>
      ${playLabel("Start the game")}
    </button>
  </div>`;
}

function render() {
  root.innerHTML = `<div class="gate" data-testid="new-game">
    <header class="head">
      <span class="head__mark">Auto MTG</span>
      <span class="head__sub">Commander, against the engine</span>
      <span class="head__spacer"></span>
      <span class="head__ver">Pod lobby</span>
    </header>
    <div class="table">
      <div class="table__label">
        Across the table
        <span class="table__hint">Each seat sets its own difficulty — a pod can be one Apprentice and one Archmage.</span>
      </div>
      <div class="felt">
        <div class="felt__ring"></div>
        ${pod()}
      </div>
    </div>
    ${mine()}
    ${drawer()}
  </div>
  ${over()}`;
}

/* Behaviour -------------------------------------------------------------- */

root.addEventListener("input", (e) => {
  if (e.target.id === "mox") state.imp.url = e.target.value;
});

function runImport() {
  const url = state.imp.url.trim();
  if (!/^https?:\/\/(www\.)?moxfield\.com\/decks\/\S+/i.test(url)) {
    state.imp = { status: "error", url, msg: CUSTOM.errors.badUrl };
    render();
    return;
  }
  state.imp = { status: "fetching", url, msg: "" };
  render();
  setTimeout(() => {   // canned; there is no network here
    state.custom = CUSTOM.fake;
    state.deckId = CUSTOM.fake.id;
    state.imp = { status: "ready", url, msg: "" };
    render();
  }, 700);
}

root.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-act]");
  if (!hit) return;
  const act = hit.dataset.act;
  if (act === "open") e.stopPropagation();

  switch (act) {
    case "pick": state.deckId = hit.dataset.id; break;
    case "open": state.open = hit.dataset.id; break;
    case "close": state.open = null; break;
    case "pick-play": state.deckId = hit.dataset.id; state.open = null; state.drawer = false; break;
    case "seats": setSeatCount(Number(hit.dataset.n)); break;
    case "seats-open":
      setSeatCount(Number(hit.dataset.n));
      toggleSeat(state.seats.length - 1);
      break;
    case "seat-kind": toggleSeat(Number(hit.dataset.i)); break;
    case "fill": state.fillCpu = !state.fillCpu; break;
    case "copy":
      state.copied = true;
      setTimeout(() => { state.copied = false; render(); }, 1400);
      break;
    case "seat-tier": {
      const i = Number(hit.dataset.i);
      const dir = Number(hit.dataset.dir);
      const at = DIFFICULTY.findIndex((t) => t.id === (state.seats[i].tier || state.difficulty));
      const next = Math.min(DIFFICULTY.length - 1, Math.max(0, at + dir));
      state.seats[i].tier = DIFFICULTY[next].id;
      break;
    }
    case "drawer-open": state.drawer = true; break;
    case "drawer-close": state.drawer = false; break;
    case "import": runImport(); return;
    case "play": {
      state.starting = true;
      render();
      setTimeout(() => { state.starting = false; render(); }, 1600);
      return;
    }
    default: return;
  }
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.open) { state.open = null; render(); return; }
    if (state.drawer) { state.drawer = false; render(); return; }
  }
});

render();
</script>
</body>
</html>
