<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Command Table (menu 01)</title>
<style>
/* ============================================================================
   COMMAND TABLE -- the setup screen is the board before the board
   ----------------------------------------------------------------------------
   THESIS. The current menu is a centred 880px column of text boxes; the game
   behind it is a three-column table with rails down both sides. Nothing about
   the setup screen tells you what you are about to be looking at. This mockup
   gives the menu the board's own anatomy -- left rail, play area, right rail --
   so that pressing Play is a change of contents, not a change of application.

   THE BIG IDEA, stealable on its own: THE SEAT STRIP. "Opponents: 1 2 3" is a
   number you read. Here it is chairs you fill, and each chair shows which deck
   that AI is holding and how well it plays. This is not decoration -- it makes
   the screen honest about something it already does and hides. NewGameScreen
   .tsx:44-46 cycles opponents through the other decks, so the pod is already
   heterogeneous and the current UI has never said so. Once the seats exist, a
   per-seat difficulty override falls out for free, which no slider can express.

   THE TRADE. This is the conservative direction, and deliberately: it keeps the
   notion of "a list of decks plus a set of options", so it ports into
   NewGameScreen.tsx as new markup around surviving structure rather than as a
   rewrite. The cost is that it is the least surprising of the five. If the brief
   is "make it feel like a game", 05 goes further; this one goes safer.

   Interactive. Everything in the contract works: pick a deck, open and close the
   dossier (x, backdrop, Escape), change difficulty, fill and empty seats, paste
   a Moxfield link and watch it fail or succeed, press Play.

   No build, no server, no network. Local ../art/*.jpg only.
   ========================================================================== */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-ink:#1a1a1a;

  --playable:#5ce08a; --danger:#ff5c5c; --gold:#ffd479; --ability:#c39bff;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  --card-w:clamp(132px, 19vh, 196px);
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

/* Colour-identity frame tints, lifted from frontend/src/styles/cards.css: the
   lit edge and the shadowed one, which is what makes a frame read as moulded
   rather than as a coloured outline. */
.f-W { --f-hi:#f6eed4; --f-lo:#b9ad86; --fb:#d8cfa8; }
.f-U { --f-hi:#a9d2ec; --f-lo:#2f6a95; --fb:#4a86b8; }
.f-B { --f-hi:#b6aeac; --f-lo:#2e282b; --fb:#4c4550; }
.f-R { --f-hi:#f0a48b; --f-lo:#a4432f; --fb:#b8624a; }
.f-G { --f-hi:#a9cfa2; --f-lo:#2f6b41; --fb:#4e8a5c; }
.f-C { --f-hi:#d3d6da; --f-lo:#787e86; --fb:#8a8f96; }
.f-gold { --f-hi:#eed99c; --f-lo:#9c7a24; --fb:#b99a45; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143,127,232,.13) 0%, transparent 62%),
    radial-gradient(70% 50% at 50% 100%, rgba(90,190,220,.07) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
.tabular { font-variant-numeric:tabular-nums; }
.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--edge); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* Shell ------------------------------------------------------------------ */

.gate { display:grid; grid-template-rows:auto minmax(0,1fr); height:100%; }

.head {
  display:flex; align-items:baseline; gap:14px; padding:14px 22px 12px;
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg, rgba(143,127,232,.12), transparent);
}
.head__mark { font-size:19px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
.head__sub { font-size:11.5px; color:var(--text-faint); letter-spacing:.04em; }
.head__spacer { flex:1; }
.head__ver { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }

.body {
  display:grid; grid-template-columns:284px minmax(0,1fr) 316px; gap:16px;
  padding:16px 22px 20px; min-height:0;
}

/* Panels are recessed wells, not 1px boxes. */
/* min-width:0 on every pane and every child of one. A grid item defaults to
   min-width:auto, so a wide row inside a pane silently widens the pane past its
   track and paints over the next column instead of wrapping. That is exactly
   what the bars row under the hero did, and no viewport-overflow check catches
   it -- the spill is into a sibling, not off the screen. */
.pane {
  border:1px solid var(--edge); border-radius:12px;
  background:var(--pane-bg); box-shadow:var(--pane-shadow);
  display:flex; flex-direction:column; min-height:0; min-width:0;
}
.pane > * { min-width:0; }
.pane__title {
  padding:11px 14px 9px; font-size:10px; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-faint); border-bottom:1px solid var(--edge);
  display:flex; align-items:center; gap:8px;
}
.pane__count { margin-left:auto; letter-spacing:.06em; }
.pane__body { flex:1; min-height:0; overflow:auto; padding:10px; }

/* Left rail -- the deck list -------------------------------------------- */

.group { margin-bottom:12px; }
.group:last-child { margin-bottom:0; }
.group__label {
  padding:2px 4px 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-faint);
}

.row {
  display:grid; grid-template-columns:52px minmax(0,1fr); gap:10px; width:100%;
  align-items:center; padding:8px; margin-bottom:6px; text-align:left;
  border:1px solid transparent; border-radius:9px; background:var(--pane-well);
  color:var(--text); transition:border-color 120ms, background 120ms, transform 120ms;
}
.row:hover { border-color:var(--edge-hi); transform:translateY(-1px); }
.row--on { border-color:var(--gold); box-shadow:0 0 0 1px rgba(255,212,121,.45), 0 8px 20px rgba(0,0,0,.45); }
.row__art {
  width:52px; height:52px; border-radius:6px; object-fit:cover; object-position:50% 28%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
}
.row__main { min-width:0; }
.row__name { display:block; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row__meta { display:flex; align-items:center; gap:5px; margin-top:4px; }
.row__cmd { font-size:10.5px; color:var(--text-faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.slot {
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:14px 8px; border:1px dashed var(--edge-hi); border-radius:9px;
  color:var(--text-dim); font-size:12px; font-weight:600;
  background:rgba(13,12,28,.4); transition:border-color 120ms, color 120ms;
}
.slot:hover { border-color:var(--astral-hi); color:var(--text); }
.slot--on { border-style:solid; border-color:var(--gold); }
.slot--inline { width:auto; padding:9px 16px; white-space:nowrap; flex:none; }

/* Import ---------------------------------------------------------------- */

.imp { padding:10px; border:1px dashed var(--edge-hi); border-radius:9px; background:rgba(13,12,28,.4); }
.imp__label { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.imp__field { display:flex; gap:6px; margin-top:7px; }
.imp__input {
  flex:1; min-width:0; padding:7px 9px; border:1px solid var(--edge); border-radius:7px;
  background:var(--pane-well); color:var(--text); font-size:12px;
}
.imp__input::placeholder { color:var(--text-faint); }
.imp__input:focus { outline:none; border-color:var(--astral); }
.imp__note { margin:7px 0 0; font-size:10.5px; line-height:1.45; color:var(--text-faint); }
.imp__note--err { color:var(--danger); }
.imp__note--busy { color:var(--astral-hi); }

/* Centre -- the hero ---------------------------------------------------- */

.hero { display:grid; grid-template-rows:minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); min-height:0; }
.hero__stage { position:relative; min-height:0; overflow:hidden; border-radius:12px 12px 0 0; }

/* ART RESOLUTION IS A HARD CEILING, AND IT DRIVES THIS LAYOUT.
 *
 * Scryfall's art_crop -- the only art-only asset it publishes -- is 626x457.
 * `large` and `png` are bigger (672x936, 745x1040) but they are whole cards;
 * the art band inside them is ~655px, so there is nothing sharper to fetch.
 * This hero panel is ~924px wide, so `object-fit:cover` was drawing a 626px
 * image at 1.53x and it looked exactly like that.
 *
 * So the panel is two layers. `__blur` is the same image scaled past its limit
 * ON PURPOSE and blurred hard: at 28px of blur, resolution stops existing and
 * it reads as a lit wall rather than a bad photo. `__crisp` is the same image
 * capped at its native 626x457 and centred, so the thing you actually look at
 * is never upscaled at all. Cheap, no extra bytes -- it is one file twice.
 */
.hero__blur {
  position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; object-position:50% 30%;
  filter:blur(30px) saturate(1.12) brightness(.5); transform:scale(1.04);
}
/* 780px is 1.25x native, which is as far as this crop goes before it shows.
   The radial mask dissolves the plate's own edges into the blur behind, so it
   reads as one lit field rather than as a photo pasted onto a wall. */
.hero__crisp {
  position:absolute; inset:0; margin:auto; width:100%; height:100%;
  max-width:780px; max-height:570px; object-fit:contain;
  -webkit-mask-image:radial-gradient(108% 116% at 50% 42%, #000 44%, rgba(0,0,0,.75) 74%, transparent 100%);
          mask-image:radial-gradient(108% 116% at 50% 42%, #000 44%, rgba(0,0,0,.75) 74%, transparent 100%);
}
.hero__art--none {
  position:absolute; inset:0;
  background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152;
}
/* A scrim that grades to fully transparent, never a hard-edged bar -- the same
   rule cards.css uses over card art, and the whole difference between art that
   is a background and art in a box. */
.hero__scrim {
  position:absolute; inset:auto 0 0 0; padding:22px 22px 18px;
  background:linear-gradient(0deg, rgba(9,8,20,.97) 0%, rgba(9,8,20,.9) 34%, rgba(9,8,20,.62) 62%, rgba(9,8,20,0) 100%);
}
.hero__eyebrow {
  font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-dim); text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.hero__name {
  margin:5px 0 0; font-size:clamp(22px, 3.4vh, 34px); font-weight:800; letter-spacing:.01em;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.hero__cmd { margin:3px 0 0; font-size:12.5px; color:var(--text-dim); text-shadow:0 1px 3px rgba(0,0,0,.85); }
.hero__line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
.hero__blurb {
  margin:10px 0 0; max-width:62ch; font-size:12.5px; line-height:1.55; color:var(--text-dim);
  text-shadow:0 1px 3px rgba(0,0,0,.85);
}
.hero__foot {
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 18px;
  border-top:1px solid var(--edge); background:var(--pane-well); border-radius:0 0 12px 12px;
}
.hero__bars { display:flex; flex-wrap:wrap; gap:6px 18px; min-width:0; }
.hero__spacer { flex:1; }

/* Right rail -- the pod -------------------------------------------------- */

.seat {
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:9px; align-items:center;
  padding:8px; margin-bottom:7px; border:1px solid var(--edge); border-radius:9px;
  background:var(--pane-well);
}
.seat--you { border-color:rgba(255,212,121,.42); }
/* Dashed means not-here, and an open chair is the purest not-here on the page. */
.seat--open { border-style:dashed; border-color:var(--edge-hi); background:rgba(13,12,28,.42); }
.seat--human { border-color:rgba(92,224,138,.4); }
.seat__art--none {
  background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152;
}
.seat__sealed { color:var(--text-faint); font-weight:500; font-style:italic; }
.seat__acts { display:flex; gap:4px; }

.pod { display:flex; flex-direction:column; }
.pod__add { display:flex; gap:6px; flex:none; }

/* The room only exists once a chair is open. Until then this screen has never
   heard of multiplayer, which is the point: there is no mode to choose. */
.room {
  display:flex; align-items:center; gap:8px; padding:9px 14px;
  border-bottom:1px solid var(--edge); background:rgba(143,127,232,.1);
}
.room__label { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.room__code { font-size:14px; font-weight:800; letter-spacing:.1em; color:var(--astral-hi); }
.room__copy {
  margin-left:auto; padding:4px 9px; border:1px solid var(--edge-hi); border-radius:6px;
  font-size:10.5px; font-weight:650; color:var(--text-dim);
}
.room__copy:hover { border-color:var(--astral-hi); color:var(--text); }

.toggle {
  display:flex; align-items:center; gap:8px; width:100%; margin-top:8px; padding:8px 10px;
  border:1px solid var(--edge); border-radius:8px; background:var(--pane-well);
  color:var(--text-dim); font-size:11.5px; font-weight:600; text-align:left;
}
.toggle:hover { border-color:var(--edge-hi); color:var(--text); }
.toggle--on { border-color:var(--gold); color:var(--text); }
.toggle__box {
  width:15px; height:15px; flex:none; display:grid; place-items:center; border-radius:4px;
  border:1px solid var(--edge-hi); font-size:10px; font-style:normal; color:#241a04;
}
.toggle--on .toggle__box { background:var(--gold); border-color:var(--gold); }
.seat__art { width:44px; height:44px; border-radius:6px; object-fit:cover; object-position:50% 28%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.5); }
.seat__main { min-width:0; }
.seat__who { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.seat__deck { font-size:12px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.seat__tier { display:flex; align-items:center; gap:6px; margin-top:4px; }
.seat__tiername { font-size:10.5px; color:var(--text-dim); }
.seat__x {
  width:22px; height:22px; border-radius:999px; border:1px solid var(--edge);
  color:var(--text-faint); font-size:12px; line-height:1;
}
.seat__x:hover { border-color:var(--danger); color:var(--danger); }

.dial { padding:11px 12px 12px; border-top:1px solid var(--edge); }
.dial__label { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.dial__rungs { display:grid; gap:5px; margin-top:8px; }
.rung {
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; width:100%;
  padding:7px 10px; text-align:left; border:1px solid var(--edge); border-radius:999px;
  background:var(--pane-well); color:var(--text-dim); transition:border-color 120ms, color 120ms;
}
.rung:hover { border-color:var(--edge-hi); color:var(--text); }
.rung--on { border-color:var(--gold); background:linear-gradient(180deg, rgba(255,212,121,.16), rgba(255,212,121,.04)); color:var(--text); }
.rung__n { font-size:12px; font-weight:750; }
.rung__tag { font-size:10px; color:var(--text-faint); margin-left:7px; font-weight:500; }
.rung__rec { font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-left:6px; }
.dial__line { margin:9px 2px 0; font-size:11px; line-height:1.5; color:var(--text-dim); }

.commit { padding:12px; border-top:1px solid var(--edge); }
.play {
  display:block; width:100%; padding:14px 16px; border-radius:11px;
  background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05;
  font-size:15px; font-weight:800; letter-spacing:.04em;
  box-shadow:0 4px 0 #7d5310, 0 0 26px rgba(224,166,63,.28);
}
.play:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 26px rgba(224,166,63,.28); }
.play:disabled { opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #4a3a18; }
.commit__why { margin:9px 2px 0; font-size:10.5px; line-height:1.45; color:var(--text-faint); text-align:center; }

/* Shared vocabulary ------------------------------------------------------ */

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 4px; border-radius:999px;
  font-size:10px; font-weight:800; font-style:normal; color:var(--mana-ink);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W { background:var(--mana-W); } .pip--U { background:var(--mana-U); }
.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }

.chip {
  padding:3px 8px; border:1px solid var(--edge); border-radius:999px;
  font-size:10px; font-weight:650; color:var(--text-dim); background:rgba(13,12,28,.5);
}
.count { font-size:10.5px; color:var(--text-faint); }

/* Dashed means "not real / not here" -- the same rule the board uses for drop
   targets and fallen commanders. A precon with no deck list is not-here. */
.badge {
  padding:2px 7px; border:1px dashed var(--edge-hi); border-radius:999px;
  font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);
}
.badge--partial { border-style:solid; border-color:rgba(255,212,121,.5); color:var(--gold); }

/* Ratings and lamps are filled/hollow segments, never a hue ramp -- a count you
   can read at a glance beats a shade you have to interpret. */
.bar { display:flex; align-items:center; gap:7px; }
.bar__label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); min-width:88px; }
.bar__track { display:flex; gap:2px; }
.bar__seg { width:13px; height:5px; border-radius:2px; border:1px solid var(--edge-hi); background:transparent; }
.bar__seg--on { background:var(--text-dim); border-color:var(--text-dim); }

.lamps { display:inline-flex; gap:3px; }
.lamp { width:7px; height:7px; border-radius:999px; border:1px solid var(--edge-hi); }
.lamp--on { background:var(--astral-hi); border-color:var(--astral-hi); }

/* Card face -- art bleed, per frontend/src/styles/cards.css. No paper, no art
   window: art fills the card and the text sits on scrims that grade to fully
   transparent. The gradient under the art is the whole card when art is absent. */
.face {
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; overflow:hidden;
  border-radius:var(--card-r); border:2px solid var(--fb);
  background:linear-gradient(160deg, var(--f-hi), var(--f-lo));
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.35);
  color:#fff; flex:none;
}
.face__art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.face__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152; }
.face__head, .face__foot { position:relative; z-index:2; padding:6px 7px; }
.face__head { background:linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.57) 55%, rgba(0,0,0,0)); }
.face__foot { background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.71) 58%, rgba(0,0,0,0)); }
.face__title { display:flex; align-items:flex-start; gap:5px; }
.face__name { flex:1; font-size:11px; font-weight:750; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.85); }
.face__cost { display:flex; gap:2px; flex:none; }
.face__type { margin-top:3px; font-size:8.5px; color:rgba(255,255,255,.86); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__rules {
  margin:0 0 5px; font-size:8.5px; line-height:1.38; color:rgba(255,255,255,.92);
  text-shadow:0 1px 2px rgba(0,0,0,.85);
  display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
}
.face__base { display:flex; align-items:flex-end; gap:6px; }
.face__kw { flex:1; font-size:8.5px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__pt { font-size:12px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.9); }

/* Dossier ---------------------------------------------------------------- */

.scrim {
  position:fixed; inset:0; z-index:500; display:grid; place-items:center; padding:24px;
  background:rgba(6,5,16,.72); backdrop-filter:blur(3px);
}
.dlg {
  display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  width:min(880px, 94vw); max-height:min(880px, 92vh); min-height:0;
  border:1px solid var(--edge); border-radius:14px;

}
.dlg__head { display:flex; align-items:center; gap:10px; padding:15px 18px 13px; border-bottom:1px solid var(--edge); }
.dlg__name { font-size:18px; font-weight:800; }
.dlg__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); }
.dlg__x:hover { border-color:var(--edge-hi); color:var(--text); }
.dlg__body { min-height:0; overflow:auto; padding:16px 18px; }
.dlg__foot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--edge); }
.dlg__foot .play { width:auto; padding:11px 22px; font-size:14px; }
.ghost { padding:9px 14px; border-radius:7px; color:var(--text-faint); font-size:13px; font-weight:500; }
.ghost:hover { color:var(--text); }

.dos { display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; }
.dos__card { display:grid; gap:8px; justify-items:center; align-content:start; }
.dos__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.dos__h {
  margin:16px 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-faint);
}
.dos__h:first-child { margin-top:0; }
.dos__p { margin:0; font-size:12.5px; line-height:1.6; color:var(--text-dim); }
.dos__tags { display:flex; flex-wrap:wrap; gap:6px; }
.dos__bars { display:grid; gap:5px; }
.dos__sigs { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:9px; }
.sig { display:grid; grid-template-columns:56px minmax(0,1fr); gap:9px; align-items:center; }
.sig__art { width:56px; height:44px; border-radius:5px; object-fit:cover; object-position:50% 30%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.sig__n { font-size:11.5px; font-weight:700; }
.sig__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); margin-top:2px; }

/* The bars live in their own fixed-height track and the axis sits under it.
   Putting the label inside the column makes the tallest bar compete with its own
   caption for space, which silently flattens exactly the bar the chart is about. */
.curve__cols { display:flex; align-items:flex-end; gap:4px; height:56px; }
.curve__bar { flex:1; background:var(--text-faint); border-radius:2px 2px 0 0; min-height:2px; }

  padding:14px; border:1px dashed var(--edge-hi); border-radius:9px;
  font-size:11.5px; line-height:1.5; color:var(--text-faint); text-align:center;
}

.note {

  background:rgba(13,12,28,.55); font-size:11.5px; line-height:1.55; color:var(--text-faint);
}

    signature: [
      { n: "Mardu Ascendancy", art: "mardu-ascendancy", why: "A second mobilize, on every nontoken attacker." },

const CUSTOM = {
  placeholder: "https://moxfield.com/decks/...",
  hint: "Paste a public Moxfield deck link.",
  fake: {
    id: "custom-vorel", name: "Vorel of the Hull Clade", short: "Vorel",
    ci: ["G", "U"], guild: "Simic", cards: 100, lands: 36,
    cmd: { n: "Vorel of the Hull Clade", cost: "1GU", tl: "Legendary Creature — Human Merfolk",
      t: "creature", f: "gold", pt: "1/4",
      rules: "{1}{G}{U}, {T}: Double the number of each kind of counter on target artifact, creature, or land you control.",
      art: "vorel-of-the-hull-clade", artist: "Mike Bierek" },
    tags: ["Counters", "Ramp", "Combo"],
    blurb: "Imported from Moxfield. Simic +1/+1 counters, doubled.",
    strategy: "Imported decks have no editorial write-up — this is whatever you built.",
    bars: { speed: 2, complexity: 4, interaction: 2, resilience: 2, pilot: 4 },
    curve: [8, 15, 16, 12, 6, 4, 3],
    signature: [], engine: "partial", unsupported: 12, swaps: 0, swapNote: null,
  },
  errors: {
    badUrl: "That is not a Moxfield deck link.",
    private: "That deck is private. Set it to public and try again.",
  },
};

const OPPONENTS = [1, 2, 3];

/* Rooms.
 *
 * docs/roadmap.md's backlog asks for "multiplayer online support using a basic
 * system of rooms and room codes". It does not need a second screen, and giving
 * it one is how products end up with two menus. It needs one new idea: a seat
 * has a KIND -- cpu, open (holding the code, waiting for a person), or human.
 * All-CPU, all-human and mixed pods are then the same screen with different
 * seats in it, and "fill empty chairs with CPU" is both the partial-pod case
 * and backfill-on-disconnect.
 */
const ROOM = {
  code: "GYRE-8412",
  // Canned. Opening a chair invites one scripted player who arrives and then
  // locks in; there is no network in a mockup and there never will be.
  guest: { name: "Priya", deckId: "edgar" },
  joinMs: 1200,
  readyMs: 2600,
};

/* --------------------------------------------------------------------------
 * Primitives. Every menu mockup copies these; only the containers differ.
 * ------------------------------------------------------------------------ */

const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (slug) => "../art/" + slug + ".jpg";

/** A mana cost string ("3RWB") as pips, generic first. */
function pips(cost) {
  if (!cost) return "";
  const out = [];
  let num = "";
  for (const ch of String(cost)) {
    if (ch >= "0" && ch <= "9") { num += ch; continue; }
    if (num) { out.push(`<i class="pip pip--C">${num}</i>`); num = ""; }
    out.push(`<i class="pip pip--${ch}">${ch}</i>`);
  }
  if (num) out.push(`<i class="pip pip--C">${num}</i>`);
  return out.join("");
}

/** Colour identity. The letter stays inside the pip: hue alone is not a label. */
const ciPips = (ci) => ci.map((c) => `<i class="pip pip--${c}">${c}</i>`).join("");

/** Four segments, filled/hollow. Never a hue ramp. */
function bar(label, value) {
  let segs = "";
  for (let i = 1; i <= 4; i += 1) segs += `<i class="bar__seg${i <= value ? " bar__seg--on" : ""}"></i>`;
  return `<div class="bar"><span class="bar__label">${esc(label)}</span><span class="bar__track">${segs}</span></div>`;
}
const bars = (b) => BAR_LABELS.map(([k, label]) => bar(label, b[k])).join("");

/** The three capability lamps for a tier, cumulative and filled/hollow. */
const lamps = (caps) =>
  `<span class="lamps">${CAPS.map((c) => `<i class="lamp${caps.includes(c.id) ? " lamp--on" : ""}" title="${esc(c.n)}"></i>`).join("")}</span>`;

const tierOf = (id) => DIFFICULTY.find((d) => d.id === id);

/** The art-bleed card face. `null` art draws the hatch plate, never a broken image. */
function face(c) {
  const media = c.art
    ? `<img class="face__art" src="${artUrl(c.art)}" alt="">`
    : `<div class="face__art face__art--none"></div>`;
  return `<div class="face f-${c.f || "C"}">
    ${media}
    <div class="face__head">
      <div class="face__title"><span class="face__name">${esc(c.n)}</span><span class="face__cost">${pips(c.cost)}</span></div>
      <div class="face__type">${esc(c.tl)}</div>
    </div>
    <div class="face__foot">
      ${c.rules ? `<p class="face__rules">${esc(c.rules)}</p>` : ""}
      <div class="face__base"><span class="face__kw">${esc(c.kw || "")}</span>${c.pt ? `<span class="face__pt tabular">${c.pt}</span>` : ""}</div>
    </div>
  </div>`;
}

/** The mana curve, or an honest hole where a deck list does not exist yet. */
function curve(values) {
  if (!values) {
    return `<div class="curve__none">No deck list yet — the curve arrives with engine support for these cards.</div>`;
  }
  const max = Math.max(...values);
  const label = (i) => `${i + 1}${i === 6 ? "+" : ""}`;
  const bars_ = values.map((v, i) =>
    `<span class="curve__bar" style="height:${Math.round((v / max) * 100)}%" title="${v} cards at ${label(i)} mana"></span>`).join("");
  const axis = values.map((v, i) => `<span class="curve__n tabular">${label(i)}</span>`).join("");
  return `<div class="curve"><div class="curve__cols">${bars_}</div><div class="curve__axis">${axis}</div></div>`;
}

function engineBadge(deck) {
  if (deck.engine === "preview") return `<span class="badge">Preview</span>`;
  if (deck.engine === "partial") return `<span class="badge badge--partial">${deck.unsupported} unsupported</span>`;
  return "";
}

/* --------------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------------ */

const state = {
  deckId: "aesi",
  difficulty: "apprentice",
  seats: [{ kind: "cpu" }, { kind: "cpu", tier: "duelist" }],   // opponents, in order
  fillCpu: true,
  open: null,             // deck id whose dossier is showing
  imp: { status: "idle", url: "", msg: "" },
  custom: null,           // the imported deck, once it exists
  starting: false,
};

const allDecks = () => (state.custom ? PRECONS.concat([state.custom]) : PRECONS.slice());
const deckById = (id) => allDecks().find((d) => d.id === id) || null;
const selected = () => deckById(state.deckId);

/* Seats ------------------------------------------------------------------ */

let joinToken = 0;

const podSize = () => state.seats.length + 1;
const openSeats = () => state.seats.filter((s) => s.kind === "open").length;
const roomLive = () => state.seats.some((s) => s.kind !== "cpu");
const filledSeats = () => podSize() - openSeats();
const canStart = () => openSeats() === 0 || state.fillCpu;
/** A CPU seat follows the pod's tier unless it has been given its own. */
const seatTier = (i) => tierOf(state.seats[i].tier || state.difficulty);

function setSeatCount(n) {
  while (state.seats.length > n) state.seats.pop();
  while (state.seats.length < n) state.seats.push({ kind: "cpu" });
}

/** Flip a chair between a CPU and an open seat holding the room code. Opening
 *  one runs the canned join: a person arrives, then locks their deck in. */
function toggleSeat(i) {
  if (state.seats[i].kind === "cpu") {
    state.seats[i] = { kind: "open" };
    const token = ++joinToken;
    setTimeout(() => {
      if (token !== joinToken || !state.seats[i] || state.seats[i].kind !== "open") return;
      state.seats[i] = { kind: "human", name: ROOM.guest.name, deckId: ROOM.guest.deckId, ready: false };
      render();
      setTimeout(() => {
        if (token !== joinToken || !state.seats[i] || state.seats[i].kind !== "human") return;
        state.seats[i].ready = true;
        render();
      }, ROOM.readyMs - ROOM.joinMs);
    }, ROOM.joinMs);
  } else {
    state.seats[i] = { kind: "cpu" };
  }
}

/** What a seat is holding, or null when it is not knowable yet.
 *
 *  CPU opponents cycle through the other decks, exactly as NewGameScreen.tsx
 *  :44-46 really does -- so the seat strip is reporting behaviour, not
 *  inventing it. Preview decks are excluded: a deck the engine cannot deal
 *  cannot be dealt to an opponent either.
 *
 *  A HUMAN's deck is sealed until they lock in. Reading a list before the game
 *  is scouting, and scouting before mulligans is what a lobby hides. */
function seatDeck(i) {
  const s = state.seats[i];
  if (s.kind === "open") return null;
  if (s.kind === "human") return s.ready ? deckById(s.deckId) : null;
  // Skip decks already spoken for -- yours, and any a joined player locked in.
  // Falling back twice is not defensive coding, it is the real situation: with
  // two playable decks and three opponents a duplicate is unavoidable, and
  // docs/playtest-feedback-01.md:202 has been saying so for three cycles.
  const taken = new Set([state.deckId, ...state.seats.filter((x) => x.kind === "human" && x.ready).map((x) => x.deckId)]);
  const live = allDecks().filter((d) => d.engine !== "preview");
  const pool = live.filter((d) => !taken.has(d.id))
    || [];
  const fallback = live.filter((d) => d.id !== state.deckId);
  const chosen = pool.length ? pool : (fallback.length ? fallback : live);
  return chosen.length ? chosen[i % chosen.length] : allDecks()[0];
}


/** The second line of a seat chip. The sealed/locked-in state has to be visible
 *  in every mockup, not only the ones with room for a paragraph -- it is a rule
 *  about what you are allowed to know, and a rule nobody can see is not a rule. */
function seatSub(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  if (s.kind === "cpu") return d ? d.short : "—";
  if (s.kind === "open") return "invite";
  return s.ready ? `${d.short} · locked in` : "choosing a deck…";
}

/** The two lines a seat shows, whatever the skin around it. */
function seatLabel(i) {
  const s = state.seats[i];
  if (s.kind === "open") return { title: "Open chair", sub: "Waiting for a player" };
  if (s.kind === "human") return { title: s.name, sub: s.ready ? "Locked in" : "Choosing a deck…" };
  const t = seatTier(i);
  return { title: t.n, sub: t.tag };
}

function playLabel() {
  if (state.starting) return "Shuffling…";
  const d = selected();
  if (!roomLive()) return d ? "Play " + esc(d.short) : "Play";
  if (!canStart()) return `Waiting · ${filledSeats()} of ${podSize()}`;
  return `Start · ${filledSeats()} of ${podSize()} seats`;
}

/* --------------------------------------------------------------------------
 * Views
 * ------------------------------------------------------------------------ */

/** Two of the four decks are named after their commander. Repeating the name
 *  under itself buys nothing, so those rows spend the line on the archetype. */
const subtitle = (d) => (d.cmd.n === d.name ? `${d.guild} · ${d.tags[0].toLowerCase()}` : d.cmd.n);

function deckRow(deck) {
  const on = deck.id === state.deckId;
  return `<button class="row${on ? " row--on" : ""}" data-act="pick" data-id="${deck.id}" data-testid="deck-${deck.id}">
    <img class="row__art" src="${artUrl(deck.cmd.art)}" alt="">
    <span class="row__main">
      <span class="row__name">${esc(deck.name)}</span>
      <span class="row__cmd">${esc(subtitle(deck))}</span>
      <span class="row__meta">${ciPips(deck.ci)}<span class="count tabular">${deck.cards}</span>${engineBadge(deck)}</span>
    </span>
  </button>`;
}

function importPanel() {
  const { status, msg } = state.imp;
  let note = `<p class="imp__note">${esc(CUSTOM.hint)}</p>`;
  if (status === "fetching") note = `<p class="imp__note imp__note--busy">Reading the list…</p>`;
  if (status === "error") note = `<p class="imp__note imp__note--err">${esc(msg)}</p>`;
  if (status === "ready") note = `<p class="imp__note">Imported. ${CUSTOM.fake.unsupported} cards are not in the engine yet and were left out.</p>`;
  return `<div class="imp">
    <div class="imp__label">Import from Moxfield</div>
    <div class="imp__field">
      <input class="imp__input" id="mox" type="text" value="${esc(state.imp.url)}"
             placeholder="${esc(CUSTOM.placeholder)}" spellcheck="false" aria-label="Moxfield deck link">
      <button class="slot slot--inline" style="padding:7px 12px" data-act="import">Import</button>
    </div>
    ${note}
  </div>`;
}

function leftRail() {
  return `<section class="pane">
    <h2 class="pane__title">Decks<span class="pane__count tabular">${allDecks().length}</span></h2>
    <div class="pane__body">
      <div class="group">
        <div class="group__label">Precons</div>
        ${PRECONS.map(deckRow).join("")}
      </div>
      <div class="group">
        <div class="group__label">Custom</div>
        ${state.custom ? deckRow(state.custom) : ""}
        ${importPanel()}
      </div>
    </div>
  </section>`;
}

function hero() {
  const d = selected();
  if (!d) return `<section class="pane hero"></section>`;
  return `<section class="pane hero">
    <div class="hero__stage">
      <img class="hero__blur" src="${artUrl(d.cmd.art)}" alt="" aria-hidden="true">
      <img class="hero__crisp" src="${artUrl(d.cmd.art)}" alt="">
      <div class="hero__scrim">
        <div class="hero__eyebrow">${esc(d.guild)} · ${d.engine === "playable" ? "Precon" : d.engine === "partial" ? "Imported" : "Precon · preview"}</div>
        <h2 class="hero__name">${esc(d.name)}</h2>
        <p class="hero__cmd">${d.cmd.n === d.name ? esc(d.cmd.tl) : esc(d.cmd.n) + " — " + esc(d.cmd.tl)}</p>
        <div class="hero__line">
          ${ciPips(d.ci)}
          <span class="count tabular">${d.cards} cards</span>
          ${d.lands ? `<span class="count tabular">${d.lands} lands</span>` : ""}
          ${engineBadge(d)}
          ${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
        </div>
        <p class="hero__blurb">${esc(d.blurb)}</p>
      </div>
    </div>
    <div class="hero__foot">
      <div class="hero__bars">${bars(d.bars)}</div>
      <span class="hero__spacer"></span>
      <button class="slot slot--inline" data-act="open" data-id="${d.id}">Open dossier</button>
    </div>
  </section>`;
}

function seat(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  const label = seatLabel(i);
  // No deck to show yet: the hatch plate, the same one cards.css draws when a
  // card has no printing. An unknown deck and an unprinted card are the same
  // fact -- there is nothing to look at -- so they look the same.
  const art = d
    ? `<img class="seat__art" src="${artUrl(d.cmd.art)}" alt="">`
    : `<span class="seat__art seat__art--none"></span>`;
  const deckLine = d
    ? esc(d.short)
    : s.kind === "human" ? `<span class="seat__sealed">Deck sealed</span>` : "—";
  return `<div class="seat seat--${s.kind}">
    ${art}
    <div class="seat__main">
      <div class="seat__who">Seat ${i + 2} · ${s.kind === "cpu" ? "CPU" : s.kind === "open" ? "open" : "player"}</div>
      <div class="seat__deck">${deckLine}</div>
      <div class="seat__tier">
        ${s.kind === "cpu" ? lamps(seatTier(i).caps) : ""}
        <span class="seat__tiername">${esc(label.title)}${s.kind === "cpu" ? "" : " · " + label.sub}</span>
      </div>
    </div>
    <div class="seat__acts">
      ${s.kind === "cpu"
        ? `<button class="seat__x" data-act="seat-cycle" data-i="${i}" title="Give this seat the next tier up">↻</button>` : ""}
      <button class="seat__x" data-act="seat-kind" data-i="${i}"
              title="${s.kind === "cpu" ? "Open this chair to a player" : "Put a CPU back in this chair"}">
        ${s.kind === "cpu" ? "＋" : "⌫"}
      </button>
    </div>
  </div>`;
}

function rightRail() {
  const d = selected();
  const tier = tierOf(state.difficulty);
  const seats = state.seats.map((_, i) => seat(i));
  const n = state.seats.length;
  const canAdd = n < OPPONENTS[OPPONENTS.length - 1];
  const canDrop = n > OPPONENTS[0];
  const blocked = !d || d.engine === "preview" || !canStart();

  return `<section class="pane">
    <h2 class="pane__title">The pod<span class="pane__count tabular">${podSize()} seats</span></h2>
    ${roomLive() ? `<div class="room">
      <span class="room__label">Room</span>
      <b class="room__code tabular">${ROOM.code}</b>
      <button class="room__copy" data-act="copy">${state.copied ? "Copied" : "Copy"}</button>
    </div>` : ""}
    <div class="pane__body pod">
      <div class="seat seat--you">
        <img class="seat__art" src="${d ? artUrl(d.cmd.art) : ""}" alt="">
        <div class="seat__main">
          <div class="seat__who">Seat 1 · you</div>
          <div class="seat__deck">${d ? esc(d.short) : "—"}</div>
          <div class="seat__tier"><span class="seat__tiername">Your deck</span></div>
        </div>
      </div>
      ${seats.join("")}
      <div class="pod__add">
        ${canAdd ? `<button class="slot" data-act="seats" data-n="${n + 1}" data-testid="opponents-${n + 1}">+ Seat an opponent</button>` : ""}
        ${canDrop ? `<button class="slot" data-act="seats" data-n="${n - 1}" data-testid="opponents-${n - 1}">− Empty a chair</button>` : ""}
      </div>
      ${roomLive() ? `<button class="toggle${state.fillCpu ? " toggle--on" : ""}" data-act="fill">
        <i class="toggle__box">${state.fillCpu ? "✓" : ""}</i>Fill empty chairs with CPU
      </button>` : ""}
    </div>

    <div class="dial">
      <div class="dial__label">How well they play</div>
      <div class="dial__rungs">
        ${DIFFICULTY.map((t) => `<button class="rung${t.id === state.difficulty ? " rung--on" : ""}" data-act="tier" data-id="${t.id}">
          <span><span class="rung__n">${esc(t.n)}</span><span class="rung__tag">${esc(t.tag)}</span>${t.rec ? `<span class="rung__rec">start here</span>` : ""}</span>
          ${lamps(t.caps)}
        </button>`).join("")}
      </div>
      <p class="dial__line">${esc(tier.line)}</p>
    </div>

    <div class="commit">
      <button class="play" data-act="play" data-testid="start-game" ${blocked || state.starting ? "disabled" : ""}>
        ${playLabel()}
      </button>
      <p class="commit__why">${
        !d || d.engine === "preview"
          ? "This precon has no deck list in the engine yet."
          : !canStart()
            ? `${openSeats()} chair${openSeats() > 1 ? "s" : ""} still open — share the code, or let CPUs fill them.`
            : `${podSize()}-player pod · ${esc(tier.n)} · seed from ?seed=`
      }</p>
    </div>
  </section>`;
}

function dossier() {
  if (!state.open) return "";
  const d = deckById(state.open);
  if (!d) return "";
  const sigs = d.signature.length
    ? `<div class="dos__sigs">${d.signature.map((s) => `<div class="sig">
        <img class="sig__art" src="${artUrl(s.art)}" alt="">
        <div><div class="sig__n">${esc(s.n)}</div><div class="sig__why">${esc(s.why)}</div></div>
      </div>`).join("")}</div>`
    : `<p class="dos__p">An imported deck brings no editorial notes with it.</p>`;

  const honesty = d.engine === "preview"
    ? `<div class="note">Preview. These cards are not in the engine yet, so this deck cannot be dealt. It is here because the menu has to be able to show it before "All Card Support" lands.</div>`
    : d.engine === "partial"
      ? `<div class="note">${d.unsupported} of the imported cards use rules the engine does not implement and were dropped from the list.</div>`
      : `<div class="note">${esc(d.swapNote)}</div>`;

  return `<div class="scrim" data-act="close-bg">
    <div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(d.name)}">
      <div class="dlg__head">
        <span class="dlg__name">${esc(d.name)}</span>
        ${ciPips(d.ci)}
        <span class="count tabular">${d.cards} cards</span>
        ${engineBadge(d)}
        <button class="dlg__x" data-act="close" aria-label="Close">✕</button>
      </div>
      <div class="dlg__body">
        <div class="dos">
          <div class="dos__card">
            ${face(d.cmd)}
            <div class="dos__artist">Art: ${esc(d.cmd.artist)}</div>
          </div>
          <div>
            <h3 class="dos__h">The deck</h3>
            <p class="dos__p">${esc(d.blurb)}</p>
            <h3 class="dos__h">How it plays</h3>
            <p class="dos__p">${esc(d.strategy)}</p>
            <h3 class="dos__h">Playstyle</h3>
            <div class="dos__tags">${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
            <div class="dos__bars" style="margin-top:10px">${bars(d.bars)}</div>
          </div>
        </div>
        <h3 class="dos__h">Cards that define it</h3>
        ${sigs}
        <h3 class="dos__h">Mana curve</h3>
        ${curve(d.curve)}
        ${honesty}
      </div>
      <div class="dlg__foot">
        <button class="play" data-act="pick-play" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>Play this deck</button>
        <button class="ghost" data-act="close">Close</button>
      </div>
    </div>
  </div>`;
}

function render() {
  root.innerHTML = `<div class="gate" data-testid="new-game">
    <header class="head">
      <span class="head__mark">Auto MTG</span>
      <span class="head__sub">Commander, against the engine</span>
      <span class="head__spacer"></span>
      <span class="head__ver">Command table</span>
    </header>
    <div class="body">
      ${leftRail()}
      ${hero()}
      ${rightRail()}
    </div>
  </div>
  ${dossier()}`;
}

/* --------------------------------------------------------------------------
 * Behaviour. One delegated click handler, one keydown, and one input listener
 * that deliberately does NOT re-render -- re-rendering on every keystroke would
 * blow away the caret.
 * ------------------------------------------------------------------------ */

root.addEventListener("input", (e) => {
  if (e.target.id === "mox") state.imp.url = e.target.value;
});

function runImport() {
  const url = state.imp.url.trim();
  if (!/^https?:\/\/(www\.)?moxfield\.com\/decks\/\S+/i.test(url)) {
    state.imp = { status: "error", url, msg: CUSTOM.errors.badUrl };
    render();
    return;
  }
  state.imp = { status: "fetching", url, msg: "" };
  render();
  // Canned. There is no network here and there never will be.
  setTimeout(() => {
    state.custom = CUSTOM.fake;
    state.deckId = CUSTOM.fake.id;
    state.imp = { status: "ready", url, msg: "" };
    render();
  }, 700);
}

root.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-act]");
  if (!hit) return;
  const act = hit.dataset.act;

  if (act === "close-bg" && e.target !== hit) return;   // clicks inside the dialog

  switch (act) {
    case "pick": state.deckId = hit.dataset.id; break;
    case "open": state.open = hit.dataset.id; break;
    case "close": case "close-bg": state.open = null; break;
    case "pick-play": state.deckId = hit.dataset.id; state.open = null; break;
    case "seats": setSeatCount(Number(hit.dataset.n)); break;
    case "tier":
      state.difficulty = hit.dataset.id;
      state.seats.forEach((s) => { delete s.tier; });   // the pod tier wins again
      break;
    case "seat-cycle": {
      const i = Number(hit.dataset.i);
      const cur = state.seats[i].tier || state.difficulty;
      const next = DIFFICULTY[(DIFFICULTY.findIndex((d) => d.id === cur) + 1) % DIFFICULTY.length];
      state.seats[i].tier = next.id;
      break;
    }
    case "seat-kind": toggleSeat(Number(hit.dataset.i)); break;
    case "fill": state.fillCpu = !state.fillCpu; break;
    case "copy":
      state.copied = true;
      setTimeout(() => { state.copied = false; render(); }, 1400);
      break;
    case "import": runImport(); return;
    case "play": {
      state.starting = true;
      render();
      setTimeout(() => { state.starting = false; render(); }, 1600);
      return;
    }
    default: return;
  }
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.open) { state.open = null; render(); return; }
});

render();
</script>
</body>
</html>
