<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Planar Gate (menu 05)</title>
<style>
/* ============================================================================
   PLANAR GATE -- the hero art is the layout
   ----------------------------------------------------------------------------
   THESIS. Every other screen in this app has gameplay to carry it. The menu has
   nothing to look at but itself, which makes it the one surface that can afford
   to be atmospheric -- and the one that currently is not. So: the selected
   commander's art fills the viewport, and every control floats on a scrim that
   grades to fully transparent, which is exactly what cards.css already does at
   card scale. Nothing here is in a box.

   THE BIG IDEA, stealable on its own: THE SCREEN TAKES THE DECK'S COLOUR. Two
   custom properties, --tint-a and --tint-b, are set from the selected deck's
   colour identity, and the wash over the art, the frame accents, the selected
   filmstrip frame and the seal ladder all read from them. Picking Edgar makes
   the room warm; picking First Flight makes it cold. It costs one variable swap
   per selection and it is the entire mood.

   THE TRADE, and it is the same one 05-planar-art.html made on the board: text
   over uncontrolled art luminance, and identity carried by hue. The controls
   hold up -- pips keep their letters, ratings and lamps are filled or hollow,
   the preview badge is dashed and says "Preview". The tint does not: it is the
   only thing telling the four decks apart, so the screen can say which deck is
   selected or which deck you are hovering, but never both at once. That is the
   verdict, and README.md states it rather than hiding it.

   Interactive: pick a deck from the filmstrip, open and close the codex (x,
   backdrop, Escape), change difficulty and opponents on the console, import a
   Moxfield deck into the empty frame, press Play.

   No build, no server, no network. Local ../art/*.jpg only.
   ========================================================================== */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-ink:#1a1a1a;

  --playable:#5ce08a; --danger:#ff5c5c; --gold:#ffd479;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  /* Swapped per selected deck. Defaults are the app's own violet. */
  --tint-a:#8f7fe8; --tint-b:#c3b6ff;

  --card-w:clamp(140px, 21vh, 210px);
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

.f-W { --f-hi:#f6eed4; --f-lo:#b9ad86; --fb:#d8cfa8; }
.f-U { --f-hi:#a9d2ec; --f-lo:#2f6a95; --fb:#4a86b8; }
.f-B { --f-hi:#b6aeac; --f-lo:#2e282b; --fb:#4c4550; }
.f-R { --f-hi:#f0a48b; --f-lo:#a4432f; --fb:#b8624a; }
.f-G { --f-hi:#a9cfa2; --f-lo:#2f6b41; --fb:#4e8a5c; }
.f-C { --f-hi:#d3d6da; --f-lo:#787e86; --fb:#8a8f96; }
.f-gold { --f-hi:#eed99c; --f-lo:#9c7a24; --fb:#b99a45; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
.tabular { font-variant-numeric:tabular-nums; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--edge); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* The stage ------------------------------------------------------------- */

.gate { display:grid; grid-template-rows:minmax(0,1fr) auto; height:100%; }
.stage { position:relative; min-height:0; overflow:hidden; }
/* ART RESOLUTION IS A HARD CEILING, AND IT IS WHY THIS SCREEN HAS A CARD ON IT.
 *
 * Scryfall's art_crop -- the only art-only asset it publishes -- is 626x457.
 * `large` and `png` are bigger but they are whole cards; the art band inside
 * them is ~655px, so there is nothing sharper to fetch anywhere. This stage is
 * the full viewport. Asking a 626px file to cover 1600px is a 2.56x upscale and
 * the first draft of this mockup looked exactly like that: the direction whose
 * entire argument is "the art is the layout" was the blurriest of the five.
 *
 * The argument survives, but it has to be made differently. The full-bleed layer
 * is blurred to 40px ON PURPOSE -- at that radius resolution stops existing and
 * the art becomes what it was always really doing here, which is lighting the
 * room in the deck's colour. The sharp thing on screen is then the commander
 * card itself, drawn at ~250px where a 626px crop is downscaled 0.4x. You get
 * the mood from the wall and the detail from the card, and neither is upscaled.
 */
.stage__art {
  position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover;
  object-position:50% 34%; z-index:0;
  /* 22px is the setting worth arguing about. Below ~16px the 2.56x upscale
     starts to show as mush; above ~30px the art stops having silhouettes and
     the screen is just a coloured gradient, which loses the atmosphere this
     whole direction is spending itself on. 22px keeps the shapes and hides the
     pixels. */
  filter:blur(22px) saturate(1.3) brightness(.72); transform:scale(1.06);
}
/* The one crisp object: the commander, at a size the crop can actually carry. */
.stage__card {
  --card-w:clamp(168px, 24vh, 252px);
  align-self:end; justify-self:center; min-width:0;
  display:grid; gap:9px; justify-items:center;
}
.stage__artist { font-size:9.5px; color:var(--text-dim); text-shadow:0 1px 4px rgba(0,0,0,.95); }
/* The wash. Two deck-tinted passes over the art, then the scrim that makes the
   bottom of the frame readable -- graded to fully transparent at the top, never
   a hard edge. */
.stage__tint {
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(155deg, var(--wash-a) 0%, transparent 52%),
    radial-gradient(90% 74% at 50% 108%, var(--wash-b) 0%, transparent 66%),
    linear-gradient(0deg, rgba(9,8,20,.95) 0%, rgba(9,8,20,.78) 24%, rgba(9,8,20,.34) 52%, rgba(9,8,20,.06) 74%, rgba(9,8,20,.42) 100%);
}
.stage__inner {
  position:relative; z-index:2; height:100%; min-height:0;
  display:grid; grid-template-columns:minmax(0,1fr) auto 340px; gap:28px;
  align-items:end; padding:22px 30px 24px;
}

.mark {
  position:absolute; top:22px; left:30px; z-index:3;
  display:flex; align-items:baseline; gap:12px;
}
.mark__n { font-size:18px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); text-shadow:0 2px 10px rgba(0,0,0,.9); }
.mark__s { font-size:11px; color:var(--text-dim); letter-spacing:.05em; text-shadow:0 1px 4px rgba(0,0,0,.95); }

/* The standing text ------------------------------------------------------ */

.plate { min-width:0; max-width:66ch; }
.plate__eyebrow {
  font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
  color:var(--tint-b); text-shadow:0 1px 4px rgba(0,0,0,.95);
}
.plate__name {
  margin:6px 0 0; font-size:clamp(28px, 5vh, 52px); font-weight:800; line-height:1.05;
  letter-spacing:.005em; text-shadow:0 3px 18px rgba(0,0,0,.9);
}
.plate__cmd { margin:6px 0 0; font-size:13px; color:var(--text-dim); text-shadow:0 1px 4px rgba(0,0,0,.95); }
.plate__line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; }
.plate__blurb { margin:12px 0 0; font-size:13px; line-height:1.6; color:var(--text-dim); text-shadow:0 1px 4px rgba(0,0,0,.95); }
.plate__acts { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.plate__bars { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:14px; }

/* The console ------------------------------------------------------------ */

.console {
  min-width:0; justify-self:end; width:340px;
  border:1px solid var(--edge); border-radius:14px;
  background:rgba(11,10,22,.72); backdrop-filter:blur(6px);
  box-shadow:var(--pane-shadow); padding:14px;
}
.console__label {
  font-size:9.5px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--text-faint);
}
.console__hr { height:1px; margin:13px 0; background:var(--edge); }

/* The seal ladder. Four notches; the lit one carries the deck's tint. */
.seal { display:flex; align-items:center; gap:10px; width:100%; padding:6px 4px; text-align:left; }
.seal__disc {
  position:relative; width:26px; height:26px; flex:none; border-radius:999px;
  border:1px solid var(--edge-hi); background:rgba(13,12,28,.8);
  display:grid; place-items:center; font-size:10px; font-weight:800; color:var(--text-faint);
}
.seal--on .seal__disc {
  border-color:var(--tint-b); color:#160f28;
  background:radial-gradient(circle at 34% 28%, #fff, var(--tint-b) 62%, var(--tint-a));
  box-shadow:0 0 16px var(--wash-glow);
}
.seal__main { min-width:0; flex:1; }
.seal__n { font-size:12.5px; font-weight:700; color:var(--text-dim); }
.seal--on .seal__n { color:var(--text); }
.seal__tag { font-size:10px; color:var(--text-faint); margin-left:6px; font-weight:500; }
.seal__line { margin:6px 4px 0; font-size:11px; line-height:1.5; color:var(--text-dim); }

.seats { display:flex; gap:6px; margin-top:8px; }
.chair {
  flex:1; padding:9px 6px; border:1px solid var(--edge); border-radius:9px;
  background:rgba(13,12,28,.6); color:var(--text-dim); font-size:11.5px; font-weight:650;
  display:grid; gap:3px; justify-items:center;
}
.chair:hover { border-color:var(--edge-hi); color:var(--text); }
.chair--on { border-color:var(--tint-b); color:var(--text); box-shadow:0 0 0 1px var(--wash-ring); }
.chair__glyph { font-size:13px; letter-spacing:-.08em; }

/* One line per chair: who is in it and what they are holding. Dashed for an
   open seat, because dashed means not-here everywhere else in this app too. */
.pews { display:grid; gap:5px; margin-top:8px; }
.pew {
  display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center;
  padding:7px 9px; border:1px solid var(--edge); border-radius:8px; background:rgba(13,12,28,.55);
}
.pew--open { border-style:dashed; border-color:var(--edge-hi); }
.pew--human { border-color:rgba(92,224,138,.42); }
.pew__n { font-size:11.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pew__d { font-size:10.5px; color:var(--text-faint); white-space:nowrap; }
.pew__b {
  padding:3px 8px; border:1px solid var(--edge-hi); border-radius:6px;
  font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--text-dim);
}
.pew__b:hover { border-color:var(--tint-b); color:var(--text); }

.room { display:flex; align-items:center; gap:8px; margin-top:10px; }
.room__code { font-size:14px; font-weight:800; letter-spacing:.1em; color:var(--tint-b); }

.toggle {
  display:flex; align-items:center; gap:8px; width:100%; margin-top:8px; padding:8px 10px;
  border:1px solid var(--edge); border-radius:8px; background:rgba(13,12,28,.55);
  color:var(--text-dim); font-size:11.5px; font-weight:600; text-align:left;
}
.toggle:hover { border-color:var(--edge-hi); color:var(--text); }
.toggle--on { border-color:var(--tint-b); color:var(--text); }
.toggle__box {
  width:15px; height:15px; flex:none; display:grid; place-items:center; border-radius:4px;
  border:1px solid var(--edge-hi); font-size:10px; font-style:normal; color:#160f28;
}
.toggle--on .toggle__box { background:var(--tint-b); border-color:var(--tint-b); }

.play {
  display:block; width:100%; margin-top:13px; padding:14px 16px; border-radius:11px;
  background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05;
  font-size:15px; font-weight:800; letter-spacing:.04em;
  box-shadow:0 4px 0 #7d5310, 0 0 26px rgba(224,166,63,.28);
}
.play:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 26px rgba(224,166,63,.28); }
.play:disabled { opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #4a3a18; }
.console__why { margin:9px 2px 0; font-size:10.5px; line-height:1.45; color:var(--text-faint); text-align:center; }

/* The filmstrip ---------------------------------------------------------- */

.film {
  display:flex; align-items:stretch; gap:10px; padding:12px 30px 16px;
  border-top:1px solid var(--edge); background:rgba(8,7,18,.82);
}
.frame {
  position:relative; width:clamp(128px, 12vw, 178px); flex:none; overflow:hidden;
  border:1px solid var(--edge); border-radius:10px; background:var(--pane-well);
  text-align:left; color:var(--text); transition:transform 140ms, border-color 140ms;
}
.frame:hover { transform:translateY(-3px); border-color:var(--edge-hi); }
.frame--on { border-color:var(--tint-b); box-shadow:0 0 0 1px var(--wash-ring), 0 10px 26px rgba(0,0,0,.5); }
.frame__art { display:block; width:100%; height:clamp(52px, 7vh, 76px); object-fit:cover; object-position:50% 28%; }
.frame__body { padding:7px 9px 8px; }
.frame__n { font-size:11.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.frame__meta { display:flex; align-items:center; gap:4px; margin-top:5px; }
.frame__badge { position:absolute; top:6px; right:6px; }

/* Dashed means not-here. The custom slot is a hole in the strip until it isn't. */
.frame--empty {
  display:grid; place-items:center; gap:5px; padding:12px 8px;
  border-style:dashed; border-color:var(--edge-hi); background:rgba(13,12,28,.45);
  color:var(--text-dim); font-size:11.5px; font-weight:650;
}
.frame--empty:hover { border-color:var(--tint-b); color:var(--text); }
.frame__plus { font-size:19px; line-height:1; color:var(--text-faint); }

.film__spacer { flex:1; }
.film__hint { align-self:center; font-size:10.5px; color:var(--text-faint); text-align:right; max-width:26ch; line-height:1.45; }

/* Import bar ------------------------------------------------------------- */

.impbar {
  display:flex; align-items:center; gap:10px; padding:11px 30px;
  border-top:1px solid var(--edge); background:rgba(13,12,28,.9);
}
.impbar__label { font-size:9.5px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--text-faint); flex:none; }
.impbar__input {
  flex:1; min-width:0; padding:8px 11px; border:1px solid var(--edge); border-radius:8px;
  background:rgba(8,7,18,.8); color:var(--text); font-size:12.5px;
}
.impbar__input::placeholder { color:var(--text-faint); }
.impbar__input:focus { outline:none; border-color:var(--tint-b); }
.impbar__note { flex:none; font-size:11px; color:var(--text-faint); max-width:38ch; }
.impbar__note--err { color:var(--danger); }
.impbar__note--busy { color:var(--tint-b); }

/* Shared vocabulary ------------------------------------------------------ */

.btn {
  padding:9px 15px; border:1px solid var(--edge-hi); border-radius:8px;
  background:rgba(20,19,40,.6); color:var(--text); font-size:12.5px; font-weight:650; white-space:nowrap;
}
.btn:hover { border-color:var(--tint-b); }
.ghost { padding:9px 14px; border-radius:7px; color:var(--text-faint); font-size:13px; font-weight:500; }
.ghost:hover { color:var(--text); }

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 4px; border-radius:999px;
  font-size:10px; font-weight:800; font-style:normal; color:var(--mana-ink);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W { background:var(--mana-W); } .pip--U { background:var(--mana-U); }
.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }

.chip {
  padding:3px 8px; border:1px solid var(--edge-hi); border-radius:999px;
  font-size:10px; font-weight:650; color:var(--text-dim); background:rgba(9,8,20,.55);
}
.count { font-size:11px; color:var(--text-dim); text-shadow:0 1px 3px rgba(0,0,0,.9); }
.badge {
  padding:2px 7px; border:1px dashed var(--edge-hi); border-radius:999px;
  font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-dim); background:rgba(9,8,20,.66);
}
.badge--partial { border-style:solid; border-color:rgba(255,212,121,.55); color:var(--gold); }

.bar { display:flex; align-items:center; gap:7px; }
.bar__label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); min-width:88px; }
.bar__track { display:flex; gap:2px; }
.bar__seg { width:13px; height:5px; border-radius:2px; border:1px solid var(--edge-hi); background:transparent; }
.bar__seg--on { background:var(--text-dim); border-color:var(--text-dim); }

.lamps { display:inline-flex; gap:3px; }
.lamp { width:7px; height:7px; border-radius:999px; border:1px solid var(--edge-hi); }
.lamp--on { background:var(--text-dim); border-color:var(--text-dim); }

/* Card face, art bleed (frontend/src/styles/cards.css) -------------------- */

.face {
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; overflow:hidden;
  border-radius:var(--card-r); border:2px solid var(--fb);
  background:linear-gradient(160deg, var(--f-hi), var(--f-lo));
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 24px rgba(0,0,0,.5);
  color:#fff; flex:none;
}
.face__art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.face__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152; }
.face__head, .face__foot { position:relative; z-index:2; padding:6px 7px; }
.face__head { background:linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.57) 55%, rgba(0,0,0,0)); }
.face__foot { background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.71) 58%, rgba(0,0,0,0)); }
.face__title { display:flex; align-items:flex-start; gap:5px; }
.face__name { flex:1; font-size:11px; font-weight:750; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.85); }
.face__cost { display:flex; gap:2px; flex:none; }
.face__type { margin-top:3px; font-size:8.5px; color:rgba(255,255,255,.86); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__rules {
  margin:0 0 5px; font-size:8.5px; line-height:1.38; color:rgba(255,255,255,.92);
  text-shadow:0 1px 2px rgba(0,0,0,.85);
  display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
}
.face__base { display:flex; align-items:flex-end; gap:6px; }
.face__kw { flex:1; font-size:8.5px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__pt { font-size:12px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.9); }

/* The codex -- the dossier, as a page rising over the art ----------------- */

.scrim {
  position:fixed; inset:0; z-index:500; display:grid; place-items:center; padding:24px;
  background:rgba(6,5,16,.78); backdrop-filter:blur(4px);
}
.codex {
  display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr);
  width:min(1020px, 95vw); max-height:min(860px, 92vh); min-height:0; overflow:hidden;
  border:1px solid var(--edge); border-radius:16px;
  background:linear-gradient(180deg,#1b1936,#0d0c1c); box-shadow:0 30px 90px rgba(0,0,0,.8);
}
.codex__left {
  position:relative; min-width:0; overflow:hidden;
  display:grid; align-content:end; gap:10px; padding:18px;
  border-right:1px solid var(--edge);
}
/* Same ceiling, same answer: this column is ~300x860, so covering it would be a
   1.9x upscale. It is blurred and the card in front of it is the sharp object. */
.codex__leftart {
  position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; object-position:50% 30%; z-index:0;
  filter:blur(26px) saturate(1.15) brightness(.66);
}
.codex__leftscrim {
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(0deg, rgba(9,8,20,.97) 0%, rgba(9,8,20,.82) 34%, rgba(9,8,20,.3) 66%, rgba(9,8,20,.55) 100%);
}
.codex__card { position:relative; z-index:2; justify-self:center; }
.codex__artist { position:relative; z-index:2; font-size:9.5px; color:var(--text-faint); text-align:center; }
.codex__right { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0; min-width:0; }

.codex__head { display:flex; align-items:center; gap:10px; padding:15px 18px 13px; border-bottom:1px solid var(--edge); }
.codex__name { font-size:18px; font-weight:800; min-width:0; }
.codex__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); flex:none; }
.codex__x:hover { border-color:var(--edge-hi); color:var(--text); }
.codex__body { min-height:0; overflow:auto; padding:16px 18px; }
.codex__foot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--edge); }
.codex__foot .play { width:auto; margin:0; padding:11px 22px; font-size:14px; }

.dos__h { margin:16px 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.dos__h:first-child { margin-top:0; }
.dos__p { margin:0; font-size:12.5px; line-height:1.6; color:var(--text-dim); }
.dos__tags { display:flex; flex-wrap:wrap; gap:6px; }
.dos__bars { display:grid; gap:5px; margin-top:10px; }
.dos__sigs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:9px; }

.sig__n { font-size:11.5px; font-weight:700; }
.sig__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); margin-top:2px; }

.curve__cols { display:flex; align-items:flex-end; gap:4px; height:56px; }
.curve__bar { flex:1; background:var(--text-faint); border-radius:2px 2px 0 0; min-height:2px; }
.curve__axis { display:flex; gap:4px; margin-top:4px; }
.curve__n { flex:1; text-align:center; font-size:9px; color:var(--text-faint); }

  padding:14px; border:1px dashed var(--edge-hi); border-radius:9px;

}

}

const CUSTOM = {
  placeholder: "https://moxfield.com/decks/...",
  hint: "Paste a public Moxfield deck link.",
  fake: {
    id: "custom-vorel", name: "Vorel of the Hull Clade", short: "Vorel",

const OPPONENTS = [1, 2, 3];

/* Rooms.
 *
 * docs/roadmap.md's backlog asks for "multiplayer online support using a basic
 * system of rooms and room codes". It does not need a second screen, and giving
 * it one is how products end up with two menus. It needs one new idea: a seat
 * has a KIND -- cpu, open (holding the code, waiting for a person), or human.
 * All-CPU, all-human and mixed pods are then the same screen with different
 * seats in it, and "fill empty chairs with CPU" is both the partial-pod case
 * and backfill-on-disconnect.
 */
const ROOM = {
  code: "GYRE-8412",
  // Canned. Opening a chair invites one scripted player who arrives and then
  // locks in; there is no network in a mockup and there never will be.
  guest: { name: "Priya", deckId: "edgar" },
  joinMs: 1200,
  readyMs: 2600,
};

/* --------------------------------------------------------------------------
 * Primitives (shared with the other four menu mockups)
 * ------------------------------------------------------------------------ */

const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (slug) => "../art/" + slug + ".jpg";

function pips(cost) {
  if (!cost) return "";
  const out = [];
  let num = "";
  for (const ch of String(cost)) {
    if (ch >= "0" && ch <= "9") { num += ch; continue; }
    if (num) { out.push(`<i class="pip pip--C">${num}</i>`); num = ""; }
    out.push(`<i class="pip pip--${ch}">${ch}</i>`);
  }
  if (num) out.push(`<i class="pip pip--C">${num}</i>`);
  return out.join("");
}
const ciPips = (ci) => ci.map((c) => `<i class="pip pip--${c}">${c}</i>`).join("");

function bar(label, value) {
  let segs = "";
  for (let i = 1; i <= 4; i += 1) segs += `<i class="bar__seg${i <= value ? " bar__seg--on" : ""}"></i>`;
  return `<div class="bar"><span class="bar__label">${esc(label)}</span><span class="bar__track">${segs}</span></div>`;
}
const bars = (b) => BAR_LABELS.map(([k, l]) => bar(l, b[k])).join("");
const lamps = (caps) =>
  `<span class="lamps">${CAPS.map((c) => `<i class="lamp${caps.includes(c.id) ? " lamp--on" : ""}" title="${esc(c.n)}"></i>`).join("")}</span>`;
const tierOf = (id) => DIFFICULTY.find((d) => d.id === id);
const subtitle = (d) => (d.cmd.n === d.name ? `${d.guild} · ${d.tags[0].toLowerCase()}` : d.cmd.n);

function face(c) {
  const media = c.art
    ? `<img class="face__art" src="${artUrl(c.art)}" alt="">`
    : `<div class="face__art face__art--none"></div>`;
  return `<div class="face f-${c.f || "C"}">
    ${media}
    <div class="face__head">
      <div class="face__title"><span class="face__name">${esc(c.n)}</span><span class="face__cost">${pips(c.cost)}</span></div>
      <div class="face__type">${esc(c.tl)}</div>
    </div>
    <div class="face__foot">
      ${c.rules ? `<p class="face__rules">${esc(c.rules)}</p>` : ""}
      <div class="face__base"><span class="face__kw">${esc(c.kw || "")}</span>${c.pt ? `<span class="face__pt tabular">${c.pt}</span>` : ""}</div>
    </div>
  </div>`;
}

function curve(values) {
  if (!values) return `<div class="curve__none">No deck list yet — the curve arrives with engine support for these cards.</div>`;
  const max = Math.max(...values);
  const label = (i) => `${i + 1}${i === 6 ? "+" : ""}`;
  const cols = values.map((v, i) => `<span class="curve__bar" style="height:${Math.round((v / max) * 100)}%" title="${v} cards at ${label(i)} mana"></span>`).join("");
  const axis = values.map((v, i) => `<span class="curve__n tabular">${label(i)}</span>`).join("");
  return `<div class="curve"><div class="curve__cols">${cols}</div><div class="curve__axis">${axis}</div></div>`;
}

function engineBadge(deck) {
  if (deck.engine === "preview") return `<span class="badge">Preview</span>`;
  if (deck.engine === "partial") return `<span class="badge badge--partial">${deck.unsupported} unsupported</span>`;
  return "";
}

/* --------------------------------------------------------------------------
 * The tint. This is the direction's whole argument, and it is four lines.
 * A deck's colour identity picks two mana colours; those become the wash over
 * the art, the lit seal, the selected frame and the accent text.
 * ------------------------------------------------------------------------ */

const MANA = { W: "#fffbd5", U: "#aae0fa", B: "#cbc2bf", R: "#f9aa8f", G: "#9bd3ab", C: "#d5d5d5" };
const rgba = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
};
function tintVars(deck) {
  const a = MANA[deck.ci[0]] || "#8f7fe8";
  const b = MANA[deck.ci[deck.ci.length - 1]] || "#c3b6ff";
  return `--tint-a:${a}; --tint-b:${b}; --wash-a:${rgba(a, 0.2)}; --wash-b:${rgba(b, 0.16)};` +
         ` --wash-ring:${rgba(b, 0.5)}; --wash-glow:${rgba(b, 0.45)};`;
}

/* --------------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------------ */

const state = {
  deckId: "aesi",
  seats: [{ kind: "cpu" }, { kind: "cpu", tier: "duelist" }],
  fillCpu: true,
  difficulty: "apprentice",
  open: null,
  impOpen: false,
  imp: { status: "idle", url: "", msg: "" },
  custom: null,
  starting: false,
};

const allDecks = () => (state.custom ? PRECONS.concat([state.custom]) : PRECONS.slice());
const deckById = (id) => allDecks().find((d) => d.id === id) || null;
const selected = () => deckById(state.deckId);

/* Seats ------------------------------------------------------------------ */

let joinToken = 0;

const podSize = () => state.seats.length + 1;
const openSeats = () => state.seats.filter((s) => s.kind === "open").length;
const roomLive = () => state.seats.some((s) => s.kind !== "cpu");
const filledSeats = () => podSize() - openSeats();
const canStart = () => openSeats() === 0 || state.fillCpu;
/** A CPU seat follows the pod's tier unless it has been given its own. */
const seatTier = (i) => tierOf(state.seats[i].tier || state.difficulty);

function setSeatCount(n) {
  while (state.seats.length > n) state.seats.pop();
  while (state.seats.length < n) state.seats.push({ kind: "cpu" });
}

/** Flip a chair between a CPU and an open seat holding the room code. Opening
 *  one runs the canned join: a person arrives, then locks their deck in. */
function toggleSeat(i) {
  if (state.seats[i].kind === "cpu") {
    state.seats[i] = { kind: "open" };
    const token = ++joinToken;
    setTimeout(() => {
      if (token !== joinToken || !state.seats[i] || state.seats[i].kind !== "open") return;
      state.seats[i] = { kind: "human", name: ROOM.guest.name, deckId: ROOM.guest.deckId, ready: false };
      render();
      setTimeout(() => {
        if (token !== joinToken || !state.seats[i] || state.seats[i].kind !== "human") return;
        state.seats[i].ready = true;
        render();
      }, ROOM.readyMs - ROOM.joinMs);
    }, ROOM.joinMs);
  } else {
    state.seats[i] = { kind: "cpu" };
  }
}

/** What a seat is holding, or null when it is not knowable yet.
 *
 *  CPU opponents cycle through the other decks, exactly as NewGameScreen.tsx
 *  :44-46 really does -- so the seats are reporting behaviour, not inventing
 *  it. Preview decks are excluded: a deck the engine cannot deal cannot be
 *  dealt to an opponent either.
 *
 *  A HUMAN's deck is sealed until they lock in. Reading a list before the game
 *  is scouting, and scouting before mulligans is what a lobby hides. */
function seatDeck(i) {
  const s = state.seats[i];
  if (s.kind === "open") return null;
  if (s.kind === "human") return s.ready ? deckById(s.deckId) : null;
  // Skip decks already spoken for -- yours, and any a joined player locked in.
  // Falling back twice is not defensive coding, it is the real situation: with
  // two playable decks and three opponents a duplicate is unavoidable, and
  // docs/playtest-feedback-01.md:202 has been saying so for three cycles.
  const taken = new Set([state.deckId, ...state.seats.filter((x) => x.kind === "human" && x.ready).map((x) => x.deckId)]);
  const live = allDecks().filter((d) => d.engine !== "preview");
  const pool = live.filter((d) => !taken.has(d.id))
    || [];
  const fallback = live.filter((d) => d.id !== state.deckId);
  const chosen = pool.length ? pool : (fallback.length ? fallback : live);
  return chosen.length ? chosen[i % chosen.length] : allDecks()[0];
}


/** The second line of a seat chip. The sealed/locked-in state has to be visible
 *  in every mockup, not only the ones with room for a paragraph -- it is a rule
 *  about what you are allowed to know, and a rule nobody can see is not a rule. */
function seatSub(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  if (s.kind === "cpu") return d ? d.short : "—";
  if (s.kind === "open") return "invite";
  return s.ready ? `${d.short} · locked in` : "choosing a deck…";
}

/** The two lines a seat shows, whatever the skin around it. */
function seatLabel(i) {
  const s = state.seats[i];
  if (s.kind === "open") return { title: "Open chair", sub: "Waiting for a player" };
  if (s.kind === "human") return { title: s.name, sub: s.ready ? "Locked in" : "Choosing a deck…" };
  const t = seatTier(i);
  return { title: t.n, sub: t.tag };
}

function playLabel(idle) {
  if (state.starting) return "Shuffling…";
  if (!roomLive()) return idle;
  if (!canStart()) return `Waiting · ${filledSeats()} of ${podSize()}`;
  return `Start · ${filledSeats()} of ${podSize()} seats`;
}

/* --------------------------------------------------------------------------
 * Views
 * ------------------------------------------------------------------------ */

function plate() {
  const d = selected();
  if (!d) return `<div class="plate"></div>`;
  const kind = d.engine === "partial" ? "Imported deck" : d.engine === "preview" ? "Precon · preview" : "Precon";
  return `<div class="plate">
    <div class="plate__eyebrow">${esc(d.guild)} · ${kind}</div>
    <h1 class="plate__name">${esc(d.name)}</h1>
    <p class="plate__cmd">${d.cmd.n === d.name ? esc(d.cmd.tl) : esc(d.cmd.n) + " — " + esc(d.cmd.tl)}</p>
    <div class="plate__line">
      ${ciPips(d.ci)}
      <span class="count tabular">${d.cards} cards</span>
      ${d.lands ? `<span class="count tabular">${d.lands} lands</span>` : ""}
      ${engineBadge(d)}
      ${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
    </div>
    <p class="plate__blurb">${esc(d.blurb)}</p>
    <div class="plate__bars">${bars(d.bars)}</div>
    <div class="plate__acts">
      <button class="btn" data-act="open" data-id="${d.id}">Read the codex</button>
    </div>
  </div>`;
}

function consolePane() {
  const d = selected();
  const tier = tierOf(state.difficulty);
  const blocked = !d || d.engine === "preview" || !canStart();
  return `<aside class="console">
    <div class="console__label">How well they play</div>
    ${DIFFICULTY.map((t, i) => `<button class="seal${t.id === state.difficulty ? " seal--on" : ""}" data-act="tier" data-id="${t.id}">
      <span class="seal__disc">${i + 1}</span>
      <span class="seal__main"><span class="seal__n">${esc(t.n)}</span><span class="seal__tag">${esc(t.tag)}</span></span>
      ${lamps(t.caps)}
    </button>`).join("")}
    <p class="seal__line">${esc(tier.line)}</p>

    <div class="console__hr"></div>

    <div class="console__label">Who is at the gate</div>
    <div class="seats">
      ${OPPONENTS.map((n) => `<button class="chair${n === state.seats.length ? " chair--on" : ""}" data-act="seats" data-n="${n}" data-testid="opponents-${n}">
        <span class="chair__glyph">${"◆".repeat(n)}</span><span>${n}</span>
      </button>`).join("")}
    </div>
    <div class="pews">
      ${state.seats.map((s, i) => {
        const seatD = seatDeck(i);
        const lab = seatLabel(i);
        return `<div class="pew pew--${s.kind}">
          <span class="pew__n">${esc(lab.title)}</span>
          <span class="pew__d">${esc(seatSub(i))}</span>
          <button class="pew__b" data-act="seat-kind" data-i="${i}"
                  title="${s.kind === "cpu" ? "Open this chair to a player" : "Put a CPU back in this chair"}">
            ${s.kind === "cpu" ? "invite" : "CPU"}
          </button>
        </div>`;
      }).join("")}
    </div>
    ${roomLive() ? `<div class="room">
      <span class="console__label">Room</span>
      <b class="room__code tabular">${ROOM.code}</b>
      <button class="pew__b" data-act="copy">${state.copied ? "copied" : "copy"}</button>
    </div>
    <button class="toggle${state.fillCpu ? " toggle--on" : ""}" data-act="fill">
      <i class="toggle__box">${state.fillCpu ? "✓" : ""}</i>Fill empty chairs with CPU
    </button>` : ""}

    <button class="play" data-act="play" data-testid="start-game" ${blocked || state.starting ? "disabled" : ""}>
      ${playLabel("Open the gate")}
    </button>
    <p class="console__why">${
      !d || d.engine === "preview" ? "This precon has no deck list in the engine yet."
      : !canStart() ? `${openSeats()} chair${openSeats() > 1 ? "s" : ""} still open — share the code, or let CPUs fill them.`
      : `${esc(d.short)} · ${podSize()}-player pod · seed from ?seed=`
    }</p>
  </aside>`;
}

function frame(deck) {
  const on = deck.id === state.deckId;
  return `<button class="frame${on ? " frame--on" : ""}" data-act="pick" data-id="${deck.id}" data-testid="deck-${deck.id}">
    <img class="frame__art" src="${artUrl(deck.cmd.art)}" alt="">
    <span class="frame__badge">${engineBadge(deck)}</span>
    <span class="frame__body">
      <span class="frame__n">${esc(deck.name)}</span>
      <span class="frame__meta">${ciPips(deck.ci)}<span class="count tabular">${deck.cards}</span></span>
    </span>
  </button>`;
}

function film() {
  return `<div class="film">
    ${PRECONS.map(frame).join("")}
    ${state.custom ? frame(state.custom) : ""}
    <button class="frame frame--empty${state.impOpen ? " frame--on" : ""}" data-act="import-open">
      <span class="frame__plus">+</span>
      <span>${state.custom ? "Import another" : "Your own deck"}</span>
    </button>
    <span class="film__spacer"></span>
    <span class="film__hint">Four precons ship with the game. Anything else comes in from Moxfield.</span>
  </div>`;
}

function impbar() {
  if (!state.impOpen) return "";
  const { status, msg } = state.imp;
  let note = `<span class="impbar__note">${esc(CUSTOM.hint)}</span>`;
  if (status === "fetching") note = `<span class="impbar__note impbar__note--busy">Reading the list…</span>`;
  if (status === "error") note = `<span class="impbar__note impbar__note--err">${esc(msg)}</span>`;
  if (status === "ready") note = `<span class="impbar__note">Imported. ${CUSTOM.fake.unsupported} cards are not in the engine yet and were left out.</span>`;
  return `<div class="impbar">
    <span class="impbar__label">Moxfield</span>
    <input class="impbar__input" id="mox" type="text" value="${esc(state.imp.url)}"
           placeholder="${esc(CUSTOM.placeholder)}" spellcheck="false" aria-label="Moxfield deck link">
    <button class="btn" data-act="import">Import</button>
    <button class="ghost" data-act="import-close">Cancel</button>
    ${note}
  </div>`;
}

function codex() {
  if (!state.open) return "";
  const d = deckById(state.open);
  if (!d) return "";
  const sigs = d.signature.length
    ? `<div class="dos__sigs">${d.signature.map((s) => `<div class="sig">
        <img class="sig__art" src="${artUrl(s.art)}" alt="">
        <div><div class="sig__n">${esc(s.n)}</div><div class="sig__why">${esc(s.why)}</div></div>
      </div>`).join("")}</div>`
    : `<p class="dos__p">An imported deck brings no editorial notes with it.</p>`;
  const honesty = d.engine === "preview"
    ? `<div class="note">Preview. These cards are not in the engine yet, so this deck cannot be dealt. It is here because the menu has to be able to show it before "All Card Support" lands.</div>`
    : d.engine === "partial"
      ? `<div class="note">${d.unsupported} of the imported cards use rules the engine does not implement and were dropped from the list.</div>`
      : `<div class="note">${esc(d.swapNote)}</div>`;

  return `<div class="scrim" data-act="close-bg">
    <div class="codex" role="dialog" aria-modal="true" aria-label="${esc(d.name)}" style="${tintVars(d)}">
      <div class="codex__left">
        <img class="codex__leftart" src="${artUrl(d.cmd.art)}" alt="">
        <div class="codex__leftscrim"></div>
        <div class="codex__card">${face(d.cmd)}</div>
        <div class="codex__artist">Art: ${esc(d.cmd.artist)}</div>
      </div>
      <div class="codex__right">
        <div class="codex__head">
          <span class="codex__name">${esc(d.name)}</span>
          ${ciPips(d.ci)}
          <span class="count tabular">${d.cards} cards</span>
          ${engineBadge(d)}
          <button class="codex__x" data-act="close" aria-label="Close">✕</button>
        </div>
        <div class="codex__body">
          <h3 class="dos__h">The deck</h3>
          <p class="dos__p">${esc(d.blurb)}</p>
          <h3 class="dos__h">How it plays</h3>
          <p class="dos__p">${esc(d.strategy)}</p>
          <h3 class="dos__h">Playstyle</h3>
          <div class="dos__tags">${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
          <div class="dos__bars">${bars(d.bars)}</div>
          <h3 class="dos__h">Cards that define it</h3>
          ${sigs}
          <h3 class="dos__h">Mana curve</h3>
          ${curve(d.curve)}
          ${honesty}
        </div>
        <div class="codex__foot">
          <button class="play" data-act="pick-play" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>Play this deck</button>
          <button class="ghost" data-act="close">Close</button>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const d = selected();
  root.innerHTML = `<div class="gate" data-testid="new-game" style="${d ? tintVars(d) : ""}">
    <div class="stage">
      ${d ? `<img class="stage__art" src="${artUrl(d.cmd.art)}" alt="">` : ""}
      <div class="stage__tint"></div>
      <div class="mark"><span class="mark__n">Auto MTG</span><span class="mark__s">Commander, against the engine</span></div>
      <div class="stage__inner">
        ${plate()}
        ${d ? `<div class="stage__card">${face(d.cmd)}<span class="stage__artist">Art: ${esc(d.cmd.artist)}</span></div>` : "<div></div>"}
        ${consolePane()}
      </div>
    </div>
    ${impbar()}
    ${film()}
  </div>
  ${codex()}`;
}

/* --------------------------------------------------------------------------
 * Behaviour
 * ------------------------------------------------------------------------ */

root.addEventListener("input", (e) => {
  if (e.target.id === "mox") state.imp.url = e.target.value;
});

function runImport() {
  const url = state.imp.url.trim();
  if (!/^https?:\/\/(www\.)?moxfield\.com\/decks\/\S+/i.test(url)) {
    state.imp = { status: "error", url, msg: CUSTOM.errors.badUrl };
    render();
    return;
  }
  state.imp = { status: "fetching", url, msg: "" };
  render();
  // Canned. There is no network here and there never will be.
  setTimeout(() => {
    state.custom = CUSTOM.fake;
    state.deckId = CUSTOM.fake.id;
    state.imp = { status: "ready", url, msg: "" };
    state.impOpen = false;
    render();
  }, 700);
}

root.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-act]");
  if (!hit) return;
  const act = hit.dataset.act;
  if (act === "close-bg" && e.target !== hit) return;

  switch (act) {
    case "pick": state.deckId = hit.dataset.id; break;
    case "open": state.open = hit.dataset.id; break;
    case "close": case "close-bg": state.open = null; break;
    case "pick-play": state.deckId = hit.dataset.id; state.open = null; break;
    case "seats": setSeatCount(Number(hit.dataset.n)); break;
    case "tier":
      state.difficulty = hit.dataset.id;
      state.seats.forEach((s) => { delete s.tier; });
      break;
    case "seat-kind": toggleSeat(Number(hit.dataset.i)); break;
    case "fill": state.fillCpu = !state.fillCpu; break;
    case "copy":
      state.copied = true;
      setTimeout(() => { state.copied = false; render(); }, 1400);
      break;
    case "import-open": state.impOpen = true; break;
    case "import-close": state.impOpen = false; state.imp = { status: "idle", url: "", msg: "" }; break;
    case "import": runImport(); return;
    case "play": {
      state.starting = true;
      render();
      setTimeout(() => { state.starting = false; render(); }, 1600);
      return;
    }
    default: return;
  }
  render();
  if (act === "import-open") document.getElementById("mox").focus();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.open) { state.open = null; render(); return; }
    if (state.impOpen) { state.impOpen = false; render(); return; }
  }
});

render();
</script>
</body>
</html>
