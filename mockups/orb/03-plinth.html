<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player orb — Plinth (orb 03)</title>
<style>
/* ============================================================================
   PLINTH -- the commander is not in the panel, the commander IS the panel
   ----------------------------------------------------------------------------
   THESIS. CommandZone.tsx opens by saying the commander is "the card the deck is
   built around", and then draws it as one 80px band among five stacked blocks in
   a grey well. This direction takes that sentence literally. The art becomes the
   panel's ground -- blurred, scrimmed, tinted to the deck's colour identity --
   and everything else floats on it. Every seat then looks different from every
   other seat at a glance, which is the one thing a four-player pod actually
   needs and the only thing the current orb cannot do: today four orbs are four
   identical grey rectangles distinguished by a name in 12px type.

   THE BIG IDEA, stealable on its own: THE LIFE SEAL. The dial stops being a
   block in a stack and becomes a brass seal stamped over the portrait's lower
   right, half on the art and half off it. It costs no row of its own -- it lives
   in the overlap -- and it puts the two things you hunt for, "who am I" and "how
   am I doing", in one glance instead of two. Measured, the whole panel is
   190 x 318: the same width as today's column, and shorter, because the seal and
   the caption share rows that used to be separate blocks.

   ART CEILING, since this is the direction that has to answer for it. The crop
   is 626x457. The wash renders it at 190px wide (0.30x) and the crisp window at
   168px (0.27x) -- both far under 1x, so nothing here is upscaled and the blur
   is for legibility of the type on top, not to hide a stretch. That is the
   opposite of the failure the menu round documented, and it is only true because
   this panel is narrow. Do not port the wash to a surface wider than ~780px
   without re-reading mockups/README.md.

   THE TRADE, stated because the greyscale twin is the verdict. The colour tint
   is the thing this direction spends itself on, and in greyscale every seat
   lights identically -- exactly the finding against menu 05. What survives is
   the PORTRAIT, which is different per seat regardless of hue, so the
   identity-at-a-glance claim degrades rather than dies. Press `g` and judge it.

   Press `g` for greyscale. No build, no server, no network. Local ../art/ only.
   ========================================================================== */

/* Tokens ----------------------------------------------------------------- */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd; --mana-ink:#1a1a1a;

  --playable:#5ce08a; --targetable:#58b6ff; --staged:#ffc14d;
  --danger:#ff5c5c; --gain:#6ee7a0; --gold:#ffd479; --ability:#c39bff;
  --frame-commander:#d8a63c; --dial-ink:#2a1c04;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  --card-w:78px;
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

/* The seat's identity. Two properties, set from the commander's colour
   identity, and the wash, the rim and the labels all read from them -- one
   swap per seat and it is the entire mood. */
.id-GU { --id-hi:#9bd3ab; --id-lo:#2f6a95; }
.id-W { --id-hi:#f6eed4; --id-lo:#b9ad86; }
.id-B { --id-hi:#b6aeac; --id-lo:#2e282b; }
.id-R { --id-hi:#f0a48b; --id-lo:#a4432f; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
html.grey { filter:grayscale(1); }
body {
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143,127,232,.13) 0%, transparent 62%),
    radial-gradient(70% 50% at 50% 100%, rgba(90,190,220,.07) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button { cursor:pointer; background:none; border:0; font:inherit; color:inherit; }
.tabular { font-variant-numeric:tabular-nums; }

/* Shared vocabulary ------------------------------------------------------ */

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:13px; height:13px; padding:0 3px; border-radius:999px;
  font-size:8.5px; font-weight:800; font-style:normal; color:var(--mana-ink);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W { background:var(--mana-W); } .pip--U { background:var(--mana-U); }
.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }
.pip--gen { background:var(--mana-generic); }

.note { margin:0; padding:11px 13px; border-left:2px solid var(--edge-hi); border-radius:0 7px 7px 0; background:rgba(13,12,28,.55); font-size:11.5px; line-height:1.6; color:var(--text-faint); }
.note b { color:var(--text-dim); font-weight:700; }

/* Stage: the mockup's own chrome, not part of the design ------------------ */

.stage { height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
.stage__top { display:flex; align-items:baseline; gap:14px; padding:18px 26px 0; }
.stage__id { font-size:12px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
.stage__t { font-size:12px; color:var(--text-dim); }
.stage__sp { flex:1; }
.stage__k { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.stage__mid { display:grid; place-items:center; min-height:0; padding:14px 26px; overflow:hidden; }
.stage__bot { padding:0 26px 20px; max-width:1180px; }

.mat { display:grid; grid-template-columns:190px minmax(0,1fr); gap:10px; padding:10px; border:1px solid var(--edge); border-radius:12px; background:var(--pane-bg); box-shadow:var(--pane-shadow); max-height:100%; }
.mat__side { min-width:0; display:flex; flex-direction:column; }
.mat__lanes { display:grid; grid-template-rows:repeat(3, minmax(0,1fr)); gap:8px; min-width:0; }
.lane { display:flex; align-items:center; gap:6px; padding:7px 9px; border:1px dashed var(--edge); border-radius:8px; background:rgba(9,8,20,.34); overflow:hidden; }
.lane__tag { flex:none; width:44px; font-size:8.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.ghost { flex:none; width:var(--card-w); height:calc(var(--card-w) * 1.4); border-radius:var(--card-r); border:1px solid var(--edge); background:linear-gradient(160deg, rgba(40,36,74,.55), rgba(16,14,34,.55)); }

/* THE ORB ----------------------------------------------------------------- */

.orb { position:relative; width:190px; border-radius:12px; overflow:hidden; border:1px solid var(--gold); box-shadow:0 0 0 1px rgba(255,212,121,.35), 0 0 22px rgba(255,212,121,.14); background:var(--void-0); }

/* 0.30x of a 626px source. Blurred for the type's sake, not to hide a stretch. */
.orb__wash { position:absolute; inset:-14%; z-index:0; background-size:cover; background-position:50% 32%; filter:blur(16px) saturate(.95); opacity:.5; }

/* Two layers, not one blended layer. A `soft-light` blend of the identity
   gradient straight onto the scrim lifted the whole panel to a pale green and
   took the header type with it -- the first draft of this file was unreadable
   at the top. The scrim is now unconditionally dark, and the tint is a separate
   14% overlay on top of it, so the mood is a seasoning rather than the ground. */
.orb__veil {
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg, rgba(11,10,22,.72) 0%, rgba(11,10,22,.55) 22%, rgba(11,10,22,.88) 58%, rgba(11,10,22,.97) 100%);
}
.orb__tint { position:absolute; inset:0; z-index:1; opacity:.16; mix-blend-mode:overlay; background:linear-gradient(180deg, var(--id-hi), var(--id-lo)); }
.orb__body { position:relative; z-index:2; display:flex; flex-direction:column; gap:5px; padding:8px 9px 9px; }

.orb__head { display:flex; align-items:center; gap:6px; }
.orb__name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.8); }
.orb__priority { flex:none; width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }

/* The portrait and the seal ------------------------------------------------
   The window is the crisp copy at 0.27x; the seal overlaps its lower edge, so
   the dial costs the overlap and not a row. The seal is pointer-events:none
   because the portrait under it is the cast control -- a decorative object must
   not eat the click that casts your commander. */
/* The seal sits over the portrait's lower RIGHT, not its middle. Centred, a
   76px disc lands squarely on the face of a 168x84 crop and the art stops being
   a portrait -- which is a strange thing for the direction whose whole claim is
   that the portrait identifies the seat. Stamped at the corner it costs the
   least informative part of the crop and reads more like a seal besides. */
.cmdwrap { position:relative; padding-bottom:36px; }
.cmdslot { position:relative; display:block; width:100%; padding:4px; border:1px solid var(--playable); border-radius:9px; background:rgba(16,34,24,.55); box-shadow:0 0 0 1px var(--playable), 0 0 16px rgba(92,224,138,.35); text-align:left; backdrop-filter:blur(2px); }
.cmdslot__art { position:relative; display:block; aspect-ratio:2; overflow:hidden; border-radius:6px; background:#241f33; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.cmdslot__art img { display:block; width:100%; height:100%; object-fit:cover; }
.cmdslot__tag { position:absolute; top:8px; left:8px; padding:0 4px; border-radius:3px; background:var(--frame-commander); color:#2a1e05; font-size:8px; font-weight:800; letter-spacing:.08em; line-height:1.5; box-shadow:0 1px 3px rgba(0,0,0,.6); }

.dial { position:absolute; right:4px; bottom:0; z-index:3; width:72px; height:72px; pointer-events:none; display:grid; place-items:center; border-radius:50%;
  background:radial-gradient(circle at 34% 26%, #fbeec2 0%, #d8b055 38%, #8a6a22 72%, #4d3a12 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.7), inset 0 0 0 3px rgba(0,0,0,.22), inset 0 -6px 14px rgba(0,0,0,.35), 0 0 34px rgba(255,206,120,.42); }
.dial::after { content:""; position:absolute; inset:6px; border-radius:50%; border:1px solid rgba(60,38,8,.5); }
.dial__n { position:relative; color:var(--dial-ink); font-size:28px; font-weight:900; line-height:1; text-shadow:0 1px 0 rgba(255,255,255,.35); }

/* Caption: name, state, cost, tax. Left-aligned and full width, BELOW the seal
   rather than tucked beside it -- `.cmdwrap`'s bottom padding already reserves
   the seal's lower half, so there is a clear line to start on. Squeezing the
   caption into the 100px left of the seal wrapped the name to two lines and
   then orphaned the tax onto a third. */
.cap { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
.cap__name { display:-webkit-box; overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:11px; font-weight:750; line-height:1.22; text-shadow:0 1px 3px rgba(0,0,0,.85); }
.cap__strip { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.cap__glyph { font-size:9px; line-height:1; color:var(--playable); }
.cap__word { font-size:8.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--playable); }
.cap__cost { display:flex; gap:2px; align-items:center; }
.cap__tax { padding:0 5px; border:1px solid rgba(216,166,60,.6); border-radius:999px; background:rgba(42,32,8,.85); color:var(--gold); font-size:9.5px; font-weight:800; line-height:1.5; }

/* Commander damage. Chips on a scrim plate, because a bare chip over art is the
   thing that always goes illegible first. The warn tier keeps the red AND takes
   a heavier rule, so the pair still separate in greyscale. */
.dmg { display:flex; align-items:center; justify-content:center; gap:4px; padding:3px 5px; border-radius:6px; background:rgba(9,8,20,.55); }
.dmg__lab { font-size:7.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.dmg__pip { padding:0 5px; border:1px solid var(--edge-hi); border-radius:4px; background:rgba(20,19,40,.8); color:var(--text-dim); font-size:11px; font-weight:800; }
.dmg__pip--warn { border-width:2px; border-color:var(--danger); background:#331616; color:#ffb3b3; }

.manaslot { min-height:11px; display:flex; align-items:center; justify-content:center; }
.mana { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; }
.mana__pip { width:9px; height:9px; border-radius:50%; border:1px solid rgba(0,0,0,.55); background:var(--mana-C); box-shadow:inset 0 1px 1px rgba(255,255,255,.35); }
.mana__pip--W { background:var(--mana-W); } .mana__pip--U { background:var(--mana-U); }
.mana__pip--B { background:var(--mana-B); } .mana__pip--R { background:var(--mana-R); }
.mana__pip--G { background:var(--mana-G); } .mana__pip--C { background:var(--mana-C); }
.mana__pip--any { background:conic-gradient(var(--mana-W) 0deg 72deg, var(--mana-U) 72deg 144deg, var(--mana-B) 144deg 216deg, var(--mana-R) 216deg 288deg, var(--mana-G) 288deg 360deg); }
.mana__pip--floating { box-shadow:0 0 0 1px var(--gold), 0 0 6px rgba(255,212,121,.5); }
.mana__pip--spent { background:none; box-shadow:inset 0 0 0 1.5px rgba(230,227,245,.55); opacity:.8; }

/* The piles sit on a plate for the same reason the damage chips do. Bottom
   aligned, exact counts on the top leaf, library not a button. */
.piles { display:flex; align-items:flex-end; justify-content:center; gap:5px; padding:5px 4px 4px; border-radius:8px; background:rgba(9,8,20,.55); }
.pile { display:flex; flex-direction:column; align-items:center; gap:3px; padding:0; border:0; background:none; }
.pile__stack { display:flex; flex-direction:column; justify-content:flex-end; width:28px; }
.pile__leaf { height:3px; margin-bottom:1px; border-radius:2px; background:linear-gradient(90deg,#2b1d3a,#4a3560 40%,#2b1d3a); box-shadow:0 1px 0 rgba(0,0,0,.55); }
.pile__top { display:grid; place-items:center; height:20px; border-radius:3px; border:1px solid var(--edge-hi); background:linear-gradient(150deg,#43305c,#241834); color:var(--astral-hi); font-size:10px; font-weight:800; }
.pile--gy .pile__leaf { background:linear-gradient(90deg,#2a1d13,#5a4030 40%,#2a1d13); } .pile--gy .pile__top { background:linear-gradient(150deg,#4a3323,#241a12); }
.pile--ex .pile__leaf { background:linear-gradient(90deg,#22222b,#43434f 40%,#22222b); } .pile--ex .pile__top { background:linear-gradient(150deg,#3a3a48,#1d1d26); }
.pile--cmd .pile__leaf { background:linear-gradient(90deg,#332a12,#6a5626 40%,#332a12); } .pile--cmd .pile__top { background:linear-gradient(150deg,#5a4a1e,#2c2410); border-color:rgba(216,166,60,.6); color:var(--gold); }
.pile__label { font-size:8.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); }
.pile--empty .pile__top { opacity:.4; }
.pile:not(.pile--static):hover .pile__top { border-color:var(--astral-hi); color:#fff; }
.pile--static { cursor:default; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===========================================================================
   Content, inlined from _orb.js -- the readable master. Not linked, because a
   <script src> does not load from file:// and every mockup opens standalone.
   =========================================================================== */

const ME = { pid: 0, name: "You", life: 27, active: true, priority: true, lost: false, loss: null };

const CMD = {
  oid: 101,
  name: "Aesi, Tyrant of Gyre Strait",
  art: "aesi-tyrant-of-gyre-strait.jpg",
  cost: ["4", "G", "U"],
  zone: "command",
  castable: true,
  tax: 2,
  identity: ["G", "U"],
};

/* Word + glyph. The third channel is the portrait's luminance and lives in CSS.
   None of the three is hue -- CommandZone.tsx:57-76, and the reason is
   docs/mockup-fidelity.md's top-ranked open defect. */
const CMD_STATE = {
  ready: { word: "Ready", glyph: "▶" },
  waiting: { word: "In command", glyph: "·" },
  stack: { word: "On the stack", glyph: "✦" },
  deployed: { word: "On the battlefield", glyph: "✦" },
  dead: { word: "In the graveyard", glyph: "✕" },
  exiled: { word: "Exiled", glyph: "✕" },
};
const STATE = CMD_STATE.ready;

const LETHAL = 21;
const WARN = LETHAL - 6;

const FOES = [
  { pid: 1, name: "Edgar Markov", dmg: 16 },
  { pid: 2, name: "Atraxa, Praetors' Voice", dmg: 7 },
  { pid: 3, name: "Chulane, Teller of Tales", dmg: 0 },
];
const DMG = FOES.filter((f) => f.dmg > 0);

/* markSpent(manaRow(...)) already applied -- logic/mana.ts. An ambiguous source
   ("Add {G} or {U}") is ONE split pip and never two solid ones, because two
   would claim a mana that does not exist. `spent` is the engine's own solved
   payment for a hovered spell, never arithmetic done here. */
const MANA = [
  { k: "pool-U-0", tone: "U", symbols: ["U"], floating: true, spent: false },
  { k: "src-31-0", tone: "G", symbols: ["G"], floating: false, spent: false },
  { k: "src-32-0", tone: "G", symbols: ["G"], floating: false, spent: false },
  { k: "src-33-0", tone: "any", symbols: ["G", "U"], floating: false, spent: true },
  { k: "src-34-0", tone: "U", symbols: ["U"], floating: false, spent: true },
  { k: "src-35-0", tone: "C", symbols: ["C"], floating: false, spent: false },
];
const SPENT = MANA.filter((m) => m.spent).length;

/* `peek: false` is the library, and it is deliberate: hidden information, and a
   control that does nothing when clicked is worse than no control. The other
   four are the only route into ZonePeek, so a direction that draws them
   decoratively makes the graveyard unreachable. */
const ZONES = [
  { name: "library", label: "Lib", kind: "lib", count: 41, peek: false, title: "Cards in library" },
  { name: "hand", label: "Hand", kind: "lib", count: 5, peek: true, title: "Your hand" },
  { name: "graveyard", label: "GY", kind: "gy", count: 12, peek: true, title: "GY: 12" },
  { name: "exile", label: "Exile", kind: "ex", count: 3, peek: true, title: "Exile: 3" },
  { name: "command", label: "CMD", kind: "cmd", count: 1, peek: true, title: "Command zone" },
];

/* Helpers ---------------------------------------------------------------- */

const root = document.getElementById("root");
const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (file) => "../art/" + file;

/* zones.ts: one leaf per nine cards, nine leaves and then it stops. The top
   leaf still carries the exact number, so the cap costs resolution and never
   information. */
const LEAF = 9;
const MAX_LEAVES = 9;
const leaves = (n) => (n <= 0 ? 0 : Math.min(MAX_LEAVES, Math.ceil(n / LEAF)));

const manaTitle = (p) =>
  p.spent
    ? p.symbols.join(" or ") + " — this spell would tap it"
    : p.symbols.length > 1
      ? "Either " + p.symbols.join(" or ")
      : p.floating
        ? p.symbols[0] + " in pool"
        : p.symbols[0];

const manaRowTitle =
  SPENT > 0 ? MANA.length + " available; this spell taps " + SPENT : MANA.length + " available";

const costPips = (cost) =>
  cost
    .map((s) => '<i class="pip pip--' + (/^\d+$/.test(s) ? "gen" : s) + '">' + s + "</i>")
    .join("");

/* A key, not a control: the viewport IS the design, and dev chrome would
   contaminate the screenshot. */
const greyKey = () =>
  document.addEventListener("keydown", (e) => {
    if ((e.key === "g" || e.key === "G") && e.target.tagName !== "INPUT") {
      document.documentElement.classList.toggle("grey");
    }
  });

/* Views ------------------------------------------------------------------- */

function piles() {
  return (
    '<div class="piles">' +
      ZONES.map((z) => {
        const stack =
          Array.from({ length: leaves(z.count) }, () => '<span class="pile__leaf"></span>').join("") +
          '<span class="pile__top tabular">' + z.count + "</span>";
        const cls = "pile pile--" + z.kind + (z.count > 0 ? "" : " pile--empty") + (z.peek ? "" : " pile--static");
        const attrs = 'class="' + cls + '" data-testid="pile-' + ME.pid + "-" + z.name + '" data-count="' + z.count + '" title="' + esc(z.title) + '"';
        const body = '<span class="pile__stack">' + stack + '</span><span class="pile__label">' + esc(z.label) + "</span>";
        return z.peek ? "<button type=\"button\" " + attrs + ">" + body + "</button>" : "<div " + attrs + ">" + body + "</div>";
      }).join("") +
    "</div>"
  );
}

function orb() {
  return (
    '<div class="orb id-GU" data-player="' + ME.pid + '" data-testid="player-' + ME.pid + '">' +
      '<div class="orb__wash" style="background-image:url(' + artUrl(CMD.art) + ')"></div>' +
      '<div class="orb__veil"></div>' +
      '<div class="orb__tint"></div>' +
      '<div class="orb__body">' +

        '<div class="orb__head">' +
          '<span class="orb__name">' + esc(ME.name) + "</span>" +
          (ME.priority ? '<span class="orb__priority" title="Has priority"></span>' : "") +
        "</div>" +

        '<div class="cmdwrap">' +
          '<button type="button" class="cmdslot" data-testid="commander-' + CMD.oid + '" data-castable="true" data-zone="' + CMD.zone + '" data-cmd-state="ready" title="Cast ' + esc(CMD.name) + " — +" + CMD.tax + ' commander tax">' +
            '<span class="cmdslot__art"><img src="' + artUrl(CMD.art) + '" alt=""></span>' +
            '<span class="cmdslot__tag" title="Commander">CMD</span>' +
          "</button>" +
          '<div class="dial"><span class="dial__n tabular" data-testid="life-' + ME.pid + '">' + (ME.lost ? "OUT" : ME.life) + "</span></div>" +
        "</div>" +

        '<div class="cap">' +
          '<span class="cap__name">' + esc(CMD.name) + "</span>" +
          '<span class="cap__strip">' +
            '<span class="cap__glyph" aria-hidden="true">' + STATE.glyph + "</span>" +
            '<span class="cap__word">' + esc(STATE.word) + "</span>" +
            '<span class="cap__cost">' + costPips(CMD.cost) + "</span>" +
            '<span class="cap__tax" title="+' + CMD.tax + ' generic to cast from the command zone">+' + CMD.tax + "</span>" +
          "</span>" +
        "</div>" +

        '<div class="dmg" title="Commander damage taken">' +
          '<span class="dmg__lab">Cmd dmg</span>' +
          DMG.map((f) =>
            '<span class="dmg__pip' + (f.dmg >= WARN ? " dmg__pip--warn" : "") + '" title="' + esc(f.dmg + " from " + f.name) + '">' + f.dmg + "</span>"
          ).join("") +
        "</div>" +

        '<div class="manaslot"><div class="mana" data-testid="mana-' + ME.pid + '" data-spending="' + SPENT + '" title="' + esc(manaRowTitle) + '">' +
          MANA.map((p) =>
            '<span class="mana__pip mana__pip--' + p.tone + (p.floating ? " mana__pip--floating" : "") + (p.spent ? " mana__pip--spent" : "") + '" title="' + esc(manaTitle(p)) + '"></span>'
          ).join("") +
        "</div></div>" +

        piles() +
      "</div>" +
    "</div>"
  );
}

function lanes() {
  const row = (tag, n) =>
    '<div class="lane"><span class="lane__tag">' + tag + "</span>" +
    Array.from({ length: n }, () => '<span class="ghost"></span>').join("") + "</div>";
  return '<div class="mat__lanes">' + row("Lands", 8) + row("Creatures", 6) + row("Other", 3) + "</div>";
}

function render() {
  root.innerHTML =
    '<div class="stage">' +
      '<div class="stage__top">' +
        '<span class="stage__id">Orb · 03 Plinth</span>' +
        '<span class="stage__t">the commander is the panel · the life seal</span>' +
        '<span class="stage__sp"></span>' +
        '<span class="stage__k">190 × 318 · same column, shorter · press g</span>' +
      "</div>" +
      '<div class="stage__mid">' +
        '<div class="mat"><div class="mat__side">' + orb() + "</div>" + lanes() + "</div>" +
      "</div>" +
      '<div class="stage__bot"><p class="note">' +
        "<b>Every channel, and where it went.</b> Name and the gold priority dot sit on the scrim at the top. " +
        "The commander keeps a crisp 2:1 window with its CMD badge, and gains the whole panel as its ground; " +
        "the name, the state said three ways, the cost and the <b>+2</b> tax become a caption under the seal — still one glance above the mana row, in the same order the column uses today. " +
        "Life is the seal — the same brass dial, moved into the overlap so it costs no row of its own, which is how the panel lands at 190 × 318 without dropping anything. " +
        "Commander damage and the five piles keep their existing forms but sit on scrim plates, because a bare chip over art is the first thing to go illegible; " +
        "counts are exact, the baseline is shared, and library is still not a button. The warn tier takes a 2px rule as well as its red. " +
        "<b>The claim to judge in greyscale:</b> the tint dies, the portrait does not — press <b>g</b> and decide whether a lit portrait alone still tells four seats apart. " +
        "<b>Not shown:</b> a fallen commander desaturates the wash as well as the window, which is this direction's strongest state and the one worth building next." +
      "</p></div>" +
    "</div>";
}

render();
greyKey();
</script>
</body>
</html>
