<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player orb — Totem (orb 05)</title>
<style>
/* ============================================================================
   TOTEM -- one component, every seat
   ----------------------------------------------------------------------------
   THESIS. The orb is maintained twice. There is the 190px viewer version, and
   there is `.orb--compact` in a 112px column, which is a second design wearing
   the first one's class names: a different dial size, a different plinth, a
   different name clamp, a different label scale, and its own block of overrides
   in board.css (427-457, the dial block, and again in the piles block). Two
   implementations of one component drift, and these two already have. The
   cheapest way to stop that is for there to be one.

   THE BIG IDEA, stealable on its own: DESIGN FOR THE NARROW SEAT AND GIVE IT TO
   EVERYBODY. Fit the whole thing in 96px -- narrower than the compact column is
   today -- and the viewer's orb and an opponent's become the same markup at the
   same size, with nothing conditional but whose turn it is. That is 94px of
   width back on the viewer's mat, 16px on every opponent's, and one component
   to maintain instead of two.

   SECOND IDEA: THE POLE. The five zones stop being five equal objects and become
   five stacked bands whose HEIGHT is their count. A library at 41 is a tall
   band; a command zone at 1 is a sliver. It is the same comparative read the
   bottom-aligned piles were built for, except the comparison is now vertical and
   shares one edge instead of five, so it works at any width -- which is exactly
   what a 96px column needs. It also makes the panel look like what it is: a
   stack of the game's state, tallest where the cards are.

   THE TRADE, and it is real. This is the least room the commander has ever had:
   an 84px portrait, and "On the battlefield" wraps to two lines where the wide
   orb keeps it on one. Every previous attempt to shrink the commander produced
   docs/mockup-fidelity.md defect #5 -- "Aesi, Tyra..." -- so the two-line clamp
   here is load-bearing, not decorative, and the full card is still one hover
   away in the preview rail.

   Press `g` for greyscale. No build, no server, no network. Local ../art/ only.
   ========================================================================== */

/* Tokens ----------------------------------------------------------------- */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd; --mana-ink:#1a1a1a;

  --playable:#5ce08a; --targetable:#58b6ff; --staged:#ffc14d;
  --danger:#ff5c5c; --gain:#6ee7a0; --gold:#ffd479; --ability:#c39bff;
  --frame-commander:#d8a63c; --dial-ink:#2a1c04;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  --card-w:78px;
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
html.grey { filter:grayscale(1); }
body {
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143,127,232,.13) 0%, transparent 62%),
    radial-gradient(70% 50% at 50% 100%, rgba(90,190,220,.07) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button { cursor:pointer; background:none; border:0; font:inherit; color:inherit; }
.tabular { font-variant-numeric:tabular-nums; }

/* Shared vocabulary ------------------------------------------------------ */

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:12px; height:12px; padding:0 2px; border-radius:999px;
  font-size:8px; font-weight:800; font-style:normal; color:var(--mana-ink);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W { background:var(--mana-W); } .pip--U { background:var(--mana-U); }
.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }
.pip--gen { background:var(--mana-generic); }

.note { margin:0; padding:11px 13px; border-left:2px solid var(--edge-hi); border-radius:0 7px 7px 0; background:rgba(13,12,28,.55); font-size:11.5px; line-height:1.6; color:var(--text-faint); }
.note b { color:var(--text-dim); font-weight:700; }

/* Stage: the mockup's own chrome, not part of the design ------------------ */

.stage { height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
.stage__top { display:flex; align-items:baseline; gap:14px; padding:18px 26px 0; }
.stage__id { font-size:12px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
.stage__t { font-size:12px; color:var(--text-dim); }
.stage__sp { flex:1; }
.stage__k { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.stage__mid { display:grid; place-items:center; min-height:0; padding:14px 26px; overflow:hidden; }
.stage__bot { padding:0 26px 20px; max-width:1180px; }

.mat { display:grid; grid-template-columns:96px minmax(0,1fr); gap:10px; padding:10px; border:1px solid var(--edge); border-radius:12px; background:var(--pane-bg); box-shadow:var(--pane-shadow); max-height:100%; }
.mat__side { min-width:0; }
.mat__lanes { display:grid; grid-template-rows:repeat(3, minmax(0,1fr)); gap:8px; min-width:0; }
.lane { display:flex; align-items:center; gap:6px; padding:7px 9px; border:1px dashed var(--edge); border-radius:8px; background:rgba(9,8,20,.34); overflow:hidden; }
.lane__tag { flex:none; width:44px; font-size:8.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.ghost { flex:none; width:var(--card-w); height:calc(var(--card-w) * 1.4); border-radius:var(--card-r); border:1px solid var(--edge); background:linear-gradient(160deg, rgba(40,36,74,.55), rgba(16,14,34,.55)); }
.ghost--won { border-style:dashed; border-color:rgba(92,224,138,.4); background:linear-gradient(160deg, rgba(30,60,44,.5), rgba(12,26,20,.5)); }

/* THE ORB ----------------------------------------------------------------- */

.orb { width:96px; display:flex; flex-direction:column; gap:5px; padding:6px 5px; border:1px solid var(--gold); border-radius:9px; background:var(--pane-well); box-shadow:0 0 0 1px rgba(255,212,121,.35), 0 0 22px rgba(255,212,121,.14); }
.orb__head { display:flex; align-items:center; gap:4px; padding:0 1px; }
.orb__name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10.5px; font-weight:750; }
.orb__priority { flex:none; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 7px var(--gold); }

/* The commander, at the least room it has ever had. The two-line clamp is
   load-bearing: every previous shrink produced "Aesi, Tyra..." */
.cmdslot { position:relative; display:flex; flex-direction:column; gap:2px; width:100%; padding:3px; border:1px solid var(--playable); border-radius:6px; background:rgba(20,40,28,.5); box-shadow:0 0 0 1px var(--playable), 0 0 14px rgba(92,224,138,.3); text-align:left; }
.cmdslot__art { position:relative; display:block; aspect-ratio:2; overflow:hidden; border-radius:4px; background:#241f33; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.cmdslot__art img { display:block; width:100%; height:100%; object-fit:cover; }
.cmdslot__tag { position:absolute; top:5px; left:5px; padding:0 3px; border-radius:2px; background:var(--frame-commander); color:#2a1e05; font-size:7px; font-weight:800; letter-spacing:.06em; line-height:1.5; box-shadow:0 1px 3px rgba(0,0,0,.6); }
.cmdslot__name { display:-webkit-box; overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:9px; font-weight:700; line-height:1.18; }
.cmdslot__strip { display:flex; align-items:baseline; gap:3px; }
.cmdslot__glyph { flex:none; font-size:8px; line-height:1; color:var(--playable); }
.cmdslot__word { font-size:7.5px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; line-height:1.25; color:var(--playable); }
.cmdslot__cost { display:flex; flex-wrap:wrap; gap:2px; align-items:center; }
.cmdslot__tax { padding:0 4px; border:1px solid rgba(216,166,60,.6); border-radius:999px; background:#2a2008; color:var(--gold); font-size:8.5px; font-weight:800; line-height:1.5; }

/* Life. The dial recipe from board.css:550, at the compact column's size --
   which is now everybody's size. */
.dial { position:relative; display:grid; place-items:center; width:66px; height:66px; margin:1px auto 0; border-radius:50%;
  background:radial-gradient(circle at 34% 26%, #fbeec2 0%, #d8b055 38%, #8a6a22 72%, #4d3a12 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 0 0 3px rgba(0,0,0,.22), inset 0 -6px 14px rgba(0,0,0,.35), 0 0 30px rgba(255,206,120,.42); }
.dial::after { content:""; position:absolute; inset:5px; border-radius:50%; border:1px solid rgba(60,38,8,.5); }
.dial__n { position:relative; color:var(--dial-ink); font-size:26px; font-weight:900; line-height:1; text-shadow:0 1px 0 rgba(255,255,255,.35); }

.dmg { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; }
.dmg__pip { padding:0 5px; border:1px solid var(--edge); border-radius:4px; background:rgba(20,19,40,.75); color:var(--text-dim); font-size:10px; font-weight:800; }
.dmg__pip--warn { border-width:2px; border-color:var(--danger); background:#331616; color:#ffb3b3; }

.manaslot { min-height:10px; display:flex; align-items:center; justify-content:center; }
.mana { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; }
.mana__pip { width:9px; height:9px; border-radius:50%; border:1px solid rgba(0,0,0,.45); background:var(--mana-C); box-shadow:inset 0 1px 1px rgba(255,255,255,.35); }
.mana__pip--W { background:var(--mana-W); } .mana__pip--U { background:var(--mana-U); }
.mana__pip--B { background:var(--mana-B); } .mana__pip--R { background:var(--mana-R); }
.mana__pip--G { background:var(--mana-G); } .mana__pip--C { background:var(--mana-C); }
.mana__pip--any { background:conic-gradient(var(--mana-W) 0deg 72deg, var(--mana-U) 72deg 144deg, var(--mana-B) 144deg 216deg, var(--mana-R) 216deg 288deg, var(--mana-G) 288deg 360deg); }
.mana__pip--floating { box-shadow:0 0 0 1px var(--gold), 0 0 6px rgba(255,212,121,.5); }
.mana__pip--spent { background:none; box-shadow:inset 0 0 0 1.5px var(--text-faint); opacity:.75; }

/* THE POLE -----------------------------------------------------------------
   Five bands, height proportional to count. Every band shares one left and one
   right edge, so the comparison is vertical and needs no width at all -- which
   is what makes it the only zone form that fits here. The exact count still
   prints on each band, so the height is resolution and never information, the
   same bargain `pileLeaves` makes. Colour is the same coding the leaf stacks
   use today: purple library, brown graveyard, slate exile, brass command. */
.pole { display:flex; flex-direction:column; gap:2px; }
.band { position:relative; display:flex; align-items:center; justify-content:space-between; gap:3px; padding:0 5px; border:1px solid var(--edge-hi); border-radius:3px; background:linear-gradient(150deg,#43305c,#241834); overflow:hidden; text-align:left; }
.band__lab { font-size:7.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:rgba(230,227,245,.72); }
.band__n { font-size:10px; font-weight:800; color:var(--astral-hi); }
.band--gy { background:linear-gradient(150deg,#4a3323,#241a12); }
.band--ex { background:linear-gradient(150deg,#3a3a48,#1d1d26); }
.band--cmd { background:linear-gradient(150deg,#5a4a1e,#2c2410); border-color:rgba(216,166,60,.6); }
.band--cmd .band__n { color:var(--gold); }
.band--empty { opacity:.4; }
.band:not(.band--static) { cursor:pointer; }
.band:not(.band--static):hover { border-color:var(--astral-hi); }
.band:not(.band--static):hover .band__n { color:#fff; }
.band--static { cursor:default; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===========================================================================
   Content, inlined from _orb.js -- the readable master. Not linked, because a
   <script src> does not load from file:// and every mockup opens standalone.
   =========================================================================== */

const ME = { pid: 0, name: "You", life: 27, active: true, priority: true, lost: false, loss: null };

const CMD = {
  oid: 101,
  name: "Aesi, Tyrant of Gyre Strait",
  art: "aesi-tyrant-of-gyre-strait.jpg",
  cost: ["4", "G", "U"],
  zone: "command",
  castable: true,
  tax: 2,
  identity: ["G", "U"],
};

/* Word + glyph. The third channel is the portrait's luminance and lives in CSS.
   None of the three is hue -- CommandZone.tsx:57-76, and the reason is
   docs/mockup-fidelity.md's top-ranked open defect. */
const CMD_STATE = {
  ready: { word: "Ready", glyph: "▶" },
  waiting: { word: "In command", glyph: "·" },
  stack: { word: "On the stack", glyph: "✦" },
  deployed: { word: "On the battlefield", glyph: "✦" },
  dead: { word: "In the graveyard", glyph: "✕" },
  exiled: { word: "Exiled", glyph: "✕" },
};
const STATE = CMD_STATE.ready;

const LETHAL = 21;
const WARN = LETHAL - 6;

const FOES = [
  { pid: 1, name: "Edgar Markov", dmg: 16 },
  { pid: 2, name: "Atraxa, Praetors' Voice", dmg: 7 },
  { pid: 3, name: "Chulane, Teller of Tales", dmg: 0 },
];
const DMG = FOES.filter((f) => f.dmg > 0);

/* markSpent(manaRow(...)) already applied -- logic/mana.ts. An ambiguous source
   ("Add {G} or {U}") is ONE split pip and never two solid ones, because two
   would claim a mana that does not exist. `spent` is the engine's own solved
   payment for a hovered spell, never arithmetic done here. */
const MANA = [
  { k: "pool-U-0", tone: "U", symbols: ["U"], floating: true, spent: false },
  { k: "src-31-0", tone: "G", symbols: ["G"], floating: false, spent: false },
  { k: "src-32-0", tone: "G", symbols: ["G"], floating: false, spent: false },
  { k: "src-33-0", tone: "any", symbols: ["G", "U"], floating: false, spent: true },
  { k: "src-34-0", tone: "U", symbols: ["U"], floating: false, spent: true },
  { k: "src-35-0", tone: "C", symbols: ["C"], floating: false, spent: false },
];
const SPENT = MANA.filter((m) => m.spent).length;

/* `peek: false` is the library, and it is deliberate: hidden information, and a
   control that does nothing when clicked is worse than no control. The other
   four are the only route into ZonePeek, so a direction that draws them
   decoratively makes the graveyard unreachable. */
const ZONES = [
  { name: "library", label: "Lib", kind: "lib", count: 41, peek: false, title: "Cards in library" },
  { name: "hand", label: "Hand", kind: "lib", count: 5, peek: true, title: "Your hand" },
  { name: "graveyard", label: "GY", kind: "gy", count: 12, peek: true, title: "GY: 12" },
  { name: "exile", label: "Exile", kind: "ex", count: 3, peek: true, title: "Exile: 3" },
  { name: "command", label: "CMD", kind: "cmd", count: 1, peek: true, title: "Command zone" },
];

/* Helpers ---------------------------------------------------------------- */

const root = document.getElementById("root");
const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (file) => "../art/" + file;

/* zones.ts: one leaf per nine cards, nine leaves and then it stops. The top
   leaf still carries the exact number, so the cap costs resolution and never
   information. */
const LEAF = 9;
const MAX_LEAVES = 9;
const leaves = (n) => (n <= 0 ? 0 : Math.min(MAX_LEAVES, Math.ceil(n / LEAF)));

const manaTitle = (p) =>
  p.spent
    ? p.symbols.join(" or ") + " — this spell would tap it"
    : p.symbols.length > 1
      ? "Either " + p.symbols.join(" or ")
      : p.floating
        ? p.symbols[0] + " in pool"
        : p.symbols[0];

const manaRowTitle =
  SPENT > 0 ? MANA.length + " available; this spell taps " + SPENT : MANA.length + " available";

const costPips = (cost) =>
  cost
    .map((s) => '<i class="pip pip--' + (/^\d+$/.test(s) ? "gen" : s) + '">' + s + "</i>")
    .join("");

/* A key, not a control: the viewport IS the design, and dev chrome would
   contaminate the screenshot. */
const greyKey = () =>
  document.addEventListener("keydown", (e) => {
    if ((e.key === "g" || e.key === "G") && e.target.tagName !== "INPUT") {
      document.documentElement.classList.toggle("grey");
    }
  });

/* Views ------------------------------------------------------------------- */

/* A band is 13px of label plus one pixel per card, capped at the point where a
   45-card library and a 90-card one would stop being distinguishable anyway --
   the same cap `pileLeaves` applies at nine leaves, for the same reason. */
const BAND_MIN = 13;
const BAND_MAX = 40;
const bandHeight = (n) => Math.round(BAND_MIN + Math.min(n, 45) / 45 * (BAND_MAX - BAND_MIN));

function pole() {
  return (
    '<div class="pole">' +
      ZONES.map((z) => {
        const cls = "band band--" + z.kind + (z.count > 0 ? "" : " band--empty") + (z.peek ? "" : " band--static");
        const attrs =
          'class="' + cls + '" style="height:' + bandHeight(z.count) + 'px" ' +
          'data-testid="pile-' + ME.pid + "-" + z.name + '" data-count="' + z.count + '" title="' + esc(z.title) + '"';
        const body = '<span class="band__lab">' + esc(z.label) + '</span><span class="band__n tabular">' + z.count + "</span>";
        return z.peek ? '<button type="button" ' + attrs + ">" + body + "</button>" : "<div " + attrs + ">" + body + "</div>";
      }).join("") +
    "</div>"
  );
}

function orb() {
  return (
    '<div class="orb" data-player="' + ME.pid + '" data-testid="player-' + ME.pid + '">' +
      '<div class="orb__head">' +
        '<span class="orb__name">' + esc(ME.name) + "</span>" +
        (ME.priority ? '<span class="orb__priority" title="Has priority"></span>' : "") +
      "</div>" +

      '<button type="button" class="cmdslot" data-testid="commander-' + CMD.oid + '" data-castable="true" data-zone="' + CMD.zone + '" data-cmd-state="ready" title="Cast ' + esc(CMD.name) + " — +" + CMD.tax + ' commander tax">' +
        '<span class="cmdslot__art"><img src="' + artUrl(CMD.art) + '" alt=""></span>' +
        '<span class="cmdslot__tag" title="Commander">CMD</span>' +
        '<span class="cmdslot__name">' + esc(CMD.name) + "</span>" +
        '<span class="cmdslot__strip">' +
          '<span class="cmdslot__glyph" aria-hidden="true">' + STATE.glyph + "</span>" +
          '<span class="cmdslot__word">' + esc(STATE.word) + "</span>" +
        "</span>" +
        '<span class="cmdslot__cost">' + costPips(CMD.cost) +
          '<span class="cmdslot__tax" title="+' + CMD.tax + ' generic to cast from the command zone">+' + CMD.tax + "</span>" +
        "</span>" +
      "</button>" +

      '<div class="dial"><span class="dial__n tabular" data-testid="life-' + ME.pid + '">' + (ME.lost ? "OUT" : ME.life) + "</span></div>" +

      '<div class="dmg" title="Commander damage taken">' +
        DMG.map((f) =>
          '<span class="dmg__pip' + (f.dmg >= WARN ? " dmg__pip--warn" : "") + '" title="' + esc(f.dmg + " from " + f.name) + '">' + f.dmg + "</span>"
        ).join("") +
      "</div>" +

      '<div class="manaslot"><div class="mana" data-testid="mana-' + ME.pid + '" data-spending="' + SPENT + '" title="' + esc(manaRowTitle) + '">' +
        MANA.map((p) =>
          '<span class="mana__pip mana__pip--' + p.tone + (p.floating ? " mana__pip--floating" : "") + (p.spent ? " mana__pip--spent" : "") + '" title="' + esc(manaTitle(p)) + '"></span>'
        ).join("") +
      "</div></div>" +

      pole() +
    "</div>"
  );
}

function lanes() {
  const row = (tag, n, won) =>
    '<div class="lane"><span class="lane__tag">' + tag + "</span>" +
    Array.from({ length: n }, (_, i) => '<span class="ghost' + (won && i >= n - won ? " ghost--won" : "") + '"></span>').join("") + "</div>";
  return '<div class="mat__lanes">' + row("Lands", 9, 1) + row("Creatures", 7, 1) + row("Other", 4, 0) + "</div>";
}

function render() {
  root.innerHTML =
    '<div class="stage">' +
      '<div class="stage__top">' +
        '<span class="stage__id">Orb · 05 Totem</span>' +
        '<span class="stage__t">one component, every seat · the zones become a pole</span>' +
        '<span class="stage__sp"></span>' +
        '<span class="stage__k">96 × 356 · 94px narrower · press g</span>' +
      "</div>" +
      '<div class="stage__mid">' +
        '<div class="mat"><div class="mat__side">' + orb() + "</div>" + lanes() + "</div>" +
      "</div>" +
      '<div class="stage__bot"><p class="note">' +
        "<b>This is also the opponent's orb.</b> Same markup, same 96px, nothing conditional but whose turn it is — which is the direction's whole argument: " +
        "<code>.orb--compact</code> and its overrides in board.css stop existing, and the component stops being maintained twice. " +
        "<b>Every channel:</b> name and the gold priority dot on top; the commander keeps its portrait, CMD badge, two-line name, its state said three ways, and its cost with the <b>+2</b> tax; " +
        "life is the same brass dial at the compact size, which is now everyone's size; commander damage keeps its per-source chips, amounts and tooltips, with the warn tier taking a 2px rule as well as its red. " +
        "The five zones become the pole — one band each, height proportional to count against a shared cap, exact number printed on every band, colour-coded exactly as the leaf stacks are today " +
        "(purple library, brown graveyard, slate exile, brass command). Library is the band that is not a button. " +
        "<b>What it costs:</b> “Ready” fits, but the long states — “On the battlefield”, “In the graveyard” — wrap to two lines here where the wide orb keeps them on one, and the portrait is the smallest of the five directions — " +
        "the failure mode this has to be checked against is defect #5, “Aesi, Tyra…”, which is why the two-line name clamp is not negotiable here." +
      "</p></div>" +
    "</div>";
}

render();
greyKey();
</script>
</body>
</html>
