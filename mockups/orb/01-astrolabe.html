<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player orb — Astrolabe (orb 01)</title>
<style>
/* ============================================================================
   ASTROLABE -- the orb is called an orb and is currently a rectangle
   ----------------------------------------------------------------------------
   THESIS. Today's panel is six visual languages stacked in a column: a brass
   disc, a portrait banner, outlined chips, dot pips and two different kinds of
   leaf stack. Three of those blocks are answering the same question -- how is
   this player doing -- and they answer it in three unrelated shapes, so you read
   them one at a time. This direction fuses them into ONE instrument: life at the
   centre, and a single ring around it carrying the two things that move.

   THE BIG IDEA, stealable on its own: COMMANDER DAMAGE IS THE ONLY STAT IN THE
   GAME WITH A KNOWN MAXIMUM, SO IT SHOULD BE A GAUGE. Today it is `16` and `7`
   in two small chips, and the difference between them is arithmetic you have to
   do -- 16 is five away from lethal and 7 is fourteen away, and nothing on
   screen says so. Here each opponent is a bead on a 21-notch arc. Sixteen sits
   visibly near the end of its track. The red warn tier still exists, but the
   POSITION already carries the warning, which is the point: it survives
   greyscale without being told to.

   SECOND IDEA: the bottom half of the same ring is the five zones, hanging
   inward toward the dial. Their counts still print exactly, and they still start
   from a common baseline -- the ring -- so a drawn-down library beside a grown
   graveyard is the same comparative read the flat piles give today, on a surface
   that was otherwise going to be empty.

   THE TRADE, and it is the largest here, by a distance. A circle wants to be
   square, and a square is the one shape this column cannot afford. Measured:
   the panel comes out 256 x 460, against the 190px of width and roughly 341px of
   height the orb actually gets at 1600x950. That is 66px too wide and 119px too
   tall -- it does not fit the small viewport at all, and the fix is to drop the
   ring to about 180px, at which the zone numerals go to 8px and the beads start
   touching. Judge this one on the idea rather than the geometry: the damage
   gauge is worth stealing even if the circle is not.

   Press `g` for greyscale. No build, no server, no network. Local ../art/ only.
   ========================================================================== */

/* Tokens ----------------------------------------------------------------- */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd; --mana-ink:#1a1a1a;

  --playable:#5ce08a; --targetable:#58b6ff; --staged:#ffc14d;
  --danger:#ff5c5c; --gain:#6ee7a0; --gold:#ffd479; --ability:#c39bff;
  --frame-commander:#d8a63c; --dial-ink:#2a1c04;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  --card-w:78px;
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
html.grey { filter:grayscale(1); }
body {
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143,127,232,.13) 0%, transparent 62%),
    radial-gradient(70% 50% at 50% 100%, rgba(90,190,220,.07) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button { cursor:pointer; background:none; border:0; font:inherit; color:inherit; }
.tabular { font-variant-numeric:tabular-nums; }

/* Shared vocabulary ------------------------------------------------------ */

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:13px; height:13px; padding:0 3px; border-radius:999px;
  font-size:8.5px; font-weight:800; font-style:normal; color:var(--mana-ink);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W { background:var(--mana-W); } .pip--U { background:var(--mana-U); }
.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }
.pip--gen { background:var(--mana-generic); }

.note { margin:0; padding:11px 13px; border-left:2px solid var(--edge-hi); border-radius:0 7px 7px 0; background:rgba(13,12,28,.55); font-size:11.5px; line-height:1.6; color:var(--text-faint); }
.note b { color:var(--text-dim); font-weight:700; }

/* Stage: the mockup's own chrome, not part of the design ------------------ */

.stage { height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
.stage__top { display:flex; align-items:baseline; gap:14px; padding:18px 26px 0; }
.stage__id { font-size:12px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
.stage__t { font-size:12px; color:var(--text-dim); }
.stage__sp { flex:1; }
.stage__k { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.stage__mid { display:grid; place-items:center; min-height:0; padding:14px 26px; overflow:hidden; }
.stage__bot { padding:0 26px 20px; max-width:1180px; }

/* The ghosted mat, so the footprint claim is visible rather than asserted.
   The lanes and their cards are placeholders at the real board's proportions --
   `--card-w` here is the 78px the shipped board resolves to at 1600x950. */
.mat { display:grid; grid-template-columns:256px minmax(0,1fr); gap:10px; padding:10px; border:1px solid var(--edge); border-radius:12px; background:var(--pane-bg); box-shadow:var(--pane-shadow); max-height:100%; }
.mat__side { min-width:0; }
.mat__lanes { display:grid; grid-template-rows:repeat(3, minmax(0,1fr)); gap:8px; min-width:0; }
.lane { display:flex; align-items:center; gap:6px; padding:7px 9px; border:1px dashed var(--edge); border-radius:8px; background:rgba(9,8,20,.34); overflow:hidden; }
.lane__tag { flex:none; width:44px; font-size:8.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.ghost { flex:none; width:var(--card-w); height:calc(var(--card-w) * 1.4); border-radius:var(--card-r); border:1px solid var(--edge); background:linear-gradient(160deg, rgba(40,36,74,.55), rgba(16,14,34,.55)); }

/* THE ORB ----------------------------------------------------------------- */

.orb { display:flex; flex-direction:column; gap:6px; padding:9px 6px 8px; border:1px solid var(--gold); border-radius:12px; background:var(--pane-well); box-shadow:0 0 0 1px rgba(255,212,121,.35), 0 0 22px rgba(255,212,121,.14); }
.orb__head { display:flex; align-items:center; gap:6px; padding:0 5px; }
.orb__name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:700; }
.orb__priority { flex:none; width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }

/* The instrument ---------------------------------------------------------- */

.astro { position:relative; width:236px; height:236px; margin:0 auto; }
.astro svg { display:block; width:236px; height:236px; overflow:visible; }

/* Ring furniture. Every stroke here is luminance, not hue -- the ring has to
   read at 40% opacity in greyscale or the gauge is decorative. */
.ring { fill:none; stroke:rgba(170,160,255,.22); stroke-width:1; }
.tick { stroke:rgba(170,160,255,.3); stroke-width:1; }
.tick--5 { stroke:rgba(195,182,255,.62); stroke-width:1.4; }
.cap { fill:var(--text-faint); font-size:8px; font-weight:800; letter-spacing:.06em; }
.ringlab { fill:var(--text-faint); font-size:7.5px; font-weight:800; letter-spacing:.14em; }

/* A bead per opponent, sitting where its damage sits on the way to 21. The
   fill is the warn channel and the POSITION is the same warning said again in
   a form that survives greyscale -- which is the whole argument for the arc. */
.bead circle { fill:#241a34; stroke:var(--astral-hi); stroke-width:1.4; }
.bead text { fill:var(--text); font-size:8.5px; font-weight:800; text-anchor:middle; }
.bead--warn circle { fill:#3a1616; stroke:var(--danger); stroke-width:2; }
.bead--warn text { fill:#ffb3b3; }
.bead__spur { stroke:rgba(170,160,255,.4); stroke-width:1; }
.bead--warn .bead__spur { stroke:rgba(255,92,92,.55); }

/* A zone. The chip sits ON the ring so the five numerals align on one circle;
   the leaves hang inward toward the dial, so length is count and every stack
   shares a baseline -- the same comparative read the flat piles give today. */
.zg { cursor:pointer; }
.zg--static { cursor:default; }
.zg__chip { fill:#241834; stroke:rgba(170,160,255,.3); stroke-width:1; }
.zg__n { fill:var(--astral-hi); font-size:9.5px; font-weight:800; text-anchor:middle; }
.zg__lab { fill:var(--text-faint); font-size:7.5px; font-weight:800; letter-spacing:.08em; text-anchor:middle; }
.zg__leaf { fill:#4a3560; }
.zg--gy .zg__chip { fill:#241a12; } .zg--gy .zg__leaf { fill:#5a4030; }
.zg--ex .zg__chip { fill:#1d1d26; } .zg--ex .zg__leaf { fill:#43434f; }
.zg--cmd .zg__chip { fill:#2c2410; stroke:rgba(216,166,60,.6); } .zg--cmd .zg__n { fill:var(--gold); } .zg--cmd .zg__leaf { fill:#6a5626; }
.zg--empty { opacity:.4; }
.zg:not(.zg--static):hover .zg__chip { stroke:var(--astral-hi); }
.zg:not(.zg--static):hover .zg__n { fill:#fff; }

/* The dial, unchanged from board.css:550 -- the one part of today's orb that
   already works, and the centre this instrument is built around. */
.dial { position:absolute; top:50%; left:50%; width:92px; height:92px; transform:translate(-50%,-50%); display:grid; place-items:center; border-radius:50%;
  background:radial-gradient(circle at 34% 26%, #fbeec2 0%, #d8b055 38%, #8a6a22 72%, #4d3a12 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 0 0 3px rgba(0,0,0,.22), inset 0 -6px 14px rgba(0,0,0,.35), 0 0 34px rgba(255,206,120,.42); }
.dial::after { content:""; position:absolute; inset:7px; border-radius:50%; border:1px solid rgba(60,38,8,.5); }
.dial__n { position:relative; color:var(--dial-ink); font-size:34px; font-weight:900; line-height:1; text-shadow:0 1px 0 rgba(255,255,255,.35); }
.dial__lab { position:absolute; bottom:15px; left:0; right:0; text-align:center; font-size:7px; font-weight:800; letter-spacing:.16em; color:rgba(42,28,4,.62); }

/* The commander, as the instrument's base ---------------------------------- */

.cmdslot { position:relative; display:flex; flex-direction:column; gap:2px; width:100%; padding:5px; border:1px solid var(--playable); border-radius:8px; background:rgba(20,40,28,.5); box-shadow:0 0 0 1px var(--playable), 0 0 16px rgba(92,224,138,.35); text-align:left; }
.cmdslot__art { position:relative; display:block; aspect-ratio:2; overflow:hidden; border-radius:5px; background:#241f33; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.cmdslot__art img { display:block; width:100%; height:100%; object-fit:cover; }
.cmdslot__tag { position:absolute; top:8px; left:8px; padding:0 4px; border-radius:3px; background:var(--frame-commander); color:#2a1e05; font-size:8px; font-weight:800; letter-spacing:.08em; line-height:1.5; box-shadow:0 1px 3px rgba(0,0,0,.6); }
.cmdslot__name { display:-webkit-box; overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:10.5px; font-weight:700; line-height:1.2; }
.cmdslot__strip { display:flex; align-items:center; gap:4px; min-width:0; }
.cmdslot__glyph { flex:none; font-size:9px; line-height:1; color:var(--playable); }
.cmdslot__word { overflow:hidden; font-size:8.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; text-overflow:ellipsis; color:var(--playable); }
.cmdslot__cost { display:flex; flex:none; gap:2px; align-items:center; margin-left:auto; }
.cmdslot__tax { padding:0 5px; border:1px solid rgba(216,166,60,.6); border-radius:999px; background:#2a2008; color:var(--gold); font-size:9.5px; font-weight:800; line-height:1.5; }

/* The mana row keeps its own line whether or not it has pips: mana empties
   several times a turn, and a collapsing slot moves the board under the
   cursor. PlayerOrb.tsx:270-275. */
.manaslot { min-height:11px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
.mana { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; }
.mana__pip { width:9px; height:9px; border-radius:50%; border:1px solid rgba(0,0,0,.45); background:var(--mana-C); box-shadow:inset 0 1px 1px rgba(255,255,255,.35); }
.mana__pip--W { background:var(--mana-W); } .mana__pip--U { background:var(--mana-U); }
.mana__pip--B { background:var(--mana-B); } .mana__pip--R { background:var(--mana-R); }
.mana__pip--G { background:var(--mana-G); } .mana__pip--C { background:var(--mana-C); }
.mana__pip--any { background:conic-gradient(var(--mana-W) 0deg 72deg, var(--mana-U) 72deg 144deg, var(--mana-B) 144deg 216deg, var(--mana-R) 216deg 288deg, var(--mana-G) 288deg 360deg); }
.mana__pip--floating { box-shadow:0 0 0 1px var(--gold), 0 0 6px rgba(255,212,121,.5); }
.mana__pip--spent { background:none; box-shadow:inset 0 0 0 1.5px var(--text-faint); opacity:.75; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===========================================================================
   Content, inlined from _orb.js -- the readable master. Not linked, because a
   <script src> does not load from file:// and every mockup opens standalone.
   =========================================================================== */

const ME = { pid: 0, name: "You", life: 27, active: true, priority: true, lost: false, loss: null };

const CMD = {
  oid: 101,
  name: "Aesi, Tyrant of Gyre Strait",
  art: "aesi-tyrant-of-gyre-strait.jpg",
  cost: ["4", "G", "U"],
  zone: "command",
  castable: true,
  tax: 2,
  identity: ["G", "U"],
};

/* Word + glyph. The third channel is the portrait's luminance and lives in CSS.
   None of the three is hue -- CommandZone.tsx:57-76, and the reason is
   docs/mockup-fidelity.md's top-ranked open defect. */
const CMD_STATE = {
  ready: { word: "Ready", glyph: "▶" },
  waiting: { word: "In command", glyph: "·" },
  stack: { word: "On the stack", glyph: "✦" },
  deployed: { word: "On the battlefield", glyph: "✦" },
  dead: { word: "In the graveyard", glyph: "✕" },
  exiled: { word: "Exiled", glyph: "✕" },
};
const STATE = CMD_STATE.ready;

const LETHAL = 21;
const WARN = LETHAL - 6;

const FOES = [
  { pid: 1, name: "Edgar Markov", dmg: 16 },
  { pid: 2, name: "Atraxa, Praetors' Voice", dmg: 7 },
  { pid: 3, name: "Chulane, Teller of Tales", dmg: 0 },
];
const DMG = FOES.filter((f) => f.dmg > 0);

/* markSpent(manaRow(...)) already applied -- logic/mana.ts. An ambiguous source
   ("Add {G} or {U}") is ONE split pip and never two solid ones, because two
   would claim a mana that does not exist. `spent` is the engine's own solved
   payment for a hovered spell, never arithmetic done here. */
const MANA = [
  { k: "pool-U-0", tone: "U", symbols: ["U"], floating: true, spent: false },
  { k: "src-31-0", tone: "G", symbols: ["G"], floating: false, spent: false },
  { k: "src-32-0", tone: "G", symbols: ["G"], floating: false, spent: false },
  { k: "src-33-0", tone: "any", symbols: ["G", "U"], floating: false, spent: true },
  { k: "src-34-0", tone: "U", symbols: ["U"], floating: false, spent: true },
  { k: "src-35-0", tone: "C", symbols: ["C"], floating: false, spent: false },
];
const SPENT = MANA.filter((m) => m.spent).length;

/* `peek: false` is the library, and it is deliberate: hidden information, and a
   control that does nothing when clicked is worse than no control. The other
   four are the only route into ZonePeek, so a direction that draws them
   decoratively makes the graveyard unreachable. */
const ZONES = [
  { name: "library", label: "Lib", kind: "lib", count: 41, peek: false, title: "Cards in library" },
  { name: "hand", label: "Hand", kind: "lib", count: 5, peek: true, title: "Your hand" },
  { name: "graveyard", label: "GY", kind: "gy", count: 12, peek: true, title: "GY: 12" },
  { name: "exile", label: "Exile", kind: "ex", count: 3, peek: true, title: "Exile: 3" },
  { name: "command", label: "CMD", kind: "cmd", count: 1, peek: true, title: "Command zone" },
];

/* Helpers ---------------------------------------------------------------- */

const root = document.getElementById("root");
const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (file) => "../art/" + file;

/* zones.ts: one leaf per nine cards, nine leaves and then it stops. The top
   leaf still carries the exact number, so the cap costs resolution and never
   information. */
const LEAF = 9;
const MAX_LEAVES = 9;
const leaves = (n) => (n <= 0 ? 0 : Math.min(MAX_LEAVES, Math.ceil(n / LEAF)));

const manaTitle = (p) =>
  p.spent
    ? p.symbols.join(" or ") + " — this spell would tap it"
    : p.symbols.length > 1
      ? "Either " + p.symbols.join(" or ")
      : p.floating
        ? p.symbols[0] + " in pool"
        : p.symbols[0];

const manaRowTitle =
  SPENT > 0 ? MANA.length + " available; this spell taps " + SPENT : MANA.length + " available";

const costPips = (cost) =>
  cost
    .map((s) => '<i class="pip pip--' + (/^\d+$/.test(s) ? "gen" : s) + '">' + s + "</i>")
    .join("");

/* A key, not a control: the viewport IS the design, and dev chrome would
   contaminate the screenshot. */
const greyKey = () =>
  document.addEventListener("keydown", (e) => {
    if ((e.key === "g" || e.key === "G") && e.target.tagName !== "INPUT") {
      document.documentElement.classList.toggle("grey");
    }
  });

/* Geometry ---------------------------------------------------------------- */

/* 0deg is straight up and angles run clockwise, so an arc reads the way a dial
   does. Everything on the instrument is placed through these two. */
const C = 118;
const POL = (r, deg) => {
  const a = ((deg - 90) * Math.PI) / 180;
  return [C + r * Math.cos(a), C + r * Math.sin(a)];
};
const ARC = (r, a0, a1) => {
  const [x0, y0] = POL(r, a0);
  const [x1, y1] = POL(r, a1);
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
};

/* The top half is the damage track: 0 on the left, 21 on the right, sweeping
   through the top. The bottom half is the zone ring, mirrored. */
/* The zone half is the narrower sweep of the two. At +/-72 the outermost pair
   land almost due east and west, where "radially outward" is "sideways" and the
   label sits on top of its own chip; +/-60 gives the label somewhere to go. */
const D0 = -72, D1 = 72;
const Z0 = 120, Z1 = 240;
const dmgAngle = (n) => D0 + (Math.min(n, LETHAL) / LETHAL) * (D1 - D0);

/* Views ------------------------------------------------------------------- */

function damageArc() {
  let out = '<path class="ring" d="' + ARC(102, D0, D1) + '" />';

  /* Twenty-one notches, every fifth one taller. The tick marks are what make
     "16" a position rather than a number you have to weigh against 21. */
  for (let i = 0; i <= LETHAL; i += 1) {
    const a = dmgAngle(i);
    const big = i % 5 === 0;
    const [x0, y0] = POL(big ? 96 : 99, a);
    const [x1, y1] = POL(big ? 108 : 105, a);
    out += '<line class="tick' + (big ? " tick--5" : "") + '" x1="' + x0.toFixed(2) + '" y1="' + y0.toFixed(2) + '" x2="' + x1.toFixed(2) + '" y2="' + y1.toFixed(2) + '" />';
  }

  const [lx, ly] = POL(84, D0);
  const [rx, ry] = POL(84, D1);
  out += '<text class="cap" x="' + lx.toFixed(2) + '" y="' + (ly + 3).toFixed(2) + '" text-anchor="middle">0</text>';
  out += '<text class="cap" x="' + rx.toFixed(2) + '" y="' + (ry + 3).toFixed(2) + '" text-anchor="middle">21</text>';
  /* Inside the ring rather than over the top of it: the beads live at the top
     of the arc, and a caption there is a caption underneath a bead. */
  out += '<text class="ringlab" x="' + C + '" y="64" text-anchor="middle">COMMANDER DAMAGE</text>';

  /* One bead per source that has connected, exactly as the chips do today --
     the amount is still printed, and the tooltip still names who dealt it. */
  for (const foe of DMG) {
    const a = dmgAngle(foe.dmg);
    const [sx, sy] = POL(92, a);
    const [bx, by] = POL(102, a);
    out +=
      '<g class="bead' + (foe.dmg >= WARN ? " bead--warn" : "") + '">' +
      "<title>" + esc(foe.dmg + " from " + foe.name) + "</title>" +
      '<line class="bead__spur" x1="' + sx.toFixed(2) + '" y1="' + sy.toFixed(2) + '" x2="' + bx.toFixed(2) + '" y2="' + by.toFixed(2) + '" />' +
      '<circle cx="' + bx.toFixed(2) + '" cy="' + by.toFixed(2) + '" r="8.5" />' +
      '<text x="' + bx.toFixed(2) + '" y="' + (by + 3).toFixed(2) + '">' + foe.dmg + "</text>" +
      "</g>";
  }
  return out;
}

function zoneRing() {
  let out = '<path class="ring" d="' + ARC(88, Z0, Z1) + '" />';

  ZONES.forEach((z, i) => {
    /* Swept from 252deg to 108deg, so the five run left-to-right along the
       bottom in the order the column lists them. The other direction puts the
       library on the right and reads backwards. */
    const a = Z1 - (i / (ZONES.length - 1)) * (Z1 - Z0);
    const [cx, cy] = POL(88, a);
    const [lx, ly] = POL(110, a);

    /* Leaves hang inward from the ring, one per nine cards. A group rotation
       keeps each leaf square to its own spoke. */
    let stack = "";
    for (let n = 0; n < leaves(z.count); n += 1) {
      const [px, py] = POL(77 - n * 4, a);
      stack +=
        '<rect class="zg__leaf" x="-10" y="-1.4" width="20" height="2.8" rx="1.4" ' +
        'transform="translate(' + px.toFixed(2) + " " + py.toFixed(2) + ") rotate(" + a.toFixed(2) + ')" />';
    }

    out +=
      '<g class="zg zg--' + z.kind + (z.count > 0 ? "" : " zg--empty") + (z.peek ? "" : " zg--static") +
      '" data-testid="pile-' + ME.pid + "-" + z.name + '" data-count="' + z.count + '">' +
      "<title>" + esc(z.title) + "</title>" +
      stack +
      '<rect class="zg__chip" x="' + (cx - 12).toFixed(2) + '" y="' + (cy - 8).toFixed(2) + '" width="24" height="16" rx="3" />' +
      '<text class="zg__n tabular" x="' + cx.toFixed(2) + '" y="' + (cy + 3.7).toFixed(2) + '">' + z.count + "</text>" +
      '<text class="zg__lab" x="' + lx.toFixed(2) + '" y="' + (ly + 3).toFixed(2) + '">' + esc(z.label.toUpperCase()) + "</text>" +
      "</g>";
  });
  return out;
}

function orb() {
  return (
    '<div class="orb" data-player="' + ME.pid + '" data-testid="player-' + ME.pid + '">' +
      '<div class="orb__head">' +
        '<span class="orb__name">' + esc(ME.name) + "</span>" +
        (ME.priority ? '<span class="orb__priority" title="Has priority"></span>' : "") +
      "</div>" +

      '<div class="astro">' +
        '<svg viewBox="0 0 236 236" role="img" aria-label="Life, commander damage and zone counts">' +
          damageArc() +
          zoneRing() +
        "</svg>" +
        '<div class="dial">' +
          '<span class="dial__n tabular" data-testid="life-' + ME.pid + '">' + (ME.lost ? "OUT" : ME.life) + "</span>" +
          '<span class="dial__lab">LIFE</span>' +
        "</div>" +
      "</div>" +

      '<button type="button" class="cmdslot" data-testid="commander-' + CMD.oid + '" data-castable="true" data-zone="' + CMD.zone + '" data-cmd-state="ready" title="Cast ' + esc(CMD.name) + " — +" + CMD.tax + ' commander tax">' +
        '<span class="cmdslot__art"><img src="' + artUrl(CMD.art) + '" alt=""></span>' +
        '<span class="cmdslot__tag" title="Commander">CMD</span>' +
        '<span class="cmdslot__name">' + esc(CMD.name) + "</span>" +
        '<span class="cmdslot__strip">' +
          '<span class="cmdslot__glyph" aria-hidden="true">' + STATE.glyph + "</span>" +
          '<span class="cmdslot__word">' + esc(STATE.word) + "</span>" +
          '<span class="cmdslot__cost">' + costPips(CMD.cost) +
            '<span class="cmdslot__tax" title="+' + CMD.tax + ' generic to cast from the command zone">+' + CMD.tax + "</span>" +
          "</span>" +
        "</span>" +
      "</button>" +

      '<div class="manaslot">' +
        '<div class="mana" data-testid="mana-' + ME.pid + '" data-spending="' + SPENT + '" title="' + esc(manaRowTitle) + '">' +
          MANA.map((p) =>
            '<span class="mana__pip mana__pip--' + p.tone + (p.floating ? " mana__pip--floating" : "") + (p.spent ? " mana__pip--spent" : "") + '" title="' + esc(manaTitle(p)) + '"></span>'
          ).join("") +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

function lanes() {
  const row = (tag, n) =>
    '<div class="lane"><span class="lane__tag">' + tag + "</span>" +
    Array.from({ length: n }, () => '<span class="ghost"></span>').join("") + "</div>";
  return '<div class="mat__lanes">' + row("Lands", 7) + row("Creatures", 5) + row("Other", 3) + "</div>";
}

function render() {
  root.innerHTML =
    '<div class="stage">' +
      '<div class="stage__top">' +
        '<span class="stage__id">Orb · 01 Astrolabe</span>' +
        '<span class="stage__t">one instrument · commander damage becomes a gauge</span>' +
        '<span class="stage__sp"></span>' +
        '<span class="stage__k">256 × 460 · does not fit 1600×950 · press g</span>' +
      "</div>" +
      '<div class="stage__mid">' +
        '<div class="mat"><div class="mat__side">' + orb() + "</div>" + lanes() + "</div>" +
      "</div>" +
      '<div class="stage__bot"><p class="note">' +
        "<b>Every channel, and where it went.</b> Name and the gold priority dot stay on the header. " +
        "Life is the dial, unchanged. Commander damage is the top arc — one bead per source, the amount still printed, " +
        "the name still in the tooltip, and the warn tier still red at 15 of 21, but the bead’s <b>position</b> already says " +
        "“five away” without being read. The five zones are the bottom arc: counts exact, leaves one per nine cards capped at nine, " +
        "hanging inward from a shared baseline so a drawn-down library still reads short beside a grown graveyard. " +
        "Library is the one spoke with no pointer — hidden information, so it is not a control. " +
        "The commander plinth keeps its portrait, CMD badge, two-line name, and its state said three ways (word, glyph, lit portrait); " +
        "its cost and <b>+2</b> tax still land one glance above the mana row that pays them. " +
        "<b>Not shown, and how they are said:</b> active turn is the gold rim and the dial’s warm glow (both on now); " +
        "targetable is the blue 2px ring; eliminated greys the whole instrument and the dial reads OUT with the loss reason under the name; " +
        "the other four commander states dim, inset, or dash the plinth exactly as today." +
      "</p></div>" +
    "</div>";
}

render();
greyKey();
</script>
</body>
</html>
