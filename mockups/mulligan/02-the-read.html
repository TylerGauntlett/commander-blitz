<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 The Read — the mulligan, 1280×800</title>
<link rel="stylesheet" href="_mull.css">
<style>
/*
 * 02 THE READ — the game already knows what you are holding. Let it say so.
 * ===========================================================================
 *
 * THE ARGUMENT: a mulligan is the only decision in Magic that a new player is
 * asked to make before they have been taught anything, and the shipped screen
 * answers it with the word "Keep this hand?" and two grey rectangles. Every
 * number that decides the answer -- how many lands, whether both of your
 * commander's colours are represented, what you can cast and when -- is already
 * in `player_view` and none of it is on the screen.
 *
 * So: the hand at a readable size, and a third of the panel spent on a READ of
 * it. Not advice. The panel never says "keep" -- it says three lands, both
 * colours, first play on turn one, one of the three enters tapped, and leaves
 * the judgement where it belongs.
 *
 * Everything the panel prints comes out of `READ` in `_mull.js`, derived from
 * `HAND` on load. Nothing here is a number typed twice, which is the whole
 * reason that object exists: `../handheld-board/README.md`'s `seatsAgree` gate
 * was built because a strip saying "3 lands, 2 untapped" over a sketch is
 * unfalsifiable, and a stat panel is that failure waiting to happen.
 *
 * ---------------------------------------------------------------------------
 * THE OTHER HALF OF THIS DIRECTION IS THE COMMIT BAR, and it is the answer to
 * `../README.md`'s finding 2 -- "every control has the same weight".
 *
 * Keep and Mulligan are not two options. Keep is the answer most of the time,
 * and a mulligan COSTS something specific and nameable: you draw seven and put
 * one on the bottom (`game.py:1173-1187`), so a first mulligan is a six-card
 * hand you chose six of. The shipped dialog's two `.opt` buttons are the same
 * rectangle and neither says that. Here Keep is a 542px gold plate and Mulligan
 * is a 300px dark one that prints its own price.
 *
 * ---------------------------------------------------------------------------
 * THE PRICE: a third of the screen goes to a panel, which means the hand is at
 * 178px instead of 01's 196, in two rows instead of an arc. This is the least
 * game-shaped of the five and the most useful, and that trade is the point of
 * having it in the round.
 */

.read__grid {
  position: absolute;
  inset: 0;
  padding: 26px;
  display: grid;
  grid-template-columns: 1fr 354px;
  grid-template-rows: 44px 1fr auto;
  gap: 22px 16px;
}

/* The header, across the hand only -- the panel has its own. */
/* THE NAV HINT LIVES UP HERE, and that is a fix rather than a preference. The
   shared `.hints` rail is `position: absolute; bottom: 16px`, and this is the
   one direction whose commit bar reaches the foot of the panel -- so the rail
   drew straight across the Keep plate's own subtitle. Caught in the shot, not
   in the source, which is the argument for shooting every file. */
.head {
  grid-column: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.head__hint {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-faint);
  font-size: var(--fs-floor);
}
.head__what {
  font-size: var(--fs-big);
  font-weight: 800;
  line-height: 1;
  color: var(--text);
}
.head__who { font-size: var(--fs-floor); color: var(--text-dim); }
.head__who b { color: var(--gold); font-weight: 600; }

/* ==========================================================================
   The hand, as a grid rather than a fan
   ==========================================================================
   4 + 3 at 178px. A fan is the better picture of a hand and this direction
   cannot afford one: an arc needs about 58px of extra reach per side (01's
   arithmetic) and the panel has taken that width. A grid also gives every card
   the same prominence, which is right here -- the panel is doing the ranking.
   ========================================================================== */
.hand {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  justify-content: center;
}
.hand__row { display: flex; gap: 14px; }
.hand__slot { position: relative; transition: transform var(--t-fast) ease; }
.hand__slot[data-on] { transform: translateY(-6px); }
.hand__slot[data-on] .face {
  box-shadow: 0 0 0 3px var(--focus), 0 0 30px var(--focus-glow), 0 12px 30px rgba(0, 0, 0, 0.7);
}
.hand__slot:not([data-on]) .face { filter: brightness(0.86); }

/* A land is what this decision counts, so a land says so from across the room.
   `../README.md`'s standing complaint is that lands are all one tan rectangle;
   the three that matter here carry a tab down the whole left edge in the same
   green the panel counts them in.

   ONLY A LAND HAS ONE. The first draft gave every slot a tab and coloured the
   lands' differently, which put a tan sliver on Tatyova and Sol Ring -- a mark
   that means nothing, on the cards the mark is meant to distinguish FROM. */
.hand__tab { display: none; }
.hand__slot[data-land] .hand__tab {
  display: block;
  position: absolute;
  left: -6px;
  top: 14px;
  bottom: 14px;
  width: 6px;
  border-radius: 3px 0 0 3px;
  background: var(--playable);
  box-shadow: 0 0 14px rgba(92, 224, 138, 0.4);
}

/* ==========================================================================
   The panel
   ========================================================================== */
.panel {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 18px 20px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: var(--pane-bg);
  box-shadow: var(--pane-shadow);
}
.panel__title {
  font-size: var(--fs-floor);
  font-weight: 700;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.blk { display: grid; gap: 8px; }
.blk__label {
  font-size: var(--fs-floor);
  font-weight: 600;
  color: var(--text-dim);
}
.rule { height: 1px; background: var(--edge); }

/* Lands: the one number the decision turns on, at the size of the decision. */
.lands { display: flex; align-items: baseline; gap: 10px; }
.lands__n {
  font-size: 56px;
  font-weight: 800;
  line-height: 0.9;
  color: var(--playable);
  font-variant-numeric: tabular-nums;
}
.lands__of { font-size: var(--fs-lead); color: var(--text-dim); }
.dots { display: flex; gap: 6px; margin-top: 4px; }
.dot {
  width: 26px;
  height: 10px;
  border-radius: 5px;
  background: rgba(160, 155, 196, 0.28);
}
.dot[data-land] { background: var(--playable); }
.dot[data-tapped] { background: var(--staged); }

/* Colours: not "the hand is green-blue" but "your commander needs G and U, and
   here is how many sources of each you have". A count of zero is the actual
   mulligan reason and it is the one this panel must never bury. */
.src { display: flex; align-items: center; gap: 12px; }
.src__one { display: flex; align-items: center; gap: 7px; font-size: var(--fs-lead); }
.src__one .sym { --face-fs: 24px; }
.src__one b { font-weight: 700; font-variant-numeric: tabular-nums; }
.src__one[data-out] { color: var(--danger); }

/* The curve, as bars. Four spells at 1, 2, 4, 4. */
.curve { display: grid; gap: 6px; }
.curve__row { display: flex; align-items: center; gap: 10px; font-size: var(--fs-floor); }
.curve__cmc {
  width: 26px;
  flex: none;
  text-align: right;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.curve__bar { height: 16px; border-radius: 3px; background: var(--astral); flex: none; }
.curve__n { color: var(--text-faint); }

.first { display: flex; align-items: center; gap: 10px; font-size: var(--fs-floor); }
.first b { color: var(--text); }
.warn { color: var(--staged); font-size: var(--fs-floor); }

/* The foot of the panel is the only per-card thing on it -- what you are on. */
.panel__on {
  margin-top: auto;
  display: grid;
  gap: 6px;
  padding-top: 14px;
  border-top: 1px solid var(--edge);
}
.panel__on b { font-size: var(--fs-lead); font-weight: 700; }
.panel__on span { color: var(--text-dim); font-size: var(--fs-floor); }

/* ==========================================================================
   The commit bar
   ========================================================================== */
.bar {
  grid-column: 1;
  grid-row: 3;
  display: flex;
  gap: 16px;
  height: 106px;
}
.plate {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  border-radius: 14px;
  border: 1px solid var(--edge);
  background: var(--pane-well);
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.plate__words { display: grid; gap: 4px; }
.plate__verb { font-size: var(--fs-big); font-weight: 800; line-height: 1; }
/* NOWRAP, and it is load-bearing: the plate is 106px tall with a 30px verb in
   it, so a subtitle that wraps to two lines has its second line clipped by the
   plate's own bottom edge. Better to size the sentence to the plate than to let
   the plate silently eat half of it. */
.plate__sub {
  font-size: var(--fs-floor);
  color: var(--text-dim);
  white-space: nowrap;
}

/*
 * THE COMMIT TIER. Gold fill, gold rim, and 574 of the bar's 858px. The one
 * rule it must not break is that gold here is `--gold`, the commit colour, and
 * the selection ring on the hand above is `--focus` -- two different facts,
 * kept apart, exactly as `handheld.css:36-37` keeps them.
 */
.plate--keep {
  flex: 1 1 542px;
  border-color: var(--gold-deep);
  background: linear-gradient(180deg, rgba(255, 212, 121, 0.16), rgba(216, 166, 60, 0.06));
  box-shadow: 0 0 30px rgba(216, 166, 60, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.plate--keep .plate__verb { color: var(--gold); }
.plate--keep .plate__sub { color: rgba(255, 212, 121, 0.72); }

/* One tier down, and its subtitle is the PRICE. `game.py:1173-1187`: a first
   mulligan draws seven and bottoms one, so what you are buying is a six-card
   hand you got to choose six of. That sentence has never been on the screen. */
.plate--mull { flex: 0 0 300px; }
.plate--mull .plate__verb { font-size: var(--fs-lead); }

.plate:active { transform: translateY(2px); }
</style>
</head>
<body>
<script src="_mull.js"></script>
<script>
/* 4 + 3, and the grid is written down because the navigation reads it: up and
   down have to know which card sits above which, and deriving that from the
   DOM would make it a property of the flow rather than of the design. */
const ROWS = [[0, 1, 2, 3], [4, 5, 6]];

const STATES = ["raised"];
function GOTO() { STAGE.raise(HAND[state.on]); }
const CARD_W = 178;
const state = { on: 0 };

const pos = (i) => {
  const r = ROWS.findIndex((row) => row.includes(i));
  return { r, c: ROWS[r].indexOf(i) };
};

function panelHTML() {
  const maxCurve = Math.max(...Object.values(READ.curve));
  const cmcs = Object.keys(READ.curve).map(Number).sort((a, b) => a - b);
  return (
    '<div class="panel">' +
    '<div class="panel__title">The read</div>' +

    '<div class="blk"><div class="blk__label">Lands</div>' +
    '<div class="lands"><span class="lands__n">' + READ.lands + "</span>" +
    '<span class="lands__of">of ' + HAND.length + " cards</span></div>" +
    '<div class="dots">' +
    HAND.map((c) =>
      '<span class="dot"' + (c.kind === "land" ? " data-land" : "") +
      (c.tapland ? " data-tapped" : "") + "></span>"
    ).join("") +
    "</div>" +
    (READ.taplands
      ? '<div class="warn">' + READ.taplands + " of them enters tapped</div>"
      : "") +
    "</div>" +

    '<div class="rule"></div>' +

    '<div class="blk"><div class="blk__label">Sources for ' + esc(COMMANDER.name.split(",")[0]) + "</div>" +
    '<div class="src">' +
    READ.identity.map((x) =>
      '<span class="src__one"' + (x.have ? "" : " data-out") + ">" + sym(x.colour) +
      "<b>" + (READ.sources[x.colour] || 0) + "</b></span>"
    ).join("") +
    "</div></div>" +

    '<div class="rule"></div>' +

    '<div class="blk"><div class="blk__label">What you can cast</div>' +
    '<div class="curve">' +
    cmcs.map((n) =>
      '<div class="curve__row"><span class="curve__cmc">' + n + "</span>" +
      '<span class="curve__bar" style="width:' +
      Math.round((READ.curve[n] / maxCurve) * 150) + 'px"></span>' +
      '<span class="curve__n">' + READ.curve[n] + "</span></div>"
    ).join("") +
    "</div>" +
    '<div class="first">First play <b>' + esc(READ.firstPlay.name) + ", turn " +
    Math.max(1, READ.firstPlay.cmc) + "</b></div>" +
    "</div>" +

    '<div class="rule"></div>' +

    /* The count the engine puts in `PendingDecision.prompt` and the client
       throws away (`labels.ts:103` prints its own string instead). Six lamps,
       because "(0 taken)" in a title is a number nobody reads and six lamps
       going out one at a time is a resource. */
    '<div class="blk"><div class="blk__label">Mulligans left</div>' +
    '<div class="dots">' +
    Array.from({ length: MAX_MULLIGANS }, () => '<span class="dot" data-land></span>').join("") +
    "</div></div>" +

    '<div class="panel__on" id="on"></div>' +
    "</div>"
  );
}

function markup() {
  return (
    '<div class="read__grid">' +
    '<div class="head"><span class="head__what">Opening hand</span>' +
    '<span class="head__who">' + esc(COMMANDER.name) + "</span>" +
    '<span class="head__hint">' +
    '<span class="glyph glyph--key">&#8592;</span><span class="glyph glyph--key">&#8594;</span>' +
    '<span class="glyph glyph--key">&#8593;</span><span class="glyph glyph--key">&#8595;</span>' +
    "Move</span>" +
    '<span class="head__hint" style="margin-left:18px">' +
    '<span class="glyph glyph--y">Y</span>Read the card</span></div>' +

    '<div class="hand">' +
    ROWS.map((row) =>
      '<div class="hand__row">' +
      row.map((i) => {
        const c = HAND[i];
        return (
          '<div class="hand__slot" id="slot-' + i + '" data-i="' + i + '"' +
          (c.kind === "land" ? " data-land" : "") + ">" +
          '<span class="hand__tab"></span>' +
          faceHTML(c, { w: CARD_W, fs: 16 }) +
          "</div>"
        );
      }).join("") +
      "</div>"
    ).join("") +
    "</div>" +

    panelHTML() +

    '<div class="bar">' +
    '<button class="plate plate--keep" type="button" id="keep" data-hit>' +
    '<span class="glyph glyph--a" style="width:40px;height:40px;font-size:20px">A</span>' +
    '<span class="plate__words"><span class="plate__verb">Keep</span>' +
    '<span class="plate__sub">Three lands, both colours, a play on turn one</span>' +
    "</span></button>" +
    '<button class="plate plate--mull" type="button" id="mull" data-hit>' +
    '<span class="glyph glyph--b" style="width:40px;height:40px;font-size:20px">B</span>' +
    '<span class="plate__words"><span class="plate__verb">Mulligan</span>' +
    '<span class="plate__sub">Draw seven, keep six</span>' +
    "</span></button>" +
    "</div>" +
    "</div>" +
""
  );
}

function place() {
  HAND.forEach((_, i) =>
    document.getElementById("slot-" + i).toggleAttribute("data-on", i === state.on)
  );
  /* A raised card follows the selection rather than closing when it moves --
     walking the hand with the reader up is how you compare two cards, and
     making the player re-open it every step is the failure that turns a reader
     into a thing nobody uses. */
  if (STAGE.raised) STAGE.raise(HAND[state.on]);
  const c = HAND[state.on];
  document.getElementById("on").innerHTML =
    "<b>" + esc(c.name) + "</b><span>" + esc(c.line) + " &middot; " + esc(c.note) + "</span>";
  STAGE.tag("on: <b>" + esc(c.name) + "</b>");
}

/*
 * MOVING IN A RAGGED GRID.
 *
 * Row 1 has four cards and row 2 has three, so "down" from the fourth card has
 * nowhere square to land. It goes to the nearest column that exists rather than
 * refusing, because a refusal here would be the grid's arithmetic showing
 * through -- the player did not put a hole there and should not have to know
 * about it. A refusal at the ENDS of a row is different: that is a real edge and
 * 01's rule holds, visible and felt.
 */
function move(dc, dr) {
  const { r, c } = pos(state.on);
  if (dr) {
    const nr = r + dr;
    if (nr < 0 || nr >= ROWS.length) { STAGE.refuse(document.querySelector(".hand"), 0); return; }
    state.on = ROWS[nr][Math.min(c, ROWS[nr].length - 1)];
  } else {
    const nc = c + dc;
    if (nc < 0 || nc >= ROWS[r].length) {
      STAGE.refuse(document.getElementById("slot-" + state.on), dc);
      return;
    }
    state.on = ROWS[r][nc];
  }
  place();
}

const keep = () => STAGE.commit("Keep", "Seven cards. Turn one: Forest, Sol Ring.");
const mull = () => STAGE.commit("Mulligan", "Draw seven, then put one on the bottom.", true);

STAGE.mount("02 The Read", markup(), {
  left: () => move(-1, 0),
  right: () => move(1, 0),
  up: () => move(0, -1),
  down: () => move(0, 1),
  a: keep,
  b: mull,
  /*
   * THE RAISE, AND WHY THIS DIRECTION STILL NEEDS ONE.
   *
   * 02's panel already answers "should I keep this" better than any card's
   * rules text does -- three lands, both colours, a play on turn one. What it
   * cannot answer is "what does this particular card do", and the panel's foot
   * says `Blocks, then fetches a land`, which is a summary somebody wrote,
   * not the card.
   *
   * IT COULD HAVE BEEN DOCKED INSTEAD. The panel is 354px wide and a full card
   * is 295, so one would fit -- but a full card is 413px tall and the panel's
   * 584 already holds the lands block, the sources, the curve and the lamps.
   * Docking it means dropping the curve, and the curve is one of the better
   * things on this screen. So the card is raised on demand and the aggregate
   * keeps the panel, which is this direction's whole thesis about what a
   * mulligan screen is for.
   */
  y: () => STAGE.toggleRaise(HAND[state.on]),
});

for (const el of document.querySelectorAll(".hand__slot")) {
  el.addEventListener("mouseenter", () => { state.on = +el.dataset.i; place(); });
}
document.getElementById("keep").addEventListener("click", keep);
document.getElementById("mull").addEventListener("click", mull);

place();
</script>
</body>
</html>
