<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 The Second Question — the mulligan, 1280×800</title>
<link rel="stylesheet" href="_mull.css">
<style>
/*
 * 05 THE SECOND QUESTION — a London mulligan is two questions, and the client
 * answers them in two unrelated rooms.
 * ===========================================================================
 *
 * THE ARGUMENT, and it is the one problem in this round that is not about looks.
 *
 * `game.py:1151-1188` asks TWO things. First, in a loop, `DecisionKind.MULLIGAN`
 * -- keep or mulligan. Then, once you have kept, `ask_objects(... bottom, bottom)`
 * -- put N cards on the bottom of your library, where N is how many mulligans
 * you took.
 *
 * The client draws those two with the same component and they do not look like
 * the same moment at all. The first is `pending.kind === "mulligan"`, whose two
 * options carry no `ref`, so `rowsFor` finds no card and `PromptDialog` renders
 * two bare `.opt` labels. The second is `choose_objects`, whose options DO carry
 * refs, so the same dialog renders `.opt--card` faces at `--card-w: 172px`. One
 * decision, two frames: a small box with two words in it, and then -- with no
 * transition, no heading that connects them, and the same generic title bar -- a
 * wide box full of card art. `serialize._pending` had to be added specifically
 * because the second one was collapsing to "a row of names with no way to tell
 * what you were choosing between" (`PromptDialog.tsx:14-19`), which is the same
 * complaint one layer down.
 *
 * So this direction changes nothing about the room between them. The seven
 * cards are selectable objects from the first frame. The stage ribbon says
 * which of the four steps you are in. And when the second question arrives, the
 * cards do not move, the reader does not move, and the only thing that changes
 * is what A and B are called.
 *
 * ---------------------------------------------------------------------------
 * THE THREE STATES, all reachable from the keyboard: `GOTO("bottom")`,
 * `GOTO("bottom2")`, or press B in the page. `Y` resets.
 *
 * The third state is there because ONE pick and TWO picks are different
 * controls -- one is a press, two is a set you build and confirm -- and a
 * design that only ever shows the first will discover the second in the wild.
 *
 * ---------------------------------------------------------------------------
 * THE PRICE: this is the only direction with a three-button grammar (A toggles,
 * X confirms, B mulligans again), and a screen that changes what its buttons
 * mean is a screen that has to be read rather than felt. 01 and 03 never change
 * theirs. The bet is that a ribbon which says where you are buys back more than
 * the extra verb costs.
 */

/* The question. It is the ONE thing that changes between the two halves, so it
   is the largest type on the screen and it is in the same place both times --
   which is the entire structural claim, made in a position rather than a word. */
.q {
  position: absolute;
  left: 0;
  right: 0;
  top: 28px;
  text-align: center;
  font-size: var(--fs-big);
  font-weight: 800;
  line-height: 1.2;
}

/* ==========================================================================
   The ribbon
   ==========================================================================
   Four steps: deal, keep-or-mulligan, bottom, turn one. The mulligan loop is
   the one place in this game where a decision is followed by another decision
   that is part of the same act, and nothing on the shipped screen says so.
   ========================================================================== */
.ribbon {
  position: absolute;
  left: 0;
  right: 0;
  top: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
}
.step {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 32px;
  padding: 0 16px;
  border-radius: 16px;
  font-size: var(--fs-floor);
  font-weight: 600;
  color: var(--text-faint);
  white-space: nowrap;
}
.step[data-done] { color: var(--text-dim); }
.step[data-now] {
  color: var(--gold);
  background: rgba(255, 212, 121, 0.12);
  box-shadow: inset 0 0 0 1px rgba(255, 212, 121, 0.34);
}
.step__tick { color: var(--playable); }
.step__arrow { color: var(--text-faint); padding: 0 2px; font-size: var(--fs-floor); }

/* ==========================================================================
   The seven, which never move
   ==========================================================================
   A straight row rather than an arc, and that is forced by the second question:
   in the bottoming step a card carries a tag, and a tag on a card that is
   rotated 6 degrees and overlapped by its neighbour is a tag you have to hunt
   for. The fan is the better picture of a hand; this is the better picture of
   seven things you are choosing between, and this direction has to be both.
   ========================================================================== */
.row { position: absolute; left: 0; right: 0; top: 196px; height: 230px; }
.slot {
  position: absolute;
  top: 0;
  width: 164px;
  height: 230px;
}
.lift {
  position: relative;
  display: block;
  transition: transform var(--t-base) cubic-bezier(0.22, 1, 0.36, 1),
              filter var(--t-base) ease;
}
.slot[data-on] { z-index: 10; }
.slot[data-on] .lift { transform: translateY(-24px); }
.slot[data-on] .face {
  box-shadow: 0 0 0 3px var(--focus), 0 0 30px var(--focus-glow), 0 14px 34px rgba(0, 0, 0, 0.7);
}
.slot:not([data-on]) .face { filter: brightness(0.86); }

/* A card marked for the bottom sinks and goes cold, and the tag says which way
   it is going. `--staged` is the board's own "you have committed this but not
   paid for it yet" colour, which is exactly what a pick before the confirm is. */
.slot[data-pick] .lift { transform: translateY(22px); filter: saturate(0.5) brightness(0.62); }
.slot[data-pick][data-on] .lift { transform: translateY(6px); filter: saturate(0.7) brightness(0.78); }
.slot[data-pick] .face { border-color: var(--staged); }
.tag {
  position: absolute;
  left: 50%;
  top: -16px;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: 15px;
  background: var(--staged);
  color: #2a1c04;
  font-size: var(--fs-floor);
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
}
.slot[data-pick] .tag { display: flex; }

/* ==========================================================================
   The reader, which also never moves
   ========================================================================== */
/* Sized to its content rather than to the panel: at `left/right: 180px` it was a
   920px box holding about 500px of words, and an empty half-panel reads as
   something failing to load. */
.reader {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  min-width: 620px;
  top: 466px;
  height: 104px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 24px;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: var(--pane-bg);
  box-shadow: var(--pane-shadow);
}
.reader__name { font-size: var(--fs-big); font-weight: 800; white-space: nowrap; }
.reader__cost { display: flex; gap: 4px; }
.reader__cost .sym { --face-fs: 26px; }
.reader__rule { width: 1px; align-self: stretch; margin: 20px 0; background: var(--edge); }
.reader__body { display: grid; gap: 4px; min-width: 0; }
.reader__line { font-size: var(--fs-floor); color: var(--text-dim); }
.reader__note { font-size: var(--fs-lead); }
.reader__count {
  margin-left: auto;
  flex: none;
  text-align: right;
  font-size: var(--fs-floor);
  color: var(--staged);
  font-weight: 700;
}

/* ==========================================================================
   The prompts, which are the only thing that DOES change
   ========================================================================== */
.acts {
  position: absolute;
  left: 0;
  right: 0;
  top: 610px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 54px;
}
.act {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: var(--hit-floor);
  padding: 10px 4px;
  background: none;
  border: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.act .glyph { width: 38px; height: 38px; font-size: 19px; }
.act__words { display: grid; gap: 3px; text-align: left; }
.act__verb { font-size: var(--fs-lead); font-weight: 800; line-height: 1.1; }
.act--hero .act__verb { font-size: var(--fs-big); color: var(--gold); }
.act__sub { font-size: var(--fs-floor); color: var(--text-dim); }

/* NOT `disabled`, and not hidden either. A confirm you cannot press yet has to
   stay in its place, at its size, so the eye that has already learned where it
   is does not have to find it again the moment it lights. */
.act[data-off] { opacity: 0.32; cursor: default; }
</style>
</head>
<body>
<script src="_mull.js"></script>
<script>
/*
 * PITCH > CARD_W, and in this round that is unique to this file.
 *
 * 01 overlaps by 16px and 04 by 102, because both are drawing a HAND -- a thing
 * you hold, whose cards are behind one another. This is drawing seven things
 * you are choosing between, and a gap is what makes them seven objects instead
 * of one object with seven edges. It also keeps each card's own bottom tag
 * clear of its neighbours, which is the whole reason the row is straight.
 *
 * 7 x 164 + 6 x 12 = 1220 leaves 30px of margin, and 164 is what that division
 * allows -- the smallest card in the round, and the price of the gap.
 */
const CARD_W = 164;
const PITCH = 176;
const ROW_W = PITCH * (HAND.length - 1) + CARD_W;
const LEFT = (1280 - ROW_W) / 2;

/*
 * ONE STATE OBJECT FOR BOTH QUESTIONS, which is the direction restated as data.
 *
 * `taken` is `player.mulligans_taken` and it is the only thing that decides
 * which question is being asked -- `game.py:1173` computes the number of cards
 * to bottom as exactly `min(mulligans_taken, len(hand))`. So there is no
 * `phase` field: the phase is derived, and a screen that derives it cannot get
 * the two halves out of step with each other.
 */
const state = { on: 3, taken: 0, picked: new Set() };
const need = () => state.taken;
const asking = () => state.taken === 0;

const STATES = ["bottom", "bottom2", "raised"];
function GOTO(name) {
  if (name === "raised") { STAGE.raise(HAND[state.on]); return; }
  state.taken = name === "bottom2" ? 2 : name === "bottom" ? 1 : 0;
  state.picked.clear();
  if (name === "bottom2") state.picked.add(5);
  render();
}

const STEPS = [
  { key: "deal", label: "Seven dealt" },
  { key: "ask", label: "Keep or mulligan" },
  { key: "bottom", label: "To the bottom" },
  { key: "turn", label: "Turn one" },
];

function ribbonHTML() {
  const nowKey = asking() ? "ask" : "bottom";
  const order = STEPS.map((s) => s.key);
  const nowAt = order.indexOf(nowKey);
  return (
    '<div class="ribbon">' +
    STEPS.map((s, i) => {
      const done = i < nowAt;
      const now = i === nowAt;
      /* The bottoming step is not on the board at all until a mulligan has been
         taken -- with zero taken, `bottom` is 0 and the engine skips the ask
         entirely. Showing it as a step you will reach would be the ribbon
         promising something that usually does not happen. */
      const ghost = s.key === "bottom" && asking();
      return (
        (i ? '<span class="step__arrow">&rsaquo;</span>' : "") +
        '<span class="step" data-key="' + s.key + '"' +
        (done ? " data-done" : "") + (now ? " data-now" : "") +
        (ghost ? ' style="opacity:.4"' : "") + ">" +
        (done ? '<span class="step__tick">&#10003;</span>' : "") +
        esc(s.label) +
        (s.key === "bottom" && !asking() ? " &times; " + need() : "") +
        "</span>"
      );
    }).join("") +
    "</div>"
  );
}

function markup() {
  return (
    '<div class="q" id="q"></div>' +
    '<div id="ribbon"></div>' +
    '<div class="row" id="row">' +
    HAND.map((c, i) =>
      '<div class="slot" id="slot-' + i + '" data-i="' + i + '" style="left:' +
      (LEFT + i * PITCH) + 'px">' +
      '<div class="lift">' + faceHTML(c, { w: CARD_W, fs: 16 }) + "</div>" +
      '<span class="tag">&#8595; Bottom</span>' +
      "</div>"
    ).join("") +
    "</div>" +
    '<div class="reader" id="reader"></div>' +
    '<div class="acts" id="acts"></div>' +
    '<div class="hints"><span class="hint">' +
    '<span class="glyph glyph--key">&#8592;</span><span class="glyph glyph--key">&#8594;</span>' +
    "Move</span>" +
    '<span class="hint"><span class="glyph glyph--y">Y</span>Read the card</span>' +
    /* The reset is a REVIEW affordance and not part of the design, so it is on
       the ribbon's first step rather than on a button: clicking "Seven dealt"
       goes back to the first question. Spending a face button on it would have
       put a control in the hint bar that no shipped build would have. */
    '<span class="hint hints__sp">Click <b>Seven dealt</b> to start over</span>' +
    "</div>"
  );
}

/* One render for both questions. There is no branch that draws a different
   ROOM -- only different words in the same three slots. */
function render() {
  const n = need();
  const enough = state.picked.size === n;

  document.getElementById("q").textContent = asking()
    ? "Keep this hand?"
    : n === 1
      ? "Put one card on the bottom"
      : "Put " + n + " cards on the bottom";

  document.getElementById("ribbon").innerHTML = ribbonHTML();

  HAND.forEach((_, i) => {
    const el = document.getElementById("slot-" + i);
    el.toggleAttribute("data-on", i === state.on);
    el.toggleAttribute("data-pick", state.picked.has(i));
  });

  const c = HAND[state.on];
  document.getElementById("reader").innerHTML =
    '<span class="reader__name">' + esc(c.name) + "</span>" +
    (c.cost.length ? '<span class="reader__cost">' + cost(c.cost) + "</span>" : "") +
    '<span class="reader__rule"></span>' +
    '<span class="reader__body">' +
    '<span class="reader__line">' + esc(c.line) + "</span>" +
    '<span class="reader__note">' + esc(c.note) + "</span></span>" +
    (asking()
      ? ""
      : '<span class="reader__count">' + state.picked.size + " of " + n + " chosen</span>");

  document.getElementById("acts").innerHTML = asking()
    ? act("b", "Mulligan", "to six", false) + act("a", "Keep", "seven cards", true)
    : act("b", "Mulligan again", "to " + (7 - n - 1), false) +
      act("a", state.picked.has(state.on) ? "Take it back" : "To the bottom",
          esc(HAND[state.on].name), false) +
      act("x", "Confirm", enough ? "and start the game" : n - state.picked.size + " to go",
          true, !enough);

  wireActs();
  const back = document.querySelector('.step[data-key="deal"]');
  if (back) {
    back.style.cursor = "pointer";
    back.addEventListener("click", () => GOTO("ask"));
  }
  if (STAGE.raised) STAGE.raise(HAND[state.on]);
  STAGE.tag(
    "mulligans: <b>" + state.taken + "</b> &middot; " +
    (asking() ? "asking" : "bottoming " + state.picked.size + "/" + n)
  );
}

function act(glyph, verb, sub, hero, off) {
  return (
    '<button class="act' + (hero ? " act--hero" : "") + '" type="button" data-act="' +
    glyph + '"' + (off ? " data-off" : "") + " data-hit>" +
    '<span class="glyph glyph--' + glyph + '">' + glyph.toUpperCase() + "</span>" +
    '<span class="act__words"><span class="act__verb">' + esc(verb) + "</span>" +
    '<span class="act__sub">' + sub + "</span></span></button>"
  );
}

function step(d) {
  const next = state.on + d;
  if (next < 0 || next >= HAND.length) { STAGE.refuse(document.getElementById("row"), d); return; }
  state.on = next;
  render();
}

function pressA() {
  if (asking()) { STAGE.commit("Keep", "Seven cards. Turn one: Forest, Sol Ring."); return; }
  if (state.picked.has(state.on)) { state.picked.delete(state.on); render(); return; }
  if (state.picked.size >= need()) {
    /* Already holding as many as the engine asked for. Refusing is right and
       silently swapping one out would be worse: `ask_objects` is called with
       min === max, so "one more" is not a thing this decision can mean. */
    STAGE.refuse(document.getElementById("slot-" + state.on), 1);
    return;
  }
  state.picked.add(state.on);
  render();
}

function pressB() {
  if (state.taken >= 2) {
    /* The mockup stops at two so the three states stay comparable; the engine
       goes to six (`game.py:43`). */
    STAGE.refuse(document.getElementById("row"), -1);
    return;
  }
  state.taken += 1;
  state.picked.clear();
  STAGE.commit("Mulligan", "Seven again. " + state.taken + " to the bottom.", true);
  render();
}

function pressX() {
  if (asking() || state.picked.size !== need()) { STAGE.refuse(document.getElementById("row"), 1); return; }
  STAGE.commit("Keep", (7 - need()) + " cards. " + need() + " on the bottom.");
}

function wireActs() {
  for (const el of document.querySelectorAll("[data-act]")) {
    const which = el.dataset.act;
    el.addEventListener("click", () =>
      which === "a" ? pressA() : which === "b" ? pressB() : pressX()
    );
  }
}

STAGE.mount("05 The Second Question", markup(), {
  left: () => step(-1),
  right: () => step(1),
  a: pressA,
  b: pressB,
  x: pressX,
  /*
   * THE RAISE, ON THE ONE SCREEN WHERE IT IS ALSO PART OF THE DECISION.
   *
   * In the first question it does what it does everywhere: shows you what a
   * card says. In the second it is doing something else -- you are choosing
   * which card to LOSE, and "Sacrifice this creature: search your library for
   * a basic land" is the whole argument for and against bottoming Sakura-Tribe
   * Elder. This is the only direction where the reader and the answer are about
   * the same object, which is why the raised card keeps its `Bottom` tag.
   */
  y: () => STAGE.toggleRaise(HAND[state.on]),
});

for (const el of document.querySelectorAll(".slot")) {
  el.addEventListener("mouseenter", () => { state.on = +el.dataset.i; render(); });
}

render();
</script>
</body>
</html>
