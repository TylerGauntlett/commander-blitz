<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 The Table — the mulligan, 1280×800</title>
<link rel="stylesheet" href="_mull.css">
<style>
/*
 * 03 THE TABLE — a mulligan is a table moment, not a private dialog.
 * ===========================================================================
 *
 * THE ARGUMENT: four people are asked this question, and the shipped screen
 * draws one of them.
 *
 * `_opening_sequence` (`game.py:1149-1189`) loops the seats in order, so by the
 * time the question reaches you some of the pod have kept, some have gone to
 * six, and some have not been asked yet. `serialize` carries `mulligans_taken`
 * and `has_kept_hand` for every player, so the client HAS all of it. The dialog
 * shows none of it, and it cannot: it is a box in the middle of the viewport
 * with a backdrop over everything the other three seats would be drawn on.
 *
 * That matters beyond flavour. "Two of them mulliganed and one kept seven" is
 * information about the game you are about to play, on the only screen where
 * you have nothing else to do with your attention. And it is the difference
 * between a game and a form: a form asks you a question, a table has other
 * people at it.
 *
 * So the whole pod is on screen, your seat is the bottom one, and THE ANSWER
 * RIDES YOUR OWN SEAT -- the same row of the same object that says "kept 7"
 * under Vessa says A / B under you. Four seats, four states, one grammar.
 *
 * ---------------------------------------------------------------------------
 * THE PRICE: the three opponent seats cost 148px of height, so the hand lands
 * at 168px -- 01's is 176 and this fans further, because the row here is 1232px
 * wide with nothing beside it. What it really costs is that the hand is no
 * longer the only thing on the screen, which for a first-time player may be
 * exactly wrong. 01 is the direction that disagrees.
 */

/* ==========================================================================
   The other three
   ==========================================================================
   `../seat/README.md` is the round that designed an opponent's seat at 332x84
   and found "nothing lines up" to be the number seven. This is a different
   seat -- pre-game, so no board, no life change, nothing tapped -- which means
   it can be what that round could not: three fields and a state.
   ========================================================================== */
.pod {
  position: absolute;
  left: 24px;
  right: 24px;
  top: 24px;
  display: flex;
  gap: 16px;
}
.seat {
  flex: 1 1 0;
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 14px;
  align-items: center;
  height: 116px;
  padding: 10px 16px 10px 10px;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: var(--pane-bg);
  box-shadow: var(--pane-shadow);
}
.seat__crop {
  width: 96px;
  height: 96px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid var(--edge-hi);
}
.seat__body { display: grid; gap: 5px; min-width: 0; }
.seat__name { font-size: var(--fs-lead); font-weight: 700; }
.seat__cmd {
  font-size: var(--fs-floor);
  color: var(--text-dim);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.seat__id { display: flex; gap: 4px; }
.seat__id .sym { --face-fs: 18px; }

/*
 * THE STATE CHIP is the whole point of the seat and it is three states, in
 * three colours that already mean these things elsewhere on the board:
 * `--playable` is "this is done and fine", `--staged` is "this cost something",
 * and `--text-faint` is "not yet". No new vocabulary.
 */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  /* JUSTIFY, not align. The parent is a grid and its default `stretch` is on the
     INLINE axis, so `align-self: start` -- which is the block axis -- left every
     chip filling the whole column: "Kept 7" as a 260px pill. A state chip that
     is as wide as the seat is not a chip, it is a row, and it stopped reading as
     a badge at all. */
  justify-self: start;
  height: 30px;
  padding: 0 12px;
  border-radius: 15px;
  font-size: var(--fs-floor);
  font-weight: 700;
  border: 1px solid currentColor;
}
.chip--kept { color: var(--playable); background: rgba(92, 224, 138, 0.12); }
.chip--mulled { color: var(--staged); background: rgba(255, 193, 77, 0.12); }
.chip--thinking { color: var(--text-faint); background: rgba(255, 255, 255, 0.04); }
.chip--thinking .chip__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: coldpulse 1.3s ease-in-out infinite;
}

/* The table's own voice, between the pod and your hand. One line, and it is a
   fact rather than an instruction. */
.table__line {
  position: absolute;
  left: 0;
  right: 0;
  top: 150px;
  text-align: center;
  font-size: var(--fs-floor);
  color: var(--text-faint);
  letter-spacing: 0.06em;
}

/* ==========================================================================
   Your hand
   ==========================================================================
   The same arc as 01, at 168px on a full-width row -- the arithmetic is in
   `01-the-deal.html` and the only thing that changed is that this row has the
   whole panel to spread across.
   ========================================================================== */
.row { position: absolute; left: 0; right: 0; top: 214px; height: 236px; }
.slot {
  position: absolute;
  top: 0;
  width: 168px;
  height: 236px;
  transform-origin: 50% 500px;
}
.lift {
  position: relative;
  display: block;
  transition: transform var(--t-base) cubic-bezier(0.22, 1, 0.36, 1);
}
.slot[data-on] { z-index: 10; }
/* THE LIFT IS 20px, NOT 34, and the number is set by what is above the row.
   At 34 the selected card's top edge reached 180px and drew straight through
   the table's own line at 150-174 -- and only for the middle three cards, so
   four of the seven selections looked fine. */
.slot[data-on] .lift { transform: translateY(-20px) scale(1.04); }
.slot[data-on] .face {
  box-shadow: 0 0 0 3px var(--focus), 0 0 30px var(--focus-glow), 0 14px 34px rgba(0, 0, 0, 0.7);
}
.slot:not([data-on]) .face { filter: brightness(0.84); }

.read {
  position: absolute;
  left: 0;
  right: 0;
  top: 508px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 26px;
  font-size: var(--fs-floor);
  color: var(--text-dim);
}
.read b { color: var(--text); font-weight: 700; font-size: var(--fs-lead); }
.read .sym { --face-fs: 18px; }

/* ==========================================================================
   Your seat, which is also the control
   ==========================================================================
   Same object as the three above -- same height, same crop, same left column,
   same chip position. What differs is that where theirs says "kept 7", yours
   holds two answers. A player who has read the top of the screen already knows
   what this row is for before they read it.
   ========================================================================== */
.mine {
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 78px;
  display: grid;
  grid-template-columns: 96px 1fr auto;
  gap: 18px;
  align-items: center;
  height: 122px;
  padding: 12px 16px 12px 12px;
  border-radius: 12px;
  /* Lit, because it is your turn to answer -- the same "this seat is live" cue
     the board uses on the active player, not a new one. */
  border: 1px solid rgba(255, 212, 121, 0.42);
  background: linear-gradient(180deg, rgba(255, 212, 121, 0.09), rgba(20, 19, 40, 0.72));
  box-shadow: 0 0 34px rgba(216, 166, 60, 0.16), var(--pane-shadow);
}
.mine__crop {
  width: 96px;
  height: 96px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid var(--gold-deep);
}
.mine__body { display: grid; gap: 5px; min-width: 0; }
.mine__name { font-size: var(--fs-lead); font-weight: 700; color: var(--gold); }
.mine__cmd { font-size: var(--fs-floor); color: var(--text-dim); }
.mine__acts { display: flex; align-items: stretch; gap: 12px; }

.ans {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--hit-floor);
  padding: 0 20px;
  border-radius: 10px;
  border: 1px solid var(--edge);
  background: var(--pane-well);
  color: inherit;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.ans__verb { font-size: var(--fs-lead); font-weight: 800; }
.ans__sub { font-size: var(--fs-floor); color: var(--text-dim); }
.ans--keep {
  border-color: var(--gold-deep);
  background: linear-gradient(180deg, rgba(255, 212, 121, 0.2), rgba(216, 166, 60, 0.07));
}
.ans--keep .ans__verb { color: var(--gold); font-size: var(--fs-big); }
.ans:active { transform: translateY(2px); }
</style>
</head>
<body>
<script src="_mull.js"></script>
<script>
const CARD_W = 168;
const PITCH = 162;   /* no overlap at all -- see below */
const ROW_W = PITCH * (HAND.length - 1) + CARD_W;
const LEFT = (1280 - ROW_W) / 2;
const CENTRE = (HAND.length - 1) / 2;
const SPREAD = 1.9;
const SAG = 4.6;

/*
 * PITCH === CARD_W, which is to say the cards do not overlap.
 *
 * 01 needed 16px of overlap to fit 176px cards; at 168 the row is
 * 6 x 162 + 168 = 1140 and the arc's reach (about 50px per side at the outer
 * card's 6 degrees) still leaves 20px of margin. So this is the one direction where
 * every card's whole face is visible at once, which is the compensation for the
 * hand being smaller: 01 shows you a bigger hand with its costs half-covered,
 * and this shows you a smaller one entire.
 */

const state = { on: 3 };

const STATES = ["raised"];
function GOTO() { STAGE.raise(HAND[state.on]); }

const STATE_TEXT = {
  kept: (s) => "Kept " + s.cards,
  mulled: (s) => "To " + s.cards,
  thinking: () => "Deciding",
};

function seatHTML(s) {
  return (
    '<div class="seat">' +
    '<img class="seat__crop" src="../art/' + s.art + '" alt="">' +
    '<div class="seat__body">' +
    '<span class="seat__name">' + esc(s.name) + "</span>" +
    '<span class="seat__cmd">' + esc(s.commander) + "</span>" +
    '<span class="chip chip--' + s.state + '">' +
    (s.state === "thinking" ? '<span class="chip__dot"></span>' : "") +
    esc(STATE_TEXT[s.state](s)) + "</span>" +
    "</div></div>"
  );
}

function markup() {
  const answered = POD.filter((s) => s.state !== "thinking").length;
  return (
    '<div class="pod">' + POD.map(seatHTML).join("") + "</div>" +
    '<div class="table__line">' + answered + " of four seats have answered &middot; " +
    "you are the last</div>" +

    '<div class="row" id="row">' +
    HAND.map((c, i) =>
      '<div class="slot" id="slot-' + i + '" data-i="' + i + '" style="left:' +
      (LEFT + i * PITCH) + 'px">' +
      '<div class="lift">' + faceHTML(c, { w: CARD_W, fs: 16 }) + "</div></div>"
    ).join("") +
    "</div>" +
    '<div class="read" id="read"></div>' +

    '<div class="mine">' +
    '<img class="mine__crop" src="../art/' + COMMANDER.art + '" alt="">' +
    '<div class="mine__body">' +
    '<span class="mine__name">You</span>' +
    '<span class="mine__cmd">' + esc(COMMANDER.name) + "</span>" +
    '<span class="chip chip--thinking"><span class="chip__dot"></span>Seven in hand' +
    " &middot; 0 mulligans</span>" +
    "</div>" +
    '<div class="mine__acts">' +
    '<button class="ans ans--mull" type="button" id="mull" data-hit>' +
    '<span class="glyph glyph--b">B</span>' +
    '<span><span class="ans__verb">Mulligan</span><br>' +
    '<span class="ans__sub">to six</span></span></button>' +
    '<button class="ans ans--keep" type="button" id="keep" data-hit>' +
    '<span class="glyph glyph--a" style="width:38px;height:38px;font-size:19px">A</span>' +
    '<span><span class="ans__verb">Keep</span><br>' +
    '<span class="ans__sub">seven cards</span></span></button>' +
    "</div></div>" +

    '<div class="hints">' +
    '<span class="hint"><span class="glyph glyph--key">&#8592;</span>' +
    '<span class="glyph glyph--key">&#8594;</span>Move</span>' +
    '<span class="hint"><span class="glyph glyph--y">Y</span>Read the card</span>' +
    "</div>"
  );
}

function place() {
  HAND.forEach((_, i) => {
    const el = document.getElementById("slot-" + i);
    const d = i - CENTRE;
    el.style.transform =
      "rotate(" + (d * SPREAD).toFixed(2) + "deg) translateY(" + (d * d * SAG).toFixed(1) + "px)";
    el.toggleAttribute("data-on", i === state.on);
  });
  if (STAGE.raised) STAGE.raise(HAND[state.on]);
  const c = HAND[state.on];
  document.getElementById("read").innerHTML =
    "<b>" + esc(c.name) + "</b>" +
    (c.cost.length ? '<span class="face__cost">' + cost(c.cost) + "</span>" : "") +
    "<span>" + esc(c.line) + " &middot; " + esc(c.note) + "</span>";
  STAGE.tag("on: <b>" + esc(c.name) + "</b>");
}

function step(d) {
  const next = state.on + d;
  if (next < 0 || next >= HAND.length) { STAGE.refuse(document.getElementById("row"), d); return; }
  state.on = next;
  place();
}

/* The commitment says what it does to the TABLE, not to you -- which is the
   direction's whole claim restated in one line. */
const keep = () => STAGE.commit("Keep", "Four seats are set. Vessa leads.");
const mull = () => STAGE.commit("Mulligan", "Two of four have gone to six.", true);

STAGE.mount("03 The Table", markup(), {
  left: () => step(-1),
  right: () => step(1),
  a: keep,
  b: mull,
  /*
   * THE RAISE, AND WHY IT IS RIGHT FOR THIS DIRECTION IN PARTICULAR.
   *
   * `.raise` scrims to 0.55 with no blur, deliberately -- and on this screen
   * that is not a detail, it is the argument. The three seats and their answers
   * stay legible behind the card you are reading, so "Nim is still deciding" is
   * still true and still visible while you look at Tatyova. A dialog's 0.82 and
   * a 3px blur would have put the pod back behind a curtain, which is the exact
   * failure this direction exists to fix.
   */
  y: () => STAGE.toggleRaise(HAND[state.on]),
});

for (const el of document.querySelectorAll(".slot")) {
  el.addEventListener("mouseenter", () => { state.on = +el.dataset.i; place(); });
}
document.getElementById("keep").addEventListener("click", keep);
document.getElementById("mull").addEventListener("click", mull);

place();
</script>
</body>
</html>
