<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap Keep — Face Up (flow 02)</title>
<style>
/* ============================================================================
   FACE UP -- the flow is a sequence of commitments, and a commitment is a card
   turning over
   ----------------------------------------------------------------------------
   THESIS. Setting up a game is not configuration, it is four people committing
   one after another. Every other direction draws that as a form with a button
   at the end. This one draws it as the thing it physically is: FOUR CARDS ON A
   TABLE, face-down until somebody chooses, face-up once they have, and stamped
   once they cannot take it back. When all four are face-up and stamped, the
   game starts, because there is nothing left to decide.

   THE BIG IDEA, stealable on its own: LOCK-IN IS A PHYSICAL ACT. The brief's
   central verb is "lock in your seat" and in 01 it is a button in a footer.
   Here it is the loudest object on the screen -- a wax stamp across the card,
   with an unlock that is deliberately quieter than the lock. That asymmetry is
   the design: committing should feel heavier than reconsidering, because in a
   four-player lobby three other people are waiting on it.

   SECOND IDEA: FACE-DOWN IS ONE PICTURE FOR THREE FACTS. An empty chair, a
   player who has not chosen, and a player whose list is sealed are all "you do
   not get to know this yet", and they are all the same card back. The menu
   round split those into a dashed box, a hatch plate and an italic caption; one
   object says it better, and says it once.

   THIRD: THE CATALOGUE TAKES THE WHOLE SCREEN. A row of four large cards owns
   the lobby, so there is nowhere to put a twenty-four-deck browser except over
   the top of it. That is a real cost, and it is the honest consequence of the
   metaphor rather than an oversight.

   THE TRADE. It leans harder on one idea than any other direction here. If the
   metaphor does not land, nothing else on the screen is holding it up -- and it
   spends its vertical budget on card faces, so the plate under a seat gets four
   lines where 01 gives it eight. This direction answers that by putting the
   information on the card instead of under it: the face is the shipped app's
   preview-rail card, so the commander's full rules are readable at a glance and
   the plate only has to say who is sitting there and what they are holding.

   WHAT IT DOES NOT OFFER, on purpose: a difficulty ladder. Four named personas
   with a capability row apiece is configuration for behaviour the engine does
   not have yet, and the README is already on the record that per-seat personas
   are a promise the CPU work has to keep. What a CPU seat can honestly differ
   in today is its deck, so that is what its plate lets you change. Diverges
   from the other four here; see ../flow/README.md.

   No build, no server, no network. Local ../art/*.jpg and ../cards/symbols/*.svg
   only, both already on disk.
   ========================================================================== */

/* Tokens ----------------------------------------------------------------- */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.16); --edge-hi:rgba(170,160,255,.3);
  --astral:#8f7fe8; --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.6); --pane-well:rgba(13,12,28,.78);
  --pane-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.45);

  --danger:#ff5c5c; --gold:#ffd479; --live:#5ce08a;
  --text:#e6e3f5; --text-dim:#a09bc4; --text-faint:#6b6690;

  --card-w:clamp(128px, 18vh, 176px);
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

.f-W { --f-hi:#f6eed4; --f-lo:#b9ad86; --fb:#d8cfa8; }
.f-U { --f-hi:#a9d2ec; --f-lo:#2f6a95; --fb:#4a86b8; }
.f-B { --f-hi:#b6aeac; --f-lo:#2e282b; --fb:#4c4550; }
.f-R { --f-hi:#f0a48b; --f-lo:#a4432f; --fb:#b8624a; }
.f-G { --f-hi:#a9cfa2; --f-lo:#2f6b41; --fb:#4e8a5c; }
.f-C { --f-hi:#d3d6da; --f-lo:#787e86; --fb:#8a8f96; }
.f-gold { --f-hi:#eed99c; --f-lo:#9c7a24; --fb:#b99a45; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:
    radial-gradient(64% 44% at 50% 26%, rgba(143,127,232,.14) 0%, transparent 62%),
    radial-gradient(80% 46% at 50% 100%, rgba(90,190,220,.07) 0%, transparent 58%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
.tabular { font-variant-numeric:tabular-nums; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--edge); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* THE CARD BACK -- one picture for every "you do not get to know this yet".
   The plate is the hatch cards.css draws for a card with no printing; the mark
   is the product's, because the back of a deck box is where a brand goes. */

.back {
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; flex:none; overflow:hidden;
  border-radius:var(--card-r); border:2px solid rgba(120,110,90,.5);
  background:repeating-linear-gradient(135deg, rgba(0,0,0,.24) 0 8px, transparent 8px 16px), #443e34;
  display:grid; place-items:center;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.35);
}
.back::after {
  content:""; position:absolute; inset:9%; border:1px solid rgba(255,255,255,.14); border-radius:calc(var(--card-r) * .7);
}
.back__mark {
  position:relative; z-index:2; text-align:center; padding:0 10%;
  font-size:calc(var(--card-w) * .075); font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:rgba(255,255,255,.4); line-height:1.7;
}
.back--open { border-style:dashed; border-color:var(--edge-hi); background:repeating-linear-gradient(135deg, rgba(0,0,0,.24) 0 8px, transparent 8px 16px), #2a2740; }
.back--empty { border-style:dashed; border-color:var(--edge-hi); background:rgba(13,12,28,.45); }
.back--empty .back__mark { color:var(--text-faint); }

/* THE STAMP -- the idea. Locking in is the loudest object on the screen.
   It rides in the art band rather than at the middle of the card: the head is
   a 26% scrim and the foot grows upward with the rules, so dead centre is text
   on a wordy commander like Zurgo and wax over a paragraph is not legible. */
.stamp {
  position:absolute; z-index:5; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-13deg);
  padding:7px 16px; border:3px double var(--gold); border-radius:6px;
  background:rgba(11,10,22,.7);
  font-size:calc(var(--card-w) * .085); font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold); text-shadow:0 1px 4px rgba(0,0,0,.8); white-space:nowrap; pointer-events:none;
}
.stamp--them { border-color:var(--live); color:var(--live); }

/* THE DOOR ---------------------------------------------------------------- */

.door { position:relative; height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }
.door__top { display:flex; align-items:center; gap:12px; padding:20px 28px; }
.door__mid { display:grid; place-items:center; min-height:0; padding:0 28px; }
.door__bot { padding:0 28px 24px; display:grid; justify-items:center; gap:9px; }

.brand { display:flex; align-items:baseline; gap:10px; }
.brand__mark { font-size:15px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
.brand__sub { font-size:11px; color:var(--text-faint); letter-spacing:.04em; }
.door__spacer { flex:1; }
.door__ver { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }

.hero { display:grid; justify-items:center; text-align:center; max-width:660px; }
/* The fan is four card backs: the pod, before anybody has chosen anything. */
.fan { --card-w:clamp(104px, 15vh, 148px); display:flex; justify-content:center; margin-bottom:30px; height:calc(var(--card-w) * 1.5); }
.fan .back { margin:0 -14px; transform-origin:50% 100%; }
.fan .back:nth-child(1) { transform:rotate(-11deg) translateY(9px); }
.fan .back:nth-child(2) { transform:rotate(-4deg); }
.fan .back:nth-child(3) { transform:rotate(4deg); }
.fan .back:nth-child(4) { transform:rotate(11deg) translateY(9px); }
.fan .back:nth-child(2), .fan .back:nth-child(3) { z-index:2; }

.hero__mark { margin:0; font-size:clamp(40px, 6.2vh, 66px); font-weight:800; line-height:1; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); text-shadow:0 0 40px rgba(255,212,121,.2); }
.hero__line { margin:16px 0 0; font-size:15px; line-height:1.6; color:var(--text-dim); }
.hero__acts { display:flex; align-items:center; gap:14px; margin-top:28px; flex-wrap:wrap; justify-content:center; }

.big {
  padding:16px 34px; border-radius:12px; flex:none;
  background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05;
  font-size:16px; font-weight:800; letter-spacing:.04em;
  box-shadow:0 4px 0 #7d5310, 0 0 30px rgba(224,166,63,.26);
}
.big:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 30px rgba(224,166,63,.26); }
.big:disabled { opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #4a3a18; }
.or { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }

.join { display:flex; align-items:center; border:1px solid var(--edge); border-radius:10px; background:rgba(8,7,18,.72); overflow:hidden; }
.join__in { width:150px; padding:14px; border:0; background:none; font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.join__in::placeholder { color:var(--text-faint); font-weight:600; letter-spacing:.1em; }
.join__in:focus { outline:none; }
.join:focus-within { border-color:var(--gold); }
.join__go { padding:14px 18px; border-left:1px solid var(--edge); color:var(--text-dim); font-size:13px; font-weight:700; }
.join__go:hover { color:var(--text); background:rgba(143,127,232,.1); }
.door__cap { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-faint); }
.door__cap b { color:var(--text-dim); font-weight:750; }
.link { color:var(--text-dim); text-decoration:underline; text-underline-offset:3px; font-size:11.5px; }
.link:hover { color:var(--text); }

/* THE POD ----------------------------------------------------------------- */

.pod { position:relative; display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; overflow:hidden; }
.head { display:flex; align-items:center; gap:14px; padding:12px 24px; border-bottom:1px solid var(--edge); background:linear-gradient(180deg, rgba(143,127,232,.12), transparent); }
.head__spacer { flex:1; }
.codechip { display:flex; align-items:center; gap:9px; padding:6px 8px 6px 12px; border:1px solid var(--edge); border-radius:9px; background:var(--pane-well); }
.codechip__l { font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.codechip__v { font-size:13.5px; font-weight:800; letter-spacing:.1em; color:var(--astral-hi); }

.tablewrap { display:grid; grid-template-rows:auto minmax(0,1fr); gap:10px; min-height:0; padding:16px 24px 0; }
.tablewrap__l { display:flex; align-items:center; gap:10px; font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
.tablewrap__h { margin-left:auto; text-transform:none; letter-spacing:.02em; font-size:11px; font-weight:600; }

/* The row of four. It is a hand of cards laid on a table, so it sits on a
   surface rather than floating: the plate under it is the table. */
.hand {
  --card-w:clamp(152px, 25vh, 296px);
  position:relative; min-height:0; display:flex; align-items:flex-start; justify-content:center;
  gap:clamp(12px, 1.8vw, 34px); padding:clamp(10px, 5vh, 68px) 0 0;
}
/* The surface the cards stand on. Its top edge is derived from the card width
   rather than from a percentage of the row, so it lands just below the cards'
   shoulders at every viewport instead of wherever the flex box happens to end. */
.hand__felt {
  position:absolute; z-index:0; left:50%; transform:translateX(-50%);
  top:calc(var(--card-w) * .92); bottom:0; width:min(1520px, 98%); pointer-events:none;
  border:1px solid var(--edge-hi); border-bottom:0; border-radius:26px 26px 0 0;
  background:linear-gradient(180deg, rgba(40,37,76,.85) 0%, rgba(24,22,48,.5) 34%, rgba(13,12,28,.08) 76%, transparent 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}

.slot { position:relative; z-index:2; display:grid; justify-items:center; gap:11px; width:var(--card-w); min-width:0; }
/* min-height, because your own seat carries no ✕ and the row would otherwise be
   two pixels shorter than its neighbours -- enough to knock every plate in the
   row out of alignment with yours. */
.slot__head { display:flex; align-items:center; justify-content:center; gap:5px; max-width:100%; min-height:16px; }
.slot__no { font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.slot__no--you { color:var(--gold); }
/* A seat's card opens its dossier, the same bargain the catalogue strikes: the
   card is the biggest thing in the slot, so it should not need a button beneath
   it to be worth aiming at. Only a face-up card takes the click -- there is
   nothing to read behind a card back. */
.slot__card { position:relative; transition:transform .12s ease; }
.slot__card[data-act] { cursor:pointer; }
.slot__card[data-act]:hover { transform:translateY(-4px); }
.slot__card[data-act]:focus-visible { outline:2px solid var(--gold); outline-offset:5px; border-radius:calc(var(--card-w) * .05); }
/* The remove control lives in the slot's own header, not on the card and no
   longer in the plate. Two earlier placements were wrong for two different
   reasons: hanging it off the corner widened the slot and painted over the next
   one (the "escape" failure the menu round documents), and tucking it inside the
   card covered the mana cost. The plate was right about where but wrong about
   weight -- a bordered box gave emptying a seat the same voice as the action you
   came to the plate for. Up here it is a mark beside the seat's own number,
   quiet until the slot is under the cursor, and it never shares a row with a
   primary button again. */
.slot__x {
  width:16px; height:16px; flex:none; border:0; border-radius:999px; padding:0;
  display:grid; place-items:center; background:none;
  color:var(--text-faint); font-size:9px; line-height:1; opacity:.4;
  transition:opacity .12s ease, color .12s ease;
}
.slot:hover .slot__x, .slot__x:focus-visible { opacity:1; }
.slot__x:hover { color:var(--danger); background:rgba(255,92,92,.12); }

.plate { width:100%; min-width:0; display:grid; gap:7px; text-align:center; }
.plate__who { display:flex; align-items:baseline; justify-content:center; gap:7px; min-width:0; }
.plate__n { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.plate__tag { font-size:10px; color:var(--text-faint); flex:none; }
.plate__deck { font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.plate__deck--sealed { color:var(--text-faint); font-style:italic; }
.plate__meta { display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap; }
.plate__acts { display:flex; justify-content:center; gap:5px; flex-wrap:wrap; }
.plate__acts .btn { min-width:0; }

/* An empty slot's actions live under its card back, so every slot has the same
   anatomy whatever is in it. */
.plate__fill { display:grid; gap:6px; width:100%; }

/* Your edge --------------------------------------------------------------- */

.rail { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:13px 24px 15px; border-top:1px solid var(--edge); background:rgba(11,10,22,.8); }
.rail__spacer { flex:1; }
.rail__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); max-width:34ch; }
.turned { display:grid; gap:6px; }
.turned__l { display:flex; align-items:center; gap:8px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.turned__n { color:var(--text-dim); }
.turned__t { display:flex; gap:4px; }
.turned__s { width:46px; height:8px; border-radius:3px; border:1px solid var(--edge-hi); }
.turned__s--on { background:var(--gold); border-color:var(--gold); }
.turned__s--wait { border-style:dashed; }
.turned__s--none { opacity:.3; }

.lock {
  padding:15px 26px; border-radius:11px; flex:none; border:1px solid var(--gold);
  color:var(--gold); font-size:14.5px; font-weight:800; letter-spacing:.05em; background:rgba(255,212,121,.09);
  text-transform:uppercase;
}
.lock:hover { background:rgba(255,212,121,.18); }
/* Deliberately quieter than the lock. Committing should feel heavier than
   reconsidering, because three other people are waiting on it. */
.lock--on { border-color:var(--edge); color:var(--text-faint); background:none; font-weight:600; font-size:12px; letter-spacing:.02em; text-transform:none; padding:11px 16px; }
.lock--on:hover { color:var(--text); background:rgba(143,127,232,.1); }
.lock:disabled { opacity:.4; cursor:not-allowed; }

.play {
  padding:15px 28px; border-radius:11px; flex:none;
  background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05;
  font-size:15px; font-weight:800; letter-spacing:.04em;
  box-shadow:0 4px 0 #7d5310, 0 0 26px rgba(224,166,63,.28);
}
.play:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 26px rgba(224,166,63,.28); }
.play:disabled { opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #4a3a18; }

/* THE CATALOGUE -- full takeover, because the hand owns the lobby ---------- */

.veil { position:fixed; inset:0; z-index:420; background:rgba(6,5,16,.7); }

.cat {
  position:fixed; z-index:430; inset:0;
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; min-height:0;
  background:linear-gradient(180deg,#171630,#0b0a18);
}
.cat__head { display:flex; align-items:center; gap:12px; padding:16px 28px 14px; border-bottom:1px solid var(--edge); }
.cat__t { font-size:17px; font-weight:800; }
.cat__for { font-size:11.5px; color:var(--text-faint); }
.cat__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); flex:none; }
.cat__x:hover { border-color:var(--edge-hi); color:var(--text); }

.filters { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:11px 28px; border-bottom:1px solid var(--edge); background:rgba(9,8,20,.4); }
.search { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--edge); border-radius:9px; background:rgba(8,7,18,.8); min-width:240px; }
.search:focus-within { border-color:var(--gold); }
.search__i { flex:1; min-width:0; border:0; background:none; font-size:12.5px; }
.search__i:focus { outline:none; }
.search__i::placeholder { color:var(--text-faint); }
.search__g { color:var(--text-faint); font-size:12px; }
.fgroup { display:flex; align-items:center; gap:7px; }
.fgroup__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
/* The colour filter is the real Scryfall symbol, not a letter on a disc -- the
   symbol already IS a coloured disc, so the button draws no disc of its own and
   only rings the ones that are on. Off is dimmed rather than greyscaled: W and B
   desaturate to the same pale grey, which would make the two ends of the row
   indistinguishable in exactly the state you read it in most. */
.cbtn { width:27px; height:27px; border-radius:999px; display:grid; place-items:center; border:1px solid transparent; background:none; padding:0; }
.cbtn .pip { width:20px; height:20px; pointer-events:none; opacity:.42; transition:opacity .12s ease, filter .12s ease; }
.cbtn:hover .pip { opacity:.8; }
.cbtn--on { border-color:rgba(255,212,121,.6); box-shadow:0 0 0 2px rgba(255,212,121,.13); }
.cbtn--on .pip, .cbtn--on:hover .pip { opacity:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.seg { display:flex; border:1px solid var(--edge); border-radius:8px; overflow:hidden; }
.seg__b { padding:7px 13px; font-size:11.5px; font-weight:650; color:var(--text-faint); border-right:1px solid var(--edge); }
.seg__b:last-child { border-right:0; }
.seg__b:hover { color:var(--text); }
.seg__b--on { background:rgba(255,212,121,.14); color:var(--gold); }
.sel { padding:8px 11px; border:1px solid var(--edge); border-radius:8px; background:rgba(8,7,18,.8); font-size:12px; color:var(--text-dim); }
.sel:focus { outline:none; border-color:var(--gold); }
.filters__spacer { flex:1; }
.filters__n { font-size:11.5px; color:var(--text-faint); }

.cat__body { min-height:0; overflow:auto; padding:18px 28px 20px; }

/* The catalogue draws decks as cards too, because that is this direction's
   whole grammar. The face is the real card component at 0.28x of native art. */
.rack { --card-w:clamp(122px, 15vh, 168px); display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:18px 14px; }
.pick { display:grid; justify-items:center; gap:8px; min-width:0; text-align:center; position:relative; }
/* The card is the control. A "Take it" button under a card that is already the
   size and shape of a thing you pick up was a second target for the first
   target's job, so the button is gone and the face takes the click. role/tabindex
   rather than a real <button>, because a <button> may not contain the divs a card
   face is made of; the keydown handler at the foot of the script supplies Enter
   and Space in exchange. */
.pick__card { position:relative; border-radius:calc(var(--card-w) * .055); transition:transform .12s ease; }
.pick__card[data-act] { cursor:pointer; }
.pick__card[data-act]:hover { transform:translateY(-4px); }
.pick__card[data-act]:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
/* Preview decks are not dealable, so their card is inert and reads as inert. */
.pick--off .pick__card { cursor:default; filter:saturate(.45) brightness(.72); }
/* box-shadow rather than an inset:-5px pseudo-element: a ring drawn outside the
   card would widen the slot and paint over the next one. */
.pick--on .pick__card::after {
  content:""; position:absolute; inset:0; border-radius:calc(var(--card-w) * .055);
  border:2px solid var(--gold); box-shadow:0 0 0 4px rgba(255,212,121,.18), 0 0 24px rgba(255,212,121,.3);
}
/* Also inside the card, for the same reason as .slot__x. */
.pick__tick { position:absolute; z-index:4; top:6px; right:6px; width:22px; height:22px; border-radius:999px; display:grid; place-items:center; background:var(--gold); color:#1b0f05; font-size:11px; font-weight:800; box-shadow:0 1px 4px rgba(0,0,0,.6); }
/* The source badge is in the meta row rather than pinned to the card's foot,
   where it painted over the keyword line direction D puts there. A card face is
   a card face; the catalogue's own chrome is what moves. */
.badge--src { border-style:solid; border-color:var(--edge); }
.pick__n { font-size:12px; font-weight:750; line-height:1.3; }
.pick__s { font-size:10px; color:var(--text-faint); }
.pick__meta { display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap; }
.pick__bars { display:grid; gap:3px; width:100%; }

.empty { padding:52px 20px; text-align:center; color:var(--text-faint); font-size:13px; line-height:1.6; }

.cat__foot { display:flex; align-items:center; gap:12px; padding:12px 28px; border-top:1px solid var(--edge); flex-wrap:wrap; }
.imp { display:flex; align-items:center; gap:8px; flex:1; min-width:300px; }
.imp__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); flex:none; }
.imp__in { flex:1; min-width:0; padding:9px 11px; border:1px solid var(--edge); border-radius:8px; background:rgba(8,7,18,.8); font-size:12px; }
.imp__in::placeholder { color:var(--text-faint); }
.imp__in:focus { outline:none; border-color:var(--gold); }
.imp__note { font-size:10.5px; line-height:1.4; color:var(--text-faint); max-width:38ch; }
.imp__note--err { color:var(--danger); }
.imp__note--busy { color:var(--astral-hi); }

/* THE DOSSIER ------------------------------------------------------------- */

.over {
  position:fixed; z-index:460; right:0; top:0; bottom:0; width:min(660px, 96vw);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0;
  border-left:1px solid var(--edge); background:linear-gradient(180deg,#1b1936,#0d0c1c);
  box-shadow:-26px 0 70px rgba(0,0,0,.7);
}
.over__head { display:flex; align-items:center; gap:10px; padding:15px 18px 13px; border-bottom:1px solid var(--edge); }
.over__n { font-size:18px; font-weight:800; min-width:0; }
.over__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); flex:none; }
.over__x:hover { border-color:var(--edge-hi); color:var(--text); }
.over__body { min-height:0; overflow:auto; padding:16px 18px; }
.over__foot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--edge); }
.over__foot .play { padding:11px 22px; font-size:14px; }

.dos__top { display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; }
.dos__card { display:grid; gap:7px; justify-items:center; align-content:start; }
.dos__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.dos__h { margin:16px 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.dos__h:first-child { margin-top:0; }
.dos__p { margin:0; font-size:12.5px; line-height:1.6; color:var(--text-dim); }
.dos__tags { display:flex; flex-wrap:wrap; gap:6px; }
.dos__bars { display:grid; gap:5px; margin-top:10px; }
.dos__sigs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:9px; }
.sig { display:grid; grid-template-columns:56px minmax(0,1fr); gap:9px; align-items:center; }
.sig__art { width:56px; height:44px; border-radius:5px; object-fit:cover; object-position:50% 30%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.sig__n { font-size:11.5px; font-weight:700; }
.sig__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); margin-top:2px; }

/* THE INVITE -------------------------------------------------------------- */

.inv {
  position:fixed; z-index:470; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(452px, 94vw); border:1px solid var(--edge-hi); border-radius:15px;
  background:linear-gradient(180deg,#1b1936,#0d0c1c); box-shadow:0 30px 90px rgba(0,0,0,.7);
}
.inv__head { display:flex; align-items:center; gap:10px; padding:15px 18px 12px; border-bottom:1px solid var(--edge); }
.inv__t { font-size:15px; font-weight:800; }
.inv__x { margin-left:auto; width:27px; height:27px; border-radius:999px; border:1px solid var(--edge); color:var(--text-dim); }
.inv__x:hover { border-color:var(--edge-hi); color:var(--text); }
.inv__body { padding:18px; display:grid; gap:14px; }
.inv__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; }
.inv__code { display:flex; align-items:center; gap:10px; padding:14px 16px; border:1px solid var(--edge); border-radius:11px; background:rgba(8,7,18,.72); }
.inv__codev { flex:1; min-width:0; font-size:25px; font-weight:800; letter-spacing:.16em; color:var(--astral-hi); }
.inv__linkv { flex:1; min-width:0; font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.inv__note { margin:0; font-size:11.5px; line-height:1.55; color:var(--text-faint); }
.inv__foot { padding:0 18px 16px; }

/* Shared vocabulary ------------------------------------------------------- */

.btn { padding:8px 13px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(20,19,40,.6); color:var(--text); font-size:12px; font-weight:650; white-space:nowrap; }
.btn:hover { border-color:var(--gold); }
.btn--wide { width:100%; padding:11px; text-align:center; }
.btn--live { border-color:rgba(92,224,138,.45); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn:disabled:hover { border-color:var(--edge-hi); }
.ghost { padding:9px 14px; border-radius:7px; color:var(--text-faint); font-size:13px; font-weight:500; }
.ghost:hover { color:var(--text); }

/* The real mana symbols, as <img>. Scryfall ships them fully coloured, so there
   is nothing to recolour -- which is just as well, because an <img> could not
   be recoloured anyway. `--pip` is capped as well as floored: past ~180px a
   cost row scaled purely off --card-w stops looking like a cost and starts
   looking like a row of buttons. */
.pip { display:inline-block; width:var(--pip,14px); height:var(--pip,14px); flex:0 0 auto; vertical-align:middle; filter:drop-shadow(0 1px 1px rgba(0,0,0,.55)); }
/* Symbols inside a sentence rather than in a cost row. Sized in em so one rule
   serves the card's rules box and an 11px plate label without either being told
   what size it is. */
.pip--inline { width:1.05em; height:1.05em; margin:0 .04em; vertical-align:-.14em; filter:none; }
/* Colour-identity rows live outside a .face, which is where --pip is scoped. */
.plate__meta, .pick__meta, .over__head { --pip:14px; }

/* The details affordance, everywhere one is offered. It was the word "details"
   under a catalogue card and a full-width "Details" button on a seat plate --
   both of which competed with the deck's own name for the eye, and the second of
   which sat next to the button you actually came to press. As a glyph it rides in
   whichever meta row already holds the pips and the badges, costing its block a
   whole row, and it doubles as the hint that the card above it is clickable. */
.ibtn {
  width:17px; height:17px; flex:0 0 auto; border-radius:999px; display:grid; place-items:center;
  border:1px solid var(--edge-hi); background:rgba(9,8,20,.5);
  font-size:10px; font-weight:800; font-style:italic; line-height:1; color:var(--text-faint);
}
.ibtn:hover { border-color:var(--gold); color:var(--gold); }
.ibtn:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

.chip { padding:3px 8px; border:1px solid var(--edge-hi); border-radius:999px; font-size:10px; font-weight:650; color:var(--text-dim); background:rgba(9,8,20,.5); }
.count { font-size:10.5px; color:var(--text-faint); }
.badge { padding:2px 7px; border:1px dashed var(--edge-hi); border-radius:999px; font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); }
.badge--partial { border-style:solid; border-color:rgba(255,212,121,.55); color:var(--gold); }

.bar { display:flex; align-items:center; gap:7px; }
.bar__label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); min-width:88px; }
.bar--tiny .bar__label { min-width:70px; font-size:8.5px; letter-spacing:.05em; }
.bar__track { display:flex; gap:2px; }
.bar__seg { width:13px; height:5px; border-radius:2px; border:1px solid var(--edge-hi); background:transparent; }
.bar--tiny .bar__seg { width:10px; height:4px; }
.bar__seg--on { background:var(--text-dim); border-color:var(--text-dim); }

/* THE CARD FACE -- direction D, "Art Bleed", as shipped ---------------------
   `../cards/index.html` prototyped five card faces and D is the one the client
   actually implements, so this is a port of `frontend/src/styles/cards.css`
   rather than a lookalike. Three things about it are load-bearing and this file
   used to get all three wrong:

   THE NAME AND THE COST ARE ON SEPARATE AXES. The head is a COLUMN -- name,
   then the cost on a row of its own beneath it. That is the whole point of the
   direction: a name can be as long as it likes and never meets its own mana
   cost, which is what "Aesi, Tyrant of Gyre Strait" against {4}{G}{U} used to
   do at every width. The old flex-row title with a `max-width:56%` cost was
   managing that collision instead of removing it.

   THE TYPE LINE LIVES IN THE FOOT, with the rules and the P/T. The head is the
   name and the cost; everything you read after deciding to look at the card is
   at the bottom. Art fills everything between them.

   THE MANA SYMBOLS ARE THE REAL SYMBOLS. A letter on a coloured disc is a mark
   nobody who plays the game recognises. These are Scryfall's, vendored into
   `../cards/symbols/` by `../cards/fetch_symbols.py` -- same files the client
   serves out of `frontend/public/symbols/`. */

.face {
  --pip:min(calc(var(--card-w) * .115), 21px);
  --fs-nm:clamp(9px, calc(var(--card-w) * .085), 19px);
  --fs-tp:clamp(8.5px, calc(var(--card-w) * .062), 12.5px);
  --fs-tx:clamp(8.5px, calc(var(--card-w) * .053), 12.5px);
  --fs-pt:clamp(10px, calc(var(--card-w) * .092), 21px);
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; overflow:hidden;
  border-radius:var(--card-r); border:2px solid var(--fb);
  background:linear-gradient(160deg, var(--f-hi), var(--f-lo));
  display:flex; flex-direction:column;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.35);
  color:#fff; flex:none; font-size:var(--fs-tx);
}
.face__art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.face__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152; }
.face__head {
  position:relative; z-index:2; display:flex; flex:0 0 auto; flex-direction:column;
  gap:calc(var(--card-w) * .016);
  padding:calc(var(--card-w) * .05) calc(var(--card-w) * .055) calc(var(--card-w) * .085);
  background:linear-gradient(180deg, rgba(0,0,0,.8), rgba(0,0,0,.565) 55%, rgba(0,0,0,0));
}
/* margin-top:auto -- pushed to the foot whatever the head above it weighs, so a
   two-line name never squeezes the illustration between them. */
.face__foot {
  position:relative; z-index:2; display:flex; flex-direction:column;
  gap:calc(var(--card-w) * .024); margin-top:auto; min-height:0;
  padding:calc(var(--card-w) * .1) calc(var(--card-w) * .055) calc(var(--card-w) * .05);
  background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.706) 58%, rgba(0,0,0,0));
}
.face__title { display:flex; align-items:flex-start; gap:calc(var(--card-w) * .03); font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.85); }
/* A name wraps rather than truncating -- two lines, then it gives up. */
.face__name { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; font-size:var(--fs-nm); line-height:1.14; }
.face__cost { display:flex; flex:0 0 auto; flex-wrap:wrap; align-items:center; gap:calc(var(--card-w) * .02); min-height:var(--pip); }
.face__type { color:#e2ddcd; font-size:var(--fs-tp); font-weight:600; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px rgba(0,0,0,.85); }
/* Short rules centre in the box they were given; `safe` keeps long text
   starting at the top, where it would otherwise be clipped at both ends. */
.face__rules { display:flex; flex:0 1 auto; flex-direction:column; justify-content:safe center; overflow:hidden; min-height:0; margin:0; color:#eae7dc; font-size:var(--fs-tx); line-height:1.34; white-space:pre-wrap; text-shadow:0 1px 2px rgba(0,0,0,.69); }
.face__footer { display:flex; align-items:center; gap:5px; margin-top:auto; }
/* Keywords only where there is no rules box -- otherwise the text says them. */
.face__kw { flex:1; overflow:hidden; color:#a8d3b3; font-size:calc(var(--card-w) * .068); font-weight:600; text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__spacer { flex:1; }
/* A dark lozenge, not a pale one: everything on this card is light-on-dark, and
   a white chip in the corner was the last element pretending there was paper. */
.face__pt { padding:.2em .44em; border-radius:calc(var(--card-w) * .026); background:rgba(12,12,16,.82); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); color:#f7f4ea; font-size:var(--fs-pt); line-height:1; font-weight:800; }

/* THE ENLARGED CARD -- the shipped app's preview rail, ported ---------------
   Lifted from frontend/src/styles/cards.css `.face--big`, the variant
   CardPreview.tsx renders. The point is consistency in the direction that
   matters: the commander you turn over in the lobby is the commander the game
   will put in your preview panel, and until now they were two different
   objects -- a thin scrim over the art here, a framed illustration with a solid
   text box there.

   Three things carry over on top of direction D's anatomy above. The head is a
   BAND rather than a hairline, so the art is framed rather than merely written
   on. The foot goes effectively SOLID behind the text instead of fading, which
   is what makes rules readable over a bright crop -- Explosive Vegetation is
   the case that decides it there and Emmara is the one here. And the rules box
   is the part that GIVES: it takes whatever the head and the footer leave and
   scrolls past that, which is the trade for a card that never changes size.

   This is also the only variant that draws a rules box at all, exactly as the
   client does: `board` faces render none, because at 122px it is six-pixel type
   and the type line plus a keyword chip say more. The catalogue keeps the small
   face; the seat row and the dossier take this one.

   ONE DELIBERATE DEVIATION. The app's rail card is width-driven with
   `height:100%` -- it is the one card on that screen not held to 1.4. Here the
   aspect ratio stays, because a face-up seat and a face-down `.back` have to be
   the same rectangle: the moment they are not, the row stops reading as a hand
   and `.hand__felt` no longer lands under the cards' shoulders. So this takes
   the preview's treatment and not its box.

   The type scale is the app's absolute one expressed as ratios of --card-w, so
   it lands on the rail's own numbers at the top of the lobby's clamp (296px,
   against a rail measured at 286) and stays legible at the bottom. */

.face--big {
  --fs-nm:clamp(10px, calc(var(--card-w) * .047), 14px);
  --fs-tp:clamp(8.5px, calc(var(--card-w) * .0385), 11.5px);
  --fs-tx:clamp(8.5px, calc(var(--card-w) * .042), 12.5px);
  --fs-pt:clamp(10px, calc(var(--card-w) * .0455), 14px);
  justify-content:flex-start;
}
.face--big .face__head {
  flex:0 0 auto; min-height:26%; gap:4px;
  padding:calc(var(--card-w) * .031) calc(var(--card-w) * .038) calc(var(--card-w) * .077);
}
.face--big .face__title { gap:7px; font-weight:800; }
.face--big .face__foot {
  gap:2px;
  padding:calc(var(--card-w) * .105) calc(var(--card-w) * .038) calc(var(--card-w) * .031);
  background:linear-gradient(0deg, rgba(11,11,15,.96) 62%, rgba(11,11,15,.86) 78%, rgba(11,11,15,0));
}
/* The part that gives. Top-aligned, because here long text is the case that
   matters rather than centring two words in a fixed box. */
.face--big .face__rules { justify-content:flex-start; overflow-y:auto; padding:5px 0 6px; line-height:1.4; }
/* The P/T slot is reserved whether or not there is a P/T in it, so a card
   without one does not come out a row shorter than every creature. */
.face--big .face__footer { flex:0 0 auto; min-height:26px; }
.face--big .face__pt { padding:1px 8px; border-radius:5px; }
/* The commander mark goes inside the name, not in a corner -- a corner tag
   competes with the P/T for a corner it has already claimed. Every card in this
   file is somebody's commander, so it is always on. */
.crown { margin-right:.28em; color:#d8a63c; font-size:.92em; text-shadow:0 1px 2px rgba(0,0,0,.63); }

.curve__cols { display:flex; align-items:flex-end; gap:4px; height:54px; }
.curve__bar { flex:1; background:var(--text-faint); border-radius:2px 2px 0 0; min-height:2px; }
.curve__axis { display:flex; gap:4px; margin-top:4px; }
.curve__n { flex:1; text-align:center; font-size:9px; color:var(--text-faint); }
.curve__none { padding:13px; border:1px dashed var(--edge-hi); border-radius:9px; font-size:11.5px; line-height:1.5; color:var(--text-faint); text-align:center; }
.note { margin-top:8px; padding:10px 12px; border-left:2px solid var(--edge-hi); border-radius:0 7px 7px 0; background:rgba(13,12,28,.55); font-size:11.5px; line-height:1.55; color:var(--text-faint); }
</style>
</head>

<script>
/* ===========================================================================
   Content, inlined from _flow.js -- the readable master. Not linked, because a
   <script src> does not load from file:// and every mockup opens standalone.
   =========================================================================== */

/* No difficulty ladder. It was four personas and a ◂/▸ pair on every CPU plate,
   configuring behaviour the engine does not have yet -- the README's own words
   are that per-seat personas are "a promise the CPU work has to keep". What a
   CPU seat is actually allowed to differ in is the deck it holds, so that is
   the only thing its plate offers. */

const BAR_LABELS = [
  ["speed", "Speed"], ["complexity", "Complexity"], ["interaction", "Interaction"],
  ["resilience", "Resilience"], ["pilot", "Demands on you"],
];

const COLOURS = [["W", "White"], ["U", "Blue"], ["B", "Black"], ["R", "Red"], ["G", "Green"]];

const SORTS = [
  { id: "name", n: "Name" },

];

const DECKS = [

    bars: { speed: 2, complexity: 3, interaction: 2, resilience: 3, pilot: 2 },
    curve: [9, 13, 18, 7, 7, 3, 5],
    signature: [
      { n: "Tatyova, Benthic Druid", art: "tatyova-benthic-druid", why: "A second Aesi. Every land is a card and a life." },

      { n: "Rampaging Baloths", art: "rampaging-baloths", why: "Every land after this one is a 4/4." },

  { id: "edgar", name: "Edgar Markov", short: "Edgar",
    ci: ["W", "B", "R"], guild: "Mardu", cards: 100, lands: 37, source: "precon",
    cmd: { n: "Edgar Markov", cost: "3RWB", tl: "Legendary Creature — Vampire Knight",
      t: "creature", f: "gold", pt: "4/4", kw: "First strike",

const ART_NATIVE = { w: 626, h: 457 };

/* Primitives (shared with the other four flow mockups) ------------------- */

const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (slug) => "../art/" + slug + ".jpg";

/** A mana symbol, as an `<img>` rather than inline SVG: fetch() is blocked on
 *  file:// and an image is not. The files are Scryfall's, vendored into
 *  ../cards/symbols/ by ../cards/fetch_symbols.py -- the same set the client
 *  serves out of frontend/public/symbols/. Hybrid notation is {R/G} on a card
 *  and R-G.svg on disk. */
const sym = (code, cls) => {
  const c = String(code).toUpperCase();
  return `<img class="pip${cls ? " " + cls : ""}" src="../cards/symbols/${c.replace("/", "-")}.svg" alt="{${c}}" title="{${c}}">`;
};

/** "4GU" -> {4}{G}{U}. A run of digits is one symbol, a letter is one symbol. */
function pips(cost) {
  if (!cost) return "";
  return (String(cost).match(/\d+|[A-Z]/g) || []).map((c) => sym(c)).join("");
}
const ciPips = (ci) => ci.map((c) => sym(c)).join("");

/** Braced notation inside prose draws the same symbols: "{T}: Add {G}." */
const symbolise = (text) => esc(text).replace(/\{([^}]+)\}/g, (m, c) => sym(c, "pip--inline"));

/** Supertypes come off where the line has no room for them. The big face keeps
 *  the full line; a 122px catalogue tile does not have it to spend. */
const shortType = (tl) => tl.replace(/^(?:Legendary|Basic|Snow|Token)\s+/, "");

function bar(label, value, tiny) {
  let segs = "";
  for (let i = 1; i <= 4; i += 1) segs += `<i class="bar__seg${i <= value ? " bar__seg--on" : ""}"></i>`;
  return `<div class="bar${tiny ? " bar--tiny" : ""}"><span class="bar__label">${esc(label)}</span><span class="bar__track">${segs}</span></div>`;
}
const bars = (b) => BAR_LABELS.map(([k, l]) => bar(l, b[k])).join("");
const subtitle = (d) => (d.cmd.n === d.name ? `${d.guild} · ${d.tags[0].toLowerCase()}` : d.cmd.n);

/** A card, drawn as direction D draws it.
 *
 *  Head: the name, then the cost on a row of its own beneath it. Foot: the type
 *  line, the rules, the P/T. Art fills everything in between. See the CSS for
 *  why the name and the cost are on separate axes -- it is the direction.
 *
 *  Two variants, which is the client's split. `big` is the preview rail: full
 *  type line and a rules box. The default is a board card: short type line, a
 *  keyword line instead of rules, because at 122px a rules box is six-pixel
 *  type and the keywords say more in the same space.
 *
 *  Every card in this file is somebody's commander, so the crown the client
 *  puts inside a legendary's name is always on. The type glyph beside it is
 *  deliberately not ported: twenty-four Legendary Creatures is the same mark
 *  twenty-four times. */
function face(c, variant) {
  const big = variant === "big";
  const media = c.art ? `<img class="face__art" src="${artUrl(c.art)}" alt="">` : `<div class="face__art face__art--none"></div>`;
  const cost = pips(c.cost);
  const kw = !big && c.kw ? `<span class="face__kw">${esc(c.kw)}</span>` : `<span class="face__spacer"></span>`;
  return `<div class="face f-${c.f || "C"}${big ? " face--big" : ""}">
    ${media}
    <div class="face__head">
      <div class="face__title">
        <span class="face__name"><span class="crown" title="Commander" aria-label="Commander">&#9819;</span>${esc(c.n)}</span>
      </div>
      ${cost ? `<div class="face__cost">${cost}</div>` : ""}
    </div>
    <div class="face__foot">
      <div class="face__type">${esc(big ? c.tl : shortType(c.tl))}</div>
      ${big && c.rules
        // The span is load-bearing. .face__rules is a flex column, so symbols
        // placed straight into it become flex *items* -- each one stretches to
        // the full width of the card and the rules box becomes a stack of
        // coloured bars. One child; the pips stay inline inside it.
        ? `<div class="face__rules"><span>${symbolise(c.rules)}</span></div>` : ""}
      <div class="face__footer">${kw}${c.pt ? `<span class="face__pt tabular">${c.pt}</span>` : ""}</div>
    </div>
  </div>`;
}

function curve(values) {
  if (!values) return `<div class="curve__none">No deck list in the repo for this one yet — a curve is a count of a list, and inventing one would be the only lie on this screen.</div>`;
  const max = Math.max(...values);
  const label = (i) => `${i + 1}${i === 6 ? "+" : ""}`;
  const cols = values.map((v, i) => `<span class="curve__bar" style="height:${Math.round((v / max) * 100)}%" title="${v} cards at ${label(i)} mana"></span>`).join("");
  const axis = values.map((v, i) => `<span class="curve__n tabular">${label(i)}</span>`).join("");
  return `<div class="curve"><div class="curve__cols">${cols}</div><div class="curve__axis">${axis}</div></div>`;
}

function engineBadge(deck) {
  if (deck.engine === "preview") return `<span class="badge">Preview</span>`;
  if (deck.engine === "partial") return `<span class="badge badge--partial">${deck.unsupported} unsupported</span>`;
  return "";
}

  ],
  fillCpu: true,
  cat: false,
  catFor: 0,
  open: null,
  invite: false,
  q: "", colours: [], src: "all", sort: "name",
  imp: { status: "idle", url: "", msg: "" },
  custom: null,
  starting: false,
  copied: null,
};

const allDecks = () => (state.custom ? DECKS.concat([state.custom]) : DECKS.slice());
const deckById = (id) => allDecks().find((d) => d.id === id) || null;
const myDeck = () => deckById(state.seats[0].deckId);

/* Seats ------------------------------------------------------------------ */

let joinToken = 0;

const filled = () => state.seats.filter((s) => s.kind !== "empty");
const podSize = () => filled().length;
const openSeats = () => state.seats.filter((s) => s.kind === "open").length;
const roomLive = () => state.seats.some((s) => s.kind === "open" || s.kind === "human");

function seatReady(s) {
  if (s.kind === "empty") return false;
  if (s.kind === "cpu") return true;
  if (s.kind === "open") return state.fillCpu;
  return !!s.ready;
}
const allReady = () => filled().every(seatReady);
const canStart = () => {
  const d = myDeck();
  return !!d && d.engine !== "preview" && podSize() >= 2 && allReady() && state.seats[0].ready;
};

/* CPUs are numbered by their position among the engine seats, not by seat
   index: the second CPU in a pod whose seat 2 is a human is still "CPU 2". */
const cpuNumber = (i) => state.seats.slice(0, i + 1).filter((s) => s.kind === "cpu").length;

function firstEmpty() {
  for (let i = 1; i < state.seats.length; i += 1) if (state.seats[i].kind === "empty") return i;
  return -1;
}

function addCpu(i) {
  const at = i == null ? firstEmpty() : i;
  if (at < 1) return;
  state.seats[at] = { kind: "cpu", deckId: freeDeck(at) };
}

function openChair(i) {
  const at = i == null ? firstEmpty() : i;
  if (at < 1) return;
  state.seats[at] = { kind: "open" };
  state.invite = true;
  const guest = POD.guests[(at - 1) % POD.guests.length];
  const token = ++joinToken;
  setTimeout(() => {
    if (token !== joinToken || state.seats[at].kind !== "open") return;
    state.seats[at] = { kind: "human", name: guest.name, deckId: guest.deckId, ready: false };
    dedupeCpuDecks();
    render();
    setTimeout(() => {
      if (token !== joinToken || state.seats[at].kind !== "human") return;
      state.seats[at].ready = true;
      render();
    }, POD.readyMs - POD.joinMs);
  }, POD.joinMs);
}

/** A dealable deck nobody at the table is already holding.
 *
 *  Called once, when a seat is created. This used to be derived on every render
 *  instead -- "the live decks nobody else has, indexed by seat number" -- which
 *  read fine while no CPU's deck was ever set explicitly. The moment one is, it
 *  is a bug: pinning seat 2's deck takes a card out of the pool the other seats
 *  are indexing into, so seat 4's card turns itself over. A seat's deck is now
 *  decided once and then belongs to that seat until somebody changes it. */
function freeDeck(at) {
  const taken = new Set(state.seats.map((s) => s.deckId).filter(Boolean));
  const live = DECKS.filter((d) => d.engine !== "preview");
  const pool = live.filter((d) => !taken.has(d.id));
  const chosen = pool.length ? pool : live;
  return chosen[(at * 7) % chosen.length].id;
}

/** Two seats holding the same commander is not a pod, and the arriving guest's
 *  list is scripted while the CPU's was arbitrary -- so the CPU is the one that
 *  moves. */
function dedupeCpuDecks() {
  state.seats.forEach((s, i) => {
    if (s.kind !== "cpu") return;
    if (state.seats.some((o, j) => j !== i && o.kind !== "cpu" && o.deckId === s.deckId)) {
      s.deckId = freeDeck(i);
    }
  });
}

function seatDeck(i) {
  const s = state.seats[i];
  if (s.kind === "empty" || s.kind === "open") return null;
  if (s.kind === "you") return myDeck();
  if (s.kind === "human") return s.ready ? deckById(s.deckId) : null;
  return deckById(s.deckId);
}

function seatLabel(i) {
  const s = state.seats[i];
  if (s.kind === "you") return { title: "You", sub: s.ready ? "Locked in" : "Choosing" };
  if (s.kind === "open") return { title: "Open chair", sub: "Waiting for a player" };
  if (s.kind === "human") return { title: s.name, sub: s.ready ? "Locked in" : "Choosing a deck…" };
  // A CPU is ready by construction, which is what the segment above it already
  // says. There is nothing else true about it yet that is not its deck.
  return { title: `CPU ${cpuNumber(i)}`, sub: "Ready" };
}

/* The catalogue ---------------------------------------------------------- */

function visibleDecks() {
  const q = state.q.trim().toLowerCase();
  let list = allDecks().filter((d) => {
    if (state.src !== "all" && d.source !== state.src) return false;
    if (state.colours.length && !state.colours.every((c) => d.ci.includes(c))) return false;
    if (!q) return true;
    return (d.name + " " + d.cmd.n + " " + d.guild + " " + d.tags.join(" ")).toLowerCase().includes(q);
  });
  const s = SORTS.find((x) => x.id === state.sort);
  list = list.slice().sort((a, b) => {
    if (state.sort === "name") return a.name.localeCompare(b.name);
    const d = b.bars[state.sort] - a.bars[state.sort];
    return (s && s.invert ? -d : d) || a.name.localeCompare(b.name);
  });
  return list;
}

/* Views ------------------------------------------------------------------ */

const cardBack = (mark, mod) => `<div class="back${mod ? " back--" + mod : ""}"><div class="back__mark">${esc(mark)}</div></div>`;

function home() {

        <span>or import your own from Moxfield</span>

  </div>`;
}

/** One seat: a card, and a plate under it. Every slot has the same anatomy
 *  whatever is in it -- that sameness is what makes the row read as a hand. */
function slot(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  const you = i === 0;
  const lab = seatLabel(i);

  if (s.kind === "empty") {
    const n = podSize();
    return `<div class="slot">
      <div class="slot__head"><span class="slot__no">Seat ${i + 1}</span></div>
      <div class="slot__card">${cardBack("Empty seat", "empty")}</div>
      <div class="plate">
        <div class="plate__who"><span class="plate__n">No one yet</span></div>
        <div class="plate__deck">A pod seats four</div>
        <span class="plate__fill">
          <button class="btn btn--wide" data-act="add-cpu" data-i="${i}" data-testid="opponents-${n}">Add a CPU</button>
          <button class="btn btn--wide" data-act="open-chair" data-i="${i}">Invite a player</button>
        </span>
      </div>
    </div>`;
  }

  // Face-down covers three different facts with one picture, on purpose.
  const cardFace = d
    ? face(d.cmd, "big")
    : s.kind === "open"
      ? cardBack("Waiting for a player", "open")
      : cardBack("Sealed until they lock in");

  // Every resolved seat wears the stamp, CPUs included -- a CPU is locked in by
  // construction, and it was the one seat whose card said nothing about that.
  // Only a face-up card can carry it: an open chair is a card back.
  const stamp = d && seatReady(s)
    ? `<span class="stamp${you ? "" : " stamp--them"}">Locked in</span>` : "";

  // Whose deck you may read: your own, a CPU's, and another player's once they
  // have locked in. That single fact drives the card's clickability, the `i` in
  // the meta row and the dossier's own "for this seat" behaviour, so it is
  // decided once here rather than three times below.
  const readable = !!d && (you || s.kind === "cpu" || s.ready);
  const forSeat = you || s.kind === "cpu" ? ` data-for="${i}"` : "";
  const info = readable
    ? `<button class="ibtn" data-act="dossier" data-id="${d.id}"${forSeat} title="Deck details" aria-label="Deck details for ${esc(lab.title)}">i</button>`
    : "";

  const deckLine = d
    ? `<div class="plate__deck">${esc(d.name)}</div>
       <div class="plate__meta">${ciPips(d.ci)}${engineBadge(d)}${info}</div>`
    : `<div class="plate__deck plate__deck--sealed">${s.kind === "open" ? `Pod ${POD.code}` : "Deck sealed"}</div>
       <div class="plate__meta"><span class="count">${s.kind === "open" ? "Anyone with the code" : "Readable once they lock in"}</span></div>`;

  // What is left in the acts row is only ever what you came to the plate to do.
  // Reading a deck moved onto the card and into the meta row; emptying the seat
  // moved up into the header. A seat belonging to another player now has no acts
  // row at all, which is right -- there is nothing about it for you to change.
  let acts = "";
  if (you) {
    acts = `<button class="btn btn--wide" data-act="cat-open" data-for="0" ${s.ready ? "disabled" : ""}>Change deck</button>`;
  } else if (s.kind === "cpu") {
    acts = `<button class="btn btn--wide" data-act="cat-open" data-for="${i}">Change deck</button>`;
  } else if (s.kind === "open") {
    acts = `<button class="btn" data-act="invite">Share the code</button>
            <button class="btn" data-act="add-cpu" data-i="${i}">CPU instead</button>`;
  }

  return `<div class="slot">
    <div class="slot__head">
      <span class="slot__no${you ? " slot__no--you" : ""}">Seat ${i + 1} · ${you ? "you" : s.kind === "cpu" ? "CPU" : s.kind === "open" ? "open" : "player"}</span>
      ${you ? "" : `<button class="slot__x" data-act="clear" data-i="${i}" title="Empty this seat" aria-label="Empty seat ${i + 1}">✕</button>`}
    </div>
    <div class="slot__card"${readable ? ` role="button" tabindex="0" data-act="dossier" data-id="${d.id}"${forSeat} aria-label="Read ${esc(d.name)}"` : ""}>
      ${cardFace}
      ${stamp}
    </div>
    <div class="plate">
      <div class="plate__who"><span class="plate__n">${esc(lab.title)}</span><span class="plate__tag">${esc(lab.sub)}</span></div>
      ${deckLine}
      ${acts ? `<div class="plate__acts">${acts}</div>` : ""}
    </div>
  </div>`;
}

/** Four segments, one per card, filling as each turns face-up and stamps. */
function turned() {
  const segs = state.seats.map((s, i) => {
    const lab = seatLabel(i);
    if (s.kind === "empty") return `<i class="turned__s turned__s--none" title="Seat ${i + 1} · empty"></i>`;
    if (seatReady(s)) return `<i class="turned__s turned__s--on" title="${esc(lab.title)} · ready"></i>`;
    return `<i class="turned__s turned__s--wait" title="${esc(lab.title)} · ${esc(lab.sub)}"></i>`;
  }).join("");
  const done = filled().filter(seatReady).length;
  return `<div class="turned">
    <div class="turned__l">Cards face up <span class="turned__n tabular">${done} of ${podSize()}</span></div>
    <div class="turned__t">${segs}</div>
  </div>`;
}

function why() {
  const d = myDeck();
  if (!d) return "Pick a deck to turn your card over.";
  if (d.engine === "preview") return "This deck has no list in the engine yet, so it cannot be dealt.";
  if (podSize() < 2) return "A pod needs at least one opponent. Add a CPU or invite somebody.";
  if (!state.seats[0].ready) return "Your card is face up but not stamped.";
  const waiting = state.seats
    .map((s, i) => ({ s, i }))
    .filter(({ s }) => s.kind !== "empty" && !seatReady(s))
    .map(({ i }) => seatLabel(i).title);
  if (waiting.length) return `Waiting on ${waiting.join(" and ")}.`;
  if (openSeats()) return `${openSeats()} chair${openSeats() > 1 ? "s" : ""} still open — a CPU will fill ${openSeats() > 1 ? "them" : "it"}.`;
  return `${podSize()} cards up. Deal them.`;
}

function pod() {
  const locked = state.seats[0].ready;
  const d = myDeck();
  return `<div class="pod" data-testid="new-game">
    <header class="head">
      <span class="brand">
        <span class="brand__mark">Snap Keep</span>
        <span class="brand__sub">Pod lobby</span>
      </span>
      <span class="head__spacer"></span>
      ${roomLive() ? `<span class="codechip">
        <span class="codechip__l">Pod</span>
        <b class="codechip__v tabular">${POD.code}</b>
        <button class="btn" data-act="copy" data-what="code">${state.copied === "code" ? "Copied" : "Copy"}</button>
      </span>` : ""}
      <button class="btn" data-act="invite">Invite a player</button>
      <button class="ghost" data-act="leave">Leave the pod</button>
    </header>

    <div class="tablewrap">
      <div class="tablewrap__l">
        The pod
        <span class="tablewrap__h">A card turns face up when its seat picks a deck, and stamps when the seat locks in.</span>
      </div>
      <div class="hand">
        <div class="hand__felt"></div>
        ${state.seats.map((_, i) => slot(i)).join("")}
      </div>
    </div>

    <div class="rail">
      <button class="lock${locked ? " lock--on" : ""}" data-act="lock" data-testid="lock-in" ${!d || d.engine === "preview" ? "disabled" : ""}>
        ${locked ? "Unlock my card" : "Lock in my seat"}
      </button>
      <span class="rail__spacer"></span>
      ${turned()}
      <p class="rail__why">${esc(why())}</p>
      <button class="play" data-act="start" data-testid="start-game" ${canStart() && !state.starting ? "" : "disabled"}>
        ${state.starting ? "Shuffling…" : "Deal the pod"}
      </button>
    </div>
  </div>`;
}

function catalogue() {
  if (!state.cat) return "";
  const list = visibleDecks();
  const forSeat = state.catFor;
  // What the seat is *holding*, not what was explicitly assigned to it -- a CPU
  // seat whose deck came from `seatDeck`'s auto-assignment has no `deckId`, and
  // reading that field left the catalogue showing no selection for a seat with a
  // card plainly face-up on the table.
  const held = seatDeck(forSeat);
  const chosen = held ? held.id : null;
  const { status, msg } = state.imp;
  let note = `<span class="imp__note">${esc(CUSTOM.hint)}</span>`;
  if (status === "fetching") note = `<span class="imp__note imp__note--busy">Reading the list…</span>`;
  if (status === "error") note = `<span class="imp__note imp__note--err">${esc(msg)}</span>`;
  if (status === "ready") note = `<span class="imp__note">Imported. ${CUSTOM.fake.unsupported} cards are not in the engine yet and were left out.</span>`;

  // The card IS the control -- see the .pick__card comment in the stylesheet.
  // A preview deck cannot be dealt, so its card carries no data-act and is not
  // in the tab order; the PREVIEW badge below it is what says why.
  const pick = (d) => {
    const off = d.engine === "preview";
    const on = d.id === chosen;
    const label = off ? `${d.name} — preview only, not dealable yet`
      : on ? `${d.name} — selected` : `Take ${d.name}`;
    return `<div class="pick${on ? " pick--on" : ""}${off ? " pick--off" : ""}" data-testid="deck-${d.id}">
    <div class="pick__card"${off ? ` aria-disabled="true" title="Not dealable yet"`
        : ` role="button" tabindex="0" data-act="pick" data-id="${d.id}"`} aria-label="${esc(label)}">
      ${face(d.cmd)}
      ${on ? `<span class="pick__tick">✓</span>` : ""}
    </div>
    <div class="pick__n">${esc(d.name)}</div>
    <div class="pick__s">${esc(subtitle(d))}</div>
    <div class="pick__meta">${ciPips(d.ci)}<span class="badge badge--src">${d.source === "yours" ? "Yours" : "Precon"}</span>${engineBadge(d)}<button class="ibtn" data-act="dossier" data-id="${d.id}" title="Deck details" aria-label="Details for ${esc(d.name)}">i</button></div>
    <div class="pick__bars">${bar("Speed", d.bars.speed, true)}${bar("Complex", d.bars.complexity, true)}${bar("Demands", d.bars.pilot, true)}</div>
  </div>`;
  };

  return `<section class="cat" role="dialog" aria-modal="true" aria-label="Deck catalogue" data-testid="deck-catalog">
    <div class="cat__head">
      <span class="cat__t">Turn a card face up</span>
      <span class="cat__for">${forSeat === 0 ? "Choosing your deck" : `Choosing for ${esc(seatLabel(forSeat).title)}`}</span>
      <button class="cat__x" data-act="cat-close" aria-label="Close">✕</button>
    </div>

    <div class="filters">
      <label class="search">
        <span class="search__g">⌕</span>
        <input class="search__i" id="q" type="text" value="${esc(state.q)}" placeholder="Search decks, commanders, archetypes" spellcheck="false" aria-label="Search decks">
      </label>
      <span class="fgroup">
        <span class="fgroup__l">Colours</span>
        ${COLOURS.map(([c, n]) => `<button class="cbtn${state.colours.includes(c) ? " cbtn--on" : ""}" data-act="colour" data-c="${c}" title="${n}" aria-label="${n}" aria-pressed="${state.colours.includes(c)}">${sym(c)}</button>`).join("")}
        ${state.colours.length ? `<button class="link" data-act="colour-clear">clear</button>` : ""}
      </span>
      <span class="seg">
        ${[["all", "All"], ["precon", "Precons"], ["yours", "Yours"]].map(([id, n]) =>
          `<button class="seg__b${state.src === id ? " seg__b--on" : ""}" data-act="src" data-v="${id}">${n}</button>`).join("")}
      </span>
      <select class="sel" id="sort" name="sort" data-act="sort" aria-label="Sort decks">
        ${SORTS.map((s) => `<option value="${s.id}"${state.sort === s.id ? " selected" : ""}>Sort: ${s.n}</option>`).join("")}
      </select>
      <span class="filters__spacer"></span>
      <span class="filters__n tabular">${list.length} of ${allDecks().length}</span>
    </div>

    <div class="cat__body">
      ${list.length
        ? `<div class="rack">${list.map(pick).join("")}</div>`
        : `<div class="empty">Nothing matches that.<br>Clear a colour or two — the filter is an AND, so three colours means decks that play all three.</div>`}
    </div>

    <div class="cat__foot">
      <span class="imp">
        <span class="imp__l">Import</span>
        <input class="imp__in" id="mox" type="text" value="${esc(state.imp.url)}" placeholder="${esc(CUSTOM.placeholder)}" spellcheck="false" aria-label="Moxfield deck link">
        <button class="btn" data-act="import">Fetch</button>
      </span>
      ${note}
    </div>
  </section>`;
}

function dossier() {
  if (!state.open) return "";
  const d = deckById(state.open);
  if (!d) return "";
  const sigs = d.signature.length
    ? `<div class="dos__sigs">${d.signature.map((s) => `<div class="sig">
        <img class="sig__art" src="${artUrl(s.art)}" alt="">
        <div><div class="sig__n">${esc(s.n)}</div><div class="sig__why">${esc(s.why)}</div></div>
      </div>`).join("")}</div>`
    : `<p class="dos__p">No editorial notes for this one. Picking three cards to call defining would mean picking them out of a list this repo has not built yet.</p>`;
  const honesty = d.engine === "preview"
    ? `<div class="note">Preview. This commander needs a rules feature the engine does not implement, so the deck cannot be dealt. It is in the catalogue because the catalogue has to be able to show it first.</div>`
    : d.engine === "partial"
      ? `<div class="note">${d.unsupported} of the imported cards use rules the engine does not implement and were dropped from the list.</div>`
      : d.swapNote
        ? `<div class="note">${esc(d.swapNote)}</div>`
        : `<div class="note">Real card, real oracle text, real art. The ratings and the write-up are editorial; the deck list itself arrives with the roadmap's All Card Support work.</div>`;

  return `<div class="veil" style="z-index:450" data-act="close"></div>
  <aside class="over" role="dialog" aria-modal="true" aria-label="${esc(d.name)}">
    <div class="over__head">
      <span class="over__n">${esc(d.name)}</span>
      ${ciPips(d.ci)}
      ${engineBadge(d)}
      <button class="over__x" data-act="close" aria-label="Close">✕</button>
    </div>
    <div class="over__body">
      <div class="dos__top">
        <div class="dos__card">
          ${face(d.cmd, "big")}
          <div class="dos__artist">Art: ${esc(d.cmd.artist)}</div>
        </div>
        <div style="min-width:0">
          <h3 class="dos__h">The deck</h3>
          <p class="dos__p">${esc(d.blurb)}</p>
          <h3 class="dos__h">Playstyle</h3>
          <div class="dos__tags">${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
          <div class="dos__bars">${bars(d.bars)}</div>
        </div>
      </div>
      <h3 class="dos__h">How it plays</h3>
      <p class="dos__p">${esc(d.strategy)}</p>
      <h3 class="dos__h">Cards that define it</h3>
      ${sigs}
      <h3 class="dos__h">Mana curve</h3>
      ${curve(d.curve)}
      ${honesty}
    </div>
    <div class="over__foot">
      <button class="play" data-act="pick-close" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>Take this deck</button>
      <button class="ghost" data-act="close">Close</button>
    </div>
  </aside>`;
}

function invite() {
  if (!state.invite) return "";
  const open = openSeats();
  return `<div class="veil" style="z-index:465" data-act="invite-close"></div>
  <section class="inv" role="dialog" aria-modal="true" aria-label="Invite a player">
    <div class="inv__head">
      <span class="inv__t">Invite a player</span>
      <button class="inv__x" data-act="invite-close" aria-label="Close">✕</button>
    </div>
    <div class="inv__body">
      <div>
        <div class="inv__l">Pod code</div>
        <div class="inv__code">
          <b class="inv__codev tabular">${POD.code}</b>
          <button class="btn" data-act="copy" data-what="code">${state.copied === "code" ? "Copied" : "Copy"}</button>
        </div>
      </div>
      <div>
        <div class="inv__l">Or send the link</div>
        <div class="inv__code">
          <span class="inv__linkv">${esc(POD.link)}</span>
          <button class="btn" data-act="copy" data-what="link">${state.copied === "link" ? "Copied" : "Copy"}</button>
        </div>
      </div>
      <p class="inv__note">${open
        ? `${open} chair${open > 1 ? "s are" : " is"} open and holding this code. Whoever arrives picks their own deck, and their card stays face-down until they lock in.`
        : "No chair is open yet. Open one and it will hold this code until somebody takes it."}</p>
    </div>
    <div class="inv__foot">
      ${open
        ? `<button class="btn btn--wide" data-act="invite-close">Back to the pod</button>`
        : `<button class="btn btn--wide btn--live" data-act="open-chair">Open a chair</button>`}
    </div>
  </section>`;
}

function render() {
  root.innerHTML = state.route === "home"
    ? home() + catalogue() + dossier()
    : pod() + catalogue() + dossier() + invite();
}

/* Behaviour -------------------------------------------------------------- */

root.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "mox") { state.imp.url = e.target.value; return; }
  if (id === "code") { state.joinCode = e.target.value.toUpperCase(); return; }
  if (id === "q") {
    state.q = e.target.value;
    render();
    const box = document.getElementById("q");
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
});

root.addEventListener("change", (e) => {
  if (e.target.dataset.act === "sort") { state.sort = e.target.value; render(); }
});

function runImport() {
  const url = state.imp.url.trim();
  if (!/^https?:\/\/(www\.)?moxfield\.com\/decks\/\S+/i.test(url)) {
    state.imp = { status: "error", url, msg: CUSTOM.errors.badUrl };
    render();
    return;
  }
  state.imp = { status: "fetching", url, msg: "" };
  render();
  setTimeout(() => {
    state.custom = CUSTOM.fake;
    state.src = "yours";
    if (!state.seats[0].ready) state.seats[0].deckId = CUSTOM.fake.id;
    state.imp = { status: "ready", url, msg: "" };
    render();
  }, 700);
}

function pick(id) {
  const d = deckById(id);
  if (!d || d.engine === "preview") return;
  const i = state.catFor;
  if (i === 0) { if (!state.seats[0].ready) state.seats[0].deckId = id; }
  else if (state.seats[i] && state.seats[i].kind === "cpu") state.seats[i].deckId = id;
}

root.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-act]");
  if (!hit) return;
  const act = hit.dataset.act;
  const i = hit.dataset.i != null ? Number(hit.dataset.i) : null;

  switch (act) {
    case "create": state.route = "lobby"; break;
    case "join":
      state.route = "lobby";
      state.seats[1] = { kind: "human", name: POD.guests[0].name, deckId: POD.guests[0].deckId, ready: true };
      state.seats[2] = { kind: "cpu", deckId: freeDeck(2) };
      break;
    case "leave":
      state.route = "home";
      joinToken += 1;
      state.seats = [{ kind: "you", deckId: state.seats[0].deckId, ready: false }, { kind: "empty" }, { kind: "empty" }, { kind: "empty" }];
      state.invite = false;
      break;

    case "add-cpu": addCpu(i); break;
    case "open-chair": openChair(i); break;
    case "clear": joinToken += 1; state.seats[i] = { kind: "empty" }; break;

    case "cat-open": state.cat = true; state.catFor = Number(hit.dataset.for || 0); break;
    case "cat-close": state.cat = false; break;
    // Choosing a deck is the errand you opened the catalogue to run, so making
    // the choice ends it. There is no longer a "pick but stay" case: leaving the
    // rack open after a click asked you to notice a tick on a card you had just
    // clicked and then find your own way out.
    case "pick":
    case "pick-close": pick(hit.dataset.id); state.open = null; state.cat = false; break;
    case "dossier":
      if (!hit.dataset.id) return;
      e.stopPropagation();
      // A dossier opened off a seat plate says which seat it is for, so its
      // "Take this deck" lands on that seat rather than on whichever one the
      // catalogue was last opened for.
      if (hit.dataset.for != null) state.catFor = Number(hit.dataset.for);
      state.open = hit.dataset.id;
      break;
    case "close": state.open = null; break;

    case "colour": {
      const c = hit.dataset.c;
      state.colours = state.colours.includes(c) ? state.colours.filter((x) => x !== c) : state.colours.concat([c]);
      break;
    }
    case "colour-clear": state.colours = []; break;
    case "src": state.src = hit.dataset.v; break;
    case "import": runImport(); return;

    case "lock": state.seats[0].ready = !state.seats[0].ready; break;
    case "fill": state.fillCpu = !state.fillCpu; break;
    case "invite": state.invite = true; break;
    case "invite-close": state.invite = false; break;
    case "copy":
      state.copied = hit.dataset.what;
      setTimeout(() => { state.copied = null; render(); }, 1400);
      break;

    case "start":
      state.starting = true;
      render();
      setTimeout(() => { state.starting = false; render(); }, 1700);
      return;

    default: return;
  }
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.open) { state.open = null; render(); return; }
    if (state.invite) { state.invite = false; render(); return; }
    if (state.cat) { state.cat = false; render(); return; }
  }
  if (e.key === "Enter" && e.target.id === "code") { state.route = "lobby"; render(); return; }
  // Anything wearing role="button" is a div, so it gets Enter and Space here
  // rather than from the browser. Space also scrolls, hence preventDefault.
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute?.("role") === "button") {
    e.preventDefault();
    e.target.click();
  }
});

render();
</script>
</body>
</html>
