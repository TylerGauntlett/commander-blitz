<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap Keep — Three Steps (flow 04)</title>
<style>
/* ============================================================================
   THREE STEPS -- accept that this is a form, and make it an excellent one
   ----------------------------------------------------------------------------
   THESIS. This is the control, the way 04-ink-dossier.html was the control in
   the menu round. Every other direction here is a surface you inhabit; this one
   asks the opposite question. Somebody opening Snap Keep for the first time has
   never seen a Commander pod and does not know that "four seats" is a rule
   rather than a setting. For that person a dashboard is a room full of controls
   with no stated order, and a wizard is somebody telling them what to do next.
   ONE DECISION PER SCREEN, in the order the decisions actually depend on each
   other: your deck, then the pod, then ready.

   THE BIG IDEA, stealable on its own: THE COMPARISON MATRIX AT CATALOGUE SCALE.
   Twenty-four decks over shared columns -- speed, complexity, interaction,
   resilience, what the deck asks of you -- as filled and hollow segments you
   can read straight down. Every other direction makes you open twenty-four
   dossiers to learn what this shows at rest, and a player choosing a first deck
   is doing a comparison, not twenty-four readings. This is the single most
   portable thing in the round and it should be stolen whichever direction wins.

   THE RULE: HUE IS SPENT ON MANA AND ON NOTHING ELSE. There is no gold button
   on this screen. The commit control is a near-white slab -- the one filled
   object on a page of outlines -- and every other distinction is weight, shape
   and luminance. Take the pips away and there is no hue left on the screen at
   all. That is the whole claim, and it is checkable.

   SECOND IDEA: THE ESCAPE IS PART OF THE DESIGN. A returning player pays three
   screens for what one screen could do, so "Skip to the last step" is in the
   header from step one. If that escape gets used every single time, this
   direction has lost and the escape is the evidence.

   THE TRADE. It is the least game-like screen in the round, deliberately, and
   it loses the brief's first sentence on purpose. Its ideas are meant to be
   ported into whichever direction wins rather than to win on their own.

   No build, no server, no network. Local ../art/ only.
   ========================================================================== */

/* Tokens ----------------------------------------------------------------- */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.18); --edge-hi:rgba(178,170,255,.34);
  --astral-hi:#c3b6ff;

  --pane-bg:rgba(20,19,40,.55); --pane-well:rgba(13,12,28,.72);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-ink:#1a1a1a;

  /* No --gold. The commit control is luminance, not hue: a near-white slab, the
     one filled object on a page of outlines. */
  --ink:#efedfa; --ink-on:#14121f;
  --danger:#ff5c5c;
  --text:#e6e3f5; --text-dim:#a8a3ca; --text-faint:#726d97;

  --card-w:clamp(128px, 18vh, 176px);
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;

  /* One template, shared by the matrix header and every matrix row, so the
     columns cannot drift apart. */
  /* The colours column is 132px because The Ur-Dragon is five pips and a card
     count, and 104px was not enough -- the cell overflowed into the ratings.
     Measured, not guessed; a five-colour deck is the widest this ever gets. */
  --mcols:40px minmax(210px, 1.6fr) 132px repeat(5, 84px) 104px 74px 94px;
}

.f-W { --f-hi:#f6eed4; --f-lo:#b9ad86; --fb:#d8cfa8; }
.f-U { --f-hi:#a9d2ec; --f-lo:#2f6a95; --fb:#4a86b8; }
.f-B { --f-hi:#b6aeac; --f-lo:#2e282b; --fb:#4c4550; }
.f-R { --f-hi:#f0a48b; --f-lo:#a4432f; --fb:#b8624a; }
.f-G { --f-hi:#a9cfa2; --f-lo:#2f6b41; --fb:#4e8a5c; }
.f-C { --f-hi:#d3d6da; --f-lo:#787e86; --fb:#8a8f96; }
.f-gold { --f-hi:#eed99c; --f-lo:#9c7a24; --fb:#b99a45; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 72%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
.tabular { font-variant-numeric:tabular-nums; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--edge); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* THE SHELL --------------------------------------------------------------- */

.wiz { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; height:100%; overflow:hidden; }

.top { display:flex; align-items:center; gap:20px; padding:14px 28px 13px; border-bottom:1px solid var(--edge); }
.brand__mark { font-size:15px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; }
.brand__sub { font-size:11px; color:var(--text-faint); letter-spacing:.04em; margin-left:10px; }
.top__spacer { flex:1; }

/* The ladder. A step is a number in a ring; the current one is filled with
   luminance rather than lit with a colour, so it survives `g` by construction. */
.steps { display:flex; align-items:center; gap:0; }
.step { display:flex; align-items:center; gap:9px; padding:0 4px; }
.step__n {
  width:26px; height:26px; border-radius:999px; display:grid; place-items:center; flex:none;
  border:1.5px solid var(--edge-hi); font-size:11.5px; font-weight:800; color:var(--text-faint);
}
.step__t { font-size:12px; font-weight:650; color:var(--text-faint); white-space:nowrap; }
.step--on .step__n { background:var(--ink); border-color:var(--ink); color:var(--ink-on); }
.step--on .step__t { color:var(--text); font-weight:750; }
.step--done .step__n { border-color:var(--text-dim); color:var(--text-dim); }
.step--done .step__t { color:var(--text-dim); }
.step__bar { width:44px; height:1px; background:var(--edge-hi); margin:0 6px; flex:none; }
.step__bar--done { background:var(--text-dim); }

.sub { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:11px 28px; border-bottom:1px solid var(--edge); background:rgba(9,8,20,.34); }
.sub__t { font-size:12.5px; color:var(--text-dim); }
.sub__spacer { flex:1; }
.sub__n { font-size:11.5px; color:var(--text-faint); }

.body { min-height:0; overflow:auto; padding:16px 28px 22px; }
.foot { display:flex; align-items:center; gap:14px; padding:13px 28px; border-top:1px solid var(--edge); background:rgba(11,10,22,.7); }
.foot__spacer { flex:1; }
.foot__why { font-size:11px; line-height:1.45; color:var(--text-faint); max-width:44ch; text-align:right; }

/* The one filled object on the page. */
.slab {
  padding:14px 30px; border-radius:9px; flex:none;
  background:var(--ink); color:var(--ink-on); font-size:14.5px; font-weight:800; letter-spacing:.02em;
  box-shadow:0 3px 0 rgba(150,145,180,.5);
}
.slab:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(150,145,180,.5); }
.slab:disabled { background:rgba(239,237,250,.22); color:rgba(20,18,31,.6); cursor:not-allowed; box-shadow:0 3px 0 rgba(120,116,150,.25); }
.slab--quiet { background:none; color:var(--text); border:1px solid var(--edge-hi); box-shadow:none; font-weight:700; }
.slab--quiet:hover { border-color:var(--text-dim); }

/* THE DOOR ---------------------------------------------------------------- */

.door { display:grid; place-items:center; height:100%; padding:0 28px; }
.hero { display:grid; justify-items:center; text-align:center; max-width:640px; }
.hero__mark { margin:0; font-size:clamp(42px, 6.6vh, 70px); font-weight:800; line-height:1; letter-spacing:.14em; text-transform:uppercase; }
.hero__rule { width:70px; height:1px; margin:20px 0 16px; background:var(--edge-hi); }
.hero__line { margin:0; font-size:15px; line-height:1.65; color:var(--text-dim); }
.hero__acts { display:flex; align-items:center; gap:14px; margin-top:30px; flex-wrap:wrap; justify-content:center; }
.hero__cap { margin-top:28px; display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-faint); }
.hero__cap b { color:var(--text-dim); font-weight:750; }
.or { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
.join { display:flex; align-items:center; border:1px solid var(--edge-hi); border-radius:9px; overflow:hidden; }
.join__in { width:150px; padding:13px 14px; border:0; background:rgba(8,7,18,.6); font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.join__in::placeholder { color:var(--text-faint); font-weight:600; letter-spacing:.1em; }
.join__in:focus { outline:none; }
.join:focus-within { border-color:var(--text-dim); }
.join__go { padding:13px 18px; border-left:1px solid var(--edge-hi); color:var(--text-dim); font-size:13px; font-weight:700; }
.join__go:hover { color:var(--text); }
.link { color:var(--text-dim); text-decoration:underline; text-underline-offset:3px; font-size:11.5px; }
.link:hover { color:var(--text); }

/* STEP 1 -- THE COMPARISON MATRIX ----------------------------------------- */

.mhead {
  display:grid; grid-template-columns:var(--mcols); gap:12px; align-items:end;
  padding:0 12px 8px; position:sticky; top:0; z-index:3;
  background:linear-gradient(180deg, var(--void-0) 72%, transparent);
}
.mh { font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); }
.mh--c { text-align:center; }

.mrow {
  display:grid; grid-template-columns:var(--mcols); gap:12px; align-items:center;
  padding:9px 12px; border-bottom:1px solid var(--edge); width:100%; text-align:left; color:var(--text);
}
.mrow:hover { background:rgba(143,127,232,.06); }
/* Selection is a filled ring and a heavier rule, not a colour. */
.mrow--on { background:rgba(239,237,250,.055); border-bottom-color:var(--text-dim); box-shadow:inset 3px 0 0 var(--ink); }
.mrow--off { opacity:.55; }

.ring { width:20px; height:20px; border-radius:999px; border:1.5px solid var(--edge-hi); display:grid; place-items:center; flex:none; }
.ring--on { border-color:var(--ink); }
.ring--on::after { content:""; width:10px; height:10px; border-radius:999px; background:var(--ink); }
.ring--no { border-style:dashed; }

/* One line, not two: a matrix row is read across, and stacking the subtitle
   would double the row height for twenty-four rows and cost the whole table
   its "readable down a column" property. */
.mname { display:flex; align-items:baseline; gap:9px; min-width:0; }
.mname__n { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; }
.mname__s { font-size:10.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; }
.mci { display:flex; align-items:center; flex-wrap:wrap; gap:4px; min-width:0; }

/* A rating: four segments, filled or hollow. Readable down a column, which is
   the entire reason this direction exists. */
.rate { display:flex; gap:2px; justify-content:center; }
.rate__s { width:12px; height:6px; border-radius:2px; border:1px solid var(--edge-hi); }
.rate__s--on { background:var(--text-dim); border-color:var(--text-dim); }

.msrc { font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.mmore { font-size:11px; color:var(--text-faint); text-decoration:underline; text-underline-offset:2px; }
.mmore:hover { color:var(--text); }

.filters { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.search { display:flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(8,7,18,.6); min-width:250px; }
.search:focus-within { border-color:var(--text-dim); }
.search__i { flex:1; min-width:0; border:0; background:none; font-size:12.5px; }
.search__i:focus { outline:none; }
.search__i::placeholder { color:var(--text-faint); }
.search__g { color:var(--text-faint); font-size:12px; }
.fgroup { display:flex; align-items:center; gap:7px; }
.fgroup__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.cbtn { width:25px; height:25px; border-radius:999px; display:grid; place-items:center; border:1px solid var(--edge-hi); font-size:11px; font-weight:800; color:var(--text-faint); }
.cbtn:hover { border-color:var(--text-dim); color:var(--text-dim); }
.cbtn--on { color:var(--mana-ink); border-color:transparent; box-shadow:inset 0 -1px 1px rgba(0,0,0,.25); }
.cbtn--on.cbtn--W { background:var(--mana-W); } .cbtn--on.cbtn--U { background:var(--mana-U); }
.cbtn--on.cbtn--B { background:var(--mana-B); } .cbtn--on.cbtn--R { background:var(--mana-R); }
.cbtn--on.cbtn--G { background:var(--mana-G); }
.seg { display:flex; border:1px solid var(--edge-hi); border-radius:8px; overflow:hidden; }
.seg__b { padding:6px 12px; font-size:11.5px; font-weight:650; color:var(--text-faint); border-right:1px solid var(--edge-hi); }
.seg__b:last-child { border-right:0; }
.seg__b:hover { color:var(--text); }
.seg__b--on { background:rgba(239,237,250,.12); color:var(--text); }
.sel { padding:7px 10px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(8,7,18,.6); font-size:12px; color:var(--text-dim); }
.sel:focus { outline:none; border-color:var(--text-dim); }

.imp { display:flex; align-items:center; gap:9px; margin-top:16px; padding:12px 14px; border:1px dashed var(--edge-hi); border-radius:10px; flex-wrap:wrap; }
.imp__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); flex:none; }
.imp__in { flex:1; min-width:230px; padding:9px 11px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(8,7,18,.6); font-size:12px; }
.imp__in::placeholder { color:var(--text-faint); }
.imp__in:focus { outline:none; border-color:var(--text-dim); }
.imp__note { font-size:10.5px; line-height:1.4; color:var(--text-faint); }
.imp__note--err { color:var(--danger); }
.imp__note--busy { color:var(--astral-hi); }
.empty { padding:52px 20px; text-align:center; color:var(--text-faint); font-size:13px; line-height:1.6; }

/* STEP 2 -- THE POD, AS ROWS ---------------------------------------------- */

.seats2 { display:grid; gap:10px; max-width:1180px; margin:0 auto; }
.srow {
  display:grid; grid-template-columns:74px 60px minmax(0,1fr) auto; gap:16px; align-items:center;
  padding:12px 14px; border:1px solid var(--edge); border-radius:11px; background:var(--pane-well);
}
.srow--you { box-shadow:inset 3px 0 0 var(--ink); }
.srow--empty { border-style:dashed; background:rgba(13,12,28,.34); }
.srow__no { font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); }
.srow__art { width:60px; height:60px; border-radius:8px; object-fit:cover; object-position:50% 26%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.5); }
.srow__none { width:60px; height:60px; border-radius:8px; background:repeating-linear-gradient(135deg, rgba(0,0,0,.22) 0 7px, transparent 7px 14px), #443e34; }
.srow__main { min-width:0; }
.srow__who { display:flex; align-items:baseline; gap:8px; }
.srow__n { font-size:14px; font-weight:800; }
.srow__tag { font-size:10.5px; color:var(--text-faint); }
.srow__deck { font-size:11.5px; color:var(--text-dim); margin-top:3px; }
.srow__deck--sealed { color:var(--text-faint); font-style:italic; }
.srow__meta { display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; }
.srow__line { margin:5px 0 0; font-size:11px; line-height:1.45; color:var(--text-faint); }
.srow__acts { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.lamps { display:flex; align-items:center; gap:10px; margin-top:6px; }
.lamp { display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--text-faint); }
.lamp__d { width:7px; height:7px; border-radius:999px; border:1px solid var(--edge-hi); }
.lamp--on { color:var(--text-dim); }
.lamp--on .lamp__d { background:var(--text-dim); border-color:var(--text-dim); }

.podbar { display:flex; align-items:center; gap:12px; max-width:1180px; margin:0 auto 14px; padding:11px 14px; border:1px solid var(--edge); border-radius:10px; background:rgba(9,8,20,.5); flex-wrap:wrap; }
.podbar__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.podbar__v { font-size:16px; font-weight:800; letter-spacing:.12em; color:var(--astral-hi); }
.podbar__spacer { flex:1; }
.podbar__note { font-size:11px; color:var(--text-faint); }

/* STEP 3 -- READY --------------------------------------------------------- */

.ready { display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; max-width:1180px; margin:0 auto; align-items:start; }
.ready__card { display:grid; gap:8px; justify-items:center; }
.ready__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.ready__h { margin:0 0 10px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.ready__list { display:grid; gap:8px; }
.rline {
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:13px; align-items:center;
  padding:10px 13px; border:1px solid var(--edge); border-radius:10px; background:var(--pane-well);
}
.rline__art { width:44px; height:44px; border-radius:7px; object-fit:cover; object-position:50% 26%; }
.rline__none { width:44px; height:44px; border-radius:7px; background:repeating-linear-gradient(135deg, rgba(0,0,0,.22) 0 7px, transparent 7px 14px), #443e34; }
.rline__n { font-size:13px; font-weight:750; }
.rline__s { font-size:10.5px; color:var(--text-faint); margin-top:2px; }
.rline__st { display:flex; align-items:center; gap:7px; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.dot { width:11px; height:11px; border-radius:999px; border:2px solid var(--edge-hi); flex:none; }
.dot--on { background:var(--ink); border-color:var(--ink); }
.dot--wait { border-style:dashed; border-color:var(--text-dim); }
.dot--none { opacity:.34; }
.ready__block { margin-top:20px; }
.ready__bars { display:grid; gap:6px; }

/* THE DOSSIER ------------------------------------------------------------- */

.veil { position:fixed; inset:0; z-index:450; background:rgba(6,5,16,.66); }
.over {
  position:fixed; z-index:460; right:0; top:0; bottom:0; width:min(660px, 96vw);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0;
  border-left:1px solid var(--edge-hi); background:linear-gradient(180deg,#1a1834,#0c0b1a);
  box-shadow:-26px 0 70px rgba(0,0,0,.72);
}
.over__head { display:flex; align-items:center; gap:10px; padding:15px 18px 13px; border-bottom:1px solid var(--edge); }
.over__n { font-size:18px; font-weight:800; min-width:0; }
.over__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge-hi); color:var(--text-dim); flex:none; }
.over__x:hover { color:var(--text); }
.over__body { min-height:0; overflow:auto; padding:16px 18px; }
.over__foot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--edge); }
.over__foot .slab { padding:11px 22px; font-size:13.5px; }

.dos__top { display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; }
.dos__card { display:grid; gap:7px; justify-items:center; align-content:start; }
.dos__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.dos__h { margin:16px 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.dos__h:first-child { margin-top:0; }
.dos__p { margin:0; font-size:12.5px; line-height:1.6; color:var(--text-dim); }
.dos__tags { display:flex; flex-wrap:wrap; gap:6px; }
.dos__bars { display:grid; gap:5px; margin-top:10px; }
.dos__sigs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:9px; }
.sig { display:grid; grid-template-columns:56px minmax(0,1fr); gap:9px; align-items:center; }
.sig__art { width:56px; height:44px; border-radius:5px; object-fit:cover; object-position:50% 30%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.sig__n { font-size:11.5px; font-weight:700; }
.sig__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); margin-top:2px; }

/* THE INVITE -------------------------------------------------------------- */

.inv {
  position:fixed; z-index:470; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(452px, 94vw); border:1px solid var(--edge-hi); border-radius:13px;
  background:linear-gradient(180deg,#1a1834,#0c0b1a); box-shadow:0 30px 90px rgba(0,0,0,.72);
}
.inv__head { display:flex; align-items:center; gap:10px; padding:15px 18px 12px; border-bottom:1px solid var(--edge); }
.inv__t { font-size:15px; font-weight:800; }
.inv__x { margin-left:auto; width:27px; height:27px; border-radius:999px; border:1px solid var(--edge-hi); color:var(--text-dim); }
.inv__x:hover { color:var(--text); }
.inv__body { padding:18px; display:grid; gap:14px; }

.btn:hover { border-color:var(--text-dim); }
.btn--wide { width:100%; padding:10px; text-align:center; }

.ghost:hover { color:var(--text); }

.pip--B { background:var(--mana-B); } .pip--R { background:var(--mana-R); }
.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }

.badge--partial { border-style:solid; border-color:var(--text-dim); color:var(--text); }

.bar { display:flex; align-items:center; gap:7px; }
.bar__label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); min-width:88px; }
.bar--tiny .bar__label { min-width:78px; font-size:8.5px; }
.bar__track { display:flex; gap:2px; }
.bar__seg { width:13px; height:5px; border-radius:2px; border:1px solid var(--edge-hi); background:transparent; }
.bar--tiny .bar__seg { width:11px; height:4px; }
.bar__seg--on { background:var(--text-dim); border-color:var(--text-dim); }

.face {
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; overflow:hidden;
  border-radius:var(--card-r); border:2px solid var(--fb);
  background:linear-gradient(160deg, var(--f-hi), var(--f-lo));
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.35);
  color:#fff; flex:none;
}
.face__art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.face__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.16) 0 6px, transparent 6px 12px), #6b6152; }
.face__head, .face__foot { position:relative; z-index:2; padding:6px 7px; }
.face__head { background:linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.57) 55%, rgba(0,0,0,0)); }
.face__foot { background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.71) 58%, rgba(0,0,0,0)); }
.face__title { display:flex; align-items:flex-start; gap:5px; }
/* min-width:0 and a wrapping cost row. Without them a six-pip cost like The
   Ur-Dragon's pushes .face__head past the card at small --card-w, which the
   card clips but which is still the escape failure the menu round documented. */
.face__name { flex:1; min-width:0; font-size:11px; font-weight:750; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.85); overflow-wrap:anywhere; }
.face__cost { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:2px; flex:none; max-width:56%; }
.face__type { margin-top:3px; font-size:8.5px; color:rgba(255,255,255,.86); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__rules { margin:0 0 5px; font-size:8.5px; line-height:1.38; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.85); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.face__base { display:flex; align-items:flex-end; gap:6px; }
.face__kw { flex:1; font-size:8.5px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__pt { font-size:12px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.9); }

.curve__cols { display:flex; align-items:flex-end; gap:4px; height:54px; }
.curve__bar { flex:1; background:var(--text-faint); border-radius:2px 2px 0 0; min-height:2px; }
.curve__axis { display:flex; gap:4px; margin-top:4px; }
.curve__n { flex:1; text-align:center; font-size:9px; color:var(--text-faint); }
.curve__none { padding:13px; border:1px dashed var(--edge-hi); border-radius:9px; font-size:11.5px; line-height:1.5; color:var(--text-faint); text-align:center; }
.note { margin-top:8px; padding:10px 12px; border-left:2px solid var(--edge-hi); border-radius:0 7px 7px 0; background:rgba(13,12,28,.5); font-size:11.5px; line-height:1.55; color:var(--text-faint); }
</style>

const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (slug) => "../art/" + slug + ".jpg";

function pips(cost) {
  if (!cost) return "";
  const out = []; let num = "";
  for (const ch of String(cost)) {
    if (ch >= "0" && ch <= "9") { num += ch; continue; }
    if (num) { out.push(`<i class="pip pip--C">${num}</i>`); num = ""; }
    out.push(`<i class="pip pip--${ch}">${ch}</i>`);
  }
  if (num) out.push(`<i class="pip pip--C">${num}</i>`);
  return out.join("");
}
const ciPips = (ci) => ci.map((c) => `<i class="pip pip--${c}">${c}</i>`).join("");

function bar(label, value, tiny) {
  let segs = "";
  for (let i = 1; i <= 4; i += 1) segs += `<i class="bar__seg${i <= value ? " bar__seg--on" : ""}"></i>`;
  return `<div class="bar${tiny ? " bar--tiny" : ""}"><span class="bar__label">${esc(label)}</span><span class="bar__track">${segs}</span></div>`;
}
const bars = (b) => BAR_LABELS.map(([k, l]) => bar(l, b[k])).join("");
const tierOf = (id) => DIFFICULTY.find((d) => d.id === id) || DIFFICULTY[1];
const subtitle = (d) => (d.cmd.n === d.name ? `${d.guild} · ${d.tags[0].toLowerCase()}` : d.cmd.n);

/** The capability list, written out. The ladder is a promise about behaviour,
 *  so the seat states the behaviour rather than an adjective. */
const capList = (caps) => `<div class="caps">${CAPS.map((c) => `
  <div class="cap${caps.includes(c.id) ? " cap--on" : ""}"><i class="cap__lamp"></i>${esc(c.n)}</div>`).join("")}</div>`;

function face(c) {
  const media = c.art ? `<img class="face__art" src="${artUrl(c.art)}" alt="">` : `<div class="face__art face__art--none"></div>`;
  return `<div class="face f-${c.f || "C"}">
    ${media}
    <div class="face__head">
      <div class="face__title"><span class="face__name">${esc(c.n)}</span><span class="face__cost">${pips(c.cost)}</span></div>
      <div class="face__type">${esc(c.tl)}</div>
    </div>
    <div class="face__foot">
      ${c.rules ? `<p class="face__rules">${esc(c.rules)}</p>` : ""}
      <div class="face__base"><span class="face__kw">${esc(c.kw || "")}</span>${c.pt ? `<span class="face__pt tabular">${c.pt}</span>` : ""}</div>
    </div>
  </div>`;
}

function curve(values) {
  if (!values) return `<div class="curve__none">No deck list in the repo for this one yet — a curve is a count of a list, and inventing one would be the only lie on this screen.</div>`;
  const max = Math.max(...values);
  const label = (i) => `${i + 1}${i === 6 ? "+" : ""}`;
  const cols = values.map((v, i) => `<span class="curve__bar" style="height:${Math.round((v / max) * 100)}%" title="${v} cards at ${label(i)} mana"></span>`).join("");
  const axis = values.map((v, i) => `<span class="curve__n tabular">${label(i)}</span>`).join("");
  return `<div class="curve"><div class="curve__cols">${cols}</div><div class="curve__axis">${axis}</div></div>`;
}

function engineBadge(deck) {
  if (deck.engine === "preview") return `<span class="badge">Preview</span>`;
  if (deck.engine === "partial") return `<span class="badge badge--partial">${deck.unsupported} unsupported</span>`;
  return "";
}

  q: "", colours: [], src: "all", sort: "name",
  imp: { status: "idle", url: "", msg: "" },
  custom: null,
  starting: false,
  copied: null,
};

const allDecks = () => (state.custom ? DECKS.concat([state.custom]) : DECKS.slice());
const deckById = (id) => allDecks().find((d) => d.id === id) || null;
const myDeck = () => deckById(state.seats[0].deckId);

/* Seats ------------------------------------------------------------------ */

let joinToken = 0;

const filled = () => state.seats.filter((s) => s.kind !== "empty");
const podSize = () => filled().length;
const openSeats = () => state.seats.filter((s) => s.kind === "open").length;
const roomLive = () => state.seats.some((s) => s.kind === "open" || s.kind === "human");

function seatReady(s) {
  if (s.kind === "empty") return false;
  if (s.kind === "cpu") return true;
  if (s.kind === "open") return state.fillCpu;
  return !!s.ready;
}
const allReady = () => filled().every(seatReady);
const canStart = () => {
  const d = myDeck();
  return !!d && d.engine !== "preview" && podSize() >= 2 && allReady() && state.seats[0].ready;
};

const seatTier = (i) => tierOf(state.seats[i].tier || state.difficulty);

function firstEmpty() {
  for (let i = 1; i < state.seats.length; i += 1) if (state.seats[i].kind === "empty") return i;
  return -1;
}

function addCpu(i) {
  const at = i == null ? firstEmpty() : i;
  if (at < 1) return;
  state.seats[at] = { kind: "cpu", tier: state.difficulty };
}

function openChair(i) {
  const at = i == null ? firstEmpty() : i;
  if (at < 1) return;
  state.seats[at] = { kind: "open" };
  state.invite = true;
  const guest = POD.guests[(at - 1) % POD.guests.length];
  const token = ++joinToken;
  setTimeout(() => {
    if (token !== joinToken || state.seats[at].kind !== "open") return;
    state.seats[at] = { kind: "human", name: guest.name, deckId: guest.deckId, ready: false };
    render();
    setTimeout(() => {
      if (token !== joinToken || state.seats[at].kind !== "human") return;
      state.seats[at].ready = true;
      render();
    }, POD.readyMs - POD.joinMs);
  }, POD.joinMs);
}

function seatDeck(i) {
  const s = state.seats[i];
  if (s.kind === "empty" || s.kind === "open") return null;
  if (s.kind === "you") return myDeck();
  if (s.kind === "human") return s.ready ? deckById(s.deckId) : null;
  if (s.deckId) return deckById(s.deckId);
  const taken = new Set([
    state.seats[0].deckId,
    ...state.seats.filter((x) => x.kind === "human" && x.ready).map((x) => x.deckId),
    ...state.seats.filter((x) => x.kind === "cpu" && x.deckId).map((x) => x.deckId),
  ]);
  const live = DECKS.filter((d) => d.engine !== "preview");
  const pool = live.filter((d) => !taken.has(d.id));
  const chosen = pool.length ? pool : live;
  return chosen[(i * 7) % chosen.length];
}

function seatLabel(i) {
  const s = state.seats[i];
  if (s.kind === "you") return { title: "You", sub: s.ready ? "Locked in" : "Choosing" };
  if (s.kind === "open") return { title: "Open chair", sub: "Waiting for a player" };
  if (s.kind === "human") return { title: s.name, sub: s.ready ? "Locked in" : "Choosing a deck…" };
  if (s.kind === "empty") return { title: "Empty seat", sub: "Nobody here" };
  const t = seatTier(i);
  return { title: t.n, sub: t.tag };
}

/* The catalogue ---------------------------------------------------------- */

function visibleDecks() {
  const q = state.q.trim().toLowerCase();
  let list = allDecks().filter((d) => {
    if (state.src !== "all" && d.source !== state.src) return false;
    if (state.colours.length && !state.colours.every((c) => d.ci.includes(c))) return false;
    if (!q) return true;
    return (d.name + " " + d.cmd.n + " " + d.guild + " " + d.tags.join(" ")).toLowerCase().includes(q);
  });
  const s = SORTS.find((x) => x.id === state.sort);
  list = list.slice().sort((a, b) => {
    if (state.sort === "name") return a.name.localeCompare(b.name);
    const d = b.bars[state.sort] - a.bars[state.sort];
    return (s && s.invert ? -d : d) || a.name.localeCompare(b.name);
  });
  return list;
}

function why() {
  const d = myDeck();
  if (!d) return "Pick a deck to take your seat.";
  if (d.engine === "preview") return "This deck has no list in the engine yet, so it cannot be dealt.";
  if (podSize() < 2) return "A pod needs at least one opponent. Add a CPU or invite somebody.";
  if (!state.seats[0].ready) return "Your seat is not locked in yet.";
  const waiting = state.seats
    .map((s, i) => ({ s, i }))
    .filter(({ s }) => s.kind !== "empty" && !seatReady(s))
    .map(({ i }) => seatLabel(i).title);
  if (waiting.length) return `Waiting on ${waiting.join(" and ")}.`;
  if (openSeats()) return `${openSeats()} chair${openSeats() > 1 ? "s" : ""} still open — a CPU will fill ${openSeats() > 1 ? "them" : "it"}.`;
  return `${podSize()} seats, everybody in. Deal them.`;
}

/* Views ------------------------------------------------------------------ */

function home() {
  return `<div class="door" data-testid="home">
    <div class="hero">
      <h1 class="hero__mark">Snap Keep</h1>
      <div class="hero__rule"></div>
      <p class="hero__line">Commander is a four-player format, so setting a game up is three decisions in a fixed order: which deck you are holding, who is sitting with you, and whether everybody is ready. This takes them one at a time.</p>
      <div class="hero__acts">
        <button class="slab" data-act="create" data-testid="create-pod">Set up a game</button>
        <span class="or">or</span>
        <span class="join">
          <input class="join__in" id="code" type="text" value="${esc(state.joinCode)}" placeholder="Pod code" spellcheck="false" maxlength="9" aria-label="Pod code">
          <button class="join__go" data-act="join" data-testid="join-pod">Join</button>
        </span>
      </div>
      <div class="hero__cap">
        <b class="tabular">${DECKS.length}</b> decks, rated on one scale so choosing is a comparison
        <span>·</span>
        <span>import your own from Moxfield</span>
      </div>
    </div>
  </div>`;
}

/* Step 1 ----------------------------------------------------------------- */

function rate(v) {
  let s = "";
  for (let i = 1; i <= 4; i += 1) s += `<i class="rate__s${i <= v ? " rate__s--on" : ""}"></i>`;
  return `<span class="rate">${s}</span>`;
}

function stepDeck() {
  const list = visibleDecks();
  const chosen = state.seats[0].deckId;
  const { status, msg } = state.imp;
  let note = `<span class="imp__note">${esc(CUSTOM.hint)}</span>`;
  if (status === "fetching") note = `<span class="imp__note imp__note--busy">Reading the list…</span>`;
  if (status === "error") note = `<span class="imp__note imp__note--err">${esc(msg)}</span>`;
  if (status === "ready") note = `<span class="imp__note">Imported. ${CUSTOM.fake.unsupported} cards are not in the engine yet and were left out.</span>`;

  const row = (d) => `<div class="mrow${d.id === chosen ? " mrow--on" : ""}${d.engine === "preview" ? " mrow--off" : ""}" data-testid="deck-${d.id}">
    <button class="ring${d.id === chosen ? " ring--on" : ""}${d.engine === "preview" ? " ring--no" : ""}"
            data-act="pick" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}
            aria-label="Choose ${esc(d.name)}"></button>
    <span class="mname">
      <span class="mname__n">${esc(d.name)}</span>
      <span class="mname__s">${esc(subtitle(d))}</span>
    </span>
    <span class="mci">${ciPips(d.ci)}<span class="count tabular">${d.cards}</span></span>
    ${BAR_LABELS.map(([k]) => rate(d.bars[k])).join("")}
    <span>${engineBadge(d) || `<span class="count">In the engine</span>`}</span>
    <span class="msrc">${d.source === "yours" ? "Yours" : "Precon"}</span>
    <button class="mmore" data-act="dossier" data-id="${d.id}">Read it</button>
  </div>`;

  return `<div class="body" data-testid="deck-catalog">
    <div class="mhead">
      <span></span>
      <span class="mh">Deck</span>
      <span class="mh">Colours</span>
      ${BAR_LABELS.map(([, l]) => `<span class="mh mh--c">${esc(l === "Demands on you" ? "Demands" : l)}</span>`).join("")}
      <span class="mh">Engine</span>
      <span class="mh">Source</span>
      <span></span>
    </div>
    ${list.length ? list.map(row).join("")
      : `<div class="empty">Nothing matches that.<br>Clear a colour or two — the filter is an AND, so three colours means decks that play all three.</div>`}
    <div class="imp">
      <span class="imp__l">Import from Moxfield</span>
      <input class="imp__in" id="mox" type="text" value="${esc(state.imp.url)}" placeholder="${esc(CUSTOM.placeholder)}" spellcheck="false" aria-label="Moxfield deck link">
      <button class="btn" data-act="import">Fetch</button>
      ${note}
    </div>
  </div>`;
}

/* Step 2 ----------------------------------------------------------------- */

function seatRow(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  const you = i === 0;
  const lab = seatLabel(i);

  if (s.kind === "empty") {
    const n = podSize();
    return `<div class="srow srow--empty">
      <span class="srow__no">Seat ${i + 1}</span>
      <span class="srow__none"></span>
      <span class="srow__main">
        <span class="srow__who"><span class="srow__n">Empty</span><span class="srow__tag">nobody here yet</span></span>
        <p class="srow__line">A pod seats four. Both ways of filling a chair are offered together, because choosing between a CPU and a person is the multiplayer feature rather than a mode.</p>
      </span>
      <span class="srow__acts">
        <button class="btn" data-act="add-cpu" data-i="${i}" data-testid="opponents-${n}">Add a CPU</button>
        <button class="btn" data-act="open-chair" data-i="${i}">Invite a player</button>
      </span>
    </div>`;
  }

  const thumb = d ? `<img class="srow__art" src="${artUrl(d.cmd.art)}" alt="">` : `<span class="srow__none"></span>`;
  const deckLine = d
    ? `<span class="srow__deck">${esc(d.name)}</span>
       <span class="srow__meta">${ciPips(d.ci)}<span class="count tabular">${d.cards}</span>${engineBadge(d)}</span>`
    : `<span class="srow__deck srow__deck--sealed">${s.kind === "open" ? `Holding pod ${POD.code}` : "Deck sealed until they lock in"}</span>`;

  const lamps = s.kind === "cpu"
    ? `<span class="lamps">${CAPS.map((c) => `<span class="lamp${seatTier(i).caps.includes(c.id) ? " lamp--on" : ""}"><i class="lamp__d"></i>${esc(c.n)}</span>`).join("")}</span>`
    : "";

  const acts = you
    ? `<button class="btn" data-act="step" data-v="0" ${s.ready ? "disabled" : ""}>Change deck</button>
       <button class="btn" data-act="dossier" data-id="${s.deckId}">Read it</button>`
    : s.kind === "cpu"
      ? `<button class="btn" data-act="tier" data-i="${i}" data-dir="-1" title="Easier">◂</button>
         <button class="btn" data-act="tier" data-i="${i}" data-dir="1">Tougher ▸</button>
         <button class="btn" data-act="open-chair" data-i="${i}">Invite instead</button>
         <button class="btn" data-act="clear" data-i="${i}">Empty</button>`
      : s.kind === "open"
        ? `<button class="btn" data-act="invite">Share the code</button>
           <button class="btn" data-act="add-cpu" data-i="${i}">CPU instead</button>`
        : `<button class="btn" data-act="dossier" data-id="${s.ready ? s.deckId : ""}" ${s.ready ? "" : "disabled"}>Read their deck</button>
           <button class="btn" data-act="clear" data-i="${i}">Remove</button>`;

  return `<div class="srow${you ? " srow--you" : ""}">
    <span class="srow__no">Seat ${i + 1}${you ? " · you" : ""}</span>
    ${thumb}
    <span class="srow__main">
      <span class="srow__who"><span class="srow__n">${esc(lab.title)}</span><span class="srow__tag">${esc(lab.sub)}</span></span>
      ${deckLine}
      ${lamps}
    </span>
    <span class="srow__acts">${acts}</span>
  </div>`;
}

function stepPod() {
  return `<div class="body">
    <div class="podbar">
      <span class="podbar__l">Pod code</span>
      <b class="podbar__v tabular">${POD.code}</b>
      <button class="btn" data-act="copy" data-what="code">${state.copied === "code" ? "Copied" : "Copy"}</button>
      <button class="btn" data-act="invite">Invite a player</button>
      <span class="podbar__spacer"></span>
      <span class="podbar__note">${roomLive()
        ? "A joined player's list stays sealed until they lock in — scouting before mulligans is what a lobby hides."
        : "Nobody has been invited yet. A pod of CPUs and a pod of people are the same screen."}</span>
    </div>
    <div class="seats2">${state.seats.map((_, i) => seatRow(i)).join("")}</div>
  </div>`;
}

/* Step 3 ----------------------------------------------------------------- */

function stepReady() {
  const d = myDeck();
  const locked = state.seats[0].ready;
  const line = (i) => {
    const s = state.seats[i];
    const sd = seatDeck(i);
    const lab = seatLabel(i);
    const dot = s.kind === "empty" ? "dot--none" : seatReady(s) ? "dot--on" : "dot--wait";
    return `<div class="rline">
      ${sd ? `<img class="rline__art" src="${artUrl(sd.cmd.art)}" alt="">` : `<span class="rline__none"></span>`}
      <span>
        <span class="rline__n">${esc(lab.title)}</span>
        <span class="rline__s">${sd ? esc(sd.name) : s.kind === "human" ? "deck sealed" : s.kind === "open" ? `holding pod ${POD.code}` : esc(lab.sub)}</span>
      </span>
      <span class="rline__st"><i class="dot ${dot}"></i>${s.kind === "empty" ? "Empty" : seatReady(s) ? "Ready" : "Waiting"}</span>
    </div>`;
  };

  return `<div class="body">
    <div class="ready">
      <div class="ready__card">
        ${d ? face(d.cmd) : ""}
        <div class="ready__artist">${d ? `Art: ${esc(d.cmd.artist)}` : ""}</div>
        <button class="btn" data-act="step" data-v="0" ${locked ? "disabled" : ""}>Change deck</button>
      </div>
      <div style="min-width:0">
        <h3 class="ready__h">You are holding</h3>
        <div class="rline">
          ${d ? `<img class="rline__art" src="${artUrl(d.cmd.art)}" alt="">` : `<span class="rline__none"></span>`}
          <span>
            <span class="rline__n">${d ? esc(d.name) : "No deck"}</span>
            <span class="rline__s">${d ? esc(subtitle(d)) : "pick one in step one"}</span>
          </span>
          <span class="rline__st"><i class="dot ${locked ? "dot--on" : "dot--wait"}"></i>${locked ? "Locked in" : "Not locked"}</span>
        </div>
        ${d ? `<div class="ready__block ready__bars">${bars(d.bars)}</div>` : ""}

        <div class="ready__block">
          <h3 class="ready__h">The pod</h3>
          <div class="ready__list">${[1, 2, 3].map(line).join("")}</div>
        </div>

        <div class="ready__block">
          <h3 class="ready__h">Lock in</h3>
          <button class="${locked ? "btn" : "slab"}" data-act="lock" data-testid="lock-in" ${!d || d.engine === "preview" ? "disabled" : ""}>
            ${locked ? "Unlock my seat" : "Lock in my seat"}
          </button>
          <p class="note">Nothing is dealt until every seat in the pod has locked in, yours included. The host is not privileged in readiness — only in pressing the last button.</p>
        </div>
      </div>
    </div>
  </div>`;
}

/* Shell ------------------------------------------------------------------ */

function ladder() {
  return `<span class="steps">${STEPS.map(([id, n], i) => {
    const cls = i === state.step ? " step--on" : i < state.step ? " step--done" : "";
    const bar = i > 0 ? `<i class="step__bar${i <= state.step ? " step__bar--done" : ""}"></i>` : "";
    return `${bar}<button class="step${cls}" data-act="step" data-v="${i}">
      <span class="step__n">${i + 1}</span><span class="step__t">${esc(n)}</span>
    </button>`;
  }).join("")}</span>`;
}

function subbar() {
  if (state.step === 0) {
    const list = visibleDecks();
    return `<div class="sub">
      <span class="filters">
        <label class="search">
          <span class="search__g">⌕</span>
          <input class="search__i" id="q" type="text" value="${esc(state.q)}" placeholder="Search decks, commanders, archetypes" spellcheck="false" aria-label="Search decks">
        </label>
        <span class="fgroup">
          <span class="fgroup__l">Colours</span>
          ${COLOURS.map(([c, n]) => `<button class="cbtn cbtn--${c}${state.colours.includes(c) ? " cbtn--on" : ""}" data-act="colour" data-c="${c}" title="${n}" aria-pressed="${state.colours.includes(c)}">${c}</button>`).join("")}
          ${state.colours.length ? `<button class="link" data-act="colour-clear">clear</button>` : ""}
        </span>
        <span class="seg">
          ${[["all", "All"], ["precon", "Precons"], ["yours", "Yours"]].map(([id, n]) =>
            `<button class="seg__b${state.src === id ? " seg__b--on" : ""}" data-act="src" data-v="${id}">${n}</button>`).join("")}
        </span>
        <select class="sel" id="sort" name="sort" data-act="sort" aria-label="Sort decks">
          ${SORTS.map((s) => `<option value="${s.id}"${state.sort === s.id ? " selected" : ""}>Sort: ${s.n}</option>`).join("")}
        </select>
      </span>
      <span class="sub__spacer"></span>
      <span class="sub__n tabular">${list.length} of ${allDecks().length}</span>
    </div>`;
  }
  if (state.step === 1) {
    return `<div class="sub">
      <span class="sub__t">Every seat sets its own difficulty, so a pod can be one Apprentice and one Archmage.</span>
      <span class="sub__spacer"></span>
      <span class="sub__n tabular">${podSize()} of 4 seats filled</span>
    </div>`;
  }
  return `<div class="sub">
    <span class="sub__t">Read it back, lock in, and deal.</span>
    <span class="sub__spacer"></span>
    <span class="sub__n tabular">${filled().filter(seatReady).length} of ${podSize()} ready</span>
  </div>`;
}

function foot() {
  const last = state.step === STEPS.length - 1;
  return `<div class="foot">
    <button class="ghost" data-act="step" data-v="${state.step - 1}" ${state.step === 0 ? "disabled" : ""}>◂ Back</button>
    <button class="ghost" data-act="leave">Start over</button>
    <span class="foot__spacer"></span>
    <p class="foot__why">${esc(why())}</p>
    ${last
      ? `<button class="slab" data-act="start" data-testid="start-game" ${canStart() && !state.starting ? "" : "disabled"}>${state.starting ? "Shuffling…" : "Deal the pod"}</button>`
      : `<button class="slab" data-act="step" data-v="${state.step + 1}">Next ▸</button>`}
  </div>`;
}

function wizard() {
  const inner = state.step === 0 ? stepDeck() : state.step === 1 ? stepPod() : stepReady();
  return `<div class="wiz" data-testid="new-game">
    <header class="top">
      <span><b class="brand__mark">Snap Keep</b><span class="brand__sub">Set up a game</span></span>
      <span class="top__spacer"></span>
      ${ladder()}
      <span class="top__spacer"></span>
      <button class="ghost" data-act="step" data-v="2">Skip to the last step ▸</button>
    </header>
    ${subbar()}
    ${inner}
    ${foot()}
  </div>`;
}

function dossier() {
  if (!state.open) return "";
  const d = deckById(state.open);
  if (!d) return "";
  const sigs = d.signature.length
    ? `<div class="dos__sigs">${d.signature.map((s) => `<div class="sig">
        <img class="sig__art" src="${artUrl(s.art)}" alt="">
        <div><div class="sig__n">${esc(s.n)}</div><div class="sig__why">${esc(s.why)}</div></div>
      </div>`).join("")}</div>`
    : `<p class="dos__p">No editorial notes for this one. Picking three cards to call defining would mean picking them out of a list this repo has not built yet.</p>`;
  const honesty = d.engine === "preview"
    ? `<div class="note">Preview. This commander needs a rules feature the engine does not implement, so the deck cannot be dealt. It is in the catalogue because the catalogue has to be able to show it first.</div>`
    : d.engine === "partial"
      ? `<div class="note">${d.unsupported} of the imported cards use rules the engine does not implement and were dropped from the list.</div>`
      : d.swapNote
        ? `<div class="note">${esc(d.swapNote)}</div>`
        : `<div class="note">Real card, real oracle text, real art. The ratings and the write-up are editorial; the deck list itself arrives with the roadmap's All Card Support work.</div>`;

  return `<div class="veil" data-act="close"></div>
  <aside class="over" role="dialog" aria-modal="true" aria-label="${esc(d.name)}">
    <div class="over__head">
      <span class="over__n">${esc(d.name)}</span>
      ${ciPips(d.ci)}
      <span class="count tabular">${d.cards} cards</span>
      ${engineBadge(d)}
      <button class="over__x" data-act="close" aria-label="Close">✕</button>
    </div>
    <div class="over__body">
      <div class="dos__top">
        <div class="dos__card">
          ${face(d.cmd)}
          <div class="dos__artist">Art: ${esc(d.cmd.artist)}</div>
        </div>
        <div style="min-width:0">
          <h3 class="dos__h">The deck</h3>
          <p class="dos__p">${esc(d.blurb)}</p>
          <h3 class="dos__h">Playstyle</h3>
          <div class="dos__tags">${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
          <div class="dos__bars">${bars(d.bars)}</div>
        </div>
      </div>
      <h3 class="dos__h">How it plays</h3>
      <p class="dos__p">${esc(d.strategy)}</p>
      <h3 class="dos__h">Cards that define it</h3>
      ${sigs}
      <h3 class="dos__h">Mana curve</h3>
      ${curve(d.curve)}
      ${honesty}
    </div>
    <div class="over__foot">
      <button class="slab" data-act="pick-close" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>Take this deck</button>
      <button class="ghost" data-act="close">Close</button>
    </div>
  </aside>`;
}

function invite() {
  if (!state.invite) return "";
  const open = openSeats();
  return `<div class="veil" style="z-index:465" data-act="invite-close"></div>
  <section class="inv" role="dialog" aria-modal="true" aria-label="Invite a player">
    <div class="inv__head">
      <span class="inv__t">Invite a player</span>
      <button class="inv__x" data-act="invite-close" aria-label="Close">✕</button>
    </div>
    <div class="inv__body">
      <div>
        <div class="inv__l">Pod code</div>
        <div class="inv__code">
          <b class="inv__codev tabular">${POD.code}</b>
          <button class="btn" data-act="copy" data-what="code">${state.copied === "code" ? "Copied" : "Copy"}</button>
        </div>
      </div>
      <div>
        <div class="inv__l">Or send the link</div>
        <div class="inv__code">
          <span class="inv__linkv">${esc(POD.link)}</span>
          <button class="btn" data-act="copy" data-what="link">${state.copied === "link" ? "Copied" : "Copy"}</button>
        </div>
      </div>
      <p class="inv__note">${open
        ? `${open} chair${open > 1 ? "s are" : " is"} open and holding this code. Whoever arrives picks their own deck, and their list stays sealed until they lock in.`
        : "No chair is open yet. Open one and it will hold this code until somebody takes it."}</p>
    </div>
    <div class="inv__foot">
      ${open
        ? `<button class="btn btn--wide" data-act="invite-close">Back to the pod</button>`
        : `<button class="btn btn--wide" data-act="open-chair">Open a chair</button>`}
    </div>
  </section>`;
}

function render() {
  root.innerHTML = (state.route === "home" ? home() : wizard()) + dossier() + invite();
}

/* Behaviour -------------------------------------------------------------- */

root.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "mox") { state.imp.url = e.target.value; return; }
  if (id === "code") { state.joinCode = e.target.value.toUpperCase(); return; }
  if (id === "q") {
    state.q = e.target.value;
    render();
    const box = document.getElementById("q");
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
});

root.addEventListener("change", (e) => {
  if (e.target.dataset.act === "sort") { state.sort = e.target.value; render(); }
});

function runImport() {
  const url = state.imp.url.trim();
  if (!/^https?:\/\/(www\.)?moxfield\.com\/decks\/\S+/i.test(url)) {
    state.imp = { status: "error", url, msg: CUSTOM.errors.badUrl };
    render();
    return;
  }
  state.imp = { status: "fetching", url, msg: "" };
  render();
  setTimeout(() => {
    state.custom = CUSTOM.fake;
    state.src = "yours";
    if (!state.seats[0].ready) state.seats[0].deckId = CUSTOM.fake.id;
    state.imp = { status: "ready", url, msg: "" };
    render();
  }, 700);
}

function pick(id) {
  const d = deckById(id);
  if (!d || d.engine === "preview") return;
  if (!state.seats[0].ready) state.seats[0].deckId = id;
}

root.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-act]");
  if (!hit) return;
  const act = hit.dataset.act;
  const i = hit.dataset.i != null ? Number(hit.dataset.i) : null;

  switch (act) {
    case "create": state.route = "wizard"; state.step = 0; break;
    case "join":
      state.route = "wizard"; state.step = 0;
      state.seats[1] = { kind: "human", name: POD.guests[0].name, deckId: POD.guests[0].deckId, ready: true };
      state.seats[2] = { kind: "cpu", tier: "duelist" };
      break;
    case "leave":
      state.route = "home"; state.step = 0;
      joinToken += 1;
      state.seats = [{ kind: "you", deckId: state.seats[0].deckId, ready: false }, { kind: "empty" }, { kind: "empty" }, { kind: "empty" }];
      state.invite = false;
      break;
    case "step": {
      const v = Number(hit.dataset.v);
      if (v < 0 || v >= STEPS.length) return;
      state.step = v;
      break;
    }

    case "add-cpu": addCpu(i); break;
    case "open-chair": openChair(i); break;
    case "clear": joinToken += 1; state.seats[i] = { kind: "empty" }; break;
    case "tier": {
      const dir = Number(hit.dataset.dir);
      const at = DIFFICULTY.findIndex((t) => t.id === (state.seats[i].tier || state.difficulty));
      state.seats[i].tier = DIFFICULTY[Math.min(DIFFICULTY.length - 1, Math.max(0, at + dir))].id;
      break;
    }

    case "pick": pick(hit.dataset.id); break;
    case "pick-close": pick(hit.dataset.id); state.open = null; break;
    case "dossier":
      if (!hit.dataset.id) return;
      e.stopPropagation();
      state.open = hit.dataset.id;
      break;
    case "close": state.open = null; break;

    case "colour": {
      const c = hit.dataset.c;
      state.colours = state.colours.includes(c) ? state.colours.filter((x) => x !== c) : state.colours.concat([c]);
      break;
    }
    case "colour-clear": state.colours = []; break;
    case "src": state.src = hit.dataset.v; break;
    case "import": runImport(); return;

    case "lock": state.seats[0].ready = !state.seats[0].ready; break;
    case "fill": state.fillCpu = !state.fillCpu; break;
    case "invite": state.invite = true; break;
    case "invite-close": state.invite = false; break;
    case "copy":
      state.copied = hit.dataset.what;
      setTimeout(() => { state.copied = null; render(); }, 1400);
      break;

    case "start":
      state.starting = true;
      render();
      setTimeout(() => { state.starting = false; render(); }, 1700);
      return;

    default: return;
  }
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.open) { state.open = null; render(); return; }
    if (state.invite) { state.invite = false; render(); return; }
  }
  if (e.key === "Enter" && e.target.id === "code") { state.route = "wizard"; state.step = 0; render(); return; }
});

render();
</script>
</body>
</html>
