<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap Keep — The Room (flow 05)</title>
<style>
/* ============================================================================
   THE ROOM -- the front door is a cover, and the lobby is a place you sit in
   ----------------------------------------------------------------------------
   THESIS. A lobby has no gameplay to carry it, which is exactly why it can
   afford to be the most atmospheric surface in the application. This one is not
   a screen with seats on it; it is a room with a table in it, seen from your
   chair. The far seats are across the table, the pod code is printed on a
   placard standing on the felt, and your own seat is the near edge with your
   commander face-up on it.

   THE BIG IDEA, stealable on its own: THE ROOM TAKES YOUR DECK'S COLOUR, AND
   THE COLOUR CARRIES NOTHING. This is 05-planar-gate.html's idea with its
   verdict applied. That mockup set two custom properties from the selected
   deck's colour identity and let them drive the wash, the accents, the lit seal
   AND the selected frame -- and its greyscale twin was the honest argument
   against it, because the one thing it spent itself on was the one thing a
   player who cannot use colour does not receive.

   Here the tint drives the wash and nothing else. Every fact -- whose seat this
   is, which colours a deck plays, locked or not, dealable or not -- is carried
   by shape, weight, a lettered pip or a word. Press `g`: the room loses its
   mood and loses nothing else. That is the difference between atmosphere and
   information, and it is the whole reason this direction is in the round twice.

   SECOND IDEA: THE CODE IS AN OBJECT. An invite code typeset in a field is a
   string you have to be told to share. A placard standing on the table is a
   thing three empty chairs are looking at.

   THE TRADE. Highest port cost of the five. Text sits over uncontrolled art
   luminance, which is the same bet 05-planar-art.html made on the board and it
   needs the same scrims to survive. And it obeys the 1.25x rule the hard way:
   the wall is blurred on purpose at 4x and carries no detail, every seat's art
   box is capped so a 626px crop is never stretched past it, and the only crisp
   picture in the room is a card at 0.3x.

   Press `g` for greyscale. No build, no server, no network. Local ../art/ only.
   ========================================================================== */

/* Tokens ----------------------------------------------------------------- */

:root {
  --void-0:#0b0a16; --void-1:#141328; --void-2:#1d1b38;
  --edge:rgba(150,140,255,.18); --edge-hi:rgba(174,166,255,.32);
  --astral-hi:#c3b6ff;

  --pane-bg:rgba(18,17,36,.72); --pane-well:rgba(11,10,24,.82);

  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-ink:#1a1a1a;

  --danger:#ff5c5c; --gold:#ffd479; --live:#5ce08a;
  --text:#e9e6f7; --text-dim:#a9a4cd; --text-faint:#736e99;

  /* Set per selected deck. They reach the wall and the table glow and stop
     there -- deliberately, and the greyscale twin is the proof. */
  --tint-a:#5a4fa8; --tint-b:#2c6c8e;

  --card-w:clamp(128px, 18vh, 176px);
  --card-r:calc(var(--card-w) * .055);
  --font:"Segoe UI", Inter, system-ui, sans-serif;
}

.f-W { --f-hi:#f6eed4; --f-lo:#b9ad86; --fb:#d8cfa8; }
.f-U { --f-hi:#a9d2ec; --f-lo:#2f6a95; --fb:#4a86b8; }
.f-B { --f-hi:#b6aeac; --f-lo:#2e282b; --fb:#4c4550; }
.f-R { --f-hi:#f0a48b; --f-lo:#a4432f; --fb:#b8624a; }
.f-G { --f-hi:#a9cfa2; --f-lo:#2f6b41; --fb:#4e8a5c; }
.f-C { --f-hi:#d3d6da; --f-lo:#787e86; --fb:#8a8f96; }
.f-gold { --f-hi:#eed99c; --f-lo:#9c7a24; --fb:#b99a45; }

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
html.grey { filter:grayscale(1); }
body {
  background:var(--void-0);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
.tabular { font-variant-numeric:tabular-nums; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--edge); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* THE WALL ---------------------------------------------------------------- */

.room { position:relative; height:100%; overflow:hidden; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }

/* 626px of source across 2560px of viewport is a 4x upscale. It is allowed --
   and only allowed -- because it is blurred on purpose and carries no detail. */
.wall {
  position:absolute; inset:-8%; z-index:0; pointer-events:none;
  background-size:cover; background-position:50% 36%;
  filter:blur(38px) saturate(.9); opacity:.72;
}
.wall__tint {
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(76% 62% at 50% 30%, color-mix(in srgb, var(--tint-a) 62%, transparent) 0%, transparent 72%),
    radial-gradient(80% 58% at 50% 106%, color-mix(in srgb, var(--tint-b) 55%, transparent) 0%, transparent 66%),
    linear-gradient(158deg, color-mix(in srgb, var(--tint-a) 30%, transparent), color-mix(in srgb, var(--tint-b) 26%, transparent));
}
.wall__veil {
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(64% 54% at 50% 42%, rgba(8,7,18,.2) 0%, rgba(8,7,18,.62) 62%, rgba(8,7,18,.9) 100%),
    linear-gradient(180deg, rgba(8,7,18,.74) 0%, rgba(8,7,18,.1) 28%, rgba(8,7,18,.5) 74%, rgba(8,7,18,.94) 100%);
}

/* THE HEAD ---------------------------------------------------------------- */

.head { position:relative; z-index:4; display:flex; align-items:center; gap:14px; padding:14px 28px; }
.brand__mark { font-size:15px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
.brand__sub { font-size:11px; color:var(--text-faint); letter-spacing:.04em; margin-left:10px; }
.head__spacer { flex:1; }
.head__ver { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }

/* THE DOOR ---------------------------------------------------------------- */

.door__mid { position:relative; z-index:4; display:grid; place-items:center; min-height:0; padding:0 32px; }
.cover { display:grid; grid-template-columns:auto auto; gap:44px; align-items:center; }
.cover__card { display:grid; gap:9px; justify-items:center; --card-w:clamp(178px, 27vh, 296px); }
.cover__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.cover__text { max-width:520px; }
.hero__mark { margin:0; font-size:clamp(44px, 7vh, 74px); font-weight:800; line-height:1; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); text-shadow:0 0 44px rgba(255,212,121,.24); }
.hero__rule { width:74px; height:2px; margin:20px 0 16px; background:linear-gradient(90deg, var(--edge-hi), transparent); }
.hero__line { margin:0; font-size:15px; line-height:1.65; color:var(--text-dim); }
.hero__acts { display:flex; align-items:center; gap:14px; margin-top:30px; flex-wrap:wrap; }
.hero__cap { margin-top:26px; display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-faint); flex-wrap:wrap; }
.hero__cap b { color:var(--text-dim); font-weight:750; }

.big { padding:16px 32px; border-radius:12px; flex:none; background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05; font-size:16px; font-weight:800; letter-spacing:.04em; box-shadow:0 4px 0 #7d5310, 0 0 30px rgba(224,166,63,.26); }
.big:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 30px rgba(224,166,63,.26); }
.or { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
.join { display:flex; align-items:center; border:1px solid var(--edge-hi); border-radius:10px; background:rgba(8,7,18,.66); overflow:hidden; }
.join__in { width:148px; padding:14px; border:0; background:none; font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.join__in::placeholder { color:var(--text-faint); font-weight:600; letter-spacing:.1em; }
.join__in:focus { outline:none; }
.join:focus-within { border-color:var(--gold); }
.join__go { padding:14px 18px; border-left:1px solid var(--edge-hi); color:var(--text-dim); font-size:13px; font-weight:700; }
.join__go:hover { color:var(--text); }
.link { color:var(--text-dim); text-decoration:underline; text-underline-offset:3px; font-size:11.5px; }
.link:hover { color:var(--text); }

/* THE FLOOR --------------------------------------------------------------- */

.floor {
  position:relative; z-index:4; min-height:0; display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  grid-template-rows:auto minmax(0,1fr);
  gap:14px 20px; padding:6px 34px 0; align-content:start;
}
/* The table. Its far edge runs behind the far seats and its near edge runs off
   the bottom of the room, into the strip where you are sitting. */
.felt {
  position:absolute; z-index:-1; left:50%; transform:translateX(-50%);
  top:38%; bottom:-46%; width:min(1560px, 96%); pointer-events:none;
  border:1px solid var(--edge-hi); border-bottom:0; border-radius:50% 50% 0 0 / 34% 34% 0 0;
  background:
    radial-gradient(96% 70% at 50% 104%, color-mix(in srgb, var(--tint-b) 62%, transparent) 0%, color-mix(in srgb, var(--tint-a) 24%, transparent) 44%, transparent 78%),
    linear-gradient(180deg, rgba(42,39,80,.82), rgba(16,15,34,.3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 -20px 70px rgba(0,0,0,.4);
}

/* A far seat. Capped so a 626px crop is never stretched past ~1.25x. */
.pseat {
  position:relative; width:100%; max-width:400px; margin:0 auto; min-width:0; overflow:hidden;
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto;
  border:1px solid var(--edge); border-radius:14px;
  background:var(--pane-bg); backdrop-filter:blur(3px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 14px 40px rgba(0,0,0,.5);
}
.pseat--far { margin-top:26px; }
/* Status is a border STYLE and a stamp, never a hue. */
.pseat--open, .pseat--empty { border-style:dashed; border-color:var(--edge-hi); }
.pseat--ready { border-width:2px; border-color:var(--text-dim); }
.pseat__top { position:relative; }
.pseat__art { display:block; width:100%; height:clamp(88px, 15vh, 168px); object-fit:cover; object-position:50% 24%; }
.pseat__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.24) 0 7px, transparent 7px 14px), #443e34; }
.pseat__scrim { position:absolute; inset:0; pointer-events:none; background:linear-gradient(0deg, rgba(11,10,24,.96), rgba(11,10,24,.3) 58%, rgba(11,10,24,0)); }
.pseat__no { position:absolute; top:8px; left:11px; z-index:2; font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.84); text-shadow:0 1px 3px rgba(0,0,0,.9); }
.pseat__x { position:absolute; top:6px; right:6px; z-index:2; width:24px; height:24px; border-radius:999px; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.52); color:rgba(255,255,255,.75); font-size:12px; }
.pseat__x:hover { border-color:var(--danger); color:var(--danger); }
.pseat__stamp { position:absolute; z-index:2; bottom:8px; right:9px; padding:3px 9px; border-radius:4px; border:2px double rgba(255,255,255,.7); background:rgba(11,10,24,.75); font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.9); }
.pseat__hold { position:absolute; left:0; right:0; top:40%; z-index:2; text-align:center; pointer-events:none; font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.42); }
.pseat__deck { padding:10px 13px 0; }
.pseat__deckn { font-size:12.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pseat__deckn--sealed { color:var(--text-faint); font-style:italic; font-weight:600; }
.pseat__meta { display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; }
.pseat__body { padding:10px 13px 0; min-height:0; }
.pseat__who { display:flex; align-items:baseline; gap:8px; }
.pseat__n { font-size:14.5px; font-weight:800; }
.pseat__tag { font-size:10.5px; color:var(--text-faint); }
.pseat__line { margin:6px 0 0; font-size:11.5px; line-height:1.5; color:var(--text-dim); }
.caps { display:grid; gap:4px; margin-top:9px; }
.cap { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--text-faint); }
.cap--on { color:var(--text-dim); }
.cap__lamp { width:8px; height:8px; border-radius:999px; border:1px solid var(--edge-hi); flex:none; }
.cap--on .cap__lamp { background:var(--text-dim); border-color:var(--text-dim); }
.pseat__foot { display:flex; gap:6px; padding:11px 13px 13px; }
.pseat__foot .btn { flex:1; text-align:center; min-width:0; }
.pseat__fill { display:grid; gap:8px; align-content:center; justify-items:center; padding:32px 16px; text-align:center; color:var(--text-dim); }
.pseat__plus { font-size:26px; line-height:1; color:var(--text-faint); }
.pseat__ft { font-size:12.5px; font-weight:700; }
.pseat__fs { font-size:10.5px; color:var(--text-faint); line-height:1.45; }
.pseat__acts { display:grid; gap:6px; width:100%; max-width:220px; margin-top:4px; }

/* THE PLACARD -- the code as an object standing on the felt ---------------- */

.centre { grid-column:1 / -1; display:grid; place-items:center; min-height:0; padding:6px 0 0; }
.placard {
  position:relative; display:grid; justify-items:center; gap:5px; padding:14px 30px 15px;
  border:1px solid rgba(255,255,255,.2); border-radius:5px;
  background:linear-gradient(180deg, rgba(48,44,84,.9), rgba(20,18,42,.9));
  box-shadow:0 12px 26px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
  transform:perspective(600px) rotateX(16deg);
}
.placard::after {
  content:""; position:absolute; left:8%; right:8%; bottom:-13px; height:13px; border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent);
}
.placard__l { font-size:8.5px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.5); }
.placard__v { font-size:23px; font-weight:800; letter-spacing:.2em; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); }
.placard__acts { display:flex; gap:6px; margin-top:5px; }
.placard--none .placard__v { font-size:13px; letter-spacing:.04em; font-weight:600; color:rgba(255,255,255,.6); }

/* YOUR EDGE --------------------------------------------------------------- */

.near {
  position:relative; z-index:5; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 28px 15px; border-top:1px solid var(--edge-hi); background:rgba(8,7,18,.86);
}
.near__me { display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center; min-width:290px; }
/* An art band at its own aspect rather than a shrunken card face. A card face
   at 96px is a card face with unreadable rules text on it, which is worse than
   no card face -- the crisp card in this direction lives on the cover and in
   the dossier, at a size where its text is a size it was designed for. */
.near__art { width:78px; height:58px; border-radius:8px; object-fit:cover; object-position:50% 26%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.5); }
.near__art--none { background:repeating-linear-gradient(135deg, rgba(0,0,0,.24) 0 7px, transparent 7px 14px), #443e34; }
.near__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.near__n { font-size:15px; font-weight:800; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.near__meta { display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; }
.near__acts { display:flex; gap:7px; flex-wrap:wrap; }
.near__spacer { flex:1; }
.near__why { font-size:10.5px; line-height:1.45; color:var(--text-faint); max-width:32ch; }

.seated { display:grid; gap:6px; }
.seated__l { display:flex; align-items:center; gap:8px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.seated__n { color:var(--text-dim); }
.seated__t { display:flex; gap:5px; }
.seated__s { width:15px; height:15px; border-radius:999px; border:2px solid var(--edge-hi); }
.seated__s--on { background:var(--text); border-color:var(--text); }
.seated__s--wait { border-style:dashed; border-color:var(--text-dim); }
.seated__s--none { opacity:.32; }

.lock { padding:14px 24px; border-radius:11px; flex:none; border:1px solid var(--gold); color:var(--gold); font-size:13.5px; font-weight:800; letter-spacing:.03em; background:rgba(255,212,121,.08); }
.lock:hover { background:rgba(255,212,121,.17); }
.lock--on { border-color:var(--edge-hi); color:var(--text-faint); background:none; font-weight:600; font-size:12px; padding:11px 16px; }
.lock--on:hover { color:var(--text); }
.lock:disabled { opacity:.4; cursor:not-allowed; }

.play { padding:15px 28px; border-radius:11px; flex:none; background:linear-gradient(180deg,#ffd98c,#e0a63f 55%,#b87c1c); color:#1b0f05; font-size:15px; font-weight:800; letter-spacing:.04em; box-shadow:0 4px 0 #7d5310, 0 0 26px rgba(224,166,63,.26); }
.play:active { transform:translateY(2px); box-shadow:0 2px 0 #7d5310, 0 0 26px rgba(224,166,63,.26); }
.play:disabled { opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #4a3a18; }

/* THE CATALOGUE ----------------------------------------------------------- */

.veil { position:fixed; inset:0; z-index:420; background:rgba(5,4,14,.74); }
.cat { position:fixed; z-index:430; inset:0; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; min-height:0; background:linear-gradient(180deg,#151329,#08070f); }
.cat__head { display:flex; align-items:center; gap:12px; padding:16px 30px 14px; border-bottom:1px solid var(--edge); }
.cat__t { font-size:17px; font-weight:800; }
.cat__for { font-size:11.5px; color:var(--text-faint); }
.cat__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge-hi); color:var(--text-dim); flex:none; }
.cat__x:hover { color:var(--text); }

.filters { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:11px 30px; border-bottom:1px solid var(--edge); background:rgba(6,5,14,.4); }
.search { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--edge-hi); border-radius:9px; background:rgba(6,5,14,.7); min-width:250px; }
.search:focus-within { border-color:var(--gold); }
.search__i { flex:1; min-width:0; border:0; background:none; font-size:12.5px; }
.search__i:focus { outline:none; }
.search__i::placeholder { color:var(--text-faint); }
.search__g { color:var(--text-faint); font-size:12px; }
.fgroup { display:flex; align-items:center; gap:7px; }
.fgroup__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
.cbtn { width:26px; height:26px; border-radius:999px; display:grid; place-items:center; border:1px solid var(--edge-hi); font-size:11px; font-weight:800; color:var(--text-faint); }
.cbtn:hover { border-color:var(--text-dim); color:var(--text-dim); }
.cbtn--on { color:var(--mana-ink); border-color:transparent; box-shadow:inset 0 -1px 1px rgba(0,0,0,.25); }
.cbtn--on.cbtn--W { background:var(--mana-W); } .cbtn--on.cbtn--U { background:var(--mana-U); }
.cbtn--on.cbtn--B { background:var(--mana-B); } .cbtn--on.cbtn--R { background:var(--mana-R); }
.cbtn--on.cbtn--G { background:var(--mana-G); }
.seg { display:flex; border:1px solid var(--edge-hi); border-radius:8px; overflow:hidden; }
.seg__b { padding:7px 13px; font-size:11.5px; font-weight:650; color:var(--text-faint); border-right:1px solid var(--edge-hi); }
.seg__b:last-child { border-right:0; }
.seg__b:hover { color:var(--text); }
.seg__b--on { background:rgba(255,212,121,.14); color:var(--gold); }
.sel { padding:8px 11px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(6,5,14,.7); font-size:12px; color:var(--text-dim); }
.sel:focus { outline:none; border-color:var(--gold); }
.filters__spacer { flex:1; }
.filters__n { font-size:11.5px; color:var(--text-faint); }

.cat__body { min-height:0; overflow:auto; padding:18px 30px 22px; }
/* Capped at 300px so a 626px crop is never stretched. */
.wallgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:14px; }
.frame {
  position:relative; min-width:0; overflow:hidden; border-radius:13px; text-align:left; color:var(--text);
  border:1px solid var(--edge); background:var(--pane-well);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto;
}
.frame:hover { border-color:var(--edge-hi); }
.frame--on { border-width:2px; border-color:var(--text); }
.frame__top { position:relative; }
.frame__art { display:block; width:100%; height:128px; object-fit:cover; object-position:50% 22%; }
.frame__scrim { position:absolute; inset:0; pointer-events:none; background:linear-gradient(0deg, rgba(8,7,18,.94), rgba(8,7,18,.1) 62%, rgba(8,7,18,.35)); }

.frame__foot { display:flex; align-items:center; gap:8px; padding:9px 11px 10px; }

.empty { padding:52px 20px; text-align:center; color:var(--text-faint); font-size:13px; line-height:1.6; }

.over {
  position:fixed; z-index:460; right:0; top:0; bottom:0; width:min(660px, 96vw);

  box-shadow:-26px 0 70px rgba(0,0,0,.74);
}
.over__head { display:flex; align-items:center; gap:10px; padding:15px 18px 13px; border-bottom:1px solid var(--edge); }
.over__n { font-size:18px; font-weight:800; min-width:0; }
.over__x { margin-left:auto; width:28px; height:28px; border-radius:999px; border:1px solid var(--edge-hi); color:var(--text-dim); flex:none; }
.over__x:hover { color:var(--text); }
.over__body { min-height:0; overflow:auto; padding:16px 18px; }
.over__foot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--edge); }
.over__foot .play { padding:11px 22px; font-size:14px; }

.dos__top { display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; }
.dos__card { display:grid; gap:7px; justify-items:center; align-content:start; }
.dos__artist { font-size:9.5px; color:var(--text-faint); text-align:center; max-width:var(--card-w); }
.dos__h { margin:16px 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }

.dos__p { margin:0; font-size:12.5px; line-height:1.6; color:var(--text-dim); }
.dos__tags { display:flex; flex-wrap:wrap; gap:6px; }
.dos__bars { display:grid; gap:5px; margin-top:10px; }
.dos__sigs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:9px; }
.sig { display:grid; grid-template-columns:56px minmax(0,1fr); gap:9px; align-items:center; }
.sig__art { width:56px; height:44px; border-radius:5px; object-fit:cover; object-position:50% 30%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.45); }
.sig__n { font-size:11.5px; font-weight:700; }
.sig__why { font-size:10.5px; line-height:1.4; color:var(--text-faint); margin-top:2px; }

/* THE INVITE -------------------------------------------------------------- */

.inv {
  position:fixed; z-index:470; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(452px, 94vw); border:1px solid var(--edge-hi); border-radius:14px;

.inv__t { font-size:15px; font-weight:800; }
.inv__x { margin-left:auto; width:27px; height:27px; border-radius:999px; border:1px solid var(--edge-hi); color:var(--text-dim); }

.inv__body { padding:18px; display:grid; gap:14px; }
.inv__l { font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; }
.inv__code { display:flex; align-items:center; gap:10px; padding:14px 16px; border:1px solid var(--edge-hi); border-radius:11px; background:rgba(6,5,14,.7); }

.inv__note { margin:0; font-size:11.5px; line-height:1.55; color:var(--text-faint); }
.inv__foot { padding:0 18px 16px; }

/* Shared vocabulary ------------------------------------------------------- */

.btn { padding:8px 13px; border:1px solid var(--edge-hi); border-radius:8px; background:rgba(14,12,30,.6); color:var(--text); font-size:12px; font-weight:650; white-space:nowrap; }

.ghost { padding:9px 14px; border-radius:7px; color:var(--text-faint); font-size:13px; font-weight:500; }
.ghost:hover { color:var(--text); }

.pip { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:999px; font-size:10px; font-weight:800; font-style:normal; color:var(--mana-ink); box-shadow:inset 0 -1px 1px rgba(0,0,0,.25); }

.pip--G { background:var(--mana-G); } .pip--C { background:var(--mana-C); }

.badge { padding:2px 7px; border:1px dashed var(--edge-hi); border-radius:999px; font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); }

.bar { display:flex; align-items:center; gap:7px; }
.bar__label { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); min-width:88px; }
.bar--tiny .bar__label { min-width:72px; font-size:8.5px; letter-spacing:.05em; }
.bar__track { display:flex; gap:2px; }
.bar__seg { width:13px; height:5px; border-radius:2px; border:1px solid var(--edge-hi); background:transparent; }
.bar--tiny .bar__seg { width:11px; height:4px; }
.bar__seg--on { background:var(--text-dim); border-color:var(--text-dim); }

.face {
  position:relative; width:var(--card-w); aspect-ratio:1 / 1.4; overflow:hidden;

.face__head, .face__foot { position:relative; z-index:2; padding:6px 7px; }

.face__foot { background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,.71) 58%, rgba(0,0,0,0)); }
.face__title { display:flex; align-items:flex-start; gap:5px; }
/* min-width:0 and a wrapping cost row. Without them a six-pip cost like The
   Ur-Dragon's pushes .face__head past the card at small --card-w, which the
   card clips but which is still the escape failure the menu round documented. */
.face__name { flex:1; min-width:0; font-size:11px; font-weight:750; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.85); overflow-wrap:anywhere; }
.face__cost { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:2px; flex:none; max-width:56%; }
.face__type { margin-top:3px; font-size:8.5px; color:rgba(255,255,255,.86); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__rules { margin:0 0 5px; font-size:8.5px; line-height:1.38; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.85); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.face__base { display:flex; align-items:flex-end; gap:6px; }
.face__kw { flex:1; font-size:8.5px; font-weight:700; color:rgba(255,255,255,.9); text-shadow:0 1px 2px rgba(0,0,0,.85); }
.face__pt { font-size:12px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.9); }

.curve__cols { display:flex; align-items:flex-end; gap:4px; height:54px; }
.curve__bar { flex:1; background:var(--text-faint); border-radius:2px 2px 0 0; min-height:2px; }
.curve__axis { display:flex; gap:4px; margin-top:4px; }
.curve__n { flex:1; text-align:center; font-size:9px; color:var(--text-faint); }
.curve__none { padding:13px; border:1px dashed var(--edge-hi); border-radius:9px; font-size:11.5px; line-height:1.5; color:var(--text-faint); text-align:center; }
.note { margin-top:8px; padding:10px 12px; border-left:2px solid var(--edge-hi); border-radius:0 7px 7px 0; background:rgba(11,10,24,.55); font-size:11.5px; line-height:1.55; color:var(--text-faint); }
</style>

    curve: null, signature: [], engine: "playable", swaps: 0, swapNote: null },
];

const CUSTOM = {
  placeholder: "https://moxfield.com/decks/...",
  hint: "Paste a public Moxfield deck link.",
  fake: {
    id: "custom-vorel", name: "Vorel of the Hull Clade", short: "Vorel",
    ci: ["G", "U"], guild: "Simic", cards: 100, lands: 36, source: "yours",
    cmd: { n: "Vorel of the Hull Clade", cost: "1GU", tl: "Legendary Creature — Human Merfolk",
      t: "creature", f: "gold", pt: "1/4",
      rules: "{1}{G}{U}, {T}: Double the number of each kind of counter on target artifact, creature, or land you control.",
      art: "vorel-of-the-hull-clade", artist: "Mike Bierek" },
    tags: ["Counters", "Ramp", "Combo"],
    blurb: "Imported from Moxfield. Simic +1/+1 counters, doubled.",
    strategy: "Imported decks have no editorial write-up — this is whatever you built.",
    bars: { speed: 2, complexity: 4, interaction: 2, resilience: 2, pilot: 4 },
    curve: [8, 15, 16, 12, 6, 4, 3],
    signature: [], engine: "partial", unsupported: 12, swaps: 0, swapNote: null,
  },
  errors: {
    badUrl: "That is not a Moxfield deck link.",
    private: "That deck is private. Set it to public and try again.",
  },
};

const POD = {
  code: "GYRE-8412",
  link: "snapkeep.app/j/GYRE-8412",
  guests: [{ name: "Priya", deckId: "edgar" }, { name: "Marco", deckId: "krenko" }],
  joinMs: 1200,
  readyMs: 2600,
};

const ART_NATIVE = { w: 626, h: 457 };

/* Primitives (shared with the other four flow mockups) ------------------- */

const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const artUrl = (slug) => "../art/" + slug + ".jpg";

function pips(cost) {
  if (!cost) return "";
  const out = []; let num = "";
  for (const ch of String(cost)) {
    if (ch >= "0" && ch <= "9") { num += ch; continue; }
    if (num) { out.push(`<i class="pip pip--C">${num}</i>`); num = ""; }
    out.push(`<i class="pip pip--${ch}">${ch}</i>`);
  }
  if (num) out.push(`<i class="pip pip--C">${num}</i>`);
  return out.join("");
}
const ciPips = (ci) => ci.map((c) => `<i class="pip pip--${c}">${c}</i>`).join("");

function bar(label, value, tiny) {
  let segs = "";
  for (let i = 1; i <= 4; i += 1) segs += `<i class="bar__seg${i <= value ? " bar__seg--on" : ""}"></i>`;
  return `<div class="bar${tiny ? " bar--tiny" : ""}"><span class="bar__label">${esc(label)}</span><span class="bar__track">${segs}</span></div>`;
}
const bars = (b) => BAR_LABELS.map(([k, l]) => bar(l, b[k])).join("");
const tierOf = (id) => DIFFICULTY.find((d) => d.id === id) || DIFFICULTY[1];
const subtitle = (d) => (d.cmd.n === d.name ? `${d.guild} · ${d.tags[0].toLowerCase()}` : d.cmd.n);

/** The capability list, written out. The ladder is a promise about behaviour,
 *  so the seat states the behaviour rather than an adjective. */
const capList = (caps) => `<div class="caps">${CAPS.map((c) => `
  <div class="cap${caps.includes(c.id) ? " cap--on" : ""}"><i class="cap__lamp"></i>${esc(c.n)}</div>`).join("")}</div>`;

function face(c) {
  const media = c.art ? `<img class="face__art" src="${artUrl(c.art)}" alt="">` : `<div class="face__art face__art--none"></div>`;
  return `<div class="face f-${c.f || "C"}">
    ${media}
    <div class="face__head">
      <div class="face__title"><span class="face__name">${esc(c.n)}</span><span class="face__cost">${pips(c.cost)}</span></div>
      <div class="face__type">${esc(c.tl)}</div>
    </div>
    <div class="face__foot">
      ${c.rules ? `<p class="face__rules">${esc(c.rules)}</p>` : ""}
      <div class="face__base"><span class="face__kw">${esc(c.kw || "")}</span>${c.pt ? `<span class="face__pt tabular">${c.pt}</span>` : ""}</div>
    </div>
  </div>`;
}

function curve(values) {
  if (!values) return `<div class="curve__none">No deck list in the repo for this one yet — a curve is a count of a list, and inventing one would be the only lie on this screen.</div>`;
  const max = Math.max(...values);
  const label = (i) => `${i + 1}${i === 6 ? "+" : ""}`;
  const cols = values.map((v, i) => `<span class="curve__bar" style="height:${Math.round((v / max) * 100)}%" title="${v} cards at ${label(i)} mana"></span>`).join("");
  const axis = values.map((v, i) => `<span class="curve__n tabular">${label(i)}</span>`).join("");
  return `<div class="curve"><div class="curve__cols">${cols}</div><div class="curve__axis">${axis}</div></div>`;
}

function engineBadge(deck) {
  if (deck.engine === "preview") return `<span class="badge">Preview</span>`;
  if (deck.engine === "partial") return `<span class="badge badge--partial">${deck.unsupported} unsupported</span>`;
  return "";
}

/* The tint ---------------------------------------------------------------
 *
 * Two custom properties set from the selected deck's colour identity. They
 * reach the wall wash and the table glow and NOTHING ELSE -- no border, no
 * badge, no status, no selection. That restraint is the entire difference
 * between this direction and 05-planar-gate.html, whose greyscale twin was the
 * argument against it. Press `g` and the room should lose its mood and keep
 * every fact.
 */

const TINTS = {
  W: "#b8a878", U: "#2f6c9c", B: "#3a3446", R: "#a4432f", G: "#356f45", C: "#5a5a6a",
};

function tintOf(deck) {
  if (!deck) return ["#5a4fa8", "#2c6c8e"];
  const ci = deck.ci.length ? deck.ci : ["C"];
  const a = TINTS[ci[0]] || TINTS.C;
  const b = TINTS[ci[ci.length - 1]] || a;
  return [a, b === a ? TINTS.C : b];
}

/* State ------------------------------------------------------------------ */

const state = {
  route: "home",
  joinCode: "",
  seats: [
    { kind: "you", deckId: "aesi", ready: false },
    { kind: "empty" }, { kind: "empty" }, { kind: "empty" },
  ],
  fillCpu: true,
  difficulty: "apprentice",
  cat: false,
  catFor: 0,
  open: null,
  invite: false,
  q: "", colours: [], src: "all", sort: "name",
  imp: { status: "idle", url: "", msg: "" },
  custom: null,
  starting: false,
  copied: null,
};

const allDecks = () => (state.custom ? DECKS.concat([state.custom]) : DECKS.slice());
const deckById = (id) => allDecks().find((d) => d.id === id) || null;
const myDeck = () => deckById(state.seats[0].deckId);

/* Seats ------------------------------------------------------------------ */

let joinToken = 0;

const filled = () => state.seats.filter((s) => s.kind !== "empty");
const podSize = () => filled().length;
const openSeats = () => state.seats.filter((s) => s.kind === "open").length;
const roomLive = () => state.seats.some((s) => s.kind === "open" || s.kind === "human");

function seatReady(s) {
  if (s.kind === "empty") return false;
  if (s.kind === "cpu") return true;
  if (s.kind === "open") return state.fillCpu;
  return !!s.ready;
}
const allReady = () => filled().every(seatReady);
const canStart = () => {
  const d = myDeck();
  return !!d && d.engine !== "preview" && podSize() >= 2 && allReady() && state.seats[0].ready;
};

const seatTier = (i) => tierOf(state.seats[i].tier || state.difficulty);

function firstEmpty() {
  for (let i = 1; i < state.seats.length; i += 1) if (state.seats[i].kind === "empty") return i;
  return -1;
}

function addCpu(i) {
  const at = i == null ? firstEmpty() : i;
  if (at < 1) return;
  state.seats[at] = { kind: "cpu", tier: state.difficulty };
}

function openChair(i) {
  const at = i == null ? firstEmpty() : i;
  if (at < 1) return;
  state.seats[at] = { kind: "open" };
  state.invite = true;
  const guest = POD.guests[(at - 1) % POD.guests.length];
  const token = ++joinToken;
  setTimeout(() => {
    if (token !== joinToken || state.seats[at].kind !== "open") return;
    state.seats[at] = { kind: "human", name: guest.name, deckId: guest.deckId, ready: false };
    render();
    setTimeout(() => {
      if (token !== joinToken || state.seats[at].kind !== "human") return;
      state.seats[at].ready = true;
      render();
    }, POD.readyMs - POD.joinMs);
  }, POD.joinMs);
}

function seatDeck(i) {
  const s = state.seats[i];
  if (s.kind === "empty" || s.kind === "open") return null;
  if (s.kind === "you") return myDeck();
  if (s.kind === "human") return s.ready ? deckById(s.deckId) : null;
  if (s.deckId) return deckById(s.deckId);
  const taken = new Set([
    state.seats[0].deckId,
    ...state.seats.filter((x) => x.kind === "human" && x.ready).map((x) => x.deckId),
    ...state.seats.filter((x) => x.kind === "cpu" && x.deckId).map((x) => x.deckId),
  ]);
  const live = DECKS.filter((d) => d.engine !== "preview");
  const pool = live.filter((d) => !taken.has(d.id));
  const chosen = pool.length ? pool : live;
  return chosen[(i * 7) % chosen.length];
}

function seatLabel(i) {
  const s = state.seats[i];
  if (s.kind === "you") return { title: "You", sub: s.ready ? "Locked in" : "Choosing" };
  if (s.kind === "open") return { title: "Open chair", sub: "Waiting for a player" };
  if (s.kind === "human") return { title: s.name, sub: s.ready ? "Locked in" : "Choosing a deck…" };
  if (s.kind === "empty") return { title: "Empty seat", sub: "Nobody here" };
  const t = seatTier(i);
  return { title: t.n, sub: t.tag };
}

/* The catalogue ---------------------------------------------------------- */

function visibleDecks() {
  const q = state.q.trim().toLowerCase();
  let list = allDecks().filter((d) => {
    if (state.src !== "all" && d.source !== state.src) return false;
    if (state.colours.length && !state.colours.every((c) => d.ci.includes(c))) return false;
    if (!q) return true;
    return (d.name + " " + d.cmd.n + " " + d.guild + " " + d.tags.join(" ")).toLowerCase().includes(q);
  });
  const s = SORTS.find((x) => x.id === state.sort);
  list = list.slice().sort((a, b) => {
    if (state.sort === "name") return a.name.localeCompare(b.name);
    const d = b.bars[state.sort] - a.bars[state.sort];
    return (s && s.invert ? -d : d) || a.name.localeCompare(b.name);
  });
  return list;
}

function why() {
  const d = myDeck();
  if (!d) return "Pick a deck to take your seat.";
  if (d.engine === "preview") return "This deck has no list in the engine yet, so it cannot be dealt.";
  if (podSize() < 2) return "A pod needs at least one opponent. Sit somebody down.";
  if (!state.seats[0].ready) return "Your seat is not locked in yet.";
  const waiting = state.seats
    .map((s, i) => ({ s, i }))
    .filter(({ s }) => s.kind !== "empty" && !seatReady(s))
    .map(({ i }) => seatLabel(i).title);
  if (waiting.length) return `Waiting on ${waiting.join(" and ")}.`;
  if (openSeats()) return `${openSeats()} chair${openSeats() > 1 ? "s" : ""} still open — a CPU will fill ${openSeats() > 1 ? "them" : "it"}.`;
  return `${podSize()} seats, everybody in. Deal them.`;
}

/* Views ------------------------------------------------------------------ */

function head(sub, ver) {
  return `<header class="head">
    <span><b class="brand__mark">Snap Keep</b><span class="brand__sub">${esc(sub)}</span></span>
    <span class="head__spacer"></span>
    ${state.route === "room" ? `<button class="btn" data-act="invite">Invite a player</button>
      <button class="ghost" data-act="leave">Leave the room</button>` : `<span class="head__ver">${esc(ver)}</span>`}
  </header>`;
}

function home() {
  const d = myDeck() || DECKS[0];
  return `<div class="door__mid" data-testid="home">
    <div class="cover">
      <div class="cover__card">
        ${face(d.cmd)}
        <div class="cover__artist">${esc(d.cmd.n)} · art by ${esc(d.cmd.artist)}</div>
      </div>
      <div class="cover__text">
        <h1 class="hero__mark">Snap Keep</h1>
        <div class="hero__rule"></div>
        <p class="hero__line">A room, a table, four chairs. Sit down, put a commander in front of you, fill the other three with the engine or with people, and deal when everybody has locked in.</p>
        <div class="hero__acts">
          <button class="big" data-act="create" data-testid="create-pod">Take a seat</button>
          <span class="or">or</span>
          <span class="join">
            <input class="join__in" id="code" type="text" value="${esc(state.joinCode)}" placeholder="Pod code" spellcheck="false" maxlength="9" aria-label="Pod code">
            <button class="join__go" data-act="join" data-testid="join-pod">Join</button>
          </span>
        </div>
        <div class="hero__cap">
          <b class="tabular">${DECKS.length}</b> decks in the catalogue
          <span>·</span>
          <button class="link" data-act="cat-open" data-for="0">Choose before you sit</button>
          <span>·</span>
          <span>the room takes your deck's colour</span>
        </div>
      </div>
    </div>
  </div>`;
}

/** A far seat, across the table. */
function pseat(i) {
  const s = state.seats[i];
  const d = seatDeck(i);
  const lab = seatLabel(i);
  const far = i === 2 ? "" : " pseat--far";

  if (s.kind === "empty") {
    const n = podSize();
    return `<section class="pseat pseat--empty${far}">
      <div class="pseat__fill">
        <span class="pseat__plus">+</span>
        <span class="pseat__ft">Seat ${i + 1} is empty</span>
        <span class="pseat__fs">Sit somebody down. A CPU and a person are the same chair.</span>
        <span class="pseat__acts">
          <button class="btn btn--wide" data-act="add-cpu" data-i="${i}" data-testid="opponents-${n}">Add a CPU</button>
          <button class="btn btn--wide" data-act="open-chair" data-i="${i}">Invite a player</button>
        </span>
      </div>
    </section>`;
  }

  const portrait = d
    ? `<img class="pseat__art" src="${artUrl(d.cmd.art)}" alt="">`
    : `<div class="pseat__art pseat__art--none"></div>
       <span class="pseat__hold">${s.kind === "human" ? "Sealed until they lock in" : "Waiting for a player"}</span>`;

  const deckBlock = d
    ? `<div class="pseat__deckn">${esc(d.name)}</div>
       <div class="pseat__meta">${ciPips(d.ci)}<span class="count tabular">${d.cards}</span>${engineBadge(d)}</div>`
    : s.kind === "human"
      ? `<div class="pseat__deckn pseat__deckn--sealed">Deck sealed</div>
         <div class="pseat__meta"><span class="count">Readable once they lock in</span></div>`
      : `<div class="pseat__deckn pseat__deckn--sealed">No deck yet</div>
         <div class="pseat__meta"><span class="count">Holding pod ${POD.code}</span></div>`;

  const body = s.kind === "cpu"
    ? (() => {
        const t = seatTier(i);
        return `<div class="pseat__who"><span class="pseat__n">${esc(t.n)}</span><span class="pseat__tag">${esc(t.tag)}</span></div>
          <p class="pseat__line">${esc(t.line)}</p>${capList(t.caps)}`;
      })()
    : s.kind === "open"
      ? `<div class="pseat__who"><span class="pseat__n">Open chair</span></div>
         <p class="pseat__line">Anyone with the code on the placard can take this seat. Until somebody does, a CPU fills it if you let it.</p>`
      : `<div class="pseat__who"><span class="pseat__n">${esc(s.name)}</span><span class="pseat__tag">${s.ready ? "locked in" : "still choosing"}</span></div>
         <p class="pseat__line">${s.ready
            ? "Locked in. Their list is readable now — before this, it was not."
            : "Sat down and picking a deck. Their list stays sealed until they lock it in, so nobody can scout the room."}</p>`;

  const foot = s.kind === "cpu"
    ? `<button class="btn" data-act="tier" data-i="${i}" data-dir="-1" title="Easier">◂</button>
       <button class="btn" data-act="tier" data-i="${i}" data-dir="1">Tougher ▸</button>
       <button class="btn" data-act="open-chair" data-i="${i}">Invite</button>`
    : s.kind === "open"
      ? `<button class="btn btn--wide" data-act="add-cpu" data-i="${i}">Put a CPU here instead</button>`
      : `<button class="btn btn--wide" data-act="dossier" data-id="${s.ready ? s.deckId : ""}" ${s.ready ? "" : "disabled"}>Read their deck</button>`;

  return `<section class="pseat pseat--${s.kind}${far}${seatReady(s) && s.kind !== "cpu" ? " pseat--ready" : ""}">
    <div class="pseat__top">
      ${portrait}
      <div class="pseat__scrim"></div>
      <span class="pseat__no">Seat ${i + 1} · ${s.kind === "cpu" ? "CPU" : s.kind === "open" ? "open" : "player"}</span>
      ${s.ready && s.kind !== "cpu" ? `<span class="pseat__stamp">Locked in</span>` : ""}
      <button class="pseat__x" data-act="clear" data-i="${i}" title="Empty this chair">✕</button>
    </div>
    <div class="pseat__deck">${deckBlock}</div>
    <div class="pseat__body">${body}</div>
    <div class="pseat__foot">${foot}</div>
  </section>`;
}

function placard() {
  if (!roomLive()) {
    return `<div class="placard placard--none">
      <span class="placard__l">The table</span>
      <span class="placard__v">Nobody has been invited yet</span>
      <span class="placard__acts"><button class="btn" data-act="invite">Put the code out</button></span>
    </div>`;
  }
  return `<div class="placard">
    <span class="placard__l">Pod code</span>
    <b class="placard__v tabular">${POD.code}</b>
    <span class="placard__acts">
      <button class="btn" data-act="copy" data-what="code">${state.copied === "code" ? "Copied" : "Copy code"}</button>
      <button class="btn" data-act="copy" data-what="link">${state.copied === "link" ? "Copied" : "Copy link"}</button>
    </span>
  </div>`;
}

/** Four rings, one per chair. Filled, dashed or dim -- shape, never hue. */
function seated() {
  const segs = state.seats.map((s, i) => {
    const lab = seatLabel(i);
    if (s.kind === "empty") return `<i class="seated__s seated__s--none" title="Seat ${i + 1} · empty"></i>`;
    if (seatReady(s)) return `<i class="seated__s seated__s--on" title="${esc(lab.title)} · ready"></i>`;
    return `<i class="seated__s seated__s--wait" title="${esc(lab.title)} · ${esc(lab.sub)}"></i>`;
  }).join("");
  const done = filled().filter(seatReady).length;
  return `<div class="seated">
    <div class="seated__l">Seated and locked in <span class="seated__n tabular">${done} of ${podSize()}</span></div>
    <div class="seated__t">${segs}</div>
  </div>`;
}

function room() {
  const d = myDeck();
  const locked = state.seats[0].ready;
  return `<div class="floor" data-testid="new-game">
    <div class="felt"></div>
    ${[1, 2, 3].map(pseat).join("")}
    <div class="centre">${placard()}</div>
  </div>

  <div class="near">
    <div class="near__me">
      ${d ? `<img class="near__art" src="${artUrl(d.cmd.art)}" alt="">` : `<span class="near__art near__art--none"></span>`}
      <span style="min-width:0">
        <span class="near__l">Your seat${locked ? " · locked in" : ""}</span>
        <span class="near__n">${d ? esc(d.name) : "No deck"}</span>
        <span class="near__meta">${d ? ciPips(d.ci) : ""}<span class="count tabular">${d ? d.cards : 0}</span>${d ? engineBadge(d) : ""}</span>
      </span>
    </div>
    <span class="near__acts">
      <button class="btn" data-act="cat-open" data-for="0" ${locked ? "disabled" : ""}>Change deck</button>
      <button class="btn" data-act="dossier" data-id="${state.seats[0].deckId}">Deck details</button>
    </span>
    <button class="lock${locked ? " lock--on" : ""}" data-act="lock" data-testid="lock-in" ${!d || d.engine === "preview" ? "disabled" : ""}>
      ${locked ? "Unlock my seat" : "Lock in my seat"}
    </button>
    <span class="near__spacer"></span>
    ${seated()}
    <p class="near__why">${esc(why())}</p>
    <button class="play" data-act="start" data-testid="start-game" ${canStart() && !state.starting ? "" : "disabled"}>
      ${state.starting ? "Shuffling…" : "Deal the room"}
    </button>
  </div>`;
}

function catalogue() {
  if (!state.cat) return "";
  const list = visibleDecks();
  const chosen = state.seats[0].deckId;
  const { status, msg } = state.imp;
  let note = `<span class="imp__note">${esc(CUSTOM.hint)}</span>`;
  if (status === "fetching") note = `<span class="imp__note imp__note--busy">Reading the list…</span>`;
  if (status === "error") note = `<span class="imp__note imp__note--err">${esc(msg)}</span>`;
  if (status === "ready") note = `<span class="imp__note">Imported. ${CUSTOM.fake.unsupported} cards are not in the engine yet and were left out.</span>`;

  const frame = (d) => `<div class="frame${d.id === chosen ? " frame--on" : ""}" data-testid="deck-${d.id}">
    <div class="frame__top">
      <img class="frame__art" src="${artUrl(d.cmd.art)}" alt="">
      <div class="frame__scrim"></div>
      <span class="frame__src">${d.source === "yours" ? "Yours" : "Precon"}</span>
      ${d.id === chosen ? `<span class="frame__tick">✓</span>` : ""}
      <span class="frame__name">${esc(d.name)}</span>
    </div>
    <div class="frame__main">
      <div class="frame__s">${esc(subtitle(d))}</div>
      <div class="frame__meta">${ciPips(d.ci)}<span class="count tabular">${d.cards}</span>${engineBadge(d)}</div>
      <div class="frame__bars">${bar("Speed", d.bars.speed, true)}${bar("Complex", d.bars.complexity, true)}${bar("Demands", d.bars.pilot, true)}</div>
    </div>
    <div class="frame__foot">
      <button class="btn" data-act="pick" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>
        ${d.engine === "preview" ? "Not dealable" : d.id === chosen ? "Selected" : "Take it"}
      </button>
      <button class="frame__more" data-act="dossier" data-id="${d.id}">details</button>
    </div>
  </div>`;

  return `<section class="cat" role="dialog" aria-modal="true" aria-label="Deck catalogue" data-testid="deck-catalog">
    <div class="cat__head">
      <span class="cat__t">Choose what you are holding</span>
      <span class="cat__for">The room takes its colour from this</span>
      <button class="cat__x" data-act="cat-close" aria-label="Close">✕</button>
    </div>
    <div class="filters">
      <label class="search">
        <span class="search__g">⌕</span>
        <input class="search__i" id="q" type="text" value="${esc(state.q)}" placeholder="Search decks, commanders, archetypes" spellcheck="false" aria-label="Search decks">
      </label>
      <span class="fgroup">
        <span class="fgroup__l">Colours</span>
        ${COLOURS.map(([c, n]) => `<button class="cbtn cbtn--${c}${state.colours.includes(c) ? " cbtn--on" : ""}" data-act="colour" data-c="${c}" title="${n}" aria-pressed="${state.colours.includes(c)}">${c}</button>`).join("")}
        ${state.colours.length ? `<button class="link" data-act="colour-clear">clear</button>` : ""}
      </span>
      <span class="seg">
        ${[["all", "All"], ["precon", "Precons"], ["yours", "Yours"]].map(([id, n]) =>
          `<button class="seg__b${state.src === id ? " seg__b--on" : ""}" data-act="src" data-v="${id}">${n}</button>`).join("")}
      </span>
      <select class="sel" id="sort" name="sort" data-act="sort" aria-label="Sort decks">
        ${SORTS.map((s) => `<option value="${s.id}"${state.sort === s.id ? " selected" : ""}>Sort: ${s.n}</option>`).join("")}
      </select>
      <span class="filters__spacer"></span>
      <span class="filters__n tabular">${list.length} of ${allDecks().length}</span>
    </div>
    <div class="cat__body">
      ${list.length
        ? `<div class="wallgrid">${list.map(frame).join("")}</div>`
        : `<div class="empty">Nothing matches that.<br>Clear a colour or two — the filter is an AND, so three colours means decks that play all three.</div>`}
    </div>
    <div class="cat__foot">
      <span class="imp">
        <span class="imp__l">Import</span>
        <input class="imp__in" id="mox" type="text" value="${esc(state.imp.url)}" placeholder="${esc(CUSTOM.placeholder)}" spellcheck="false" aria-label="Moxfield deck link">
        <button class="btn" data-act="import">Fetch</button>
      </span>
      ${note}
      <button class="btn" data-act="cat-close">Done</button>
    </div>
  </section>`;
}

function dossier() {
  if (!state.open) return "";
  const d = deckById(state.open);
  if (!d) return "";
  const sigs = d.signature.length
    ? `<div class="dos__sigs">${d.signature.map((s) => `<div class="sig">
        <img class="sig__art" src="${artUrl(s.art)}" alt="">
        <div><div class="sig__n">${esc(s.n)}</div><div class="sig__why">${esc(s.why)}</div></div>
      </div>`).join("")}</div>`
    : `<p class="dos__p">No editorial notes for this one. Picking three cards to call defining would mean picking them out of a list this repo has not built yet.</p>`;
  const honesty = d.engine === "preview"
    ? `<div class="note">Preview. This commander needs a rules feature the engine does not implement, so the deck cannot be dealt. It is in the catalogue because the catalogue has to be able to show it first.</div>`
    : d.engine === "partial"
      ? `<div class="note">${d.unsupported} of the imported cards use rules the engine does not implement and were dropped from the list.</div>`
      : d.swapNote
        ? `<div class="note">${esc(d.swapNote)}</div>`
        : `<div class="note">Real card, real oracle text, real art. The ratings and the write-up are editorial; the deck list itself arrives with the roadmap's All Card Support work.</div>`;

  return `<div class="veil" style="z-index:450" data-act="close"></div>
  <aside class="over" role="dialog" aria-modal="true" aria-label="${esc(d.name)}">
    <div class="over__head">
      <span class="over__n">${esc(d.name)}</span>
      ${ciPips(d.ci)}
      <span class="count tabular">${d.cards} cards</span>
      ${engineBadge(d)}
      <button class="over__x" data-act="close" aria-label="Close">✕</button>
    </div>
    <div class="over__body">
      <div class="dos__top">
        <div class="dos__card">
          ${face(d.cmd)}
          <div class="dos__artist">Art: ${esc(d.cmd.artist)}</div>
        </div>
        <div style="min-width:0">
          <h3 class="dos__h">The deck</h3>
          <p class="dos__p">${esc(d.blurb)}</p>
          <h3 class="dos__h">Playstyle</h3>
          <div class="dos__tags">${d.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
          <div class="dos__bars">${bars(d.bars)}</div>
        </div>
      </div>
      <h3 class="dos__h">How it plays</h3>
      <p class="dos__p">${esc(d.strategy)}</p>
      <h3 class="dos__h">Cards that define it</h3>
      ${sigs}
      <h3 class="dos__h">Mana curve</h3>
      ${curve(d.curve)}
      ${honesty}
    </div>
    <div class="over__foot">
      <button class="play" data-act="pick-close" data-id="${d.id}" ${d.engine === "preview" ? "disabled" : ""}>Take this deck</button>
      <button class="ghost" data-act="close">Close</button>
    </div>
  </aside>`;
}

function invite() {
  if (!state.invite) return "";
  const open = openSeats();
  return `<div class="veil" style="z-index:465" data-act="invite-close"></div>
  <section class="inv" role="dialog" aria-modal="true" aria-label="Invite a player">
    <div class="inv__head">
      <span class="inv__t">Put the code on the table</span>
      <button class="inv__x" data-act="invite-close" aria-label="Close">✕</button>
    </div>
    <div class="inv__body">
      <div>
        <div class="inv__l">Pod code</div>
        <div class="inv__code">
          <b class="inv__codev tabular">${POD.code}</b>
          <button class="btn" data-act="copy" data-what="code">${state.copied === "code" ? "Copied" : "Copy"}</button>
        </div>
      </div>
      <div>
        <div class="inv__l">Or send the link</div>
        <div class="inv__code">
          <span class="inv__linkv">${esc(POD.link)}</span>
          <button class="btn" data-act="copy" data-what="link">${state.copied === "link" ? "Copied" : "Copy"}</button>
        </div>
      </div>
      <p class="inv__note">${open
        ? `${open} chair${open > 1 ? "s are" : " is"} open and looking at the placard. Whoever arrives picks their own deck, and their list stays sealed until they lock in.`
        : "No chair is open yet. Open one and the placard holds this code until somebody takes it."}</p>
    </div>
    <div class="inv__foot">
      ${open
        ? `<button class="btn btn--wide" data-act="invite-close">Back to the room</button>`
        : `<button class="btn btn--wide" data-act="open-chair">Open a chair</button>`}
    </div>
  </section>`;
}

function render() {
  const [a, b] = tintOf(myDeck());
  const d = myDeck() || DECKS[0];
  root.innerHTML = `<div class="room" style="--tint-a:${a}; --tint-b:${b}">
    <div class="wall" style="background-image:url('${artUrl(d.cmd.art)}')"></div>
    <div class="wall__tint"></div>
    <div class="wall__veil"></div>
    ${head(state.route === "home" ? "Commander, against the engine" : "The room", "Flow 05 · The Room")}
    ${state.route === "home" ? home() : room()}
  </div>
  ${catalogue()}${dossier()}${invite()}`;
}

/* Behaviour -------------------------------------------------------------- */

root.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "mox") { state.imp.url = e.target.value; return; }
  if (id === "code") { state.joinCode = e.target.value.toUpperCase(); return; }
  if (id === "q") {
    state.q = e.target.value;
    render();
    const box = document.getElementById("q");
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
});

root.addEventListener("change", (e) => {
  if (e.target.dataset.act === "sort") { state.sort = e.target.value; render(); }
});

function runImport() {
  const url = state.imp.url.trim();
  if (!/^https?:\/\/(www\.)?moxfield\.com\/decks\/\S+/i.test(url)) {
    state.imp = { status: "error", url, msg: CUSTOM.errors.badUrl };
    render();
    return;
  }
  state.imp = { status: "fetching", url, msg: "" };
  render();
  setTimeout(() => {
    state.custom = CUSTOM.fake;
    state.src = "yours";
    if (!state.seats[0].ready) state.seats[0].deckId = CUSTOM.fake.id;
    state.imp = { status: "ready", url, msg: "" };
    render();
  }, 700);
}

function pick(id) {
  const d = deckById(id);
  if (!d || d.engine === "preview") return;
  if (!state.seats[0].ready) state.seats[0].deckId = id;
}

root.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-act]");
  if (!hit) return;
  const act = hit.dataset.act;
  const i = hit.dataset.i != null ? Number(hit.dataset.i) : null;

  switch (act) {
    case "create": state.route = "room"; break;
    case "join":
      state.route = "room";
      state.seats[1] = { kind: "human", name: POD.guests[0].name, deckId: POD.guests[0].deckId, ready: true };
      state.seats[2] = { kind: "cpu", tier: "duelist" };
      break;
    case "leave":
      state.route = "home";
      joinToken += 1;
      state.seats = [{ kind: "you", deckId: state.seats[0].deckId, ready: false }, { kind: "empty" }, { kind: "empty" }, { kind: "empty" }];
      state.invite = false;
      break;

    case "add-cpu": addCpu(i); break;
    case "open-chair": openChair(i); break;
    case "clear": joinToken += 1; state.seats[i] = { kind: "empty" }; break;
    case "tier": {
      const dir = Number(hit.dataset.dir);
      const at = DIFFICULTY.findIndex((t) => t.id === (state.seats[i].tier || state.difficulty));
      state.seats[i].tier = DIFFICULTY[Math.min(DIFFICULTY.length - 1, Math.max(0, at + dir))].id;
      break;
    }

    case "cat-open": state.cat = true; state.catFor = Number(hit.dataset.for || 0); break;
    case "cat-close": state.cat = false; break;
    case "pick": pick(hit.dataset.id); break;
    case "pick-close": pick(hit.dataset.id); state.open = null; state.cat = false; break;
    case "dossier":
      if (!hit.dataset.id) return;
      e.stopPropagation();
      state.open = hit.dataset.id;
      break;
    case "close": state.open = null; break;

    case "colour": {
      const c = hit.dataset.c;
      state.colours = state.colours.includes(c) ? state.colours.filter((x) => x !== c) : state.colours.concat([c]);
      break;
    }
    case "colour-clear": state.colours = []; break;
    case "src": state.src = hit.dataset.v; break;
    case "import": runImport(); return;

    case "lock": state.seats[0].ready = !state.seats[0].ready; break;
    case "fill": state.fillCpu = !state.fillCpu; break;
    case "invite": state.invite = true; break;
    case "invite-close": state.invite = false; break;
    case "copy":
      state.copied = hit.dataset.what;
      setTimeout(() => { state.copied = null; render(); }, 1400);
      break;

    case "start":
      state.starting = true;
      render();
      setTimeout(() => { state.starting = false; render(); }, 1700);
      return;

    default: return;
  }
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.open) { state.open = null; render(); return; }
    if (state.invite) { state.invite = false; render(); return; }
    if (state.cat) { state.cat = false; render(); return; }
  }
  if (e.key === "Enter" && e.target.id === "code") { state.route = "room"; render(); return; }
  if ((e.key === "g" || e.key === "G") && e.target.tagName !== "INPUT") {
    document.documentElement.classList.toggle("grey");
  }
});

render();
</script>
</body>
</html>
