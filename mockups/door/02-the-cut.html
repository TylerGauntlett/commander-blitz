<title>02 The Cut — the front door, 1280×800</title>
<style>
/* <<< BEGIN _door.css >>> */
/*
 * The front door, at 1280x800, and the grammar all five directions share.
 *
 * NOT LINKED. `inline.py` splices this between each file's BEGIN and END
 * `_door.css` markers, so every file opens standalone from file://.
 *
 * ---------------------------------------------------------------------------
 * WHAT THIS ROUND IS. The shipped front door is a web page: a wordmark, a
 * paragraph, a gold button, a text field with a button beside it, and a footer
 * of 11px grey links. The one card-shaped object on it -- the fan of four
 * `.back` plates at `HomeScreen.tsx:78-87` -- is decoration. Nothing on the
 * screen can be selected, and the only thing that looks like a game object is
 * the only thing that does nothing.
 *
 * These five make the menu out of that object: THREE CARDS, Decks / Play /
 * Join, which slide apart from the selected one and stack on the far side.
 *
 * WHAT IS IN HERE: the bezel and the deck, the card plate itself, the row and
 * the arithmetic that lays it out, the sheen, the cold state, and the two
 * floors. All five files get exactly this.
 *
 * WHAT IS NOT: any card FACE, any ground, any detail region. That is what a
 * direction is. `../rail/`s rule, kept for `../rail/`s reason -- the row is the
 * thesis, so a file that restyled the row would be disproving the claim it
 * exists to make.
 */

/* Tokens ------------------------------------------------------------------
   `frontend/src/theme.css`, unchanged, plus the focus tokens out of
   `frontend/src/styles/handheld.css:32-49`. Any drift here is a mockup lying
   about what it would look like. */

:root {
  --void-0: #0b0a16;
  --void-1: #141328;
  --void-2: #1d1b38;
  --edge: rgba(150, 140, 255, 0.16);
  --edge-hi: rgba(170, 160, 255, 0.32);
  --astral: #8f7fe8;
  --astral-hi: #c3b6ff;

  --pane-bg: rgba(20, 19, 40, 0.62);
  --pane-well: rgba(13, 12, 28, 0.8);
  --pane-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 26px rgba(0, 0, 0, 0.45);

  --mana-W: #fffbd5;
  --mana-U: #aae0fa;
  --mana-B: #cbc2bf;
  --mana-R: #f9aa8f;
  --mana-G: #9bd3ab;
  --mana-C: #d0cbc4;

  --playable: #5ce08a;
  --targetable: #58b6ff;
  --staged: #ffc14d;
  --danger: #ff5c5c;
  --gold: #ffd479;
  --gold-deep: #d8a63c;
  --ability: #c39bff;

  --text: #e6e3f5;
  --text-dim: #a09bc4;
  --text-faint: #837da8;

  /* handheld.css:36-37. The rings own gold, which is NOT `--gold`: the ring is
     a lighter, hotter tone precisely so "you are on it" cannot be confused with
     "this is the commit tier". */
  --focus: #ffe08a;
  --focus-glow: rgba(255, 224, 138, 0.5);

  /*
   * THE TWO FLOORS, and this round is the first surface in the folder that is
   * authored at them rather than repaired to them.
   *
   * `frontend/src/styles/handheld.css:1978-2116` is a GENERATED block of 144
   * selectors forced to `font-size: 16px`, and its own comment calls that "the
   * honest size of the problem". EIGHT of the door's own are in it --
   * `.brand__sub`, `.or` and `.door__cap` at 11px, `.link` at 11.5, `.join__go`
   * at 13, `.join__in` at 14, `.brand__mark` and `.hero__line` at 15 -- which is
   * every piece of text on the shipped front door except the hero wordmark. Two
   * of its controls are forced up to 44px the same way. The screen is written at
   * 11-15px and patched at the Deck, and the patch is why it passes CI.
   *
   * Nothing here is under the floor to begin with, so there is nothing for an
   * override list to reach.
   */
  --fs-floor: 16px;
  --fs-lead: 20px;
  --fs-big: 30px;
  --fs-mark: 44px;

  --hit-floor: 44px;

  /*
   * THE CARD, AND WHY IT IS 200px.
   *
   * The shipped doors fan is `min(clamp(104px, 15vh, 148px), 27vw)`
   * (`lobby.css:263`) -- two axes of clamp, for a window that could be a phone.
   * On a panel that is always 1280x800 both terms resolve to one number and the
   * machinery buys nothing, so this round states the number.
   *
   * 200 is what three cards can have. The rows widest state is the one where a
   * card is selected at an END, which pushes the far pair outward; `assert.js`
   * measures that extent in all three states and fails the file if it leaves
   * the stage. See `rowFits`. 200x280 also clears the 96px card floor
   * `../handheld/assert.js` set by more than double, which matters because
   * these are the only cards on the screen and they are the whole menu.
   */
  --card-w: 200px;
  --card-h: 280px;
  --card-r: 11px;

  --t-fast: 110ms;
  --t-base: 220ms;
  /*
   * How long the room takes to change colour.
   *
   * Longer than the slide on purpose. The card arrives in 179ms and the light
   * follows it -- a room that changed colour faster than the thing changing it
   * reads as a flash, and one that changed at the same speed reads as a single
   * hard cut. Trailing it slightly is what makes the light feel like a
   * consequence of the move rather than part of it.
   */
  --t-room: 320ms;
}

*, *::before, *::after { box-sizing: border-box; }

/* `<small>` is a SIZE instruction and this round cannot afford one: 0.83em of
   16px body copy is 13.3px, under the floor, in markup that reads as
   reasonable. Same removal as `../handheld-board/_board.css`. */
small { font-size: inherit; }

html, body { height: 100%; margin: 0; overflow: hidden; }

body {
  display: grid;
  place-items: center;
  background: radial-gradient(80% 60% at 50% 34%, #14122a 0%, #05040c 72%);
  color: var(--text);
  font: var(--fs-floor)/1.35 "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ==========================================================================
   The bezel and the deck
   ==========================================================================

   A 1280x800 screen, scaled to whatever window is open, so a mockup reviewed on
   a 2560px monitor is still reviewed at Deck density. `_door.js` writes the
   transform; nothing here may change the decks own pixel size, or every number
   the gate prints is wrong in the direction that flatters the design.

   `.bezel` is fixed and full-viewport rather than sized to `1280 * scale`, and
   that is `../handheld-board/_board.css`s arrangement for its reason: a grid
   item that overflows its own declared width is not centred by what it
   overflows, which put the deck 48px right of centre the first time.
   ========================================================================== */

.bezel { position: fixed; inset: 0; display: grid; place-items: center; }

.deck {
  position: relative;
  width: 1280px;
  height: 800px;
  flex: none;
  overflow: hidden;
  transform-origin: center center;
  border-radius: 14px;
  color: var(--text);
  box-shadow: 0 0 0 8px #0d0c18, 0 0 0 10px #262338, 0 30px 90px rgba(0, 0, 0, 0.8);
  /* The default ground -- `theme.css:426-428`, the apps own lit-table wash. A
     direction may replace it (05 does) but it may not go missing: a transparent
     deck borrows the bezels and the shots stop comparing. */
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143, 127, 232, 0.13) 0%, transparent 62%),
    radial-gradient(70% 50% at 50% 100%, rgba(90, 190, 220, 0.07) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 62%);
}

.bezel__tag {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 6px;
  color: var(--text-faint);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
}
.bezel__tag b { color: var(--astral-hi); font-weight: 600; }
.bezel__tag i { color: var(--danger); font-style: normal; }

/* ==========================================================================
   THE ROW
   ==========================================================================

   The brief, restated as arithmetic: three cards; the selected one squares up
   and lifts; the other two slide away from it; and the two on the same side of
   the selection OVERLAP each other rather than spreading evenly.

   Everything is derived from ONE continuous number, `s` -- where the selection
   currently is, in card-index space -- which the spring in `_door.js` moves
   between 0, 1 and 2. Nothing here is keyframed and nothing is a discrete
   state, so a card mid-flight is at a real position rather than at a tween
   between two poses. That is what makes `travelMs` a number the gate can read.

   `d = i - s` for card `i`. Then, in `_door.js`:

     x      i*STEP + sign(d) * (PUSH*min(|d|,1) - BUNCH*max(0,|d|-1))
     rot    clamp(d, -1.6, 1.6) * ARC
     y      DROOP*min(|d|,1.6) - LIFT*max(0, 1-|d|)
     scale  1 + RAISE*max(0, 1-|d|)
     z      100 - round(|d|*10)

   THE BUNCH TERM IS THE BRIEFS STACKING and it is the only new idea in the
   arithmetic. `PUSH` alone spreads the row evenly, which is a fan. Subtracting
   `BUNCH` once a card is more than one place from the selection pulls the far
   card back OVER its neighbour, so selecting an end leaves a clear card and a
   pair -- which is what the brief describes and what a hand of cards actually
   does when you pull one out of it.

   `../../frontend/src/components/game/HandFan.tsx:36-83` is where `ARC`, the
   push-away and the parabolic droop come from. It has no bunch term, because a
   hand of seven has no far side.
   ========================================================================== */

/*
 * THE SLOT IS THE BOX AND THE CARD IS THE PICTURE, and the split is not
 * cosmetic. `board.css:1816-1826` records why: transform the thing the pointer
 * is inside and a lifted card leaves the pointer, `mouseleave` fires, it drops,
 * `mouseenter` fires, forever.
 *
 * Here the box genuinely has to move -- sliding IS the design -- so the loop is
 * cut on the other side instead: `_door.js` ignores a hover while the row is
 * still moving, and a hover never DE-selects. Selection therefore only ever
 * moves toward the pointer and cannot oscillate. See `DOOR.hover`.
 */
.row {
  position: absolute;
  left: 0;
  right: 0;
  height: var(--card-h);
  /* No `overflow` of its own, deliberately: a card that runs off the row must
     run off the DECK, where `assert.js`s escape check can see it. A clip here
     would hide exactly the failure `rowFits` exists to catch. */
}

.slot {
  position: absolute;
  top: 0;
  left: 50%;
  width: var(--card-w);
  height: var(--card-h);
  /* THE TRANSFORM IS WRITTEN BY `paint()`, as one string, and is deliberately
     not assembled here out of four custom properties. See the note over
     `DOOR.paint` for what that cost per frame. The `-50%` stays part of what it
     writes, so `poseOf` is written about a row's centre rather than its left
     edge. */
  transform: translateX(-50%);
  transform-origin: 50% 118%;
  /* Its own compositor layer. Three cards, a wall, and a sheen that loops
     forever on whichever card is selected -- without this the whole deck is
     re-rastered every frame of every slide, which is what put 05 at 30fps. */
  will-change: transform;
}

/* The plate: `frontend/src/styles/lobby.css:23-57`, ported. The 135-degree
   hatch over #443e34, the 2px warm border, the inset hairline at 9%. This is
   the object the brief points at -- and it is already the repos one picture for
   "you do not get to know this yet", which is why every direction starts from
   it even where it ends up somewhere else. */
.mcard {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  border-radius: var(--card-r);
  border: 2px solid rgba(120, 110, 90, 0.5);
  background:
    repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.24) 0 8px, transparent 8px 16px),
    #443e34;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 26px rgba(0, 0, 0, 0.45);
  text-align: center;
  cursor: pointer;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
}

.mcard::after {
  content: "";
  position: absolute;
  inset: 9%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 7px;
  pointer-events: none;
}

/*
 * THE LABEL, AND IT IS THE ONE THING THE GATE PROTECTS.
 *
 * `labelClear` measures this box against every card drawn on top of it, in all
 * three selection states, and fails the file if any of it is covered. The brief
 * asks for overlap and overlaps failure mode is a card hiding the one thing
 * that says what it is -- a menu item nobody can name is not a menu item.
 *
 * It is pinned to the foot because the foot is the part of a stacked card that
 * survives: a card overlapped from the right loses its right-hand edge, one
 * overlapped from the left loses its left, and the bottom band outlives both.
 * It is also where the printing on a real card back sits.
 */
.mcard__label {
  position: absolute;
  bottom: 16px;
  left: 50%;
  /* `--lab` is the travel `paint()` computes: an offset from wherever this
     label naturally sits toward the edge that is still showing, plus a turn
     toward a spine. The `-50%` is the natural centring and stays in CSS, so a
     direction that anchors its name somewhere else (04) overrides this one rule
     and the JS needs to know nothing about it. */
  transform: translateX(-50%) var(--lab, translate(0, 0));
  transform-origin: 50% 50%;
  /* NO `left: 0; right: 0`, and that is the whole of the fix `labelClear`
     forced. A full-width block reports the CARD's box to
     `getBoundingClientRect`, so a right-aligned label measured as covered
     whenever anything overlapped the card's left edge -- the gate was reading a
     box with nothing in most of it. Shrink-to-fit makes the measured rectangle
     the words, which is what the gate is actually about. */
  font-size: var(--fs-lead);
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.62);
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  pointer-events: none;
}

/*
 * THE LABEL SIDE, AND `labelClear` IS WHAT FOUND IT.
 *
 * With the row bunched, `z` falls with distance from the selection -- so of the
 * two stacked cards the NEARER one is drawn on top, and the further one loses
 * the half of itself that faces the selection. A centred label is therefore
 * half-covered in exactly the state the brief asks for, and covered by a card
 * that looks perfectly correct.
 *
 * The fix is what a fanned hand does anyway: each card reads on the edge facing
 * AWAY from the selection, because that outer sliver is the only part of it
 * guaranteed to be uncovered. `_door.js` writes `data-side` off `sign(i - s)`.
 */
/* `data-side` no longer positions anything -- `--lab` does, continuously. It is
   still written, because a direction may want to know which way a card leans
   for something that is not a position. */

/*
 * `.ink` -- anything on a card that is NOT its name.
 *
 * See `poseOf` in `_door.js` for the argument. Short version: a card two places
 * from the selection is under its own neighbour, so all it has left is the
 * outer sliver its name sits in, and a sentence running under a covering card
 * reads as truncated rather than as hidden. Whatever a direction prints below
 * the name marks itself `.ink` and goes with the card.
 *
 * Opacity rather than `display`, because the fade has to track the slide -- a
 * line that vanished at a threshold would pop, and the card is moving
 * continuously. `assert.js` measures the settled states, where this is 1 or 0.
 */
.ink { opacity: var(--ink, 1); }

/* The card backs own printing, which is a PATTERN and not a label: the same
   words on every card, at the size printing on a card back is. `aria-hidden`
   says so out loud, and it is what lets it sit under the floor honestly --
   `CardBack.tsx:35-46` makes exactly this argument, and `assert.js` exempts
   hidden text for exactly this reason. */
.mcard__mark {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 28%;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.24);
  line-height: 1.8;
  pointer-events: none;
}

/* ==========================================================================
   SELECTED
   ==========================================================================

   Two rules, both lifted rather than invented, and the reason for taking them
   whole is that the board already spent the argument on them.

   FILL IS FOCUS, TIER IS THE EDGE (`handheld.css:1315-1345`). "Am I on it" is
   carried by the fill; what kind of thing it is stays on the border; the two
   never trade places. On the board that keeps `--playable` meaning exactly
   "castable"; here it keeps the selected card readable as selected on a screen
   where every card is the same kind of thing.

   THE SHEEN (`handheld.css:1347-1398`). A slow gradient crossing the selected
   card. Its own comment is the argument: movement carries into peripheral
   vision where a 3px hairline does not, and it costs one pseudo-element and one
   keyframe. This is the effect the brief asks for by name.

   ONE CHANGE FROM THE APP: there it is scoped to `[data-cursor] .face::after`,
   so a mouse player never sees it. Here it is on the selected card whatever
   moved the selection, because on this screen the selection IS the state and
   there is nothing else for the sheen to be about.
   ========================================================================== */

.slot--on .mcard {
  border-color: var(--focus);
  box-shadow:
    0 0 0 3px rgba(255, 224, 138, 0.22),
    0 0 34px rgba(255, 224, 138, 0.24),
    0 18px 40px rgba(0, 0, 0, 0.6);
}

.slot--on .mcard__label {
  color: var(--focus);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
}

.sheen {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    115deg,
    transparent 30%,
    rgba(255, 224, 138, 0.18) 48%,
    transparent 66%
  );
  background-size: 260% 100%;
  opacity: 0;
  pointer-events: none;
}

.slot--on .sheen {
  opacity: 1;
  animation: door-sheen 2.4s ease-in-out infinite;
}

@keyframes door-sheen {
  from { background-position: 140% 0; }
  to   { background-position: -40% 0; }
}

/* The press squeeze. `ring.ts:567` does this to the focus ring on A -- a short
   impulse into the boxs own origin so it reads as taking the press rather than
   as moving. 90ms, because that is under the 110ms the app calls fast and a
   press has to feel like it landed before anything else happens.

   On `.mcard` and not on `.slot`: the slot carries the rows arithmetic in its
   own `transform`, and an animation on the same property would fight it. */
.slot--press .mcard { animation: door-press 90ms ease-out; }

@keyframes door-press {
  50% { transform: scale(0.965); }
}

/*
 * REDUCED MOTION TAKES THE TEXTURE AND LEAVES THE FACTS.
 *
 * `fx/presets.ts` and `ParticleLayer.burst` draw the same line -- reduced
 * motion drops "how it felt" and keeps every channel carrying information. So
 * the sheen and the ambient motes stop; the card still moves, because WHERE THE
 * SELECTION IS is the one thing this screen exists to say. `_door.js` snaps the
 * spring rather than stilling it.
 */
@media (prefers-reduced-motion: reduce) {
  .slot--on .sheen { animation: none; }
  .slot--press .mcard { animation: none; }
  .motes { display: none; }
}

/* ==========================================================================
   The cold state
   ==========================================================================

   Chrome hides gamepads behind a user gesture, so `navigator.getGamepads()`
   returns four nulls until the first button press even though the API is there
   on file:// -- `../handheld/_handheld.js:282-314` measured that before any of
   this was written. Every file therefore OPENS on "press any button" rather
   than pretending to be connected, which is also the most honest first frame a
   console menu can have.

   It is a caption, not a curtain: the menu is live behind it and a mouse works
   immediately. What it says is "a pad has not spoken yet", which is a true
   statement about the pad and not an instruction to the player.
   ========================================================================== */

.cold {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  min-height: var(--hit-floor);
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: rgba(13, 12, 28, 0.72);
  color: var(--text-dim);
  font-size: var(--fs-floor);
  letter-spacing: 0.04em;
  z-index: 400;
}

.cold[hidden] { display: none; }

.cold__dot {
  width: 9px;
  height: 9px;
  flex: none;
  border-radius: 50%;
  background: var(--text-faint);
  animation: door-breathe 1.8s ease-in-out infinite;
}

@keyframes door-breathe {
  0%, 100% { opacity: 0.35; }
  50%      { opacity: 1; }
}

/* The glyph. Drawn as a lettered disc rather than fetched, because the round
   opens from file:// with no network -- and because the Decks face buttons are
   literally lettered A B X Y in that layout. `../handheld/_handheld.js:596`. */
.glyph {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--edge-hi);
  background: rgba(30, 28, 56, 0.9);
  color: var(--text);
  font-size: var(--fs-floor);
  font-weight: 700;
  line-height: 1;
}

.glyph--key {
  width: auto;
  min-width: 24px;
  padding: 0 8px;
  border-radius: 6px;
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

/* ==========================================================================
   The hint bar
   ==========================================================================

   What the buttons that exist do. Every direction has one and they are all the
   same, because a direction that invented its own control legend would be
   comparing legends.
   ========================================================================== */

/* ==========================================================================
   Holds -- anything that opens over the row
   ==========================================================================

   One at a time, dimming what is behind it, owning the input while it is up.
   See `DOOR.openHold`. The scrim is a real element rather than a shadow so a
   click anywhere outside the panel can close it, which is one of the three ways
   out `../menu/` requires of every overlay in this folder: the control, outside,
   and Escape.
   ========================================================================== */

.hold {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 600;
  background: rgba(6, 5, 14, 0.72);
  animation: hold-in 160ms ease-out;
}

.hold[hidden] { display: none; }

@keyframes hold-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.hold__panel {
  position: relative;
  width: 420px;
  display: grid;
  gap: 18px;
  padding: 28px;
  border: 1px solid var(--lit, var(--edge-hi));
  border-radius: 14px;
  background: linear-gradient(180deg, #1b1730 0%, #100d1c 100%);
  box-shadow: 0 0 60px var(--lit-soft, rgba(255, 224, 138, 0.18)),
    0 30px 70px rgba(0, 0, 0, 0.7);
  animation: hold-rise 200ms cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes hold-rise {
  from { transform: translateY(10px) scale(0.98); }
  to { transform: none; }
}

.hold__h {
  margin: 0;
  font-size: var(--fs-lead);
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--focus);
}

.hold__p {
  margin: 0;
  font-size: var(--fs-floor);
  line-height: 1.5;
  color: var(--text-dim);
}

.hold__row { display: flex; gap: 12px; align-items: stretch; }

.hold .code { flex: 1; }
.hold .code__in { width: 100%; }

.hold__go {
  min-height: var(--hit-floor);
  padding: 0 22px;
  border-radius: 10px;
  border: 0;
  background: linear-gradient(180deg, #ffd98c, #e0a63f 55%, #b87c1c);
  color: #1b0f05;
  font-size: var(--fs-floor);
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 3px 0 #7d5310;
}

.hold__go:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d5310; }

.hold__hint {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-floor);
  color: var(--text-faint);
}

.hints {
  position: absolute;
  right: 24px;
  bottom: 22px;
  display: flex;
  align-items: center;
  gap: 20px;
  color: var(--text-dim);
  font-size: var(--fs-floor);
  z-index: 300;
}

.hint { display: flex; align-items: center; gap: 8px; }

/* ==========================================================================
   Shared furniture: the wordmark and the bolt
   ==========================================================================

   `Mark.tsx` is an inline SVG and stays one, so the five draw the shipped logo
   rather than five approximations of it. Where it goes is a directions to
   decide; what it looks like is not.
   ========================================================================== */

.brand { display: flex; align-items: center; gap: 12px; }

.brand__badge { width: 30px; height: 30px; flex: none; color: var(--gold); }

.brand__mark {
  font-size: var(--fs-floor);
  font-weight: 800;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold);
}

.brand__sub {
  font-size: var(--fs-floor);
  color: var(--text-dim);
  letter-spacing: 0.03em;
}

/* ==========================================================================
   The pod code field
   ==========================================================================

   Where it lives is the sharpest difference between the five, so the FIELD is
   shared and the placement is not. It carries `pod-code` and `join-pod`, two of
   the four test ids that have to survive the port.

   44px minimum on both, which the shipped pair only reaches through
   `handheld.css:2125-2139`s override list. A Steam Deck has a touchscreen and
   these are the controls a finger goes for.
   ========================================================================== */

.code {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--edge);
  border-radius: 10px;
  background: rgba(8, 7, 18, 0.72);
  overflow: hidden;
}

.code__in {
  width: 190px;
  min-height: var(--hit-floor);
  padding: 0 14px;
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: var(--fs-floor);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.code__in::placeholder { color: var(--text-faint); font-weight: 600; letter-spacing: 0.1em; }

/*
 * `:not([data-cursor])` on the focus suppression, which is `lobby.css:438-453`
 * and is here because the bug it records is nastier than it looks: the ring is
 * `outline: 3px solid` on an ATTRIBUTE selector, so a class-qualified
 * `:focus { outline: none }` outranks it, and only `outline-style` goes to
 * `none`. The width still computes to 3px, so devtools shows the ring applied
 * and nothing is drawn. It was found by driving the front door with a
 * controller, on this exact field.
 */
.code__in:focus:not([data-cursor]) { outline: none; }

.code:focus-within { border-color: var(--focus); }

.code__go {
  min-width: 78px;
  min-height: var(--hit-floor);
  padding: 0 18px;
  border-left: 1px solid var(--edge);
  color: var(--text-dim);
  font-size: var(--fs-floor);
  font-weight: 700;
}

.code__go:hover:not(:disabled) { color: var(--text); background: rgba(143, 127, 232, 0.12); }
.code__go:disabled { opacity: 0.4; cursor: not-allowed; }

/* ==========================================================================
   Ambient motes
   ==========================================================================

   `fx/presets.ts:225` is the apps own `motes()` -- 12 gold and white specks
   drifting upward, the one preset in the vocabulary that is ambience rather
   than an event. Re-expressed as CSS because the round has no canvas, and
   dropped entirely under reduced motion, which is what `burst()` itself does.

   Available to every direction; taken up by 05, where it is the point.
   ========================================================================== */

.motes {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  /* Fourteen elements on their own infinite animations, over a blurred ground.
     Contained, or every mote's repaint takes the wall behind it with it. */
  contain: strict;
}

.mote {
  position: absolute;
  /* `bottom: 0`, not `-14px`. Starting a mote just under the screen so it drifts
     up into view is the obvious way to write this and puts an element outside
     the deck for the first moment of every cycle -- which `assert.js` caught
     twice, at y 779 and 782 against a stage ending at 780. The fade-in at 12%
     does that job with no box leaving the stage. */
  bottom: 0;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 224, 138, 0.75);
  box-shadow: 0 0 8px rgba(255, 224, 138, 0.55);
  animation: door-mote linear infinite;
}

@keyframes door-mote {
  from { transform: translateY(0) translateX(0); opacity: 0; }
  12%  { opacity: 0.85; }
  80%  { opacity: 0.5; }
  /* 780 and not 830. A mote starts 14px below the deck and `.motes` clips it,
     so 830 puts the end of its travel 16px ABOVE the screen -- which is an
     element outside the deck for the last fraction of a second of every cycle,
     and `assert.js`'s escape check is not fooled by it being invisible. It is a
     fair catch: a decorative layer that leaves the stage is exactly how the
     check would be trained to ignore a real one. */
  to   { transform: translateY(-780px) translateX(var(--drift, 20px)); opacity: 0; }
}

/* ==========================================================================
   The commit plate
   ==========================================================================

   `../menu/README.md` sets the rule every interactive mockup in this folder
   follows: pressing the commit control "commits visibly and does nothing
   else". A mockup that navigated would be claiming to be the application, and
   the one thing a prototype must never do is answer a question it has not
   built the answer to.
   ========================================================================== */

.commit {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 18px 30px;
  min-height: var(--hit-floor);
  display: grid;
  place-items: center;
  border: 1px solid var(--focus);
  border-radius: 12px;
  background: rgba(13, 12, 28, 0.94);
  color: var(--focus);
  font-size: var(--fs-lead);
  font-weight: 700;
  letter-spacing: 0.05em;
  box-shadow: 0 0 40px rgba(255, 224, 138, 0.22), 0 20px 50px rgba(0, 0, 0, 0.7);
  z-index: 500;
  animation: door-commit 1.4s ease-out forwards;
}

@keyframes door-commit {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
  12%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  78%  { opacity: 1; }
  to   { opacity: 0; }
}
/* <<< END _door.css >>> */

/* ==========================================================================
   02 — THE CUT
   ==========================================================================

   THE TWO CARDS YOU DID NOT PICK ARE STILL IN THE DECK.

   01 draws three peers that fan. This one says the row is a DECK, and that
   moving the selection is cutting it: the cards you are not on collapse into a
   tight pile and the one you are on is the card you have cut to.

   Two ideas, and they are separable from each other and from the skin.

   1. STACKING IS THE AFFORDANCE, NOT THE LEFTOVER. In 01 the overlap is what
      is left over after two cards slide out of the way, and the design has to
      work around it -- which is what the label-side rule in `_door.css` is. Here
      the overlap is the point: `BUNCH` goes to 178, the pile closes to a 70px
      sliver, and THE FAR CARD'S NAME IS PRINTED UP ITS SPINE, because that is
      what a deck box does and a 70px sliver is a spine. `../menu/02-deck-rack`
      argued the same thing about precons and this is that idea at menu scale.

      It is also the answer to `labelClear` that costs nothing: a vertical label
      is about 26px wide whatever it says, so the constraint that bounds 01's
      stack depth -- the sliver has to be wider than the longest word -- stops
      binding at all. The pile can be as tight as it likes.

   2. EXPAND IN PLACE. There is no modal and no second screen. What the card you
      are on actually offers unfolds into the LEDGER below the row, in the room
      the pile leaves. A modal exists to stop you losing your place, and you
      cannot lose your place in a row of three.

      That is the real trade against 01, and it is a trade rather than a win. 01
      puts everything on the card and pays for it in width: a 200px card gives
      its sentence five lines and its code field 168px. The ledger is 760px, so
      the sentence is one line and the code field is the shipped one at its real
      size -- and the cost is a second region on a screen that had one.

   ---------------------------------------------------------------------------
   WHAT IT OVERRIDES: `BUNCH` only, from 112 to 178, which `assert.js` prints in
   the `tune` block so the README table is measured. Everything else about the
   row is the shared arithmetic.
   ========================================================================== */

/* The spine.
   ---------------------------------------------------------------------------
   IT TURNS, IT DOES NOT SNAP. The first version was `writing-mode: vertical-rl`
   behind a `.slot--spine` class, which is a property with no in-between: the
   name flipped through ninety degrees and jumped to the middle of the card in a
   single frame, measured at 35% of the card's height. The turn is now a
   fraction supplied by `spin()` below and composed into the shared `--lab`
   transform, so the name rolls onto its side as the pile closes.

   All three names take the brighter tone rather than only the turned one, for
   the same reason: a colour that changes at a threshold is one more thing
   popping mid-slide, and the pile reads perfectly well without it. */
.mcard__label { color: rgba(255, 255, 255, 0.72); }

/* A pile has thickness. The near card of a stacked pair gets a hard edge on the
   side the far card is under, so the two read as one object seen at an angle
   rather than as two cards that happen to be close. */
.slot--near .mcard { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 26px rgba(0, 0, 0, 0.6); }

.mcard__mark { top: 22%; }

/* The repeated mark and a turned name fight over the same 73px strip, and the
   name is the one carrying information. `--ink` already fades with the card, so
   marking the pattern `.ink` is the whole of it. */

/* The ledger ---------------------------------------------------------------
   Everything the selected card offers, in the room the pile left. Fixed
   height, because a panel that resized with its contents would move the hint
   bar every time the selection changed. */
.ledger {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 556px;
  width: 760px;
  height: 118px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 26px;
  padding: 20px 26px;

.ledger__l { min-width: 0; display: grid; gap: 8px; text-align: left; }

.ledger__verb {

  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--focus);
}

.ledger__line { font-size: var(--fs-floor); color: var(--text-dim); }

.ledger__r { display: flex; align-items: center; gap: 14px; }

.ledger__stat {

  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text);
  white-space: nowrap;

/* The chrome: a header strip, because the ledger already owns the foot. */
.top {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 74px;
  display: flex;
  align-items: center;
