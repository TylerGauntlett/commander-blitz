<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Candlelit Table</title>
<style>
/* ============================================================================
   CANDLELIT TABLE
   ----------------------------------------------------------------------------
   Ground: walnut and oxblood leather, lit by one warm source above the viewer's
   half. The opponent's board falls off into shadow, which is a legibility
   argument as much as a mood one -- you read your own board constantly and
   theirs occasionally, and the shipped client lights both equally.

   Structural idea: ZONES AS FURNITURE. Library, graveyard and exile stop being
   `Lib 72 / GY 3 / Exile 1` text chips and become card piles whose height is the
   count. Life is a brass dial. The stack is a real leaning pile. The commit
   control is a wax seal, not a rectangle.
   ========================================================================== */

:root {
  --wood-0:#20150e; --wood-1:#33210f; --wood-2:#452c15;
  --leather:#3a1418; --leather-hi:#5a2228;
  --brass:#d8b055; --brass-hi:#f3dda0; --brass-lo:#7d611f;
  --stitch:rgba(226,196,132,.28);

  --playable:#7fe39c; --targetable:#6fc0ff; --staged:#ffc14d;
  --attacking:#ff7a5e; --danger:#ff6a5c; --ability:#c39bff;

  --stock:#f6efdd; --stock-shade:#e2d5b8; --stock-ink:#1d1710;
  --stock-ink-dim:#665a45; --stock-rule:#c0b190;
  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd;

  --text:#f3e7d2; --text-dim:#c0a887; --text-faint:#8b755a;

  --card-w: clamp(84px, 4.5vw, 110px);
  --card-r: calc(var(--card-w) * .055);
  --font: "Segoe UI", Inter, system-ui, sans-serif;
}

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  /* Wood grain, then the candle. */
  background:
    radial-gradient(90% 70% at 50% 118%, rgba(255,214,150,.22) 0%, rgba(255,190,110,.06) 34%, transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.07) 0 3px, transparent 3px 11px),
    repeating-linear-gradient(89.5deg, rgba(255,220,170,.02) 0 1px, transparent 1px 19px),
    linear-gradient(180deg, var(--wood-0) 0%, var(--wood-1) 52%, var(--wood-2) 100%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button { font:inherit; color:inherit; cursor:pointer; }
.spacer { flex:1; }
.tabular { font-variant-numeric:tabular-nums; }
.table { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }

/* Leather panels, stitched. */
.leather {
  border-radius:12px;
  background:linear-gradient(180deg, var(--leather-hi), var(--leather));
  border:1px solid rgba(0,0,0,.6);
  box-shadow:inset 0 1px 0 rgba(255,220,170,.16), inset 0 -14px 26px rgba(0,0,0,.42),
             0 6px 18px rgba(0,0,0,.5);
  position:relative;
}
.leather::before {
  content:""; position:absolute; inset:5px; border-radius:8px;
  border:1px dashed var(--stitch); pointer-events:none;
}

/* --- Brass rail: the phase track ---------------------------------------- */
.rail-top {
  display:flex; align-items:center; gap:16px; padding:9px 18px;
  background:linear-gradient(180deg, #4a3115, #2a1a0a);
  border-bottom:2px solid var(--brass-lo);
  box-shadow:0 3px 12px rgba(0,0,0,.6);
}
.rail-top__turn { display:flex; align-items:baseline; gap:9px; }
.rail-top__turn b { font-size:20px; font-weight:800; color:var(--brass-hi); }
.rail-top__turn span { font-size:12px; color:var(--text-faint); }
.plaque {
  display:flex; gap:4px; flex:1; margin:0; padding:3px; list-style:none;
  border-radius:8px; background:rgba(0,0,0,.34);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
}
.ph {
  display:flex; align-items:center; gap:10px; padding:4px 13px; border-radius:6px;
  color:var(--text-faint); font-size:11.5px; white-space:nowrap;
}
.ph--past { color:var(--text-dim); }
.ph--now {
  flex:1; min-width:0; color:#2c1c05;
  background:linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, var(--brass-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 2px 7px rgba(0,0,0,.5);
}
.ph__name { font-weight:800; letter-spacing:.07em; text-transform:uppercase; font-size:11px; }
.ph__steps { display:flex; gap:3px; margin:0; padding:0; list-style:none; overflow:hidden; }
.st { padding:2px 9px; border-radius:4px; font-size:10.5px; opacity:.62; }
.st--now { background:rgba(44,28,5,.8); color:var(--brass-hi); opacity:1; font-weight:800; }
.rail-top__who {
  padding:5px 15px; border-radius:999px; border:1px solid var(--brass-lo);
  background:rgba(216,176,85,.14); color:var(--brass-hi); font-size:12.5px; font-weight:700;
}

/* --- Body ---------------------------------------------------------------- */
.table__body {
  position:relative; display:grid;
  grid-template-columns:clamp(196px,13vw,268px) minmax(0,1fr) clamp(268px,17vw,344px);
  gap:12px; min-height:0; padding:12px;
}
.play { display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; min-width:0; min-height:0; }
.play__opponents { display:flex; gap:12px; justify-content:center; min-height:0; }
.play__opponents .mat { flex:0 1 auto; max-width:100%; }
.play__mine { min-height:0; display:flex; }
.play__mine .mat { flex:1; }

/* The candle is over the viewer. Their board is simply better lit. */
.play__opponents .mat { filter:brightness(.8) saturate(.92); }
.play__mine .mat { box-shadow:inset 0 1px 0 rgba(255,220,170,.2), inset 0 -14px 26px rgba(0,0,0,.42),
  0 6px 18px rgba(0,0,0,.5), 0 0 70px rgba(255,196,120,.09); }

.rail { display:flex; flex-direction:column; gap:12px; min-height:0; }
.panel { padding:12px 14px; }
.panel__title {
  display:flex; align-items:center; gap:7px; margin:0 0 8px;
  color:var(--brass); font-size:10.5px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase;
}
.panel__empty { color:var(--text-faint); font-size:12px; font-style:italic; }
.log__lines { display:flex; flex-direction:column; gap:3px; max-height:30vh; overflow-y:auto; }
.log__line { color:var(--text-dim); font-size:11.5px; line-height:1.45; margin:0; }
.log__line--turn { color:var(--brass-hi); font-weight:700; }

/* --- Mats ---------------------------------------------------------------- */
.mat { display:grid; grid-template-columns:clamp(160px,10.6vw,206px) minmax(0,1fr); gap:12px; padding:10px; min-height:0; }
.mat--compact { grid-template-columns:clamp(140px,9.2vw,174px) minmax(0,1fr); --card-w:clamp(64px,3.4vw,86px); padding:8px; }
.mat__side { display:flex; flex-direction:column; gap:10px; min-width:0; }
.mat__lanes { display:flex; flex-direction:column; gap:7px; min-width:0; }

/* --- The seat: a brass dial and a shelf of piles ------------------------- */
.seat { display:flex; flex-direction:column; gap:9px; align-items:center; padding:9px 8px;
  border-radius:10px; background:rgba(0,0,0,.26); box-shadow:inset 0 2px 8px rgba(0,0,0,.5); }
.seat__name { font-weight:700; font-size:13px; letter-spacing:.02em; text-align:center;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }

/* Life as a dial rather than a number in a box. Physical, and it makes the one
   number people actually hunt for the largest object in the column. */
.dial {
  position:relative; width:clamp(78px,5.2vw,104px); aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center;
  background:
    radial-gradient(circle at 34% 26%, #fbeec2 0%, #d8b055 38%, #8a6a22 72%, #4d3a12 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 0 0 3px rgba(0,0,0,.22),
             inset 0 -6px 14px rgba(0,0,0,.35);
}
.dial::after {
  content:""; position:absolute; inset:7px; border-radius:50%;
  border:1px solid rgba(60,38,8,.5);
}
.dial__n { font-size:clamp(28px,2.1vw,38px); font-weight:900; color:#2a1c04; line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.35); }
.dial--foe { background:radial-gradient(circle at 34% 26%, #f0d6bd 0%, #b98b6a 38%, #6f4c33 72%, #3a2418 100%); }
.dial--active { box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 0 0 3px rgba(0,0,0,.22),
  inset 0 -6px 14px rgba(0,0,0,.35), 0 0 34px rgba(255,206,120,.42); }

.seat__mana { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
.mana-pip { width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.55);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4); }
.mana-pip--W{background:var(--mana-W)} .mana-pip--U{background:var(--mana-U)}
.mana-pip--B{background:var(--mana-B)} .mana-pip--R{background:var(--mana-R)}
.mana-pip--G{background:var(--mana-G)} .mana-pip--C{background:var(--mana-C)}
.mana-pip--any{background:conic-gradient(var(--mana-W) 0 72deg,var(--mana-U) 72deg 144deg,var(--mana-B) 144deg 216deg,var(--mana-R) 216deg 288deg,var(--mana-G) 288deg 360deg)}

/* THE PILES. `Lib 72 / GY 3 / Exile 1` told you a number; a pile tells you the
   number and shows you the shape of the game. Height is the count. */
.piles { display:flex; gap:9px; align-items:flex-end; justify-content:center; padding-top:2px; }
.pile { display:flex; flex-direction:column; align-items:center; gap:4px; }
.pile__stack { position:relative; width:34px; }
.pile__leaf {
  height:3px; border-radius:2px;
  background:linear-gradient(90deg,#2b1d3a,#4a3560 40%,#2b1d3a);
  box-shadow:0 1px 0 rgba(0,0,0,.55);
  margin-bottom:1px;
}
.pile__leaf--top {
  height:22px; border-radius:3px;
  background:linear-gradient(150deg,#43305c,#241834);
  border:1px solid rgba(226,196,132,.28);
  display:grid; place-items:center;
  font-size:10px; font-weight:800; color:var(--brass-hi);
}
.pile__leaf--gy { background:linear-gradient(150deg,#4a3323,#241a12); }
.pile__leaf--ex { background:linear-gradient(150deg,#3a3a48,#1d1d26); }
.pile__label { font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); }
.pile--empty .pile__leaf--top { opacity:.4; }

/* The opponent's whole side column is reference. Left at the viewer's scale it
   makes the opponent row taller than their entire battlefield needs. */
.mat--compact .dial { width:clamp(54px,3.5vw,70px); }
.mat--compact .dial__n { font-size:clamp(20px,1.5vw,27px); }
.mat--compact .seat { gap:6px; padding:7px 6px; }
.mat--compact .piles { gap:6px; }
.mat--compact .pile__stack { width:26px; }

/* --- Lanes --------------------------------------------------------------- */
.lane { display:grid; grid-template-columns:clamp(58px,4vw,80px) minmax(0,1fr); gap:10px;
  align-items:center; padding:4px 8px; border-radius:9px; }
.lane__label { display:flex; flex-direction:column; color:var(--text-faint); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; }
.lane__count { color:var(--text-dim); font-size:15px; font-weight:800; }
.lane__cards { display:flex; flex-wrap:wrap; gap:11px 13px; align-items:flex-start; }
.mat--compact .lane { grid-template-columns:minmax(0,1fr); padding:3px 4px; }
.mat--compact .lane__label { display:none; }
.mat--compact .lane__cards { gap:8px; }

/* --- Cards (parchment) --------------------------------------------------- */
.card { position:relative; width:var(--card-w); height:calc(var(--card-w)*1.4); flex:0 0 auto; }
.card--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.card__pivot { width:100%; height:100%; transform-origin:50% 50%; }
.card--tapped .card__pivot { width:var(--card-w); height:calc(var(--card-w)*1.4);
  margin-left:calc(var(--card-w)*.2); margin-top:calc(var(--card-w)*-.2); transform:rotate(90deg); }
.face {
  position:relative; display:flex; flex-direction:column; width:100%; height:100%;
  padding:calc(var(--card-w)*.045); gap:calc(var(--card-w)*.028); overflow:hidden;
  border:2px solid #3a2a1c; border-radius:var(--card-r);
  background:
    repeating-linear-gradient(102deg, rgba(120,90,50,.05) 0 2px, transparent 2px 6px),
    linear-gradient(160deg, var(--stock) 0%, var(--stock-shade) 100%);
  color:var(--stock-ink); font-size:calc(var(--card-w)*.082); line-height:1.25;
  box-shadow:0 1px 2px rgba(0,0,0,.6), 0 8px 16px rgba(0,0,0,.5);
}
.face--W{border-color:#c9bd90} .face--U{border-color:#456f92} .face--B{border-color:#463f48}
.face--R{border-color:#a55940} .face--G{border-color:#4a7d55} .face--C{border-color:#7e8188}
.face--gold{border-color:#ad9040} .face--land{border-color:#6b5535}
.face--commander { border-color:var(--brass); box-shadow:0 0 0 1px rgba(216,176,85,.6), 0 8px 18px rgba(0,0,0,.55); }
.face--token { border-style:dashed; border-color:#8a8070; }

.face--type-land{--stock:#d6c7a8;--stock-shade:#c6b186}
.face--type-creature{--stock:#ebc9bc;--stock-shade:#e0a894}
.face--type-sorcery{--stock:#eecfdf;--stock-shade:#e1a9c7}
.face--type-enchantment{--stock:#e4d9f1;--stock-shade:#cab5e3}
.face--type-artifact{--stock:#e5eaf0;--stock-shade:#c5d1dd}
.face--type-instant{--stock:#e4f2f7;--stock-shade:#bce0ec}
.face--type-other{--stock:#f8f6f1;--stock-shade:#e7decf}
.face--land-W{--stock:#daca89;--stock-shade:#cdb862}
.face--land-U{--stock:#afcde3;--stock-shade:#8ab6d6}
.face--land-B{--stock:#d1c5da;--stock-shade:#b9a5c6}
.face--land-R{--stock:#ebbfb5;--stock-shade:#e19d8c}
.face--land-G{--stock:#a6d69e;--stock-shade:#85c67a}
.face--land-C{--stock:#c5c9ce;--stock-shade:#aab0b6}
.face--land-multi{--stock:#e2c77d;--stock-shade:#d9b653}

.face__title { display:flex; align-items:flex-start; gap:calc(var(--card-w)*.03); font-weight:700; }
.face__glyph { flex:0 0 auto; color:var(--stock-ink-dim); font-size:calc(var(--card-w)*.088); line-height:1.15; }
.face__name { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:calc(var(--card-w)*.086); }
.face__cost { display:flex; flex:0 0 auto; gap:1px; }
.face__type { padding-bottom:calc(var(--card-w)*.02); border-bottom:1px solid var(--stock-rule);
  color:var(--stock-ink-dim); font-size:calc(var(--card-w)*.066); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.face__watermark { display:flex; flex:1; align-items:center; justify-content:center; gap:calc(var(--card-w)*.04); min-height:0; }
.watermark-pip { display:flex; align-items:center; justify-content:center;
  width:calc(var(--card-w)*.3); height:calc(var(--card-w)*.3); border-radius:50%;
  border:1px solid rgba(0,0,0,.18); color:rgba(255,255,255,.92);
  font-size:calc(var(--card-w)*.15); font-weight:800; line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.35); box-shadow:inset 0 -2px 3px rgba(0,0,0,.2); }
.watermark-pip--W{background:var(--mana-W);color:rgba(40,34,20,.85);text-shadow:none}
.watermark-pip--U{background:var(--mana-U)} .watermark-pip--B{background:var(--mana-B)}
.watermark-pip--R{background:var(--mana-R)} .watermark-pip--G{background:var(--mana-G)}
.watermark-pip--C{background:var(--mana-C);color:rgba(40,40,44,.85);text-shadow:none}
.face__rules { display:flex; flex:1; flex-direction:column; justify-content:safe center; overflow:hidden; font-size:calc(var(--card-w)*.064); line-height:1.32; }
.face__keywords { flex:1; overflow:hidden; color:#4a6b52; font-size:calc(var(--card-w)*.068); font-weight:600; }
.face__footer { display:flex; align-items:flex-end; gap:4px; margin-top:auto; }
.face__stats { padding:0 calc(var(--card-w)*.04); border:1px solid var(--stock-rule);
  border-radius:calc(var(--card-w)*.03); background:rgba(255,255,255,.55);
  font-size:calc(var(--card-w)*.095); font-weight:800; font-variant-numeric:tabular-nums; }
.face__tag { position:absolute; padding:0 3px; border-radius:3px; font-size:calc(var(--card-w)*.055); font-weight:800; }
.face__tag--cmd { bottom:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:var(--brass); color:#2a1e05; }
.face__tag--sick { top:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:rgba(0,0,0,.42); color:#fff; }

.pip { display:inline-flex; align-items:center; justify-content:center;
  min-width:calc(var(--card-w)*.115); height:calc(var(--card-w)*.115); padding:0 2px;
  border-radius:999px; background:var(--mana-generic); color:#1a1a1a;
  font-size:calc(var(--card-w)*.072); font-weight:800; box-shadow:inset 0 -1px 1px rgba(0,0,0,.25); }
.pip--W{background:var(--mana-W)} .pip--U{background:var(--mana-U)} .pip--B{background:var(--mana-B)}
.pip--R{background:var(--mana-R)} .pip--G{background:var(--mana-G)} .pip--C{background:var(--mana-C)}
.pip--tap{background:#4a4f52;color:#f2f5f4}
.pip--inline{min-width:1.2em;height:1.2em;margin:0 .08em;padding:0;font-size:.9em;line-height:1;vertical-align:-.2em}

.card::after { content:""; position:absolute; inset:-3px; border-radius:calc(var(--card-r)+3px); pointer-events:none; opacity:0; }
.card--playable::after { opacity:1; box-shadow:0 0 0 2px var(--playable), 0 0 18px rgba(127,227,156,.45); }
.card--staged::after { opacity:1; box-shadow:0 0 0 3px var(--staged), 0 0 22px rgba(255,193,77,.5); }

/* The ability rune: a wax-red seal here rather than 01's violet halo, so the
   two mockups can be compared on whether the affordance needs to glow at all. */
.card--ability::after { opacity:1; box-shadow:0 0 0 2px var(--ability), 0 0 20px rgba(195,155,255,.4); }
.rune {
  position:absolute; z-index:5; top:calc(var(--card-w)*-.08); right:calc(var(--card-w)*-.08);
  display:grid; place-items:center; width:calc(var(--card-w)*.32); height:calc(var(--card-w)*.32);
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #f0e0ff, #7d55c9);
  border:1px solid #efe4ff; color:#22103a;
  font-size:calc(var(--card-w)*.17); font-weight:900; line-height:1;
  box-shadow:0 0 15px rgba(195,155,255,.7), 0 2px 5px rgba(0,0,0,.55);
}
.ability-pop {
  position:absolute; z-index:20; left:calc(100% + 14px); top:0;
  width:max(240px, calc(var(--card-w)*2.2)); padding:11px 13px; border-radius:10px;
  background:linear-gradient(180deg,#2f1b3d,#1c1026);
  border:1px solid rgba(195,155,255,.5);
  box-shadow:0 18px 44px rgba(0,0,0,.75);
}
.ability-pop::after { content:""; position:absolute; right:100%; top:16px;
  border:7px solid transparent; border-right-color:#2f1b3d; }
.ability-pop__label { color:var(--ability); font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
.ability-pop__text { margin:5px 0 9px; font-size:12px; line-height:1.4; color:var(--text); }
.ability-pop__go { width:100%; padding:7px 0; border-radius:8px; border:1px solid rgba(195,155,255,.55);
  background:linear-gradient(180deg,#7f5cc8,#553b92); color:#f6efff; font-size:12.5px; font-weight:800; }

.cardstack { position:relative; flex:0 0 auto; width:var(--card-w); height:calc(var(--card-w)*1.4); }
.cardstack--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.cardstack__slot { position:absolute; top:0; left:0; }
.cardstack__count { position:absolute; right:-7px; bottom:-7px; z-index:40; min-width:24px;
  padding:1px 6px; border-radius:999px; background:#2a1a0a; border:1px solid var(--brass-lo);
  color:var(--brass-hi); font-size:11.5px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; }

/* --- The stack, as a real leaning pile ----------------------------------- */
.stackpile { position:relative; height:calc(var(--card-w)*1.4 + 40px); --card-w:clamp(84px,5vw,112px); }
.stackpile__ply { position:absolute; left:0; }
.stackpile__tag { display:flex; gap:5px; align-items:center; margin-top:3px; font-size:10px; }
.stackpile__next { padding:0 5px; border-radius:3px; background:var(--brass); color:#2a1e05; font-weight:800; text-transform:uppercase; }

/* --- Right rail ---------------------------------------------------------- */
.preview { padding:12px; display:flex; flex-direction:column; gap:10px; align-items:center; flex:0 0 auto; }
.preview .card { --card-w:clamp(134px,8.5vw,178px); }
.preview__facts { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; width:100%; margin:0; font-size:11.5px; }
.preview__facts dt { color:var(--text-faint); }
.preview__facts dd { margin:0; color:var(--text-dim); }

.acts { padding:12px; display:flex; flex-direction:column; gap:9px; flex:1 1 auto; min-height:0; }
.acts__prompt { font-size:13.5px; font-weight:700; color:var(--brass-hi); }
.acts__hint { margin:0; color:var(--text-dim); font-size:11.5px; line-height:1.4; }
.acts__list { display:flex; flex-direction:column; gap:6px; overflow-y:auto; min-height:0; flex:1 1 auto; }

/* Tier 2: brass plates, screwed down. */
.opt {
  display:flex; align-items:center; gap:9px; width:100%; padding:8px 11px; border-radius:7px;
  border:1px solid rgba(216,176,85,.22); background:rgba(0,0,0,.26);
  color:var(--text); font-size:12.5px; text-align:left;
  box-shadow:inset 0 1px 0 rgba(255,220,170,.08);
}
.opt:hover { border-color:rgba(216,176,85,.5); background:rgba(216,176,85,.1); }
.opt--on { border-color:var(--staged); background:rgba(255,193,77,.15); color:#ffe0a4; }
.opt__pt { margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; opacity:.85; }
.opt__key { display:grid; place-items:center; width:19px; height:19px; border-radius:4px;
  background:rgba(216,176,85,.16); border:1px solid rgba(216,176,85,.3);
  color:var(--brass-hi); font-size:10.5px; font-weight:800; }

.tools { display:flex; align-items:center; gap:5px; padding-top:9px; border-top:1px solid rgba(216,176,85,.18); }
.tool { display:grid; place-items:center; min-width:30px; height:28px; padding:0 8px; border-radius:6px;
  border:1px solid transparent; background:transparent; color:var(--text-faint); font-size:11.5px; font-weight:600; }
.tool:hover { background:rgba(216,176,85,.12); color:var(--text); }
.tool--on { color:var(--brass-hi); border-color:rgba(216,176,85,.4); }
.speed { display:flex; margin-right:auto; border:1px solid rgba(216,176,85,.24); border-radius:6px; overflow:hidden; }
.speed button { padding:4px 9px; border:0; background:rgba(0,0,0,.3); color:var(--text-faint); font-size:11px; font-weight:700; }
.speed button.on { background:var(--brass); color:#2a1e05; }

/* --- THE WAX SEAL -------------------------------------------------------- */
.seal-dock { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:10px; }
.seal {
  position:relative; width:150px; height:150px; border:0; padding:0; border-radius:50%;
  background:
    radial-gradient(circle at 36% 28%, #f0655a 0%, #c33124 38%, #8d1d15 74%, #5c110c 100%);
  color:#ffe9df;
  clip-path:polygon(50% 0%,61% 6%,73% 3%,80% 13%,92% 15%,94% 27%,100% 37%,96% 50%,100% 63%,
                    94% 73%,92% 85%,80% 87%,73% 97%,61% 94%,50% 100%,39% 94%,27% 97%,20% 87%,
                    8% 85%,6% 73%,0% 63%,4% 50%,0% 37%,6% 27%,8% 15%,20% 13%,27% 3%,39% 6%);
  filter:drop-shadow(0 0 26px rgba(224,90,70,.4)) drop-shadow(0 8px 16px rgba(0,0,0,.65));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
}
.seal:hover { filter:drop-shadow(0 0 40px rgba(224,90,70,.6)) drop-shadow(0 10px 20px rgba(0,0,0,.65)); }
.seal__verb { font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; opacity:.72; }
.seal__main { font-size:19px; font-weight:900; line-height:1.05; text-align:center; max-width:112px; }
.seal__key { font-size:10px; font-weight:700; opacity:.62; margin-top:2px; }
.seal-alt { display:flex; gap:7px; }
.seal-alt button { padding:7px 14px; border-radius:999px; border:1px solid rgba(216,176,85,.3);
  background:rgba(0,0,0,.4); color:var(--text-dim); font-size:12px; font-weight:600; }
.seal-alt button:hover { color:var(--text); border-color:var(--brass); }

/* --- Foot ---------------------------------------------------------------- */
.table__foot {
  display:flex; flex-direction:column; gap:6px; padding:8px 14px 12px;
  border-top:2px solid var(--brass-lo);
  background:linear-gradient(180deg, #2c1a0d, #150c06);
}
.strike { display:flex; align-items:center; gap:14px; padding:8px 14px; border-radius:10px;
  background:rgba(255,193,77,.07); border:1px solid rgba(255,193,77,.28); }
.strike__title { margin:0; font-size:13px; font-weight:800; color:var(--staged); }
.strike__hint { margin:1px 0 0; color:var(--text-dim); font-size:11.5px; }
.strike__list { display:flex; gap:8px; flex:1; min-width:0; overflow-x:auto; padding:1px; }
.atk { display:flex; align-items:center; gap:9px; padding:5px 11px 5px 7px; border-radius:8px;
  border:1px solid rgba(255,193,77,.5); background:rgba(255,193,77,.13); white-space:nowrap; }
.atk__pt { display:grid; place-items:center; min-width:34px; height:26px; border-radius:5px;
  background:rgba(255,193,77,.9); color:#2a1e05; font-size:12.5px; font-weight:900; font-variant-numeric:tabular-nums; }
.atk__name { font-size:12.5px; font-weight:600; color:#ffe6b4; max-width:170px; overflow:hidden; text-overflow:ellipsis; }
.atk__at { color:var(--text-faint); font-size:11px; }
.atk__foe { font-size:12px; color:#ffb9b2; font-weight:700; }
.atk--ghost { border-style:dashed; border-color:rgba(216,176,85,.24); background:transparent; }
.atk--ghost .atk__pt { background:rgba(255,255,255,.08); color:var(--text-dim); }
.atk--ghost .atk__name { color:var(--text-faint); }
.strike__sum { text-align:right; }
.strike__dmg { font-size:23px; font-weight:900; color:var(--attacking); line-height:1; }
.strike__dmg-label { font-size:10px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; }

/* The hand rests on a leather rail. */
.hand-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:flex-end; gap:14px; }
.cmdzone { padding:7px; border-radius:10px; border:1px solid rgba(216,176,85,.34); background:rgba(216,176,85,.08); }
.cmdzone__label { color:var(--brass); font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
.cmdslot { position:relative; --card-w:clamp(76px,4.3vw,104px); margin-top:5px; }
.mat--compact .cmdslot { --card-w:clamp(46px,2.5vw,60px); }
.mat--compact .cmdzone { padding:4px; }
.mat--compact .cmdzone__label { display:none; }
.cmdslot__tax { position:absolute; top:-7px; right:-7px; padding:1px 7px; border-radius:999px;
  background:#2a2008; border:1px solid var(--brass-lo); color:var(--brass-hi); font-size:10.5px; font-weight:800; }
.cmdslot__where { display:block; padding-top:3px; color:var(--text-faint); font-size:9.5px; text-align:center; }

.hand {
  position:relative; display:flex; justify-content:center;
  --card-w:clamp(94px,5.5vw,140px);
  min-height:calc(var(--card-w)*1.4 + 44px); padding:10px 0 16px;
}
.hand::before {
  content:""; position:absolute; left:2%; right:2%; bottom:6px; height:16px; border-radius:9px;
  background:linear-gradient(180deg,#5a2228,#2c1013);
  box-shadow:inset 0 1px 0 rgba(255,220,170,.16), 0 4px 10px rgba(0,0,0,.55);
}
.hand__rail { position:relative; height:calc(var(--card-w)*1.4); }
.hand__slot { position:absolute; top:0; transform-origin:50% 130%; }

.acts__list { min-height:74px; }

/* Short viewports -- see 01 for the reasoning. Height-keyed, not width-keyed. */
@media (max-height: 1050px) {
  :root { --card-w: clamp(50px, 5.9vh, 92px); }
  .mat--compact { --card-w: clamp(42px, 5vh, 70px); }
  .preview .card { --card-w: clamp(88px, 11.5vh, 130px); }
  .hand { --card-w: clamp(72px, 9.8vh, 112px); }
  .cmdslot { --card-w: clamp(54px, 7.4vh, 84px); }
  .mat--compact .cmdslot { --card-w: clamp(32px, 4.3vh, 50px); }
  .dial { width:clamp(58px, 7.8vh, 84px); }
  .dial__n { font-size:clamp(22px, 3vh, 31px); }
  .mat--compact .dial { width:clamp(42px, 5.6vh, 58px); }
  .mat--compact .dial__n { font-size:clamp(16px, 2.2vh, 22px); }
  .seal { width:120px; height:120px; }
  .seal__main { font-size:16px; max-width:92px; }
}
</style>

const OPP_COMMANDER = {n:"Edgar Markov",cost:"3RWB",tl:"Legendary Creature — Vampire Knight",t:"creature",f:"gold",pt:"4/4",kw:"First strike",cmd:true};
const LOG = [["— Your turn 8 —",1],["You play Forest",0],["Zendikar's Roil creates a 2/2 Elemental",0],
  ["Aesi, Tyrant of Gyre Strait draws you a card",0],["You cast Acidic Slime",0],["Acidic Slime destroys Bloodcrypt Vault",0]];

const GLYPH = {creature:"◆",land:"▲",artifact:"■",enchantment:"✦",instant:"»",sorcery:"●",planeswalker:"★",other:"·"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function pips(cost){ if(!cost) return "";
  return [...cost.matchAll(/(\d+|[WUBRGC])/g)].map(m=>`<span class="pip pip--${/^[WUBRGC]$/.test(m[1])?m[1]:"generic"}">${m[1]}</span>`).join(""); }
function sym(text){ return esc(text).replace(/\{([^}]+)\}/g,(whole,s)=>{ const S=s.toUpperCase();
  if(/^[WUBRGC]$/.test(S)) return `<span class="pip pip--inline pip--${S}">${S}</span>`;
  if(S==="T") return `<span class="pip pip--inline pip--tap">↷</span>`;
  if(/^\d+$/.test(S)) return `<span class="pip pip--inline">${S}</span>`; return whole; }); }
function face(c,detail){
  const cls=["face",`face--${c.f}`,`face--type-${c.t}`,c.land?`face--land-${c.land}`:"",c.cmd?"face--commander":"",c.token?"face--token":""].filter(Boolean).join(" ");
  const wm=c.produces?`<div class="face__watermark">${[...c.produces].map(s=>`<span class="watermark-pip watermark-pip--${s}">${s}</span>`).join("")}</div>`:"";
  const body=detail&&c.rules?`<div class="face__rules">${sym(c.rules)}</div>`:(!detail&&c.kw?`<div class="face__keywords">${esc(c.kw)}</div>`:"");
  return `<div class="${cls}"><div class="face__title"><span class="face__glyph">${GLYPH[c.t]||"·"}</span>
    <span class="face__name">${esc(c.n)}</span>${c.cost?`<span class="face__cost">${pips(c.cost)}</span>`:""}</div>
    <div class="face__type">${esc(c.tl)}</div>${wm}${body}
    <div class="face__footer"><span class="spacer"></span>${c.pt?`<span class="face__stats">${c.pt}</span>`:""}</div>
    ${c.cmd?`<span class="face__tag face__tag--cmd">CMD</span>`:""}
    ${c.sick?`<span class="face__tag face__tag--sick">&#9203;</span>`:""}</div>`;
}
function card(c,{detail=false,extra=""}={}){
  const mods=["card",c.tapped?"card--tapped":"",c.staged?"card--staged":"",
    c.playable||c.candidate?"card--playable":"",c.ability?"card--ability":"",extra].filter(Boolean).join(" ");
  const rune=c.ability?`<span class="rune">↷</span>`:"";
  const pop=c.abilityOpen?`<div class="ability-pop"><div class="ability-pop__label">Ability available</div>
    <div class="ability-pop__text">${sym(c.ability)}</div><button class="ability-pop__go">Activate</button></div>`:"";
  return `<div class="${mods}"><div class="card__pivot">${face(c,detail)}</div>${rune}${pop}</div>`;
}
function pile(c,opts){
  if(!c.count||c.count<2) return card(c,opts);
  const back=card({...c,ability:null,abilityOpen:false,staged:false},opts);
  return `<div class="cardstack${c.tapped?" cardstack--tapped":""}">
    <div class="cardstack__slot" style="transform:translate(8px,-5px);opacity:.85">${back}</div>
    <div class="cardstack__slot">${card(c,opts)}</div>
    <span class="cardstack__count">×${c.count}</span></div>`;
}
function lane(label,cards,{compact=false}={}){
  const total=cards.reduce((n,c)=>n+(c.count||1),0);
  return `<div class="lane">${compact?"":`<div class="lane__label"><span>${label}</span><span class="lane__count tabular">${total}</span></div>`}
    <div class="lane__cards">${cards.map(c=>pile(c)).join("")}</div></div>`;
}
function manaRow(spec){ return spec.map(s=>`<span class="mana-pip mana-pip--${s}"></span>`).join(""); }

/** A zone drawn as the pile it is. Leaf count is capped; the number is exact. */
function zonePile(label,count,kind){
  const leaves=Math.min(9,Math.ceil(count/9));
  return `<div class="pile${count?"":" pile--empty"}">
    <div class="pile__stack">
      ${Array.from({length:leaves},()=>`<div class="pile__leaf pile__leaf--${kind}"></div>`).join("")}
      <div class="pile__leaf pile__leaf--top pile__leaf--${kind}">${count}</div>
    </div>
    <div class="pile__label">${label}</div></div>`;
}

function handFan(){
  const n=HAND.length, spread=120, arc=2.2, width=(n-1)*spread+142;
  const slots=HAND.map((c,i)=>{ const mid=(n-1)/2, rot=(i-mid)*arc, droop=Math.abs(i-mid)**2*1.3;
    const hovered=i===4, y=hovered?-46:droop;
    return `<div class="hand__slot" style="left:${i*spread}px;z-index:${hovered?40:i};
      transform:rotate(${rot}deg) translateY(${y}px) ${hovered?"scale(1.06)":""}">${card(c,{detail:true})}</div>`;
  }).join("");
  return `<div class="hand"><div class="hand__rail" style="width:${width}px">${slots}</div></div>`;
}

          <span class="seal__main">Attack with 3</span>
          <span class="seal__key">↵ Enter</span>
        </button>
        <div class="seal-alt"><button>All attack (2)</button><button>No attacks</button></div>
      </div>
    </aside>
  </div>

  <div class="table__foot">
    <div class="strike">
      <div><h3 class="strike__title">Attacking</h3><p class="strike__hint">Nothing is committed until you confirm.</p></div>
      <div class="strike__list">
        <span class="atk"><span class="atk__pt">7/7</span><span class="atk__name">Gyre Strait Leviathan</span><span class="atk__at">→</span><span class="atk__foe">Edgar Markov</span></span>
        <span class="atk"><span class="atk__pt">5/5</span><span class="atk__name">Aesi, Tyrant of Gyre Strait</span><span class="atk__at">→</span><span class="atk__foe">Edgar Markov</span></span>
        <span class="atk"><span class="atk__pt">2/2</span><span class="atk__name">Elemental Token</span><span class="atk__at">→</span><span class="atk__foe">Edgar Markov</span></span>
        <span class="atk atk--ghost"><span class="atk__pt">2/2</span><span class="atk__name">Elemental Token</span></span>
        <span class="atk atk--ghost"><span class="atk__pt">1/1</span><span class="atk__name">Elvish Visionary</span></span>
      </div>
      <div class="strike__sum"><div class="strike__dmg tabular">14</div><div class="strike__dmg-label">damage if unblocked</div></div>
    </div>
    <div class="hand-row">
      <div class="cmdzone">
        <div class="cmdzone__label">Commander</div>
        <div class="cmdslot">${card(COMMANDER,{detail:true})}<span class="cmdslot__tax">+4</span>
          <span class="cmdslot__where">On the battlefield</span></div>
      </div>
      ${handFan()}
    </div>
  </div>
</div>`;
</script>
</body>
</html>
