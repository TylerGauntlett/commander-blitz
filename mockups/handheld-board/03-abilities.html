/* ===========================================================================
   3. THE CARD FACE
   ---------------------------------------------------------------------------
   One face, three scales. See `.face--board` in `_board.css` for what a board
   card drops and why.
   ======================================================================== */

function faceHTML(c, opts) {
  opts = opts || {};
  const art = ART(c.art);
  const cls = [
    "face",
    "face--" + (c.f || "default"),
    opts.board ? "face--board" : "",
    c.tapped ? "face--tapped" : "",
    c.sick ? "face--sick" : "",
    c.ability || opts.badge ? "face--marked" : "",
    c.count > 1 ? "face--counted" : "",
    opts.rim ? "face--" + opts.rim : "",
    opts.cls || "",
  ].filter(Boolean).join(" ");

  const badge = opts.badge
    ? '<span class="face__badge face__badge--' + opts.badge.kind + '" data-name aria-label="' +
      esc(opts.badge.label) + '">' + opts.badge.mark + "</span>"
    : "";

  return (
    '<div class="' + cls + '" data-nm="' + esc(c.n) + '">' +
      (art
        ? '<img class="face__art" src="' + art + '" alt="" loading="lazy">'
        /* A crop this repo has not fetched and a printing that genuinely has no
           art look identical, which is `logic/cardArt.ts`'s own problem: it
           returns `undefined` for the first and `null` for the second. Three
           cards on this board are in the first case -- see README.md. */
        : '<div class="face__noart" aria-hidden="true">' + (TYPE_GLYPH[c.t] || "◇") + "</div>") +
      '<div class="face__head">' +
        '<span class="face__glyph" aria-hidden="true">' + (TYPE_GLYPH[c.t] || "◇") + "</span>" +
        '<span class="face__name">' + (c.cmd ? "♛ " : "") + esc(c.n) + "</span>" +
        (c.cost ? '<span class="face__cost">' + costHTML(c.cost) + "</span>" : "") +
      "</div>" +
      '<div class="face__foot">' +
        (c.land ? '<span class="face__land">' + producesHTML(c.land) + "</span>" : "") +
        (c.pt ? '<span class="face__pt">' + esc(c.pt) + "</span>" : "") +
      "</div>" +
      (c.count > 1 ? '<span class="face__count" data-name aria-label="' + esc(c.count + " of them") + '">×' + c.count + "</span>" : "") +
      (c.ability ? '<span class="face__rune" data-name aria-label="Has an activated ability">↻</span>' : "") +
      badge +
    "</div>"
  );
}

/* ===========================================================================
   4. THE OPPONENT SEAT -- `../seat/06-muster.html`
   ======================================================================== */

/** How many actual objects a lane holds, counting a x7 stack as seven. This is
    what a "12 lands" readout means, and getting it from `count` rather than
    `length` is the difference between the readout and the row agreeing. */
const countOf = (cards) => cards.reduce((n, c) => n + (c.count || 1), 0);
const countIf = (cards, f) => cards.reduce((n, c) => n + (f(c) ? (c.count || 1) : 0), 0);

/*
 * THE FIVE FACTS THE SEAT IS ORGANISED AROUND, derived rather than declared.
 *
 *     how many lands       how many of them are untapped
 *     how many creatures   how many of them are untapped
 *     how many other permanents
 *
 * Read against the shipped strip that list is almost entirely missing: lands are
 * not in the model at all and `manaOpen` has been standing in for them, which
 * counts UNTAPPED SOURCES and is silent about how many exist -- so a seat at five
 * lands with none open and a seat at one land read identically.
 */
function musterOf(seat) {
  return {
    lands: countOf(seat.lands),
    landsUp: countIf(seat.lands, (c) => !c.tapped),
    creatures: countOf(seat.creatures),
    creaturesUp: countIf(seat.creatures, (c) => !c.tapped),
    power: seat.creatures.reduce((n, c) => n + (c.power || 0) * (c.count || 1), 0),
    fliers: countIf(seat.creatures, (c) => c.flying),
    other: countOf(seat.other),
  };
}

/** Who could have hit this seat with a commander, in seating order from you. */
function sources(pid) {
  return [0, 1, 2, 3]
    .filter((p) => p !== pid)
    .map((p) => ({ pid: p, n: (DMG[pid] || {})[p] || 0, who: NAMES[p], cmdr: CMDRS[p] }));
}

/**
 * The zones, in the shipped order.
 *
 * `PlayerOrb.tsx` already argues the case for the library: "hidden information,
 * and a control that does nothing when clicked is worse than no control". An
 * opponent's HAND is the same fact -- `types.ts` sends `hand: null` for every
 * seat but the viewer -- unless `hand_revealed` is non-empty, which is Marco's
 * case here. Exile appears the moment anything is exiled and is NOT a fixed
 * slot, so a seat shows four marks or five, which is the reflow the row has to
 * survive.
 */
function zonesOf(seat) {
  const z = [
    { name: "library", label: "Library", icon: "lib", kind: "lib", count: seat.lib, peek: false },
    { name: "hand", label: "Hand", icon: "hand", kind: "hand", count: seat.hand, peek: !!seat.revealed },
    { name: "graveyard", label: "Graveyard", icon: "gy", kind: "gy", count: seat.gy, peek: true },
  ];
  if (seat.exile > 0) z.push({ name: "exile", label: "Exile", icon: "ex", kind: "ex", count: seat.exile, peek: true });
  z.push({ name: "command", label: "Command zone", icon: "cmd", kind: "cmd", count: seat.cmd, peek: true });
  return z;
}

/* One function for all three counts, because they are one object drawn three
   times: an icon, `untapped/total`, and a ground filled to that fraction. `open`
   is null for the cell that has no tapped state to draw. */
function permCell(kind, icon, total, open, label) {
  const frac = open === null ? "" : ' style="--fill:' + pct(open, total) + '"';
  const text = open === null ? total : open + "/" + total;
  return (
    '<span class="perm perm--' + kind + (total === 0 ? " perm--zero" : "") + '"' + frac +
      ' data-cell data-name aria-label="' + esc(label) + '">' +
      ico(icon) + "<span>" + text + "</span>" +
    "</span>"
  );
}

/* Eight pips and then a count: past eight the extra pips say nothing a reader
   can use, and the cap costs resolution and never information because the COUNT
   is on the creature cell beside them. */
const MAX_PIPS = 8;

function detailCell(m) {
  const n = Math.min(m.creatures, MAX_PIPS);
  let up = m.creaturesUp;
  let fly = m.fliers;
  const out = [];
  for (let i = 0; i < n; i += 1) {
    /* Untapped first and fliers first, so the pips a player cares about are the
       ones that survive the cap. */
    const isUp = up-- > 0;
    const isFly = fly-- > 0;
    out.push('<span class="tpip' + (isUp ? " tpip--up" : "") + (isFly ? " tpip--fly" : "") + '"></span>');
  }
  const more = m.creatures > MAX_PIPS ? '<span class="pips__more">+' + (m.creatures - MAX_PIPS) + "</span>" : "";
  const label = (m.fliers ? plural(m.fliers, "flier") + ", " : "") + m.power + " power on board";
  return (
    '<span class="perm perm--detail" data-cell data-name aria-label="' + esc(label) + '">' +
      '<span class="pips">' + (out.join("") || '<span class="pips__more">none</span>') + more + "</span>" +
      '<span class="perm__pow">' + ico("power") + "<span>" + m.power + "</span></span>" +
    "</span>"
  );
}

function seatHTML(seat, flags) {
  flags = flags || {};
  const m = musterOf(seat);
  const cls = [
    "seat",
    flags.active ? "seat--active" : "",
    flags.targetable ? "seat--targetable" : "",
  ].filter(Boolean).join(" ");

  /* The ticks close from the right, stacked and each offset by the ones outside
     it, so the track reads as one bar eaten from both ends. */
  let offset = 0;
  const all = sources(seat.pid);
  const ticks = all
    .filter((s) => s.n > 0)
    .map((s) => {
      const w = (Math.min(s.n, LETHAL) / LETHAL) * 100;
      const html =
        '<span class="tick' + (s.n >= WARN ? " tick--warn" : "") + '" data-name ' +
        'style="--w:' + w + "%; right:" + offset + '%" aria-label="' +
        esc(s.n + " of " + LETHAL + " from " + s.who + " — " + s.cmdr) + '"></span>';
      offset += w;
      return html;
    })
    .join("");

  const worst = all.slice().sort((a, b) => b.n - a.n)[0] || { n: 0, who: "nobody" };
  const gaugeLabel =
    seat.life + " life of 40 — " +
    (worst.n === 0 ? "no commander damage yet"
      : "worst commander damage " + worst.n + " of " + LETHAL + " from " + worst.who);

  const zone = zonesOf(seat).map((z) =>
    '<span class="zmark zmark--' + z.kind + (z.count > 0 ? "" : " zmark--empty") + '"' +
    ' data-cell data-name data-testid="pile-' + seat.pid + "-" + z.name + '"' +
    ' aria-label="' + esc(z.label + ": " + z.count + (z.peek ? " — opens in the seat sheet" : "")) + '">' +
    ico(z.icon) + z.count + "</span>"
  ).join("");

  /* THE SEAT IS THE TARGET. It takes the player-target action when one is legal
     and otherwise opens the seat sheet -- through `onSelect` and never a
     `data-action-id`, which `e2e/cycle3.spec.ts` asserts the action panel owns
     alone. 332x96 of target, which clears every floor in the round. */
  return (
    '<button class="' + cls + '" type="button" data-stop="seat-' + seat.pid + '"' +
      ' data-testid="player-' + seat.pid + '" data-seat="' + seat.pid + '">' +
      '<img class="seat__ground" src="../art/' + seat.art + '" alt="" aria-hidden="true">' +
      '<span class="seat__veil" aria-hidden="true"></span>' +
      (flags.active ? '<span class="seat__pri"></span>' : "") +

      '<span class="seat__win"><img src="../art/' + seat.art + '" alt="" aria-hidden="true"></span>' +

      '<span class="seat__head">' +
        '<span class="seat__name">' + esc(seat.name) + "</span>" +
        '<span class="seat__cmdr">' + esc(seat.cmdrName) + "</span>" +
      "</span>" +

      '<span class="gauge" data-cell data-name style="--fill:' +
        (Math.min(seat.life / 40, 1) * 100) + '%" aria-label="' + esc(gaugeLabel) + '">' +
        ticks +
        '<span class="seat__life tabular" data-testid="life-' + seat.pid + '">' + seat.life + "</span>" +
        '<span class="gauge__dmg' + (worst.n >= WARN ? " gauge__dmg--warn" : "") +
          (worst.n === 0 ? " gauge__dmg--zero" : "") + '">' + ico("crown") + worst.n + "</span>" +
      "</span>" +

      '<span class="seat__perms">' +
        permCell("land", "land", m.lands, m.landsUp,
          plural(m.lands, "land") + " — " + m.landsUp + " untapped, " + (m.lands - m.landsUp) + " tapped") +
        permCell("creature", "creature", m.creatures, m.creaturesUp,
          plural(m.creatures, "creature") + " — " + m.creaturesUp + " untapped, " + (m.creatures - m.creaturesUp) + " tapped") +
        permCell("other", "other", m.other, null,
          m.other === 0 ? "No artifacts or enchantments"
          : m.other === 1 ? "1 artifact or enchantment"
          : m.other + " artifacts or enchantments") +
        detailCell(m) +
      "</span>" +
      '<span class="seat__zones">' + zone + "</span>" +
    "</button>"
  );
}

/* ===========================================================================
   5. THE VIEWER'S HALF
   ======================================================================== */

/* ===========================================================================
   THE PLAYER ORB -- `../self/03-plinth.html`, carried over
   ---------------------------------------------------------------------------
   `../self/` drew five directions for exactly this panel, in exactly this
   palette, against three real muster seats and ghosted lanes. Plinth is the one
   picked, and it arrives here unchanged in idea: the commander's art as the
   panel's ground, the portrait as the button that casts them, and life as a dial
   stamped over the portrait's corner.

   THREE THINGS THIS SCREEN LETS IT BE CHECKED AGAINST, none of which its own
   round could:

     1. THE POD ARGUMENT. Plinth exists because "a pod today is three decks and a
        control panel". Here the three decks are drawn six pixels above it, so
        whether the fourth seat now reads as a seat is a thing you can look at.
     2. THE CHIP-SIZE ARGUMENT. `../self/` reasoned its way from 72px zone chips
        down to a seat's 21px by imagining them beside an opponent's. Both are on
        screen now.
     3. THE CROP. Its stated price was showing 40% of the painting's width. This
        layout's shorter column refunds most of that -- see `_board.css`.

   `f` is `{ active, priority, out, noart, spending }` and comes from the mount.
   ======================================================================== */

/** Converted mana cost. `{4}{G}{U}` is six: the generic is worth its number and
    every coloured pip is worth one. */
const cmv = (cost) => cost.reduce((n, tok) => n + (/^\d+$/.test(tok) ? +tok : 1), 0);

const manaTotal = (v) => v.mana.reduce((n, g) => n + g.open, 0);

/** The commander's cost, plus the tax if any is owed. The tax rides beside the
    cost it modifies, which is the only arrangement in which a surcharge means
    anything -- `PlayerOrb.tsx` puts it here for the same reason. */
const cmdrCost = (v) =>
  v.cost.map(symHTML).join("") + (v.tax > 0 ? '<span class="tax tabular">+' + v.tax + "</span>" : "");

/**
 * WHAT THE PORTRAIT BUTTON IS DOING, which is the one piece of state on this
 * panel that decides whether a control does anything.
 *
 *   board   on the battlefield                        -- not a cast, nothing to price
 *   ready   in the command zone, and you can pay      -- `--playable`, green
 *   short   in the command zone, and you cannot       -- priced, not lit
 *
 * CASTABLE AND AFFORDABLE ARE TWO DIFFERENT THINGS. The shipped orb lights the
 * plinth on `playableOids`, which already folds the payment in, so this computes
 * the same split from the fixture rather than inventing a third rule.
 *
 * ON ALL THREE FILES HERE THE STATE IS `board`: Aesi is on the battlefield in
 * this fixture, so the button is `aria-disabled`, carries no price, and says
 * "In play". That is worth naming rather than leaving as a coincidence -- it is
 * the state in which plinth's portrait is NOT a control, and it is the state a
 * board round is most often in. `../self/` reaches `ready` and `short` through
 * its `s` walk; this round has no `s` walk, so those two are unexercised here
 * and the code path is kept rather than trimmed so that stays visible.
 */
function cmdrState(v, f) {
  if (f.out) return { word: "Out", long: "Eliminated", cls: "out", cast: false };
  if (v.cmd > 0) {
    const need = cmv(v.cost) + v.tax;
    return manaTotal(v) >= need
      ? { word: "Ready", long: "Ready to cast", cls: "ready", cast: true }
      : { word: "Need " + need, long: "In the command zone — " + need + " mana to cast",
          cls: "short", cast: true };
  }
  return { word: "In play", long: "On the battlefield", cls: "board", cast: false };
}

/**
 * The portrait, as the control it is.
 *
 * NEVER `disabled`, always `aria-disabled`. A disabled control dispatches no
 * mouse events, so "the full card is one hover away in the reader" would be
 * false for a commander you cannot currently cast -- which is most of the game.
 * `../orb/README.md` records the fix; the click is gated in the handler instead.
 *
 * `data-card` rather than a special case: the portrait names the same card the
 * mat draws, so pointing at it fills the rail's reader like anything else. That
 * is a join `../self/` could not have -- it had no reader to fill.
 */
function winButton(v, f) {
  const st = cmdrState(v, f);
  const cls = ["win", "win--" + st.cls, f.noart ? "win--empty" : ""].filter(Boolean).join(" ");
  const label = v.cmdrName + " — " + st.long +
    (st.cast ? ", costs " + v.cost.join("") + (v.tax ? " plus " + v.tax + " commander tax" : "") : "");

  return (
    '<button type="button" class="' + cls + '"' +
      (st.cast ? "" : ' aria-disabled="true"') +
      ' data-card="' + esc(v.cmdrName) + '"' +
      /* `data-name` but NOT `data-cell`: the portrait is the picture, not one of
         the panel's uniform cells. Muster's own window carries `data-name`
         alone for the same reason. */
      ' data-name data-testid="commander-0" aria-label="' + esc(label) + '">' +
      (f.noart ? ico("cmd") : '<img src="../art/' + v.art + '" alt="" aria-hidden="true">') +
      /* NO `win__who` STRIP. `../self/03-plinth.html` draws the player's name
         across the top of the portrait for pod symmetry with a muster seat's
         head row; at 128px of picture rather than 250 that is 21px spent on a
         word the information strip already says twice about a panel nobody could
         mistake for somebody else's. See `.plinth` in `_board.css`. */
      '<span class="win__cap">' +
        (st.cast ? cmdrCost(v) : "") +
        '<span class="win__st">' + st.word + "</span>" +
      "</span>" +
    "</button>"
  );
}

/**
 * The mana groups: one mark per KIND with a count, never one per mana.
 *
 * When a castable card is hovered the group shows what you would have LEFT and a
 * faint negative for what goes. Which lands those are comes from the engine's
 * solved payment, never from arithmetic here; see `logic/mana.ts`.
 */
function manaCells(v, f) {
  if (!v.mana.length) {
    return '<span class="mgrp mgrp--none" data-cell data-name aria-label="No mana available">—</span>';
  }
  return v.mana.map((g) => {
    const spend = f.spending ? (v.spend[g.sym] || 0) : 0;
    const left = g.open - spend;
    const hybrid = g.sym.indexOf("/") >= 0;
    const mark = hybrid ? '<span class="mgrp__any" aria-hidden="true"></span>' : symHTML(g.sym);
    const label = (hybrid ? g.open + " sources of green or blue" : g.open + " " + g.sym) +
      (spend ? " — " + v.spendOn + " taps " + spend : "");
    return (
      '<span class="mgrp' + (spend ? " mgrp--spent" : "") + '" data-cell data-name ' +
        'aria-label="' + esc(label) + '">' +
        mark +
        '<span class="mgrp__n tabular">' + left + "</span>" +
        (spend ? '<span class="mgrp__spend tabular">−' + spend + "</span>" : "") +
      "</span>"
    );
  }).join("");
}

/**
 * The five zones, as chips inside targets.
 *
 * THE LIBRARY IS NEVER A BUTTON, whoever is asking: it is hidden information,
 * and `PlayerOrb.tsx:96-101` argues that a control which does nothing when
 * clicked is worse than no control. The other four have something real behind
 * them -- your hand is your hand, your graveyard and exile are public, your
 * command zone is where you cast from -- which is where muster's trade stops
 * travelling. It demoted an OPPONENT's five marks to plain cells and argued it
 * properly: 96px will not hold a 44px row and the battlefield row both.
 *
 * `data-name` and the accessible name go on the BUTTON, because that is the
 * control; `data-cell` goes on the chip, because that is the geometry. On an
 * opponent's seat there is no button and the chip carries both -- the same
 * finding stated in markup, and both are on this screen at once.
 */
function viewerZones(v) {
  const z = [
    { name: "library", label: "Library", icon: "lib", kind: "lib", count: v.lib, peek: false },
    { name: "hand", label: "Hand", icon: "hand", kind: "hand", count: v.hand, peek: true },
    { name: "graveyard", label: "Graveyard", icon: "gy", kind: "gy", count: v.gy, peek: true },
  ];
  /* Exile appears the moment anything is exiled and is NOT a fixed slot -- yours
     has one card in it, so this row is five marks here and would be four on an
     empty exile. That is the reflow the row has to survive. */
  if (v.exile > 0) z.push({ name: "exile", label: "Exile", icon: "ex", kind: "ex", count: v.exile, peek: true });
  z.push({
    name: "command", label: "Command zone", icon: "cmd", kind: "cmd", count: v.cmd, peek: true,
    note: v.cmd === 0 ? " — Aesi is on the battlefield" : "",
  });
  return z;
}

function zoneMarks(v) {
  return viewerZones(v).map((z) => {
    const isBtn = z.peek;
    const cls = [
      "zmark", "zmark--" + z.kind,
      z.count > 0 ? "" : "zmark--empty",
      isBtn ? "" : "zmark--flat",
    ].filter(Boolean).join(" ");
    const label = z.label + ": " + z.count + (z.note || "") + (isBtn ? " — opens" : " — hidden information");
    const chip =
      '<span class="' + cls + '" data-cell' +
        (isBtn ? "" : ' data-name data-testid="pile-0-' + z.name + '" aria-label="' + esc(label) + '"') +
      ">" + ico(z.icon) + z.count + "</span>";
    if (!isBtn) return chip;
    return (
      '<button type="button" class="zhit" data-name data-testid="pile-0-' + z.name + '"' +
        ' aria-label="' + esc(label) + '">' + chip + "</button>"
    );
  });
}

/**
 * The viewer's life, said in full and said only about life.
 *
 * `../self/` keeps this separate from the opponents' gauge label, which still
 * names the commander damage on their gauges. A shared label that mentioned
 * damage would put the channel back on this panel through the accessible name --
 * the same channel arriving by a quieter door -- and an accessible name that
 * describes something the sighted reader cannot see is its own defect.
 */
const lifeLabel = (v, f) => (f.out ? "Eliminated" : v.life + " life of " + v.start);

function orbHTML(f) {
  const v = VIEWER;
  const cls = ["orb", f.active ? "orb--active" : "", f.out ? "orb--out" : ""]
    .filter(Boolean).join(" ");
  const marks = zoneMarks(v);

  return (
    '<div class="' + cls + '" data-testid="player-0">' +
      (f.noart ? "" : '<img class="orb__ground" src="../art/' + v.art + '" alt="" aria-hidden="true">') +
      '<span class="orb__veil' + (f.noart ? " orb__veil--flat" : "") + '" aria-hidden="true"></span>' +
      (f.priority ? '<span class="orb__pri" data-name aria-label="You hold priority"></span>' : "") +

      '<div class="plinth">' +
        winButton(v, f) +
        '<span class="dial" data-cell data-name style="--fill:' +
          pct(Math.min(v.life, v.start), v.start) + '" aria-label="' + esc(lifeLabel(v, f)) + '">' +
          '<span class="dial__hole" aria-hidden="true"></span>' +
          '<span class="dial__n tabular">' + (f.out ? "OUT" : v.life) + "</span>" +
        "</span>" +
      "</div>" +

      '<div class="name">' + esc(v.cmdrName) + "</div>" +

      '<div class="slack"></div>' +

      '<div class="mana">' + manaCells(v, f) + "</div>" +

      '<div class="zones">' +
        '<div class="zones__row">' + marks.slice(0, 3).join("") + "</div>" +
        '<div class="zones__row">' + marks.slice(3).join("") + "</div>" +
      "</div>" +
    "</div>"
  );
}

/*
 * The lanes.
 *
 * `opts.mark(card)` is how a file paints the board from its own list -- it
 * returns `{rim, badge}` or nothing, and it is the ONLY hook the three files
 * have into the board. That is deliberate: the round's claim is that one rail
 * grammar answers three decisions, and a file that could rebuild the board would
 * be able to hide a failure of that claim by redrawing around it.
 */
function laneHTML(cards, mark) {
  return (
    '<div class="lane__cards" data-fan>' +
    cards.map((c) => {
      const m = (mark && mark(c)) || {};
      return (
        '<button class="lane__stop" type="button" data-stop="perm-' + esc(c.n) + '"' +
          ' data-card="' + esc(c.n) + '" style="border:0;padding:0;background:none">' +
          faceHTML(c, { board: true, rim: m.rim, badge: m.badge }) +
        "</button>"
      );
    }).join("") +
    "</div>"
  );
}

function boardHTML(mark, flags) {
  return (
    '<div class="mine">' +
      orbHTML(flags) +
      '<div class="lanes">' +
        '<div class="lane lane--creatures">' + laneHTML(VIEWER.creatures, mark) + "</div>" +
        '<div class="lane lane--other">' + laneHTML(VIEWER.other, mark) + "</div>" +
        '<div class="lane lane--lands">' + laneHTML(VIEWER.lands, mark) + "</div>" +
      "</div>" +
    "</div>"
  );
}

/* The hand. `playable` is set per file, because whether a sorcery is castable is
   a fact about the STEP and the three files are in three different ones. */
function handHTML(playableOf) {
  return (
    '<div class="foot">' +
      '<div class="tools">' +
        '<button class="tool" type="button" data-name aria-label="Sound">&#128266;</button>' +
        '<button class="tool" type="button" data-name aria-label="Undo">&#8634;</button>' +
        '<button class="tool" type="button" data-name aria-label="Concede">&#10005;</button>' +
      "</div>" +
      '<div class="hand" data-fan>' +
        HAND.map((c) => {
          const ok = playableOf ? playableOf(c) : !!c.playable;
          return (
            '<button class="lane__stop" type="button" data-stop="hand-' + esc(c.n) + '"' +
              ' data-card="' + esc(c.n) + '" style="border:0;padding:0;background:none">' +
              faceHTML(c, { cls: ok ? "face--playable" : "face--unplayable" }) +
            "</button>"
          );
        }).join("") +
      "</div>" +
    "</div>"
  );
}

/* ===========================================================================
   6. THE GAME INFORMATION STRIP
   ======================================================================== */

function infoHTML(spec) {
  const phases = PHASES.map((p, i) => {
    const live = p.id === spec.phase;
    const steps = live && p.steps.length
      ? '<span class="ph__steps">' + p.steps.map((s, j) =>
          '<span class="ph__step' + (j === spec.step ? " ph__step--now" : "") + '">' + esc(s) + "</span>"
        ).join("") + "</span>"
      : "";
    return (
      (i ? '<span class="ph__sep" aria-hidden="true">·</span>' : "") +
      '<span class="ph' + (live ? " ph--live" : "") + '">' +
        '<span class="ph__n">' + esc(p.n) + "</span>" + steps +
      "</span>"
    );
  }).join("");

  return (
    '<div class="info" data-testid="game-info">' +
      '<span class="info__turn">Turn <b>' + spec.turn + "</b></span>" +
      '<span class="info__phases">' + phases + "</span>" +
      '<span class="info__who">' +
        '<span class="info__active">' + esc(NAMES[spec.active]) + "<b>&#8217;s turn</b></span>" +
        '<span class="info__pri">' + esc(NAMES[spec.priority]) + " has priority</span>" +
      "</span>" +
    "</div>"
  );
}

/* ===========================================================================
   7. THE READER, AND THE TWO HOLDS
   ======================================================================== */

/** Every card on the screen, by name, so a rail row can name one with a string
    and the reader can find it. Built once, from the same fixture the board is
    drawn from, so the two cannot drift. */
const CARDS = {};
for (const c of [].concat(VIEWER.lands, VIEWER.creatures, VIEWER.other, HAND)) CARDS[c.n] = c;

/*
 * The reader body: the card, its type line, its rules, and -- when it has one --
 * why you cannot cast it.
 *
 * `CardPreview`'s `preview__facts` list does not travel: the keywords are in the
 * rules text, the status is the tap state and the lane it is in, the controller
 * is whose mat it is on, and the artist is not why anyone opens this.
 */
function readerBody(c, big) {
  if (!c) {
    return '<span class="reader__hint">Point at a card to read it</span>';
  }
  const art = ART(c.art);
  /* The hold gets the whole card because it owns the screen while it is up. The
     rail gets the window, because at 227px a card frame would be smaller than the
     board card it is helping you read -- see `.reader__art` in `_board.css`. */
  const pt = c.pt ? '<span class="reader__pt">' + esc(c.pt) + "</span>" : "";
  const picture = big
    ? faceHTML(c, {})
    : art
      ? '<div class="reader__art"><img src="' + art + '" alt="" aria-hidden="true">' + pt + "</div>"
      : '<div class="reader__art reader__art--empty"><span aria-hidden="true">' +
        (TYPE_GLYPH[c.t] || "◇") + "</span>" + pt + "</div>";
  return (
    picture +
    '<div class="reader__body">' +
      '<div class="reader__nm">' + (c.cmd ? "♛ " : "") + esc(c.n) +
        (c.cost ? " " + costHTML(c.cost) : "") + "</div>" +
      '<div class="reader__tl">' + esc(c.tl || "") + "</div>" +
      (c.rules ? '<div class="reader__rules">' + textHTML(c.rules) + "</div>" : "") +
      (c.ability ? '<div class="reader__rules">' + textHTML(c.ability) + "</div>" : "") +
      (c.why ? '<div class="reader__why">' + esc(c.why) + "</div>" : "") +
    "</div>"
  );
}

const stackHold = (stack) =>
  '<div class="over over--stack" id="hold-stack" hidden>' +
    '<p class="over__head">B to close</p>' +
    (stack.length
      ? '<div class="stacklist">' +
        stack.map((s, i) =>
          '<div class="sitem' + (i === 0 ? " sitem--top" : "") + '"><b>' + esc(s.name) +
          "</b> <span>" + esc(s.note) + "</span></div>"
        ).join("") +
        "</div>"
      : '<p class="reader__hint">Nothing on the stack</p>') +
  "</div>";

/* ===========================================================================
   8. THE MOUNT
   ---------------------------------------------------------------------------
   A file hands over the state of the game, its list, its commit bar, and the
   wiring for both.
   ======================================================================== */

const BOARD = {
  spec: null,
  /* WHAT THE READER IS SHOWING, held as a name rather than as DOM, because every
     file re-renders by rebuilding markup and a reader pointing at a destroyed
     node is the same silent-failure shape `../handheld/assert.js` grew a gate
     for. */
  reading: null,

  mount(spec) {
    BOARD.spec = Object.assign({
      turn: 8, active: 0, priority: 0, phase: "combat", step: 1,
      stack: [], hints: "", mark: null, playable: null, read: null,
    }, spec);
    BOARD.reading = BOARD.spec.read || null;
    BOARD.render();
    addEventListener("resize", BOARD.fit);
    addEventListener("keydown", BOARD.key);
  },

  render() {
    const spec = BOARD.spec;
    document.getElementById("root").innerHTML =
      '<div class="bezel">' +
        '<div class="deck">' +
          infoHTML(spec) +
          '<div class="play">' +
            '<div class="opps" data-testid="opponents">' +
              OPPS.map((s) => '<div class="mat">' + seatHTML(s, {
                active: s.pid === spec.active,
                targetable: spec.targetSeats && spec.targetSeats.indexOf(s.pid) >= 0,
              }) + "</div>").join("") +
            "</div>" +
            /* WHOSE TURN IT IS AND WHO HOLDS PRIORITY ARE TWO DIFFERENT FACTS
               and the orb draws them two ways: `--active` is the astral inset
               ring, `priority` is the tick on the top edge. `02` is the file
               that proves they are separate -- it is Edgar's turn and yours is
               the decision, so the orb has the tick and not the ring. The
               shipped board runs the two together into one highlighted name. */
            boardHTML(spec.mark, {
              active: spec.active === 0,
              priority: spec.priority === 0,
              out: false,
              noart: false,
              spending: false,
            }) +
          "</div>" +
          '<div class="rail" data-testid="rail">' +
            '<div class="reader" data-testid="reader">' + readerBody(CARDS[BOARD.reading]) + "</div>" +
            '<div class="acts"><div class="list" data-testid="action-list">' + spec.list + "</div></div>" +
            '<div class="commit">' + spec.commit +
              (spec.hints ? '<div class="hints">' + spec.hints + "</div>" : "") +
            "</div>" +
          "</div>" +
          handHTML(spec.playable) +
          '<div class="over over--card" id="hold-card" hidden>' +
            '<p class="over__head">B to close</p>' +
            '<div class="reader">' + readerBody(CARDS[BOARD.reading], true) + "</div>" +
          "</div>" +
          stackHold(spec.stack) +
        "</div>" +
        '<div class="bezel__tag" id="tag"></div>' +
      "</div>";

    BOARD.wireReader();
    if (spec.wire) spec.wire(document.querySelector(".deck"));
    BOARD.tag();
    BOARD.fit();
  },

  /*
   * THE READER FOLLOWS THE POINTER AND THE RING, and that is the whole of the
   * interaction the extra 234px bought.
   *
   * Anything carrying `data-card` names a card: a board face, a hand card, or a
   * row in the rail. `../rail/` could not do this at all -- its board was a
   * sketch with no cards in it -- and it is the reason a board face here can
   * afford to ellipsise a name.
   */
  wireReader() {
    const deck = document.querySelector(".deck");
    deck.addEventListener("pointerover", (ev) => {
      const el = ev.target.closest("[data-card]");
      if (el && deck.contains(el)) BOARD.read(el.dataset.card);
    });
    deck.addEventListener("focusin", (ev) => {
      const el = ev.target.closest("[data-card]");
      if (el) BOARD.read(el.dataset.card);
    });
  },

  /** Repaint the reader in place. Not a re-render: rebuilding the rail under a
      pointer that is mid-hover is how a list loses the row it is on. */
  read(name) {
    if (!CARDS[name] || BOARD.reading === name) return;
    BOARD.reading = name;
    const el = document.querySelector(".rail .reader");
    if (el) el.innerHTML = readerBody(CARDS[name]);
    const hold = document.querySelector("#hold-card .reader");
    if (hold) hold.innerHTML = readerBody(CARDS[name], true);
  },

  /**
   * Paint one board card from the rail.
   *
   * `rim` is one of staged / blocking / aimed / incoming and is the SAME token
   * the matching rail row uses, which is the point: a creature staged to attack
   * is amber in the list and amber on the mat, and the player never has to work
   * out which row is which card.
   */
  rim(name, rim, badge) {
    /* THE BOARD, AND NOT THE READER. Scoped to `.play` and `.foot` because the
       card hold draws a `.face` with the same `data-nm` on it, so an unscoped
       selector painted the amber rim on the enlarged card as well -- which reads
       as "this card is staged" on a surface whose whole job is to show what a
       card IS. A rim is a fact about a permanent on the battlefield; a reader is
       a picture of one. */
    const board = document.querySelectorAll(
      '.play .face[data-nm="' + CSS.escape(name) + '"], .foot .face[data-nm="' + CSS.escape(name) + '"]'
    );
    for (const face of board) {
      for (const k of ["staged", "blocking", "aimed", "incoming"]) face.classList.remove("face--" + k);
      if (rim) face.classList.add("face--" + rim);
      const old = face.querySelector(".face__badge");
      if (old) old.remove();
      /* The head's left padding is a function of whether a mark is in that
         corner, so it has to be re-decided every time one arrives or leaves --
         and an `.face--ability` card keeps it either way. */
      face.classList.toggle("face--marked", !!badge || !!face.querySelector(".face__rune"));
      if (badge) {
        face.insertAdjacentHTML("beforeend",
          '<span class="face__badge face__badge--' + badge.kind + '" data-name aria-label="' +
          esc(badge.label) + '">' + badge.mark + "</span>");
      }
    }
  },

  /*
   * The deck is 1280x800 whatever window is open.
   *
   * Scaled rather than resized, so every number `assert.js` reads is a real
   * device pixel. A mockup that reflows to the reviewer's monitor is being
   * reviewed at the wrong density, and it is always wrong in the direction that
   * flatters the design.
   */
  scale: 1,
  fit() {
    const el = document.querySelector(".deck");
    if (!el) return;
    /* 26px across for the bezel's shadow rings, 40 down for the caption under
       them. The deck is centred by `.bezel` and scaled about its own centre, so
       nothing here has to know where it ended up. */
    BOARD.scale = Math.max(0.3, Math.min(2,
      Math.min((innerWidth - 26) / 1280, (innerHeight - 40) / 800)));
    el.style.transform = "scale(" + BOARD.scale + ")";
    BOARD.lay();
  },

  /*
   * THE LANE OVERLAP, MEASURED.
   *
   * `step = min(cardWidth + gap, (laneWidth - cardWidth) / (n - 1))`, written to
   * `--step` on the lane, and `_board.css` turns it into a margin. A lane that
   * fits its cards gets a plain 5px gutter; one that does not overlaps by exactly
   * as much as it has to and no more.
   *
   * `clientWidth` and `offsetWidth` are untransformed layout values, so the
   * bezel's `scale()` does not enter into this -- which is the same trap
   * `../seat/assert.js` fell into when it divided a font size by the scale.
   */
  lay() {
    const GAP = 5;
    for (const lane of document.querySelectorAll("[data-fan]")) {
      const kids = lane.children;
      if (kids.length < 2) continue;
      const w = kids[0].offsetWidth;
      const step = Math.min(w + GAP, (lane.clientWidth - w) / (kids.length - 1));
      lane.style.setProperty("--step", step + "px");
    }
  },

  tag(extra) {
    const tag = document.getElementById("tag");
    if (!tag) return;
    tag.innerHTML =
      "<b>" + esc(BOARD.spec.title) + "</b> · 1280×800 @ " + Math.round(BOARD.scale * 100) + "%" +
      " · keys: <b>o</b> card hold · <b>k</b> stack hold · <b>r</b> reset · <b>m</b> measure" +
      (extra || "");
  },

  hold(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const other = document.getElementById(id === "hold-card" ? "hold-stack" : "hold-card");
    if (other) other.hidden = true;
    el.hidden = !el.hidden;
  },

  key(e) {
    const k = e.key.toLowerCase();
    if (k === "o") BOARD.hold("hold-card");
    else if (k === "k") BOARD.hold("hold-stack");
    else if (k === "escape" || k === "b") {
      document.getElementById("hold-card").hidden = true;
      document.getElementById("hold-stack").hidden = true;
    } else if (k === "r") BOARD.render();
    else if (k === "m") BOARD.measure();
    else return;
    e.preventDefault();
  },

  /* The gate, drawn on the elements that failed. */
  measure() {
    for (const el of document.querySelectorAll("[data-bad]")) el.removeAttribute("data-bad");
    const out = BOARD_ASSERT();
    for (const bad of out.faults) bad.el.setAttribute("data-bad", bad.why);
    BOARD.tag(
      " — " + (out.PASS ? "<b>PASS</b>" : "<i>FAIL</i>") +
      " · rail " + out.railPx + "px, list " + out.listPx + "px (" + out.listShare + ", " +
      out.rowsVisible + " rows)" +
      " · min type " + out.minFontPx + "px · min hit " + out.minHitPx + "px" +
      " · min card " + out.minCardPx + "px" +
      " · seats " + (out.seatsAgree ? "agree" : "<i>DISAGREE</i>")
    );
    console.log(out);
    return out;
  },
};
// <<< END _board.js >>>

// <<< BEGIN assert.js >>>
/*
 * The gates, as numbers.
 *
 * Inlined into every file by `inline.py`, so opening any mockup and typing
 * `BOARD_ASSERT()` in the console works with no server and no paste -- `fetch()`
 * is blocked on file://, so a page cannot load its own checker off disk. `m` runs
 * it and draws the failures on the elements that failed.
 *
 *     copy(JSON.stringify(BOARD_ASSERT(), null, 2))
 *
 * ---------------------------------------------------------------------------
 * FIVE OF THESE ARE INHERITED, AND THEY ARE INHERITED WITH THEIR SCOPE WIDENED,
 * which is the main thing this round does to the two it combines.
 *
 * `../seat/assert.js` measured a seat. `../rail/assert.js` measured a rail. Both
 * drew the rest of the screen as a ghost with no type on it, so "16px floor" and
 * "44px target" were being asked of one component at a time. Here they are asked
 * of THE WHOLE 1280x800 STAGE -- every card, every chip, the strip, the orb, the
 * hand -- which is the question `../handheld/` was originally opened on and the
 * only version of it that means anything: 444 of 635 elements below 12px is a
 * count of the whole screen, not of a panel.
 *
 * THREE ARE NEW.
 *
 * `seatsAgree` -- THE ROUND'S OWN GATE, and the reason it exists. The opponent
 * strip claims "3 lands, 2 untapped, 4 creatures, 2 untapped, 0 other". Those
 * numbers are DERIVED from the permanents in the fixture, and this gate derives
 * them a second, independent way and reads a third off the rendered DOM, then
 * fails if the three disagree. `../seat/` could not run this check at any price:
 * the board under its strip was a dashed sketch, so the strip's numbers were
 * unfalsifiable. A summary that cannot be checked against the thing it summarises
 * is the failure mode this whole family of components has.
 *
 * `fanOverflow` -- the overlap arithmetic, as a number. `BOARD.lay()` computes a
 * step per lane so the cards exactly fill it; if that is ever wrong the board
 * runs off its own edge and `overflow: hidden` on the deck hides it completely.
 * That is the board round's lesson -- WHERE A VISUAL PROPERTY REDUCES TO A
 * NUMBER, ASSERT THE NUMBER -- pointed at the one piece of layout here that is
 * computed rather than declared.
 *
 * `silentClips` -- a box that is cutting its own content with no ellipsis to say
 * so. An ellipsised card name is an honest trade this round has already accepted
 * and is only counted. A `nowrap` strip that is 20px too long for its own box
 * looks IDENTICAL to one that fits, which is how the phase ribbon would fail:
 * you would simply never see the last phase and nothing on screen would say a
 * phase was missing.
 */

function BOARD_ASSERT() {
  const DECK = document.querySelector(".deck");
  if (!DECK) return { PASS: false, why: "no .deck" };

  const FS_FLOOR = 16;    // nothing carrying information may be smaller
  const HIT_FLOOR = 44;   // any focusable or tappable box
  const CARD_FLOOR = 96;  // any card the cursor can land on

  const round = (n) => Math.round(n * 100) / 100;

  const vis = (el) => {
    const s = getComputedStyle(el);
    if (s.display === "none" || s.visibility === "hidden" || +s.opacity === 0) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  };

  /* The bezel caption is a note to whoever is reviewing. It is not on the Deck's
     screen and holding it to the Deck's floors is measuring the wrong thing --
     which is why the scope is `.deck` and not `body`. */
  const scale = DECK.getBoundingClientRect().width / (DECK.offsetWidth || 1) || 1;
  const px = (n) => Math.round(n / scale);

  const all = [...DECK.querySelectorAll("*")].filter(vis);
  const faults = [];

  /* --- The type floor ---------------------------------------------------
     Only elements that OWN text: walking every element counts a wrapper at its
     inherited size and reports failures that are not on screen. `aria-hidden` is
     skipped, which is the honest line between a font-size floor and a font-size
     ban -- this gate is about TEXT SOMEBODY READS. A mana symbol is an `<img>`
     and owns no text at all; a card's type glyph is a character and IS
     `aria-hidden`, because the type line says the same thing in words in the
     reader. The rule is that if hiding it from a screen reader would lose
     information, it is text. */
  const textOwners = all.filter(
    (el) =>
      !el.closest('[aria-hidden="true"]') &&
      [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())
  );

  const sizes = textOwners.map((el) => ({
    el,
    /* A font size is a CSS pixel and the bezel's `transform: scale()` does not
       change it -- only the boxes below are read through the scale. Dividing
       here reports a 16px floor as 17.9 and passes type that fails on the
       device. `../seat/assert.js` learned this the hard way. */
    px: round(parseFloat(getComputedStyle(el).fontSize)),
    text: el.textContent.trim().slice(0, 32),
  }));
  const belowFloor = sizes.filter((s) => s.px < FS_FLOOR).sort((a, b) => a.px - b.px);
  for (const s of belowFloor.slice(0, 8)) faults.push({ el: s.el, why: s.px + "px" });

  /* --- The target floor -------------------------------------------------
     Every stop the cursor can reach and every real button. An overlapped board
     card is worth a note here: its BOX is 120 wide but the card to its right
     covers part of it, so what a thumb can actually land on is `--step`, which
     `BOARD.lay()` never lets fall below about 90px on this board. The gate reads
     the box, which is the generous reading -- see `fanOverflow` for the
     arithmetic that keeps the two close. */
  const stops = [...DECK.querySelectorAll("button, [data-stop]")].filter(vis);
  const hits = stops.map((el) => {
    const r = el.getBoundingClientRect();
    return { el, w: px(r.width), h: px(r.height) };
  });
  const smallHits = hits.filter((h) => h.w < HIT_FLOOR || h.h < HIT_FLOOR);
  for (const h of smallHits.slice(0, 8)) faults.push({ el: h.el, why: h.w + "×" + h.h });

  /* --- The card floor ----------------------------------------------------
     Read off a rendered face rather than off the token, because the token is
     what the design INTENDED and the box is what the player got. The shipped
     board's own figure at 1280x800 is 73.6px, which is where the floor came
     from. The reader's card is not reachable -- it is a picture of what you are
     already pointing at -- so the floor is asked only of faces inside a stop. */
  const faces = [...DECK.querySelectorAll(".face")].filter(vis);
  const reachable = faces
    .filter((f) => f.closest("[data-stop]"))
    .map((f) => ({ el: f, w: px(f.getBoundingClientRect().width) }));
  const smallCards = reachable.filter((f) => f.w < CARD_FLOOR);
  for (const f of smallCards.slice(0, 6)) faults.push({ el: f.el, why: f.w + "px card" });

  /* --- The round's own gate: does the strip agree with the board? --------
     Three derivations of the same five numbers, per seat:
       1. `musterOf()`, which the seat is drawn from
       2. this one, walked over the fixture again with different code
       3. the text actually rendered into the three `.perm` cells
     If any two disagree the seat is describing a board that is not there. */
  const seatCheck = OPPS.map((seat) => {
    let lands = 0, landsUp = 0, creatures = 0, creaturesUp = 0, other = 0;
    for (const c of seat.lands) { const n = c.count || 1; lands += n; if (!c.tapped) landsUp += n; }
    for (const c of seat.creatures) { const n = c.count || 1; creatures += n; if (!c.tapped) creaturesUp += n; }
    for (const c of seat.other) other += c.count || 1;

    const el = DECK.querySelector('[data-seat="' + seat.pid + '"]');
    const cells = el ? [...el.querySelectorAll(".perm")] : [];
    const readCell = (i) => (cells[i] ? cells[i].textContent.trim() : "");

    const want = [landsUp + "/" + lands, creaturesUp + "/" + creatures, String(other)];
    const got = [readCell(0), readCell(1), readCell(2)];
    const m = musterOf(seat);
    const viaMuster = [m.landsUp + "/" + m.lands, m.creaturesUp + "/" + m.creatures, String(m.other)];

    const ok = want.join("|") === got.join("|") && want.join("|") === viaMuster.join("|");
    if (!ok && cells[0]) faults.push({ el: cells[0], why: "seat " + seat.pid + " disagrees" });
    return { pid: seat.pid, want, got, ok };
  });
  const seatsAgree = seatCheck.every((s) => s.ok);

  /* --- The overlap arithmetic --------------------------------------------
     Every fan, which is the three lanes AND THE HAND. Naming the lanes only is
     how the hand came to run 79px past the foot and sit on top of the commit
     panel's first mark, with nothing on screen saying so: the deck is
     `overflow: hidden`, so the page reported no overflow at all and the only
     symptom was a control that had quietly stopped being clickable. */
  const fans = [...DECK.querySelectorAll("[data-fan]")].filter(vis);
  const fanOver = fans.filter((l) => l.scrollWidth > l.clientWidth + 1);
  for (const l of fanOver) faults.push({ el: l, why: "fan " + (l.scrollWidth - l.clientWidth) + "px over" });

  /* --- Scroll containers -------------------------------------------------
     A scroller with no reserved gutter is the reflow-on-hover bug waiting to
     happen, and it is invisible until content crosses the line. Asked of every
     one, which is how `../rail/` found the second instance of it inside the
     enlarged card's rules box. */
  const scrollEls = all.filter((el) => {
    const s = getComputedStyle(el);
    return s.overflowY === "auto" || s.overflowY === "scroll";
  });
  const overflowing = scrollEls.filter((el) => el.scrollHeight > el.clientHeight + 1);
  const unguttered = scrollEls.filter(
    (el) => getComputedStyle(el).scrollbarGutter.indexOf("stable") < 0
  );
  for (const el of unguttered.slice(0, 4)) faults.push({ el, why: "no gutter" });

  /* --- Silent clipping ---------------------------------------------------
     A box cutting its own content with no ellipsis to say so. An ellipsised card
     name is an honest trade and is only counted; a `nowrap` strip 20px too long
     for its own box looks exactly like one that fits. */
  /* ASKED ONLY OF ELEMENTS THAT OWN TEXT, and the first version of this gate is
     why. `scrollWidth` counts absolutely positioned descendants, so every card
     frame reported as clipping -- a `.face` is `overflow: hidden` with a staged
     badge hanging off it at -4px, which is the card working. Fourteen failures
     on a file with nothing wrong. Restricting to text owners asks the question
     the gate is actually for: is a WORD being cut with nothing to say so. */
  const clipCandidates = textOwners.filter((el) => {
    const s = getComputedStyle(el);
    if (s.overflowX === "visible") return false;
    return el.scrollWidth > el.clientWidth + 1;
  });
  const ellipsised = clipCandidates.filter((el) => getComputedStyle(el).textOverflow === "ellipsis");
  const silent = clipCandidates.filter((el) => getComputedStyle(el).textOverflow !== "ellipsis");
  for (const el of silent.slice(0, 4)) faults.push({ el, why: "silent clip" });

  /* --- Escape ------------------------------------------------------------
     Measured against THE DECK rather than against each region, and that is
     deliberate in both directions.

     A staged-attacker badge is `top: -4px; right: -4px` on purpose -- the mark
     hangs off its card, which is what makes it read as attached to one card
     rather than as a thing in the lane -- so measuring it against its lane
     reports four failures that are the design working.

     What is still a failure is leaving the SCREEN, and `overflow: hidden` on the
     deck hides that completely: the page reports `scrollHeight ===
     clientHeight` while content visibly runs under the next region, which is the
     lesson the board round drew. `getBoundingClientRect` still reports the true
     position of a clipped box, so this catches it.

     Rows scrolled below the fold of `.list` are excluded on the scroll axis --
     being outside the visible box there is the entire point of a scroll
     container -- but a row WIDER than its scroller is still content nothing can
     reach, because `.list` scrolls vertically only.

     Hover labels are absolutely positioned outside their control on purpose and
     are invisible at rest, so `vis()` has already excluded them. */
  const deckBox = DECK.getBoundingClientRect();
  let escaped = 0;
  for (const el of all) {
    const scroller = el.parentElement && el.parentElement.closest(".list, .reader__rules");
    const b = el.getBoundingClientRect();
    const box = scroller ? scroller.getBoundingClientRect() : deckBox;
    const out =
      b.left < box.left - 1 || b.right > box.right + 1 ||
      (!scroller && (b.top < box.top - 1 || b.bottom > box.bottom + 1));
    if (out) {
      escaped += 1;
      if (escaped <= 4) faults.push({ el, why: "escapes" });
    }
  }

  /* A region that flattened to nothing. `e2e/layout.spec.ts` measures this on
     the shipped panel because at 950px the action list silently went to 2px
     while every assertion about the buttons still passed. */
  const collapsed = all.filter((el) => {
    const r = el.getBoundingClientRect();
    return r.height < 1 || r.width < 1;
  }).length;

  /* --- The rail's share, kept from `../rail/` ---------------------------- */
  const rail = DECK.querySelector(".rail");
  const list = DECK.querySelector(".list");
  const reader = DECK.querySelector(".rail .reader");
  const railPx = rail ? px(rail.getBoundingClientRect().height) : 0;
  const listPx = list ? px(list.getBoundingClientRect().height) : 0;
  const readerPx = reader ? px(reader.getBoundingClientRect().height) : 0;
  /* Rows, not pixels, is what a player experiences. 44 + the 6px gutter. */
  const rowsVisible = Math.floor((listPx + 6) / (HIT_FLOOR + 6));

  const out = {
    screen: innerWidth + "x" + innerHeight,
    scalePct: Math.round(scale * 100),

    railPx,
    railWidthPx: rail ? px(rail.getBoundingClientRect().width) : 0,
    readerPx,
    listPx,
    listShare: railPx ? Math.round((listPx / railPx) * 100) + "%" : "0%",
    rowsVisible,
    /* The shipped board's own figure, for the comparison this round is for.
       `handheld.css:1540-1554`: a 514px rail whose action list holds 172. */
    shippedListPx: 172,

    seatsAgree,
    seats: seatCheck.map((s) => ({ pid: s.pid, want: s.want.join(" "), got: s.got.join(" "), ok: s.ok })),

    cards: faces.length,
    reachableCards: reachable.length,
    minCardPx: reachable.length ? Math.min(...reachable.map((f) => f.w)) : null,
    smallCards: smallCards.length,

    fans: fans.length,
    fanOverflow: fanOver.length,

    scrollers: scrollEls.length,
    overflowing: overflowing.length,
    unguttered: unguttered.length,

    minFontPx: sizes.length ? Math.min(...sizes.map((s) => s.px)) : null,
    textNodes: sizes.length,
    belowFloor: belowFloor.length,
    belowFloorWorst: belowFloor.slice(0, 6).map((s) => ({ px: s.px, text: s.text })),

    stops: stops.length,
    minHitPx: hits.length ? Math.min(...hits.map((h) => Math.min(h.w, h.h))) : null,
    smallHits: smallHits.length,
    smallHitsWorst: smallHits.slice(0, 6).map((h) => ({ w: h.w, h: h.h })),

    ellipsised: ellipsised.length,
    ellipsisedWorst: ellipsised.slice(0, 6).map((el) => el.textContent.trim().slice(0, 24)),
    silentClips: silent.length,

    escaped,
    collapsedRegions: collapsed,

    /* A native tooltip opens on hover and on nothing else, so on a controller it
       is information that cannot be reached at all. The shipped client had 45 and
       has none left; a mockup that grows one has moved a channel out of reach
       without saying so. Every hover label in this round is `aria-label` +
       `::after`, which the ring reaches too. */
    titleAttrs: DECK.querySelectorAll("[title]").length,

    faults,
  };

  out.PASS =
    out.belowFloor === 0 &&
    out.smallHits === 0 &&
    out.smallCards === 0 &&
    out.escaped === 0 &&
    out.collapsedRegions === 0 &&
    out.titleAttrs === 0 &&
    out.unguttered === 0 &&
    out.fanOverflow === 0 &&
    out.silentClips === 0 &&
    out.seatsAgree &&
    /*
     * THE ROUND'S BAR, AND IT IS NOT `../rail/`'s.
     *
     * That round gated on `listShare >= 50%` because its rail had one tenant and
     * a share was therefore the same statement as an absolute. This rail has two
     * ON PURPOSE -- the card reader came back off a hold when the column grew to
     * 748px -- so a share gate here would fail a design for spending room on the
     * thing the room was found for. `listShare` is still reported, for
     * continuity, and it is no longer what passes a file.
     *
     * What passes a file is what a player experiences: SEVEN ROWS WITHOUT
     * SCROLLING, and at least double the 172px `handheld.css:1540-1554` measures
     * the shipped action list at. A direction that does not clear both has not
     * moved the thing the complaint was about however good the fraction looks.
     */
    out.rowsVisible >= 7 &&
    listPx >= 2 * out.shippedListPx;

  return out;
}

if (typeof window !== "undefined") window.BOARD_ASSERT = BOARD_ASSERT;
// <<< END assert.js >>>

/* ==========================================================================
   03 — The main phase. One drill-down instead of a chip cloud.
   ==========================================================================

   01's grammar carried into the step the rail spends most of the game in, and
   the one file of the three where the board being real changes the ARGUMENT and
   not just the picture.

   ---------------------------------------------------------------------------
   THE CHIP CLOUD IS THE SAME DEFECT AS THE DEFENDER PILLS. The engine offers a
   targeted spell once per legal target, so a Beast Within with forty-two things
   to point at is forty-two `cast` actions;
   `logic/actionMatch.groupPlayActions` already collapses them to one row with a
   chip each, because forty-two rows drawing the same card read as forty-two
   copies of it. Then the floors land: `.aim` takes 16px type and 44x44, keeps
   the desktop pill's padding, and six of them wrap to three rows inside a row
   that is itself 44px tall. The cost scales with how interesting the spell is,
   which is exactly backwards.

   FORTY-TWO IS NOT A STRESS TEST, IT IS THIS TABLE. Count the permanents on the
   four boards in `_board.js`: twenty-one yours, seven Edgar's, eight Marco's, six
   the Duelist's. "Destroy target permanent" is legal on every one. The earlier
   round drew this argument against six invented targets and had to ASSERT that it
   scaled; here the number is just what the board is, it is printed on the hint bar
   at the foot of the aim state, and a chip grid of forty-two 44px pills two to a
   row is over a thousand pixels of pills in a 243px column.

   A DRILL-DOWN DOES NOT CARE HOW MANY THERE ARE. Tapping a targeted spell turns
   the list into the list of things it can hit. One state, one row height, whether
   there are two targets or forty-two.

   THEY COLLAPSE TO TWENTY-FIVE ROWS, and that collapse is the same one the mat
   makes: seven Forests are one face with a ×7 on it, because seven identical
   choices are one choice. It is worth being explicit that this IS a reduction --
   if the seven Forests differed in any way that mattered (an Aura on one, damage
   marked, one of them tapped) the collapse would be hiding it, and `CardStack`
   has the same exposure on the board today.

   AND THE INVARIANT SURVIVES, which the `<select>` version of this idea does not.
   `ActionPanel`'s header states it: every legal action is a button carrying
   `data-action-id`, exactly once in the document. An `<option>` cannot carry one,
   so a select needs the same deliberate carve-out `choose_x` has. Here every
   target is still a real button with its own id -- they are on a second screen
   rather than in a second row -- so the contract holds unchanged and
   `e2e/action-panel.spec.ts` does not have to learn anything.

   ---------------------------------------------------------------------------
   WHAT THIS BOARD DOES TO THE COST TONE, said out loud.

   `../rail/03-abilities.html` opens with two rows dimmed because the board cannot
   pay for them. THIS BOARD CAN PAY FOR EVERYTHING: twelve untapped sources
   against a hand whose most expensive card is five. So `.act--broke` is carried
   and unused here, and the reason is worth more than the demonstration --

     ON A DEVELOPED COMMANDER BOARD, AFFORDABILITY STOPS BEING THE FILTER AND
     TARGETING BECOMES THE WHOLE OF THE DECISION.

   Which is the case the chip cloud is worst at, and it is the case the shipped
   panel spends its width on the other thing. A mana cost and a card name do not
   both fit a 243px row at the 16px floor -- the earlier round measured that at
   three pips taking 64px of about 223 -- and this board says which of the two to
   drop when they will not both go.
   ========================================================================== */

/* ==========================================================================
   THE DELTA, IN ONE PLACE
   ==========================================================================

   Turn 8 again, and EARLIER than 01: this is the main phase you spend before
   attacking, so nothing of yours is tapped. The two summoning-sick creatures are
   still sick, which the mat draws desaturated and the reader does not have to
   explain.

   The `LOG` in `../handheld/_handheld.js` is this moment: "You play Forest",
   "Zendikar's Roil creates a 2/2 Elemental". The second Elemental token on the
   mat is that trigger, already resolved.
   ========================================================================== */

/*
 * The other three boards, registered so the reader can open any target.
 *
 * They are not drawn on the mat -- an opponent's battlefield is behind R2 on this
 * device -- and that is exactly the hole the reader fills: you are being asked to
 * aim at forty-five permanents, of which twenty-three are on boards you cannot
 * currently see. A row naming "Favorable Winds" and no way to find out what
 * Favorable Winds does is the version of this panel that cannot be used.
 */
for (const c of [
  { n: "Mountain", tl: "Basic Land — Mountain", t: "land", f: "land", land: "R", art: "Mountain" },
  { n: "Plains", tl: "Basic Land — Plains", t: "land", f: "land", land: "W" },
  { n: "Scoured Barrens", tl: "Land", t: "land", f: "land", land: "W/B", art: "Scoured Barrens",
    rules: "Scoured Barrens enters the battlefield tapped. When it enters, you gain 1 life." },
  { n: "Vampire", tl: "Token Creature — Vampire", t: "creature", f: "token", pt: "1/1", art: "token:Vampire" },
  { n: "Vampire Neonate", cost: "1B", tl: "Creature — Vampire", t: "creature", f: "B", pt: "0/3",
    rules: "{2}, {T}: Each opponent loses 1 life. You gain life equal to the life lost this way.",
    art: "Vampire Neonate" },
  { n: "Falkenrath Noble", cost: "3B", tl: "Creature — Vampire Noble", t: "creature", f: "B", pt: "2/2",
    rules: "Flying. Whenever another creature dies, target opponent loses 1 life and you gain 1 life.",
    art: "Falkenrath Noble" },
  { n: "Empyrean Eagle", cost: "1WU", tl: "Creature — Bird Spirit", t: "creature", f: "gold", pt: "2/3",
    rules: "Flying. Other creatures you control with flying get +1/+1.", art: "Empyrean Eagle" },
  { n: "Watcher of the Spheres", cost: "WU", tl: "Creature — Bird Wizard", t: "creature", f: "gold", pt: "2/2",
    rules: "Flying. Whenever another creature with flying enters the battlefield under your control, scry 1.",
    art: "Watcher of the Spheres" },
  { n: "Favorable Winds", cost: "1U", tl: "Enchantment", t: "enchantment", f: "U",
    rules: "Creatures you control with flying get +1/+0.", art: "Favorable Winds" },
  { n: "Skirk Prospector", cost: "R", tl: "Creature — Goblin", t: "creature", f: "R", pt: "1/1",
    rules: "Sacrifice a Goblin: Add {R}.", art: "Skirk Prospector" },
  { n: "Impact Tremors", cost: "1R", tl: "Enchantment", t: "enchantment", f: "R",
    rules: "Whenever a creature enters the battlefield under your control, Impact Tremors deals 1 damage to each opponent.",
    art: "Impact Tremors" },
]) if (!CARDS[c.n]) CARDS[c.n] = c;

/* ==========================================================================
   THE LIST STATE
   ========================================================================== */

/*
 * Everything you can do right now, which on a main phase with twelve sources is
 * the whole hand plus what the board can activate.
 *
 * `◆` rather than a numeral for an ability, because the numerals are the hand's
 * own accelerators and an activated ability is not a card in it. Same chip, same
 * 26px box, different glyph -- which is `.key`'s job.
 */
const PLAY = [
  { key: 1, card: "Beast Within", tone: "act--playable", aims: true },
  { key: 2, card: "Vorel of the Hull Clade", tone: "act--playable" },
  { key: 3, card: "Garruk's Packleader", tone: "act--playable" },
  { key: 4, card: "Explosive Vegetation", tone: "act--playable" },
  { key: 5, card: "Nimble Mongoose", tone: "act--playable" },
  { key: 6, card: "Explore", tone: "act--playable" },
  { key: "◆", card: "Terramorphic Expanse", tone: "act--ability",
    label: "Terramorphic Expanse — sacrifice for a land" },
];

const rowHTML = (a) => {
  const c = CARDS[a.card];
  return (
    '<button class="act ' + a.tone + '" type="button" data-card="' + esc(a.card) + '"' +
      (a.aims ? " data-aims" : "") + ">" +
      '<span class="key">' + a.key + "</span>" +
      '<span class="nm">' + esc(a.label || a.card) + "</span>" +
      (c && c.cost ? costHTML(c.cost) : "") +
    "</button>"
  );
};

const LIST = PLAY.map(rowHTML).join("");

/* ==========================================================================
   THE AIM STATE
   ==========================================================================

   Every permanent on the table, by seat, stacks collapsed. The counts here are
   the fixture's own -- `../handheld/_handheld.js` for your board and the three
   `OPPS` entries for theirs -- so the row that says "Forest ×7" and the seven
   Forests on the mat are one number.
   ========================================================================== */

/* Beast Within hands the target's controller a 3/3 green Beast. That body is the
   yardstick every verdict below is measured against, so it is written once. */
const BEAST = { power: 3, tough: 3 };

function verdictOf(t) {
  if (t.mine) return "mine";
  if (t.type === "land") return "wash";
  if (t.type !== "creature") return "answer";
  const [p, q] = String(t.pt).split("/").map(Number);
  return p >= BEAST.power || q > BEAST.tough || t.flying ? "answer" : "wash";
}

const WHY = {
  answer: "An answer — worth more to them than a 3/3",
  wash: "An upgrade for them — they trade this for a 3/3",
  mine: "This one is yours",
};

/* Their boards first, because that is what you are aiming at; yours last,
   because destroying your own permanent is legal, occasionally right, and never
   something to reach by accident. */
const TARGETS = [
  { who: "AI 1 — Edgar Markov", seat: 1, of: [
    { card: "Falkenrath Noble", pt: "2/2", type: "creature", flying: true },
    { card: "Vampire Neonate", pt: "0/3", type: "creature" },
    { card: "Vampire", pt: "1/1", type: "creature", n: 2 },
    { card: "Mountain", type: "land", n: 2 },
    { card: "Scoured Barrens", type: "land" },
  ] },
  { who: "Marco — Isperia", seat: 2, of: [
    { card: "Favorable Winds", type: "enchantment" },
    { card: "Empyrean Eagle", pt: "2/3", type: "creature", flying: true },
    { card: "Watcher of the Spheres", pt: "2/2", type: "creature", flying: true },
    { card: "Plains", type: "land", n: 3 },
    { card: "Island", type: "land", n: 2 },
  ] },
  { who: "Duelist — Krenko", seat: 3, of: [
    { card: "Impact Tremors", type: "enchantment" },
    { card: "Skirk Prospector", pt: "1/1", type: "creature" },
    { card: "Mountain", type: "land", n: 4 },
  ] },
  { who: "You", seat: 0, mine: true, of: [
    { card: "Gyre Strait Leviathan", pt: "7/7", type: "creature" },
    { card: "Aesi, Tyrant of Gyre Strait", pt: "5/5", type: "creature" },
    { card: "Acidic Slime", pt: "2/2", type: "creature" },
    { card: "Yavimaya Elder", pt: "1/2", type: "creature" },
    { card: "Gyre Sage", pt: "0/2", type: "creature" },
    { card: "Elvish Visionary", pt: "1/1", type: "creature" },
    { card: "Elemental", pt: "2/2", type: "creature", n: 2 },
    { card: "Zendikar's Roil", type: "enchantment" },
    { card: "Forest", type: "land", n: 7 },
    { card: "Island", type: "land", n: 3 },
    { card: "Thornwood Falls", type: "land" },
    { card: "Terramorphic Expanse", type: "land" },
  ] },
];

/* The count the header prints is the real one -- objects, not rows -- because
   that is the number the argument above is about. */
const objectsOf = (g) => g.of.reduce((n, t) => n + (t.n || 1), 0);
const TOTAL = TARGETS.reduce((n, g) => n + objectsOf(g), 0);

const tgtHTML = (t, mine) => {
  const v = verdictOf(Object.assign({ mine }, t));
  return (
    '<button class="act act--tgt says" type="button" data-tgt data-verdict="' + v + '"' +
      ' data-card="' + esc(t.card) + '" data-mine="' + (mine ? "1" : "") + '"' +
      ' aria-label="' + esc(WHY[v]) + '">' +
      '<span class="dot" aria-hidden="true"></span>' +
      '<span class="nm">' + esc(t.card) + "</span>" +
      (t.n > 1 ? '<span class="mult">×' + t.n + "</span>" : "") +
      (t.pt ? '<span class="pt">' + t.pt + "</span>" : "") +
    "</button>"
  );
};

const AIMS =
  '<div class="aim">' +
    '<button class="aim__back" type="button" data-back aria-label="Back">‹</button>' +
    '<span class="aim__what">Beast Within<small>Destroy target permanent — its controller gets a 3/3</small></span>' +
  "</div>" +
  TARGETS.map(
    (g) =>
      '<p class="who">' + esc(g.who) + "<span>" + objectsOf(g) + "</span></p>" +
      g.of.map((t) => tgtHTML(t, !!g.mine)).join("")
  ).join("");

/*
 * The bar in each state.
 *
 * List state: undo and Pass, which is what `COMMIT_KINDS` promotes when nothing
 * is being declared. Aim state: back and Cast, and Cast waits for a target -- the
 * same empty state the attack commit uses, doing the same job of being the only
 * thing on screen that says "you have not picked yet".
 */
const BAR_LIST =
  '<div class="bar">' +
    '<button class="mark" type="button" aria-label="Undo">↺</button>' +
    '<button class="bar__go" type="button">Pass</button>' +
  "</div>";

const BAR_AIM =
  '<div class="bar">' +
    '<button class="mark" type="button" data-back aria-label="Back">‹</button>' +
    '<button class="bar__go" type="button" data-go data-empty="true">Cast</button>' +
  "</div>";

const HINTS_LIST =
  '<span class="hint"><b class="glyph">A</b><span class="hint__verb">Cast</span></span>' +
  '<span class="hint"><b class="glyph">␣</b><span class="hint__verb">Pass</span></span>' +
  '<span class="hint"><b class="glyph">Y</b><span class="hint__verb">Read</span></span>';

/* The count is `TOTAL`, computed from the same arrays the rows are, so the
   header's claim about this table and the number on screen cannot drift. One
   line, for 01's reason -- a second costs the list a row. */
const HINTS_AIM =
  '<span class="hint"><b class="glyph glyph--live">' + TOTAL + "</b>" +
    '<span class="hint__verb">legal targets</span></span>' +
  '<span class="hint"><b class="glyph">B</b><span class="hint__verb">Back</span></span>';

/* Two states, one mount. Re-rendering rather than hiding, because the aim state
   is not the list with something added -- it is a different list, and a hidden
   one still costs the ring a walk through it. */
function show(state) {
  BOARD.spec.list = state === "aim" ? AIMS : LIST;
  BOARD.spec.commit = state === "aim" ? BAR_AIM : BAR_LIST;
  BOARD.spec.hints = state === "aim" ? HINTS_AIM : HINTS_LIST;
  BOARD.spec.read = state === "aim" ? "Falkenrath Noble" : "Beast Within";
  BOARD.reading = BOARD.spec.read;
  BOARD.render();
}

function wire(deck) {
  deck.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-aims]")) return show("aim");
    if (ev.target.closest("[data-back]")) return show("list");

    const tgt = ev.target.closest("[data-tgt]");
    const go = deck.querySelector("[data-go]");
    if (!tgt || !go) return;

    const already = tgt.classList.contains("on");
    for (const t of deck.querySelectorAll("[data-tgt]")) t.classList.remove("on");
    /* Clear every rim first: a target is chosen one at a time, so the mat must
       never show two. */
    for (const face of deck.querySelectorAll(".face--aimed")) face.classList.remove("face--aimed");

    if (!already) {
      tgt.classList.add("on");
      /* Only your own permanents are on the mat, so only they can wear the rim.
         Aiming at one of theirs is the case the READER answers, which is what the
         234px the full-height rail bought is being spent on. */
      if (tgt.dataset.mine) BOARD.rim(tgt.dataset.card, "aimed", null);
    }
    go.dataset.empty = already ? "true" : "false";
  });
}

BOARD.mount({
  title: "board 03 main phase",
  turn: 8,
  active: 0,
  priority: 0,
  phase: "main1",
  step: 0,
  /* Nothing on the stack: `Zendikar's Roil`'s trigger has already resolved and
     the second Elemental token on the mat is it. `k` shows what the hold says
     when the stack is empty, which is the state it is in most of the time and
     the reason this round did not spend the rail's extra height on it. */
  stack: [],
  read: "Beast Within",
  list: LIST,
  commit: BAR_LIST,
  hints: HINTS_LIST,
  /* A main phase, so everything in hand is castable -- see the header for what
     that does to the argument. */
  playable: () => true,
  wire,
});
</script>
