<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your orb — Ledger (self 01)</title>
<style>
/* <<< BEGIN _self.css >>> */
/*
 * The frame every self-orb mockup is judged inside.
 *
 * NOT LINKED. `inline.py` splices this between each file's BEGIN and END
 * `_self.css` markers, so every file opens standalone from file://.
 *
 * WHAT IS IN HERE: the Deck bezel, the three opponents drawn as REAL
 * `../seat/06-muster.html` seats, the ghosted lanes/rail/hand the orb is taking
 * room from, the palette (`../seat/_seat.css`'s, token for token, which is
 * `frontend/src/theme.css`'s), the type floor, the target floor, the shared
 * cell vocabulary and the icon base.
 *
 * WHAT IS NOT: one single rule about how the orb is laid out. `.orb` gets its
 * width and its height budget here and nothing else -- no padding, no radius,
 * no background -- because the padding is one of the things this round is about
 * and a shared plate style would quietly answer it for all five. Each file
 * styles its own orb, declares its own `--orb-w`/`--orb-h` if its thesis needs
 * different ones, and pays for it in the ghost board below.
 *
 * THE OPPONENTS ARE NOT GHOSTS. That is the one structural difference from
 * `../seat/_seat.css`, and it is the whole reason this round exists: the
 * question is not "is this orb good" but "does this orb belong on the same
 * table as a muster seat", and that cannot be answered against a dashed
 * rectangle. Their CSS is `06-muster.html`'s, namespaced to `.seat` so a
 * direction stays free to use `.card` for an object of its own.
 */

/* Tokens ------------------------------------------------------------------ */

:root {
  --void-0: #0b0a16;
  --void-1: #141328;
  --void-2: #1d1b38;
  --edge: rgba(150, 140, 255, 0.16);
  --edge-hi: rgba(170, 160, 255, 0.34);
  --astral: #8f7fe8;
  --astral-hi: #c3b6ff;

  --pane-bg: rgba(20, 19, 40, 0.66);
  --pane-well: rgba(13, 12, 28, 0.8);

  --mana-W: #fffbd5;
  --mana-U: #aae0fa;
  --mana-B: #cbc2bf;
  --mana-R: #f9aa8f;
  --mana-G: #9bd3ab;
  --mana-C: #d0cbc4;

  --playable: #5ce08a;
  --targetable: #58b6ff;
  --staged: #ffc14d;
  --danger: #ff6b5e;
  --gain: #6ee7a0;
  --gold: #d8a63c;
  --frame-commander: #d8a63c;
  --dial-ink: #2a1c04;

  --text: #e6e3f5;
  --text-dim: #a09bc4;
  --text-faint: #837da8;

  /* The zone hues the client ships. Kept as-is; see the icon note in `_self.js`
     for why every mark also has a shape, which is a legibility argument and not
     an accessibility one -- ADR 0006. */
  --zone-lib: #7d6bd8;
  --zone-hand: #3f9e93;
  --zone-gy: #6f6a86;
  --zone-ex: #58637a;
  --zone-cmd: #c69a3a;
  --chip-ink: #0d0c1a;

  /* THE TYPE FLOOR. `../handheld/` measured 444 of 635 elements below 12px on
     the shipped board at 1280x800, smallest 2.11px, and took 16px as a hard
     constraint. This round inherits it unchanged. */
  --fs-min: 16px;
  --fs-body: 17px;
  --fs-lead: 20px;
  --fs-big: 28px;

  /* THE TARGET FLOOR, AND IT IS A LIVE GATE HERE IN A WAY IT WAS NOT ON THE
     SEAT. `06-muster.html` demoted an opponent's zone marks to non-controls
     because 96px will not hold a 44px row AND the battlefield row. A 518px
     column will, so on YOUR OWN orb four of the five zones go back to being
     buttons -- the library stays a plain element, because it is hidden
     information and a control that does nothing when clicked is worse than no
     control (`PlayerOrb.tsx:96-101`). */
  --hit: 44px;

  --t-fast: 110ms;
}

/* Pseudo-elements too. `*` does not match them, and a direction that draws its
   handed-back board as an `::after` with a border puts itself over budget in a
   way `overflow: hidden` then hides. */
*, *::before, *::after { box-sizing: border-box; }

/* `<small>` is a SIZE instruction and this round cannot afford one: 0.83em of
   16px body copy is 13.3px, under the floor, in markup that reads as
   reasonable. Same removal as `../seat/_seat.css`. */
small { font-size: inherit; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--void-0);
}

body {
  font: var(--fs-body)/1.35 "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: radial-gradient(80% 60% at 50% 34%, #14122a 0%, #05040c 72%);
  user-select: none;
  -webkit-user-select: none;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* The Deck frame ---------------------------------------------------------- */

.bezel { position: fixed; inset: 0; display: grid; place-items: center; }

.deck {
  position: relative;
  width: 1280px;
  height: 800px;
  flex: none;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 6px;
  padding: 6px;
  overflow: hidden;
  transform-origin: center center;
  border-radius: 14px;
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143, 127, 232, 0.13) 0%, transparent 62%),
    var(--void-0);
  box-shadow: 0 0 0 8px #0d0c18, 0 0 0 10px #262338, 0 30px 90px rgba(0, 0, 0, 0.8);
}

/*
 * THE ORB'S BOX, AS THE SHIPPED LAYOUT SETS IT.
 *
 *   deck       1280 x 800, 6px padding                -> 1268 x 788
 *   shell      1268 - 243 (--rail-r at 19vw) - 8 gap  -> play column 1017
 *   play       opponents 96 (--pod-seat-h) + 4 gap    -> viewer's mat 534 tall
 *   .mat       8px padding, kept -- `logic/zoomFit.ts` reads it as
 *              `VIEWER_MAT.padY`, so it is not free to change here alone
 *   .mat grid  var(--mat-side) + 6px gap
 *   --mat-side clamp(132px, 12vw, 190px) at 1280      -> 153.6 -> 154px
 *
 * So the orb is 154 x 518 and the lanes beside it are 841 x 518. A direction
 * may take a different box; it says so in its own file, the gate holds it to
 * whatever it declared, and the ghost lanes grow or shrink by what it took.
 */
.deck { --orb-w: 154px; --orb-h: 518px; }

.bezel__tag {
  position: fixed;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  max-width: 96vw;
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid rgba(150, 140, 255, 0.2);
  background: rgba(12, 11, 26, 0.88);
  font-size: 13px;
  color: #837da8;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  z-index: 99;
}
.bezel__tag b { color: #c3b6ff; font-weight: 600; }

/* The board, at the real proportions -------------------------------------- */

.shell {
  display: grid;
  /* `--rail-r: clamp(224px, 19vw, 280px)` resolves to 243px at 1280 wide.
     `--rail-l` is 0 on a handheld: the left rail is retired and the log becomes
     an overlay. handheld.css:150-163. */
  grid-template-columns: minmax(0, 1fr) 243px;
  gap: 8px;
  min-height: 0;
}

.play {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 4px;
  min-height: 0;
}

.opps { display: flex; gap: 10px; align-items: start; min-height: 0; }

/* The viewer's own mat: the orb, and the lanes it is taking room from. `.mine`
   keeps the 8px the shipped mat keeps and nothing else about it is styled. */
.mine {
  display: grid;
  grid-template-columns: var(--orb-w) minmax(0, 1fr);
  gap: 6px;
  padding: 8px;
  min-height: 0;
  border: 1px solid var(--edge);
  border-radius: 10px;
}

/* A direction that is not a column says so with `data-shape="banner"`, and the
   mat becomes one column of two rows instead of two columns of one. This is the
   only branch in the shared frame, and it exists because "should the orb be a
   column at all" is a question the round has to be able to ask. */
.mine[data-shape="banner"] {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: var(--orb-h) minmax(0, 1fr);
}

.orb { min-width: 0; height: var(--orb-h); }

/* --- The three opponents, as real muster seats ---------------------------
   `../seat/06-muster.html`'s card, namespaced. Not re-argued at length here;
   that file carries the reason for every number in this block.
-------------------------------------------------------------------------- */

.mat { flex: 0 0 332px; min-width: 0; height: 96px; }

.seat {
  position: relative;
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  grid-template-rows: 18px 22px 21px 20px;
  gap: 3px;
  height: 100%;
  padding: 3px;
  border-radius: 12px;
  overflow: hidden;
  isolation: isolate;
}

.seat__ground {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 28%;
}
.seat__veil {
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(90deg, rgba(6, 5, 14, 0.93) 0%, rgba(6, 5, 14, 0.87) 45%, rgba(6, 5, 14, 0.8) 100%),
    linear-gradient(180deg, rgba(6, 5, 14, 0.34), rgba(6, 5, 14, 0.5));
}

.seat__win {
  position: relative;
  grid-column: 1;
  grid-row: 1 / 3;
  border-radius: 8px;
  overflow: hidden;
  background: var(--pane-well);
}
.seat__win::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--edge-hi);
  pointer-events: none;
}
.seat__win img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 40%;
  display: block;
  filter: saturate(1.18) contrast(1.04) brightness(1.14);
}

.seat__head {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
  line-height: 18px;
}
.seat__name { font-size: var(--fs-body); font-weight: 700; white-space: nowrap; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
.seat__cmdr {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-min);
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.seat__gauge {
  position: relative;
  grid-column: 2;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0 4px;
  border-radius: 5px;
  background: var(--pane-well);
  overflow: hidden;
  font-size: var(--fs-min);
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.seat__gauge::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--fill, 0%);
  background: var(--gold);
  opacity: 0.5;
}
.seat__gauge > * { position: relative; }
.seat__life { font-size: var(--fs-lead); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }

.seat__tick {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: var(--w);
  background: repeating-linear-gradient(135deg, rgba(216, 166, 60, 0.85) 0 3px, rgba(216, 166, 60, 0.4) 3px 6px);
  box-shadow: inset 1px 0 0 var(--gold);
}
.seat__tick--warn {
  background: repeating-linear-gradient(135deg, var(--danger) 0 3px, rgba(255, 107, 94, 0.55) 3px 6px);
  box-shadow: inset 1px 0 0 #fff;
}
.seat__dmg {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  padding: 0 4px;
  border-radius: 5px;
  background: rgba(9, 8, 20, 0.78);
}
.seat__dmg .ico { font-size: 14px; color: var(--gold); }
.seat__dmg--warn { color: #fff; }
.seat__dmg--warn .ico { color: var(--danger); }
.seat__dmg--zero { opacity: 0.55; }

.seat__perms {
  grid-column: 1 / -1;
  grid-row: 3;
  display: flex;
  align-items: stretch;
  gap: 3px;
  min-width: 0;
}

.seat__zones {
  grid-column: 1 / -1;
  grid-row: 4;
  display: flex;
  align-items: stretch;
  gap: 3px;
  min-width: 0;
}

/* --- The shared cell vocabulary -------------------------------------------
 * THE MARKS EVERY FILE IN THIS ROUND DRAWS THE SAME WAY, because they are
 * `06-muster.html`'s and copying them per file is how five mockups quietly stop
 * being one family. A direction picks WHERE these go and what size box they sit
 * in; it does not get to re-invent what a permanent count looks like.
 *
 * `.perm` is the untapped/total cell: a flat tint saying WHICH KIND, and a 3px
 * bar along the bottom edge saying how much of it is still untapped. The two
 * encodings are deliberately separated -- bright is untapped, what you can
 * still do with it, and the dim trough is what has already been spent. The bar
 * is on the bottom edge and not through the middle because a meter that has to
 * dodge the slash in its own `10/12` is in the wrong place.
-------------------------------------------------------------------------- */

.perm {
  position: relative;
  display: flex;
  flex: 1 1 0;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 4px;
  border-radius: 5px;
  overflow: hidden;
  font-size: var(--fs-min);
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  background-color: var(--pane-well);
  background-image:
    linear-gradient(90deg, var(--edge-line) 0 var(--fill, 0%), rgba(255, 255, 255, 0.11) var(--fill, 0%)),
    linear-gradient(0deg, var(--tint), var(--tint));
  background-size: 100% var(--bar, 3px), 100% 100%;
  background-position: bottom left, top left;
  background-repeat: no-repeat, no-repeat;
  color: var(--text);
}
.perm .ico { font-size: 14px; }

.perm--land { --tint: rgba(155, 211, 171, 0.17); --edge-line: var(--mana-G); }
.perm--land .ico { color: var(--mana-G); }
.perm--creature { --tint: rgba(249, 170, 143, 0.17); --edge-line: var(--mana-R); }
.perm--creature .ico { color: var(--mana-R); }
/* Enchantments do not tap and the fixture carries no tapped flag for artifacts,
   so this cell has no fraction to draw and does not pretend to one. */
.perm--other { --tint: rgba(170, 224, 250, 0.16); --edge-line: var(--mana-U); --bar: 0; }
.perm--other .ico { color: var(--mana-U); }
.perm--zero { opacity: 0.45; }

.perm--detail {
  flex: 2 1 0;
  justify-content: flex-start;
  --tint: rgba(205, 200, 240, 0.14);
  --bar: 0;
}
.perm--detail .perm__pow { margin-left: auto; display: flex; align-items: center; gap: 3px; }
.perm--detail .ico { color: var(--text-dim); }

.pips { display: flex; align-items: center; gap: 3px; flex: 0 1 auto; overflow: hidden; }
.pip {
  width: 9px;
  height: 13px;
  flex: none;
  border-radius: 2px;
  border: 1.5px solid var(--text-dim);
}
.pip--up { background: var(--text); border-color: var(--text); }
.pip--fly { border-radius: 2px 5px 2px 2px; }
.pips__more { font-size: var(--fs-min); font-weight: 700; color: var(--text-dim); }

/* A zone mark. On an opponent's seat it is a mark; on the viewer's orb it is a
   `<button>` at 44px. That is the only difference and it is the round's first
   finding. The LOOK is identical either way on purpose -- a zone is the same
   object whoever owns it, and only its reachability changes. */
.zmark {
  position: relative;
  display: flex;
  flex: 1 1 0;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 4px;
  border-radius: 5px;
  font-size: var(--fs-min);
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--chip-ink);
}
.zmark .ico { font-size: 14px; color: var(--chip-ink); }
.zmark--lib { background: var(--zone-lib); }
.zmark--hand { background: var(--zone-hand); }
.zmark--gy { background: var(--zone-gy); }
.zmark--ex { background: var(--zone-ex); }
.zmark--cmd { background: var(--zone-cmd); }
.zmark--empty { opacity: 0.55; }
/* THE TARGET, WHICH IS BIGGER THAN THE CHIP INSIDE IT. Transparent and 44px
   tall: the panel spends the height on being reachable and spends no ink on it,
   so the viewer's five chips are the same size as an opponent's five and a thumb
   still lands. See `zoneMarks` in `_self.js` for why the first pass -- which
   made the chips themselves 68px -- was saying something untrue with size. */
.zhit {
  position: relative;
  display: grid;
  place-items: center;
  flex: 1 1 0;
  min-width: 0;
  height: var(--hit);
}
.zhit .zmark { width: 100%; }

/* WHICH OF THESE YOU CAN PRESS, DRAWN RATHER THAN LEARNED. Four of the five are
   buttons and the library is not -- it is hidden information, and
   `PlayerOrb.tsx:96-101` argues that a control which does nothing when clicked
   is worse than no control. The four get a lit top edge and a dropped bottom
   one, which is the oldest "this is pressable" cue there is; the library gets a
   recessed edge instead. The fills are identical, so the count reads at full
   contrast either way and the difference is in the RELIEF rather than in the
   colour -- which survives `e2e/greyscale.spec.ts`. */
.zhit .zmark {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), inset 0 -1px 0 rgba(0, 0, 0, 0.34);
}
.zmark--flat, .zhit .zmark--flat {
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
  filter: saturate(0.55);
}

/* --- The portrait, which is the button that casts your commander ----------
 * SHARED, not per-file, and that is a change from the first pass. Five mockups
 * each answering "is the commander castable, can I afford it, and what does the
 * rim look like" is five chances to answer it differently, and the
 * `aria-disabled` rule in `_self.js` is exactly the sort of thing that gets
 * dropped on the fourth copy. A direction sets the window's SIZE and where it
 * sits; everything below is the same object in all five.
 *
 * It is a `<button>` at 44px or more in both dimensions everywhere, so the
 * target floor covers it like any other control.
-------------------------------------------------------------------------- */

.win {
  position: relative;
  display: block;
  width: 100%;
  border-radius: 8px;
  overflow: hidden;
  background: var(--pane-well);
  text-align: left;
}
/* The ring is `::before` and not an inset shadow, because an inset shadow
   paints under the image -- and `::after` is spoken for by the hover label. */
.win::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 4;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--edge-hi);
  pointer-events: none;
}
/* CASTABLE AND AFFORDABLE: the same `--playable` rim every castable card in the
   client takes, which is the whole point of using that token rather than a
   colour picked for this panel. */
.win--ready::before { box-shadow: inset 0 0 0 2px var(--playable); }
/* In the command zone and you cannot pay yet. Priced, not lit -- the distinction
   the `unpaid` review state exists to keep honest. */
.win--short::before { box-shadow: inset 0 0 0 1px var(--staged); }

/* A LIFT, NOT A LOOK. A dark painting on a dark panel is a dark patch, and the
   claim across a pod is that four seats are told apart by the picture. */
/* `>` AND NOT A DESCENDANT SELECTOR, which cost an afternoon. The caption strip
   inside this same button holds the commander's mana cost, and those are
   `<img class="sym">` too -- so `.win img` stretched three 16px mana symbols to
   148 x 21 and the cost row rendered as a cream smear with black wedges in it.
   The portrait is the button's only direct-child image. */
.win > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 40%;
  filter: saturate(1.18) contrast(1.04) brightness(1.14);
}
.win--empty { display: grid; place-items: center; color: var(--text-faint); }
.win--empty .ico { font-size: 30px; }
.win--out > img { filter: grayscale(1) brightness(0.5); }

/* The two strips. Opaque rather than a scrim, so no type on the picture depends
   on what the painting happens to look like -- and between them they are the
   reason no direction here spends a row on a name or a cost. */
.win__who, .win__cap {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 3px;
  height: 21px;
  padding: 0 4px;
  min-width: 0;
  background: rgba(9, 8, 20, 0.82);
  line-height: 1;
}
.win__who { top: 0; font-size: var(--fs-body); font-weight: 700; }
.win__cap { bottom: 0; font-size: var(--fs-min); font-weight: 800; }
/* The state word sits at the far end, so the price reads as one object and what
   the price is FOR as another. */
.win__st { margin-left: auto; font-weight: 700; color: var(--text-dim); white-space: nowrap; }
.win--ready .win__st { color: var(--playable); }
.win--short .win__st { color: var(--staged); }
.win--out .win__st { color: var(--danger); }
.win__sub {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--fs-min);
  font-weight: 400;
  color: var(--danger);
}
/* Commander tax, beside the cost it modifies -- the only arrangement in which a
   surcharge means anything. `PlayerOrb.tsx:454-456` keeps it off the foot for
   exactly this reason. */
.tax { color: var(--staged); font-variant-numeric: tabular-nums; }

/* --- A dial: life drawn as a ring -----------------------------------------
 * SHARED, because two directions draw one and a CSS donut is exactly the kind
 * of thing that gets built two different broken ways. Both of them happened
 * here before this block existed, and both are worth writing down:
 *
 *   1. `::after` IS SPOKEN FOR. The dial carries `data-name`, and the hover
 *      label at the bottom of this file uses `[data-name]::after` -- including
 *      `opacity: 0`, which a file's own `::after` does not override unless it
 *      says so. The hole is a real child element for that reason.
 *   2. `.dial > *` MATCHED THE HOLE. At equal specificity the later rule wins,
 *      so a blanket `position: relative` on the children turned the hole's
 *      `position: absolute` off and its `inset` into an offset. The two text
 *      spans are named individually instead.
 *
 * Both bugs render identically -- a solid pie where a ring was meant -- which
 * is why the second one took as long as the first.
 *
 * A direction sets `width`, `height`, `--ring` and the numeral's size. Nothing
 * else.
-------------------------------------------------------------------------- */

.dial {
  position: relative;
  display: grid;
  place-items: center;
  align-content: center;
  border-radius: 50%;
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.dial::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(var(--gold) 0 var(--fill, 0%), rgba(255, 255, 255, 0.09) var(--fill, 0%) 100%);
}
.dial__hole {
  position: absolute;
  inset: var(--ring, 12px);
  border-radius: 50%;
  background: var(--void-1);
}
.dial__n, .dial__of { position: relative; z-index: 1; }
.dial__of { font-size: var(--fs-min); color: var(--text-dim); }
.dial--out::before { background: rgba(255, 107, 94, 0.22); }
.dial--out .dial__n { font-size: var(--fs-lead); color: var(--danger); }

/* A mana group: one mark per KIND with a count, never one per mana. Ten
   untapped lands as ten pips wrapped a 190px column to three lines, and
   grouping is also how players say it out loud. `--spend` is what a hovered
   spell would take, drawn as a faint negative beside the count rather than by
   hollowing it -- the question being answered is "and what will that leave me
   with". Which lands those are comes from the engine's solved payment, never
   from arithmetic here; see `logic/mana.ts`. */
.mgrp {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  padding: 0 4px;
  border-radius: 5px;
  background: var(--pane-well);
  font-size: var(--fs-min);
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.mgrp__n { color: var(--text); }
.mgrp__spend { color: var(--staged); font-weight: 700; }
.mgrp--spent { box-shadow: inset 0 0 0 1px var(--staged); }
/* A source that makes one of several colours has no published symbol and must
   not be given one: the player picks when they tap it, and the split disc says
   so. `cycle3.spec.ts` asserts the letter-on-a-disc fallback never renders. */
.mgrp__any {
  width: 1.02em;
  height: 1.02em;
  flex: none;
  border-radius: 50%;
  background: conic-gradient(from 220deg, var(--mana-G) 0 50%, var(--mana-U) 50% 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
}
.mgrp--none { color: var(--text-faint); }

/* THE ONE GAP. Every direction here is a fixed stack with a single elastic
   spacer in it, because `PlayerOrb.tsx:441-457` records what the alternative
   cost: conditional rows in a `space-between` column floated in the slack, and
   each time one appeared or emptied the whole interior re-spaced itself. The
   mana block is the only thing left whose height changes -- press `s` to
   `unpaid` and it halves -- and that difference is paid entirely here. */
.slack { flex: 1 1 auto; min-height: 0; }

/* --- The ghosts -----------------------------------------------------------
   Everything that is not the orb, drawn as what it is: the room the orb is
   spending. Every pixel the orb takes is a pixel off the lanes, and at 800px of
   height that trade is the argument.
-------------------------------------------------------------------------- */

.gh {
  border: 1px dashed rgba(150, 140, 255, 0.22);
  border-radius: 10px;
  background: rgba(20, 19, 40, 0.3);
  color: rgba(160, 155, 196, 0.55);
  min-height: 0;
  overflow: hidden;
}

.gh__tag {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(160, 155, 196, 0.5);
  white-space: nowrap;
}

.gh--lanes { display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 6px; padding: 6px; min-height: 0; }
.gh__lane { display: flex; align-items: center; gap: 5px; min-height: 0; overflow: hidden; }
.gh__lane .gh__tag { width: 74px; flex: none; }

.gh__card {
  flex: none;
  width: 66px;
  height: 92px;
  border: 1px dashed rgba(150, 140, 255, 0.28);
  border-radius: 5px;
  background: rgba(30, 28, 56, 0.4);
}
.gh__card--hand { width: 92px; height: 128px; border-radius: 7px; }
/* The cards a direction HANDED BACK by not being a column, and the ones it took
   away. Drawn rather than claimed, for the same reason `../seat/05-totem` drew
   its returned board: room recovered is the argument, and an argument you
   cannot see is an assertion. */
.gh__card--won { border-color: rgba(92, 224, 138, 0.5); background: rgba(92, 224, 138, 0.07); }
.gh__card--lost { border-color: rgba(255, 107, 94, 0.42); background: rgba(255, 107, 94, 0.06); }

.gh--rail { display: grid; place-items: center; padding: 8px; text-align: center; }

.gh--foot {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 148px;
  padding: 8px 12px;
}
.gh--foot .gh__tag { width: 46px; }
.gh__slab {
  margin-left: auto;
  display: grid;
  place-items: center;
  width: 210px;
  height: 60px;
  border: 1px dashed rgba(150, 140, 255, 0.3);
  border-radius: 10px;
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* The marks ---------------------------------------------------------------- */

/* Sized off the type they sit beside, so a mark inside a 17px row and one
   inside a 28px numeral both look like they belong. */
.ico { width: 1em; height: 1em; flex: none; display: block; }

.sym { width: 1.02em; height: 1.02em; flex: none; vertical-align: -0.13em; }

.tabular { font-variant-numeric: tabular-nums; }

/* `m` -- the gate, drawn where it failed ----------------------------------- */
.deck[data-measure="yes"] [data-cell] { outline: 1px solid rgba(88, 182, 255, 0.5); }
[data-bad] { outline: 2px dashed var(--danger) !important; outline-offset: 1px; position: relative; }
[data-bad]::after {
  content: attr(data-bad);
  position: absolute;
  left: 0;
  bottom: calc(100% + 2px);
  z-index: 90;
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--danger);
  color: #1a0705;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  pointer-events: none;
}

/* --- The name of a mark, one input away -----------------------------------
   `::after` IS SPOKEN FOR ON ANY ELEMENT CARRYING `data-name`, AND THAT IS A
   TRAP WORTH WRITING DOWN. 04's life dial drew its ring as a conic `::before`
   with a `::after` punched out of the middle, which is the standard one-element
   donut -- and the donut rendered as a solid pie, because the rule below had
   already set `opacity: 0` on that pseudo-element and the file's own `::after`
   overrode only the properties it happened to declare.

   A direction that needs a second layer on a named element uses a real child.
   `::before` is free; `::after` is not.
-------------------------------------------------------------------------- */
   `attr(aria-label)` and never a second hand-written string: the accessible
   name and the visible name cannot then disagree. `:hover` covers the Deck's
   trackpad and touchscreen, `[data-cursor]` covers the pad and the keyboard,
   and between them that is every way anyone touches this app. A `title` would
   have covered only the mouse, which is why there are none left in the client
   and none in this round -- the gate fails a file that grows one. */
[data-name]::after {
  content: attr(aria-label);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 5px);
  z-index: 80;
  padding: 3px 9px;
  border: 1px solid var(--edge-hi);
  border-radius: 6px;
  background: var(--void-2);
  color: var(--text);
  font-size: var(--fs-min);
  font-weight: 700;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-50%) translateY(3px);
  transition: opacity var(--t-fast) ease, transform var(--t-fast) ease;
  pointer-events: none;
}
[data-name]:hover::after, [data-name][data-cursor]::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  [data-name]::after { transition: none; }
}
/* <<< END _self.css >>> */

/* ============================================================================
   01 LEDGER -- the five surviving facts, at the size the room now allows
   ----------------------------------------------------------------------------
   THE CONSERVATIVE ONE, and the bar the other four have to clear. Same column
   the client already gives the orb -- 154 x 518 -- same order the shipped panel
   uses, nothing invented. What changed is what is NOT here.

   The first pass drew this column in muster's cells and it passed every gate
   while still reading as a wall of numbers: three commander-damage rows, a
   21-notch gauge, land/creature/other counts, a power figure and eight creature
   pips. Roughly 160px of a 518px panel spent on two subjects that are already
   on screen -- commander damage on the opponents' seats above, and the board in
   the 841 x 518 of lanes beside. `_self.js`'s header has the full argument.

   WHAT IS LEFT IS FIVE THINGS:

       the portrait          148 x 170, and it is the button that casts
       the commander's name  two lines, 36px
       life                  a 100px cell with a 48px numeral
       mana                  four groups, two to a row, 30px each
       the five zones        21px chips, in 44px targets

   AND THE ZONE CHIPS ARE 21px, WHICH IS A CORRECTION WORTH RECORDING. A draft
   of this file made them 44, then 68, then 72, on the reasoning that the floor
   is a floor and the room existed. Set beside the opponents' seats six pixels
   above -- whose chips are 20px -- they read as bloated: the same five facts, in
   the same colours, three times the size, on the panel that needed the least
   emphasis. SIZE IS A SIGNAL AND IT WAS SAYING SOMETHING UNTRUE.

   The chip is a seat's, to the pixel, and it sits inside a transparent 44px
   button. The panel spends the height on being reachable and none of its ink on
   it. See `zoneMarks` in `_self.js`.

   ----------------------------------------------------------------------------
   WHERE THE ROOM WENT INSTEAD: THE PICTURE AND THE LIFE TOTAL

   Those are the two things on this panel that cannot be mistaken for an
   opponent's, so they are where a viewer's extra 364px is worth spending.

   `art_crop` is 626 x 457 -- 1.37:1 -- and `mockups/README.md` records there is
   nothing sharper to fetch. 148 x 170 is 0.87:1, so `cover` shows about 64% of
   the painting's width. That is a deliberate middle: 02 keeps the whole
   composition at 92 x 68, 03 goes to 148 x 250 and shows about 40%.

   ----------------------------------------------------------------------------
   ALL THE SLACK IN ONE GAP, WHICH IS NOT A STYLE CHOICE

   `PlayerOrb.tsx:441-457` records what the alternative cost: mana and commander
   damage were conditional rows in a `space-between` column, so they floated in
   the slack and the whole interior re-spaced itself every time one appeared.

   With commander damage gone, THE MANA BLOCK IS THE ONLY THING LEFT WHOSE
   HEIGHT CHANGES -- four groups on a good turn, two when you are nearly tapped
   out. Press `s` to `unpaid`: the block halves and the life cell, the name and
   all five buttons stay exactly where they were.

   No build, no server, no network. Local ../art/ only.
   ========================================================================== */

.orb {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 3px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--pane-bg);
  box-shadow: inset 0 0 0 1px var(--edge);
}

.win { flex: none; height: 170px; }

.name {
  flex: none;
  height: 36px;
  font-size: var(--fs-min);
  line-height: 18px;
  font-weight: 700;
  overflow: hidden;
  /* Two lines and then an ellipsis. A one-line clamp is what produced the
     "Aesi, Tyra..." `docs/mockup-fidelity.md` logs as defect 5; two lines hold
     every commander name in the fixture. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* --- Life ----------------------------------------------------------------
   One number, one well, and the fill behind it. There is no commander damage
   closing from the right any more, so the bar means exactly one thing -- which
   is what makes a 48px numeral sitting on it readable rather than busy. In the
   first pass this same cell was 30px tall and carried two hatched ticks, a
   crown chip and a second numeral.
-------------------------------------------------------------------------- */

.life {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 3px;
  height: 100px;
  padding: 0 4px;
  border-radius: 5px;
  background: var(--pane-well);
  overflow: hidden;
  font-size: var(--fs-min);
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
/* A pseudo-element and not a child, so the numerals sit ON the fill and the
   cell's width is never a function of how full it is. */
.life::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--fill, 0%);
  background: var(--gold);
  opacity: 0.45;
}
.life > * { position: relative; }
.life__n { font-size: 48px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
.life__of { color: var(--text-dim); }
.orb--out .life::before { width: 0; }
.orb--out .life__n { font-size: var(--fs-lead); color: var(--danger); }

/* --- Mana ----------------------------------------------------------------
   Two to a row rather than one, which is the difference between this and 05.
   A 148px column fits two groups of 72, and a group needs 58 to hold a symbol,
   a count and a `-1`, so two is comfortable and four would not be.

   IT IS A GRID AND NOT A FLEX WRAP on purpose: a wrap reflows sideways when a
   colour empties, and a grid drops a whole row. A row disappearing is legible;
   three chips shuffling left is not.
-------------------------------------------------------------------------- */

.mana { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.mana .mgrp { height: 30px; }

/* --- The zones, at 68 ------------------------------------------------------
   Three then two. The break falls after the third mark, so exile -- the one
   zone that comes and goes -- lands at the start of the second row and the
   command zone never changes rows.
-------------------------------------------------------------------------- */

.zones { flex: none; display: flex; flex-direction: column; gap: 3px; }
/* `center`, not `stretch`: the library is a bare 21px chip and the other four
   are 21px chips inside 44px buttons, so a stretch row hangs the library from
   the top while its neighbours sit in the middle of theirs. */
.zones__row { display: flex; align-items: center; gap: 3px; min-width: 0; }
.zones .zmark { height: 21px; font-size: var(--fs-min); }
.zones .zmark .ico { font-size: 14px; }

/* --- States --------------------------------------------------------------
   TWO DIFFERENT THINGS, DRAWN TWO WAYS, which is the one channel the shipped
   orb collapses: `.orb__priority` is a single dot meaning "has priority", and
   whose turn it is has no mark on the panel at all. Muster already separates
   them on a seat -- a ring for the active player, a tick for the one who may
   act -- and this round keeps the pairing so the same two marks mean the same
   two things wherever they appear on the table.

   NEITHER IS A WORD. The first pass also wrote "Your turn" on the portrait,
   which is a third encoding of a fact a ring and a tick already carry.
-------------------------------------------------------------------------- */

.orb--active { box-shadow: inset 0 0 0 2px var(--astral-hi); }
/* Positioned against the ORB and not the deck. Muster's own first gate bug was
   this tick resolving against an ancestor and drawing outside the component,
   invisibly, under `overflow: hidden`. */
.orb__pri {
  position: absolute;
  top: 0;
  left: 16px;
  width: 36px;
  height: 4px;
  border-radius: 0 0 3px 3px;
  background: var(--astral-hi);
  z-index: 6;
}
.orb--out { opacity: 0.64; }
</style>
