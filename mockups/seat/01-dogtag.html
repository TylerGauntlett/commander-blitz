<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opponent seat — Dogtag (seat 01)</title>
<style>
/* <<< BEGIN _seat.css >>> */
/*
 * The frame every seat mockup is judged inside.
 *
 * NOT LINKED. `inline.py` splices this between each file's BEGIN and END
 * `_seat.css` markers, so every file opens standalone from file://.
 *
 * WHAT IS IN HERE: the Deck bezel, the ghosted board the seat is taking room
 * from, the palette (the shipped client's, token for token, out of
 * frontend/src/theme.css), the type floor and the icon base.
 *
 * WHAT IS NOT: one single rule about how a seat is laid out. `.mat` gets its
 * width and its height budget here and nothing else -- no padding, no radius,
 * no background -- because THE PADDING IS ONE OF THE THREE THINGS THIS ROUND IS
 * ABOUT and a shared plate style would quietly answer it for all five. Each
 * file styles its own seat, declares its own `--seat-h` if its thesis needs a
 * different one, and pays for it in the ghost board below.
 */

/* Tokens ------------------------------------------------------------------ */

:root {
  --void-0: #0b0a16;
  --void-1: #141328;
  --void-2: #1d1b38;
  --edge: rgba(150, 140, 255, 0.16);
  --edge-hi: rgba(170, 160, 255, 0.34);
  --astral: #8f7fe8;
  --astral-hi: #c3b6ff;

  --pane-bg: rgba(20, 19, 40, 0.66);
  --pane-well: rgba(13, 12, 28, 0.8);

  --mana-W: #fffbd5;
  --mana-U: #aae0fa;
  --mana-B: #cbc2bf;
  --mana-R: #f9aa8f;
  --mana-G: #9bd3ab;
  --mana-C: #d0cbc4;

  --playable: #5ce08a;
  --targetable: #58b6ff;
  --staged: #ffc14d;
  --danger: #ff6b5e;
  --gain: #6ee7a0;
  --gold: #d8a63c;
  --frame-commander: #d8a63c;
  --dial-ink: #2a1c04;

  --text: #e6e3f5;
  --text-dim: #a09bc4;
  --text-faint: #837da8;

  /* The zone hues the client ships. Kept as-is; see the icon note in `_seat.js`
     for why every mark also has a shape, which is a legibility argument and not
     an accessibility one -- ADR 0006. */
  --zone-lib: #7d6bd8;
  --zone-hand: #3f9e93;
  --zone-gy: #6f6a86;
  --zone-ex: #58637a;
  --zone-cmd: #c69a3a;
  --chip-ink: #0d0c1a;

  /* THE TYPE FLOOR. `../handheld/` measured 444 of 635 elements below 12px on
     the shipped board at 1280x800, smallest 2.11px, and took 16px as a hard
     constraint. This round inherits it unchanged: a seat is not exempt from a
     floor because it is small. */
  --fs-min: 16px;
  --fs-body: 17px;
  --fs-lead: 20px;
  --fs-big: 28px;

  /* THE TARGET FLOOR. Four of the five zone marks are the only route into
     `ZonePeek`, so they are real buttons and are held to 44px. */
  --hit: 44px;

  --t-fast: 110ms;
}

/* Pseudo-elements too. `*` does not match them, and 05 draws the returned board
   as an `::after` with a 1px dashed border -- which put the opponents' row 2px
   over its own budget and failed the round's own gate. */
*, *::before, *::after { box-sizing: border-box; }

/* `<small>` is a SIZE instruction and this round cannot afford one: 0.83em of
   16px body copy is 13.3px, under the floor, in markup that reads as
   reasonable. Same removal as `../handheld/_handheld.css`. */
small { font-size: inherit; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--void-0);
}

body {
  font: var(--fs-body)/1.35 "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: radial-gradient(80% 60% at 50% 34%, #14122a 0%, #05040c 72%);
  user-select: none;
  -webkit-user-select: none;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* The Deck frame ---------------------------------------------------------- */

.bezel { position: fixed; inset: 0; display: grid; place-items: center; }

.deck {
  position: relative;
  width: 1280px;
  height: 800px;
  flex: none;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 6px;
  padding: 6px;
  overflow: hidden;
  transform-origin: center center;
  border-radius: 14px;
  background:
    radial-gradient(60% 44% at 50% 6%, rgba(143, 127, 232, 0.13) 0%, transparent 62%),
    var(--void-0);
  box-shadow: 0 0 0 8px #0d0c18, 0 0 0 10px #262338, 0 30px 90px rgba(0, 0, 0, 0.8);
}

/* THE HEIGHT BUDGET, AS THE SHIPPED LAYOUT SETS IT.
   `--pod-seat-h` is 96px at one and two opponents (handheld.css:160) and 84 at
   three, taken by `:has(> .mat--compact:nth-child(3))` (handheld.css:1041).
   Those twelve pixels go to the viewer's own mat, which is what overflows first
   in a four-seat pod, and the file's own note records that lowering the cap
   further "only moved the overflow rather than removing it".

   A direction may take a different budget; it says so in its own file, the gate
   holds it to whatever it declared, and the ghost board shrinks by what it
   took. */
.deck[data-density="1"], .deck[data-density="2"] { --seat-h: 96px; }
.deck[data-density="3"] { --seat-h: 84px; }

.bezel__tag {
  position: fixed;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  max-width: 96vw;
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid rgba(150, 140, 255, 0.2);
  background: rgba(12, 11, 26, 0.88);
  font-size: 13px;
  color: #837da8;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  z-index: 99;
}
.bezel__tag b { color: #c3b6ff; font-weight: 600; }

/* The board, at the real proportions -------------------------------------- */

.shell {
  display: grid;
  /* `--rail-r: clamp(224px, 19vw, 280px)` resolves to 243px at 1280 wide.
     `--rail-l` is 0 on a handheld: the left rail is retired and the log becomes
     an overlay. handheld.css:150-163. */
  grid-template-columns: minmax(0, 1fr) 243px;
  gap: 8px;
  min-height: 0;
}

.play {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 4px;
  min-height: 0;
}

/* The row the whole round is about. `.play__opponents` in board.css: a flex row
   with a 10px gap, so three seats of 1017px come to 332 each. */
.opps { display: flex; gap: 10px; align-items: start; min-height: 0; }

.mat {
  flex: 1 1 0;
  min-width: 0;
  height: var(--seat-h);
}

/* The ghosts. Everything that is not the seat, drawn as what it is: the room
   the seat is spending. */
.gh {
  border: 1px dashed rgba(150, 140, 255, 0.22);
  border-radius: 10px;
  background: rgba(20, 19, 40, 0.3);
  color: rgba(160, 155, 196, 0.55);
  min-height: 0;
  overflow: hidden;
}

.gh__tag {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(160, 155, 196, 0.5);
  white-space: nowrap;
}

.gh--mine { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px; padding: 6px; }
.gh__side { display: grid; place-items: center; border-right: 1px dashed rgba(150, 140, 255, 0.18); }
.gh__lanes { display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 6px; min-height: 0; }
.gh__lane { display: flex; align-items: center; gap: 5px; min-height: 0; overflow: hidden; }
.gh__lane .gh__tag { width: 74px; flex: none; }

.gh__card {
  flex: none;
  width: 66px;
  height: 92px;
  border: 1px dashed rgba(150, 140, 255, 0.28);
  border-radius: 5px;
  background: rgba(30, 28, 56, 0.4);
}
.gh__card--hand { width: 92px; height: 128px; border-radius: 7px; }

.gh--rail { display: grid; place-items: center; padding: 8px; text-align: center; }

.gh--foot {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 148px;
  padding: 8px 12px;
}
.gh--foot .gh__tag { width: 46px; }
.gh__slab {
  margin-left: auto;
  display: grid;
  place-items: center;
  width: 210px;
  height: 60px;
  border: 1px dashed rgba(150, 140, 255, 0.3);
  border-radius: 10px;
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* The marks ---------------------------------------------------------------- */

/* Sized off the type they sit beside, so a mark inside a 17px row and one
   inside a 28px numeral both look like they belong. */
.ico { width: 1em; height: 1em; flex: none; display: block; }

.sym { width: 1.02em; height: 1.02em; flex: none; vertical-align: -0.13em; }

.tabular { font-variant-numeric: tabular-nums; }

/* `m` -- the gate, drawn where it failed ----------------------------------- */
.deck[data-measure="yes"] [data-cell] { outline: 1px solid rgba(88, 182, 255, 0.5); }
[data-bad] { outline: 2px dashed var(--danger) !important; outline-offset: 1px; position: relative; }
[data-bad]::after {
  content: attr(data-bad);
  position: absolute;
  left: 0;
  bottom: calc(100% + 2px);
  z-index: 90;
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--danger);
  color: #1a0705;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  pointer-events: none;
}

/* The name of a mark, one input away --------------------------------------
   `attr(aria-label)` and never a second hand-written string: the accessible
   name and the visible name cannot then disagree. `:hover` covers the Deck's
   trackpads and touchscreen, `[data-cursor]` covers the pad and the keyboard,
   and between them that is every way anyone touches this app. A `title` would
   have covered only the mouse, which is why there are none left in the client
   and none in this round -- the gate fails a file that grows one. */
[data-name]::after {
  content: attr(aria-label);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 5px);
  z-index: 80;
  padding: 3px 9px;
  border: 1px solid var(--edge-hi);
  border-radius: 6px;
  background: var(--void-2);
  color: var(--text);
  font-size: var(--fs-min);
  font-weight: 700;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-50%) translateY(3px);
  transition: opacity var(--t-fast) ease, transform var(--t-fast) ease;
  pointer-events: none;
}
[data-name]:hover::after, [data-name][data-cursor]::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  [data-name]::after { transition: none; }
}
/* <<< END _seat.css >>> */

/* ============================================================================
   01 DOGTAG -- one cell, one gutter, one radius
   ----------------------------------------------------------------------------
   THESIS. The complaint that opened this round is that nothing on the strip
   lines up, and that complaint is about UNITS, not about architecture. So this
   direction changes no information and no ordering whatsoever. It declares four
   constants and refuses to have a fifth:

       --cell 44px   the height of everything, and the touch floor
       --gut   4px   the only gap on the seat
       --rad   8px   the only corner
       --pad   4px   the only padding, and only the plate has it

   Every datum on the seat is then one cell in one rack. The threat line stops
   being a run of prose and becomes cells; the commander-damage plate stops
   being a plate and becomes cells; the zone marks already were cells and now
   everybody else matches them. The rack wraps, so the seat is the same markup
   at every density and the only thing that changes is how many rows it takes.

   This is the CONSERVATIVE direction and the cheapest port: `PlayerOrb.tsx`'s
   markup survives almost untouched, `.orb__spine` swaps `threatClause` for a
   mark and a number, and `handheld.css`'s three `:has()` density branches are
   replaced by `flex-wrap`.

   WHAT IT COSTS, STATED UP FRONT: it does not fit three seats. Fifteen cells of
   about 48px is 780px of rack, and three opponents get 332px each -- so the
   seat wraps to three rows and stands 152px tall against a budget of 74. At ONE
   opponent it is the best number in the round, 56px against 96, because one row
   of 44px cells is all it ever needed. Judge this one on the idea and on the
   duel, not on the pod.

   No build, no server, no network. Local ../art/ and ../cards/symbols/ only.
   ========================================================================== */

.deck {
  --cell: 44px;
  --gut: 4px;
  --rad: 8px;
  --pad: 4px;
}

/* The budget, taken rather than assumed -- and one of the three is a failure.
   `assert.js` compares the row against whatever a file declares here, so a
   direction cannot pass by quietly moving its own goalposts; the README's table
   compares these three numbers against 96 / 96 / 74. */
.deck[data-density="1"] { --seat-h: 54px; }   /* one row   -- 42px BACK to the board */
.deck[data-density="2"] { --seat-h: 102px; }  /* two rows  -- 6px over the 96 budget */
.deck[data-density="3"] { --seat-h: 150px; }  /* three rows -- 76px over the 74 budget */

.dog {
  position: relative;
  height: 100%;
  padding: var(--pad);
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: var(--pane-bg);
}

/* THE RACK. One row until it cannot be, and then two, and then three. No
   `:has()`, no seat count, no media query -- the layout is a consequence of the
   width rather than a branch taken on the number of opponents, which is the one
   structural thing this direction is arguing for. */
.dog__rack {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: var(--gut);
  height: 100%;
}

/* One cell. Every rule below sets width or colour and nothing else touches the
   height, the radius or the padding -- that is the whole discipline. */
.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--gut);
  flex: none;
  height: var(--cell);
  min-width: var(--cell);
  padding: 0;
  border-radius: var(--rad);
  background: var(--pane-well);
  font-size: var(--fs-min);
  line-height: 1;
  color: var(--text);
}

.cell b { font-size: var(--fs-lead); font-weight: 800; }
.cell .ico { font-size: 19px; color: var(--text-dim); }

/* Identity. The one cell that is left-aligned and the one that flexes, so the
   slack in the rack has somewhere to go rather than being distributed into
   fifteen gaps of different sizes. */
.cell--id {
  flex: 1 1 96px;
  min-width: 88px;
  justify-content: flex-start;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  padding: 0 8px;
  background: none;
  overflow: hidden;
}
.dog__name {
  font-size: var(--fs-body);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
/* WHICH COMMANDER is the most decision-changing fact about a seat whose board
   is not drawn -- `handheld.css` says so at length and then truncates it to
   "Aesi, Tyra..." beside 700px of empty column. Here it is the thing the flex
   track grows for. */
.dog__cmdr {
  font-size: var(--fs-min);
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.cell--art { width: var(--cell); overflow: hidden; background: var(--void-2); }
/* No art is a real state -- see the `noart` note in `_seat.js`. The cell keeps
   its width, so nothing in the rack moves when the picture is not there. */
.cell--art--none { box-shadow: inset 0 0 0 1px var(--edge); }
.cell--art img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Life. The one number people hunt for, so it is the widest cell and the only
   one at --fs-big. It is still exactly 44px tall. */
.cell--life { width: 58px; background: linear-gradient(180deg, #f0d38a, #c99a34); }
.dog__life { font-size: var(--fs-big); font-weight: 800; color: var(--dial-ink); }
.dog--out .cell--life { background: #3a2020; }
.dog--out .dog__life { font-size: var(--fs-body); color: var(--danger); }

/* Commander damage. Still a per-source count, still against 21, but the fill is
   the fraction of 21 rather than a meter parked under the chip -- so the cell
   itself gets fuller as the seat gets closer to dying and the warn tier needs no
   second colour to be visible. */
.cell--dmg {
  width: 52px;
  padding: 0;
  background:
    linear-gradient(90deg, rgba(216, 166, 60, 0.55) 0 var(--fill), transparent var(--fill)),
    var(--pane-well);
}
.cell--dmg .ico { color: var(--gold); }
.cell--dmg--zero { opacity: 0.42; }
.cell--dmg--warn { background: linear-gradient(90deg, var(--danger) 0 var(--fill), rgba(255,107,94,.18) var(--fill)); }
.cell--dmg--warn b, .cell--dmg--warn .ico { color: #1a0705; }

/* Threat. The clause "1 untapped" becomes a mark and a number, in a cell the
   same size as every other cell. The word comes back on hover and on the ring
   -- `[data-name]` in the shared sheet -- so nothing is lost, it is one input
   away, which is exactly the trade `.pile__label` already made. */
.cell--t { width: 48px; position: relative; }
.cell--t b { color: var(--text); }

/* Zones. Colour AND shape. The shipped strip drops `.pile__label` at 16px, so a
   chip's tint and its position in a fixed order are the only things naming it --
   which only helps a player who has already learned both. The mark names it. */
.cell--z { width: 50px; position: relative; }
.cell--z .ico { color: var(--chip-ink); }
.cell--z b { color: var(--chip-ink); }
.cell--z--lib { background: var(--zone-lib); }
.cell--z--hand { background: var(--zone-hand); }
.cell--z--gy { background: var(--zone-gy); }
.cell--z--ex { background: var(--zone-ex); }
.cell--z--cmd { background: var(--zone-cmd); }
.cell--z--empty { opacity: 0.5; }

/* A control looks like a control. The two zones that are hidden information on
   an opponent's seat -- library always, hand unless something has been revealed
   -- are marks and not buttons, which is `PlayerOrb.tsx`'s own rule for the
   library applied to the zone beside it. */
button.cell--z { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.28); }
button.cell--z:hover { box-shadow: inset 0 0 0 2px #fff; }
.cell--z--flat { opacity: 0.86; }

/* The seat's own states. */
.dog--active { border-color: var(--astral-hi); box-shadow: 0 0 0 1px var(--astral-hi) inset; }
.dog__pri {
  position: absolute;
  top: -1px;
  left: 14px;
  width: 34px;
  height: 4px;
  border-radius: 0 0 3px 3px;
  background: var(--astral-hi);
}
.dog--targetable { border-color: var(--targetable); box-shadow: 0 0 0 3px rgba(88, 182, 255, 0.35); }
.dog--out { opacity: 0.6; }
.dog__cmdr--out { color: var(--danger); }
</style>
</head>
<body>
<div id="root"></div>

<script>
// <<< BEGIN _seat.js >>>
/* ===========================================================================
   The opponent seat -- the shared fixture, the icon set and the review shell.

   NOT LOADED. `inline.py` splices this between each file's BEGIN and END
   `_seat.js` markers, because a <script src> does not load from file:// and
   every mockup in this repo opens standalone. (The markers are not spelled out
   in this comment: a master that names its own marker gets a second copy of it
   spliced into every file, and the splicer refuses the file next time.)

   WHAT IS SHARED AND WHY. These five are five STRUCTURES for one component, so
   the content, the icons, the review chrome and the ghosted board they sit on
   are identical in all five and only `seatHTML()` differs. Each file defines
   that one function and its own CSS; everything else on screen is this file.
   A difference between two of these mockups is therefore a difference in how
   the seat is laid out, which is the only thing the round is trying to compare.

   ---------------------------------------------------------------------------
   THE TWO WIDTHS, MEASURED RATHER THAN GUESSED

   `handheld.css` re-values the rails inside `@media (max-width: 1366px)`, so at
   1280x800 the board column is:

       1280 - 12 (deck padding) - 8 (gap) - 243 (--rail-r at 19vw) = 1017px

   and `.play__opponents` is a flex row with a 10px gap. So a seat gets:

       one opponent      1017 x 96      (--pod-seat-h, handheld.css:160)
       two opponents       503 x 96
       three opponents     332 x 84      (the shorter cap, handheld.css:1041)

   332 x 84 is the design problem. 1017 x 96 is the one the shipped strip was
   drawn for, which is why it stretches rather than compacts -- the same mistake
   the desktop round found in `.orb--compact`, arriving one layout later.

   AND THE SHIPPED SEAT DOES NOT ACTUALLY FIT 332 x 84 EITHER. From the SECOND
   opponent onwards, `handheld.css:1097-1100` sets `.orb__mana` and `.orb__cmd`
   to `display: none` -- so commander damage and the open-mana plate are not
   drawn on an opponent's seat at all in a three- or four-player game, and are
   reachable only by holding R2 for the full mat. The file argues the case and
   the argument is a fair one, but it means the screenshot this round was opened
   on -- the one with `P0 0` and `P2 0` on it -- is the ONE-opponent seat, and
   the pod seat is the one with the channel missing.

   Every direction here draws commander damage at every density. That is the
   thing they are all buying with their layout, and it is why the arithmetic
   below is harder than the shipped layout's.
   =========================================================================== */

/* --- The pod ---------------------------------------------------------------
   Three opponents from `../handheld/_table.js`, so this round and the pad round
   are looking at the same game. Two numbers are deliberately not that file's:
   seat 3 has taken 16 commander damage rather than 12, which is the only way to
   put a seat past the warn threshold (15) and see what a direction does about
   it, and seat 2 has taken 3 rather than 0 so the plate has a middling value as
   well as a zero and a near-lethal one.
-------------------------------------------------------------------------- */

const VIEWER = { pid: 0, name: "You", life: 34, cmdr: "Aesi, Tyrant of Gyre Strait" };

const SEATS = [
  {
    pid: 1,
    name: "AI 1",
    who: "Apprentice",
    human: false,
    cmdr: "Edgar Markov",
    art: "edgar-markov.jpg",
    cost: ["3", "W", "B", "R"],
    /* One entry per SOURCE, never per symbol -- Scoured Barrens makes W or B
       and counting it twice claims mana that does not exist. logic/mana.ts. */
    mana: ["R", "R", "W/B"],
    manaOpen: 2,
    /* THE CHANNEL NO DIRECTION IN THIS ROUND DRAWS. Two Mountains and a Scoured
       Barrens, one of them tapped -- `_handheld.js`'s OPP.lands, counted. It is
       a seat-level fact and not a `threatOf()` one, which is exactly why it has
       been invisible: `threat.ts` never had it and `types.ts` never sent it. */
    lands: 3,
    life: 25,
    lib: 84, hand: 4, gy: 6, exile: 0, cmd: 1, tax: 0,
    /* threatOf(): four creatures (two tapped Vampire tokens), one flier. */
    threat: { creatures: 4, untapped: 2, power: 4, fliers: 1, other: 0 },
  },
  {
    pid: 2,
    name: "Marco",
    who: "Human",
    human: true,
    cmdr: "Isperia, Supreme Judge",
    art: "isperia-supreme-judge.jpg",
    cost: ["4", "W", "U"],
    mana: ["W", "W", "U", "U", "W/U"],
    manaOpen: 5,
    /* Three Plains and two Islands, all untapped -- `_table.js`'s OPP2.lands. */
    lands: 5,
    life: 31,
    lib: 79, hand: 5, gy: 2, exile: 0, cmd: 1, tax: 0,
    /* You cast a "look at target player's hand" at Marco two turns ago, so two
       of his five cards are in `hand_revealed` and his hand mark IS a control.
       The other two seats' hands are not, and the round draws both. */
    revealed: 2,
    threat: { creatures: 2, untapped: 2, power: 4, fliers: 2, other: 1 },
  },
  {
    pid: 3,
    name: "Duelist",
    who: "Duelist",
    human: false,
    cmdr: "Krenko, Mob Boss",
    art: "krenko-mob-boss.jpg",
    cost: ["2", "R", "R"],
    mana: ["R", "R", "R", "R"],
    manaOpen: 4,
    /* Four Mountains -- `_table.js`'s OPP3.lands. */
    lands: 4,
    life: 18,
    lib: 88, hand: 3, gy: 9, exile: 2, cmd: 1, tax: 2,
    threat: { creatures: 1, untapped: 1, power: 1, fliers: 0, other: 1 },
  },
];

/* Commander damage TAKEN, per seat, per source. A matrix and not a list,
   because the sources a seat has depend on how many seats are at the table --
   which is the whole reason this plate is the hardest thing on the strip. */
const DMG = {
  1: { 0: 5, 2: 0, 3: 0 },
  2: { 0: 0, 1: 3, 3: 0 },
  3: { 0: 0, 1: 16, 2: 0 },
};

const LETHAL = 21;
const WARN = LETHAL - 6;

const NAMES = { 0: "You", 1: "AI 1", 2: "Marco", 3: "Duelist" };
const CMDRS = {
  0: "Aesi, Tyrant of Gyre Strait",
  1: "Edgar Markov",
  2: "Isperia, Supreme Judge",
  3: "Krenko, Mob Boss",
};

/* --- Helpers -------------------------------------------------------------- */

const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const artUrl = (file) => "../art/" + file;
const symUrl = (tok) => "../cards/symbols/" + String(tok).replace("/", "-").toUpperCase() + ".svg";
const symHTML = (tok) => '<img class="sym" src="' + symUrl(tok) + '" alt="" aria-hidden="true">';

/** The seats at the table right now, viewer first -- `logic/zoneGrouping.ts`. */
const pod = () => SEATS.slice(0, S.density);

/** Who could have hit this seat with a commander, in seating order from you. */
function sources(seat) {
  return [0].concat(pod().map((s) => s.pid))
    .filter((pid) => pid !== seat.pid)
    .map((pid) => ({
      pid,
      n: (DMG[seat.pid] || {})[pid] || 0,
      who: NAMES[pid],
      cmdr: CMDRS[pid],
    }));
}

/**
 * The summary line as clauses, in `logic/threat.ts`'s order and with its rule:
 * EMPTY CLAUSES ARE DROPPED. A seat with no fliers must not spend a fifth of a
 * 332px strip saying "0 fliers"; a seat with one absolutely must say so.
 * `creatures` is the exception and is always drawn -- "nothing on board" is the
 * most useful thing the line can say.
 */
/* `t.other` IS NOT IN THIS LIST AND NEITHER IS `seat.lands`. That is not an
 * oversight of this fixture -- it is the shipped strip's own content, copied
 * faithfully. "How many lands, artifacts and enchantments has that seat got"
 * is not answerable from an opponent's seat today at any density, and 01-05
 * all inherit the hole because they all render `threatParts()`. 06 does not
 * call this function; see its own file. */
function threatParts(seat) {
  const t = seat.threat;
  const out = [{ key: "creatures", icon: "creature", value: t.creatures, label: "creature" }];
  if (t.untapped > 0) out.push({ key: "untapped", icon: "untapped", value: t.untapped, label: "untapped" });
  if (t.power > 0) out.push({ key: "power", icon: "power", value: t.power, label: "power" });
  if (t.fliers > 0) out.push({ key: "fliers", icon: "flier", value: t.fliers, label: "flier" });
  if (seat.manaOpen > 0) out.push({ key: "mana", icon: "mana", value: seat.manaOpen, label: "open" });
  return out;
}

const UNCOUNTABLE = { untapped: 1, power: 1, open: 1 };
const clause = (p) =>
  p.value + " " + (p.value === 1 || UNCOUNTABLE[p.label] ? p.label : p.label + "s");

/**
 * The zones, in the shipped order.
 *
 * TWO OF THE FIVE ARE NOT CONTROLS ON AN OPPONENT'S SEAT, AND ONLY ONE OF THEM
 * KNOWS IT. This is the round's second finding and it is worth more than any
 * layout in it, because it is 88px of a 332px strip.
 *
 * `PlayerOrb.tsx` already argues the case for the library: "hidden information,
 * and a control that does nothing when clicked is worse than no control", so
 * the library is a plain element and not a button. An opponent's HAND is the
 * same fact -- `types.ts` sends `hand: null` for every seat but the viewer and
 * `ZonePeek.tsx` renders "Hidden — 4 cards" -- and it is a button anyway, at
 * 44x44, on the strip where 44x44 is the scarcest thing there is.
 *
 * The exception is the one the library already has: `hand_revealed` carries the
 * cards this seat has been SHOWN, by "look at target player's hand" and nothing
 * else, and when it is non-empty the peek has something to open. So the rule is
 * the library's own rule, applied to the zone next to it -- a button when there
 * is something behind it, a mark when there is not.
 *
 * Five 44px targets is 220px of a 332px seat. Three is 132. That difference is
 * why the seats in this round fit at all.
 */
function zones(seat) {
  const z = [
    { name: "library", label: "Library", icon: "lib", kind: "lib", count: seat.lib, peek: false },
    { name: "hand", label: "Hand", icon: "hand", kind: "hand", count: seat.hand, peek: !!seat.revealed },
    { name: "graveyard", label: "Graveyard", icon: "gy", kind: "gy", count: seat.gy, peek: true },
  ];
  /* Exile appears the moment anything is exiled and is NOT a fixed slot -- a
     seat can therefore show four marks or five, which is the reflow every
     direction here has to survive. Seat 3 has two cards in exile. */
  if (seat.exile > 0) {
    z.push({ name: "exile", label: "Exile", icon: "ex", kind: "ex", count: seat.exile, peek: true });
  }
  z.push({ name: "command", label: "Command zone", icon: "cmd", kind: "cmd", count: seat.cmd, peek: true });
  return z;
}

/* --- The marks -------------------------------------------------------------
   WHY THESE EXIST. It is a legibility argument, not a colour one -- ADR 0006.

   The shipped strip drops `.pile__label` at 16px: "Lib", "Hand", "GY" and "CMD"
   all go (`handheld.css:1758`), and what is left of a zone is a coloured chip
   with a number in it. `docs/handheld-playtest.md` already records what that
   costs -- a fixed order only helps somebody who has already learned the order,
   and the colour code has to be learned too. Nothing on the chip says which
   zone it is.

   A shape can say it without being taught. A headstone is a graveyard, a fan of
   three cards is a hand, a face-down card is a library, a dashed outline is a
   card that is not here. That is `.pile__label`'s job, done in the space the
   label could not have.

   They are SVG and not text characters on purpose: a glyph in a font is a
   different picture on every machine, and three of these had no reliable
   character at all.

   They are pictures, not words -- `aria-hidden`, with the real name carried by
   the cell's `aria-label` and surfaced by hover and by the cursor. That is the
   line `../handheld/assert.js` draws between "a decoration" and "text somebody
   reads", and it is why the font floor does not apply to them.
-------------------------------------------------------------------------- */

const ICON = {

  creature:
    '<circle cx="8" cy="4.4" r="2.7"/><path d="M2.6 14.6c0-4.3 2.3-6.2 5.4-6.2s5.4 1.9 5.4 6.2z"/>',
  /* Untapped: a card standing upright. The game's own idiom -- a tapped one is
     the same rectangle turned, which is what the player already reads on board. */
  untapped: '<rect x="4.6" y="1.8" width="6.8" height="12.4" rx="1.3"/>',
  /* Power: a sword, point up. Blade and guard only -- a first draft had a hilt

  power:
    '<path d="M8 .6l2.9 4.8v5.4H5.1V5.4z"/><rect x="2.2" y="10.6" width="11.6" height="2.3" rx="1.15"/>',
  /* A flier: wings. Stroked, because a filled wing at 14px is a blob. */
  flier:

  /* Open mana: the untapped source, as a ring with a drop in it. */
  mana:
    '<circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="8" r="2.6"/>',
  /* A land: a plot of ground, in perspective. THIS MARK HAS NO CHANNEL IN 01-05
     -- `threatOf()` never counted lands and `types.ts` never sent them, so on
     every seat in this round "how developed is that board" is answered only by
     `manaOpen`, which counts untapped SOURCES and says nothing about how many
     there are. A trapezoid because every other rectangle on the seat is a card
     and orientation is the one difference this round has already ruled out. */
  land: '<path d="M1.4 13.8L4.4 5.4h7.2l3 8.4z"/>',
  /* Everything on the battlefield that is not a creature and not a land -- the
     artifacts and enchantments. `seat.threat.other` HAS CARRIED THIS NUMBER ALL
     ALONG and not one of the five directions draws it: Marco's Favorable Winds
     and the Duelist's Impact Tremors are both on screen and both invisible. A
     cut gem, which is neither the star nor the crown at 14px. */
  other: '<path d="M8 1.1l6.2 5.1-6.2 8.7-6.2-8.7z"/>',
  /* Commander damage: a crown. Twenty-one of these kills you and nothing else
     in the game does, so it gets a mark of its own. */
  crown: '<path d="M1.6 13.2L2.9 4.4 6 8.2 8 2.8l2 5.4 3.1-3.8 1.3 8.8z"/>',
  /* Library: a face-down card. */
  lib:
    '<rect x="3.2" y="1.6" width="9.6" height="12.8" rx="1.5"/><path d="M8 4.4l1.7 3.6L8 11.6 6.3 8z" fill="var(--chip-ink)"/>',
  /* Hand: three cards, fanned. */
  hand:
    '<g transform="rotate(-22 8 13)"><rect x="1.9" y="4.2" width="4.8" height="9.2" rx="1.1"/></g><g transform="rotate(22 8 13)"><rect x="9.3" y="4.2" width="4.8" height="9.2" rx="1.1"/></g><rect x="5.6" y="2.6" width="4.8" height="10.8" rx="1.1"/>',
  /* Graveyard: a headstone. The one mark nobody has to be taught. */
  gy: '<path d="M3.4 15V7.2a4.6 4.6 0 019.2 0V15z"/>',
  /* Exile: a card leaving, drawn as an outline that is not all there. */
  ex:
    '<rect x="3.2" y="1.8" width="9.6" height="12.4" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3.4 2.6"/>',
  /* The command zone: a star. */
  cmd: '<path d="M8 1l2.1 4.5L15 6.2l-3.6 3.4.9 4.9L8 12.2 3.7 14.5l.9-4.9L1 6.2l4.9-.7z"/>',

function ico(name) {
  return (
    '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="currentColor">' +
    ICON[name] +
    "</svg>"
  );
}

/* --- Review state ---------------------------------------------------------
   Three knobs, all keyboard, all printed on the bezel. They exist because the
   things that break a seat are the things a single screenshot cannot show:
   another seat arriving, the seat becoming a target, the seat dying, and the
   art not being there.
-------------------------------------------------------------------------- */

const S = {
  density: 3,
  /* rest | active | targetable | out | noart. Drawn on the FIRST seat only, so
     the other two stay the control.

     `noart` is a real state and not a stress test: `logic/cardArt.ts` returns
     `undefined` when the image map has not been fetched and `null` when the
     printing has no art, and `CommandZone` renders nothing at all when the
     commander sits in a hidden zone -- shuffled back into the library, say. A
     direction that only works with a picture in it has to say so, and 03 is
     entirely about the picture. */
  mark: "rest",
  measure: false,
};

const LOSS = "Lost — 21 commander damage";

/**
 * The line beside the seat's name: which commander, or why they are out.
 *
 * ONE SLOT, NOT TWO. An eliminated seat is the state that breaks strips --
 * every direction here first grew an extra row for the loss reason and every
 * one of them overflowed its own budget doing it, which the round's gate caught
 * as an escape rather than as a wrap. It does not need a row: the commander's
 * name is the least useful thing on a seat that has already lost, so the loss
 * reason takes its place and the seat does not change size at the exact moment
 * a player is looking at it.
 */
const subline = (seat, f) => (f.out ? f.loss : seat.cmdr);

/** The state flags the shell hands `seatHTML`, so no file invents its own. */
function flagsFor(seat, index) {
  const marked = index === 0;
  return {
    active: marked && S.mark === "active",
    targetable: marked && S.mark === "targetable",
    out: marked && S.mark === "out",
    noart: marked && S.mark === "noart",
    loss: LOSS,
  };
}

/* --- The board the seat is taking room from --------------------------------
   Ghosted, at the real proportions, for the same reason the desktop round drew
   a ghost mat beside every panel: a direction's claim about FOOTPRINT should be
   visible rather than asserted. Every pixel a seat takes here is a pixel off
   the viewer's own board, and at 800px of height that trade is the argument.
-------------------------------------------------------------------------- */

const ghostRow = (tag, n) =>
  '<div class="gh__lane"><span class="gh__tag">' +
  tag +
  "</span>" +
  Array.from({ length: n }, () => '<span class="gh__card"></span>').join("") +
  "</div>";

function ghostBoard() {
  return (
    '<div class="gh gh--mine" aria-hidden="true">' +
    '<div class="gh__side"><span class="gh__tag">Your orb</span></div>' +
    '<div class="gh__lanes">' +
    ghostRow("Lands", 12) +
    ghostRow("Creatures", 8) +
    ghostRow("Other", 1) +
    "</div>" +
    "</div>"
  );
}

function ghostRail() {
  return (
    '<div class="gh gh--rail" aria-hidden="true">' +
    '<span class="gh__tag">Stack · actions · preview</span>' +
    "</div>"
  );
}

function ghostFoot() {
  return (
    '<div class="gh gh--foot" aria-hidden="true">' +
    '<span class="gh__tag">Hand</span>' +
    Array.from({ length: 6 }, () => '<span class="gh__card gh__card--hand"></span>').join("") +
    '<span class="gh__slab">Commit</span>' +
    "</div>"
  );
}

/* --- The shell ------------------------------------------------------------- */

const root = document.getElementById("root");

function render() {
  const seats = pod()
    .map((seat, i) => '<div class="mat" data-seat="' + seat.pid + '">' + seatHTML(seat, flagsFor(seat, i)) + "</div>")
    .join("");

  root.innerHTML =
    '<div class="bezel">' +
      '<div class="deck" data-density="' + S.density + '"' +
        (S.measure ? ' data-measure="yes"' : "") + ">" +
        '<div class="shell">' +
          '<div class="play">' +
            '<div class="opps" data-testid="opponents">' + seats + "</div>" +
            ghostBoard() +
          "</div>" +
          ghostRail() +
        "</div>" +
        ghostFoot() +
      "</div>" +
      '<div class="bezel__tag" id="tag"></div>' +
    "</div>";

  fitDeck();
  if (S.measure) paintMeasurements();
}

/* Exactly one Steam Deck screen, whatever the window is.
   A 1280x800 design opened in a 2560px window is being judged at half the
   angular size a Deck shows it at, and every legibility call made that way is
   wrong in the direction that flatters the design. `../handheld/_handheld.css`
   makes the same argument at more length. */
let SCALE = 1;
function fitDeck() {
  const el = document.querySelector(".deck");
  if (!el) return;
  SCALE = Math.max(0.3, Math.min(2, Math.min((innerWidth - 26) / 1280, (innerHeight - 84) / 800)));
  el.style.transform = "scale(" + SCALE + ")";

  const seat = document.querySelector(".mat");
  const box = seat ? seat.getBoundingClientRect() : null;
  const w = box ? Math.round(box.width / SCALE) : 0;
  const h = box ? Math.round(box.height / SCALE) : 0;

  const tag = document.getElementById("tag");
  if (!tag) return;
  tag.innerHTML =
    "<b>" + esc(FILE_ID) + "</b> · " + esc(FILE_LINE) +
    " · seat <b>" + w + "×" + h + "</b>" +
    " · Deck 1280×800 at <b>" + Math.round(SCALE * 100) + "%</b>" +
    " · <b>1 2 3</b> seats · <b>s</b> " + S.mark + " · <b>m</b> measure";
}

addEventListener("resize", fitDeck);

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "1" || k === "2" || k === "3") { S.density = +k; render(); }
  else if (k === "s") {
    const order = ["rest", "active", "targetable", "out", "noart"];
    S.mark = order[(order.indexOf(S.mark) + 1) % order.length];
    render();
  } else if (k === "m") { S.measure = !S.measure; render(); }
  else return;
  e.preventDefault();
});

/* `m` -- the numbers, on the page.
   Every cell is measured and any that misses a floor is outlined and labelled
   where it is. A gate whose only output is a console object gets read once; a
   gate that draws on the failing element gets read every time. */
function paintMeasurements() {
  const out = SEAT_ASSERT();
  for (const bad of out.faults) bad.el.setAttribute("data-bad", bad.why);
  const tag = document.getElementById("tag");
  if (!tag) return;
  tag.innerHTML +=
    ' · <b style="color:' + (out.PASS ? "#5ce08a" : "#ff6b5e") + '">' +
    (out.PASS ? "PASS" : "FAIL") + "</b> · " +
    out.cells + " cells · " + out.boxKinds + " box kinds · min " + out.minFontPx + "px" +
    " · min hit " + out.minHitPx + "px";
}
// <<< END _seat.js >>>

// <<< BEGIN assert.js >>>
/*
 * The gates, as numbers.
 *
 * Inlined into every file by `inline.py`, so opening any mockup and typing
 * `SEAT_ASSERT()` in the console works with no server and no paste -- `fetch()`
 * is blocked on file://, so a page cannot load its own checker off disk. `m`
 * runs it and draws the failures on the elements that failed.
 *
 *     copy(JSON.stringify(SEAT_ASSERT(), null, 2))
 *
 * Four of these are `../handheld/assert.js`'s, unchanged, because this round is
 * a component inside that round's screen and a floor that only applies to the
 * rest of the screen is not a floor: 16px of type, 44px of target, zero native
 * tooltips, nothing escaping its box.
 *
 * TWO ARE NEW, AND THEY ARE THE ONES THIS ROUND EXISTS FOR.
 *
 * `boxKinds` counts the distinct GEOMETRIES among the seat's cells -- height,
 * padding and radius, rounded. "All items should fit cleanly and uniformly" is
 * the complaint this round was opened on, and it reduces to a number: a strip
 * whose marks are 28px tall with 0 6px of padding, whose damage chips are 30px
 * tall with 2px 5px, and whose threat line is a 22px text run with 3px 6px is
 * three unrelated objects standing in a row, and it counts three.
 *
 * `padKinds` does the same for every padded box in the seat, including the
 * containers. The shipped strip measures FIVE at one opponent: the mat's
 * `5px 7px`, the body grid's `2px`, the spine's `3px 6px`, the plate's own
 * padding and the pile chip's `0 6px`. Nothing about that is visible in the
 * CSS, where each of the five is locally reasonable, and all of it is visible
 * on screen as the ragged left edge the round was opened about.
 *
 * A number is not a verdict -- one is not automatically better than two, and a
 * direction may spend a second geometry on purpose to separate two families of
 * fact. What the gate forbids is spending one by accident.
 */

function SEAT_ASSERT() {
  const DECK = document.querySelector(".deck") || document.body;
  const FS_FLOOR = 16;
  const HIT_FLOOR = 44;

  const round = (n) => Math.round(n * 100) / 100;

  const vis = (el) => {
    const s = getComputedStyle(el);
    if (s.display === "none" || s.visibility === "hidden" || +s.opacity === 0) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  };

  /* SCOPE: THE SEATS, NOT THE REVIEW CHROME AROUND THEM.
     The bezel tag is a note to whoever is reviewing -- it is not on the Deck's
     screen, and holding it to the Deck's floor measures the wrong thing. The
     ghosted board is not the design either: it is the room the design is
     spending, drawn so the spend is visible. Everything inside `.mat` is the
     design and nothing else is. */
  const mats = [...DECK.querySelectorAll(".mat")].filter(vis);
  const scale = DECK.getBoundingClientRect().width / (DECK.offsetWidth || 1) || 1;
  const px = (n) => Math.round(n / scale);

  const all = mats.flatMap((m) => [...m.querySelectorAll("*")]).filter(vis);
  const faults = [];

  /* --- The type floor ---------------------------------------------------
     Only elements that OWN text: walking every element counts a wrapper at its
     inherited size and reports failures that are not on screen. `aria-hidden`
     is skipped, which is the honest line between a font-size floor and a
     font-size ban -- this gate is about TEXT SOMEBODY READS. Every icon in this
     round is an `aria-hidden` SVG and is named in real type by its cell's
     `aria-label`, so none of them is in this set. If hiding it from a screen
     reader would lose information, it is text. */
  const textOwners = all.filter(
    (el) =>
      !el.closest('[aria-hidden="true"]') &&
      [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())
  );

  const sizes = textOwners.map((el) => ({
    el,
    /* A font size is a CSS pixel and the bezel's `transform: scale()` does not
       change it -- only the boxes below are read through the scale. Dividing
       here reported a 16px floor as 17.9 and would have passed type that fails
       on the device. */
    px: round(parseFloat(getComputedStyle(el).fontSize)),
    text: el.textContent.trim().slice(0, 32),
  }));
  const belowFloor = sizes.filter((s) => s.px < FS_FLOOR).sort((a, b) => a.px - b.px);
  for (const s of belowFloor.slice(0, 8)) faults.push({ el: s.el, why: s.px + "px" });

  /* --- The target floor -------------------------------------------------
     Four of the five zone marks are the only route into `ZonePeek`. A
     decorative pile makes the graveyard unreachable, so they are real buttons,
     and a real button on a 7-inch touchscreen is 44px or it is not a button. */
  const stops = mats.flatMap((m) => [...m.querySelectorAll("button, [data-stop]")]).filter(vis);
  const hits = stops.map((el) => {
    const r = el.getBoundingClientRect();
    return { el, w: px(r.width), h: px(r.height) };
  });
  const smallHits = hits.filter((h) => h.w < HIT_FLOOR || h.h < HIT_FLOOR);
  for (const h of smallHits.slice(0, 8)) faults.push({ el: h.el, why: h.w + "×" + h.h });

  /* --- Uniformity, which is the round's own gate ------------------------- */
  const cells = mats.flatMap((m) => [...m.querySelectorAll("[data-cell]")]).filter(vis);
  const cellSig = (el) => {
    const s = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    return [
      px(r.height),
      s.paddingTop + " " + s.paddingRight + " " + s.paddingBottom + " " + s.paddingLeft,
      s.borderTopLeftRadius,
    ].join(" | ");
  };
  const cellKinds = [...new Set(cells.map(cellSig))];

  /* Every padded box in the seat, containers included -- the ragged-edge
     metric. A container that pads by 2 inside a plate that pads by 7 inside a
     mat that pads by 5 is where an inconsistent-looking strip actually comes
     from, and none of the three is visible on its own. */
  const padded = all.filter((el) => {
    const s = getComputedStyle(el);
    return (
      parseFloat(s.paddingTop) + parseFloat(s.paddingRight) +
      parseFloat(s.paddingBottom) + parseFloat(s.paddingLeft) > 0
    );
  });
  /* CSS pixels, not scaled ones. A padding is authored in the stylesheet and
     the bezel's `transform` does not change it -- dividing by the scale turned
     a shared `6px` into a `7` and reported one gutter as two. */
  const padSig = (el) => {
    const s = getComputedStyle(el);
    return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft]
      .map((v) => Math.round(parseFloat(v)))
      .join(" ");
  };
  const padKinds = [...new Set(padded.map(padSig))].sort();

  /* And the gutters. Three gaps in one strip reads as three components. */
  const gapKinds = [
    ...new Set(
      all
        .map((el) => getComputedStyle(el))
        .filter((s) => s.display.includes("flex") || s.display.includes("grid"))
        .map((s) => Math.round(parseFloat(s.rowGap) || 0) + " " + Math.round(parseFloat(s.columnGap) || 0))
        .filter((g) => g !== "0 0")
    ),
  ].sort();

  /* --- Escape and clip ---------------------------------------------------
     `overflow: hidden` hides layout failure completely -- the page reports
     `scrollHeight === clientHeight` while content visibly runs under the next
     region -- which is the lesson the board round drew and the reason this is
     measured against the mat's own box rather than asked of the scroller. */
  let escaped = 0;
  for (const m of mats) {
    const box = m.getBoundingClientRect();
    for (const el of [...m.querySelectorAll("*")].filter(vis)) {
      const r = el.getBoundingClientRect();
      if (r.left < box.left - 1 || r.right > box.right + 1 ||
          r.top < box.top - 1 || r.bottom > box.bottom + 1) {
        escaped += 1;
        if (escaped <= 4) faults.push({ el, why: "escapes" });
      }
    }
  }

  /* Text that is being ellipsised. Not a failure on its own -- `threatParts`
     emits in order of what matters, so what falls off the end is always the
     least decision-changing clause -- but a direction that clips a COUNT has
     lost the datum, and this is how you see which. */
  /* Asked only of boxes that actually cut. A box with `overflow: visible` shows
     all of its text however wide it is, and `scrollWidth` on one of those also
     counts absolutely-positioned descendants -- which in this round is the
     hover label every mark carries, so the first version of this check reported
     four "clipped" zone counts on a seat 1017px wide with nothing wrong. */
  const clipped = textOwners
    .filter((el) => {
      const cs = getComputedStyle(el);
      if (cs.overflowX === "visible") return false;
      return el.scrollWidth > el.clientWidth + 1;
    })
    .map((el) => el.textContent.trim().slice(0, 24));

  /* A region that flattened to nothing. `overflow: hidden` hides this too. */
  const collapsed = all.filter((el) => {
    const s = getComputedStyle(el);
    if (s.display === "none") return false;
    const r = el.getBoundingClientRect();
    return r.height < 1 || r.width < 1;
  }).length;

  const matBoxes = mats.map((m) => {
    const r = m.getBoundingClientRect();
    return px(r.width) + "×" + px(r.height);
  });

  /* The row must not be taller than the budget it declared. Every pixel over is
     a pixel off the viewer's own board -- `board.css:55-66` calls that
     load-bearing, and the handheld layout's single largest defect was this row
     going uncapped. */
  const opps = DECK.querySelector(".opps");
  const budget = mats.length ? Math.round(parseFloat(getComputedStyle(mats[0]).height)) : 0;
  const rowH = opps ? px(opps.getBoundingClientRect().height) : 0;

  const out = {
    screen: innerWidth + "x" + innerHeight,
    density: DECK.dataset.density,
    seats: matBoxes,
    rowHeightPx: rowH,
    budgetPx: budget,

    minFontPx: sizes.length ? Math.min(...sizes.map((s) => s.px)) : null,
    textNodes: sizes.length,
    belowFloor: belowFloor.length,
    belowFloorWorst: belowFloor.slice(0, 6).map((s) => ({ px: s.px, text: s.text })),

    stops: stops.length,
    minHitPx: hits.length ? Math.min(...hits.map((h) => Math.min(h.w, h.h))) : null,
    smallHits: smallHits.length,
    smallHitsWorst: smallHits.slice(0, 6).map((h) => ({ w: h.w, h: h.h })),

    cells: cells.length,
    boxKinds: cellKinds.length,
    boxKindList: cellKinds,
    padKinds: padKinds.length,
    padKindList: padKinds,
    gapKinds: gapKinds.length,
    gapKindList: gapKinds,

    escaped,
    clipped: clipped.length,
    clippedWorst: clipped.slice(0, 6),
    collapsedRegions: collapsed,

    /* A native tooltip opens on hover and on nothing else, so on a controller it
       is information that cannot be reached at all. The shipped client had 45
       and has none left; a mockup that grows one has moved a channel out of
       reach without saying so. */
    titleAttrs: mats.reduce((n, m) => n + m.querySelectorAll("[title]").length, 0),

    brokenImages: mats
      .flatMap((m) => [...m.querySelectorAll("img")])
      .filter((i) => i.complete && i.naturalWidth === 0).length,

    faults,
  };

  out.PASS =
    out.belowFloor === 0 &&
    out.smallHits === 0 &&
    out.escaped === 0 &&
    out.collapsedRegions === 0 &&
    out.titleAttrs === 0 &&
    out.brokenImages === 0 &&
    out.rowHeightPx <= out.budgetPx + 1;

  return out;
}

if (typeof window !== "undefined") window.SEAT_ASSERT = SEAT_ASSERT;
// <<< END assert.js >>>

const FILE_ID = "Seat 01 · Dogtag";
const FILE_LINE = "one cell, one gutter, one radius";

/* One cell, built once. Every caller supplies a class, a mark, a number and a
   name -- never a size, a padding or a radius, because there is only one of
   each and it is in the CSS above. */
function cell(cls, icon, value, label, extra) {
  const tag = extra && extra.peek ? "button" : "div";
  const attrs =
    'class="cell ' + cls + '" data-cell data-name aria-label="' + esc(label) + '"' +
    (extra && extra.style ? ' style="' + extra.style + '"' : "") +
    (extra && extra.testid ? ' data-testid="' + extra.testid + '"' : "") +
    (extra && extra.peek ? ' type="button" data-stop="' + extra.testid + '"' : "");
  return (
    "<" + tag + " " + attrs + ">" +
    (icon ? ico(icon) : "") +
    '<b class="tabular">' + value + "</b>" +
    "</" + tag + ">"
  );
}

function seatHTML(seat, f) {
  const cls = [
    "dog",
    f.active ? "dog--active" : "",
    f.targetable ? "dog--targetable" : "",
    f.out ? "dog--out" : "",
  ].filter(Boolean).join(" ");

  const dmg = sources(seat).map((src) => {
    const pct = Math.min(src.n / LETHAL, 1) * 100;
    const k = src.n >= WARN ? " cell--dmg--warn" : src.n === 0 ? " cell--dmg--zero" : "";
    return cell(
      "cell--dmg" + k,
      "crown",
      src.n,
      src.n + " of " + LETHAL + " commander damage from " + src.who + " (" + src.cmdr + ")",
      { style: "--fill:" + pct + "%" }
    );
  }).join("");

  const threat = threatParts(seat)
    .map((p) => cell("cell--t", p.icon, p.value, clause(p), {}))
    .join("");

  const zone = zones(seat)
    .map((z) =>
      cell(
        "cell--z cell--z--" + z.kind + (z.count > 0 ? "" : " cell--z--empty") + (z.peek ? "" : " cell--z--flat"),
        z.icon,
        z.count,
        z.label + ": " + z.count + (z.peek ? "" : " (hidden — not a control)"),
        { peek: z.peek, testid: "pile-" + seat.pid + "-" + z.name }
      )
    )
    .join("");

  return (
    '<article class="' + cls + '" data-testid="player-' + seat.pid + '">' +
      (f.active ? '<span class="dog__pri" aria-label="Has priority"></span>' : "") +
      '<div class="dog__rack">' +
        '<div class="cell cell--art' + (f.noart ? " cell--art--none" : "") + '" data-cell ' +
          'aria-label="' + esc(seat.cmdr) + '">' +
          (f.noart ? "" : '<img src="' + artUrl(seat.art) + '" alt="">') +
        "</div>" +
        '<div class="cell cell--id" data-cell>' +
          '<span class="dog__name">' + esc(seat.name) + "</span>" +
          '<span class="dog__cmdr' + (f.out ? " dog__cmdr--out" : "") + '">' + esc(subline(seat, f)) + "</span>" +
        "</div>" +
        '<div class="cell cell--life" data-cell data-name aria-label="Life ' + seat.life + '">' +
          '<span class="dog__life tabular" data-testid="life-' + seat.pid + '">' +
            (f.out ? "OUT" : seat.life) +
          "</span>" +
        "</div>" +
        dmg + threat + zone +
      "</div>" +
    "</article>"
  );
}

render();
</script>
