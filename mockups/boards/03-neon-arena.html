<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Neon Arena</title>
<style>
/* ============================================================================
   NEON ARENA
   ----------------------------------------------------------------------------
   Ground: near-black, lit only by rim light. Everything structural is a thin
   emissive edge rather than a filled panel, so the cards are the only large
   bright objects on screen and the eye goes to them by default.

   Two structural ideas, both aimed at the same complaint -- that combat is a
   wrapping list of sentences at the bottom of the screen:

   1. THE STRIKE BAND. Declared attackers physically leave the creature row and
      stand in a lit band between the two boards, pointing at what they hit. The
      decision gets its own stage instead of being described in prose.

   2. OPPONENT LANDS BECOME A MANA METER. Nobody reads an opponent's individual
      Forests; what matters is "two red, one white-black, one of them tapped".
      That is docs/playtest-feedback-03.md Cycle 4 item 2, and `produces` already
      ships the data needed for it.
   ========================================================================== */

:root {
  --void:#05060a; --void-1:#0a0d14; --panel:rgba(120,160,255,.045);
  --cyan:#42e8ff; --magenta:#ff5cc8; --violet:#9d7bff;
  --edge:rgba(66,232,255,.22); --edge-soft:rgba(150,180,255,.13);

  --playable:#5ce08a; --targetable:#58b6ff; --staged:#ffc14d;
  --attacking:#ff5b6e; --danger:#ff5c5c; --ability:#c07bff;

  --stock:#f3ece0; --stock-shade:#ddd2be; --stock-ink:#17130d;
  --stock-ink-dim:#5d5346; --stock-rule:#b9ad96;
  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd;

  --text:#dfe9f7; --text-dim:#8fa2bd; --text-faint:#5a6982;

  --card-w: clamp(78px, 4.1vw, 98px);
  --card-r: calc(var(--card-w) * .055);
  --font: "Segoe UI", Inter, system-ui, sans-serif;
}
* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:
    radial-gradient(70% 50% at 50% 50%, rgba(66,232,255,.05) 0%, transparent 60%),
    radial-gradient(60% 40% at 50% 104%, rgba(255,92,200,.05) 0%, transparent 60%),
    linear-gradient(180deg, var(--void-1), var(--void) 60%);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button { font:inherit; color:inherit; cursor:pointer; }
.spacer { flex:1; }
.tabular { font-variant-numeric:tabular-nums; }
.table { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }

/* HUD surfaces: an edge and a whisper of fill, never a box. */
.hud {
  border-radius:4px; background:var(--panel);
  border:1px solid var(--edge-soft);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
  position:relative;
}
/* Corner ticks -- the cheapest way to read "HUD" without drawing a frame. */
.hud::before, .hud::after {
  content:""; position:absolute; width:11px; height:11px; pointer-events:none;
  border-color:var(--cyan); opacity:.65;
}
.hud::before { top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
.hud::after { bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }

/* --- Top HUD bar --------------------------------------------------------- */
.hudbar {
  display:flex; align-items:center; gap:16px; padding:9px 18px;
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg, rgba(66,232,255,.07), transparent);
}
.hudbar__turn { display:flex; align-items:baseline; gap:9px; }
.hudbar__turn b { font-size:20px; font-weight:800; color:var(--cyan); text-shadow:0 0 14px rgba(66,232,255,.6); }
.hudbar__turn span { font-size:11.5px; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; }
.steps { display:flex; gap:3px; flex:1; margin:0; padding:0; list-style:none; }
.ph { display:flex; align-items:center; gap:9px; padding:4px 13px; color:var(--text-faint);
  font-size:11.5px; white-space:nowrap; clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%); }
.ph--past { color:var(--text-dim); }
.ph--now { flex:1; min-width:0; color:#04121a; background:linear-gradient(90deg,var(--cyan),#79f2ff);
  box-shadow:0 0 26px rgba(66,232,255,.45); }
.ph__name { font-weight:800; letter-spacing:.09em; text-transform:uppercase; font-size:11px; }
.ph__steps { display:flex; gap:2px; margin:0; padding:0; list-style:none; overflow:hidden; }
.st { padding:2px 9px; font-size:10.5px; opacity:.55; }
.st--now { background:rgba(4,18,26,.82); color:var(--cyan); opacity:1; font-weight:800; border-radius:3px; }
.hudbar__who { padding:5px 15px; color:var(--playable); font-size:12.5px; font-weight:800;
  letter-spacing:.06em; border:1px solid rgba(92,224,138,.4); background:rgba(92,224,138,.1);
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%); }

/* --- Body ---------------------------------------------------------------- */
.table__body {
  display:grid; grid-template-columns:clamp(188px,12.4vw,256px) minmax(0,1fr) clamp(262px,16.6vw,336px);
  gap:12px; min-height:0; padding:12px;
}
/* opponents / strike band / mine */
.play { display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:10px; min-width:0; min-height:0; }
.play__opponents { display:flex; gap:12px; justify-content:center; }
.play__opponents .mat { flex:0 1 auto; max-width:100%; }
.play__mine { min-height:0; display:flex; }
.play__mine .mat { flex:1; }

.rail { display:flex; flex-direction:column; gap:12px; min-height:0; }
.panel { padding:11px 13px; }
.panel__title { display:flex; align-items:center; gap:7px; margin:0 0 8px; color:var(--cyan);
  font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
.panel__empty { color:var(--text-faint); font-size:12px; font-style:italic; }
.log__lines { display:flex; flex-direction:column; gap:3px; max-height:28vh; overflow-y:auto; }
.log__line { color:var(--text-dim); font-size:11.5px; line-height:1.45; margin:0; }
.log__line--turn { color:var(--cyan); font-weight:700; }

/* --- Mats ---------------------------------------------------------------- */
.mat { display:grid; grid-template-columns:clamp(154px,10vw,196px) minmax(0,1fr); gap:12px; padding:10px; min-height:0; }
.mat--compact { grid-template-columns:clamp(140px,9.2vw,176px) minmax(0,1fr); --card-w:clamp(64px,3.4vw,86px); padding:8px; }
.mat__side { display:flex; flex-direction:column; gap:9px; min-width:0; }
.mat__lanes { display:flex; flex-direction:column; gap:7px; min-width:0; }

.orb { padding:10px 12px; border-radius:4px; background:rgba(0,0,0,.4); border:1px solid var(--edge-soft); }
.orb--foe { border-color:rgba(255,91,110,.28); }
.orb--active { border-color:rgba(66,232,255,.45); box-shadow:0 0 26px rgba(66,232,255,.13); }
.orb__head { display:flex; align-items:center; gap:7px; }
.orb__name { font-weight:700; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.orb__life { font-size:clamp(30px,2.4vw,42px); font-weight:900; line-height:1; letter-spacing:-.02em;
  color:var(--cyan); text-shadow:0 0 20px rgba(66,232,255,.45); }
.orb--foe .orb__life { color:#ff8d84; text-shadow:0 0 20px rgba(255,91,110,.4); }
/* The number combat is actually about: what they end on if this connects. */
.orb__after { font-size:11.5px; color:var(--attacking); font-weight:700; }
.orb__mana { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.mana-pip { width:10px; height:10px; border-radius:50%; border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35); }
.mana-pip--W{background:var(--mana-W)} .mana-pip--U{background:var(--mana-U)}
.mana-pip--B{background:var(--mana-B)} .mana-pip--R{background:var(--mana-R)}
.mana-pip--G{background:var(--mana-G)} .mana-pip--C{background:var(--mana-C)}
.mana-pip--any{background:conic-gradient(var(--mana-W) 0 72deg,var(--mana-U) 72deg 144deg,var(--mana-B) 144deg 216deg,var(--mana-R) 216deg 288deg,var(--mana-G) 288deg 360deg)}
.orb__zones { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.zone-chip { padding:3px 8px; border-radius:3px; background:rgba(255,255,255,.04);
  border:1px solid var(--edge-soft); color:var(--text-dim); font-size:10.5px; white-space:nowrap; }

/* --- THE MANA METER (opponent lands) ------------------------------------- */
.meter { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:4px;
  background:rgba(255,255,255,.03); border:1px solid var(--edge-soft); }
.meter__label { font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
.meter__set { display:flex; gap:7px; align-items:center; }
.mm { display:flex; align-items:center; gap:5px; padding:3px 9px 3px 4px; border-radius:999px;
  background:rgba(0,0,0,.45); border:1px solid var(--edge-soft); font-size:12px; font-weight:800; }
.mm__pip { width:17px; height:17px; border-radius:50%; display:grid; place-items:center;
  font-size:10.5px; font-weight:900; color:#1a1a1a; }
.mm__pip--R{background:var(--mana-R)} .mm__pip--W{background:var(--mana-W)}
.mm__pip--B{background:var(--mana-B)} .mm__pip--G{background:var(--mana-G)}
.mm__pip--U{background:var(--mana-U)}
/* A source that offers a choice is split, never solid: the colour is picked when
   it is tapped and the meter must not pretend otherwise. */
.mm__pip--dual { width:auto; padding:0 6px; border-radius:999px; font-size:9.5px;
  background:linear-gradient(100deg,var(--mana-W) 50%,var(--mana-B) 50%); }
.mm--tapped { opacity:.45; }
.mm--tapped .mm__pip { filter:grayscale(.8); }
.meter__note { margin-left:auto; font-size:11px; color:var(--text-faint); }

/* --- Lanes --------------------------------------------------------------- */
.lane { display:grid; grid-template-columns:clamp(56px,3.8vw,76px) minmax(0,1fr); gap:10px;
  align-items:center; padding:4px 8px; border-radius:4px; }
.lane__label { display:flex; flex-direction:column; color:var(--text-faint); font-size:9.5px;
  letter-spacing:.12em; text-transform:uppercase; }
.lane__count { color:var(--text-dim); font-size:15px; font-weight:800; }
.lane__cards { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-start; }
.mat--compact .lane { grid-template-columns:minmax(0,1fr); padding:3px 4px; }
.mat--compact .lane__label { display:none; }
.mat--compact .lane__cards { gap:8px; }

/* --- THE STRIKE BAND ----------------------------------------------------- */
.band {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center;
  padding:10px 16px; border-radius:5px;
  background:linear-gradient(180deg, rgba(255,91,110,.13), rgba(255,91,110,.03));
  border:1px solid rgba(255,91,110,.4);
  box-shadow:0 0 40px rgba(255,91,110,.1), inset 0 0 34px rgba(255,91,110,.05);
  position:relative;
}
.band__head { display:flex; flex-direction:column; gap:3px; }
.band__title { margin:0; font-size:12px; font-weight:900; letter-spacing:.14em;
  text-transform:uppercase; color:var(--attacking); }
.band__hint { margin:0; font-size:11px; color:var(--text-dim); }
/* Who all these arrows are pointing at, said once rather than once per creature.
   The shipped bar repeats "Attack p1 with ..." on every button. */
.band__at { display:flex; align-items:center; gap:7px; margin-top:2px; padding:4px 10px;
  border:1px solid rgba(255,91,110,.5); background:rgba(255,91,110,.12);
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
.band__at b { font-size:12px; color:#ffd2ce; }
.band__at span { font-size:11px; color:var(--text-faint); }
.band__row { display:flex; gap:14px; align-items:flex-start; min-width:0; overflow-x:auto; padding:2px 0; }

/* An attacker in the band. The arrow is part of the tile, so the card itself
   says where it is going -- no separate legend to read. */
.striker { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px;
  --card-w:clamp(58px,3.1vw,78px); }
.striker__arrow {
  width:2px; height:26px; background:linear-gradient(180deg,transparent,var(--attacking));
  position:relative; box-shadow:0 0 8px rgba(255,91,110,.7);
}
.striker__arrow::before {
  content:""; position:absolute; top:-1px; left:50%; margin-left:-5px;
  border:5px solid transparent; border-bottom-color:var(--attacking);
  filter:drop-shadow(0 0 5px rgba(255,91,110,.9));
}
.striker__pt { font-size:12px; font-weight:900; color:#ffd0cc; font-variant-numeric:tabular-nums; }
.striker .card::after { opacity:1; box-shadow:0 0 0 2px var(--attacking), 0 0 20px rgba(255,91,110,.6); }

/* Candidates that are not yet committed sit in the same band, unlit, so the
   choice and the commitment are in one place. */
.striker--idle { opacity:.44; }
.striker--idle .striker__arrow { background:none; }
.striker--idle .striker__arrow::before { border-bottom-color:var(--text-faint); filter:none; }
.striker--idle .card::after { opacity:1; box-shadow:0 0 0 1px var(--text-faint); }

.band__sum { text-align:right; }
.band__dmg { font-size:30px; font-weight:900; color:var(--attacking); line-height:1;
  text-shadow:0 0 22px rgba(255,91,110,.5); font-variant-numeric:tabular-nums; }
.band__dmg-label { font-size:9.5px; color:var(--text-faint); letter-spacing:.13em; text-transform:uppercase; }

/* --- Cards --------------------------------------------------------------- */
.card { position:relative; width:var(--card-w); height:calc(var(--card-w)*1.4); flex:0 0 auto; }
.card--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.card__pivot { width:100%; height:100%; transform-origin:50% 50%; }
.card--tapped .card__pivot { width:var(--card-w); height:calc(var(--card-w)*1.4);
  margin-left:calc(var(--card-w)*.2); margin-top:calc(var(--card-w)*-.2); transform:rotate(90deg); }
.face { position:relative; display:flex; flex-direction:column; width:100%; height:100%;
  padding:calc(var(--card-w)*.045); gap:calc(var(--card-w)*.028); overflow:hidden;
  border:2px solid #2b2f36; border-radius:var(--card-r);
  background:linear-gradient(160deg, var(--stock) 0%, var(--stock-shade) 100%);
  color:var(--stock-ink); font-size:calc(var(--card-w)*.082); line-height:1.25;
  box-shadow:0 1px 2px rgba(0,0,0,.7), 0 8px 20px rgba(0,0,0,.6); }
.face--W{border-color:#d8cfa8} .face--U{border-color:#4a86b8} .face--B{border-color:#4c4550}
.face--R{border-color:#b8624a} .face--G{border-color:#4e8a5c} .face--C{border-color:#8a8f96}
.face--gold{border-color:#b99a45} .face--land{border-color:#6f5a3e}
.face--commander { border-color:#ffd479; box-shadow:0 0 0 1px rgba(255,212,121,.5), 0 0 18px rgba(255,212,121,.25), 0 8px 20px rgba(0,0,0,.6); }
.face--token { border-style:dashed; border-color:#7a8b99; }
.face--type-land{--stock:#d6c7a8;--stock-shade:#c6b186}
.face--type-creature{--stock:#ebc9bc;--stock-shade:#e0a894}
.face--type-sorcery{--stock:#eecfdf;--stock-shade:#e1a9c7}
.face--type-enchantment{--stock:#e4d9f1;--stock-shade:#cab5e3}
.face--type-artifact{--stock:#e5eaf0;--stock-shade:#c5d1dd}
.face--type-instant{--stock:#e4f2f7;--stock-shade:#bce0ec}
.face--type-other{--stock:#f8f6f1;--stock-shade:#e7decf}
.face--land-W{--stock:#daca89;--stock-shade:#cdb862}
.face--land-U{--stock:#afcde3;--stock-shade:#8ab6d6}
.face--land-B{--stock:#d1c5da;--stock-shade:#b9a5c6}
.face--land-R{--stock:#ebbfb5;--stock-shade:#e19d8c}
.face--land-G{--stock:#a6d69e;--stock-shade:#85c67a}
.face--land-C{--stock:#c5c9ce;--stock-shade:#aab0b6}
.face--land-multi{--stock:#e2c77d;--stock-shade:#d9b653}
.face__title { display:flex; align-items:flex-start; gap:calc(var(--card-w)*.03); font-weight:700; }
.face__glyph { flex:0 0 auto; color:var(--stock-ink-dim); font-size:calc(var(--card-w)*.088); line-height:1.15; }
.face__name { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:calc(var(--card-w)*.086); }
.face__cost { display:flex; flex:0 0 auto; gap:1px; }
.face__type { padding-bottom:calc(var(--card-w)*.02); border-bottom:1px solid var(--stock-rule);
  color:var(--stock-ink-dim); font-size:calc(var(--card-w)*.066); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.face__watermark { display:flex; flex:1; align-items:center; justify-content:center; gap:calc(var(--card-w)*.04); min-height:0; }
.watermark-pip { display:flex; align-items:center; justify-content:center;
  width:calc(var(--card-w)*.3); height:calc(var(--card-w)*.3); border-radius:50%;
  border:1px solid rgba(0,0,0,.18); color:rgba(255,255,255,.92);
  font-size:calc(var(--card-w)*.15); font-weight:800; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.35); }
.watermark-pip--W{background:var(--mana-W);color:rgba(40,34,20,.85);text-shadow:none}
.watermark-pip--U{background:var(--mana-U)} .watermark-pip--B{background:var(--mana-B)}
.watermark-pip--R{background:var(--mana-R)} .watermark-pip--G{background:var(--mana-G)}
.watermark-pip--C{background:var(--mana-C);color:rgba(40,40,44,.85);text-shadow:none}
.face__rules { display:flex; flex:1; flex-direction:column; justify-content:safe center; overflow:hidden; font-size:calc(var(--card-w)*.064); line-height:1.32; }
.face__keywords { flex:1; overflow:hidden; color:#4a6b52; font-size:calc(var(--card-w)*.068); font-weight:600; }
.face__footer { display:flex; align-items:flex-end; gap:4px; margin-top:auto; }
.face__stats { padding:0 calc(var(--card-w)*.04); border:1px solid var(--stock-rule);
  border-radius:calc(var(--card-w)*.03); background:rgba(255,255,255,.55);
  font-size:calc(var(--card-w)*.095); font-weight:800; font-variant-numeric:tabular-nums; }
.face__tag { position:absolute; padding:0 3px; border-radius:3px; font-size:calc(var(--card-w)*.055); font-weight:800; }
.face__tag--cmd { bottom:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:#ffd479; color:#2a1e05; }
.face__tag--sick { top:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:rgba(0,0,0,.42); color:#fff; }
.pip { display:inline-flex; align-items:center; justify-content:center;
  min-width:calc(var(--card-w)*.115); height:calc(var(--card-w)*.115); padding:0 2px; border-radius:999px;
  background:var(--mana-generic); color:#1a1a1a; font-size:calc(var(--card-w)*.072); font-weight:800; }
.pip--W{background:var(--mana-W)} .pip--U{background:var(--mana-U)} .pip--B{background:var(--mana-B)}
.pip--R{background:var(--mana-R)} .pip--G{background:var(--mana-G)} .pip--C{background:var(--mana-C)}
.pip--tap{background:#4a4f52;color:#f2f5f4}
.pip--inline{min-width:1.2em;height:1.2em;margin:0 .08em;padding:0;font-size:.9em;line-height:1;vertical-align:-.2em}
.card::after { content:""; position:absolute; inset:-3px; border-radius:calc(var(--card-r)+3px); pointer-events:none; opacity:0; }
.card--playable::after { opacity:1; box-shadow:0 0 0 2px var(--playable), 0 0 20px rgba(92,224,138,.55); }
.card--staged::after { opacity:1; box-shadow:0 0 0 2px var(--staged), 0 0 22px rgba(255,193,77,.55); }
/* Attackers have left for the band, so a gap is left where they were. */
.card--gone { opacity:.18; }
.card--gone::after { opacity:1; box-shadow:0 0 0 1px rgba(255,91,110,.5); }

.card--ability::after { opacity:1; box-shadow:0 0 0 2px var(--ability), 0 0 22px rgba(192,123,255,.55); }
.rune { position:absolute; z-index:5; top:calc(var(--card-w)*-.08); right:calc(var(--card-w)*-.08);
  display:grid; place-items:center; width:calc(var(--card-w)*.32); height:calc(var(--card-w)*.32);
  border-radius:4px; transform:rotate(45deg);
  background:linear-gradient(135deg,#e0c4ff,#8b4dff); border:1px solid #f0e3ff; color:#1a0a30;
  font-size:calc(var(--card-w)*.15); font-weight:900; line-height:1;
  box-shadow:0 0 18px rgba(192,123,255,.8); }
.rune span { transform:rotate(-45deg); }
.ability-pop { position:absolute; z-index:20; left:calc(100% + 14px); top:0;
  width:max(240px, calc(var(--card-w)*2.2)); padding:11px 13px; border-radius:4px;
  background:linear-gradient(180deg,#1b1030,#0d0718); border:1px solid rgba(192,123,255,.55);
  box-shadow:0 0 40px rgba(192,123,255,.2), 0 18px 44px rgba(0,0,0,.8); }
.ability-pop::after { content:""; position:absolute; right:100%; top:16px;
  border:7px solid transparent; border-right-color:#1b1030; }
.ability-pop__label { color:var(--ability); font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
.ability-pop__text { margin:5px 0 9px; font-size:12px; line-height:1.4; color:var(--text); }
.ability-pop__go { width:100%; padding:7px 0; border:1px solid rgba(192,123,255,.6);
  background:linear-gradient(180deg,#7c3fe0,#4a1f9c); color:#f5ecff; font-size:12.5px; font-weight:800;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }

.cardstack { position:relative; flex:0 0 auto; width:var(--card-w); height:calc(var(--card-w)*1.4); }
.cardstack--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.cardstack__slot { position:absolute; top:0; left:0; }
.cardstack__count { position:absolute; right:-7px; bottom:-7px; z-index:40; min-width:23px; padding:1px 6px;
  border-radius:999px; background:#080b12; border:1px solid var(--edge); color:var(--cyan);
  font-size:11px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; }

/* --- Right rail ---------------------------------------------------------- */
.preview { padding:12px; display:flex; flex-direction:column; gap:10px; align-items:center; flex:0 0 auto; }
.preview .card { --card-w:clamp(132px,8.3vw,174px); }
.preview__facts { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; width:100%; margin:0; font-size:11.5px; }
.preview__facts dt { color:var(--text-faint); }
.preview__facts dd { margin:0; color:var(--text-dim); }
.acts { padding:12px; display:flex; flex-direction:column; gap:9px; flex:1 1 auto; min-height:0; }
.acts__prompt { font-size:12px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); }
.acts__hint { margin:0; color:var(--text-dim); font-size:11.5px; line-height:1.4; }
.acts__list { display:flex; flex-direction:column; gap:6px; overflow-y:auto; min-height:0; flex:1 1 auto; }
.opt { display:flex; align-items:center; gap:9px; width:100%; padding:8px 13px;
  border:1px solid var(--edge-soft); background:rgba(255,255,255,.03); color:var(--text);
  font-size:12.5px; text-align:left; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
.opt:hover { border-color:var(--cyan); background:rgba(66,232,255,.09); }
.opt--on { border-color:var(--attacking); background:rgba(255,91,110,.14); color:#ffcfcb; }
.opt__pt { margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; opacity:.85; }
.opt__key { display:grid; place-items:center; width:18px; height:18px; background:rgba(255,255,255,.07);
  border:1px solid var(--edge-soft); color:var(--text-faint); font-size:10.5px; font-weight:800; }
.tools { display:flex; align-items:center; gap:5px; padding-top:9px; border-top:1px solid var(--edge-soft); }
.tool { display:grid; place-items:center; min-width:30px; height:27px; padding:0 8px; border:1px solid transparent;
  background:transparent; color:var(--text-faint); font-size:11.5px; font-weight:600; }
.tool:hover { background:rgba(66,232,255,.1); color:var(--text); }
.tool--on { color:var(--cyan); border-color:rgba(66,232,255,.35); }
.speed { display:flex; margin-right:auto; border:1px solid var(--edge-soft); }
.speed button { padding:4px 9px; border:0; background:rgba(255,255,255,.03); color:var(--text-faint); font-size:11px; font-weight:700; }
.speed button.on { background:var(--cyan); color:#04121a; }

/* The commit control: a wide slanted slab, the way a fighting game does it. */
.commit-dock { flex:0 0 auto; display:flex; flex-direction:column; gap:8px; }
.commit {
  position:relative; padding:16px 22px; border:0;
  background:linear-gradient(100deg, #ff3f5c 0%, #ff7a4d 55%, #ffb347 100%);
  clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);
  color:#25060a; text-align:left;
  box-shadow:0 0 34px rgba(255,63,92,.35);
}
.commit:hover { box-shadow:0 0 50px rgba(255,63,92,.55); }
.commit__verb { display:block; font-size:10px; font-weight:900; letter-spacing:.24em; text-transform:uppercase; opacity:.6; }
.commit__main { display:block; font-size:24px; font-weight:900; line-height:1.1; }
.commit__key { display:block; font-size:10.5px; font-weight:700; opacity:.6; margin-top:2px; }
.commit-alt { display:flex; gap:7px; }
.commit-alt button { flex:1; padding:7px 10px; border:1px solid var(--edge-soft); background:rgba(255,255,255,.03);
  color:var(--text-dim); font-size:11.5px; font-weight:600;
  clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%); }
.commit-alt button:hover { color:var(--text); border-color:var(--cyan); }

/* --- Foot ---------------------------------------------------------------- */
.table__foot { display:flex; flex-direction:column; gap:6px; padding:6px 14px 12px;
  border-top:1px solid var(--edge); background:linear-gradient(180deg, rgba(66,232,255,.05), transparent); }
.hand-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:flex-end; gap:14px; }
.cmdzone { padding:7px; border-radius:4px; border:1px solid rgba(255,212,121,.34); background:rgba(255,212,121,.06); }
.cmdzone__label { color:#ffd479; font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
.cmdslot { position:relative; --card-w:clamp(74px,4.2vw,100px); margin-top:5px; }
.mat--compact .cmdslot { --card-w:clamp(46px,2.5vw,60px); }
.mat--compact .cmdzone { padding:4px; }
.mat--compact .cmdzone__label { display:none; }
.cmdslot__tax { position:absolute; top:-7px; right:-7px; padding:1px 7px; border-radius:999px;
  background:#241a04; border:1px solid rgba(255,212,121,.6); color:#ffd479; font-size:10.5px; font-weight:800; }
.cmdslot__where { display:block; padding-top:3px; color:var(--text-faint); font-size:9.5px; text-align:center; }
.hand { position:relative; display:flex; justify-content:center; --card-w:clamp(92px,5.4vw,136px);
  min-height:calc(var(--card-w)*1.4 + 44px); padding:10px 0 16px; }
.hand__rail { position:relative; height:calc(var(--card-w)*1.4); }
.hand__slot { position:absolute; top:0; transform-origin:50% 130%; }

.acts__list { min-height:74px; }

/* Short viewports -- see 01. The strike band costs a row, so this theme gives up
   the most card size on a short screen. */
@media (max-height: 1050px) {
  :root { --card-w: clamp(46px, 5.3vh, 84px); }
  .mat--compact { --card-w: clamp(40px, 4.7vh, 68px); }
  .striker { --card-w: clamp(34px, 4.2vh, 62px); }
  .band { padding:6px 12px; gap:12px; }
  .band__row { gap:10px; }
  .preview .card { --card-w: clamp(84px, 11vh, 122px); }
  .hand { --card-w: clamp(70px, 9.5vh, 106px); }
  .cmdslot { --card-w: clamp(50px, 6.8vh, 78px); }
  .mat--compact .cmdslot { --card-w: clamp(32px, 4.3vh, 50px); }
  .orb__life { font-size:clamp(22px, 3vh, 34px); }
  .band__dmg { font-size:21px; }
  .commit { padding:12px 18px; }
  .commit__main { font-size:18px; }
}

const GLYPH = {creature:"◆",land:"▲",artifact:"■",enchantment:"✦",instant:"»",sorcery:"●",planeswalker:"★",other:"·"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function pips(cost){ if(!cost) return "";
  return [...cost.matchAll(/(\d+|[WUBRGC])/g)].map(m=>`<span class="pip pip--${/^[WUBRGC]$/.test(m[1])?m[1]:"generic"}">${m[1]}</span>`).join(""); }
function sym(text){ return esc(text).replace(/\{([^}]+)\}/g,(whole,s)=>{ const S=s.toUpperCase();
  if(/^[WUBRGC]$/.test(S)) return `<span class="pip pip--inline pip--${S}">${S}</span>`;
  if(S==="T") return `<span class="pip pip--inline pip--tap">↷</span>`;
  if(/^\d+$/.test(S)) return `<span class="pip pip--inline">${S}</span>`; return whole; }); }
function face(c,detail){
  const cls=["face",`face--${c.f}`,`face--type-${c.t}`,c.land?`face--land-${c.land}`:"",c.cmd?"face--commander":"",c.token?"face--token":""].filter(Boolean).join(" ");
  const wm=c.produces?`<div class="face__watermark">${[...c.produces].map(s=>`<span class="watermark-pip watermark-pip--${s}">${s}</span>`).join("")}</div>`:"";
  const body=detail&&c.rules?`<div class="face__rules">${sym(c.rules)}</div>`:(!detail&&c.kw?`<div class="face__keywords">${esc(c.kw)}</div>`:"");
  return `<div class="${cls}"><div class="face__title"><span class="face__glyph">${GLYPH[c.t]||"·"}</span>
    <span class="face__name">${esc(c.n)}</span>${c.cost?`<span class="face__cost">${pips(c.cost)}</span>`:""}</div>
    <div class="face__type">${esc(c.tl)}</div>${wm}${body}
    <div class="face__footer"><span class="spacer"></span>${c.pt?`<span class="face__stats">${c.pt}</span>`:""}</div>
    ${c.cmd?`<span class="face__tag face__tag--cmd">CMD</span>`:""}
    ${c.sick?`<span class="face__tag face__tag--sick">&#9203;</span>`:""}</div>`;
}
function card(c,{detail=false,extra=""}={}){
  const mods=["card",c.tapped?"card--tapped":"",c.staged?"card--staged":"",c.gone?"card--gone":"",
    c.playable?"card--playable":"",c.ability?"card--ability":"",extra].filter(Boolean).join(" ");
  const rune=c.ability?`<span class="rune"><span>↷</span></span>`:"";
  const pop=c.abilityOpen?`<div class="ability-pop"><div class="ability-pop__label">Ability available</div>
    <div class="ability-pop__text">${sym(c.ability)}</div><button class="ability-pop__go">Activate</button></div>`:"";
  return `<div class="${mods}"><div class="card__pivot">${face(c,detail)}</div>${rune}${pop}</div>`;
}
function pile(c,opts){
  if(!c.count||c.count<2) return card(c,opts);
  const back=card({...c,ability:null,abilityOpen:false},opts);
  return `<div class="cardstack${c.tapped?" cardstack--tapped":""}">
    <div class="cardstack__slot" style="transform:translate(8px,-5px);opacity:.85">${back}</div>
    <div class="cardstack__slot">${card(c,opts)}</div>
    <span class="cardstack__count">×${c.count}</span></div>`;
}
function lane(label,cards,{compact=false}={}){
  const total=cards.reduce((n,c)=>n+(c.count||1),0);
  return `<div class="lane">${compact?"":`<div class="lane__label"><span>${label}</span><span class="lane__count tabular">${total}</span></div>`}
    <div class="lane__cards">${cards.map(c=>pile(c)).join("")}</div></div>`;
}
function manaRow(spec){ return spec.map(s=>`<span class="mana-pip mana-pip--${s}"></span>`).join(""); }
function striker(c,idle){

}

function handFan(){
  const n=HAND.length, spread=118, arc=2.2, width=(n-1)*spread+138;
  const slots=HAND.map((c,i)=>{ const mid=(n-1)/2, rot=(i-mid)*arc, droop=Math.abs(i-mid)**2*1.3;
    const hovered=i===4, y=hovered?-46:droop;
    return `<div class="hand__slot" style="left:${i*spread}px;z-index:${hovered?40:i};
      transform:rotate(${rot}deg) translateY(${y}px) ${hovered?"scale(1.06)":""}">${card(c,{detail:true})}</div>`;
  }).join("");
  return `<div class="hand"><div class="hand__rail" style="width:${width}px">${slots}</div></div>`;
}

          <div class="speed"><button>0.5x</button><button class="on">1x</button><button>≫</button></div>
          <button class="tool tool--on">🔊</button><button class="tool">⏩</button>
          <button class="tool">↺</button><button class="tool">✕</button>
        </div>
      </section>
      <div class="commit-dock">
        <button class="commit">
          <span class="commit__verb">Confirm</span>
          <span class="commit__main">Attack with 3</span>
          <span class="commit__key">↵ Enter</span>
        </button>
        <div class="commit-alt"><button>All attack (2)</button><button>No attacks</button></div>
      </div>
    </aside>
  </div>

  <div class="table__foot">
    <div class="hand-row">
      <div class="cmdzone">
        <div class="cmdzone__label">Commander</div>
        <div class="cmdslot">${card(COMMANDER,{detail:true})}<span class="cmdslot__tax">+4</span>
          <span class="cmdslot__where">On the battlefield</span></div>
      </div>
      ${handFan()}
    </div>
  </div>
</div>`;
</script>
</body>
</html>
