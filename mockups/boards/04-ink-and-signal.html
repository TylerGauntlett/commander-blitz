<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Ink &amp; Signal</title>
<style>
/* ============================================================================
   INK & SIGNAL
   ----------------------------------------------------------------------------
   ONE RULE: hue is spent on exactly two things -- mana, and interaction state
   (playable / targetable / staged / attacking / ability). Nothing else on the
   screen is coloured. Card type is carried by luminance and a glyph; the frame
   is a neutral grey.

   That is not a stylistic preference, it is the shipped palette's own argument
   taken to its conclusion. frontend/src/styles/cards.css grades the seven type
   fills across relative luminance 0.58 -> 0.92 precisely so the encoding
   survives greyscale, and frontend/tests/palette.test.ts asserts it. This mockup
   asks what the board looks like if that ladder is the whole encoding -- and
   therefore whether the hue currently spent on card bodies is buying anything a
   green "you can play this" rim would rather have.

   Structural idea: ACTIONS GROUPED BY SOURCE. The shipped bar is a flat list of
   server-written sentences ("Terramorphic Expanse: {T}, Sacrifice: Search for a
   basic land tapped."). Grouped under the card that offers them, the same list
   becomes the question a player is actually asking: what can each of my things
   do right now?
   ========================================================================== */

:root {
  --ink-0:#161513; --ink-1:#1e1c1a; --ink-2:#272522; --ink-3:#33302c;
  --line:#3b3733; --line-hi:#4e4945;

  /* The only hues on screen. */
  --playable:#4fd47f; --targetable:#4fa8ea; --staged:#e8a93c;
  --attack:#e0574c; --ability:#a074e8; --danger:#e0574c;
  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd;

  --text:#efece6; --text-dim:#a29c93; --text-faint:#6e6862;

  --card-w: clamp(80px, 4.3vw, 110px);
  --card-r: calc(var(--card-w) * .05);
  --font: "Segoe UI", Inter, system-ui, sans-serif;
}
* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body { background:var(--ink-0); color:var(--text); font-family:var(--font); font-size:14px;
  overflow:hidden; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; cursor:pointer; }
.spacer { flex:1; }
.tabular { font-variant-numeric:tabular-nums; }
.table { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }
.sheet { border-radius:10px; background:var(--ink-1); border:1px solid var(--line); }

/* --- Header -------------------------------------------------------------- */
.head { display:flex; align-items:center; gap:20px; padding:11px 20px; border-bottom:1px solid var(--line); background:var(--ink-1); }
.head__turn { display:flex; align-items:baseline; gap:10px; }
.head__turn b { font-size:21px; font-weight:800; letter-spacing:-.01em; }
.head__turn span { font-size:11px; color:var(--text-faint); letter-spacing:.14em; text-transform:uppercase; }
.steps { display:flex; gap:0; flex:1; margin:0; padding:0; list-style:none; }
.ph { display:flex; align-items:center; gap:12px; padding:4px 16px; color:var(--text-faint);
  font-size:11.5px; white-space:nowrap; border-left:1px solid var(--line); }
.ph:first-child { border-left:0; }
.ph--past { color:var(--text-dim); }
.ph--now { flex:1; min-width:0; color:var(--text); }
.ph__name { font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:11px; }
.ph__steps { display:flex; gap:2px; margin:0; padding:0; list-style:none; overflow:hidden; }
.st { padding:2px 9px; font-size:11px; color:var(--text-faint); }
.st--past { color:var(--text-dim); }
/* The current step is the only underlined thing in the header. */
.st--now { color:var(--text); font-weight:800; box-shadow:inset 0 -2px 0 var(--text); }
.head__who { padding:5px 14px; border-radius:999px; border:1px solid var(--playable);
  color:var(--playable); font-size:12.5px; font-weight:700; }

/* --- Body ---------------------------------------------------------------- */
.table__body { display:grid;
  grid-template-columns:clamp(184px,12vw,248px) minmax(0,1fr) clamp(288px,18.5vw,376px);
  gap:12px; min-height:0; padding:12px; }
.play { display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; min-width:0; min-height:0; }
.play__opponents { display:flex; gap:12px; justify-content:center; }
.play__opponents .mat { flex:0 1 auto; max-width:100%; }
.play__mine { min-height:0; display:flex; }
.play__mine .mat { flex:1; }
.rail { display:flex; flex-direction:column; gap:12px; min-height:0; }
.panel { padding:12px 14px; }
.panel__title { display:flex; align-items:center; gap:7px; margin:0 0 9px; color:var(--text-faint);
  font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
.panel__empty { color:var(--text-faint); font-size:12px; font-style:italic; }
.log__lines { display:flex; flex-direction:column; gap:4px; max-height:30vh; overflow-y:auto; }
.log__line { color:var(--text-dim); font-size:11.5px; line-height:1.45; margin:0; }
.log__line--turn { color:var(--text); font-weight:700; }

/* --- Mats ---------------------------------------------------------------- */
.mat { display:grid; grid-template-columns:clamp(150px,9.8vw,190px) minmax(0,1fr); gap:14px; padding:11px; min-height:0; }
.mat--compact { grid-template-columns:clamp(138px,9vw,172px) minmax(0,1fr); --card-w:clamp(64px,3.4vw,86px); padding:8px; }
.mat__side { display:flex; flex-direction:column; gap:10px; min-width:0; }
.mat__lanes { display:flex; flex-direction:column; gap:6px; min-width:0; }

.orb { padding:10px 12px; border-radius:8px; background:var(--ink-2); border:1px solid var(--line); }
.orb--active { border-color:var(--line-hi); }
.orb__name { font-weight:700; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.orb__life { font-size:clamp(32px,2.6vw,46px); font-weight:800; line-height:1.05; letter-spacing:-.03em; }
.orb__delta { font-size:11.5px; color:var(--attack); font-weight:700; }
.orb__mana { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
.mana-pip { width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.5); }
.mana-pip--W{background:var(--mana-W)} .mana-pip--U{background:var(--mana-U)}
.mana-pip--B{background:var(--mana-B)} .mana-pip--R{background:var(--mana-R)}
.mana-pip--G{background:var(--mana-G)} .mana-pip--C{background:var(--mana-C)}
.mana-pip--any{background:conic-gradient(var(--mana-W) 0 72deg,var(--mana-U) 72deg 144deg,var(--mana-B) 144deg 216deg,var(--mana-R) 216deg 288deg,var(--mana-G) 288deg 360deg)}
.orb__zones { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
.zone-chip { padding:3px 8px; border-radius:4px; background:var(--ink-3); border:1px solid var(--line);
  color:var(--text-dim); font-size:11px; white-space:nowrap; }

/* --- Lanes --------------------------------------------------------------- */
.lane { display:grid; grid-template-columns:clamp(60px,4.1vw,82px) minmax(0,1fr); gap:12px;
  align-items:center; padding:4px 6px; }
.lane__label { display:flex; flex-direction:column; color:var(--text-faint); font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; }
.lane__count { color:var(--text-dim); font-size:16px; font-weight:800; }
.lane__cards { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-start; }
.mat--compact .lane { grid-template-columns:minmax(0,1fr); padding:3px 4px; }
.mat--compact .lane__label { display:none; }
.mat--compact .lane__cards { gap:8px; }

/* --- Cards: the luminance ladder, and nothing else ----------------------- */
.card { position:relative; width:var(--card-w); height:calc(var(--card-w)*1.4); flex:0 0 auto; }
.card--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.card__pivot { width:100%; height:100%; transform-origin:50% 50%; }
.card--tapped .card__pivot { width:var(--card-w); height:calc(var(--card-w)*1.4);
  margin-left:calc(var(--card-w)*.2); margin-top:calc(var(--card-w)*-.2); transform:rotate(90deg); }
.face { position:relative; display:flex; flex-direction:column; width:100%; height:100%;
  padding:calc(var(--card-w)*.05); gap:calc(var(--card-w)*.03); overflow:hidden;
  border:1.5px solid #6f6a63; border-radius:var(--card-r);
  background:linear-gradient(165deg, var(--stock) 0%, var(--stock-shade) 100%);
  color:#141210; font-size:calc(var(--card-w)*.082); line-height:1.25;
  box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.4); }

/* The type fills, hue removed and the luminance ladder kept: land is the
   darkest paper on the board, "other" the lightest, in even steps. */
.face--type-land{--stock:#aaa49a;--stock-shade:#989186}
.face--type-creature{--stock:#bcb5aa;--stock-shade:#aaa296}
.face--type-sorcery{--stock:#c8c1b6;--stock-shade:#b6aea2}
.face--type-enchantment{--stock:#d3ccc1;--stock-shade:#c1b9ad}
.face--type-planeswalker{--stock:#ded7cc;--stock-shade:#ccc4b8}
.face--type-artifact{--stock:#e6dfd4;--stock-shade:#d4ccc0}
.face--type-instant{--stock:#ede7dc;--stock-shade:#dbd4c8}
.face--type-other{--stock:#f5f0e6;--stock-shade:#e3ddd2}
/* A land's colour is the one exception, and it is carried by the watermark
   letter, not by the paper -- mana is one of the two things hue is for. */
.face--commander { border-color:#2b2926; box-shadow:0 0 0 2px #b8ae9c, 0 6px 14px rgba(0,0,0,.45); }
.face--token { border-style:dashed; }

.face__title { display:flex; align-items:flex-start; gap:calc(var(--card-w)*.035); font-weight:700; }
.face__glyph { flex:0 0 auto; color:#4a453d; font-size:calc(var(--card-w)*.1); line-height:1.1; }
.face__name { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; font-size:calc(var(--card-w)*.086); }
.face__cost { display:flex; flex:0 0 auto; gap:1px; }
.face__type { padding-bottom:calc(var(--card-w)*.02); border-bottom:1px solid rgba(0,0,0,.22);
  color:#4a453d; font-size:calc(var(--card-w)*.066); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.face__watermark { display:flex; flex:1; align-items:center; justify-content:center; gap:calc(var(--card-w)*.04); min-height:0; }
.watermark-pip { display:flex; align-items:center; justify-content:center;
  width:calc(var(--card-w)*.32); height:calc(var(--card-w)*.32); border-radius:50%;
  border:1px solid rgba(0,0,0,.22); color:rgba(255,255,255,.95);
  font-size:calc(var(--card-w)*.16); font-weight:900; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.4); }
.watermark-pip--W{background:var(--mana-W);color:rgba(40,34,20,.9);text-shadow:none}
.watermark-pip--U{background:var(--mana-U);color:rgba(20,34,44,.9);text-shadow:none}
.watermark-pip--B{background:var(--mana-B);color:rgba(30,28,28,.9);text-shadow:none}
.watermark-pip--R{background:var(--mana-R);color:rgba(44,24,18,.9);text-shadow:none}
.watermark-pip--G{background:var(--mana-G);color:rgba(20,40,26,.9);text-shadow:none}
.watermark-pip--C{background:var(--mana-C);color:rgba(40,40,44,.9);text-shadow:none}
.face__rules { display:flex; flex:1; flex-direction:column; justify-content:safe center; overflow:hidden;
  font-size:calc(var(--card-w)*.064); line-height:1.34; }
.face__keywords { flex:1; overflow:hidden; color:#3f3a33; font-size:calc(var(--card-w)*.068); font-weight:700; }
.face__footer { display:flex; align-items:flex-end; gap:4px; margin-top:auto; }
.face__stats { padding:0 calc(var(--card-w)*.045); border:1px solid rgba(0,0,0,.28);
  border-radius:calc(var(--card-w)*.03); background:rgba(255,255,255,.5);
  font-size:calc(var(--card-w)*.1); font-weight:800; font-variant-numeric:tabular-nums; }
.face__tag { position:absolute; padding:0 3px; border-radius:2px; font-size:calc(var(--card-w)*.055); font-weight:800; }
.face__tag--cmd { bottom:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:#2b2926; color:#efece6; }
.face__tag--sick { top:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:rgba(0,0,0,.45); color:#fff; }

.pip { display:inline-flex; align-items:center; justify-content:center;
  min-width:calc(var(--card-w)*.12); height:calc(var(--card-w)*.12); padding:0 2px; border-radius:999px;
  background:var(--mana-generic); color:#1a1a1a; font-size:calc(var(--card-w)*.075); font-weight:800;
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25); }
.pip--W{background:var(--mana-W)} .pip--U{background:var(--mana-U)} .pip--B{background:var(--mana-B)}
.pip--R{background:var(--mana-R)} .pip--G{background:var(--mana-G)} .pip--C{background:var(--mana-C)}
.pip--tap{background:#4a4f52;color:#f2f5f4}
.pip--inline{min-width:1.2em;height:1.2em;margin:0 .08em;padding:0;font-size:.9em;line-height:1;vertical-align:-.2em}

/* Signal rims -- against a neutral board these are the only saturated things. */
.card::after { content:""; position:absolute; inset:-3px; border-radius:calc(var(--card-r)+3px); pointer-events:none; opacity:0; }
.card--playable::after { opacity:1; box-shadow:0 0 0 2px var(--playable), 0 0 16px rgba(79,212,127,.4); }
.card--staged::after { opacity:1; box-shadow:0 0 0 3px var(--staged), 0 0 20px rgba(232,169,60,.45); }
.card--ability::after { opacity:1; box-shadow:0 0 0 2px var(--ability), 0 0 18px rgba(160,116,232,.45); }
.card--dimmed .face { opacity:.55; }

.rune { position:absolute; z-index:5; top:calc(var(--card-w)*-.07); right:calc(var(--card-w)*-.07);
  display:grid; place-items:center; width:calc(var(--card-w)*.3); height:calc(var(--card-w)*.3);
  border-radius:50%; background:var(--ability); border:1.5px solid #ded0ff; color:#1a0f2e;
  font-size:calc(var(--card-w)*.16); font-weight:900; line-height:1; box-shadow:0 0 12px rgba(160,116,232,.6); }
.ability-pop { position:absolute; z-index:20; left:calc(100% + 14px); top:0;
  width:max(240px, calc(var(--card-w)*2.2)); padding:12px 14px; border-radius:10px;
  background:var(--ink-2); border:1px solid var(--ability); box-shadow:0 16px 40px rgba(0,0,0,.7); }
.ability-pop::after { content:""; position:absolute; right:100%; top:16px;
  border:7px solid transparent; border-right-color:var(--ability); }
.ability-pop__label { color:var(--ability); font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
.ability-pop__text { margin:6px 0 10px; font-size:12.5px; line-height:1.4; }
.ability-pop__go { width:100%; padding:9px 0; border-radius:999px; border:0;
  background:var(--ability); color:#170c2b; font-size:12.5px; font-weight:800; }

.cardstack { position:relative; flex:0 0 auto; width:var(--card-w); height:calc(var(--card-w)*1.4); }
.cardstack--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.cardstack__slot { position:absolute; top:0; left:0; }
.cardstack__count { position:absolute; right:-7px; bottom:-7px; z-index:40; min-width:23px; padding:1px 6px;
  border-radius:999px; background:var(--ink-0); border:1px solid var(--line-hi); color:var(--text);
  font-size:11px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; }

/* --- Right rail: THE ACTION INDEX ---------------------------------------- */
.preview { padding:12px; display:flex; flex-direction:column; gap:10px; align-items:center; flex:0 0 auto; }
.preview .card { --card-w:clamp(110px,6.8vw,142px); }
.preview__facts { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; width:100%; margin:0; font-size:11.5px; }
.preview__facts dt { color:var(--text-faint); }
.preview__facts dd { margin:0; color:var(--text-dim); }

.index { padding:12px 14px; display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-height:0; }
.index__prompt { font-size:14px; font-weight:800; }
.index__hint { margin:0; color:var(--text-dim); font-size:11.5px; line-height:1.4; }
.index__body { display:flex; flex-direction:column; gap:12px; overflow-y:auto; min-height:0; flex:1 1 auto; }
.grp { display:flex; flex-direction:column; gap:5px; }
.grp__head { display:flex; align-items:baseline; gap:8px; }
.grp__name { font-size:11.5px; font-weight:800; letter-spacing:.04em; }
.grp__pt { font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums; margin-left:auto; }
.grp__zone { font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
/* Big soft pills with real keycaps -- these are the only controls that matter. */
.act {
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--ink-2); color:var(--text);
  font-size:12.5px; text-align:left;
}
.act:hover { border-color:var(--line-hi); background:var(--ink-3); }
.act--on { border-color:var(--staged); background:rgba(232,169,60,.13); color:#ffdca4; }
.act--ability { border-color:rgba(160,116,232,.5); }
.act__key { display:grid; place-items:center; min-width:22px; height:22px; padding:0 5px; border-radius:5px;
  background:var(--ink-0); border:1px solid var(--line-hi); box-shadow:0 2px 0 var(--line);
  color:var(--text-dim); font-size:10.5px; font-weight:800; }
.act--on .act__key { color:var(--staged); border-color:var(--staged); }
.act__tail { margin-left:auto; font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums; }

.tools { display:flex; align-items:center; gap:5px; padding-top:10px; border-top:1px solid var(--line); }
.tool { display:grid; place-items:center; min-width:32px; height:29px; padding:0 9px; border-radius:7px;
  border:1px solid transparent; background:transparent; color:var(--text-faint); font-size:11.5px; font-weight:600; }
.tool:hover { background:var(--ink-3); color:var(--text); }
.tool--on { color:var(--text); border-color:var(--line-hi); }
.speed { display:flex; margin-right:auto; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.speed button { padding:4px 10px; border:0; background:var(--ink-2); color:var(--text-faint); font-size:11px; font-weight:700; }
.speed button.on { background:var(--text); color:var(--ink-0); }

/* The commit control: a stadium, twice the height of anything else. */
.commit-dock { flex:0 0 auto; display:flex; flex-direction:column; gap:8px; }
.commit {
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:18px 24px; border-radius:999px; border:0;
  background:var(--attack); color:#1c0705;
  box-shadow:0 4px 0 #9c342c;
}
.commit:hover { background:#ef6a5e; }
.commit__main { font-size:21px; font-weight:900; letter-spacing:-.01em; }
.commit__key { padding:3px 9px; border-radius:6px; background:rgba(0,0,0,.22); font-size:11px; font-weight:800; }
.commit-alt { display:flex; gap:8px; }
.commit-alt button { flex:1; padding:9px 10px; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; }
.commit-alt button:hover { color:var(--text); border-color:var(--line-hi); }

/* --- Foot ---------------------------------------------------------------- */
.table__foot { display:flex; flex-direction:column; gap:6px; padding:6px 16px 12px;
  border-top:1px solid var(--line); background:var(--ink-1); }
.hand-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:flex-end; gap:16px; }
.cmdzone { padding:8px; border-radius:10px; border:1px solid var(--line-hi); background:var(--ink-2); }
.cmdzone__label { color:var(--text-faint); font-size:9.5px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
.cmdslot { position:relative; --card-w:clamp(74px,4.2vw,100px); margin-top:6px; }
.mat--compact .cmdslot { --card-w:clamp(46px,2.5vw,60px); }
.mat--compact .cmdzone { padding:4px; }
.mat--compact .cmdzone__label { display:none; }
.cmdslot__tax { position:absolute; top:-7px; right:-7px; padding:1px 7px; border-radius:999px;
  background:var(--ink-0); border:1px solid var(--line-hi); color:var(--text); font-size:10.5px; font-weight:800; }
.cmdslot__where { display:block; padding-top:4px; color:var(--text-faint); font-size:9.5px; text-align:center; }
.hand { position:relative; display:flex; justify-content:center; --card-w:clamp(92px,5.4vw,136px);
  min-height:calc(var(--card-w)*1.4 + 44px); padding:10px 0 16px; }
.hand__rail { position:relative; height:calc(var(--card-w)*1.4); }
.hand__slot { position:absolute; top:0; transform-origin:50% 130%; }

.index__body { min-height:90px; }

/* Short viewports -- see 01. */
@media (max-height: 1050px) {
  :root { --card-w: clamp(62px, 8.1vh, 88px); }
  .mat--compact { --card-w: clamp(50px, 6.5vh, 70px); }
  .preview .card { --card-w: clamp(84px, 11.2vh, 114px); }
  .hand { --card-w: clamp(74px, 10.2vh, 106px); }
  .cmdslot { --card-w: clamp(56px, 7.6vh, 78px); }
  .mat--compact .cmdslot { --card-w: clamp(36px, 4.8vh, 50px); }
  .orb__life { font-size:clamp(26px, 3.6vh, 38px); }
  .commit { padding:13px 20px; }
  .commit__main { font-size:18px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Board state -- turn 8, DECLARE_ATTACKERS. Mirrors mockups/_state.js. */
const OPP_LANDS = [
  {n:"Mountain",tl:"Basic Land — Mountain",t:"land",land:"R",produces:"R",count:2},
  {n:"Scoured Barrens",tl:"Land",t:"land",land:"multi",produces:"WB",tapped:true},
];
const OPP_CREATURES = [

  {n:"Vampire Neonate",cost:"1B",tl:"Creature — Vampire",t:"creature",pt:"0/3"},

const MY_LANDS = [

   ability:"{T}, Sacrifice: Search for a basic land tapped.",abilityOpen:true},

const MY_CREATURES = [

  {n:"Aesi, Tyrant of Gyre Strait",cost:"4GU",tl:"Legendary Creature — Serpent",t:"creature",pt:"5/5",kw:"Trample",cmd:true,staged:true,
   rules:"Trample. Whenever you play a land, draw a card. You may play an additional land on each of your turns."},

  {n:"Vorel of the Hull Clade",cost:"1GU",tl:"Legendary Creature — Human Merfolk",t:"creature",pt:"1/4",rules:"{1}{G}{U}, {T}: Put a +1/+1 counter on target creature you control.",playable:true},

  {n:"Nimble Mongoose",cost:"G",tl:"Creature — Mongoose",t:"creature",pt:"1/1",rules:"Hexproof",playable:true},
  {n:"Gyre Sage",cost:"1G",tl:"Creature — Elf Druid",t:"creature",pt:"0/2",rules:"{T}: Add {G}.",playable:true},
  {n:"Explore",cost:"1G",tl:"Sorcery",t:"sorcery",rules:"You may play an additional land this turn. Draw a card.",playable:true},
];
const COMMANDER = {n:"Aesi, Tyrant of Gyre Strait",cost:"4GU",tl:"Legendary Creature — Serpent",t:"creature",pt:"5/5",kw:"Trample",cmd:true,
  rules:"Trample. Whenever you play a land, draw a card. You may play an additional land on each of your turns."};
const OPP_COMMANDER = {n:"Edgar Markov",cost:"3RWB",tl:"Legendary Creature — Vampire Knight",t:"creature",pt:"4/4",kw:"First strike",cmd:true};
const LOG = [["— Your turn 8 —",1],["You play Forest",0],["Zendikar's Roil creates a 2/2 Elemental",0],
  ["Aesi, Tyrant of Gyre Strait draws you a card",0],["You cast Acidic Slime",0],["Acidic Slime destroys Bloodcrypt Vault",0]];

const GLYPH = {creature:"◆",land:"▲",artifact:"■",enchantment:"✦",instant:"»",sorcery:"●",planeswalker:"★",other:"·"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function pips(cost){ if(!cost) return "";
  return [...cost.matchAll(/(\d+|[WUBRGC])/g)].map(m=>`<span class="pip pip--${/^[WUBRGC]$/.test(m[1])?m[1]:"generic"}">${m[1]}</span>`).join(""); }
function sym(text){ return esc(text).replace(/\{([^}]+)\}/g,(whole,s)=>{ const S=s.toUpperCase();
  if(/^[WUBRGC]$/.test(S)) return `<span class="pip pip--inline pip--${S}">${S}</span>`;
  if(S==="T") return `<span class="pip pip--inline pip--tap">↷</span>`;
  if(/^\d+$/.test(S)) return `<span class="pip pip--inline">${S}</span>`; return whole; }); }
function face(c,detail){
  const cls=["face",`face--type-${c.t}`,c.cmd?"face--commander":"",c.token?"face--token":""].filter(Boolean).join(" ");
  const wm=c.produces?`<div class="face__watermark">${[...c.produces].map(s=>`<span class="watermark-pip watermark-pip--${s}">${s}</span>`).join("")}</div>`:"";
  const body=detail&&c.rules?`<div class="face__rules">${sym(c.rules)}</div>`:(!detail&&c.kw?`<div class="face__keywords">${esc(c.kw)}</div>`:"");
  return `<div class="${cls}"><div class="face__title"><span class="face__glyph">${GLYPH[c.t]||"·"}</span>
    <span class="face__name">${esc(c.n)}</span>${c.cost?`<span class="face__cost">${pips(c.cost)}</span>`:""}</div>
    <div class="face__type">${esc(c.tl)}</div>${wm}${body}
    <div class="face__footer"><span class="spacer"></span>${c.pt?`<span class="face__stats">${c.pt}</span>`:""}</div>
    ${c.cmd?`<span class="face__tag face__tag--cmd">CMD</span>`:""}
    ${c.sick?`<span class="face__tag face__tag--sick">&#9203;</span>`:""}</div>`;
}
function card(c,{detail=false}={}){
  const mods=["card",c.tapped?"card--tapped":"",c.staged?"card--staged":"",c.dimmed?"card--dimmed":"",
    c.playable?"card--playable":"",c.ability?"card--ability":""].filter(Boolean).join(" ");
  const rune=c.ability?`<span class="rune">↷</span>`:"";
  const pop=c.abilityOpen?`<div class="ability-pop"><div class="ability-pop__label">Ability available</div>
    <div class="ability-pop__text">${sym(c.ability)}</div><button class="ability-pop__go">Activate</button></div>`:"";
  return `<div class="${mods}"><div class="card__pivot">${face(c,detail)}</div>${rune}${pop}</div>`;
}
function pile(c,opts){
  if(!c.count||c.count<2) return card(c,opts);
  const back=card({...c,ability:null,abilityOpen:false,staged:false},opts);
  return `<div class="cardstack${c.tapped?" cardstack--tapped":""}">
    <div class="cardstack__slot" style="transform:translate(8px,-5px);opacity:.85">${back}</div>
    <div class="cardstack__slot">${card(c,opts)}</div>
    <span class="cardstack__count">×${c.count}</span></div>`;
}
function lane(label,cards,{compact=false}={}){
  const total=cards.reduce((n,c)=>n+(c.count||1),0);
  return `<div class="lane">${compact?"":`<div class="lane__label"><span>${label}</span><span class="lane__count tabular">${total}</span></div>`}
    <div class="lane__cards">${cards.map(c=>pile(c)).join("")}</div></div>`;
}
function manaRow(spec){ return spec.map(s=>`<span class="mana-pip mana-pip--${s}"></span>`).join(""); }

/** One group per card that can do something. This is the whole idea. */
function group(name, zone, pt, acts){
  return `<div class="grp">
    <div class="grp__head"><span class="grp__name">${esc(name)}</span>
      <span class="grp__zone">${zone}</span>
      ${pt?`<span class="grp__pt tabular">${pt}</span>`:""}</div>
    ${acts.map(a=>`<button class="act${a.on?" act--on":""}${a.ability?" act--ability":""}">
      <span class="act__key">${a.key}</span>${a.label}
      ${a.tail?`<span class="act__tail">${a.tail}</span>`:""}</button>`).join("")}
  </div>`;
}

const oppMat = `
<section class="mat mat--compact sheet">
  <div class="mat__side">
    <div class="orb">
      <div class="orb__name">Edgar Markov</div>
      <div class="orb__life tabular">25</div>
      <div class="orb__delta">−14 if unblocked</div>
      <div class="orb__mana">${manaRow(["R","R","any"])}</div>
      <div class="orb__zones"><span class="zone-chip">Lib 84</span><span class="zone-chip">Hand 4</span>

    <div class="cmdzone"><div class="cmdslot">${card(OPP_COMMANDER)}<span class="cmdslot__tax">+2</span>

  </div>

    ${lane("Lands",OPP_LANDS,{compact:true})}

  </div>
</section>`;

const myMat = `
<section class="mat sheet">
  <div class="mat__side">
    <div class="orb orb--active">
      <div class="orb__name">You</div>
      <div class="orb__life tabular">34</div>
      <div class="orb__mana">${manaRow(["G","G","G","G","G","G","G","U","U","U","any","C"])}</div>
      <div class="orb__zones"><span class="zone-chip">Lib 72</span><span class="zone-chip">Hand 6</span>
        <span class="zone-chip">GY 3</span><span class="zone-chip">Exile 1</span></div>
    </div>
  </div>
  <div class="mat__lanes">
    ${lane("Lands",MY_LANDS)}
    ${lane("Creatures",MY_CREATURES)}
    ${lane("Enchant",MY_OTHER)}
  </div>
</section>`;

function handFan(){
  const n=HAND.length, spread=118, arc=2.2, width=(n-1)*spread+138;
  const slots=HAND.map((c,i)=>{ const mid=(n-1)/2, rot=(i-mid)*arc, droop=Math.abs(i-mid)**2*1.3;
    const hovered=i===4, y=hovered?-46:droop;
    return `<div class="hand__slot" style="left:${i*spread}px;z-index:${hovered?40:i};
      transform:rotate(${rot}deg) translateY(${y}px) ${hovered?"scale(1.06)":""}">${card(c,{detail:true})}</div>`;
  }).join("");
  return `<div class="hand"><div class="hand__rail" style="width:${width}px">${slots}</div></div>`;
}

document.getElementById("root").innerHTML = `
<div class="table">

  <div class="table__body">

    <main class="play">
