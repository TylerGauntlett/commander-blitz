<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto MTG — Arcane Slate</title>
<style>
/* ============================================================================
   ARCANE SLATE
   ----------------------------------------------------------------------------
   Ground: cool graphite. The shipped table is #0a1410 green, which competes with
   both things green already means on this board -- the --playable rim and the
   Forest land tone. A neutral ground gives every encoded colour back its full
   contrast without touching the card palette at all.

   Structural idea: the PRIORITY STONE. One large hex button, always bottom-right,
   always showing the single thing the turn is waiting on. Today `.btn` is one
   rectangle serving Quit, Undo, the speed toggle and the commit action alike.

   Plus: ability runes on permanents, and a phase ribbon that groups 13 steps into
   5 phases and only expands the one you are in.
   ========================================================================== */

:root {
  /* Table */
  --g-0:#0b0d12; --g-1:#161a22; --g-2:#1e232d; --g-3:#272d39;
  --well:rgba(0,0,0,.32);
  --edge:rgba(255,255,255,.07);
  --edge-hi:rgba(255,255,255,.13);

  /* Accents */
  --brass:#c9a45c; --brass-dim:#8d7134;
  --arcane:#9d8cf0;

  /* Signals -- unchanged from frontend/src/theme.css, on purpose. These are the
     encoding; the theme is the ground they sit on. */
  --playable:#5ce08a; --targetable:#58b6ff; --staged:#ffc14d;
  --attacking:#ff6b5e; --blocking:#6ba8ff; --danger:#ff5c5c; --gold:#ffd479;
  /* New: an available activated ability. Violet, because green/blue/amber/red
     are all taken by hand-playable, targetable, staged and attacking. */
  --ability:#b98bff;

  /* Card stock -- lifted verbatim from frontend/src/styles/cards.css so the
     luminance ladder frontend/tests/palette.test.ts guards is preserved. */
  --stock:#f3ece0; --stock-shade:#ddd2be; --stock-ink:#17130d;
  --stock-ink-dim:#5d5346; --stock-rule:#b9ad96;
  --mana-W:#fffbd5; --mana-U:#aae0fa; --mana-B:#cbc2bf; --mana-R:#f9aa8f;
  --mana-G:#9bd3ab; --mana-C:#d5d5d5; --mana-generic:#cfc9bd;

  /* Text */
  --text:#e4e7ef; --text-dim:#9aa2b4; --text-faint:#646c7c;

  /* Geometry. Fluid rather than fixed: the shipped client hard-codes 104px, so a
     2560px display shows the same small cards a 1600px one does -- and a 1366px
     one shows cards too big for the board to fit. */
  --card-w: clamp(84px, 4.5vw, 112px);
  --card-r: calc(var(--card-w) * .055);
  --font: "Segoe UI", Inter, system-ui, sans-serif;
}

* { box-sizing:border-box; }
html,body,#root { height:100%; margin:0; }
body {
  background:
    radial-gradient(120% 90% at 50% -10%, var(--g-2) 0%, var(--g-0) 68%),
    var(--g-0);
  color:var(--text); font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button { font:inherit; color:inherit; cursor:pointer; }
.spacer { flex:1; }
.tabular { font-variant-numeric:tabular-nums; }

.table { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }

/* --- Phase ribbon --------------------------------------------------------
   13 equal 10.5px ticks is a lot of chrome for one fact. Grouped into the five
   phases, only the live one expands into its steps. */
.ribbon {
  display:flex; align-items:center; gap:18px; padding:10px 18px;
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.25));
  border-bottom:1px solid var(--edge);
}
.ribbon__turn { display:flex; align-items:baseline; gap:9px; flex:0 0 auto; }
.ribbon__turn b {
  font-size:20px; font-weight:800; color:var(--brass); letter-spacing:.02em;
}
.ribbon__turn span { font-size:12px; color:var(--text-faint); }
.ribbon__who {
  flex:0 0 auto; padding:5px 14px; border-radius:999px;
  background:rgba(92,224,138,.13); border:1px solid rgba(92,224,138,.35);
  color:var(--playable); font-size:12.5px; font-weight:700;
}
.ribbon__phases {
  display:flex; align-items:stretch; gap:6px; flex:1; margin:0; padding:0;
  list-style:none; min-width:0;
}
.ph {
  display:flex; align-items:center; gap:10px; padding:5px 14px;
  border-radius:8px; color:var(--text-faint); font-size:12px; white-space:nowrap;
}
.ph--past { color:var(--text-dim); }
.ph--past .ph__name::before { content:"✓ "; color:var(--brass-dim); }
.ph--now {
  flex:1 1 auto; min-width:0;
  background:linear-gradient(180deg, rgba(201,164,92,.18), rgba(201,164,92,.06));
  border:1px solid rgba(201,164,92,.42);
  box-shadow:0 0 24px rgba(201,164,92,.12), inset 0 1px 0 rgba(255,255,255,.08);
  color:var(--brass);
}
.ph__name { font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:11.5px; }
.ph__steps {
  display:flex; gap:3px; margin:0; padding:0; list-style:none;
  overflow:hidden;
}
.st {
  padding:3px 10px; border-radius:5px; font-size:11px; color:var(--text-faint);
}
.st--past { color:var(--text-dim); }
.st--now {
  background:var(--brass); color:#1b1508; font-weight:800;
  box-shadow:0 0 14px rgba(201,164,92,.5);
}

/* --- Body ---------------------------------------------------------------- */
.table__body {
  position:relative; display:grid;
  grid-template-columns: clamp(196px,13vw,270px) minmax(0,1fr) clamp(268px,17vw,350px);
  gap:12px; min-height:0; padding:12px;
}
/* Opponents take the room they need and no more; the viewer gets the rest.
   The shipped ratio is a fixed 1.25fr : 1fr the other way, which is why a
   one-opponent board spends its largest row on empty felt while the viewer's
   creature lane falls below the fold -- docs/playtest-feedback-03.md Cycle 4
   item 1, at exactly the step this board is on. */
.play { display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; min-width:0; min-height:0; }
.play__opponents { display:flex; gap:12px; justify-content:center; min-height:0; }
/* Not `flex:1 1 0`: one opponent stretched to the full row is what produces the
   wide blank strip beside a half-empty board. It sizes to its cards. */
.play__opponents .mat { flex:0 1 auto; max-width:100%; }
.play__mine { min-height:0; display:flex; }
.play__mine .mat { flex:1; }

/* Panels are wells cut into the slate, not boxes drawn on it. */
.well {
  border-radius:12px;
  background:var(--well);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 12px 28px rgba(0,0,0,.35);
}
.rail { display:flex; flex-direction:column; gap:12px; min-height:0; }
.rail--right { overflow:hidden; }
.panel { padding:11px 13px; }
.panel__title {
  display:flex; align-items:center; gap:7px; margin:0 0 8px;
  color:var(--text-faint); font-size:10.5px; font-weight:800;
  letter-spacing:.13em; text-transform:uppercase;
}
.panel__badge {
  padding:0 6px; border-radius:999px; background:var(--brass); color:#1b1508;
  font-size:10px; font-weight:800;
}
.panel__empty { color:var(--text-faint); font-size:12px; font-style:italic; }

.log__lines { display:flex; flex-direction:column; gap:3px; max-height:32vh; overflow-y:auto; }
.log__line { color:var(--text-dim); font-size:11.5px; line-height:1.45; margin:0; }
.log__line--turn { color:var(--brass); font-weight:700; }

/* --- Mats ---------------------------------------------------------------- */
.mat {
  display:grid; grid-template-columns:clamp(150px,10vw,196px) minmax(0,1fr);
  gap:12px; padding:10px; min-height:0;
}
/* An opponent's board is read, never played from, so it gives up size first. */
.mat--compact { grid-template-columns:clamp(132px,9vw,170px) minmax(0,1fr); --card-w:clamp(68px,3.6vw,92px); }
.mat__side { display:flex; flex-direction:column; gap:9px; min-width:0; }
/* Deliberately not scrollable: the ability popover has to be able to escape the
   lane it is anchored in, and an overflow value of anything but `visible`
   creates a clipping context that eats it. */
.mat__lanes { display:flex; flex-direction:column; gap:7px; min-width:0; }

/* The seat plate. Life is the number people look for, so it gets to be big. */
.orb { padding:11px 13px; border-radius:10px; background:rgba(0,0,0,.3); border:1px solid var(--edge); }
.orb--active { border-color:rgba(201,164,92,.45); box-shadow:0 0 0 1px rgba(201,164,92,.18), 0 0 30px rgba(201,164,92,.1); }
.orb__head { display:flex; align-items:center; gap:7px; margin-bottom:2px; }
.orb__name { font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.orb__dot { width:8px; height:8px; border-radius:50%; background:var(--brass); box-shadow:0 0 9px var(--brass); flex:0 0 auto; }
.orb__life { font-size:clamp(30px,2.4vw,42px); font-weight:800; line-height:1; letter-spacing:-.02em; }
.orb__life--foe { color:#ffb9b2; }
.orb__mana { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.mana-pip { width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.5); box-shadow:inset 0 1px 1px rgba(255,255,255,.4); }
.mana-pip--W{background:var(--mana-W)} .mana-pip--U{background:var(--mana-U)}
.mana-pip--B{background:var(--mana-B)} .mana-pip--R{background:var(--mana-R)}
.mana-pip--G{background:var(--mana-G)} .mana-pip--C{background:var(--mana-C)}
.mana-pip--any { background:conic-gradient(var(--mana-W) 0 72deg,var(--mana-U) 72deg 144deg,var(--mana-B) 144deg 216deg,var(--mana-R) 216deg 288deg,var(--mana-G) 288deg 360deg); }
.orb__zones { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
.zone-chip {
  padding:4px 9px; border-radius:6px; background:rgba(255,255,255,.045);
  border:1px solid var(--edge); color:var(--text-dim); font-size:11px; white-space:nowrap;
}
.zone-chip--cmd { border-color:rgba(201,164,92,.4); color:var(--brass); }

/* --- Lanes --------------------------------------------------------------- */
.lane {
  display:grid; grid-template-columns:clamp(58px,4vw,80px) minmax(0,1fr); gap:10px;
  align-items:center; padding:6px 8px; border-radius:9px;
  border:1px solid transparent;
}
.lane--lit { border-color:rgba(185,139,255,.28); background:rgba(185,139,255,.05); }
.lane__label { display:flex; flex-direction:column; color:var(--text-faint); font-size:10px; letter-spacing:.05em; text-transform:uppercase; }
.lane__count { color:var(--text-dim); font-size:15px; font-weight:800; }
.lane__cards { display:flex; flex-wrap:wrap; gap:11px 13px; align-items:flex-start; }
.mat--compact .lane { grid-template-columns:minmax(0,1fr); padding:3px 4px; }
.mat--compact .lane__label { display:none; }
.mat--compact .lane__cards { gap:8px; }

/* --- Cards --------------------------------------------------------------- */
.card { position:relative; width:var(--card-w); height:calc(var(--card-w)*1.4); flex:0 0 auto; }
.card--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.card__pivot { width:100%; height:100%; transform-origin:50% 50%; }
.card--tapped .card__pivot {
  width:var(--card-w); height:calc(var(--card-w)*1.4);
  margin-left:calc(var(--card-w)*.2); margin-top:calc(var(--card-w)*-.2);
  transform:rotate(90deg);
}
.face {
  position:relative; display:flex; flex-direction:column; width:100%; height:100%;
  padding:calc(var(--card-w)*.045); gap:calc(var(--card-w)*.028); overflow:hidden;
  border:2px solid #2b2f36; border-radius:var(--card-r);
  background:linear-gradient(160deg, var(--stock) 0%, var(--stock-shade) 100%);
  color:var(--stock-ink); font-size:calc(var(--card-w)*.082); line-height:1.25;
  box-shadow:0 1px 2px rgba(0,0,0,.55), 0 8px 18px rgba(0,0,0,.45);
}
.face--W{border-color:#d8cfa8} .face--U{border-color:#4a86b8} .face--B{border-color:#4c4550}
.face--R{border-color:#b8624a} .face--G{border-color:#4e8a5c} .face--C{border-color:#8a8f96}
.face--gold{border-color:#b99a45} .face--land{border-color:#6f5a3e}
.face--commander { border-color:#d8a63c; box-shadow:0 0 0 1px rgba(216,166,60,.6), 0 8px 20px rgba(0,0,0,.5); }
.face--token { border-style:dashed; border-color:#7a8b99; }

.face--type-land{--stock:#d6c7a8;--stock-shade:#c6b186}
.face--type-creature{--stock:#ebc9bc;--stock-shade:#e0a894}
.face--type-sorcery{--stock:#eecfdf;--stock-shade:#e1a9c7}
.face--type-enchantment{--stock:#e4d9f1;--stock-shade:#cab5e3}
.face--type-artifact{--stock:#e5eaf0;--stock-shade:#c5d1dd}
.face--type-instant{--stock:#e4f2f7;--stock-shade:#bce0ec}
.face--type-other{--stock:#f8f6f1;--stock-shade:#e7decf}
.face--land-W{--stock:#daca89;--stock-shade:#cdb862}
.face--land-U{--stock:#afcde3;--stock-shade:#8ab6d6}
.face--land-B{--stock:#d1c5da;--stock-shade:#b9a5c6}
.face--land-R{--stock:#ebbfb5;--stock-shade:#e19d8c}
.face--land-G{--stock:#a6d69e;--stock-shade:#85c67a}
.face--land-C{--stock:#c5c9ce;--stock-shade:#aab0b6}
.face--land-multi{--stock:#e2c77d;--stock-shade:#d9b653}

.face__title { display:flex; align-items:flex-start; gap:calc(var(--card-w)*.03); font-weight:700; }
.face__glyph { flex:0 0 auto; color:var(--stock-ink-dim); font-size:calc(var(--card-w)*.088); line-height:1.15; }
.face__name { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:calc(var(--card-w)*.086); }
.face__cost { display:flex; flex:0 0 auto; gap:1px; }
.face__type { padding-bottom:calc(var(--card-w)*.02); border-bottom:1px solid var(--stock-rule); color:var(--stock-ink-dim); font-size:calc(var(--card-w)*.066); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.face__watermark { display:flex; flex:1; align-items:center; justify-content:center; gap:calc(var(--card-w)*.04); min-height:0; }
.watermark-pip {
  display:flex; align-items:center; justify-content:center;
  width:calc(var(--card-w)*.3); height:calc(var(--card-w)*.3); border-radius:50%;
  border:1px solid rgba(0,0,0,.18); color:rgba(255,255,255,.92);
  font-size:calc(var(--card-w)*.15); font-weight:800; line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.2), 0 1px 2px rgba(0,0,0,.15);
}
.watermark-pip--W{background:var(--mana-W);color:rgba(40,34,20,.85);text-shadow:none}
.watermark-pip--U{background:var(--mana-U)} .watermark-pip--B{background:var(--mana-B)}
.watermark-pip--R{background:var(--mana-R)} .watermark-pip--G{background:var(--mana-G)}
.watermark-pip--C{background:var(--mana-C);color:rgba(40,40,44,.85);text-shadow:none}
.face__rules { display:flex; flex:1; flex-direction:column; justify-content:safe center; overflow:hidden; font-size:calc(var(--card-w)*.064); line-height:1.32; }
.face__keywords { flex:1; overflow:hidden; color:#4a6b52; font-size:calc(var(--card-w)*.068); font-weight:600; }
.face__footer { display:flex; align-items:flex-end; gap:4px; margin-top:auto; }
.face__stats {
  padding:0 calc(var(--card-w)*.04); border:1px solid var(--stock-rule);
  border-radius:calc(var(--card-w)*.03); background:rgba(255,255,255,.55);
  font-size:calc(var(--card-w)*.095); font-weight:800; font-variant-numeric:tabular-nums;
}
.face__tag { position:absolute; padding:0 3px; border-radius:3px; font-size:calc(var(--card-w)*.055); font-weight:800; letter-spacing:.04em; }
.face__tag--cmd { bottom:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:#d8a63c; color:#2a1e05; }
.face__tag--sick { top:calc(var(--card-w)*.03); right:calc(var(--card-w)*.03); background:rgba(0,0,0,.42); color:#fff; }

.pip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:calc(var(--card-w)*.115); height:calc(var(--card-w)*.115); padding:0 2px;
  border-radius:999px; background:var(--mana-generic); color:#1a1a1a;
  font-size:calc(var(--card-w)*.072); font-weight:800;
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);
}
.pip--W{background:var(--mana-W)} .pip--U{background:var(--mana-U)} .pip--B{background:var(--mana-B)}
.pip--R{background:var(--mana-R)} .pip--G{background:var(--mana-G)} .pip--C{background:var(--mana-C)}
.pip--tap { background:#4a4f52; color:#f2f5f4; }
.pip--inline { min-width:1.2em; height:1.2em; margin:0 .08em; padding:0; font-size:.9em; line-height:1; vertical-align:-.2em; }

/* Interaction rims. Same encoding as the shipped client. */
.card::after {
  content:""; position:absolute; inset:-3px; border-radius:calc(var(--card-r) + 3px);
  pointer-events:none; opacity:0;
}
.card--playable::after { opacity:1; box-shadow:0 0 0 2px var(--playable), 0 0 18px rgba(92,224,138,.5); }
.card--staged::after  { opacity:1; box-shadow:0 0 0 3px var(--staged), 0 0 22px rgba(255,193,77,.55); }
.card--dimmed .face::after { content:""; position:absolute; inset:0; border-radius:inherit; background:rgba(8,10,16,.24); }

/* THE ABILITY RUNE.
   A permanent with an available `activate` action says so on itself, instead of
   only appearing as a sentence in the action bar's overflow row. Violet, and a
   shape as well as a colour so it reads at pod size. */
.card--ability::after {
  opacity:1;
  box-shadow:0 0 0 2px var(--ability), 0 0 20px rgba(185,139,255,.45);
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { box-shadow:0 0 0 2px var(--ability), 0 0 14px rgba(185,139,255,.35); }
  50%     { box-shadow:0 0 0 2px var(--ability), 0 0 26px rgba(185,139,255,.62); }
}
.rune {
  position:absolute; z-index:5; top:calc(var(--card-w)*-.07); right:calc(var(--card-w)*-.07);
  display:grid; place-items:center;
  width:calc(var(--card-w)*.3); height:calc(var(--card-w)*.3);
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #d6c0ff, #7b58d6);
  border:1px solid #e2d5ff; color:#1c1230;
  font-size:calc(var(--card-w)*.16); font-weight:900; line-height:1;
  box-shadow:0 0 16px rgba(185,139,255,.75), 0 2px 5px rgba(0,0,0,.5);
}

/* The popover the rune opens. Baked open on one card so the mockup shows it.
   Anchored to the side rather than above: a lands-lane card opening upward
   covers the opponent's board, and opening downward covers your own creatures --
   both of which are things you are looking at while you decide. */
.ability-pop {
  position:absolute; z-index:20; left:calc(100% + 14px); top:0;
  width:max(240px, calc(var(--card-w)*2.2));
  padding:11px 13px; border-radius:11px;
  background:linear-gradient(180deg,#241c3c,#171226);
  border:1px solid rgba(185,139,255,.5);
  box-shadow:0 18px 44px rgba(0,0,0,.7), 0 0 30px rgba(185,139,255,.2);
}
.ability-pop::after {
  content:""; position:absolute; right:100%; top:16px;
  border:7px solid transparent; border-right-color:#241c3c;
}
.ability-pop__label { color:var(--ability); font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
.ability-pop__text { margin:5px 0 9px; font-size:12px; line-height:1.4; color:var(--text); }
.ability-pop__go {
  width:100%; padding:7px 0; border-radius:8px; border:1px solid rgba(185,139,255,.55);
  background:linear-gradient(180deg,#7b5ed8,#553c9e); color:#f4efff;
  font-size:12.5px; font-weight:800; box-shadow:0 2px 0 #33235f;
}

/* Stacks of identical permanents. */
.cardstack { position:relative; flex:0 0 auto; width:var(--card-w); height:calc(var(--card-w)*1.4); }
.cardstack--tapped { width:calc(var(--card-w)*1.4); height:var(--card-w); }
.cardstack__slot { position:absolute; top:0; left:0; }
.cardstack__count {
  position:absolute; right:-7px; bottom:-7px; z-index:40; min-width:24px;
  padding:1px 6px; border-radius:999px; background:#141822;
  border:1px solid var(--edge-hi); color:var(--brass);
  font-size:11.5px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums;
}

/* --- Right rail: preview + actions --------------------------------------- */
/* Sizes to the card rather than eating the rail's slack: the rail's job is to
   end with the commit button, and a preview that grows pushes it off the edge. */
.preview { padding:12px; display:flex; flex-direction:column; gap:10px; align-items:center; flex:0 0 auto; }
.preview .card { --card-w:clamp(126px,7.9vw,158px); }
.preview__facts { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; width:100%; margin:0; font-size:11.5px; }
.preview__facts dt { color:var(--text-faint); }
.preview__facts dd { margin:0; color:var(--text-dim); }

.acts { padding:12px; display:flex; flex-direction:column; gap:9px; flex:1 1 auto; min-height:0; }
.acts__prompt { font-size:13.5px; font-weight:700; }
.acts__hint { margin:0; color:var(--text-dim); font-size:11.5px; line-height:1.4; }
.acts__list { display:flex; flex-direction:column; gap:6px; overflow-y:auto; min-height:0; flex:1 1 auto; }

/* Tier 2: contextual choices. Not the same object as the commit button. */
.opt {
  display:flex; align-items:center; gap:9px; width:100%; padding:8px 11px;
  border-radius:9px; border:1px solid var(--edge); background:rgba(255,255,255,.035);
  color:var(--text); font-size:12.5px; text-align:left;
}
.opt:hover { border-color:var(--edge-hi); background:rgba(255,255,255,.07); }
.opt--on { border-color:var(--staged); background:rgba(255,193,77,.13); color:var(--staged); }
.opt__pt { margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; opacity:.85; }
.opt__key {
  display:grid; place-items:center; width:19px; height:19px; border-radius:5px;
  background:rgba(255,255,255,.07); border:1px solid var(--edge-hi);
  color:var(--text-faint); font-size:10.5px; font-weight:800;
}

/* Tier 3: utilities. Demoted to an icon strip -- these are not plays. */
.tools { display:flex; align-items:center; gap:5px; padding-top:9px; border-top:1px solid var(--edge); }
.tool {
  display:grid; place-items:center; min-width:30px; height:28px; padding:0 8px;
  border-radius:7px; border:1px solid transparent; background:transparent;
  color:var(--text-faint); font-size:11.5px; font-weight:600;
}
.tool:hover { background:rgba(255,255,255,.06); color:var(--text); }
.tool--on { color:var(--brass); border-color:rgba(201,164,92,.4); }
.speed { display:flex; margin-right:auto; border:1px solid var(--edge); border-radius:7px; overflow:hidden; }
.speed button { padding:4px 9px; border:0; background:rgba(255,255,255,.03); color:var(--text-faint); font-size:11px; font-weight:700; }
.speed button.on { background:var(--brass); color:#1b1508; }

/* --- THE PRIORITY STONE --------------------------------------------------
   The one control the turn is waiting on, always in the same place, always the
   biggest thing on screen after the cards. Hex-cut so it is not another
   rectangle, and it carries its own key hint. */
.stone-dock {
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:9px;
  padding-top:2px;
}
.stone {
  position:relative; width:100%; max-width:250px; height:104px; border:0; padding:0;
  background:linear-gradient(180deg, #f0c874 0%, #cf9c3c 46%, #a6761f 100%);
  clip-path:polygon(22% 0%, 78% 0%, 100% 50%, 78% 100%, 22% 100%, 0% 50%);
  color:#251a04;
  filter:drop-shadow(0 0 26px rgba(201,164,92,.42)) drop-shadow(0 10px 20px rgba(0,0,0,.6));
}
.stone:hover { filter:drop-shadow(0 0 38px rgba(201,164,92,.6)) drop-shadow(0 12px 24px rgba(0,0,0,.6)); }
.stone__inner {
  position:absolute; inset:2px;
  background:linear-gradient(180deg, #ffdf9a 0%, #dcae4e 44%, #b7871f 100%);
  clip-path:polygon(22% 0%, 78% 0%, 100% 50%, 78% 100%, 22% 100%, 0% 50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.stone__verb { font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; opacity:.66; }
.stone__main { font-size:25px; font-weight:900; letter-spacing:-.01em; line-height:1; }
.stone__key { font-size:10.5px; font-weight:700; opacity:.62; letter-spacing:.06em; }
.stone-alt { display:flex; gap:7px; }
.stone-alt button {
  padding:7px 15px; border-radius:999px; border:1px solid var(--edge-hi);
  background:rgba(12,14,20,.82); color:var(--text-dim); font-size:12px; font-weight:600;
  backdrop-filter:blur(4px);
}
.stone-alt button:hover { color:var(--text); border-color:var(--text-faint); }

/* --- Foot: staged combat + hand ------------------------------------------ */
.table__foot {
  display:flex; flex-direction:column; gap:6px; padding:8px 14px 12px;
  border-top:1px solid var(--edge);
  background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.5));
}
/* The shipped bar renders one sentence per legal pair -- "Attack p1 with Gyre
   Strait Leviathan" x5. A staged attacker is a creature and a target, so it is
   drawn as one. */
.strike { display:flex; align-items:center; gap:14px; padding:8px 14px; border-radius:11px;
  background:rgba(255,193,77,.07); border:1px solid rgba(255,193,77,.3); }
.strike__head { flex:0 0 auto; }
.strike__title { margin:0; font-size:13px; font-weight:800; color:var(--staged); }
.strike__hint { margin:1px 0 0; color:var(--text-dim); font-size:11.5px; }
.strike__list { display:flex; gap:8px; flex:1; min-width:0; overflow-x:auto; padding:1px; }
.atk {
  display:flex; align-items:center; gap:9px; padding:5px 11px 5px 7px; border-radius:9px;
  border:1px solid rgba(255,193,77,.5); background:rgba(255,193,77,.14); white-space:nowrap;
}
.atk__pt { display:grid; place-items:center; min-width:34px; height:26px; border-radius:6px;
  background:rgba(255,193,77,.9); color:#2a1e05; font-size:12.5px; font-weight:900; font-variant-numeric:tabular-nums; }
.atk__name { font-size:12.5px; font-weight:600; color:#ffe6b4; max-width:170px; overflow:hidden; text-overflow:ellipsis; }
.atk__at { color:var(--text-faint); font-size:11px; }
.atk__foe { font-size:12px; color:#ffb9b2; font-weight:700; }
.atk--ghost { border-style:dashed; border-color:var(--edge-hi); background:transparent; }
.atk--ghost .atk__pt { background:rgba(255,255,255,.09); color:var(--text-dim); }
.atk--ghost .atk__name { color:var(--text-faint); }
.strike__sum { flex:0 0 auto; text-align:right; }
.strike__dmg { font-size:23px; font-weight:900; color:var(--attacking); line-height:1; }
.strike__dmg-label { font-size:10px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; }

.hand-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:flex-end; gap:14px; }
.cmdzone { padding:7px; border-radius:11px; border:1px solid rgba(201,164,92,.34); background:rgba(201,164,92,.07); }
.cmdzone__label { color:var(--brass); font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
.cmdslot { position:relative; --card-w:clamp(76px,4.3vw,104px); margin-top:5px; }
/* An opponent's commander is reference -- you never cast from it -- so it gives
   up size first. Left larger, the dock alone makes the opponent row taller than
   its whole battlefield needs. */
.mat--compact .cmdslot { --card-w:clamp(52px,2.9vw,70px); }
.mat--compact .cmdzone { padding:4px; }
.mat--compact .cmdzone__label { display:none; }
.cmdslot__tax {
  position:absolute; top:-7px; right:-7px; padding:1px 7px; border-radius:999px;
  background:#2a2008; border:1px solid rgba(201,164,92,.6); color:var(--brass);
  font-size:10.5px; font-weight:800;
}
.cmdslot__where { display:block; padding-top:3px; color:var(--text-faint); font-size:9.5px; text-align:center; }

/* The extra room past the card height absorbs the arc's droop and the rotation
   of the outermost cards. Both are transforms, so they contribute nothing to
   layout -- without the padding they clip straight through the bottom edge. */
.hand {
  position:relative; display:flex; justify-content:center;
  --card-w:clamp(94px,5.5vw,140px);
  min-height:calc(var(--card-w)*1.4 + 44px);
  padding:10px 0 16px;
}
.hand__rail { position:relative; height:calc(var(--card-w)*1.4); }
.hand__slot { position:absolute; top:0; transform-origin:50% 130%; }

/* Cards you can afford lift slightly and glow; the shipped client only glows. */
.hand__slot .card--playable .face { box-shadow:0 2px 3px rgba(0,0,0,.5), 0 12px 26px rgba(0,0,0,.5); }

/* Never let the action list collapse to nothing when the rail is squeezed. */
.acts__list { min-height:74px; }

/* Short viewports -- 950px is what docs/playtest-feedback-03.md playtests at.
   Card size keys off *height* here, not width: the constraint on a 1600x950
   laptop is vertical, and the shipped client only ever shrinks the hand
   (`--hand-scale`), never the board, which is why the creature lane drops below
   the fold. Everything scales together. */
@media (max-height: 1050px) {
  :root { --card-w: clamp(50px, 5.9vh, 92px); }
  .mat--compact { --card-w: clamp(44px, 5.2vh, 74px); }
  .preview .card { --card-w: clamp(88px, 11.5vh, 130px); }
  .hand { --card-w: clamp(72px, 9.8vh, 112px); }
  .cmdslot { --card-w: clamp(54px, 7.4vh, 84px); }
  .mat--compact .cmdslot { --card-w: clamp(34px, 4.6vh, 54px); }
  .orb__life { font-size:clamp(24px, 3.3vh, 36px); }
  .stone { height:84px; }
  .stone__main { font-size:20px; }
}
</style>

/* --------------------------------------------------------------- renderers */
const GLYPH = {creature:"◆",land:"▲",artifact:"■",enchantment:"✦",instant:"»",sorcery:"●",planeswalker:"★",other:"·"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/** "4GU" -> three pips. Numbers stay generic, WUBRGC take their colour. */
function pips(cost) {
  if (!cost) return "";
  return [...cost.matchAll(/(\d+|[WUBRGC])/g)]
    .map(m => `<span class="pip pip--${/^[WUBRGC]$/.test(m[1]) ? m[1] : "generic"}">${m[1]}</span>`)
    .join("");
}

/** Mana notation inside a sentence, drawn as the same pips as a cost row. */
function sym(text) {
  return esc(text).replace(/\{([^}]+)\}/g, (whole, s) => {
    const S = s.toUpperCase();
    if (/^[WUBRGC]$/.test(S)) return `<span class="pip pip--inline pip--${S}">${S}</span>`;
    if (S === "T") return `<span class="pip pip--inline pip--tap">↷</span>`;
    if (/^\d+$/.test(S)) return `<span class="pip pip--inline">${S}</span>`;
    return whole;
  });
}

function face(c, detail) {
  const cls = ["face", `face--${c.f}`, `face--type-${c.t}`,
    c.land ? `face--land-${c.land}` : "", c.cmd ? "face--commander" : "", c.token ? "face--token" : ""]
    .filter(Boolean).join(" ");
  const watermark = c.produces
    ? `<div class="face__watermark">${[...c.produces].map(s => `<span class="watermark-pip watermark-pip--${s}">${s}</span>`).join("")}</div>`
    : "";
  const body = detail && c.rules ? `<div class="face__rules">${sym(c.rules)}</div>`
    : (!detail && c.kw ? `<div class="face__keywords">${esc(c.kw)}</div>` : "");
  return `<div class="${cls}">
    <div class="face__title">
      <span class="face__glyph">${GLYPH[c.t] || "·"}</span>
      <span class="face__name">${esc(c.n)}</span>
      ${c.cost ? `<span class="face__cost">${pips(c.cost)}</span>` : ""}
    </div>
    <div class="face__type">${esc(c.tl)}</div>
    ${watermark}${body}
    <div class="face__footer"><span class="spacer"></span>${c.pt ? `<span class="face__stats">${c.pt}</span>` : ""}</div>
    ${c.cmd ? `<span class="face__tag face__tag--cmd">CMD</span>` : ""}
    ${c.sick ? `<span class="face__tag face__tag--sick">&#9203;</span>` : ""}
  </div>`;
}

function card(c, { detail = false, extra = "" } = {}) {
  const mods = ["card", c.tapped ? "card--tapped" : "", c.staged ? "card--staged" : "",
    c.playable || c.candidate ? "card--playable" : "", c.ability ? "card--ability" : "",
    c.dimmed ? "card--dimmed" : "", extra].filter(Boolean).join(" ");
  const rune = c.ability ? `<span class="rune">↷</span>` : "";
  const pop = c.abilityOpen ? `<div class="ability-pop">
      <div class="ability-pop__label">Ability available</div>
      <div class="ability-pop__text">${sym(c.ability)}</div>
      <button class="ability-pop__go">Activate</button>
    </div>` : "";
  return `<div class="${mods}"><div class="card__pivot">${face(c, detail)}</div>${rune}${pop}</div>`;
}

/** Identical permanents collapse to one pile with a count, as logic/stacking.ts does. */
function pile(c, opts) {
  if (!c.count || c.count < 2) return card(c, opts);
  const back = card({ ...c, ability: null, abilityOpen: false, staged: false }, opts);
  return `<div class="cardstack${c.tapped ? " cardstack--tapped" : ""}">
    <div class="cardstack__slot" style="transform:translate(8px,-5px);opacity:.85">${back}</div>
    <div class="cardstack__slot">${card(c, opts)}</div>
    <span class="cardstack__count">×${c.count}</span>
  </div>`;
}

function lane(label, cards, { lit = false, compact = false } = {}) {
  const total = cards.reduce((n, c) => n + (c.count || 1), 0);
  return `<div class="lane${lit ? " lane--lit" : ""}">
    ${compact ? "" : `<div class="lane__label"><span>${label}</span><span class="lane__count tabular">${total}</span></div>`}
    <div class="lane__cards">${cards.map(c => pile(c)).join("")}</div>
  </div>`;
}

function manaRow(spec) {
  return spec.map(s => `<span class="mana-pip mana-pip--${s}"></span>`).join("");
}

/* The fan. Positions are computed here because the shipped HandFan sets them as
   inline styles from JS too -- there is no CSS-only form to copy. */
function handFan() {
  const n = HAND.length, spread = 120, arc = 2.2;
  const width = (n - 1) * spread + 142;
  const slots = HAND.map((c, i) => {
    const mid = (n - 1) / 2;
    const rot = (i - mid) * arc;
    const droop = Math.abs(i - mid) ** 2 * 1.3;
    const hovered = i === 4;
    const y = hovered ? -46 : droop;
    return `<div class="hand__slot" style="left:${i * spread}px; z-index:${hovered ? 40 : i};
      transform:rotate(${rot}deg) translateY(${y}px) ${hovered ? "scale(1.06)" : ""}">
      ${card(c, { detail: true })}</div>`;
  }).join("");
  return `<div class="hand"><div class="hand__rail" style="width:${width}px">${slots}</div></div>`;
}
