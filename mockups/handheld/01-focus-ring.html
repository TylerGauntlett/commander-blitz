/* ===========================================================================
   3. THE PAD
   ---------------------------------------------------------------------------
   One input layer, five consumers. Every mockup calls Pad.start({...}) with
   named intents -- `up`, `confirm`, `cancel`, `zoneNext` -- and never touches a
   button index, because the whole point of the round is to compare what the
   intents are WIRED TO, and a direction that spelt its own polling loop would
   be comparing loop bugs instead.

   STEAM DECK -> STANDARD GAMEPAD. The Deck reports itself as a Standard
   Gamepad, so the W3C indices hold and are what this maps:

       0 A     1 B     2 X     3 Y
       4 L1    5 R1    6 L2    7 R2      (6 and 7 are ANALOG -- .value 0..1)
       8 View  9 Menu  10 L3   11 R3
       12 Up   13 Down 14 Left 15 Right
       axes 0,1 left stick   axes 2,3 right stick

   The four back grips (L4/R4/L5/R5) are DELIBERATELY UNUSED. Steam Input maps
   them to other buttons by default and a player may have rebound them, so a
   design that needs them is a design that breaks on somebody's machine. The
   trackpads arrive as mouse input, which is why the pointer still works
   everywhere and 04 can be built on it at all. Gyro is not exposed to the
   browser at all -- no direction here may depend on it.

   KEYBOARD FALLBACK exists so these can be reviewed without a controller, and
   is chosen to sit under one hand on a laptop:

       arrows / WASD   d-pad          Enter or J    A (confirm)
       Backspace / K   B (cancel)     U             X
       I               Y              Q / E         L1 / R1
       1 / 3           L2 / R2        Tab           View     \  Menu
   ======================================================================== */

const Pad = (() => {
  const BTN = {
    a: 0, b: 1, x: 2, y: 3, l1: 4, r1: 5, l2: 6, r2: 7,
    view: 8, menu: 9, l3: 10, r3: 11, up: 12, down: 13, left: 14, right: 15,
  };
  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    Enter: "a", j: "a", Backspace: "b", k: "b", u: "x", i: "y",
    q: "l1", e: "r1", 1: "l2", 3: "r2", Tab: "view", "\\": "menu",
    ",": "l3", ".": "r3",
  };
  const DEAD = 0.30;          // Deck sticks rest noisily; 0.30 is past the noise
  const FIRE = 0.55;          // a direction is meant once the stick crosses this
  const RELEASE = 0.35;       // ...and is not meant again until it drops below this
  const REPEAT_FIRST = 400;   // ms a direction must be held before it repeats
  const REPEAT_NEXT = 95;     // ms between repeats after that

  let handlers = {};
  let prev = {};              // button name -> was down last frame
  let held = {};              // direction -> ms the next repeat is due
  let latched = null;         // the stick's current sector, or null while centred
  let connected = false;
  let raf = 0;
  let presses = 0;            // every discrete input, for the press-count metric
  const keyDown = new Set();
  /* A key tapped faster than a frame is a key the poll never sees: keydown and
     keyup can both land inside one 16ms gap, `down()` reads false at poll time,
     and the press is silently dropped. A pad cannot do this to you because it
     IS the poll, which is why the bug only ever shows up on the fallback -- and
     why it would have been blamed on the keyboard map rather than found. So a
     key press is latched until exactly one frame has observed it. */
  const keyLatch = new Set();
  const listeners = new Set();

  // A keyboard press and a pad press arrive at the same place, so nothing
  // downstream can tell them apart and no mockup has two code paths.
  function down(name) {
    return keyDown.has(name) || keyLatch.has(name) || padDown(name);
  }
  function padDown(name) {
    const p = pads()[0];
    if (!p) return false;
    const i = BTN[name];
    if (i === undefined) return false;
    const b = p.buttons[i];
    if (b && (b.pressed || b.value > 0.5)) return true;
    // Sticks stand in for the d-pad, so a direction is either. The latch is
    // what makes that bearable: a stick held toward a corner sits near the
    // boundary of two sectors and, without hysteresis, chatters between them.
    // Over 30 permanents in ragged rows that reads as "the cursor is broken",
    // and the reviewer blames the DIRECTION rather than this loop.
    return latched === name;
  }
  /** Which of the four sectors the left stick is in, with hysteresis: a new
      direction is only latched past FIRE, and nothing new latches until the
      stick falls back inside RELEASE. */
  function sector(p) {
    const x = axis(p, 0);
    const y = axis(p, 1);
    const m = Math.hypot(x, y);
    if (m < RELEASE) return null;
    if (latched && m < FIRE) return latched;
    if (m < FIRE) return null;
    return Math.abs(x) > Math.abs(y)
      ? (x < 0 ? "left" : "right")
      : (y < 0 ? "up" : "down");
  }
  function pads() {
    return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  }
  function axis(p, i) {
    return p.axes.length > i ? p.axes[i] : 0;
  }
  /** Analog trigger position, 0..1. Falls back to the digital press so the
      keyboard can still reach the ends of the range. */
  function trigger(name) {
    const p = pads()[0];
    if (p) {
      const b = p.buttons[BTN[name]];
      if (b) return keyDown.has(name) ? 1 : b.value;
    }
    return keyDown.has(name) ? 1 : 0;
  }
  /** Right stick, deadzoned and rescaled so it leaves 0 cleanly. */
  function rstick() {
    const p = pads()[0];
    if (!p) return { x: 0, y: 0 };
    const raw = { x: axis(p, 2), y: axis(p, 3) };
    const m = Math.hypot(raw.x, raw.y);
    if (m < DEAD) return { x: 0, y: 0 };
    const k = (m - DEAD) / (1 - DEAD) / m;
    return { x: raw.x * k, y: raw.y * k };
  }
  function lstick() {
    const p = pads()[0];
    if (!p) {
      const x = (keyDown.has("right") ? 1 : 0) - (keyDown.has("left") ? 1 : 0);
      const y = (keyDown.has("down") ? 1 : 0) - (keyDown.has("up") ? 1 : 0);
      return { x, y };
    }
    const raw = { x: axis(p, 0), y: axis(p, 1) };
    const m = Math.hypot(raw.x, raw.y);
    if (m < DEAD) return { x: 0, y: 0 };
    const k = (m - DEAD) / (1 - DEAD) / m;
    return { x: raw.x * k, y: raw.y * k };
  }

  const REPEATS = new Set(["up", "down", "left", "right"]);

  function frame(now) {
    // The array getGamepads() hands back is a SNAPSHOT. Caching the Gamepad
    // object gives you buttons frozen at the moment you cached it, which is the
    // single most common way to write a gamepad loop that half-works.
    const live = pads();
    const isLive = live.length > 0;
    if (isLive !== connected) {
      connected = isLive;
      listeners.forEach((f) => f(connected));
    }
    latched = live[0] ? sector(live[0]) : null;
    if (!latched) {
      for (const d of REPEATS) if (keyDown.has(d) || keyLatch.has(d)) latched = d;
    }
    for (const name of Object.keys(BTN)) {
      const isDown = down(name);
      const was = prev[name];
      if (isDown && !was) {
        fire(name);
        if (REPEATS.has(name)) held[name] = now + REPEAT_FIRST;
      } else if (isDown && was && REPEATS.has(name) && now >= held[name]) {
        fire(name);
        held[name] = now + REPEAT_NEXT;
      } else if (!isDown) {
        delete held[name];
      }
      prev[name] = isDown;
    }
    if (handlers.frame) handlers.frame({ lstick: lstick(), rstick: rstick(), l2: trigger("l2"), r2: trigger("r2"), connected });
    // One frame has now seen every latched key, so a key still physically held
    // survives in keyDown and a tapped one is released here.
    for (const name of [...keyLatch]) if (!keyDown.has(name)) keyLatch.delete(name);
    raf = requestAnimationFrame(frame);
  }
  /* Every discrete input is counted, and the count is on screen in every file.
     "How many presses to cast a spell with a target" is this round's headline
     number, and a number the prototype reports itself is a number nobody has to
     argue about afterwards. */
  function fire(name) {
    presses += 1;
    const h = handlers[name];
    if (h) h();
    if (handlers.any) handlers.any(name);
  }

  /* Rumble, for exactly one thing: the illegal-move buzz. THE RULE IS THAT
     RUMBLE IS ALWAYS REDUNDANT WITH SOMETHING VISIBLE -- Firefox in the Deck's
     desktop mode has no `vibrationActuator`, so haptics can never be the only
     channel carrying a fact. */
  function rumble(ms = 90, strong = 0.4) {
    const p = pads()[0];
    const act = p && p.vibrationActuator;
    if (!act || !act.playEffect) return;
    try {
      act.playEffect("dual-rumble", { duration: ms, strongMagnitude: strong, weakMagnitude: strong * 0.6 });
    } catch { /* a pad that does not do haptics is not an error */ }
  }

  return {
    BTN,
    rumble,
    presses: () => presses,
    resetPresses: () => { presses = 0; },
    start(h) {
      handlers = h || {};
      addEventListener("keydown", (ev) => {
        const name = KEYS[ev.key];
        if (!name) return;
        // Tab and Backspace both navigate the page otherwise, and Backspace on
        // file:// is a history step you cannot get back from.
        ev.preventDefault();
        if (ev.repeat) return;   // the OS autorepeat would race our own DAS/ARR
        keyDown.add(name);
        keyLatch.add(name);
      });
      addEventListener("keyup", (ev) => {
        const name = KEYS[ev.key];
        if (name) keyDown.delete(name);
      });
      // Chrome hides pads until a gesture, so this is the moment they appear.
      addEventListener("gamepadconnected", () => { });
      raf = requestAnimationFrame(frame);
      return this;
    },
    stop() { cancelAnimationFrame(raf); },
    onConnection(f) { listeners.add(f); f(connected); },
    connected() { return connected; },
    trigger, rstick, lstick,
  };
})();

/* The glyphs. Drawn as text on a disc rather than fetched, because the round
   has to open from file:// with no network -- and because the Deck's own face
   buttons are literally lettered A B X Y in that layout. */
const GLYPH = {
  a: "A", b: "B", x: "X", y: "Y",
  l1: "L1", r1: "R1", l2: "L2", r2: "R2",
  view: "⧉", menu: "☰", l3: "L3", r3: "R3",
  up: "▲", down: "▼", left: "◀", right: "▶",
  dpad: "✛", lstick: "◉", rstick: "◎",
};

/* ===========================================================================
   4. SHARED RENDER HELPERS
   ---------------------------------------------------------------------------
   Only the pieces that must look identical across all five so the comparison is
   about layout: the card face, mana pips and rating bars. Everything structural
   is each direction's own.
   ======================================================================== */

/* The slug ../art/manifest.json actually uses. An apostrophe is a SEPARATOR,
   not a character to delete: the file is `garruk-s-packleader.jpg`, so stripping
   the apostrophe first yields `garruks-packleader` and a silently broken image.
   Four cards on this board state hit that, and a missing crop looks exactly
   like a card that genuinely has no printing -- which is why it is worth
   getting right rather than eyeballing. */
const ART = (name) => {
  if (!name) return null;
  const slug = name
    .replace(/^token:/, "token-")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
  return `../art/${slug}.jpg`;
};

/* ---------------------------------------------------------------------------
   MANA SYMBOLS -- the published ones, not letters on coloured discs.

   `../cards/symbols/` holds the 54 real Scryfall SVGs that `fetch_symbols.py`
   pulled and that the shipped client now vendors to `frontend/public/symbols/`.
   Using them here matters for two reasons beyond looking right:

   1. A LETTER ON A DISC IS TEXT, AND TEXT HAS A FLOOR. At the sizes a mana cost
      wants to be, a letter lands under 16px and `assert.js` fails the file --
      correctly, because a 13px letter really is unreadable on a 7-inch screen.
      The published symbols are SHAPES, so they read at 14px the way a suit pip
      on a playing card does, and they are `aria-hidden` with the cost given in
      text to anything that needs words.
   2. Hybrids and Phyrexian have no letter form at all. `{W/U}` as "WU" on one
      disc is an invention; `W-U.svg` is the actual symbol.

   `<img>` works from file:// where `fetch()` does not, which is the whole
   reason these are separate files rather than inlined data URIs.
------------------------------------------------------------------------- */

const SYM_DIR = "../cards/symbols";

/** Tokenise a cost. Accepts the shorthand this round uses (`4GU`), Scryfall's
    braces (`{4}{G}{U}`), and hybrids either way (`W/U`, `{2/B}`). */
function tokens(cost) {
  if (!cost) return [];
  if (Array.isArray(cost)) return cost;
  const s = String(cost).replace(/[{}]/g, "");
  const out = [];
  let num = "";
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (/[0-9]/.test(ch)) { num += ch; continue; }
    if (num && s[i] !== "/") { out.push(num); num = ""; }
    if (s[i + 1] === "/") {                       // hybrid: bind a/b as one
      const a = num || ch;
      num = "";
      out.push(`${a}/${s[i + 2]}`);
      i += 2;
      continue;
    }
    out.push(ch);
  }
  if (num) out.push(num);
  return out;
}

/** One published symbol. `alt` is empty and the element is aria-hidden because
    every cost that uses this also carries a text form for anything reading. */
function symHTML(tok) {
  const file = String(tok).replace("/", "-").toUpperCase();
  return `<img class="sym" src="${SYM_DIR}/${file}.svg" alt="" aria-hidden="true">`;
}

/* A COST IS ONE WORD. Wrapped in its own inline-flex so `{3}{B}` can never
   break across two lines the way it did in the rail -- a mana cost split down
   the middle reads as two different costs. */
function costHTML(cost) {
  const t = tokens(cost);
  if (!t.length) return "";
  return `<span class="cost">${t.map(symHTML).join("")}</span>`;
}

/** The mana a single source can make, which is NOT the same shape as a cost:
    Scoured Barrens makes W *or* B, so it is one hybrid symbol rather than two
    pips claiming two mana that do not both exist. Board round 03 got this wrong
    in the other direction and the note is still in `../README.md`. */
function producesHTML(str) {
  if (!str) return "";
  const inner = str.includes("/") ? symHTML(str) : tokens(str).map(symHTML).join("");
  return `<span class="cost">${inner}</span>`;
}

/* --- Rules text with its symbols in it ------------------------------------
   `SymbolText.tsx` swaps `{G}` inside oracle text for the published pip. Doing
   the same here is not decoration -- "{1}{G}{U}, {T}:" rendered as literal
   braces was the single worst-looking thing in 01-05, and an activated ability
   is exactly where it appears.
------------------------------------------------------------------------- */
function textHTML(s) {
  if (!s) return "";
  return String(s).replace(/\{([^}]+)\}/g, (_, t) => symHTML(t));
}

/* An activated ability, split into what you PAY and what you GET, because that
   is the order a player reads one in. Rendering it as a single run of prose is
   what made ability cards look broken in the first five. */
function splitAbility(text) {
  if (!text) return null;
  const i = text.indexOf(":");
  if (i < 0) return { cost: "", effect: text.trim() };
  return { cost: text.slice(0, i).trim(), effect: text.slice(i + 1).trim() };
}

const MANA_HUE = { W: "#fffbd5", U: "#aae0fa", B: "#cbc2bf", R: "#f9aa8f", G: "#9bd3ab", C: "#d0cbc4" };

/** Kept for the colour-identity dots, which are deliberately NOT mana symbols:
    a deck's identity is five slots that are on or off, and five full pips reads
    as a cost somebody has to pay. */
function pipHTML(sym) {
  return symHTML(sym);
}

/** Colour-identity dots for a deck, in WUBRG order, which is the order a
    Commander player says them in. */
function ciHTML(ci) {
  return ci.map((c) => `<i class="ci" style="background:${MANA_HUE[c]}"></i>`).join("");
}

/** A 1-4 rating as four segments. A number would be read as a score; segments
    are read as a quantity, which is what it is. */
function ratingHTML(v) {
  return [1, 2, 3, 4].map((i) => `<i class="seg${i <= v ? " seg--on" : ""}"></i>`).join("");
}

const TYPE_GLYPH = {
  creature: "❖", land: "◈", sorcery: "✦", instant: "⚡",
  enchantment: "❋", artifact: "⬢", planeswalker: "✧",
};

/** The one card face every direction draws, so a card is the same object on all
    five and the comparison is about what SURROUNDS it. Width comes from
    `--card-w` on the container -- each direction owns its own scale.
 *
 *  `opts.tile` DROPS THE NAME, and that is the round's first real finding
 *  rather than a shortcut. Hold the 16px floor and "Elvish Visionary" needs
 *  about 128px of card width to render its own name. A viewer's board here is
 *  twelve permanents; twelve at 128px is 1536px on a screen that has 1280. So
 *  at this floor the name cannot be on every board card at once, and each
 *  direction has to say what it does about that. 01 and 05 put the name on the
 *  ring (the focused card gets a plate, and the hint bar always says what you
 *  are on); 03 makes the cards big enough that the name fits; 04 never draws a
 *  board at all. Shrinking the type to fit is the one answer nobody may give,
 *  because that is what the shipped client already does -- 2.11px at the
 *  bottom -- and it is why this round exists. */
function faceHTML(c, opts = {}) {
  if (!c) return `<div class="face face--empty"></div>`;
  const art = ART(c.art);
  const cls = [
    "face", `face--${c.f || "default"}`,
    opts.tile ? "face--tile" : "",
    opts.nameless ? "face--nameless" : "",
    // A thumb sits BESIDE its own name in real type. It identifies a row rather
    // than being the only thing identifying an object, so the 96px card floor
    // does not apply to it -- and `assert.js` exempts exactly this class, so
    // the exemption is a decision written down rather than a hole in the check.
    // Using it on a card that carries no adjacent name is cheating the gate.
    opts.thumb ? "face--thumb" : "",
    c.tapped ? "face--tapped" : "",
    c.sick ? "face--sick" : "",
    opts.dim ? "face--dim" : "",
    opts.cls || "",
  ].filter(Boolean).join(" ");
  return `<div class="${cls}">
    ${art ? `<img class="face__art" src="${art}" alt="" loading="lazy">` : `<div class="face__noart" aria-hidden="true">${TYPE_GLYPH[c.t] || "◇"}</div>`}
    <div class="face__head">
      <span class="face__glyph" aria-hidden="true">${TYPE_GLYPH[c.t] || "◇"}</span>
      <span class="face__name">${c.cmd ? "♛ " : ""}${c.n}</span>
      ${c.cost ? `<span class="face__cost">${costHTML(c.cost)}</span>` : ""}
    </div>
    ${abilityBandHTML(c, opts)}
    <div class="face__foot">
      ${c.land ? `<span class="face__land">${producesHTML(c.land)}</span>` : ""}
      ${c.pt ? `<span class="face__pt">${c.pt}</span>` : ""}
    </div>
    ${c.count > 1 ? `<span class="face__count">×${c.count}</span>` : ""}
    ${c.ability ? `<span class="face__rune" aria-hidden="true">↻</span>` : ""}
    ${c.attacker ? `<span class="face__atk" aria-hidden="true">▲</span>` : ""}
  </div>`;
}

/* THE ABILITY BAND.
   The round's own feedback named "poorly formatted cards when containing an
   activated ability", and it was right: 01-05 drew a rune and dropped the text,
   or ran "{T}, Sacrifice: Search your library..." as one line of prose with
   literal braces in it.

   An activated ability is TWO things and a player reads them in order -- what
   you pay, then what you get -- so it is drawn as two, split on the colon, with
   the cost in real symbols. On a tile there is no room for either and the rune
   is all you get; at any size above that the band appears, because a card whose
   ability you cannot read is a card you cannot decide about. */
function abilityBandHTML(c, opts = {}) {
  if (!c.ability || opts.tile) return "";
  const a = splitAbility(c.ability);
  return `<div class="face__ab">
    ${a.cost ? `<span class="face__ab-cost">${textHTML(a.cost)}</span>` : ""}
    <span class="face__ab-effect">${textHTML(a.effect)}</span>
  </div>`;
}

/** Every permanent on one side, in the three lanes the client uses. */
function lanesOf(p) {
  return [
    { id: "lands", n: "Lands", cards: p.lands },
    { id: "creatures", n: "Creatures", cards: p.creatures },
    { id: "other", n: "Other", cards: p.other },
  ];
}

/** How many actual objects a lane holds, counting a ×7 stack as seven. This is
    what a "12 lands" readout means, and getting it from `count` rather than
    `length` is the difference between the readout and the row agreeing. */
function countOf(cards) {
  return cards.reduce((n, c) => n + (c.count || 1), 0);
}

/* ---------------------------------------------------------------------------
   STABLE IDENTITY, and why the cursor needs it.

   Every direction here re-renders by rebuilding markup, which destroys DOM
   focus. So the cursor cannot BE `document.activeElement` -- it has to be state
   (`{zone, oid}`) that the renderer draws a ring from, with real DOM focus
   restored once per render so the accessibility tree still agrees.

   That is not a mockup workaround. It is the finding the React client needs:
   `Table.tsx` has every board card at `tabIndex={0}` with no focus styling and
   no roving tabindex, and a roving tabindex driven by state is the fix.

   A ×7 stack of Forests keeps ONE oid and stays one cursor stop, which is also
   how the hover-only `CardStack` fan gets a controller route: focusing the
   stack is what fans it.
------------------------------------------------------------------------- */
let _oid = 100;
function tag(cards, zone) {
  cards.forEach((c) => {
    c.oid = ++_oid;
    c.zone = zone;
  });
  return cards;
}

tag(OPP.lands, "opp:lands");
tag(OPP.creatures, "opp:creatures");
tag(OPP.other, "opp:other");
tag(ME.lands, "my:lands");
tag(ME.creatures, "my:creatures");
tag(ME.other, "my:other");
tag(HAND, "hand");
tag([OPP.cmdr], "opp:cmd");
tag([ME.cmdr], "my:cmd");

/** Every permanent on the table, in one list, for the directions that want to
    treat the board as a flat graph rather than as three lanes a side. */
function allPermanents() {
  return [...lanesOf(OPP), ...lanesOf(ME)].flatMap((l) => l.cards);
}

const byOid = (oid) => allPermanents().concat(HAND).find((c) => c.oid === oid) || null;

/* ---------------------------------------------------------------------------
   FIT THE DECK TO THE WINDOW.

   The stage is always 1280x800; only its scale changes. Called once and on
   resize. Everything inside works in Deck pixels and never has to know.

   The one thing that must NOT be scaled is the pointer maths in 05 and 06:
   `clientX/clientY` arrive in window pixels, so a scaled stage needs them
   divided back. `deckPoint()` is that, in one place, so no direction has to
   remember -- getting this wrong makes the pointer drift further from the
   cursor the further you are from the centre, which reads as bad magnetism
   rather than as bad arithmetic.
------------------------------------------------------------------------- */
let DECK_SCALE = 1;
let DECK_W = 1280;
let DECK_H = 800;

/* ---------------------------------------------------------------------------
   TWO WAYS TO SIZE THE STAGE, AND THE DIFFERENCE IS THE WHOLE ARGUMENT ABOUT
   BIG SCREENS.

   DECK mode is the reference: a fixed 1280x800, scaled to fit the window, with
   the scale printed on the bezel. It is what you review a handheld design in,
   and it is what every measurement in the README was taken at.

   WINDOW mode is what the app should actually do on a monitor. And the point
   is that scaling a 1280 layout up to 2560 buys you NOTHING -- the same seven
   creatures, the same three summarised opponents, just larger. A desktop has
   more room, and more room should buy MORE GAME:

     >= 1500 wide   the opponent seats stop being summaries and draw their
                    actual boards, because there is finally space for cards
     >= 1500 wide   the rail widens, so oracle text stops wrapping every line
     >= 1800 wide   cards step up 104 -> 124px, and the hand with them
     >= 1100 tall   lanes get their own rows back instead of sharing

   That is the same instinct `useZoomFit` already has in the client -- solve
   for the largest card that still fits -- pointed at the opposite end of the
   range. `--card-w` and `--rail-w` are the two knobs, and everything else is
   already expressed in terms of them.
------------------------------------------------------------------------- */
function fitDeck() {
  const el = document.querySelector(".deck");
  if (!el) return;
  const windowed = typeof S !== "undefined" && S.fit === "window";

  if (windowed) {
    DECK_W = Math.max(1024, innerWidth - 24);
    DECK_H = Math.max(680, innerHeight - 58);
    DECK_SCALE = 1;
    el.style.width = DECK_W + "px";
    el.style.height = DECK_H + "px";
    el.style.transform = "none";
  } else {
    DECK_W = 1280;
    DECK_H = 800;
    el.style.width = "1280px";
    el.style.height = "800px";
    DECK_SCALE = Math.min((innerWidth - 26) / 1280, (innerHeight - 76) / 800);
    DECK_SCALE = Math.max(0.3, Math.min(DECK_SCALE, 2));
    el.style.transform = `scale(${DECK_SCALE})`;
  }

  // The two knobs every layout reads. Nothing downstream needs a media query.
  const cardW = DECK_W >= 1800 ? 124 : DECK_W >= 1500 ? 114 : 104;
  const railW = DECK_W >= 1500 ? 336 : 262;
  el.style.setProperty("--card-w-board", cardW + "px");
  el.style.setProperty("--rail-w", railW + "px");
  el.dataset.wide = DECK_W >= 1500 ? "yes" : "no";
  el.dataset.tall = DECK_H >= 1100 ? "yes" : "no";

  const tag = document.querySelector(".bezel__tag");
  if (tag) {
    tag.innerHTML = windowed
      ? `Window · <b>${DECK_W}×${DECK_H}</b> · ${el.dataset.wide === "yes" ? "opponents drawn in full" : "opponents summarised"} · <b>F</b> for Deck`
      : `Steam Deck · 1280×800 · shown at <b>${Math.round(DECK_SCALE * 100)}%</b> · <b>F</b> to fit window`;
  }
}

/** A window point in Deck coordinates. */
function deckPoint(clientX, clientY) {
  const el = document.querySelector(".deck");
  if (!el) return { x: clientX, y: clientY };
  const r = el.getBoundingClientRect();
  return { x: (clientX - r.left) / DECK_SCALE, y: (clientY - r.top) / DECK_SCALE };
}

addEventListener("resize", fitDeck);
// <<< END _handheld.js >>>
</script>

<!-- The gates travel with the file: fetch() is blocked on file://, so a page
     cannot load its own checker off disk. Type HANDHELD_ASSERT() in the console. -->
<script>
// <<< BEGIN assert.js >>>
/*
 * The gates, as numbers.
 *
 * Paste into a DevTools console on any of the five, or run it through
 * `measure.py`, which drives all five and prints the README's table.
 *
 *     copy(JSON.stringify(HANDHELD_ASSERT(), null, 2))
 *
 * WHY THIS FILE EXISTS. The board round learned that `overflow: hidden` hides
 * layout failure completely -- the page reports `scrollHeight === clientHeight`
 * while the board visibly runs under the foot -- so a naive overflow check
 * passes straight through the exact bug it was written for. The lesson it drew
 * was: WHERE A VISUAL PROPERTY REDUCES TO A NUMBER, ASSERT THE NUMBER.
 *
 * This round has more of those than any earlier one, because "can you read this
 * on a 7-inch screen" and "can a thumb hit this" are both literally numbers.
 * The shipped client's own figures, measured at 1280x800 before any of this was
 * designed, are the baseline every gate is set against:
 *
 *     444 of 635 elements below 12px   ·   smallest 2.11px   ·   card width 73.6px
 */

function HANDHELD_ASSERT() {
  /* SCOPE: THE 1280x800 STAGE, NOT THE REVIEW CHROME AROUND IT.
     06 draws a bezel with the scale printed on it, and that caption is a note
     to whoever is reviewing -- it is not on the Deck's screen and holding it to
     the Deck's floor is measuring the wrong thing. Everything inside `.deck` is
     the design; everything outside it is the frame it is being shown in. */
  const ROOT = document.querySelector(".deck") || document.body;
  const FS_FLOOR = 16;      // nothing carrying information may be smaller
  const CARD_FLOOR = 96;    // any card the cursor can land on
  const HIT_FLOOR = 44;     // any focusable or tappable box
  const RING_FLOOR = 3;     // focus outline width

  const vis = (el) => {
    const s = getComputedStyle(el);
    if (s.display === "none" || s.visibility === "hidden" || +s.opacity === 0) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  };

  /* Only elements that OWN text. Walking every element counts a wrapper at its
     inherited size and reports failures that are not on screen.

     `aria-hidden` is skipped, and that is the honest line between a font-size
     floor and a font-size ban: this gate is about TEXT SOMEBODY READS. A type
     glyph on a card, the ↻ on a card with an ability, the ▲ on a staged
     attacker -- these are drawn as characters because that is cheaper than an
     SVG, but they are pictures, and every one of them is named in real type
     somewhere else on the screen. A mana pip is NOT in this set: its letter is
     the only thing telling you which mana it is, so it is held to the floor
     like any other word. The rule is that if hiding it from a screen reader
     would lose information, it is text. */
  const textOwners = [...ROOT.querySelectorAll("*")].filter((el) =>
    vis(el) &&
    !el.closest('[aria-hidden="true"]') &&
    [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim()));

  const sizes = textOwners.map((el) => ({
    px: Math.round(parseFloat(getComputedStyle(el).fontSize) * 100) / 100,
    text: el.textContent.trim().slice(0, 40),
    sel: el.className && typeof el.className === "string" ? "." + el.className.split(" ")[0] : el.tagName,
  }));

  const tooSmall = sizes.filter((s) => s.px < FS_FLOOR);

  // Every stop the cursor can reach, and every real button.
  const stops = [...ROOT.querySelectorAll("[data-stop], button")].filter(vis);
  const smallHits = stops
    .map((el) => ({ r: el.getBoundingClientRect(), sel: el.dataset.stop || el.textContent.trim().slice(0, 24) }))
    .filter((h) => h.r.width < HIT_FLOOR || h.r.height < HIT_FLOOR)
    .map((h) => ({ sel: h.sel, w: Math.round(h.r.width), h: Math.round(h.r.height) }));

  // Card width, read off a rendered face rather than off the token, because the
  // token is what the design INTENDED and the box is what the player got.
  const faces = [...ROOT.querySelectorAll(".face")].filter(vis);
  const faceW = faces.map((f) => f.getBoundingClientRect().width);
  /* The floor applies to a card that IS the identification of its object.
     `.face--thumb` marks one that sits beside its own name in real type, where
     the card is a row icon and the name is doing the work -- see faceHTML.
     Counted separately so the exemption is visible rather than invisible. */
  const reachableFaces = faces
    .filter((f) => f.closest("[data-stop]") && !f.classList.contains("face--thumb"))
    .map((f) => Math.round(f.getBoundingClientRect().width));

  // Exactly one cursor, and it is fully on screen. An offset focus ring clipped
  // by a parent is invisible focus, which is worse than none.
  const cursors = [...ROOT.querySelectorAll("[data-cursor]")];
  const cur = cursors[0];
  const curRect = cur ? cur.getBoundingClientRect() : null;
  const curOnScreen = curRect
    ? curRect.left >= -1 && curRect.top >= -1 &&
      curRect.right <= innerWidth + 1 && curRect.bottom <= innerHeight + 1
    : false;

  /* Read the STYLE as well as the width. `outline-width: 3px` with
     `outline-style: none` computes as a perfectly healthy 3, and draws nothing
     -- which is exactly what a bare `:focus { outline: none }` does to the
     cursor, and exactly what this check missed the first time it was written. */
  const ring = cur ? getComputedStyle(cur, null) : null;
  const ringStyle = ring ? ring.outlineStyle : "none";
  const ringW = ring && ringStyle !== "none" ? parseFloat(ring.outlineWidth) || 0 : 0;

  // Spill: measure the CHILDREN against the foot, never the stretched container
  // -- a grid-stretched box always ends exactly at its row edge no matter how
  // far the cards inside overflow it.
  const foot = ROOT.querySelector(".hints") || ROOT.querySelector(".foot");
  const footTop = foot ? foot.getBoundingClientRect().top : innerHeight;
  const spill = [...ROOT.querySelectorAll(".slot, .tile")]
    .filter(vis)
    .map((el) => el.getBoundingClientRect())
    .filter((r) => r.bottom > footTop + 1).length;

  // Collapse: any scrolling or flexible region silently flattened to zero.
  const collapsed = [...ROOT.querySelectorAll(".pane, .strip__b, .grid, .lane, .cat, .seats")]
    .filter((el) => getComputedStyle(el).display !== "none")
    .filter((el) => el.getBoundingClientRect().height < 1).length;

  const out = {
    screen: `${innerWidth}x${innerHeight}`,
    dpr: devicePixelRatio,

    // The gate this round exists for
    minFontPx: sizes.length ? Math.min(...sizes.map((s) => s.px)) : null,
    textNodes: sizes.length,
    belowFloor: tooSmall.length,
    belowFloorWorst: tooSmall.sort((a, b) => a.px - b.px).slice(0, 6),

    minCardPx: reachableFaces.length ? Math.min(...reachableFaces) : null,
    maxCardPx: faceW.length ? Math.round(Math.max(...faceW)) : null,
    thumbsExempted: faces.filter((f) => f.classList.contains("face--thumb")).length,

    stops: stops.length,
    smallHits: smallHits.length,
    smallHitsWorst: smallHits.slice(0, 6),

    cursors: cursors.length,
    cursorOnScreen: curOnScreen,
    ringWidthPx: ringW,
    ringStyle,

    spilledElements: spill,
    collapsedRegions: collapsed,

    // Native tooltips do not exist on a controller. The shipped client has 45.
    titleAttrs: ROOT.querySelectorAll("[title]").length,

    // Art is never drawn above ~1.25x of art_crop's native 626x457.
    oversizedArt: [...ROOT.querySelectorAll(".face__art")]
      .filter((i) => i.getBoundingClientRect().width > 780).length,

    brokenImages: [...ROOT.querySelectorAll("img")].filter((i) => i.complete && i.naturalWidth === 0).length,
    presses: typeof Pad !== "undefined" ? Pad.presses() : null,
  };

  /* NEVER TWO CURSORS, rather than always exactly one.
     Two is always a bug -- a controller UI's one unforgivable failure is the
     player not knowing which of two highlighted things they are on. Zero is a
     legitimate position and two directions here take it: 02's board has no
     resting cursor because nothing is selected until you hold L2, and 04 has no
     board to put one on. Failing them for it would be the gate enforcing 01's
     design on the other four, which is the opposite of what a round is for. So
     zero is reported and compared, not failed; the ring is only checked when
     there is a cursor to draw it on. */
  out.PASS =
    out.belowFloor === 0 &&
    (out.minCardPx === null || out.minCardPx >= CARD_FLOOR) &&
    out.smallHits === 0 &&
    out.cursors <= 1 &&
    (out.cursors === 0 || (out.cursorOnScreen && out.ringWidthPx >= RING_FLOOR)) &&
    out.spilledElements === 0 &&
    out.collapsedRegions === 0 &&
    out.titleAttrs === 0 &&
    out.oversizedArt === 0 &&
    out.brokenImages === 0;

  return out;
}

if (typeof window !== "undefined") window.HANDHELD_ASSERT = HANDHELD_ASSERT;
// <<< END assert.js >>>
</script>

<script>
/* ===========================================================================
   THE DIRECTION
   ---------------------------------------------------------------------------
   Three screens, one cursor, one set of bindings:

       stick / d-pad   move the ring        A   do the obvious thing
       Y               read what is under it  B   back
       X               abilities / dossier    L1/R1  jump zone
       View            log & zones            Menu   system

   B is back everywhere and never quits from the top. That is decided once here
   and copied into all five, so the comparison is never about who bound cancel
   where.
   ======================================================================== */

const app = document.getElementById("app");

const S = {
  screen: "decks",        // decks | board
  cur: null,              // the id of the stop the ring is on -- STATE, not DOM
  taken: "aesi",
  colours: new Set(),
  reading: null,          // oid being read, or a deck id
  dossier: null,
  popup: null,            // oid whose action popup is open
  targeting: null,        // the DECISION, once a spell is aimed
  staged: new Set(["a-atk-lev", "a-atk-aesi", "a-atk-elv"]),
  toast: null,
  ready: false,
};

/* --- The walk ------------------------------------------------------------
   Score every other stop by how far it is ALONG the pressed axis plus how far
   it drifts ACROSS it, with the drift punished. The punishment is what keeps a
   column a column when the rows below it are ragged -- without it, "down" from
   the last land lands on whatever happens to be nearest in a straight line,
   which is usually two lanes over and reads as a bug.
------------------------------------------------------------------------- */
const PERP = 2.4;

function nav(dir) {
  const cur = document.querySelector("[data-cursor]");
  const stops = [...document.querySelectorAll("[data-stop]")];
  if (!cur || stops.length < 2) return null;
  const a = cur.getBoundingClientRect();
  const ax = a.left + a.width / 2;
  const ay = a.top + a.height / 2;
  let best = null;
  let bestScore = Infinity;
  for (const el of stops) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect();
    const dx = b.left + b.width / 2 - ax;
    const dy = b.top + b.height / 2 - ay;
    const along = dir === "left" ? -dx : dir === "right" ? dx : dir === "up" ? -dy : dy;
    const perp = dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx);
    if (along <= 6) continue;               // it has to actually be that way
    const score = along + perp * PERP;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  return best;
}

function move(dir) {
  const to = nav(dir);
  if (!to) { Pad.rumble(60, 0.25); return; }
  S.cur = to.dataset.stop;
  render();
}

/* --- What A does --------------------------------------------------------- */

function confirm() {
  const id = S.cur || "";
  if (S.screen === "decks") return deckConfirm(id);
  return boardConfirm(id);
}

function deckConfirm(id) {
  if (id.startsWith("deck:")) {
    S.taken = id.slice(5);
    toast(`${DECKS.find((d) => d.id === S.taken).short} taken — press ${GLYPH.menu} to deal`);
  } else if (id.startsWith("col:")) {
    const c = id.slice(4);
    S.colours.has(c) ? S.colours.delete(c) : S.colours.add(c);
    S.cur = id;
  } else if (id === "go") {
    S.screen = "board";
    S.cur = null;
  }
  render();
}

function boardConfirm(id) {
  // Targeting is a narrowing, not a new question: the engine emits one action
  // per legal target tuple, so choosing the target IS choosing the action.
  if (S.targeting) {
    const opt = S.targeting.options.find((o) => `t:${o.id}` === id);
    if (!opt) return;
    toast(`Beast Within destroys ${opt.label}`);
    S.targeting = null;
    S.cur = null;
    return render();
  }
  if (id.startsWith("hand:")) {
    const c = byOid(+id.slice(5));
    if (!c.playable) { Pad.rumble(110, 0.5); toast(c.why); return render(); }
    if (c.n === "Beast Within") { S.targeting = DECISION; S.cur = `t:${DECISION.options[0].id}`; return render(); }
    toast(`${c.n} cast`);
    return render();
  }
  if (id.startsWith("pop:")) {
    const a = ACTIONS.find((x) => x.id === id.slice(4));
    if (a) {
      a.staged ? S.staged.delete(a.id) : S.staged.add(a.id);
      toast(a.label);
    }
    S.popup = null;
    return render();
  }
  if (id.startsWith("b:")) {
    // A on a permanent opens what it can do. One action and it just happens --
    // a menu of one is a menu you resent.
    const oid = +id.slice(2);
    const c = byOid(oid);
    const mine = actionsFor(c);
    if (!mine.length) { Pad.rumble(70, 0.3); toast(`${c.n} — nothing to do right now`); return render(); }
    if (mine.length === 1) { toast(mine[0].label); return render(); }
    S.popup = oid;
    S.cur = `pop:${mine[0].id}`;
    return render();
  }
  if (id === "commit") { toast("Attacking with 3"); return render(); }
}

function actionsFor(c) {
  return ACTIONS.filter((a) => a.src === c.n);
}

/* --- Bindings ------------------------------------------------------------ */

function bind() {
  const back = () => {
    if (S.reading !== null) S.reading = null;
    else if (S.dossier) S.dossier = null;
    else if (S.popup !== null) { S.popup = null; S.cur = `b:${S.popup}`; }
    else if (S.targeting) { S.targeting = null; toast("Beast Within back in hand"); }
    else if (S.screen === "board") { S.screen = "decks"; S.cur = null; }
    else return Pad.rumble(60, 0.25);   // B never quits from the top
    render();
  };

  Pad.start({
    up: () => move("up"), down: () => move("down"),
    left: () => move("left"), right: () => move("right"),
    a: () => { if (S.reading !== null || S.dossier) return back(); confirm(); },
    b: back,
    x: () => {
      if (S.screen === "decks") { const d = deckAt(); if (d) { S.dossier = d.id; render(); } return; }
      const c = curCard();
      if (c && c.ability) { toast(c.ability); render(); }
      else Pad.rumble(60, 0.25);
    },
    y: () => {
      if (S.screen === "decks") { const d = deckAt(); if (d) { S.dossier = d.id; render(); } return; }
      const c = curCard();
      if (c) { S.reading = c.oid; render(); }
    },
    l1: () => jump(-1), r1: () => jump(1),
    view: () => { toast("View — log, zones and the scoreboard"); render(); },
    menu: () => {
      if (S.screen === "decks") { S.screen = "board"; S.cur = null; }
      else toast("Menu — concede, settings, quit");
      render();
    },
    any: () => { if (!S.ready) { S.ready = true; render(); } paint(); },
  });
  Pad.onConnection(paint);
}

/* L1/R1 jump between zones rather than stepping. Walking from your hand to the
   opponent's board is nine presses; the bumpers make it one, and a zone is the
   unit a player actually thinks in. */
const ZONES = ["opp:lands", "opp:creatures", "my:lands", "my:creatures", "my:other", "hand"];

function jump(d) {
  const c = curCard();
  const here = c ? ZONES.indexOf(c.zone) : -1;
  const next = ZONES[(Math.max(0, here) + d + ZONES.length) % ZONES.length];
  const first = [...document.querySelectorAll("[data-stop]")]
    .find((el) => el.dataset.zone === next);
  if (first) { S.cur = first.dataset.stop; render(); } else Pad.rumble(60, 0.25);
}

function curCard() {
  const id = S.cur || "";
  const m = id.match(/^(?:b|hand):(\d+)$/);
  return m ? byOid(+m[1]) : null;
}

function deckAt() {
  const id = S.cur || "";
  return id.startsWith("deck:") ? DECKS.find((d) => d.id === id.slice(5)) : null;
}

let toastT = 0;
function toast(msg) {
  S.toast = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => { S.toast = null; render(); }, 2600);
}

/* --- Render --------------------------------------------------------------
   Rebuild markup, then put the ring back from STATE. DOM focus cannot be the
   cursor when every render destroys it -- which is exactly the trap the React
   client will hit, since `Table.tsx` re-renders on every engine push.
------------------------------------------------------------------------- */
function render() {
  app.innerHTML = (S.screen === "decks" ? deckScreen() : boardScreen()) + chrome();
  let el = S.cur && app.querySelector(`[data-stop="${CSS.escape(S.cur)}"]`);
  if (!el) el = app.querySelector("[data-stop]");
  if (el) {
    el.setAttribute("data-cursor", "");
    S.cur = el.dataset.stop;
    // The ring is drawn from state; real DOM focus is restored once, so the
    // accessibility tree still agrees with what the eye is being told.
    if (el.tabIndex >= 0) el.focus({ preventScroll: true });
  }
  paint();
}

function paint() {
  const lamp = document.getElementById("lamp");
  if (lamp) lamp.className = "lamp" + (Pad.connected() ? " lamp--on" : "");
  const n = document.getElementById("pcount");
  if (n) n.textContent = Pad.presses();
}

function chrome() {
  return `
    <div class="lamp" id="lamp"><i></i><span>${Pad.connected() ? "pad" : "kbd"} · <b id="pcount">0</b></span></div>
    ${S.ready ? "" : gate()}
    ${S.toast ? `<div class="pop" style="left:50%;bottom:70px;transform:translateX(-50%);width:auto;max-width:640px;text-align:center">${S.toast}</div>` : ""}`;
}

function gate() {
  return `<div class="gate">
    <div class="gate__pad">🎮</div>
    <h1>Press any button</h1>
    <p>Chrome hides gamepads until the page has seen a press, so nothing is connected until you make it so. A Steam Deck, or any XInput pad, or the keyboard.</p>
    <div class="keys">
      <span><b class="g">↑↓←→</b> / WASD move</span>
      <span><b class="g g--a">Enter</b> A</span>
      <span><b class="g g--b">Backspace</b> B</span>
      <span><b class="g g--x">U</b> X</span>
      <span><b class="g g--y">I</b> Y</span>
      <span><b class="g">Q</b>/<b class="g">E</b> L1/R1</span>
      <span><b class="g">Tab</b> View</span>
      <span><b class="g">\\</b> Menu</span>
    </div>
  </div>`;
}

/* --- The board ----------------------------------------------------------- */

function boardScreen() {
  const cw = 96;   // THE FLOOR. The shipped client computes 73.6px here.
  return `<div class="b" style="--cw:${cw}px">
    ${header()}
    <div class="mid">
      ${strip()}
      <div class="play">
        ${sideHTML(OPP, true)}
        ${sideHTML(ME, false)}
      </div>
    </div>
    ${handHTML()}
    ${hints()}
    ${S.popup !== null ? popupHTML() : ""}
    ${S.targeting ? targetingHTML() : ""}
    ${S.reading !== null ? readerHTML() : ""}
  </div>`;
}

function header() {
  return `<div class="hd">
    <span class="life life--opp">${OPP.life}<small>${OPP.name}</small></span>
    <div class="ph">${PHASES.map((p) => `
      <span class="ph__p${p.live ? " ph__p--live" : ""}">${p.n}</span>
      ${p.live ? `<span class="ph__s">${p.steps.map((s, i) => `<i class="${i === p.step ? "on" : ""}">${s}</i>`).join("")}</span>` : ""}
    `).join("")}</div>
    <span class="life life--me"><small>${ME.name}</small>${ME.life}</span>
  </div>`;
}

function strip() {
  return `<div class="strip">
    <div class="strip__b"><h4>Stack</h4><p>empty</p></div>
    <div class="strip__b"><h4>Your zones</h4><p>Lib ${ME.lib} · GY ${ME.gy} · Exile ${ME.exile}</p></div>
    <div class="strip__b strip__log"><h4>Log</h4>${LOG.slice(-4).map((l) => `<p>${l}</p>`).join("")}</div>
  </div>`;
}

/* ROWS, NOT LANES.
   Three lanes a side is four rows of cards, and four rows of 134px plus a hand
   does not fit in 800px next to a 96px card floor. So lanes are PACKED into
   rows that fit: an opponent's whole board is one row, and the viewer's lands
   and enchantments share one while creatures -- the row this decision is about
   -- get their own. Each lane keeps its label, so nothing about what a lane
   MEANS changes; only how many rows it costs. */
const ROWS = {
  opp: [["lands", "creatures", "other"]],
  me: [["lands", "other"], ["creatures"]],
};

function sideHTML(p, isOpp) {
  const lanes = lanesOf(p);
  const groups = (isOpp ? ROWS.opp : ROWS.me).map((ids) =>
    ids.map((id) => lanes.find((l) => l.id === id)).filter((l) => l && l.cards.length));
  return `<div class="side${isOpp ? " side--opp" : ""}">
    <div class="side__h">
      <b>${p.name}</b>
      <span>${countOf(p.lands)} lands · ${countOf(p.creatures)} creatures</span>
      <span class="meter">${p.mana.map((m) => `
        <span class="${m.open ? "" : "off"}">${costHTML(m.sym)}<b>${m.open || m.tapped}</b></span>`).join("")}</span>
    </div>
    ${groups.filter((g) => g.length).map((g) => `<div class="lane">
      ${g.map((l) => `<span class="lane__n">${l.n}</span>${l.cards.map((c) => slotHTML(c, "b")).join("")}`).join("")}
    </div>`).join("")}
  </div>`;
}

function slotHTML(c, prefix) {
  const stop = `${prefix}:${c.oid}`;
  const opt = S.targeting && S.targeting.options.find((o) => o.card && o.card.oid === c.oid);
  const dim = S.targeting && !opt;
  const staged = [...S.staged].some((id) => { const a = ACTIONS.find((x) => x.id === id); return a && a.src === c.n; });
  // While targeting, an illegal permanent carries NO stop at all -- so the ring
  // cannot reach it, rather than reaching it and being refused. A refusal you
  // have to bump into is a rule you learn by failing, and on a pad there is
  // nothing to hover over to learn it any other way.
  const reachable = S.targeting ? (opt ? `t:${opt.id}` : null) : stop;
  const here = S.cur === reachable;
  return `<div class="slot ${opt ? "is-cand" : ""} ${dim ? "dim-out" : ""}"
      ${reachable ? `data-stop="${reachable}" tabindex="0"` : ""}
      data-zone="${c.zone}">
    ${here ? `<span class="nameplate">${c.n}${c.count > 1 ? ` ×${c.count}` : ""}</span>` : ""}
    ${c.count > 1 ? `<span class="slot__fan"><i></i><i></i></span>` : ""}
    ${faceHTML(c, { tile: true, nameless: true, cls: staged ? "is-staged" : "" })}
  </div>`;
}

/* While a spell is looking for a target, the hand carries no stops at all. Half
   a modal state is worse than none: a cursor that can wander back into the hand
   mid-cast has to answer "what does A do here?" and there is no good answer. */
function handHTML() {
  return `<div class="hand">${HAND.map((c) => `
    <div class="slot ${S.targeting ? "dim-out" : ""}"
      ${S.targeting ? "" : `data-stop="hand:${c.oid}" tabindex="0"`} data-zone="hand">
      ${S.cur === `hand:${c.oid}` ? `<span class="nameplate">${c.n} ${costHTML(c.cost)}</span>` : ""}
      ${faceHTML(c, { tile: true, nameless: true, dim: !c.playable, cls: c.playable && !S.targeting ? "is-playable" : "" })}
    </div>`).join("")}</div>`;
}

/* The hint bar carries the name of whatever the ring is on. Between this and
   the plate above the focused card, exactly one card is named at any moment and
   it is always the one you are pointing at -- which is the trade the 16px floor
   forced, stated out loud rather than hidden. */
function hints() {
  const c = curCard();
  const acts = c ? actionsFor(c) : [];
  const doing = S.targeting ? "Choose target"
    : c && c.zone === "hand" ? (c.playable ? "Cast" : "Why not")
    : acts.length ? "Actions" : "Select";
  return `<div class="hints">
    ${c ? `<span class="hints__on">${c.n}${c.pt ? ` · ${c.pt}` : ""}</span>` : ""}
    <span><b class="g">${GLYPH.dpad}</b> Move</span>
    <span><b class="g g--a">A</b> ${doing}</span>
    <span><b class="g g--y">Y</b> Read</span>
    ${c && c.ability ? `<span><b class="g g--x">X</b> Ability</span>` : ""}
    <span><b class="g g--b">B</b> Back</span>
    <span class="sp"></span>
    <span><b class="g">L1</b>/<b class="g">R1</b> Zone</span>
    ${S.targeting
      ? `<button class="commit commit--quiet">Casting Beast Within</button>`
      : `<button class="commit" data-stop="commit" tabindex="0">Attack with ${S.staged.size} <b class="g g--a">A</b></button>`}
  </div>`;
}

function popupHTML() {
  const c = byOid(S.popup);
  const acts = actionsFor(c);
  return `<div class="pop" style="left:200px;bottom:190px">
    <h4>${c.n}</h4>
    ${acts.map((a) => `<div class="pop__a" data-stop="pop:${a.id}" tabindex="0">
      ${a.label}${a.staged ? `<small>staged</small>` : ""}</div>`).join("")}
  </div>`;
}

function readerHTML() {
  const c = byOid(S.reading);
  return `<div class="rd">
    ${faceHTML(c)}
    <div class="rd__x">
      <h2>${c.n}</h2>
      <div class="rd__tl">${c.tl}${c.cost ? " · " : ""}${c.cost ? costHTML(c.cost) : ""}</div>
      ${c.rules ? `<div class="rd__rules">${c.rules}</div>` : ""}
      ${c.kw ? `<div class="rd__row">${c.kw}</div>` : ""}
      ${c.pt ? `<div class="rd__row">Power / toughness <b>${c.pt}</b></div>` : ""}
      ${c.ability ? `<div class="rd__ab"><b>Activated ability.</b> ${c.ability}</div>` : ""}
      ${c.why ? `<div class="rd__why"><b>You cannot cast this.</b> ${c.why}</div>` : ""}
      <div class="rd__row"><b class="g g--b">B</b> Back</div>
    </div>
  </div>`;
}

function targetingHTML() {
  return `<div class="tg">
    <div class="tg__ask">
      Choose target permanent
      <small>Beast Within · ${S.targeting.options.length} legal · <b class="g g--b">B</b> to take it back</small>
    </div>
  </div>`;
}

/* --- Deck select --------------------------------------------------------- */

const COLS = ["W", "U", "B", "R", "G"];

function visible() {
  if (!S.colours.size) return DECKS;
  return DECKS.filter((d) => [...S.colours].every((c) => d.ci.includes(c)));
}

function deckScreen() {
  const list = visible();
  return `<div class="dk">
    <div class="dk__hd">
      <h1>Choose your commander</h1>
      <span>${list.length} of ${DECKS.length} · seat 1 of 4</span>
    </div>
    <div class="fac">
      <span class="fac__l">Colour</span>
      ${COLS.map((c) => `<div class="chip ${S.colours.has(c) ? "on" : ""}" data-stop="col:${c}" tabindex="0">${pipHTML(c)}</div>`).join("")}
      <span class="fac__l" style="margin-left:14px">Then</span>
      <div class="chip" data-stop="go" tabindex="0">Deal the pod <b class="g g--a">A</b></div>
    </div>
    <div class="grid">
      ${list.map((d) => `<div class="tile ${S.taken === d.id ? "taken" : ""}" data-stop="deck:${d.id}" tabindex="0">
        ${faceHTML({ n: d.short, cost: d.cost, tl: d.tl, t: "creature", f: "gold", pt: d.pt, art: d.art })}
        <div class="tile__x">
          <span class="tile__n">${d.short}</span>
          <span class="tile__ci">${ciHTML(d.ci)}</span>
          <span class="tile__tag">${d.tags.slice(0, 2).join(" · ")}</span>
          <span class="tile__rt">
            <span>${ratingHTML(d.ratings.speed)}</span><span>speed</span>
            <span>${ratingHTML(d.ratings.pilot)}</span><span>asks of you</span>
          </span>
        </div>
        <span class="tile__src">${d.src === "moxfield" ? "yours" : "precon"}</span>
      </div>`).join("")}
    </div>
    ${deckHints()}
    ${S.dossier ? dossierHTML() : ""}
  </div>`;
}

function deckHints() {
  return `<div class="hints">
    <span><b class="g">${GLYPH.dpad}</b> Move</span>
    <span><b class="g g--a">A</b> Take this deck</span>
    <span><b class="g g--y">Y</b> Dossier</span>
    <span><b class="g g--b">B</b> Back</span>
    <span class="sp"></span>
    <span>Taken: <b>${DECKS.find((d) => d.id === S.taken).short}</b></span>
    <span><b class="g">☰</b> Deal</span>
  </div>`;
}

function dossierHTML() {
  const d = DECKS.find((x) => x.id === S.dossier);
  return `<div class="dos">
    ${faceHTML({ n: d.n, cost: d.cost, tl: d.tl, t: "creature", f: "gold", pt: d.pt, art: d.art })}
    <div class="dos__x">
      <h2>${d.n}</h2>
      <div class="rd__tl">${d.guild} · ${d.ci.map(pipHTML).join("")} ${d.cards ? `· ${d.cards} cards, ${d.lands} lands` : "· no list in this repo yet"}</div>
      <div class="dos__s">${d.notes}</div>
      <div class="dos__r">${RATING_ROWS.map(([k, n]) => `<b>${n}</b><span>${ratingHTML(d.ratings[k])}</span>`).join("")}</div>
      <div class="rd__row"><b class="g g--b">B</b> Back <b class="g g--a" style="margin-left:12px">A</b> Take it</div>
    </div>
  </div>`;
}

bind();
render();
fitDeck();
</script>
</body>
</html>
