/* ===========================================================================
   THE POD -- four chairs, every state one can be in
   ======================================================================== */

function seatDeck(s) { return s.deck ? DECKS.find((d) => d.id === s.deck) : null; }
function lockedCount() { return S.pod.seats.filter((s) => s.locked || s.kind === "cpu").length; }
function canStart() { return S.pod.seats.every((s) => s.kind === "empty" || s.deck) && S.pod.seats[0].locked; }
function whyNot() {
  if (!S.pod.seats[0].locked) return "You have not locked in.";
  const n = S.pod.seats.filter((s) => s.kind !== "empty" && !s.deck).length;
  if (n) return `${n} seat${n > 1 ? "s" : ""} still choosing.`;
  return "Ready when you are.";
}

function podHTML() {
  const seats = S.pod.seats;
  return `<div class="scr">
    <div class="top">
      <span class="top__t"><b>The pod</b> · ${S.pod.code}</span>
      <span class="ph" style="gap:8px">
        <span class="top__t">${seats.filter((s) => s.kind !== "empty").length} of 4 seated</span>
      </span>
    </div>
    <div class="veil__b" style="padding:10px 12px 0"><div class="pod">
      <div class="seats">
        ${seats.map((s, i) => seatHTML(s, i)).join("")}
      </div>
      <div class="ready">
        <div class="ready__t">${seats.map((s) => `<i class="${s.locked || s.kind === "cpu" ? "on" : ""}"></i>`).join("")}</div>
        <span class="ready__l">${lockedCount()} of 4 locked in · ${whyNot()}</span>
        <span class="sp"></span>
        <div class="btn" data-stop="seed" tabindex="0">Seed <em>${S.pod.seed || "random"}</em></div>
        <div class="btn" data-stop="invite" tabindex="0">Invite <b class="g g--x">X</b></div>
        <div class="btn ${canStart() ? "btn--commit" : ""}" data-stop="deal" tabindex="0">
          ${canStart() ? "Deal the pod" : "Deal"} <em>${canStart() ? "" : whyNot()}</em>
        </div>
      </div>
    </div></div>
    <div class="foot">
      <span class="foot__name">${footName()}</span>
      <span><b class="g">${GLYPH.dpad}</b> Move</span>
      <span><b class="g g--a">A</b> ${podVerb()}</span>
      <span><b class="g g--y">Y</b> Read</span>
      <span><b class="g g--b">B</b> Back</span>
      <span class="sp"></span>
      <span><b class="g">L2</b> Wheel</span>
      <span><b class="g">☰</b> Tools</span>
    </div>
  </div>`;
}

function seatHTML(s, i) {
  const d = seatDeck(s);
  const you = s.kind === "you";
  const tier = s.difficulty ? DIFFICULTY.find((t) => t.id === s.difficulty) : null;
  if (s.kind === "empty") {
    return `<div class="seat">
      <div class="seat__h">Chair ${i + 1}<em>empty</em></div>
      <div class="seat__empty">
        <div class="seat__ghost">☗</div>
        <div>Nobody here yet</div>
        <div class="btn" data-stop="seat:${i}:cpu" tabindex="0">Add a CPU <b class="g g--a">A</b></div>
        <div class="btn" data-stop="seat:${i}:open" tabindex="0">Open the chair</div>
      </div>
    </div>`;
  }
  return `<div class="seat ${you ? "seat--you" : ""} ${s.locked ? "seat--lock" : ""}">
    <div class="seat__h">${s.who}<em>${s.locked ? `<span class="seat__lock">✓ locked in</span>` : you ? "you" : s.kind === "cpu" ? "CPU" : "player"}</em></div>
    <div class="seat__card">${d ? faceHTML(cmdOf(d), { tile: true, nameless: true }) : `<div class="face face--empty" style="--card-w:128px"></div>`}</div>
    <div class="seat__deck">
      <b>${d ? d.short : "no deck"}</b>
      <span>${d ? d.ci.map(symHTML).join("") : ""} ${d ? d.guild : "choose one"}</span>
    </div>
    ${d ? `<div class="seat__tags">${d.tags.slice(0, 3).map((t) => `<i>${t}</i>`).join("")}</div>
      <div class="seat__r">
        <span>${ratingHTML(d.ratings.speed)}</span><span>speed</span>
        <span>${ratingHTML(d.ratings.pilot)}</span><span>asks of you</span>
      </div>` : ""}
    <div class="seat__ctrls">
      <div class="btn" data-stop="seat:${i}:deck" tabindex="0">${d ? "Change deck" : "Choose a deck"} <em>${GLYPH.a}</em></div>
      ${s.kind === "cpu" ? `<div class="btn" data-stop="seat:${i}:diff" tabindex="0">${tier.n} <em>${tier.caps.length}/3</em></div>` : ""}
      ${you
        ? `<div class="btn ${s.locked ? "" : "btn--go"}" data-stop="seat:${i}:lock" tabindex="0">${s.locked ? "Unlock" : "Lock in"} <em></em></div>`
        : `<div class="btn" data-stop="seat:${i}:clear" tabindex="0">Empty the chair</div>`}
    </div>
  </div>`;
}

function podVerb() {
  const id = S.cur || "";
  if (id.endsWith(":deck")) return "Choose a deck";
  if (id.endsWith(":diff")) return "Next difficulty";
  if (id.endsWith(":lock")) return S.pod.seats[0].locked ? "Unlock" : "Lock in";
  if (id.endsWith(":clear")) return "Empty it";
  if (id.endsWith(":cpu")) return "Add a CPU";
  if (id.endsWith(":open")) return "Open it";
  if (id === "deal") return "Deal";
  if (id === "invite") return "Invite";
  if (id === "seed") return "Set a seed";
  return "Choose";
}

function podPress(id) {
  if (id === "deal") {
    if (!canStart()) { Pad.rumble(130, 0.5); toast(whyNot()); return render(); }
    S.screen = "board";
    // THE FIRST DECISION OF ANY GAME IS THE OPENING HAND, and dealing straight
    // onto a turn-8 board skipped it. `mulligan` is one of the eleven kinds and
    // the reel already renders it -- so the deal now opens on the question the
    // engine would really ask first, with the seven cards drawn as seven cards.
    S.overlay = "question";
    S.question = QUESTIONS.mulligan;
    S.qi = 0;
    S.cur = null;
    return render();
  }
  if (id === "invite") { cue("ui.open"); S.overlay = "invite"; return render(); }
  if (id === "seed") { S.pod.seed = S.pod.seed ? "" : "aesi-8813"; toast(S.pod.seed ? "Seed set — this pod is reproducible" : "Seed cleared"); return render(); }
  const m = id.match(/^seat:(\d+):(\w+)$/);
  if (!m) return;
  const i = +m[1];
  const s = S.pod.seats[i];
  const what = m[2];
  if (what === "deck") {
    S.catalogFor = i;
    S.screen = "catalog";
    S.cur = `deck:${visibleDecks()[0].id}`;
    return render();
  }
  if (what === "diff") {
    const k = DIFFICULTY.findIndex((t) => t.id === s.difficulty);
    s.difficulty = DIFFICULTY[(k + 1) % DIFFICULTY.length].id;
    s.who = DIFFICULTY.find((t) => t.id === s.difficulty).n;
    toast(`${s.who} — ${DIFFICULTY.find((t) => t.id === s.difficulty).line}`);
    return render();
  }
  if (what === "lock") { s.locked = !s.locked; toast(s.locked ? "Locked in" : "Unlocked — you can change your deck again"); return render(); }
  if (what === "clear") { S.pod.seats[i] = { kind: "empty", who: null, deck: null, locked: false }; toast("Chair emptied"); return render(); }
  if (what === "cpu") { S.pod.seats[i] = { kind: "cpu", who: "Apprentice", deck: "krenko", difficulty: "apprentice", locked: true }; toast("Apprentice sat down"); return render(); }
  if (what === "open") { S.pod.seats[i] = { kind: "human", who: "Open chair", deck: null, locked: false }; toast("Chair opened — share the code"); return render(); }
}

/* ===========================================================================
   THE CATALOGUE
   ======================================================================== */

const COLS = ["W", "U", "B", "R", "G"];
const SOURCES = [["all", "All"], ["precon", "Precons"], ["moxfield", "Yours"]];
const SORTS = [["name", "Name"], ["speed", "Fastest"], ["complexity", "Most complex"], ["pilot", "Easiest to pilot"]];

function visibleDecks() {
  let list = DECKS.slice();
  if (S.colours.size) list = list.filter((d) => [...S.colours].every((c) => d.ci.includes(c)));
  if (S.source !== "all") list = list.filter((d) => d.src === S.source);
  if (S.search) list = list.filter((d) => (d.n + d.tags.join(" ")).toLowerCase().includes(S.search.toLowerCase()));
  if (S.sort === "speed") list.sort((a, b) => b.ratings.speed - a.ratings.speed);
  else if (S.sort === "complexity") list.sort((a, b) => b.ratings.complexity - a.ratings.complexity);
  else if (S.sort === "pilot") list.sort((a, b) => a.ratings.pilot - b.ratings.pilot);
  else list.sort((a, b) => a.short.localeCompare(b.short));
  return list;
}

function catalogHTML() {
  const list = visibleDecks();
  const seat = S.pod.seats[S.catalogFor];
  return `<div class="scr">
    <div class="top">
      <span class="top__t"><b>Choose a deck</b> · for ${seat.kind === "you" ? "your seat" : seat.who}</span>
      <span class="ph"><span class="top__t">${list.length} of ${DECKS.length}</span></span>
    </div>
    <div class="veil__b" style="padding:10px 12px 0;display:flex;flex-direction:column">
      <div class="facets">
        <div class="search" data-stop="search" tabindex="0">Search <b>${S.search || ""}</b><span class="car"></span></div>
        <span class="facets__l">Colour</span>
        ${COLS.map((c) => `<div class="chip ${S.colours.has(c) ? "on" : ""}" data-stop="col:${c}" tabindex="0">${symHTML(c)}</div>`).join("")}
        <span class="facets__l">Source</span>
        ${SOURCES.map(([k, n]) => `<div class="chip ${S.source === k ? "on" : ""}" data-stop="src:${k}" tabindex="0">${n}</div>`).join("")}
        <div class="chip" data-stop="sort" tabindex="0">${SORTS.find((s) => s[0] === S.sort)[1]} <b class="g">R1</b></div>
        <div class="chip" data-stop="import" tabindex="0">Import from Moxfield</div>
      </div>
      <div style="flex:1;min-height:0"><div class="cat">
        ${list.map((d) => `<div class="tile ${seat.deck === d.id ? "taken" : ""}" data-stop="deck:${d.id}" tabindex="0">
          ${faceHTML(cmdOf(d), { tile: true, nameless: true })}
          <div class="tile__x">
            <span class="tile__n">${d.short}</span>
            <span class="tile__ci">${d.ci.map(symHTML).join("")}</span>
            <span class="tile__t">${d.tags.slice(0, 2).join(" · ")}</span>
            <span class="tile__r">${ratingHTML(d.ratings.speed)} speed</span>
          </div>
          <span class="tile__src">${d.src === "moxfield" ? "yours" : "precon"}</span>
        </div>`).join("")}
      </div></div>
    </div>
    <div class="foot">
      <span class="foot__name">${footName()}</span>
      <span><b class="g">${GLYPH.dpad}</b> Move</span>
      <span><b class="g g--a">A</b> Take it</span>
      <span><b class="g g--x">X</b> Dossier</span>
      <span><b class="g g--y">Y</b> Read</span>
      <span><b class="g g--b">B</b> Back</span>
      <span class="sp"></span>
      <span><b class="g">R1</b> Sort</span>
    </div>
  </div>`;
}

function catalogPress(id) {
  if (id.startsWith("deck:")) { takeDeck(id.slice(5)); return render(); }
  if (id.startsWith("col:")) { const c = id.slice(4); S.colours.has(c) ? S.colours.delete(c) : S.colours.add(c); return render(); }
  if (id.startsWith("src:")) { S.source = id.slice(4); return render(); }
  if (id === "sort") return page(1);
  if (id === "search") { S.search = S.search ? "" : "token"; toast(S.search ? `Searching for "token"` : "Search cleared"); return render(); }
  if (id === "import") { S.overlay = "import"; S.importStep = 0; return render(); }
}

function takeDeck(deckId) {
  const seat = S.pod.seats[S.catalogFor];
  seat.deck = deckId;
  const d = DECKS.find((x) => x.id === deckId);
  toast(`${d.short} — ${seat.kind === "you" ? "yours" : seat.who + "'s"}`);
  S.screen = "pod";
  S.cur = `seat:${S.catalogFor}:deck`;
}

/* ===========================================================================
   THE BOARD
   ======================================================================== */

/* LANE ORDER IS THE CLIENT'S, AND THE CLIENT'S IS THE TABLE'S.
   `logic/zoneGrouping.ts` declares `LANES = ["Creatures", "Artifacts &
   Enchantments", "Lands"]` -- top to bottom for the viewer, with the hand under
   the lot. That is not a filing order, it is the geometry of playing: lands sit
   next to the hand you play them from, and creatures sit forward, on the line
   combat is declared across. I had it upside down, which put my creatures
   against my own hand and my lands facing the enemy. */
const MY_ROWS = [["creatures"], ["other", "lands"]];

/* Opponents are MIRRORED, so their lands are furthest from you and their
   creatures nearest -- the two creature rows end up facing each other across
   the middle, which is the whole point of the arrangement. */
const OPP_ROWS = [["lands", "other"], ["creatures"]];

/* One place decides what the game is asking, and the ask line, the commit slab
   and the foot's verb all read it. Three copies of this sentence is how they
   drift apart. */
function ask() {
  if (S.paying) {
    const left = S.paying.need - S.paying.picked.length;
    return {
      title: `Tap for ${S.paying.card.n}`,
      sub: `${costHTML(S.paying.card.cost)} · ${left} more to pay · ${GLYPH.b} takes it back`,
      commit: null, dmg: 0,
    };
  }
  if (S.targeting) {
    return { title: "Choose a target", sub: `Beast Within · ${S.targeting.options.length} legal · ${GLYPH.b} takes it back`,
             commit: null, dmg: 0 };
  }
  if (S.phase === "main2") {
    const open = ME.mana.reduce((n, m) => n + (m.open || 0), 0);
    const can = HAND.filter(castableNow).length;
    return {
      title: "Your second main phase",
      sub: `${open} mana open · ${can} card${can === 1 ? "" : "s"} you can cast`,
      commit: "End the turn", dmg: 0,
    };
  }
  if (S.phase === "blockers") {
    const n = Object.keys(S.blocks).length;
    const inc = EDGAR_ATTACK.reduce((k, a) => k + (S.blocks[a.n] ? 0 : a.power), 0);
    return {
      title: "Declare blockers",
      sub: `Edgar attacks with ${EDGAR_ATTACK.length} · ${n} blocked · ${inc} would get through`,
      commit: n ? `Block with ${n}` : "Take it all",
      dmg: 0, incoming: inc,
    };
  }
  const n = S.staged.size;
  const spare = ME.creatures.filter((c) => !c.sick).reduce((k, c) => k + (c.count || 1), 0) - n;
  return {
    title: "Declare attackers",
    sub: n
      ? `${n} staged${spare > 0 ? `, ${spare} more can go` : ""} · ${GLYPH.x} re-aims one`
      : "nothing staged yet",
    commit: n ? `Attack with ${n}` : "No attacks",
    dmg: n ? stagedDamage() : 0,
  };
}

/* Edgar's attack, on his turn. Falkenrath Noble flies and you own nothing with
   flying or reach -- so the board has to SAY it is unblockable rather than let
   you find out by trying all five of your creatures on it. */
const EDGAR_ATTACK = [
  { n: "Falkenrath Noble", power: 2, flying: true },
  { n: "Vampire", power: 1, flying: false },
];

const attackerCard = (n) => OPP.creatures.find((c) => c.n === n);
const myBlockers = () => ME.creatures.filter((c) => !c.sick && !c.tapped && !S.staged.has(stagedIdFor(c)));
function stagedIdFor(c) {
  const a = ACTIONS.find((x) => x.src === c.n);
  return a ? a.id : "";
}
const canBlock = (att) => !att.flying;   // nothing you own flies or reaches

/* Floating numerals, queued and drained by the renderer. */
function fx(text, kind, el) {
  const box = el ? deckRect(el.getBoundingClientRect()) : { left: 640, right: 640, top: 300, bottom: 300 };
  S.fx.push({ text, kind, x: (box.left + box.right) / 2, y: box.top, id: Math.round(performance.now() * 1000) % 1e9 + S.fx.length });
  render();
  setTimeout(() => { S.fx = S.fx.filter((f) => f.text !== text || f.kind !== kind); render(); }, 1150);
}

function boardHTML() {
  ASK = ask();
  WIDE = document.querySelector('.deck')?.dataset.wide === 'yes';
  return `<div class="scr">
    ${topHTML()}
    <div class="body">
      <div class="main">
        <div class="spine ${S.targeting ? "spine--cand" : ""}">${
          S.targeting ? candidateBandHTML() : TABLE.slice(1).map((p, i) => orbHTML(p, i + 1)).join("")
        }</div>
        ${S.phase === "blockers" ? blockersHTML() : myBoardHTML()}
        ${handHTML()}
      </div>
      ${railHTML()}
    </div>
    ${footHTML()}
    <svg class="arrows" id="arrows"></svg>
    ${fxHTML()}
    ${S.between ? betweenHTML() : ""}
  </div>`;
}

/* WHERE THE TURN ACTUALLY IS.
   The track was a still life: it said "Combat — Attackers" through the second
   main phase and through the opponent's whole turn. A phase track that does not
   track is worse than none, because it is confidently wrong. */
const PHASE_AT = {
  attackers: { i: 2, n: "Combat", step: "Declare attackers", mine: true },
  main2:     { i: 3, n: "Main 2", step: "Your second main", mine: true },
  blockers:  { i: 2, n: "Combat", step: "Declare blockers", mine: false },
};

function topHTML() {
  const at = PHASE_AT[S.phase] || PHASE_AT.attackers;
  return `<div class="top">
    <span class="top__t">Turn <b>${S.turn}</b> · round ${Math.ceil(S.turn / 3)}</span>
    <span class="top__t" style="color:${at.mine ? "var(--playable)" : "var(--attacking)"}">
      <b>${at.mine ? "Your turn" : "Edgar's turn"}</b></span>
    <div class="ph">
      ${PHASES.map((p, i) => `<span class="ph__seg ${i < at.i ? "ph__seg--done" : ""} ${i === at.i ? "ph__seg--live" : ""}"></span>`).join("")}
      <span class="ph__now">${at.n}<em> — ${at.step}</em></span>
    </div>
  </div>`;
}

/* An opponent, compressed to what you can READ. Board round 03's spine idea,
   with the mana meter from round 03 of the board exploration: one entry per
   SOURCE, not per symbol, because Scoured Barrens makes W or B and counting it
   twice claims mana that does not exist. */
/* WHAT A SEAT IS WORTH, WHEN YOU ARE DECIDING WHETHER TO ATTACK IT.
 *
 * The orb used to carry ten facts: life, commander damage, creature count,
 * untapped count, power, fliers, every mana source, library, hand and
 * graveyard. On 330px of a 7-inch screen that is a paragraph, and a paragraph
 * is not something you glance at.
 *
 * Three of those decide the attack and the rest do not:
 *
 *   CAN THEY BLOCK IT      untapped creatures, total power, fliers
 *   CAN THEY ANSWER IT     open mana, and cards in hand
 *   IS IT WORTH IT         life, and how close your commander is to 21
 *
 * Library and graveyard counts decide nothing during combat and cost a whole
 * line, so they moved to the zone browser -- which is where you go when you
 * actually want them, and which now has a reason to exist. Total creature
 * count went too: what matters is how many can BLOCK, and that is the untapped
 * number sitting right next to it.
 */
function orbHTML(p, idx) {
  const cr = p.creatures;
  const untapped = cr.filter((c) => !c.tapped).reduce((n, c) => n + (c.count || 1), 0);
  const power = cr.reduce((n, c) => n + (parseInt(c.pt) || 0) * (c.count || 1), 0);
  const fliers = cr.filter((c) => (c.kw || "").includes("Flying")).length;
  const cd = p.cmdDamage && p.cmdDamage.length ? p.cmdDamage[0] : null;
  const open = p.mana.reduce((n, m) => n + (m.open || 0), 0);
  return `<div class="orb" data-stop="orb:${idx}" data-zone="spine" tabindex="0">
    ${p.priority ? `<span class="orb__dot"></span>` : ""}
    <div class="orb__cmd">
      ${ART(p.cmdr.art) ? `<img src="${ART(p.cmdr.art)}" alt="">` : ""}
      ${p.tax ? `<i>+${p.tax}</i>` : ""}
    </div>
    <div class="orb__x">
      <div class="orb__n">${p.name}<em>${p.cpu ? p.cpu : "player"}</em>
        <span class="orb__life"><b>${p.life}</b></span></div>
      <div class="orb__block">
        <b>${untapped}</b> can block · <b>${power}</b> power${fliers ? ` · <b>${fliers}</b> flying` : ""}
      </div>
      <div class="orb__row">
        <span class="orb__mana">${p.mana.map((m) => `<span class="${m.open ? "" : "off"}">${producesHTML(m.sym)}<b>${m.open || m.tapped || 0}</b></span>`).join("")}</span>
        <span class="orb__hold">${open ? `${open} open` : "tapped out"} · ${p.hand} in hand</span>
      </div>
      ${cd ? `<span class="cdmg cdmg--out">⚔ <b>${cd.n}</b> of 21</span>` : ""}
      ${WIDE ? oppMiniHTML(p) : ""}
    </div>
  </div>`;
}

/* On a wide screen a seat can afford its own creatures, so the summary line
   above it becomes a caption for something you can actually look at. */
function oppMiniHTML(p) {
  const cards = p.creatures;
  if (!cards.length) return "";
  return `<div class="oppmini">
    ${cards.map((c) => faceHTML(c, { tile: true, nameless: true })).join("")}
  </div>`;
}

/* THE SPINE OPENS WHEN IT MATTERS.
 *
 * Found by driving this, not by looking at it: with the opponents compressed to
 * summaries, five of Beast Within's six legal targets had NOWHERE TO BE. The
 * ring could reach the one candidate on my own board and nothing else, which is
 * not a rough edge -- it is the direction failing to play the game.
 *
 * The fix is the one the spine was always implying: a summary is what an
 * opponent's board is worth WHEN NOTHING IS ASKING ABOUT IT. The moment
 * something is, the summary gives way to the cards the question is about. So
 * during targeting the three orbs are replaced by every legal target their
 * seats own, at full size, in the same place their seats were -- and my own
 * board's candidates stay exactly where they already are.
 *
 * That also keeps the two halves of a target list in the two places a player
 * expects: theirs up there, mine down here.
 */
function candidateBandHTML() {
  const theirs = S.targeting.options.filter((o) => !o.mine);
  return `<div class="candband">
    <span class="candband__l">Their permanents<em>${theirs.length} you can hit</em></span>
    ${theirs.map((o) => `<div class="slot is-cand" data-stop="t:${o.id}" data-zone="spine" tabindex="0">
      ${faceHTML(o.card, { tile: true, nameless: true })}
      <span class="candband__n">${o.label}</span>
    </div>`).join("")}
  </div>`;
}

function myBoardHTML() {
  const lanes = lanesOf(ME);
  const groups = MY_ROWS.map((ids) => ids.map((id) => lanes.find((l) => l.id === id)).filter((l) => l && l.cards.length));
  const open = ME.mana.reduce((n, m) => n + (m.open || 0), 0);
  return `<div class="mine">
    <div class="mine__h">
      <span class="mine__ask"><b>${ASK.title}</b><span>${ASK.sub}</span></span>
      <span style="flex:1"></span>
      ${ME.cmdDamage.length ? `<span class="cdmg cdmg--in">☠ <b>${ME.cmdDamage[0].n}</b> of 21 · ${ME.cmdDamage[0].from.split(",")[0]}</span>` : ""}
      <span class="mine__mana">${ME.mana.map((m) => `<span class="${m.open ? "" : "off"}">${producesHTML(m.sym)}<b>${m.open}</b></span>`).join("")}</span>
      <span class="life">${S.life.me}<em>life</em></span>
    </div>
    ${groups.map((g) => `<div class="lane">
      ${g.map((l) => `<span class="lane__n">${l.n}</span>${l.cards.map((c) => slotHTML(c, "b", `my:${l.id}`)).join("")}`).join("")}
    </div>`).join("")}
  </div>`;
}

function slotHTML(c, prefix, zone) {
  if (S.paying) {
    const payable = zone === "my:lands" && c.land && tapsLeft(c) > 0;
    const used = S.paying.picked.filter((o) => o === c.oid).length;
    return `<div class="slot ${payable ? "is-cand" : "dim-out"}"
        ${payable ? `data-stop="pay:${c.oid}" tabindex="0"` : ""} data-zone="${zone}">
      ${used ? `<span class="paid">${used}</span>` : ""}
      ${faceHTML(c, { tile: true, nameless: true })}
    </div>`;
  }
  const opt = S.targeting && S.targeting.options.find((o) => o.card && o.card.oid === c.oid);
  const dim = S.targeting && !opt;
  const staged = [...S.staged].some((id) => { const a = ACTIONS.find((x) => x.id === id); return a && a.src === c.n; });
  const reachable = S.targeting ? (opt ? `t:${opt.id}` : null) : `${prefix}:${c.oid}`;
  const here = S.cur === reachable;
  return `<div class="slot ${opt ? "is-cand" : ""} ${dim ? "dim-out" : ""}"
      ${reachable ? `data-stop="${reachable}" tabindex="0"` : ""} data-zone="${zone}">
    ${c.count > 1 ? `<span class="slot__fan"><i></i><i></i></span>` : ""}
    ${faceHTML(c, { tile: true, nameless: true, cls: staged ? "is-staged" : "" })}
  </div>`;
}

/* WHAT YOU CAN CAST DEPENDS ON THE STEP, AND THE HAND HAS TO SAY SO.
   During your second main every sorcery-speed card comes back and the hand
   turns green -- which is the clearest possible demonstration that the client
   knows what step it is on. During somebody else's combat only instants are
   live, so it goes mostly grey again. `castableNow` is the one place that
   decides, and it is the client's `unplayable_reason` in miniature. */
function castableNow(c) {
  if (S.targeting) return false;
  if (S.phase === "main2") return true;                    // sorcery speed is open
  return c.t === "instant";                                // otherwise instants only
}

function handHTML() {
  const n = HAND.filter(castableNow).length;
  return `<div class="hand">
    <span class="hand__l">Hand<em>${HAND.length} · ${n} castable</em></span>
    ${HAND.map((c) => {
      const live = castableNow(c);
      // The hand stands down while a spell is mid-cast, the same way it does
      // while one is looking for a target: half a modal state is worse than
      // none, and a ring that can wander back into the hand while you are
      // paying for a card has to answer "what does A do here?".
      const busy = S.targeting || S.paying;
      return `<div class="slot ${busy ? "dim-out" : ""}"
        ${busy ? "" : `data-stop="hand:${c.oid}" tabindex="0"`} data-zone="hand">
        ${faceHTML(c, { tile: true, nameless: true, dim: !live || busy, cls: live && !busy ? "is-playable" : "" })}
      </div>`;
    }).join("")}</div>`;
}

/* The rail: the stack when there is one, then the card under the ring. This is
   the shipped client's preview rail, driven by focus instead of by hover --
   which is the whole of the port for the five things hover owns today. */
/* THE VERB COMES FROM THE ACTION'S KIND, NOT FROM WHERE THE CARD IS.
   Caught by driving: the ring on Terramorphic Expanse offered "Send at Edgar",
   because the code assumed a permanent with an action is a creature with an
   attack. It is a LAND. `LegalAction.kind` is the thing that knows -- the
   engine sends it, and the shipped client's whole action space is built on it,
   so reading it here is what the port would do anyway. */
function actionsFor(card) {
  return ACTIONS.filter((a) => a.src === card.n);
}

function actionVerb(a) {
  if (!a) return null;
  if (a.kind === "activate") return a.staged ? "Cancel" : "Activate";
  if (a.kind === "add_attacker") {
    return a.staged ? "Call back" : `Send at ${TABLE[aimOf(a.id)].name.split(" ")[0]}`;
  }
  return a.label;
}

/* The half-sentence after the commit verb, which is different in every phase
   and was hard-coded to "→ Edgar" in all of them. */
function commitTail() {
  if (S.phase === "main2") return "";
  if (S.phase === "blockers") return ASK.incoming ? `· ${ASK.incoming} gets through` : "· nothing gets through";
  const by = damageBySeat();
  const seats = Object.keys(by);
  if (!seats.length) return "";
  // One seat names it; several count them, because "→ Edgar · 13 dmg" over an
  // attack split across two opponents is a confident lie.
  if (seats.length === 1) return `→ ${TABLE[seats[0]].name.split(" ")[0]} · ${by[seats[0]]} dmg`;
  return `→ ${seats.map((i) => `${TABLE[i].name.split(" ")[0]} ${by[i]}`).join(", ")}`;
}

function boardVerb() {
  const id = S.cur || "";
  if (S.paying) return "Tap this land";
  if (S.targeting) return "Choose target";
  if (id === "commit") return ASK.commit || "Confirm";
  if (id.startsWith("orb:")) return `Look at ${TABLE[+id.slice(4)].name}`;
  // During THEIR combat every creature of yours is a potential blocker, and
  // "Send at Edgar" on one of them -- which is what it used to say -- is not
  // just wrong, it is an illegal action offered as the primary one.
  if (id.startsWith("blk:")) {
    const [, att, oid] = id.split(":");
    return S.blocks[att] === +oid ? `Stop blocking` : `Block ${att}`;
  }
  if (id.startsWith("pay:")) return payWith(+id.slice(4));
  if (id.startsWith("stk:")) {
    const top = STACK[0];
    return top && `stk:${top.sid}` === id ? "Let it resolve" : "Not the top";
  }
  const c = curCard();
  if (!c) return "Select";
  if (c.zone === "hand") return castableNow(c) ? "Cast" : "Why not";
  return actionVerb(actionsFor(c)[0]) || "Nothing to do";
}

/* Blocking maths, which is a different question from attacking maths and was
   being answered with the wrong one. What you want to know before you throw a
   creature in front of something is: does it die, does the attacker die, and
   what still gets through. */
function blockMath(c) {
  const id = S.cur || "";
  const m = id.match(/^blk:(.+):(\d+)$/);
  if (!m) return "";
  const att = EDGAR_ATTACK.find((a) => a.n === m[1]);
  const card = attackerCard(m[1]);
  if (!att || !card) return "";
  const myPow = parseInt(c.pt) || 0;
  const myTou = parseInt((c.pt || "0/0").split("/")[1]) || 0;
  const attTou = parseInt((card.pt || "0/0").split("/")[1]) || 0;
  const iDie = att.power >= myTou;
  const itDies = myPow >= attTou;
  return `<div class="readp__math">
    Blocks <b>${att.n}</b> — ${att.power}/${attTou} against your ${c.pt}.<br>
    ${itDies ? `<b>${att.n} dies.</b> ` : `${att.n} survives. `}
    ${iDie ? `<b>${c.n} dies.</b>` : `${c.n} survives.`}
  </div>`;
}

/* THE STACK IS THE LAST STATIC THING ON THE BOARD.
 *
 * It was a list. A list is what a stack looks like; it is not what a stack IS.
 * The rule that makes Magic hard to learn is LAST IN, FIRST OUT, and no amount
 * of labelling teaches it as well as watching the top item leave first.
 *
 * So the stack is a place the ring can go, and pressing A resolves the top item
 * -- it flashes, flies to wherever it is aimed, and the one underneath becomes
 * the top. The order is visible because you watch it happen.
 *
 * `priority` is the decision the engine is really asking while anything is on
 * the stack, so "let it resolve" is exactly the `pass` action, and this is what
 * that action looks like when it is not a button in a list.
 */
function resolveTop() {
  if (!STACK.length) return;
  const item = STACK[0];               // STACK is stored top-first

  const el = app.querySelector(`[data-stop="stk:${item.sid}"]`);
  const target = item.targets && item.targets !== "each opponent"
    ? app.querySelector('[data-stop^="b:"]')
    : app.querySelector('[data-stop="orb:1"]');

  pushUndo(`resolve ${item.name}`);
  cue("stack.resolve");
  LOG.push(`${item.name} resolves${item.targets ? ` — ${item.targets}` : ""}`);
  Pad.rumble(55, 0.3);
  if (el && item.card) {
    fxFly(faceHTML(item.card, { tile: true, nameless: true }), el, target || el, ms(420) || 1, () => {
      fxBurst(target || el, "var(--astral-hi)");
      fxShake(false);
    });
  }
  beat(reduced() ? 0 : ms(460), () => {
    STACK.shift();
    toast(STACK.length
      ? `${item.name} resolves — ${STACK[0].name} is next`
      : `${item.name} resolves — the stack is empty`);
    S.cur = STACK.length ? `stk:${STACK[0].sid}` : null;
    render();
  });
}

function railHTML() {
  return `<div class="rail" id="rail">${railInner()}</div>`;
}

function railInner() {
  // The ring can be on a SEAT as well as on a card, and a seat has a card worth
  // reading -- its commander. Leaving the rail on its placeholder while the ring
  // sat on Edgar Markov was the rail refusing to answer a question it could.
  const id = S.cur || "";
  const c = curCard()
    || (id.startsWith("orb:") ? TABLE[+id.slice(4)].cmdr : null)
    || (id.startsWith("t:") && S.targeting
        ? (S.targeting.options.find((o) => `t:${o.id}` === id) || {}).card : null);
  return `
    ${STACK.length ? `<div class="stackp">
      <h4>Stack · ${STACK.length} <em>last in, first out</em></h4>
      ${STACK.map((s, i) => `<div class="stackp__i ${i === 0 ? "stackp__i--top" : ""}"
          data-stop="stk:${s.sid}" data-zone="stack" tabindex="0">
        ${s.card ? faceHTML(s.card, { tile: true, nameless: true, thumb: true }) : ""}
        <div class="stackp__x">
          <b>${s.name}</b>
          <span>${s.controller}${s.targets ? ` → ${s.targets}` : ""}</span>
          ${i === 0 ? `<i class="stackp__next">resolves next</i>` : ""}
        </div>
      </div>`).join("")}
    </div>` : ""}
    <div class="readp">
      ${c ? readpHTML(c) : `<div class="readp__empty">Move the ring over anything to read it here.<br><br>
        <b class="g g--y">Y</b> opens it full size.<br>
        <b class="g">L2</b> is zones, log and tools.<br>
        <b class="g">R2</b> zooms into a seat.</div>`}
    </div>`;
}

/* What this permanent is doing, and what sending it would do. */
function statusChips(c) {
  const out = [];
  const staged = [...S.staged].some((id) => { const a = ACTIONS.find((x) => x.id === id); return a && a.src === c.n; });
  if (staged) {
    const a = ACTIONS.find((x) => x.src === c.n && x.kind === "add_attacker");
    out.push(`<span class="chip2 chip2--atk">▲ attacking ${TABLE[aimOf(a.id)].name}</span>`);
  }
  if (c.sick) out.push(`<span class="chip2 chip2--sick">summoning sick</span>`);
  if (c.tapped) out.push(`<span class="chip2">tapped</span>`);
  if (c.token) out.push(`<span class="chip2">token</span>`);
  if (c.cmd) out.push(`<span class="chip2 chip2--kw">your commander</span>`);
  (c.kw || "").split(",").map((k) => k.trim()).filter(Boolean)
    .forEach((k) => out.push(`<span class="chip2 chip2--kw">${k}</span>`));
  return out.join("");
}

/* Combat math, which is the entire question at declare-attackers and was not
   anywhere on the board. Edgar has 2 untapped blockers and 4 power; whether a
   7/7 gets through is the thing you are trying to work out. */
function combatMath(c) {
  if (c.zone === "hand" || c.t !== "creature") return "";
  if (c.sick) return `<div class="readp__math">Cannot attack — it came down this turn.</div>`;
  const a = ACTIONS.find((x) => x.src === c.n && x.kind === "add_attacker");
  const seat = TABLE[a ? aimOf(a.id) : defaultTarget()];
  const pow = parseInt(c.pt) || 0;
  const flying = (c.kw || "").includes("Flying");
  const canBlock = flying
    ? seat.creatures.filter((x) => !x.tapped && (x.kw || "").includes("Flying")).length
    : seat.creatures.filter((x) => !x.tapped).reduce((n, x) => n + (x.count || 1), 0);
  return `<div class="readp__math">
    Unblocked it deals <b>${pow}</b> to ${seat.name} — that is <b>${Math.max(0, seat.life - pow)}</b> life left.<br>
    ${canBlock ? `<b>${canBlock}</b> of their creatures can block it.` : `Nothing they have can block it.`}
  </div>`;
}

function readpHTML(c) {
  const ab = c.ability ? splitAbility(c.ability) : null;
  const acts = actionsFor(c);
  const a = acts[0];
  const chips = statusChips(c);
  return `
    ${faceHTML(c, { tile: true, nameless: true })}
    <div class="readp__n">${c.n}${c.count > 1 ? ` ×${c.count}` : ""}</div>
    <div class="readp__tl">${c.tl}${c.pt ? ` · <b style="color:var(--text)">${c.pt}</b>` : ""}${c.cost ? ` · ${costHTML(c.cost)}` : ""}${c.land ? ` · taps for ${producesHTML(c.land)}` : ""}</div>
    ${chips ? `<div class="readp__chips">${chips}</div>` : ""}
    ${c.rules ? `<div class="readp__r">${textHTML(c.rules)}</div>` : ""}
    ${ab ? `<div class="readp__ab"><b>${textHTML(ab.cost)}</b> ${textHTML(ab.effect)}</div>` : ""}
    ${c.why ? `<div class="readp__why">${c.why}</div>` : ""}
    ${(S.cur || "").startsWith("blk:") ? blockMath(c) : (!c.rules && !ab && !c.why ? combatMath(c) : "")}
    <div class="readp__acts">
      ${S.targeting ? `<span class="act act--go">Destroy it <b class="g g--a">A</b></span>`
        : (S.cur || "").startsWith("blk:") ? `<span class="act act--go">${boardVerb()} <b class="g g--a">A</b></span>`
        : c.zone === "hand" ? (castableNow(c)
          ? `<span class="act act--go">Cast ${costHTML(c.cost)} <b class="g g--a">A</b></span>`
          : `<span class="act act--no">Not at this step</span>`)
        : a ? `<span class="act act--go">${actionVerb(a)} <b class="g g--a">A</b></span>` : ""}
      ${c.ability && !(a && a.kind === "activate")
        ? `<span class="act act--ab">Activate <b class="g g--x">X</b></span>` : ""}
      ${c.ability && a && a.kind === "activate"
        ? `<span class="act act--ab">${textHTML(splitAbility(c.ability).cost)} — read it with <b class="g g--y">Y</b></span>` : ""}
    </div>`;
}

function footName() {
  const c = curCard();
  if (c) return `${c.n}${c.pt ? " · " + c.pt : ""}`;
  const d = curDeck();
  if (d) return d.n;
  const id = S.cur || "";
  if (id.startsWith("orb:")) return TABLE[+id.slice(4)].name;
  if (id.startsWith("t:") && S.targeting) {
    const o = S.targeting.options.find((x) => `t:${x.id}` === id);
    if (o) return o.label;
  }
  if (id.startsWith("seat:")) return S.pod.seats[+id.split(":")[1]].who || "Empty chair";
  return "";
}

/* The foot used to echo the rail: the focused card's name and P/T appeared on
   the card, in the rail and in the foot, three times inside 400px. The rail is
   the bigger surface and already owns identity, so the foot went back to being
   what a hint bar is -- verbs, and nothing else. */
function footHTML() {
  return `<div class="foot" id="foot">${footInner()}</div>`;
}

function footInner() {
  const c = curCard();
  return `
    <span><b class="g">${GLYPH.dpad}</b> Move</span>
    <span><b class="g g--a">A</b> ${boardVerb()}</span>
    ${c && S.phase === "attackers" && ACTIONS.some((a) => a.src === c.n && a.kind === "add_attacker")
      ? `<span><b class="g g--x">X</b> Re-aim</span>`
      : c && c.ability && !(actionsFor(c)[0] || {}).kind ? `<span><b class="g g--x">X</b> Activate</span>` : ""}
    <span><b class="g g--y">Y</b> Read</span>
    <span><b class="g g--b">B</b> Back</span>
    <span class="sp"></span>
    <span class="foot__zone"><b class="g">L1</b>/<b class="g">R1</b> Zone</span>
    <span class="foot__l2"><b class="g">L2</b> Wheel</span>
    ${S.paying
      ? `<div class="btn" style="opacity:.55">Paying for ${S.paying.card.n}…</div>`
      : S.targeting
      ? `<div class="btn" style="opacity:.55">Casting Beast Within…</div>`
      : `<div class="btn btn--commit" style="font-size:var(--fs-body);padding:0 18px" data-stop="commit" tabindex="0">
          ${ASK.commit} <em style="color:inherit;opacity:.75;margin:0">${commitTail()}</em> <b class="g g--a">A</b></div>`}
  `;
}

function boardPress(id) {
  if (S.targeting) {
    const o = S.targeting.options.find((x) => `t:${x.id}` === id);
    if (!o) return Pad.rumble(70, 0.3);
    // The spell travels to the thing it is aimed at, lands, and the target goes
    // out. Hearthstone's whole grammar: the card goes where the effect happens.
    const src = HAND.find((c) => c.n === "Beast Within");
    const targetEl = app.querySelector(`[data-stop="${CSS.escape(id)}"]`);
    const handEl = app.querySelector(`[data-stop="hand:${src.oid}"]`) || targetEl;
    fxBrace(targetEl);
    fxFly(faceHTML(src, { tile: true, nameless: true }), handEl, targetEl, 460, () => {
      fxBurst(targetEl, "var(--playable)");
      fxShake(false);
      Pad.rumble(70, 0.35);
      cue("card.perish");
      if (o.card && targetEl) fxPerish(targetEl, faceHTML(o.card, { tile: true, nameless: true }));
    });
    LOG.push(`Beast Within destroys ${o.label}`);
    toast(`Beast Within destroys ${o.label} — its controller gets a 3/3 Beast`);
    S.targeting = null;
    S.cur = null;
    return beat(reduced() ? 0 : ms(700), render);
  }
  if (id === "commit") return advance();
  if (id.startsWith("pay:")) return payWith(+id.slice(4));
  if (id.startsWith("stk:")) {
    const top = STACK[0];
    if (!top || `stk:${top.sid}` !== id) {
      cue("ui.deny");
      Pad.rumble(110, 0.45);
      toast("Only the top of the stack can resolve — that is what a stack is.");
      return render();
    }
    return resolveTop();
  }
  if (id.startsWith("pay:")) return payWith(+id.slice(4));
  if (id.startsWith("stk:")) {
    const top = STACK[0];
    if (!top || `stk:${top.sid}` !== id) {
      cue("ui.deny");
      Pad.rumble(110, 0.45);
      toast("Only the top of the stack can resolve — that is what a stack is.");
      return render();
    }
    return resolveTop();
  }
  if (id.startsWith("blk:")) {
    const [, att, oid] = id.split(":");
    coachSeen("block");
    pushUndo(S.blocks[att] === +oid ? `unblock ${att}` : `block ${att}`);
    if (S.blocks[att] === +oid) delete S.blocks[att];
    else S.blocks[att] = +oid;
    toast(S.blocks[att] ? `${byOidAny(+oid).n} blocks ${att}` : `${att} is unblocked again`);
    return render();
  }
  if (id.startsWith("orb:")) { S.oppFocus = +id.slice(4); S.overlay = "oppboard"; return render(); }
  if (id.startsWith("hand:")) {
    const c = byOidAny(+id.slice(5));
    if (!castableNow(c)) {
      cue("ui.deny");
      Pad.rumble(120, 0.5);
      toast(c.why || (S.phase === "blockers"
        ? `${c.n} is sorcery speed — it is Edgar's turn.`
        : `${c.n} cannot be cast at this step.`));
      return render();
    }
    // A spell that needs a target goes into the targeting mode; everything
    // else resolves straight away.
    if (c.n === "Beast Within") {
      S.targeting = DECISION;
      S.cur = `t:${DECISION.options[0].id}`;
      toast("Beast Within — choose a target, or B to take it back");
      return render();
    }
    // With manual mana on, you tap for it yourself first.
    if (S.tools.manualMana && c.cost) return beginPayment(c);
    return castFromHand(c);
  }
  if (id.startsWith("b:")) {
    const c = byOidAny(+id.slice(2));
    const a = ACTIONS.find((x) => x.src === c.n);
    if (!a) { Pad.rumble(70, 0.3); toast(`${c.n} — nothing to do at this step`); return render(); }
    pushUndo(a.staged ? `call back ${c.n}` : `send ${c.n}`);
    a.staged ? S.staged.delete(a.id) : S.staged.add(a.id);
    toast(a.label);
    return render();
  }
}

/* ===========================================================================
   SOUND, AS A SPECIFICATION.
   ---------------------------------------------------------------------------
   This file cannot ship audio -- it has to open from file:// with no network
   and no assets. But "add sound later" is how a game ends up with sound that
   does not line up with anything, so the CUES ARE PLACED NOW, at the exact
   beats they belong to, and the palette is documented as a contract.

   The rules behind the palette, which are the ones every card game converges on:

     EVERY INPUT ANSWERS.       A press with no sound feels dropped, even when
                                the screen changed. `ui.move` is the most-played
                                cue in the game by an order of magnitude, so it
                                is also the quietest and shortest.
     DENIAL IS DISTINCT.        `ui.deny` must not be a quieter `ui.confirm`;
                                it is the one cue a player needs to recognise
                                without looking, and it pairs with the rumble.
     WEIGHT MATCHES STAKES.     `card.cast` is a small sound. `combat.impact` is
                                a big one. `game.win` is the only one allowed to
                                be long.
     ONE VOICE PER BEAT.        Three attackers striking 110ms apart get three
                                cues, not one blur -- the stagger that makes the
                                animation readable makes the audio readable too.
     MUTE MEANS MUTE.           And it never changes what happens.

   `cue()` records rather than plays, and the bezel shows the last cue fired so
   the design can be reviewed by watching it. Wiring it to real audio is one
   function body.
   ======================================================================== */

const CUES = {
  "ui.move":        "soft tick, 30ms — the ring moving",
  "ui.confirm":     "warm click — A on anything that does something",
  "ui.back":        "reverse of confirm, quieter — B",
  "ui.deny":        "dull thud + rumble — an illegal or impossible press",
  "ui.open":        "sheet slide — an overlay opening",
  "card.cast":      "paper lift and settle — a card leaving your hand",
  "card.enters":    "soft thump — a permanent landing on the battlefield",
  "card.perish":    "brittle crack, short tail — something dying or exiled",
  "combat.declare": "low brass swell — attackers committed",
  "combat.strike":  "whoosh, pitched by power — one attacker moving",
  "combat.impact":  "body hit, layered with the shake — contact",
  "life.loss":      "descending tone under the numeral",
  "stack.resolve":  "chime — an item leaving the stack",
  "phase.change":   "quiet marker — the phase track advancing",
  "turn.pass":      "page turn — the turn changing hands",
  "game.win":       "the only long cue in the game",
  "game.lose":      "its inversion, shorter",
};

let LAST_CUE = null;

function cue(name) {
  if (!CUES[name]) return;                    // typo guard: a cue must exist
  LAST_CUE = name;
  const el = document.getElementById("cue");
  if (el) {
    el.textContent = S.tools.muted ? "muted" : name;
    el.classList.remove("cue--hit");
    void el.offsetWidth;
    el.classList.add("cue--hit");
  }
  // if (!S.tools.muted) audio.play(name);     <- the whole of the port
}

/* ===========================================================================
   THE FX ENGINE
   ---------------------------------------------------------------------------
   Six verbs, all of them writing into `#fxlayer`, which sits outside `#app` so
   a re-render cannot interrupt an animation mid-flight. Everything cleans up
   after itself on a timer, and every one of them is a no-op under
   `prefers-reduced-motion` -- the game state is changed by the caller, never by
   the effect, so skipping the whole lot changes nothing but the feel.
   ======================================================================== */

/* MOTION IS A SETTING, AND THE OS PREFERENCE IS ITS DEFAULT.
 *
 * `prefers-reduced-motion` is the right default and the wrong ceiling. Balatro
 * ships a speed control on its main menu; Hearthstone and Slay the Spire both
 * grew one. The reasons are different from accessibility and just as real: on
 * the tenth game you know what an attack looks like, and on a handheld you are
 * often playing in ten-minute pieces.
 *
 * Three settings, one knob:
 *
 *   full     everything, at the timings the sequences were tuned at
 *   swift    the same choreography at 55% -- still readable, half the wait
 *   reduced  no animation at all; every effect is a no-op and every beat fires
 *            immediately. This is what the OS preference selects, and it is
 *            SAFE because the state change always happens before the animation
 *            and the animation only ever reports it.
 *
 * Making it a real toggle is also how the reduced path gets tested at all --
 * a media query nobody can flip is a code path nobody has run.
 */
let MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";
const MOTION_SCALE = { full: 1, swift: 0.55, reduced: 0 };
const reduced = () => MOTION === "reduced";
const ms = (n) => Math.round(n * MOTION_SCALE[MOTION]);

const fxLayer = () => document.getElementById("fxlayer");

function fxCentre(el) {
  const r = deckRect(el.getBoundingClientRect());
  return { x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2, w: r.right - r.left, h: r.bottom - r.top, r };
}

function fxAdd(html, ms) {
  const L = fxLayer();
  if (!L) return null;
  const d = document.createElement("div");
  d.innerHTML = html;
  const node = d.firstElementChild;
  L.appendChild(node);
  setTimeout(() => node.remove(), ms);
  return node;
}

/** IMPACT. A ring and a shockwave at a point. */
function fxBurst(el, colour = "var(--attacking)") {
  if (!el || reduced()) return;
  const c = fxCentre(el);
  fxAdd(`<div class="fx-flash" style="left:${c.x}px;top:${c.y}px;background:radial-gradient(circle, ${colour} 0%, transparent 70%)"></div>`, 360);
  fxAdd(`<div class="fx-burst" style="left:${c.x}px;top:${c.y}px;color:${colour}"></div>`, 480);
}

/** The stage jolts. `heavy` is for something that changed a life total. */
function fxShake(heavy) {
  if (reduced()) return;
  const deck = document.querySelector(".deck");
  if (!deck) return;
  const cls = heavy ? "shake-heavy" : "shake-light";
  deck.classList.remove("shake-light", "shake-heavy");
  void deck.offsetWidth;             // restart the animation
  deck.classList.add(cls);
  setTimeout(() => deck.classList.remove(cls), heavy ? 340 : 240);
}

/** TELEGRAPH. Whatever is about to be hit pulses first. */
function fxBrace(el) {
  if (!el || reduced()) return;
  el.classList.add("fx-brace");
  setTimeout(() => el.classList.remove("fx-brace"), 900);
}

/**
 * ANTICIPATION -> STRIKE. A ghost copy of the card winds back away from its
 * target, then drives into it and returns. The real card never moves, so the
 * layout underneath is untouched and the ring stays where the player left it.
 */
function fxStrike(fromEl, toEl, cardHTML, delay = 0, onImpact) {
  if (!fromEl || !toEl) { if (onImpact) setTimeout(onImpact, delay); return; }
  if (reduced()) { if (onImpact) setTimeout(onImpact, delay); return; }
  const a = fxCentre(fromEl);
  const b = fxCentre(toEl);
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;

  const node = fxAdd(
    `<div class="fx-striker" style="left:${a.r.left}px;top:${a.r.top}px;width:${a.w}px">${cardHTML}</div>`, delay + 900);
  if (!node) return;

  const anim = node.animate([
    { transform: "translate(0,0) scale(1)", offset: 0 },
    // wind up, away from the target
    { transform: `translate(${-ux * 22}px, ${-uy * 22}px) scale(1.04)`, offset: 0.28 },
    // strike, stopping just short so the burst reads as the contact
    { transform: `translate(${dx * 0.82}px, ${dy * 0.82}px) scale(1.1)`, offset: 0.56 },
    { transform: `translate(${dx * 0.82}px, ${dy * 0.82}px) scale(1.05)`, offset: 0.62 },
    { transform: "translate(0,0) scale(1)", offset: 1 },
  ], { duration: 820, delay, easing: "cubic-bezier(.3,.05,.2,1)", fill: "both" });

  setTimeout(() => { if (onImpact) onImpact(); }, delay + 470);
  anim.onfinish = () => node.remove();
}

/** A card travelling from one place to another -- cast, draw, discard. */
function fxFly(cardHTML, fromEl, toEl, ms = 480, onArrive) {
  if (!fromEl || !toEl || reduced()) { if (onArrive) setTimeout(onArrive, 60); return; }
  const a = fxCentre(fromEl);
  const b = fxCentre(toEl);
  const node = fxAdd(
    `<div class="fx-fly" style="left:${a.r.left}px;top:${a.r.top}px;width:${a.w}px">${cardHTML}</div>`, ms + 120);
  if (!node) return;
  node.animate([
    { transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 },
    { transform: `translate(${(b.x - a.x) * 0.55}px, ${(b.y - a.y) * 0.55 - 40}px) scale(1.18) rotate(-4deg)`, opacity: 1, offset: 0.55 },
    { transform: `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(.72) rotate(2deg)`, opacity: 0 },
  ], { duration: ms, easing: "cubic-bezier(.3,.02,.2,1)", fill: "both" }).onfinish = () => node.remove();
  setTimeout(() => { if (onArrive) onArrive(); }, ms - 60);
}

/** DEATH. The card blanches, shrinks and goes out. */
function fxPerish(el, cardHTML) {
  if (!el || reduced()) return;
  const c = fxCentre(el);
  const node = fxAdd(`<div class="fx-fly fx-perish" style="left:${c.r.left}px;top:${c.r.top}px;width:${c.w}px">${cardHTML}</div>`, 620);
  if (node) fxBurst(el, "var(--text-dim)");
}

/* ===========================================================================
   THE TURN MACHINE
   ---------------------------------------------------------------------------
   Three player-facing phases and two between-turns beats. Everything is on a
   timer rather than a scripted cutscene: you press, something visibly happens,
   and the next question arrives. The whole point is that the NEXT ask lands
   somewhere the thumb already is.
   ======================================================================== */

function advance() {
  const el = app.querySelector('[data-stop="commit"]');
  if (el) el.classList.add("thump");
  cue(S.phase === "attackers" ? "combat.declare" : "ui.confirm");
  Pad.rumble(80, 0.4);

  if (S.phase === "attackers") return resolveAttack();
  if (S.phase === "main2") return endTurn();
  if (S.phase === "blockers") return resolveBlocks();
}

/* THE ATTACK, CHOREOGRAPHED.
 *
 *   0ms    the target braces -- Slay the Spire's intent, one beat early
 *   140ms  the first attacker winds back and strikes; the rest follow 110ms
 *          apart, so three attacks read as three rather than as one blur
 *   ~610ms each impact: burst, shake, and its own damage numeral, so you can
 *          see WHICH creature contributed WHAT
 *   ~1.1s  the life total ticks once, at the end, and is the last thing moving
 *
 * The state change happens up front and the animation only reports it -- so a
 * player on `prefers-reduced-motion`, or one who mashes A, gets the same game.
 */
function resolveAttack() {
  const dmg = stagedDamage();
  if (!dmg) { S.phase = "main2"; S.cur = null; LOG.push("You attack with nothing"); return render(); }

  const by = damageBySeat();
  const orb = app.querySelector(`[data-stop="orb:${Object.keys(by)[0] || 1}"]`);
  const strikers = [];
  for (const id of S.staged) {
    const a = ACTIONS.find((x) => x.id === id);
    const c = a && allPermanents().find((x) => x.n === a.src);
    const el = c && app.querySelector(`[data-stop="b:${c.oid}"]`);
    if (c && el) strikers.push({ c, el, id });
  }

  Object.keys(by).forEach((seat) => fxBrace(app.querySelector(`[data-stop="orb:${seat}"]`)));
  strikers.forEach((k, i) => {
    const seat = aimOf(k.id);
    const dest = app.querySelector(`[data-stop="orb:${seat}"]`) || orb;
    fxStrike(k.el, dest, faceHTML(k.c, { tile: true, nameless: true }), ms(140 + i * 110), () => {
      const pow = (parseInt(k.c.pt) || 0) * (k.c.count || 1);
      cue("combat.impact");
      fxBurst(dest, "var(--attacking)");
      fxShake(pow >= 5);
      Pad.rumble(pow >= 5 ? 90 : 55, pow >= 5 ? 0.5 : 0.3);
      if (dest) fx(`−${pow}`, "dmg", dest);
      cue("life.loss");
      S.hit = seat === 1 ? "edgar" : null; paint();
    });
  });

  const settle = reduced() ? 0 : ms(140 + strikers.length * 110 + 520);

  // Damage lands on the seats it was aimed at, not all of it on seat one.
  let killed = null;
  Object.entries(by).forEach(([seat, n]) => {
    const p = TABLE[seat];
    p.life = Math.max(0, p.life - n);
    if (p === OPP) S.life.edgar = p.life;
    LOG.push(`${p.name} takes ${n}`);
    if (p.life <= 0 && !killed) killed = { p, n };
  });
  // Somebody reaching zero has to END something. Letting the loop carry on past
  // a dead player is the kind of thing a prototype gets away with and a game
  // never does.
  if (killed) return finish("You", `${killed.p.name} fell to ${killed.n} from your attack on turn ${S.turn}.`);
  // Attacking taps them, which is what makes the blockers step interesting.
  for (const id of S.staged) {
    const a = ACTIONS.find((x) => x.id === id);
    const c = a && allPermanents().find((x) => x.n === a.src);
    if (c) c.tapped = true;
  }
  beat(settle, () => {
    S.staged.clear();
    cue("phase.change");
    S.phase = "main2";
    // Your second main phase is when sorcery-speed cards come back, and the
    // hand going green is the clearest possible demonstration that the client
    // knows what step it is on.
    HAND.forEach((c) => {
      if (c.why && c.why.indexOf("sorcery speed") >= 0) { c.playable = true; c.why = null; }
      if (c.why && c.why.indexOf("first main") >= 0) { c.playable = true; c.why = null; }
    });
    S.cur = `hand:${HAND[0].oid}`;
    toast("Your second main phase — the sorcery-speed cards are live again");
    render();
  });
}

function endTurn() {
  LOG.push("You end your turn");
  S.between = {
    who: "Edgar Markov",
    card: OPP.cmdr,
    line: "His turn. Here is what he did.",
    beats: [
      { icon: "↻", text: "Untaps everything and draws" },
      { icon: "◈", text: "Plays a Mountain — three lands open" },
      { icon: "⚔", text: "Attacks with Falkenrath Noble and a Vampire" },
    ],
  };
  S.cur = null;
  render();
  beat(ms(2100), () => {
    // He untaps and swings.
    OPP.creatures.forEach((c) => { c.tapped = false; });
    // Once an opponent has acted there is nothing to take back.
    UNDO.length = 0;
    cue("turn.pass");
    S.between = null;
    S.phase = "blockers";
    S.blocks = {};
    LOG.push("Edgar Markov attacks with Falkenrath Noble and a Vampire");
    // Land the ring on the first slot that can actually take a blocker. The
    // first ATTACKER is the flier, and its row has no slots at all, so aiming
    // at "the first attacker" put the cursor nowhere and it fell back to a seat.
    const firstBlockable = EDGAR_ATTACK.find(canBlock);
    const firstBlocker = myBlockers()[0];
    S.cur = firstBlockable && firstBlocker ? `blk:${firstBlockable.n}:${firstBlocker.oid}` : null;
    toast("Edgar attacks — Falkenrath Noble is flying, and nothing you have can catch it");
    render();
  }, 1700);
}

function resolveBlocks() {
  const through = EDGAR_ATTACK.reduce((k, a) => k + (S.blocks[a.n] ? 0 : a.power), 0);
  const mine = app.querySelector(".mine__h .life");

  // Blocked attackers clash with their blocker; unblocked ones come for you.
  EDGAR_ATTACK.forEach((att, i) => {
    const blocker = S.blocks[att.n];
    const attEl = app.querySelector(`.blockrow:nth-child(${i + 2}) .slot`);
    const card = attackerCard(att.n);
    if (!attEl || !card) return;
    const dest = blocker
      ? app.querySelector(`[data-stop="blk:${att.n}:${blocker}"]`)
      : mine;
    fxBrace(dest);
    fxStrike(attEl, dest, faceHTML(card, { tile: true, nameless: true }), ms(120 + i * 120), () => {
      fxBurst(dest, blocker ? "var(--targetable)" : "var(--attacking)");
      fxShake(!blocker && att.power >= 2);
      cue("combat.impact");
      Pad.rumble(blocker ? 45 : 80, blocker ? 0.25 : 0.45);
      if (!blocker && mine) { fx(`−${att.power}`, "dmg", mine); S.hit = "me"; paint(); }
    });
  });

  S.life.me = Math.max(0, S.life.me - through);
  ME.life = S.life.me;
  LOG.push(through
    ? `Edgar's attack deals ${through} — you are on ${S.life.me}`
    : "You block everything");
  if (S.life.me <= 0) return finish("Edgar Markov", `You took ${through} you could not block on turn ${S.turn}.`);
  const settle = reduced() ? 0 : ms(120 + EDGAR_ATTACK.length * 120 + 520);
  beat(settle, () => {
    S.between = { who: "Your turn", card: ME.cmdr, line: `Turn ${S.turn + 1}. Untap, upkeep, draw.` };
    render();
    setTimeout(() => {
      S.turn += 1;
      S.phase = "attackers";
      S.between = null;
      S.blocks = {};
      ME.creatures.forEach((c) => { c.tapped = false; c.sick = false; });
      S.staged.clear();
      S.cur = `b:${ME.creatures[0].oid}`;
      LOG.push(`Turn ${S.turn} — you untap and draw`);
      toast(`Turn ${S.turn}. Everything untapped, and Acidic Slime can attack now.`);
      render();
    });
  });
}

/* ===========================================================================
   A REMATCH HAS TO PUT EVERYTHING BACK.
   ---------------------------------------------------------------------------
   The moment the board became playable, the fixtures became MUTABLE STATE: the
   hand gets spliced, creatures get pushed onto lanes, life totals move, mana
   drains, the log grows. That is what makes it a game rather than a picture --
   and it is also why "Rematch" was a button that could not work, and why
   playing a second game in one session would have started from wherever the
   first one ended.

   So the board is snapshotted once at boot and restored in place. IN PLACE
   matters: `TABLE`, `byOidAny` and every `data-stop` in the document hold
   references to these exact objects and arrays, so swapping them for fresh ones
   would leave the cursor pointing at cards that are no longer on the board.
   `splice` and field assignment keep identity; only the contents go back.
   ======================================================================== */

function snapshot() {
  return {
    hand: structuredClone(HAND),
    log: LOG.slice(),
    seats: TABLE.map((p) => ({
      life: p.life, tax: p.tax, gy: p.gy, exile: p.exile, lib: p.lib, hand: p.hand,
      lands: structuredClone(p.lands),
      creatures: structuredClone(p.creatures),
      other: structuredClone(p.other),
      mana: structuredClone(p.mana),
      graveyard: structuredClone(p.graveyard || []),
      exileZone: structuredClone(p.exileZone || []),
    })),
    actions: ACTIONS.map((a) => ({ id: a.id, staged: !!a.staged })),
    // The stack became mutable the moment it could resolve, so it snapshots
    // too. Missed on the first pass, which is exactly the failure mode this
    // whole block exists to prevent: state that is restorable in principle and
    // not in the list.
    stack: STACK.map((x) => ({ ...x })),
    turn: S.turn,
    phase: S.phase,
    life: { ...S.life },
    staged: [...S.staged],
    blocks: { ...S.blocks },
  };
}

const START = snapshot();

/* ---------------------------------------------------------------------------
   UNDO, FOR REAL.

   The tool strip has said "takes back your last action" since the round began
   and it did nothing -- which is worse than not offering it, because a player
   who believes undo exists plays differently.

   One snapshot per action, capped at twenty. `ActionPanel.tsx` documents the
   real constraint and it is worth honouring here: **undo stops being available
   once an opponent has acted**, because the engine cannot un-ring that bell.
   So the stack is cleared whenever the turn passes, and the tool says so
   instead of silently failing.
------------------------------------------------------------------------- */
const UNDO = [];

function pushUndo(what) {
  UNDO.push({ label: what, state: snapshot() });
  if (UNDO.length > 20) UNDO.shift();
}

function canUndo() { return UNDO.length > 0; }

function undo() {
  const last = UNDO.pop();
  if (!last) { Pad.rumble(120, 0.45); toast("Nothing to take back."); return render(); }
  applySnapshot(last.state);
  Pad.rumble(60, 0.3);
  toast(`Took back: ${last.label}`);
  render();
}

function restoreBoard() {
  UNDO.length = 0;
  applySnapshot(START);
}

function applySnapshot(START) {
  HAND.splice(0, HAND.length, ...structuredClone(START.hand));
  LOG.splice(0, LOG.length, ...START.log);
  TABLE.forEach((p, i) => {
    const s0 = START.seats[i];
    Object.assign(p, { life: s0.life, tax: s0.tax, gy: s0.gy, exile: s0.exile, lib: s0.lib, hand: s0.hand });
    p.lands.splice(0, p.lands.length, ...structuredClone(s0.lands));
    p.creatures.splice(0, p.creatures.length, ...structuredClone(s0.creatures));
    p.other.splice(0, p.other.length, ...structuredClone(s0.other));
    p.mana.splice(0, p.mana.length, ...structuredClone(s0.mana));
    if (p.graveyard) p.graveyard.splice(0, p.graveyard.length, ...structuredClone(s0.graveyard));
    if (p.exileZone) p.exileZone.splice(0, p.exileZone.length, ...structuredClone(s0.exileZone));
  });
  ACTIONS.forEach((a) => { const s0 = START.actions.find((x) => x.id === a.id); if (s0) a.staged = s0.staged; });
  STACK.splice(0, STACK.length, ...START.stack.map((x) => ({ ...x })));

  S.turn = START.turn;
  S.phase = START.phase;
  S.life = { ...START.life };
  S.blocks = { ...START.blocks };
  S.staged = new Set(START.staged);
  S.between = null;
  S.targeting = null;
  S.question = null;
  S.overlay = null;
  S.fx = [];
  S.hit = null;
  if (BEAT) { clearTimeout(BEAT.id); BEAT = null; }
}

/* ===========================================================================
   NOTHING MAKES YOU WAIT.
   ---------------------------------------------------------------------------
   The single loudest complaint about every digital card game is being held
   hostage by its own animations. Hearthstone shipped a "skip" gesture years
   late; Slay the Spire lets you click through every beat; Balatro has a speed
   setting on the main menu because it knows.

   So every timed beat here goes through `beat()`, which remembers what it was
   going to do next, and ANY BUTTON does it now. The animation is a courtesy,
   never a gate -- and because the state change already happened before the
   animation started, skipping cannot desync anything.

   This is also what the shipped client's narration queue does: `Table.gateInput`
   treats a press during narration as both "skip ahead" AND the gesture itself,
   so an impatient player never loses an input. Same rule.
======================================================================== */
let BEAT = null;

function beat(ms, fn) {
  if (BEAT) clearTimeout(BEAT.id);
  if (reduced()) { BEAT = null; return fn(); }
  BEAT = { fn, id: setTimeout(() => { BEAT = null; fn(); }, ms) };
}

/** True if there was something to skip. */
function skipBeat() {
  if (!BEAT) return false;
  clearTimeout(BEAT.id);
  const fn = BEAT.fn;
  BEAT = null;
  fn();
  return true;
}

const waiting = () => !!BEAT;

/* ===========================================================================
   WHICH SEAT ARE YOU ATTACKING?
   ---------------------------------------------------------------------------
   This is a FOUR-PLAYER game and every attack in this prototype went to Edgar
   Markov, because two-player was the shape everything got built in. In
   Commander, "who do I attack" is not a detail of declaring attackers -- it is
   most of the decision. Sending a 7/7 at the player on 18 is a different game
   from sending it at the player on 31.

   The pad problem is that choosing a target must not cost a press, because the
   common case is "all of them at the obvious one". So:

     A   stages the creature at the DEFAULT seat
     X   cycles that creature's target through the other seats

   And the default is not seat one, it is **the seat closest to dying** -- which
   is what a player means by "the obvious one" nine times out of ten, and is a
   judgement the client can make from data it already has. Getting the default
   right is what makes the extra control optional rather than mandatory.
   ======================================================================== */

/* Lowest life first; a tie breaks toward the one your commander has already
   hurt, because commander damage is a second clock and only one of them counts. */
function defaultTarget() {
  let best = 1;
  let bestScore = Infinity;
  for (let i = 1; i < TABLE.length; i++) {
    const p = TABLE[i];
    const cd = (p.cmdDamage && p.cmdDamage[0] && p.cmdDamage[0].n) || 0;
    const score = p.life * 10 - cd;      // life dominates, commander damage breaks ties
    if (score < bestScore) { bestScore = score; best = i; }
  }
  return best;
}

const aimOf = (actionId) => S.aim[actionId] !== undefined ? S.aim[actionId] : defaultTarget();

function cycleAim(card) {
  const a = ACTIONS.find((x) => x.src === card.n && x.kind === "add_attacker");
  if (!a || !S.staged.has(a.id)) { cue("ui.deny"); Pad.rumble(90, 0.4); toast(`${card.n} is not attacking yet — ${GLYPH.a} sends it first.`); return render(); }
  pushUndo(`re-aim ${card.n}`);
  S.aim[a.id] = (aimOf(a.id) % (TABLE.length - 1)) + 1;
  cue("ui.confirm");
  Pad.rumble(45, 0.25);
  toast(`${card.n} now attacks ${TABLE[S.aim[a.id]].name}`);
  render();
}

/* Damage per seat, which is what the commit control is actually promising. */
function damageBySeat() {
  const by = {};
  for (const id of S.staged) {
    const a = ACTIONS.find((x) => x.id === id);
    if (!a || !a.src || a.kind !== "add_attacker") continue;
    const card = allPermanents().find((c) => c.n === a.src);
    if (!card) continue;
    const seat = aimOf(id);
    by[seat] = (by[seat] || 0) + (parseInt(card.pt) || 0) * (card.count || 1);
  }
  return by;
}

/* ===========================================================================
   MANUAL MANA
   ---------------------------------------------------------------------------
   `manual_mana` is a real flag on the real `GameView`, and the tool strip has
   been offering it since this round began while doing nothing at all. A switch
   that switches nothing is worse than no switch: it teaches the player that the
   settings screen is decorative.

   What it actually changes: with AUTO MANA the payment solver picks the lands
   and you never see it happen. With MANUAL MANA you tap them yourself, and the
   reason anyone would want that is the reason it is worth drawing -- the solver
   optimises for paying THIS spell, and you may be holding a dual land because
   of the spell you intend to cast NEXT.

   It reuses the targeting machinery exactly: the lands become the only
   reachable stops, the ask line counts down what is left, and B backs out
   without losing the spell. One more mode, no new vocabulary.
   ======================================================================== */

/* How many mana a land slot can still produce -- a `×7` Forest is seven taps,
   not one. */
function tapsLeft(land) {
  const used = (S.paying.picked.filter((o) => o === land.oid) || []).length;
  return (land.count || 1) - used - (land.tapped ? 1 : 0);
}

function payableLands() {
  return ME.lands.filter((l) => l.land && tapsLeft(l) > 0);
}

function beginPayment(c) {
  const need = tokens(c.cost).reduce((n, t) => n + (/^[0-9]+$/.test(t) ? +t : 1), 0);
  S.paying = { card: c, need, picked: [] };
  S.cur = `pay:${payableLands()[0].oid}`;
  cue("ui.open");
  toast(`Tap lands for ${c.n} — ${need} to pay, ${GLYPH.b} to take it back`);
  render();
}

function payWith(oid) {
  const land = ME.lands.find((l) => l.oid === oid);
  if (!land || tapsLeft(land) <= 0) { cue("ui.deny"); Pad.rumble(110, 0.45); return render(); }
  S.paying.picked.push(oid);
  cue("ui.confirm");
  Pad.rumble(40, 0.22);

  if (S.paying.picked.length >= S.paying.need) {
    const card = S.paying.card;
    // Spend exactly what was tapped, rather than letting the solver re-decide.
    S.paying.picked.forEach((o) => {
      const l = ME.lands.find((x) => x.oid === o);
      const sym = (l.land || "").split("/")[0];
      const m = ME.mana.find((x) => x.sym.split("/")[0] === sym) || ME.mana[0];
      if (m && m.open > 0) m.open -= 1;
    });
    S.paying = null;
    return castFromHand(card, true);
  }
  render();
}

/* CASTING, FOR REAL.
 *
 * Until now exactly one card in hand did anything, and everything else was a
 * picture of a card. A play loop where you cannot actually play anything is a
 * loop with a hole in the middle of it -- so a permanent cast from hand flies
 * to the lane it belongs in, lands, and is THERE: on the battlefield, summoning
 * sick, with the mana gone and a line in the log.
 *
 * It also demonstrates the one thing a still can never show -- that the lanes
 * grow, that the layout absorbs a new card without reflowing into a mess, and
 * that the ring survives its own board changing underneath it.
 */
function castFromHand(c, alreadyPaid) {
  const laneId = c.t === "creature" ? "creatures" : c.t === "land" ? "lands" : "other";
  const handEl = app.querySelector(`[data-stop="hand:${c.oid}"]`);
  const laneEl = app.querySelectorAll(".mine .lane")[laneId === "creatures" ? 0 : 1];
  const cost = tokens(c.cost).reduce((n, t) => n + (/^[0-9]+$/.test(t) ? +t : 1), 0);

  pushUndo(`cast ${c.n}`);
  cue("card.cast");
  LOG.push(`You cast ${c.n}`);
  Pad.rumble(60, 0.3);

  const land = () => {
    // Out of the hand, onto the battlefield.
    const i = HAND.indexOf(c);
    if (i >= 0) HAND.splice(i, 1);
    // The unplayable reason belonged to it while it was in your hand. On the
    // battlefield it is a stale sentence about a decision already made.
    c.why = null;
    c.playable = false;
    if (c.t === "sorcery" || c.t === "instant") {
      ME.graveyard.unshift({ ...c, note: `Resolved, turn ${S.turn}` });
      ME.gy = ME.graveyard.length;
      toast(`${c.n} resolves and goes to your graveyard`);
    } else {
      c.zone = `my:${laneId}`;
      c.sick = c.t === "creature";
      (laneId === "creatures" ? ME.creatures : laneId === "lands" ? ME.lands : ME.other).push(c);
      toast(c.t === "creature"
        ? `${c.n} enters — summoning sick until your next turn`
        : `${c.n} enters the battlefield`);
    }
    // Pay for it -- unless the player already tapped for it by hand.
    if (!alreadyPaid) {
      let left = cost;
      for (const m of ME.mana) {
        const take = Math.min(m.open || 0, left);
        m.open -= take;
        left -= take;
        if (!left) break;
      }
    }
    S.cur = c.zone && c.zone.startsWith("my:") ? `b:${c.oid}` : (HAND[0] ? `hand:${HAND[0].oid}` : null);
    render();
    cue("card.enters");
    if (laneEl) { fxBurst(laneEl, "var(--playable)"); fxShake(false); }
  };

  // `fxFly` already invokes `land` on its reduced path, so calling it again
  // here cast the card TWICE -- two copies on the battlefield, paid for once.
  // Invisible at full motion and reproducible every time at reduced, which is
  // the shape of bug that only a testable motion setting ever finds.
  fxFly(faceHTML(c, { tile: true, nameless: true }), handEl, laneEl || handEl, ms(460) || 1, land);
  return;
}

/* Somebody won. The result screen is already built -- this just fills it in
   from what actually happened rather than from the fixture. */
function finish(winner, line) {
  RESULT.winner = winner;
  RESULT.line = line;
  RESULT.players = [
    { who: "You", how: winner === "You" ? `Won — ${S.life.me} life remaining` : `Lost — life total reached 0, turn ${S.turn}` },
    { who: "Edgar Markov", how: winner === "Edgar Markov" ? `Won — ${S.life.edgar} life remaining` : `Lost — life total reached 0, turn ${S.turn}` },
    { who: "Marco", how: "Still in — 31 life" },
    { who: "Duelist", how: "Still in — 18 life" },
  ];
  cue(winner === "You" ? "game.win" : "game.lose");
  fxShake(true);
  Pad.rumble(220, 0.8);
  beat(ms(700), () => { S.overlay = "over"; S.cur = null; render(); });
  render();
}

/* --- The blockers surface -------------------------------------------------
   The hard one, and the reason it needed its own design: this decision is about
   THEIR cards, not yours. So their attackers lead -- each one a row -- and your
   creatures are what you assign INTO those rows. A flier nothing you own can
   catch is marked unblockable and carries no slot at all, because a row you
   cannot fill is a row that should not accept the ring.
------------------------------------------------------------------------- */
function blockersHTML() {
  return `<div class="mine">
    <div class="mine__h">
      <span class="mine__ask"><b>${ASK.title}</b><span>${ASK.sub}</span></span>
      <span style="flex:1"></span>
      ${ASK.incoming ? `<span class="cdmg cdmg--in">☠ ${ASK.incoming} incoming</span>` : ""}
      <span class="life">${S.life.me}<em>life</em></span>
    </div>
    ${EDGAR_ATTACK.map((att) => {
      const card = attackerCard(att.n);
      const blockable = canBlock(att);
      const assigned = S.blocks[att.n];
      return `<div class="blockrow">
        <span class="blockrow__l">${att.n}<em>${att.power} power${att.flying ? " · flying" : ""}</em></span>
        <div class="slot ${blockable ? "" : "unblockable"}">${faceHTML(card, { tile: true, nameless: true })}</div>
        <span class="blockrow__l" style="width:auto;color:var(--text-faint)">${blockable ? "blocked by" : "you cannot block a flier"}</span>
        ${blockable ? myBlockers().map((c) => `
          <div class="slot ${assigned === c.oid ? "blocked" : ""}" data-stop="blk:${att.n}:${c.oid}" data-zone="my:creatures" tabindex="0">
            ${faceHTML(c, { tile: true, nameless: true, dim: assigned && assigned !== c.oid })}
          </div>`).join("") : ""}
      </div>`;
    }).join("")}
  </div>`;
}

/* AN OPPONENT ACTING OFF SCREEN IS THE THING THAT MAKES AN ONLINE GAME FEEL
   BROKEN. It was a spinner with a portrait on it. Now it is a recap: the three
   things Edgar actually did, arriving one at a time, so the board you come back
   to is a board you watched change. Slay the Spire does this with its intents;
   Hearthstone does it by playing the opponent's cards where you can see them.
   The staggered reveal is the entire trick -- three lines at once is a wall of
   text, three lines 260ms apart is a turn happening. */
function betweenHTML() {
  const beats = S.between.beats || [];
  return `<div class="between">
    ${faceHTML(S.between.card, { tile: true, nameless: true })}
    <h2>${S.between.who}</h2>
    <p>${S.between.line}</p>
    <div class="between__skip"><b class="g g--a">A</b> skip</div>
    ${beats.length ? `<div class="recap">
      ${beats.map((b, i) => `<div class="recap__i" style="animation-delay:${260 + i * 260}ms">
        <i>${b.icon}</i><span>${b.text}</span></div>`).join("")}
    </div>` : `<div class="between__dots"><i></i><i></i><i></i></div>`}
  </div>`;
}

function fxHTML() {
  if (!S.fx.length) return "";
  return `<div class="fx">${S.fx.map((f) =>
    `<div class="fx__n fx__n--${f.kind}" style="left:${f.x}px;top:${f.y}px">${f.text}</div>`).join("")}</div>`;
}

/* The coach marks, in the order a player meets them. `when` decides whether it
   is this one's moment; `at` is the selector it points at; `done` is what makes
   it never come back. */
const COACH = [
  {
    id: "wheel",

    body: "Put one of your creatures under an attacker to block it. The flier has no slots — nothing you own can catch it.",
  },
];

/* Centre the callout on whatever it is about, clamp it inside the stage, then
   put the arrow back where the anchor actually is. Without the second step a
   clamped callout points confidently at the wrong thing, which is worse than
   not pointing at all. */
const COACH_W = 320;

function coachHTML() {
  const c = COACH.find((k) => !S.seen[k.id] && k.when());
  if (!c) return "";
  const el = app.querySelector(c.at);
  if (!el) return "";
  const r = deckRect(el.getBoundingClientRect());
  const anchorX = (r.left + r.right) / 2;
  const x = Math.max(12, Math.min(anchorX - COACH_W / 2, DECK_W - COACH_W - 12));
  const y = c.side === "down"
    ? Math.max(12, r.top - 132)          // sits above, points down at the anchor
    : Math.min(DECK_H - 140, r.bottom + 16);
  const arrow = Math.max(18, Math.min(anchorX - x, COACH_W - 18));
  return `<div class="coach coach--${c.side}" style="left:${x}px;top:${y}px;width:${COACH_W}px;--arrow-x:${arrow}px">
    <b>${c.title}</b><span>${c.body}</span>
  </div>`;
}

/* Using the thing is what dismisses it. Nothing here needs an "OK" button,
   because an "OK" button is a second thing to learn. */
function coachSeen(id) {
  if (S.seen[id]) return;
  S.seen[id] = true;
}
