/* Zone peek. Four zones, any player, and every row says how the card got there
   -- `ZonePeek.tsx`'s best idea and the reason a graveyard is worth opening. */
const PEEK_ZONES = [["graveyard", "Graveyard"], ["exileZone", "Exile"], ["hand", "Hand"], ["command", "Command"]];

function peekCards() {
  const p = TABLE[S.peekWho];
  if (S.peekZone === "hand") return p === ME ? HAND : [];
  if (S.peekZone === "command") return [p.cmdr];
  return p[S.peekZone] || [];
}

function peekHTML() {
  const p = TABLE[S.peekWho];
  const cards = peekCards();
  return `<div class="veil">
    <div class="veil__h">
      <h2>${p.name}</h2>
      <span>${GLYPH.left}${GLYPH.right} pick a card · L1/R1 change zone · ${GLYPH.b} back</span>
      <div class="zonetabs">
        ${TABLE.map((q, i) => `<div class="zonetab ${i === S.peekWho ? "on" : ""}" data-stop="who:${i}" tabindex="0">${q.name}</div>`).join("")}
      </div>
    </div>
    <div class="veil__h" style="padding-top:0">
      ${PEEK_ZONES.map(([k, n]) => `<div class="zonetab ${S.peekZone === k ? "on" : ""}" data-stop="pz:${k}" tabindex="0">${n} ${zoneCount(p, k)}</div>`).join("")}
    </div>
    <div class="veil__b peek__b">
      ${cards.length ? `<div class="peekgrid">${cards.map((c) => `
        <div class="peekrow" data-stop="pk:${c.oid || 0}" tabindex="0">
          ${faceHTML(c, { tile: true, nameless: true, thumb: true })}
          <div class="peekrow__x">
            <div class="peekrow__n">${c.n}</div>
            <div class="peekrow__note">${c.note || c.tl}</div>
          </div>
        </div>`).join("")}</div>`
        : `<div class="readp__empty" style="font-size:var(--fs-body)">Nothing here.</div>`}
      ${peekCard() ? `<div class="peek__read">
        ${faceHTML(peekCard())}
        <div class="peek__x">
          <h3>${peekCard().n}</h3>
          <div class="rd__tl">${peekCard().tl}${peekCard().cost ? " · " : ""}${peekCard().cost ? costHTML(peekCard().cost) : ""}${peekCard().pt ? " · " + peekCard().pt : ""}</div>
          ${peekCard().rules ? `<div class="readp__r" style="font-size:var(--fs-body)">${textHTML(peekCard().rules)}</div>` : ""}
          ${peekCard().note ? `<div class="peek__note">${peekCard().note}</div>` : ""}
        </div>
      </div>` : ""}

}

/* The zone browser gets the same shape as the board: a list you walk, and the
   thing under the ring drawn large beside it. Three cards in a graveyard used
   to leave 600px of nothing, which reads as a screen that is not finished. */
function peekCard() {
  const id = S.cur || "";
  if (!id.startsWith("pk:")) return null;
  return peekCards().find((c) => String(c.oid || 0) === id.slice(3)) || null;
}

function zoneCount(p, k) {
  if (k === "hand") return p === ME ? HAND.length : p.hand;
  if (k === "command") return 1;
  return (p[k] || []).length;
}

function logHTML() {
  return `<div class="veil">
    <div class="veil__h"><h2>What happened</h2><span>${GLYPH.b} back</span></div>
    <div class="veil__b">
      ${STACK.length ? `<h3 style="font-size:var(--fs-lead);margin:0 0 8px">On the stack</h3>
        ${STACK.map((s) => `<div class="logrow"><b>${s.name}</b> — ${s.controller}${s.targets ? ` → ${s.targets}` : ""}. ${s.description}</div>`).join("")}
        <h3 style="font-size:var(--fs-lead);margin:16px 0 8px">Earlier</h3>` : ""}
      ${LOG.slice().reverse().map((l) => `<div class="logrow">${l}</div>`).join("")}
    </div>
  </div>`;
}

/* The tool strip, with what each tool MEANS. Three of the five are modes, and
   every one of them explains itself only through a `title=` tooltip today --
   which on a pad is an unlabelled switch. */
function toolsHTML() {
  return `<div class="veil">
    <div class="veil__h"><h2>Tools</h2><span>${GLYPH.a} toggle · ${GLYPH.b} back</span></div>
    <div class="veil__b">
      ${TOOLS.map((t) => {
        const on = S.tools[t.id];
        const label = t.cycle ? MOTION
          : t.id === "undo" ? (canUndo() ? `Take back "${UNDO[UNDO.length - 1].label}"` : "Nothing to undo")
          : t.act ? "Do it" : on ? t.on : t.off;
        const lit = t.cycle ? MOTION !== "reduced" : t.id === "undo" ? canUndo() : on;
        return `<div class="toolrow" data-stop="tool:${t.id}" tabindex="0">
          <div class="toolrow__sw">${t.n}
            <i class="${t.act ? (t.danger ? "danger" : "") : lit ? "on" : ""}">${label}</i>
          </div>
          <div class="toolrow__l">${t.line}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function toolPress(id) {
  const m = id.match(/^tool:(\w+)$/);
  if (!m) { S.overlay = null; return render(); }
  const t = TOOLS.find((x) => x.id === m[1]);
  if (t.cycle) {
    MOTION = t.cycle[(t.cycle.indexOf(MOTION) + 1) % t.cycle.length];
    toast(`Animation: ${MOTION}`);
    return render();
  }
  if (t.id === "undo") return undo();
  if (t.id === "concede") { S.overlay = "over"; return render(); }
  S.tools[t.id] = !S.tools[t.id];
  toast(`${t.n}: ${S.tools[t.id] ? t.on : t.off}`);
  render();
}

/* Every question the engine can ask, as a reel. `PromptDialog.tsx`'s switch is
   a DENYLIST, so a kind nobody has thought about yet is modal by default --
   this keeps that property, which means a new decision kind arrives working. */
/* The mulligan blurb has to describe THIS hand, not a hand from a fixture. It
   said "seven cards, three lands" over six cards and no lands -- and no lands
   is the single most interesting thing that could be true about an opening
   hand, so getting it wrong threw away the only argument on the screen. */
function qSub(q) {
  if (q.kind !== "mulligan") return q.sub;
  const lands = HAND.filter((c) => c.t === "land").length;
  const castable = HAND.filter((c) => (parseInt(c.cost) || 0) <= 3).length;
  return lands === 0
    ? `${HAND.length} cards and **no lands**. You would be relying on drawing one.`.replace(/\*\*(.+?)\*\*/g, "$1")
    : `${HAND.length} cards, ${lands} land${lands === 1 ? "" : "s"}, ${castable} of them cheap.`;
}

function qOptions() {
  const q = S.question;
  if (!q) return [];
  // "Keep or mulligan" is a decision about SEVEN CARDS, and drawing it as two
  // word-buttons hides the only thing it is actually about. The cards lead; the
  // two answers are the commit control underneath them.
  if (q.kind === "mulligan") {
    // Deliberately NOT cards. Drawing the two answers as two arbitrary cards
    // out of the hand implies you are choosing between THOSE, which is the
    // opposite of the question -- the hand above is the thing being decided,
    // and the answers are just yes and no.
    const lands = HAND.filter((c) => c.t === "land").length;
    return [
      { id: "keep", label: `Keep these ${HAND.length}`,
        sub: `${lands} land${lands === 1 ? "" : "s"} in hand, and one castable right now` },
      { id: "mull", label: "Mulligan to six",
        sub: "Draw a fresh seven, then put one on the bottom" },
    ];
  }
  if (q.options) return q.options;
  if (q.special === "hand") return HAND.map((c) => ({ id: "d" + c.oid, label: c.n, sub: c.tl, card: c }));
  return DECISION.options;
}

function qCard() {
  const o = qOptions()[S.qi] || {};
  return o.card || null;
}

function questionStep(dir) {
  const q = S.question;
  if (q && q.special === "stepper") {
    if (dir === "left" || dir === "down") S.xVal = Math.max(0, S.xVal - 1);
    if (dir === "right" || dir === "up") S.xVal = Math.min(q.max_count, S.xVal + 1);
    return render();
  }
  const n = qOptions().length;
  if (!n) return;
  const d = dir === "left" || dir === "up" ? -1 : 1;
  S.qi = (S.qi + d + n) % n;
  render();
}

function questionHTML() {
  const q = S.question;
  if (!q) return "";
  S.cur = q.special === "stepper" ? "x" : "qopt";
  const opts = qOptions();
  const stepper = q.special === "stepper";
  return `<div class="veil">
    <div class="veil__h">
      <h2>${q.prompt}</h2>
      <span>${q.kind} · min ${q.min_count} / max ${q.max_count}${q.allow_done ? " · done allowed" : ""}</span>
      <span style="margin-left:auto">${GLYPH.left}${GLYPH.right} choose · <b class="g g--a">A</b> confirm · L1/R1 next kind</span>
    </div>
    <div class="veil__b" style="display:flex;flex-direction:column;gap:10px">
      <p style="margin:0;font-size:var(--fs-body);color:var(--text-dim);max-width:96ch">${textHTML(qSub(q))}</p>
      ${q.kind === "mulligan" ? `<div class="openhand">
        ${HAND.map((c) => `<div class="slot">${faceHTML(c, { tile: true, nameless: true })}</div>`).join("")}
      </div>` : ""}
      <div style="flex:1;min-height:0">
        ${stepper ? stepperHTML(q) : `<div class="reel ${opts.some((o) => o.card) ? "" : "reel--plain"}">
          ${opts.map((o, i) => {
            if (Math.abs(i - S.qi) > 2) return "";
            return `<div class="opt ${i === S.qi ? "opt--on" : ""}" ${i === S.qi ? 'data-stop="qopt" tabindex="0"' : ""}>
              ${o.card ? faceHTML(o.card, { tile: true, nameless: true }) : `<div class="opt__plain"><b>${o.label}</b><span>${textHTML(o.sub || "")}</span></div>`}
              ${o.card ? `<div class="opt__l">${o.label}</div><div class="opt__sub">${textHTML(o.sub || "")}</div>` : ""}
            </div>`;
          }).join("")}
        </div>`}
      </div>
    </div>
  </div>`;
}

function stepperHTML(q) {
  return `<div class="step">
    <div class="step__n" data-stop="x" tabindex="0">${S.xVal}</div>
    <div class="step__r">
      <span class="step__b">−</span>
      <span>${GLYPH.left} ${GLYPH.right}</span>
      <span class="step__b">+</span>
    </div>
    <div class="step__pays">Pays ${costHTML(String(S.xVal) + "GG")} · ${q.max_count - S.xVal} mana left over</div>
    <div class="act act--go" style="min-width:220px;justify-content:center">Cast for X = ${S.xVal} <b class="g g--a">A</b></div>
  </div>`;
}

function answer() {
  const q = S.question;
  const opts = qOptions();
  const chosen = opts[S.qi];

  if (q.kind === "mulligan") {
    S.question = null;
    S.overlay = null;
    if (chosen && chosen.id === "mull") {
      // A mulligan is its own beat: the hand goes away and comes back.
      LOG.push("You mulligan to six");
      toast("Mulligan — seven new cards, one to the bottom");
      Pad.rumble(60, 0.3);
    } else {
      LOG.push("You keep seven");
      toast("Kept. Turn 8, and it is your combat.");
    }
    // The ring starts on the question -- the step is declare-attackers, so it
    // starts on the creatures.
    S.cur = `b:${ME.creatures[0].oid}`;
    return render();
  }

  if (q.special === "stepper") { toast(`X = ${S.xVal}`); }
  else if (chosen) { toast(chosen.label); }
  S.question = null;
  S.overlay = null;
  S.cur = null;
  render();
}

function dossierHTML() {
  const d = DECKS.find((x) => x.id === S.dossier);
  if (!d) return "";

      </div>
    </div></div>

}

    <div class="veil__b"><div class="inv">

}

function importHTML() {
  const r = IMPORT.report;
  const pct = (n) => `${Math.round((n / r.total) * 100)}%`;
  return `<div class="veil">
    <div class="veil__h"><h2>Import from Moxfield</h2><span>${GLYPH.a} ${S.importStep >= 3 ? "add it" : "next"} · ${GLYPH.b} back</span></div>
    <div class="veil__b"><div class="imp">
      <div class="imp__url" data-stop="url" tabindex="0">
        ${S.importStep === 0 ? `<span style="color:var(--text-faint)">Paste a Moxfield deck link…</span>`
          : S.importStep === 1 ? IMPORT.badUrl : IMPORT.url}
        <span class="car" style="margin-left:auto"></span>
      </div>
      ${S.importStep === 1 ? `<div class="imp__err">${IMPORT.badMsg}</div>` : ""}
      ${S.importStep >= 3 ? `
        <div>
          <div style="font-size:var(--fs-lead);font-weight:600">${r.name}</div>
          <div class="dos__tl" style="font-size:var(--fs-min)">${r.ci.map(symHTML).join("")} ${r.total} cards</div>
        </div>
        <div class="imp__bars">
          <i style="flex:${r.playable};background:var(--playable)">${r.playable} playable</i>
          <i style="flex:${r.simplified};background:var(--staged)">${r.simplified} simplified</i>
          <i style="flex:${r.inert};background:var(--danger);color:#2a0b08">${r.inert} inert</i>
        </div>
        <p style="margin:0;font-size:var(--fs-min);color:var(--text-dim);max-width:80ch">
          This engine does not implement every card. ${pct(r.playable)} of this deck plays exactly as printed;
          the rest is simplified or inert, and it is listed before you agree to play it.</p>
        ${r.notes.map((n) => `<div class="imp__note"><b>${n.n}</b><span>${n.why}</span></div>`).join("")}
        <div class="btn btn--go" data-stop="add" tabindex="0" style="max-width:260px;justify-content:center">
          Add to your decks <b class="g g--a">A</b></div>`
        : ""}
      ${S.importStep === 4 ? `<div class="imp__err" style="border-color:var(--playable);background:rgba(92,224,138,.13)">Added under <b>Yours</b>.</div>` : ""}
    </div></div>
  </div>`;
}

function importStep() {
  if (S.importStep === 0) { S.importStep = 1; toast(IMPORT.badMsg); }
  else if (S.importStep === 1) S.importStep = 2;
  else if (S.importStep === 2) S.importStep = 3;
  else if (S.importStep === 3) { S.importStep = 4; toast("Talrand added under Yours"); }
  else { S.overlay = null; S.importStep = 0; }
  render();
}

function overHTML() {
  return `<div class="veil">
    <div class="veil__b"><div class="over">
      <h1>${RESULT.winner} wins</h1>
      <p>${RESULT.line}</p>
      <div class="over__rows">
        ${RESULT.players.map((p) => `<div class="over__row ${p.who === RESULT.winner ? "win" : ""}">
          <b>${p.who}</b><span>${p.how}</span></div>`).join("")}
      </div>
      <div class="home__acts">
        <div class="btn btn--commit" data-stop="rematch" tabindex="0">Rematch <b class="g g--a">A</b></div>
        <div class="btn" data-stop="quit" tabindex="0">Back to the pod</div>
      </div>
    </div></div>
  </div>`;
}

/* R2 expands a seat. 03's stage idea, kept as a HOLD and scoped to the one
   place it is genuinely needed: you cannot read an opponent's board from a
   summary, and a summary is all there is room for at rest. */
function oppBoardHTML() {
  const p = TABLE[S.oppFocus] || OPP;
  const all = lanesOf(p);
  const lanes = OPP_ROWS.flat().map((id) => all.find((l) => l.id === id)).filter((l) => l && l.cards.length);
  return `<div class="veil">
    <div class="veil__h">
      <h2>${p.name}</h2>
      <span>${p.life} life · Lib ${p.lib} · Hand ${p.hand} · GY ${p.gy} · let go of R2</span>
    </div>
    <div class="veil__b" style="display:flex;flex-direction:column;gap:12px;justify-content:center">
      ${lanes.map((l) => `<div class="lane">
        <span class="lane__n" style="width:96px">${l.n}</span>
        ${l.cards.map((c) => `<div class="slot" style="--card-w:132px">${faceHTML(c, { tile: true })}</div>`).join("")}
      </div>`).join("")}
      <div class="lane"><span class="lane__n" style="width:96px">Commander</span>
        <div class="slot" style="--card-w:132px">${faceHTML(p.cmdr, { tile: true })}</div>
        <span class="readp__empty" style="font-size:var(--fs-min);max-width:40ch">${textHTML(p.cmdr.rules || "")}</span>
      </div>
    </div>
  </div>`;
}

/* ===========================================================================
   POINTER, TOUCH AND TRACKPAD -- one path, live on every screen
   ======================================================================== */

const SNAP = 40;

function nearestStop(x, y) {
  let best = null;
  let bestD = SNAP;
  for (const el of stopRoot().querySelectorAll("[data-stop]")) {
    const r = el.getBoundingClientRect();
    const p = deckRect(r);
    const dx = Math.max(p.left - x, 0, x - p.right);
    const dy = Math.max(p.top - y, 0, y - p.bottom);
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; best = el; }
  }
  return best;
}

/** A window rect in Deck coordinates -- the stage is scaled, so a raw
    getBoundingClientRect is in window pixels and the pointer is not. */
function deckRect(r) {
  const el = app.getBoundingClientRect();
  return {
    left: (r.left - el.left) / DECK_SCALE, right: (r.right - el.left) / DECK_SCALE,
    top: (r.top - el.top) / DECK_SCALE, bottom: (r.bottom - el.top) / DECK_SCALE,
  };
}

function onPointer(e, press) {
  const p = deckPoint(e.clientX, e.clientY);
  S.ptr = { x: p.x, y: p.y, live: true, snapped: false };
  const el = nearestStop(p.x, p.y);
  S.ptr.snapped = !!el;
  if (!S.ready) { S.ready = true; render(); }
  if (el && el.dataset.stop !== S.cur) { S.cur = el.dataset.stop; renderCursor(); }
  else paint();
  if (press && el) confirm();
}

addEventListener("keydown", (e) => {
  if (e.key === "?") { S.showKeys = !S.showKeys; render(); }
  if (e.key === "f" || e.key === "F") {
    S.fit = S.fit === "deck" ? "window" : "deck";
    fitDeck();
    render();
  }
});

addEventListener("pointermove", (e) => onPointer(e, false));
addEventListener("pointerdown", (e) => onPointer(e, true));

/* ===========================================================================
   BOOT
   ======================================================================== */

bind();
render();
fitDeck();
</script>
