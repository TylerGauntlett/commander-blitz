name: toolchain
description: >
  Python and the package, and optionally Node, the frontend dependencies and
  Chromium. Six jobs need some subset of the same five steps; this is the one
  copy of them.

inputs:
  node:
    description: "npm ci in frontend/ (the frontend and e2e jobs)"
    default: "false"
  chromium:
    description: "the browser the stories and the e2e suite need"
    default: "false"

runs:
  using: composite
  steps:
    # Unconditional. Every job runs scripts/verify.py, and the e2e jobs need the
    # package importable besides: playwright.config.ts boots uvicorn with the
    # interpreter verify.py hands it as PYTHON.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          constraints.txt

    # Pinned by constraints.txt (scripts/lock_deps.py), so a release that lands
    # overnight cannot change what a re-run tests.
    - run: pip install -c constraints.txt -e ".[dev]"
      shell: bash

    - if: inputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - if: inputs.node == 'true'
      run: npm ci
      shell: bash
      working-directory: frontend

    # ~120MB, identical on every leg, and downloaded seven times per pull
    # request without this. Keyed on the lockfile so a Playwright version bump
    # misses the cache rather than running the new client against the old binary.
    - if: inputs.chromium == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    # Still run on a cache hit: it is a no-op for the binary itself, and the apt
    # dependencies `--with-deps` installs live in the image, not in the cache.
    - if: inputs.chromium == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
      working-directory: frontend
