name: verify and deploy

# Every push to main that passes the full gate and ships is deployed to the
# site and released to the Steam Deck. Pull requests run the same gate and stop
# there. "Passes" includes having nothing to re-prove -- a prose-only change, or
# a squash merge whose tree its pull request already tested -- which the
# `changes` job decides and `gate` still reports. "Ships" is the commit type: a
# `docs:`, `chore:`, `ci:`, `test:` or `style:` merge passes the gate and
# stops there (see `changes`, and .github/scripts/conventional.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit supersedes an in-flight run: deploying an older SHA over a
  # newer one because it happened to finish second is the failure mode here.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/tylergauntlett/commander-blitz # GHCR paths must be lowercase.

# `scripts/verify.py` is still the whole gate and still the thing a developer
# runs; what changed is that its stage groups are dealt out across runners
# instead of being walked end to end twice. `--only` names the slice, `--strict`
# makes a stage that skips itself fail instead, and `gate` below is the one
# check that says whether all of it passed.
jobs:
  # Whether this run has anything to test (TECH_DEBT RS-02). Two kinds of run
  # used to spend their whole length re-proving nothing: a pull request that
  # touched only prose (#52, a TECH_DEBT.md rewrite, took 101 runner-minutes
  # over unchanged code), and the push to main after a squash merge, which
  # re-ran ~41 minutes of lint, python, sim and frontend over the very tree the
  # pull request had just passed -- and held the deploy back while it did.
  #
  # And whether a push to main ships. A squash merge's subject is its pull
  # request's title, which pr.yml holds to a conventional-commit type; `docs`,
  # `chore`, `ci`, `test` and `style` do not reach players, so they neither
  # deploy the site nor cut a Steam Deck release (a release is a full AppImage
  # download on every Deck). The doubt runs the other way from `test` -- any
  # commit in the push that ships, or one that is not conventional at all, or
  # a commit list that cannot be read whole, ships.
  #
  # A job and not `paths-ignore`, because `verify gate` is the required check: a
  # workflow that `paths-ignore` stops from starting never reports it, and the
  # pull request waits on it forever. Here the run always starts, `gate` always
  # judges, and the only thing that changes is whether there was work to judge.
  #
  # Every doubt resolves to "test": an API error, a list of files too long to
  # see whole, a merged tree no pull request run tested as it stands. A
  # wasted half hour is the cost of being wrong in that direction; shipping an
  # untested tree is the cost of being wrong in the other.
  #
  # A sparse checkout of the one script `ship` reads; everything else is in the
  # event and the REST API, and .git is ~130MB.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compare, commits, trees
      pull-requests: read # a pull request's files
      actions: read # earlier runs and their tested-tree artifacts
    outputs:
      test: ${{ steps.decide.outputs.test }}
      tree: ${{ steps.decide.outputs.tree }}
      ship: ${{ steps.ship.outputs.ship }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -uo pipefail # not -e: a failed lookup must fall through to "test"

          # Paths the gate cannot see, so a change to nothing else has nothing
          # to prove. Every entry was checked against what the gate reads:
          # - docs/keywords.md is NOT here: tests/cards/test_keyword_census.py
          #   holds the engine to it. docs/testing.md is only the informational
          #   `test_counts.py --check`, which is `continue-on-error` anyway.
          # - data/authoring/answers is NOT here: test_alternative_cost_permanent
          #   loads card specs from it. packets, gaps and the queue are written
          #   by /author-cards and read by no test (the tests that touch them
          #   point them at tmp_path).
          # - .claude/ is the agent skills; terraform/ is applied by hand. Neither
          #   is linted, tested, or in the image.
          # Anything not listed -- .github/ included -- runs the gate.
          inert() {
            case "$1" in
              docs/keywords.md) return 1 ;;
              docs/* | .claude/* | terraform/*) return 0 ;;
              data/authoring/packets/* | data/authoring/gaps/* | data/authoring/queue.json) return 0 ;;
              data/*/README.md) return 0 ;; # `*` crosses `/` in a case pattern: any depth
            esac
            # Top-level prose: README.md, TECH_DEBT.md.
            [[ "$1" != */* && "$1" == *.md ]]
          }

          # Reads paths, one per line, on stdin. A rename lists both names, so
          # moving code *into* docs/ still counts as touching code.
          all_inert() {
            local f seen=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              seen=1
              inert "$f" || { echo "touches $f"; return 1; }
            done
            [ "$seen" = 1 ] # an empty list is a lookup that failed, not "nothing changed"
          }

          # The tree this run checks out. On a pull request that is the merge
          # ref's (`github.sha` is the test merge, not the head), which is the
          # tree a squash merge lands on main if main has not moved since.
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || tree=""
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          # Proof that this exact tree already passed the full gate, e2e
          # included: `gate` leaves a `tested-tree-<sha>` artifact behind when
          # a pull request run tested and passed. Keyed on the tree, not on a
          # commit or a pull request, because tree equality is the claim that
          # matters -- and the obvious proxy is wrong: #53's squash differed
          # from its head's tree (main had moved), yet its last pull request
          # run had tested exactly the merged tree. The pull request head is
          # not what was tested; the merge ref is.
          tree_tested() {
            local n
            [ -n "$tree" ] || return 1
            n=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not)] | length') || return 1
            [ "${n:-0}" -gt 0 ] || { echo "no pull request run tested tree $tree"; return 1; }
            echo "tree $tree passed a pull request run"
          }

          # A prose-only push inherits its verdict from the commit before it,
          # so that commit's own push run must have passed. Without this a
          # README edit on top of a red main would go green and deploy the
          # code that failed. A run still in flight does not count: it was
          # cancelled by this one (`cancel-in-progress`), so nothing vouches.
          green_on_main() {
            local runs
            runs=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?event=push&branch=main&status=success&head_sha=$1&per_page=1" \
              --jq .total_count) || return 1
            [ "${runs:-0}" -gt 0 ] || { echo "the run on $1 did not pass; nothing to inherit"; return 1; }
          }

          # One file per line as "name<TAB>previous name"; both names are fed
          # to all_inert, and the line count is how many files were listed.
          names() { tr '\t' '\n'; }

          test=true
          case "$EVENT" in
            pull_request)
              # The files endpoint stops at 3,000: a list shorter than the
              # count the event reports is a list that cannot be trusted.
              if rows=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
                   --jq '.[] | [.filename, (.previous_filename // "")] | @tsv'); then
                listed=$(grep -c . <<<"$rows")
                if [ "$listed" -ge "${PR_FILES:-0}" ] && names <<<"$rows" | all_inert; then
                  test=false
                fi
              fi
              ;;
            push)
              # Prose-only first: it needs no pull request to stand behind it,
              # so it covers a direct push as well as a merge. `ahead` rules out
              # a force push, where the three-dot diff starts from a merge base
              # that `before`'s verdict says nothing about. The compare endpoint
              # lists at most 300 files, so at 300 the list may be cut short.
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                && [ "$(gh api "repos/$REPO/compare/$BEFORE...$SHA?per_page=1" --jq .status)" = ahead ] \
                && rows=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                     --jq '.files[] | [.filename, (.previous_filename // "")] | @tsv') \
                && [ "$(grep -c . <<<"$rows")" -lt 300 ] \
                && names <<<"$rows" | all_inert \
                && green_on_main "$BEFORE"; then
                test=false
              elif tree_tested; then
                test=false
              fi
              ;;
            # workflow_dispatch, and anything added later: someone asked for a
            # run, so run it.
          esac
          echo "event=$EVENT test=$test"
          echo "test=$test" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - id: ship
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -uo pipefail
          case "$EVENT" in
            push)
              # The push payload lists at most 20 commits; at 20 it may be cut
              # short, and an unseen commit could be the one that ships.
              n=$(jq 'length' <<<"$COMMITS" 2>/dev/null) || n=""
              if [ -z "$n" ] || [ "$n" -ge 20 ]; then
                ship=true
              else
                ship=$(jq -r '.[].message | split("\n")[0]' <<<"$COMMITS" | bash .github/scripts/conventional.sh ships)
              fi
              ;;
            pull_request) ship=false ;; # nothing ships from a pull request anyway
            *) ship=true ;;             # workflow_dispatch: someone asked for it
          esac
          echo "event=$EVENT ship=$ship"
          echo "ship=$ship" >> "$GITHUB_OUTPUT"

  # The front door, and deliberately cheap. `cancel-in-progress` means a
  # superseded pull request pays for whatever was running: before this split
  # that was one job, and nine concurrent runners would have been ~9x the bill
  # for a push that was already obsolete. ~2 minutes buys that back.
  #
  # The one job that reads `changes`: everything else `needs: lint`, and a job
  # whose `if` has no status function skips when a job it needs was skipped.
  # So "nothing to test" turns the whole gate off from here, in one place.
  lint:
    name: lint and card data
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1 # full history packs to ~395MB (git count-objects -vH); no stage reads it.
      - uses: ./.github/actions/setup
      - run: python scripts/verify.py --only lint --strict --verbose

  python:
    name: python suites + coverage floor
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      # `--coverage` on every event now, not just pull requests: sysmon (which
      # the 3.13 bump bought) makes the floors nearly free, so a push to main
      # holds them too. `--jobs 2` is the runner's core count.
      - run: python scripts/verify.py --only pytest --coverage --jobs 2 --strict --verbose
      # Informational, as in verify.py: a stale count in docs/testing.md is a doc
      # bug, not a build break -- but no `--only` slice ever ran it (SD-01).
      - run: python scripts/test_counts.py --check --no-frontend
        continue-on-error: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          if-no-files-found: ignore
          retention-days: 3
          path: .coverage

  # The two stages that play whole games. No Node at all -- this job never
  # touches frontend/ -- which is why `--only sim` must not probe for it.
  sim:
    name: arena and live server
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: python scripts/verify.py --only sim --strict --verbose

  frontend:
    name: frontend, stories and coverage floors
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          chromium: "true" # the coverage stage runs both story projects in a real browser
          desktop: "true" # the desktop shell's lint, build and unit tests are in this group
      - run: python scripts/verify.py --only frontend --coverage --strict --verbose
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          if-no-files-found: ignore
          retention-days: 3
          path: frontend/coverage

  # Pull requests only, as before: ~30 minutes of browser that a push to main
  # should not wait on, having already run it on the pull request that became
  # the merge. Sharded across runners rather than parallelised on one, because
  # `workers` must stay at 1 -- see run_e2e_stage in scripts/verify.py.
  e2e:
    name: playwright ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard's failure must not hide the rest: the verdict worth having is
      # which specs failed, not which shard reached the failure first.
      fail-fast: false
      matrix:
        # Five, not four. Playwright balances shards by test COUNT and keeps a
        # file's tests together, and the big specs (pod, cycle3, action-panel)
        # are lumpy enough that `--shard=i/4` leaves one leg carrying 42 of the
        # 125 tests -- exactly what `i/3` leaves it carrying, so the fourth
        # runner buys nothing at all. Measured with `--list`, per leg:
        #   n=3: 42 42 41    n=4: 42 26 40 17    n=5: 28 25 31 24 17
        # Five puts the longest leg at 31, which is about what the `python` job
        # takes, and that is the floor worth aiming at -- below it the pull
        # request waits on something else anyway.
        #
        # `shards: 1` on the small projects rather than omitting it, so the run
        # command, the report name and the artifact name are one shape
        # everywhere. Playwright accepts --shard=1/1.
        include:
          - { project: chromium, shard: 1, shards: 5 }
          - { project: chromium, shard: 2, shards: 5 }
          - { project: chromium, shard: 3, shards: 5 }
          - { project: chromium, shard: 4, shards: 5 }
          - { project: chromium, shard: 5, shards: 5 }
          - { project: handheld, shard: 1, shards: 1 }
          - { project: deckfit, shard: 1, shards: 1 }
          # The desktop build: the sidecar serving `dist/`, offline. Its own
          # config, and `verify.py` builds the client first (~1 min extra).
          - { project: sidecar, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          chromium: "true"
      - run: >
          python scripts/verify.py --only e2e
          --e2e-project ${{ matrix.project }}
          --e2e-shard ${{ matrix.shard }}/${{ matrix.shards }}
          --strict --verbose
      # Failures only, and short-lived: traces and videos are for debugging a red
      # run, and every green run's upload used to sit for the 90-day default
      # until the repo hit its Actions storage quota. The name must be unique per
      # leg -- v4 rejects a duplicate -- and may not contain a slash.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.shards }}
          if-no-files-found: ignore
          retention-days: 3
          path: frontend/test-results

  # The Steam Deck install script, against a stub Steam in a scratch home. A
  # minute of bash and python on a bare runner: no Node, no package install.
  installer:
    name: install.sh
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - run: bash desktop/steam/test/install.test.sh

  # The one check that means "the gate passed", and the only one `build` needs.
  gate:
    name: verify gate
    # `always()`, not `!cancelled()`: a skipped job counts as *passing* to branch
    # protection, so this must run and judge even when an upstream job was
    # cancelled -- otherwise a cancelled run is indistinguishable from a green one.
    if: always()
    needs: [changes, lint, python, sim, frontend, installer, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job is green
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.changes.outputs.test }}
          LINT: ${{ needs.lint.result }}
          PY: ${{ needs.python.result }}
          SIM: ${{ needs.sim.result }}
          FE: ${{ needs.frontend.result }}
          INST: ${{ needs.installer.result }}
          E2E: ${{ needs.e2e.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES test=$TEST lint=$LINT python=$PY sim=$SIM frontend=$FE installer=$INST e2e=$E2E event=$EVENT"
          # `changes` decides whether a skip below is correct, so its own
          # failure is red: with no verdict there is no telling a deliberate
          # skip from a job that never got to run.
          [ "$CHANGES" = success ] || { echo "changes reported $CHANGES"; exit 1; }
          fail=0
          if [ "$TEST" != true ]; then
            # Nothing to test (see `changes`): every job must have stood down,
            # and anything else -- a job that ran anyway -- is a wiring fault.
            for pair in "lint:$LINT" "python:$PY" "sim:$SIM" "frontend:$FE" "installer:$INST" "e2e:$E2E"; do
              [ "${pair#*:}" = skipped ] || { echo "${pair%%:*} reported ${pair#*:} with nothing to test"; fail=1; }
            done
            exit $fail
          fi
          # Compared against the literal "success", so cancelled, failure and an
          # unexpected skip are all red. `needs.e2e.result` is already the
          # aggregate over the matrix: one bad shard fails it.
          for pair in "lint:$LINT" "python:$PY" "sim:$SIM" "frontend:$FE" "installer:$INST"; do
            [ "${pair#*:}" = success ] || { echo "${pair%%:*} reported ${pair#*:}"; fail=1; }
          done
          # e2e is pull-request-only, so a skip is correct there and only there.
          if [ "$EVENT" = pull_request ] && [ "$E2E" != success ]; then
            echo "e2e reported $E2E"; fail=1
          elif [ "$EVENT" != pull_request ] && [ "$E2E" != skipped ]; then
            echo "e2e should not have run on $EVENT (reported $E2E)"; fail=1
          fi
          exit $fail

      # The receipt `changes` looks for on the push after a merge: this tree
      # passed everything, e2e included. Pull requests only, since a push
      # never runs e2e, and only when the gate really ran -- a prose-only pass
      # tested nothing and must not vouch for anything. The file's content is
      # for a human; the name is what is searched. Tiny, and 14 days covers a
      # pull request that sits green for a while before merging; one that sits
      # longer just re-tests on main. `continue-on-error` because a missing
      # receipt costs one re-test, which is no reason to fail the gate.
      - if: >-
          github.event_name == 'pull_request'
          && needs.changes.outputs.test == 'true'
          && needs.changes.outputs.tree != ''
        continue-on-error: true
        run: echo "$GITHUB_SHA passed run $GITHUB_RUN_ID" > tested-tree.txt
      - if: >-
          github.event_name == 'pull_request'
          && needs.changes.outputs.test == 'true'
          && needs.changes.outputs.tree != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ needs.changes.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
          # A re-run of a passed gate on the same tree uploads the same name.
          overwrite: true

  build:
    name: build and push image
    needs: [changes, gate]
    # `!cancelled()` and an explicit `needs.gate.result` are load-bearing, not
    # belt-and-braces. An `if` with no status-check function in it gets the
    # implicit "every job I depend on succeeded" -- and that is evaluated over the
    # whole dependency *closure*, not just `needs`. `e2e` is pull-request-only, so
    # on a push to main it is skipped; `gate` rides that out because it is
    # `always()`, but the skip is still in `build`'s closure and skipped `build`
    # with it. Silently: the run went green with nothing deployed, and main sat
    # undeployed from 4e9e30d4 (2026-09-17) until this, which is how a fix that
    # was merged and passing could still be broken on the live site.
    #
    # Naming `gate` explicitly is what keeps this honest: the closure check is
    # gone, so the one result that must be green has to be asserted rather than
    # assumed.
    if: >-
      !cancelled()
      && needs.gate.result == 'success'
      && needs.changes.outputs.ship == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Compute image tag
        id: tag
        # An immutable per-commit tag is what makes rollback a one-line edit on
        # the droplet. `latest` moves; this does not.
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Injected; nothing to configure.

      - uses: docker/build-push-action@v7
        env:
          # Otherwise every push leaves a .dockerbuild record artifact behind.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
          # Without this the ~90MB data layer and the npm install are rebuilt
          # from scratch on every single push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to droplet
    needs: build
    # Same shape for the same reason: `e2e`'s skip is in this job's closure too,
    # by way of `build` and `gate`. See the note on `build`.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets the droplet pull using this run's GITHUB_TOKEN rather than a
      # long-lived PAT. The package was pushed by the build job with the same
      # token, so it is linked to this repo and readable here. The credential
      # expires with the run, so nothing durable sits on the box or in secrets.
      packages: read
    # No `url:` here. GitHub does not expose the `secrets` context to
    # `environment.url`, and referencing it there is a startup failure that
    # rejects the whole workflow before a single job runs.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Both ship with the repo rather than living only on the droplet, so a
      # change to either is reviewed and versioned like anything else.
      - name: Copy compose file and Caddyfile
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Comma-separated, not a YAML list: drone-scp splits this string on
          # commas, and a newline-separated block reaches it as one impossible
          # filename, which surfaces as "tar: Cowardly refusing to create an
          # empty archive" rather than as a missing-file error.
          source: "docker-compose.yml,Caddyfile"
          target: /opt/automtg

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,IMAGE_NAME
          script_stop: true
          script: |
            # Explicit, rather than relying on script_stop: a registry denial
            # was observed to leave `docker compose pull` exiting 0, and the
            # step went green having deployed nothing at all.
            set -euo pipefail

            # First deploy after `terraform apply` can land while cloud-init is
            # still installing Docker.
            for _ in $(seq 1 60); do
              [ -f /opt/automtg/.bootstrap-complete ] && break
              echo "waiting for cloud-init to finish..."
              sleep 10
            done
            [ -f /opt/automtg/.bootstrap-complete ] || { echo "bootstrap never completed"; exit 1; }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/automtg
            # The single source of truth for what is running, and the thing you
            # edit to roll back.
            echo "IMAGE_TAG=$IMAGE_TAG" > .env
            docker compose pull

            # Assert the image is really here. This is the check that would have
            # caught the silent pull failure, and it cannot itself pass vacuously.
            docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null \
              || { echo "pull reported success but $IMAGE_NAME:$IMAGE_TAG is not present"; exit 1; }

            docker compose up -d --remove-orphans

            # A bind-mounted file changing does not make compose recreate the
            # container, so without this an edited Caddyfile would be copied up
            # and then quietly ignored. `reload` is graceful -- no dropped
            # connections -- and is redundant on a container that just started
            # with the new file, which is exactly when it fails: the admin API
            # it posts to is not listening for the first second or two.
            reloaded=""
            for _ in $(seq 1 10); do
              if docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
                reloaded=yes
                break
              fi
              sleep 2
            done
            [ -n "$reloaded" ] \
              || echo "caddy reload never succeeded; the health check below is the real gate"

            docker logout ghcr.io

            # Same reasoning one level up: prove a container is actually running
            # before handing off to the health check.
            #
            # Captured into a variable rather than piped into `grep -q`, which
            # is what the previous form did and why a successful deploy failed
            # on its own proof: grep exits at the first match, `docker compose
            # ps` takes SIGPIPE and exits 141, and `pipefail` reports the
            # pipeline as failed. One container wrote too little to lose that
            # race; two containers write enough to lose it most times.
            #
            # Polled because compose can also answer empty for a second or two
            # after `up -d` while the containers settle.
            running=""
            for _ in $(seq 1 15); do
              running=$(docker compose ps --status running --quiet)
              [ -n "$running" ] && break
              sleep 2
            done
            [ -n "$running" ] \
              || { echo "no running container after up -d"; docker compose logs --tail=50; exit 1; }

      - name: Wait for health
        # The deploy is not "done" because the SSH step exited zero -- it is done
        # when the new container answers. --retry-connrefused covers the gap
        # while uvicorn boots and loads the card pool, and --retry-all-errors
        # additionally covers the TLS handshake failing while Caddy is still
        # obtaining its certificate on the first HTTPS deploy.
        #
        # Deliberately the domain rather than DROPLET_HOST: Caddy serves that
        # name only, so this proves DNS and TLS as well as uvicorn having
        # booted. The domain is public, so it is hardcoded, not a secret.
        run: |
          curl -fsS --max-time 10 \
            --retry 30 --retry-delay 5 --retry-connrefused --retry-all-errors \
            "https://commanderblitz.com/health" | tee /dev/stderr | grep -q '"status":"ok"'

  # The Steam Deck release: the AppImage and the content package, versioned
  # `X.Y.<commits on main>` and published as this repository's latest release.
  # Beside the site deploy rather than after it -- a Deck does not care whether
  # the droplet came up -- and gated exactly as `build` is, for the same
  # reasons. release.yml has the details.
  release:
    name: steam deck release
    needs: [changes, gate]
    if: >-
      !cancelled()
      && needs.gate.result == 'success'
      && needs.changes.outputs.ship == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: write # create the release and its tag
    uses: ./.github/workflows/release.yml

  # The invariant the skip above violated in silence: a green gate on main means
  # the droplet is running that commit. Nothing checked it, so three pushes
  # reported success while `build` and `deploy` sat skipped, and the live site
  # served a two-day-old image with a merged bug fix missing from it.
  #
  # Asserted from outside the deploy chain rather than inside it, because the
  # failure being caught is precisely a job *not running*: a step can only speak
  # when its job does. `!cancelled()` for the reason `build` needs it -- this job
  # depends on the same skipped `e2e` closure and would skip itself otherwise,
  # which is the failure mode wearing the check's own clothes.
  deployed:
    name: main is deployed
    needs: [changes, gate, deploy, release]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A green gate on main must have deployed and released
        env:
          GATE: ${{ needs.gate.result }}
          SHIP: ${{ needs.changes.outputs.ship }}
          DEPLOY: ${{ needs.deploy.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          echo "gate=$GATE ship=$SHIP deploy=$DEPLOY release=$RELEASE"
          # A red gate is already a red run and deploy is *meant* to be skipped;
          # saying so twice would only bury the real failure.
          if [ "$GATE" != success ]; then
            echo "gate reported $GATE -- deploy and release correctly skipped"
            exit 0
          fi
          # A push that does not ship must have shipped nothing; anything else
          # is the wiring, not the verdict, going wrong.
          if [ "$SHIP" != true ]; then
            [ "$DEPLOY" = skipped ] && [ "$RELEASE" = skipped ] || {
              echo "nothing in this push ships, yet deploy=$DEPLOY release=$RELEASE"
              exit 1
            }
            echo "nothing in this push ships (docs/chore/ci/test/style) -- the site and the Deck stay as they are"
            exit 0
          fi
          fail=0
          [ "$DEPLOY" = success ] || { echo "gate passed but deploy reported $DEPLOY: main is NOT live"; fail=1; }
          [ "$RELEASE" = success ] || { echo "gate passed but release reported $RELEASE: the Deck is NOT current"; fail=1; }
          exit $fail
