name: desktop release

# Builds the Steam Deck AppImage and the content package and publishes both as
# a GitHub Release of this repository. Every push to main that passes the gate
# and ships calls this from deploy.yml (ADR 0010); `workflow_dispatch` is for
# releasing main by hand, after a merge that did not ship (`docs:`, `chore:`...)
# or a release that failed. Nothing here is a test of the code -- the gate is --
# so it never runs on a pull request.
#
# The version is `X.Y.<commits on main>`: major and minor are whatever
# `desktop/package.json` says, set by hand; the patch is CI's. Squash merges
# keep main linear, so the count only ever grows, and the same commit always
# gets the same version -- a re-run finds its release already there and stops.
# electron-updater and the content updater both move only to a strictly higher
# version, so that growth is the whole update mechanism.
#
# Every release has a new content package; only a release whose shell changed
# has a new AppImage. Otherwise the last AppImage is carried forward as it was,
# and the content says it runs on that shell (`min_shell_version`), so a Deck
# downloads the tarball rather than the whole app. See the `shell` step.
#
# Everything a Deck fetches is a `releases/latest/download/<file>` URL: no API,
# no token, no rate limit. The repository is public, so the assets are too,
# and the workflow's own GITHUB_TOKEN is enough to publish them.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # The version, and whether there is anything to do with it.
  version:
    name: version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      shell: ${{ steps.shell.outputs.shell }}
      min_shell: ${{ steps.shell.outputs.min_shell }}
      previous: ${{ steps.shell.outputs.previous }}
    steps:
      # Every commit, no trees or blobs: enough to count, a fraction of the
      # ~395MB full pack.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(git show HEAD:desktop/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version.split('.').slice(0, 2).join('.')")"
          v="$base.$(git rev-list --count HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          skip=false
          # Already published: a re-run of the same commit. A draft left behind
          # by a cancelled run does not count; `publish` replaces it.
          if draft="$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" \
            && [ "$draft" = false ]; then
            echo "v$v is already released"; skip=true
          fi
          # Never put an older commit over a newer one: `latest` is what every
          # Deck reads, and the updaters will not step back down from it anyway.
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          latest="${latest#v}"
          if [ "$skip" = false ] && [ -n "$latest" ] \
            && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)" = "$latest" ]; then
            echo "v$v is not newer than the latest release v$latest"; skip=true
          fi
          echo "version=$v latest=${latest:-none} skip=$skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Whether the AppImage has to be rebuilt, or the latest release's can be
      # carried forward with only the content package new. Most merges change
      # cards, the engine or the client -- all content -- and a new shell
      # makes every Deck download the whole AppImage again, where new content
      # is just the tarball. The content updater already does that; it only
      # needs `min_shell_version` to say the shell it really needs, rather than
      # this release's version, which no installed shell could ever satisfy.
      #
      # The shell is what electron-builder packs (electron-builder.yml
      # `files`), what builds it, and this workflow. The sidecar, the client
      # and the data are content. Every doubt rebuilds: no release to carry,
      # a compare that fails or is cut short, or a `latest-linux.yml` that
      # will not say its version.
      - id: shell
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail # not -e: a failed lookup must fall through to "rebuild"
          rebuild() {
            echo "shell=true" >> "$GITHUB_OUTPUT"
            echo "min_shell=$V" >> "$GITHUB_OUTPUT"
            echo "shell: rebuild ($1)"
            exit 0
          }
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || rebuild "no release to carry"
          info=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag...$GITHUB_SHA" \
            --jq '.status, (.files | length), .files[].filename') || rebuild "compare $tag failed"
          { read -r status; read -r count; } <<<"$info"
          [ "$status" = ahead ] || rebuild "$tag is $status of this commit"
          # The compare endpoint lists at most 300 files.
          [ "$count" -lt 300 ] || rebuild "$count files changed; the list may be cut short"
          changed=$(tail -n +3 <<<"$info" | grep -E '^(desktop/(src/|build-resources/|package(-lock)?\.json$|build\.mjs$|electron-builder\.yml$|tsconfig\.json$|splash\.html$)|\.github/workflows/release\.yml$)' | head -5)
          [ -z "$changed" ] || rebuild "the shell changed: $(tr '\n' ' ' <<<"$changed")"
          shell=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p latest-linux.yml -O - \
            | sed -n 's/^version: *//p' | tr -d "'\"\r") || shell=""
          [ -n "$shell" ] || rebuild "$tag's latest-linux.yml has no version"
          echo "shell=false" >> "$GITHUB_OUTPUT"
          echo "min_shell=$shell" >> "$GITHUB_OUTPUT"
          echo "previous=$tag" >> "$GITHUB_OUTPUT"
          echo "shell: carry $tag's AppImage ($shell) forward; content only"

  # The content package: the frozen server (built in a container, for glibc),
  # the built client, and the card data, tarred with its manifest.
  content:
    name: content package
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          desktop: "true"
      # Stamped before anything reads it, so the manifest's `app_version` and
      # `min_shell_version` say the release's version, as the shell will.
      - run: node -e "const f='desktop/package.json',p=require('./'+f);p.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "${{ needs.version.outputs.version }}"
      - run: npm run build
        working-directory: frontend
      # Through `bash`, not by mode bit: the scripts are committed from
      # Windows, and the first release died on `Permission denied` when the
      # bit was missing. The bit is set too, for anybody running them by hand.
      - run: bash desktop/sidecar/build.sh
      - run: PYTHON=python bash desktop/sidecar/smoke.sh
      # `--min-shell`: the shell this content really needs (see `version`).
      - run: >
          node scripts/assemble-content.mjs --version ${{ needs.version.outputs.version }}
          --min-shell ${{ needs.version.outputs.min_shell }}
          --server sidecar/build/server/commanderblitz-server
          --client ../frontend/dist --data ../data --tar
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: content
          retention-days: 3
          path: |
            desktop/build/content
            desktop/build/content-*.tar.gz
            desktop/build/content-latest.json

  # The AppImage, with the content package inside it as the bundled content.
  # Only when the shell changed: otherwise `publish` carries the last one.
  shell:
    name: appimage
    needs: [version, content]
    if: needs.version.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          desktop: "true"
      # The same stamp: electron-builder names the AppImage, writes
      # `latest-linux.yml` and bakes `app.getVersion()` from it.
      - run: node -e "const f='desktop/package.json',p=require('./'+f);p.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "${{ needs.version.outputs.version }}"
      - uses: actions/download-artifact@v8
        with:
          name: content
          path: desktop/build
      # The assembler copies PyInstaller's directory to `content/server/`, so
      # the binary is `server/commanderblitz-server` with `_internal/` beside
      # it -- the path the shell starts. Artifacts do not keep the mode bit.
      - run: chmod +x build/content/server/commanderblitz-server
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npx electron-builder --linux AppImage --publish never
        working-directory: desktop
      # The one proof the packaged artifact runs end to end: boot the sidecar
      # from inside the AppImage and read /api/config. No FUSE on a runner,
      # hence `--appimage-extract-and-run`; no display, hence xvfb.
      # `timeout`: an uncaught exception at startup puts up Electron's error
      # dialog, which under xvfb nobody can dismiss, and the first AppImage
      # sat on one until the job's own timeout. Five minutes is generous for
      # a boot that takes seconds.
      - run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          app="$(ls release/CommanderBlitz-*.AppImage)"
          chmod +x "$app"
          COMMANDERBLITZ_HOME="$(mktemp -d)" timeout 300 xvfb-run -a "$app" --appimage-extract-and-run --no-sandbox --smoke
        working-directory: desktop
      - run: bash desktop/steam/test/install.test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          retention-days: 3
          path: |
            desktop/release/CommanderBlitz-*.AppImage
            desktop/release/latest-linux.yml

  # Draft first, then publish: a newer push to main cancels this run
  # (deploy.yml's `cancel-in-progress`), and a cancel halfway through the
  # uploads must not leave a `latest` release with assets missing -- every
  # Deck's updater and every new install would 404 on it. A draft is invisible
  # to `releases/latest`; only the last step makes it real.
  publish:
    name: publish the release
    needs: [version, content, shell]
    # `shell` is skipped, not failed, when the AppImage is carried forward.
    if: >-
      !cancelled()
      && needs.content.result == 'success'
      && (needs.shell.result == 'success' || (needs.shell.result == 'skipped' && needs.version.outputs.shell == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release, its tag and its assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: content
          path: out/content
      # The AppImage and its `latest-linux.yml` land flat in out/appimage
      # either way: built by `shell` (an artifact keeps paths below the files'
      # common directory, desktop/release/), or the latest release's own,
      # unchanged. Carried, `latest-linux.yml` still names the old version, so
      # electron-updater on a Deck sees nothing new and only the content
      # updater moves; a fresh install boots the carried AppImage's bundled
      # content and the updater replaces it on its first check.
      - if: needs.version.outputs.shell == 'true'
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: out/appimage
      - if: needs.version.outputs.shell == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: >
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir out/appimage
          --pattern 'CommanderBlitz-*.AppImage' --pattern latest-linux.yml
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A tar of two committed paths: cheaper made here than carried.
          tar czf out/steam-assets.tar.gz -C desktop/steam grid commanderblitz.desktop
          find out -type f | sort
          cp desktop/steam/install.sh out/install.sh
          (cd out && sha256sum appimage/CommanderBlitz-*.AppImage content/content-*.tar.gz | sed -E 's#^([a-f0-9]+)  .*/#\1  #' > SHA256SUMS)
          # A draft a cancelled run left behind holds the tag name; clear it.
          if [ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes
          fi
          notes="$(printf 'Commander Blitz %s for Steam Deck.\n\nInstall (Desktop Mode, Konsole):\n\n    curl -fsSL https://github.com/%s/releases/latest/download/install.sh | bash\n' "$V" "$GITHUB_REPOSITORY")"
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Commander Blitz $V" --notes "$notes" --generate-notes \
            out/appimage/CommanderBlitz-*.AppImage \
            out/appimage/latest-linux.yml \
            out/steam-assets.tar.gz \
            out/content/content-*.tar.gz \
            out/content/content-latest.json \
            out/install.sh \
            out/SHA256SUMS
          gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
