name: debug handheld e2e (temporary)

# TEMPORARY: the handheld Playwright project alone, with its traces kept, so
# a failure that only happens on a Linux runner can be read. Delete with the
# fix it was written for.
on:
  push:
    branches: [fix/multiplayer-long-poll]
  workflow_dispatch:

jobs:
  handheld:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: handheld project, traces on
        working-directory: frontend
        env:
          E2E_SLOW: "2"
          CI: "1"
          PYTHON: python
        run: npx playwright test --project=handheld --reporter=list --trace on --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handheld-traces
          path: frontend/test-results
