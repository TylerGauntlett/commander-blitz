name: secrets

# Gitleaks over the commits a pull request adds (and over a push to main),
# with `.gitleaks.toml` at the root. Its own workflow rather than a job in the
# gate: it needs the history the gate's jobs deliberately do not fetch, and it
# is cheap enough (under a minute) to run even when `changes` decides there is
# nothing to test.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # the action lists the pull request's commits to scan

# A newer push scans everything the older one would have, and more.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pull request's scan is its own commits, the parent of the first
      # (the range starts at `first^`) and the test merge on top: commits + 2
      # deep, rather than the whole ~395MB history on every push. A push to
      # main keeps the full history; it is one run per merge. A step, because
      # expressions have no arithmetic.
      - id: depth
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ -n "$COMMITS" ]; then echo "value=$((COMMITS + 2))"; else echo "value=0"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ steps.depth.outputs.value }}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
