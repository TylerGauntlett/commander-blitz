name: debug catalogue probe (temporary)

# TEMPORARY: one probe spec, six times, traces on. Delete with the fix.
on:
  push:
    branches: [fix/multiplayer-long-poll]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: the probe, six times
        working-directory: frontend
        env:
          E2E_SLOW: "2"
          CI: "1"
          PYTHON: python
        run: npx playwright test --project=chromium e2e/_probe.spec.ts e2e/pod.spec.ts -g "probe|puts the ring back" --repeat-each=6 --retries=0 --reporter=list --trace on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-traces
          path: frontend/test-results
