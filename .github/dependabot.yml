# Monthly and grouped: every merge of a runtime dependency is a Steam Deck
# release that every Deck downloads whole (ADR 0010), so one PR per ecosystem
# per month rather than one per package. Security updates are not subject to
# the schedule.
#
# The prefixes make the titles conventional commits (pr.yml): a runtime bump is
# `fix(deps)` and ships; an Actions bump is `ci(deps)` and does not.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      python:
        patterns: ["*"]
    # pydantic pins pydantic-core exactly, but constraints.txt lists core as
    # its own line, so Dependabot bumps it alone into an unresolvable lock.
    # Core moves only with pydantic, via scripts/lock_deps.py.
    ignore:
      - dependency-name: pydantic-core
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      desktop:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
