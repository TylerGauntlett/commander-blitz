# Monthly and grouped: every pull request costs CI minutes, which are the
# project's tightest budget, so one PR per ecosystem per month rather than one
# per package. Security updates are not subject to the schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
    groups:
      desktop:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
